<!DOCTYPE html>
<html lang="gu">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Expiring Soon - RV Vehicle Reminder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  margin:0;
  color:#172033;
}

.header{
  background:linear-gradient(135deg,#dc2626,#f97316);
  color:white;
  padding:22px;
  border-radius:0 0 25px 25px;
}

.header h2{
  margin:0 0 6px;
}

.header p{
  margin:0;
  opacity:.9;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:18px;
  border-radius:18px;
  margin-bottom:16px;
  box-shadow:0 4px 15px #dce5f0;
}

.title{
  font-size:20px;
  font-weight:bold;
  color:#dc2626;
  margin-bottom:14px;
}

.customer-box{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
  line-height:1.7;
}

.alert{
  padding:12px;
  border-radius:10px;
  margin-top:8px;
  background:#fff7ed;
  color:#c2410c;
  font-weight:bold;
}

.expired{
  background:#fee2e2;
  color:#b91c1c;
}

.reminder-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:11px;
  margin-top:15px;
  background:#16a34a;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.back-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:11px;
  margin-top:15px;
  background:#64748b;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.empty{
  text-align:center;
  background:white;
  padding:30px;
  border-radius:18px;
  color:#687386;
}

.loading{
  text-align:center;
  background:white;
  padding:30px;
  border-radius:18px;
  color:#687386;
}

.error{
  text-align:center;
  background:#fee2e2;
  padding:20px;
  border-radius:15px;
  color:#b91c1c;
}

</style>

</head>

<body>

<div class="header">

  <h2>🔴 Expiring Soon</h2>

  <p>
    આવતા 10 દિવસમાં Expiry થનારા Documents
  </p>

</div>


<div class="container">

  <div id="list">

    <div class="loading">
      ⏳ Loading...
    </div>

  </div>


  <button
    class="back-btn"
    onclick="history.back()"
  >
    ⬅️ Back
  </button>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://lqbhafspabtlqeubqxjg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   ADVISOR DETAILS
===================================================== */

const ADVISOR_NAME =
"સહકાર ઓટો એડવાઇઝર";

const ADVISOR_PERSON =
"રમીઝભાઈ મેમણ";

const ADVISOR_ADDRESS =
"એ.પી.એમ.સી. માર્કેટ યાર્ડ, નસવાડી";


/* =====================================================
   DOCUMENT FIELDS
===================================================== */

const fields = [

  {
    key:"fitness_expiry",
    name:"ફિટનેસ"
  },

  {
    key:"insurance_expiry",
    name:"ઇન્શ્યોરન્સ"
  },

  {
    key:"tax_expiry",
    name:"ટેક્સ"
  },

  {
    key:"pucc_expiry",
    name:"PUCC"
  },

  {
    key:"permit_expiry",
    name:"પરમિટ"
  }

];


/* =====================================================
   VEHICLE DATA
===================================================== */

let vehiclesData = {};


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(date){

  if(!date){
    return "";
  }

  const d =
    new Date(
      date + "T00:00:00"
    );

  if(
    isNaN(
      d.getTime()
    )
  ){
    return date;
  }

  const day =
    String(
      d.getDate()
    ).padStart(2,"0");

  const month =
    String(
      d.getMonth()+1
    ).padStart(2,"0");

  const year =
    d.getFullYear();

  return (
    day +
    "/" +
    month +
    "/" +
    year
  );
}


/* =====================================================
   DAYS
===================================================== */

function getDays(date){

  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );

  const expiry =
    new Date(
      date + "T00:00:00"
    );

  return Math.ceil(
    (
      expiry - today
    ) /
    (
      1000 *
      60 *
      60 *
      24
    )
  );
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );
}


/* =====================================================
   GET CUSTOMER MOBILE
===================================================== */

function getCustomerMobile(vehicle){

  /*
     Primary:
     customer_mobile

     Fallback:
     mobile
  */

  const number =
    String(
      vehicle.customer_mobile ||
      vehicle.mobile ||
      ""
    ).trim();

  return number;
}


/* =====================================================
   CLEAN MOBILE NUMBER
===================================================== */

function cleanMobileNumber(number){

  let phone =
    String(
      number || ""
    )
    .replace(
      /[^0-9]/g,
      ""
    );


  /*
     India 10 digit number
  */

  if(
    phone.length === 10
  ){

    phone =
      "91" +
      phone;

  }


  /*
     Already 91 + 10 digits
  */

  return phone;
}


/* =====================================================
   CREATE WHATSAPP MESSAGE
===================================================== */

function createReminder(
  vehicle,
  alerts
){

  const customerName =
    String(
      vehicle.customer_name ||
      ""
    ).trim();


  const customerMobile =
    getCustomerMobile(
      vehicle
    );


  let message = "";


  message +=
    ADVISOR_NAME +
    "\n";

  message +=
    ADVISOR_PERSON +
    "\n";

  message +=
    ADVISOR_ADDRESS +
    "\n\n";


  message +=
    "તમારી ગાડી\n";


  message +=
    "વાહન નંબર: " +
    (
      vehicle.vehicle_number ||
      ""
    ) +
    "\nનું\n\n";


  /*
     ONLY EXPIRING DOCUMENTS
  */

  alerts.forEach(
    function(alert){

      if(
        alert.days < 0
      ){

        message +=
          "❌ " +
          alert.name +
          ": " +
          formatDate(
            alert.date
          ) +
          " ના રોજ પૂર્ણ થઈ ગયું છે\n\n";

      }
      else if(
        alert.days === 0
      ){

        message +=
          "⚠️ " +
          alert.name +
          ": આજે " +
          formatDate(
            alert.date
          ) +
          " ના રોજ પૂરું થાય છે\n\n";

      }
      else{

        message +=
          "⚠️ " +
          alert.name +
          ": " +
          formatDate(
            alert.date
          ) +
          " ના રોજ પૂરું થાય છે\n\n";

      }

    }
  );


  message +=
    "સંપર્ક કરો:\n";


  message +=
    (
      customerName ||
      ADVISOR_PERSON
    ) +
    "\n";


  message +=
    ADVISOR_ADDRESS +
    "\n";


  message +=
    "મોબાઇલ નંબર: " +
    customerMobile;


  return message;
}


/* =====================================================
   SEND WHATSAPP REMINDER
===================================================== */

function sendReminder(id){

  const vehicle =
    vehiclesData[id];


  if(!vehicle){

    alert(
      "Vehicle data not found."
    );

    return;
  }


  const customerMobile =
    getCustomerMobile(
      vehicle
    );


  /*
     MOBILE CHECK
  */

  if(!customerMobile){

    alert(
      "Mobile number is not available for this vehicle."
    );

    return;
  }


  /*
     GET EXPIRING DOCUMENTS AGAIN
  */

  const alerts = [];


  fields.forEach(
    function(field){

      const date =
        vehicle[field.key];


      if(!date){
        return;
      }


      /*
         LTT is NOT an expiry date
      */

      if(
        field.key ===
        "tax_expiry" &&
        String(date)
          .trim()
          .toUpperCase() ===
        "LTT"
      ){

        return;
      }


      const days =
        getDays(date);


      if(
        days <= 10
      ){

        alerts.push({

          name:
            field.name,

          date:
            date,

          days:
            days

        });

      }

    }
  );


  if(
    alerts.length === 0
  ){

    alert(
      "આગામી 10 દિવસમાં કોઈ દસ્તાવેજની મુદત પૂર્ણ થતી નથી."
    );

    return;
  }


  /*
     CREATE MESSAGE
  */

  const message =
    createReminder(
      vehicle,
      alerts
    );


  /*
     CLEAN PHONE
  */

  const phone =
    cleanMobileNumber(
      customerMobile
    );


  if(
    phone.length < 12
  ){

    alert(
      "કૃપા કરીને Customer Mobile Number સાચો નાખો."
    );

    return;
  }


  /*
     WHATSAPP URL
  */

  const whatsappUrl =
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(
      message
    );


  /*
     OPEN WHATSAPP
  */

  window.location.href =
    whatsappUrl;

}


/* =====================================================
   LOAD FROM SUPABASE
===================================================== */

async function displayExpiring(){

  const list =
    document.getElementById(
      "list"
    );


  list.innerHTML = `

    <div class="loading">

      ⏳ Loading...

    </div>

  `;


  try{

    const {
      data,
      error
    } =
    await supabaseClient

      .from("vehicles")

      .select(`

        id,
        created_at,
        vehicle_number,
        customer_name,
        customer_mobile,
        mobile,
        fitness_expiry,
        insurance_expiry,
        tax_expiry,
        pucc_expiry,
        permit_expiry

      `)

      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      console.error(
        "Supabase Error:",
        error
      );


      list.innerHTML = `

        <div class="error">

          ❌ Vehicle load error

          <br><br>

          ${escapeHtml(
            error.message
          )}

        </div>

      `;

      return;
    }


    let html = "";

    let found = false;


    /*
       CLEAR OLD DATA
    */

    vehiclesData = {};


    data.forEach(
      function(vehicle){

        const alerts = [];


        /*
           CHECK EACH DOCUMENT
        */

        fields.forEach(
          function(field){

            const date =
              vehicle[field.key];


            if(!date){
              return;
            }


            /*
               Tax = LTT
               એટલે expiry નથી
            */

            if(
              field.key ===
              "tax_expiry" &&
              String(date)
                .trim()
                .toUpperCase() ===
              "LTT"
            ){

              return;
            }


            const days =
              getDays(date);


            /*
               Expired OR
               next 10 days
            */

            if(
              days <= 10
            ){

              alerts.push({

                name:
                  field.name,

                date:
                  date,

                days:
                  days

              });

            }

          }
        );


        /*
           No expiry
        */

        if(
          alerts.length === 0
        ){

          return;
        }


        found = true;


        /*
           SAVE VEHICLE
           FOR REMINDER BUTTON
        */

        const vehicleId =
          String(
            vehicle.id
          );


        vehiclesData[
          vehicleId
        ] = vehicle;


        /*
           CUSTOMER MOBILE
        */

        const customerMobile =
          getCustomerMobile(
            vehicle
          );


        /*
           CUSTOMER BOX
        */

        let customerHTML = "";


        if(
          vehicle.customer_name ||
          customerMobile
        ){

          customerHTML = `

            <div class="customer-box">

              ${
                vehicle.customer_name
                ?
                `
                <b>Customer Name:</b>
                ${escapeHtml(
                  vehicle.customer_name
                )}

                <br>
                `
                :
                ""
              }


              <b>📱 Customer Mobile:</b>

              ${
                customerMobile
                ?
                escapeHtml(
                  customerMobile
                )
                :
                "Not Available"
              }

            </div>

          `;

        }


        /*
           DOCUMENT ALERTS
        */

        let alertsHTML = "";


        alerts.forEach(
          function(alert){

            if(
              alert.days < 0
            ){

              alertsHTML += `

                <div class="alert expired">

                  ❌
                  ${escapeHtml(
                    alert.name
                  )}

                  :
                  ${formatDate(
                    alert.date
                  )}

                  ના રોજ પૂર્ણ થઈ ગયું છે

                </div>

              `;

            }
            else if(
              alert.days === 0
            ){

              alertsHTML += `

                <div class="alert">

                  ⚠️
                  ${escapeHtml(
                    alert.name
                  )}

                  :
                  આજે
                  ${formatDate(
                    alert.date
                  )}

                  ના રોજ પૂરું થાય છે

                </div>

              `;

            }
            else{

              alertsHTML += `

                <div class="alert">

                  ⚠️
                  ${escapeHtml(
                    alert.name
                  )}

                  :
                  ${formatDate(
                    alert.date
                  )}

                  ના રોજ પૂરું થાય છે

                </div>

              `;

            }

          }
        );


        /*
           CARD
        */

        html += `

          <div class="card">

            <div class="title">

              🚘
              ${escapeHtml(
                vehicle.vehicle_number ||
                "Unknown Vehicle"
              )}

            </div>


            ${customerHTML}


            ${alertsHTML}


            ${
              customerMobile
              ?
              `

              <button
                class="reminder-btn"
                onclick="sendReminder('${vehicleId}')"
              >

                📲 WhatsApp Reminder મોકલો

              </button>

              `
              :
              `
              <div class="alert expired">

                📱 Customer Mobile Number
                ઉપલબ્ધ નથી.

              </div>

              `
            }


          </div>

        `;

      }
    );


    /*
       NOTHING FOUND
    */

    if(!found){

      html = `

        <div class="empty">

          🟢

          <br><br>

          આગામી 10 દિવસમાં કોઈ
          દસ્તાવેજની મુદત પૂર્ણ થતી નથી.

        </div>

      `;

    }


    list.innerHTML =
      html;


  }
  catch(error){

    console.error(
      error
    );


    list.innerHTML = `

      <div class="error">

        ❌ Something went wrong.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


/* =====================================================
   START
===================================================== */

displayExpiring();

</script>

</body>
</html>
