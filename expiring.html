<!DOCTYPE html>
<html lang="gu">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expiring Soon - RV Vehicle Reminder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  margin:0;
  color:#172033;
}

.header{
  background:linear-gradient(135deg,#dc2626,#f97316);
  color:white;
  padding:22px;
  border-radius:0 0 25px 25px;
}

.header h2{
  margin:0 0 6px;
}

.header p{
  margin:0;
  opacity:.9;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:18px;
  border-radius:18px;
  margin-bottom:16px;
  box-shadow:0 4px 15px #dce5f0;
}

.title{
  font-size:20px;
  font-weight:bold;
  color:#dc2626;
  margin-bottom:14px;
}

.customer-box{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
  line-height:1.7;
}

.alert{
  padding:12px;
  border-radius:10px;
  margin-top:8px;
  background:#fff7ed;
  color:#c2410c;
  font-weight:bold;
}

.expired{
  background:#fee2e2;
  color:#b91c1c;
}

.reminder-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:11px;
  margin-top:15px;
  background:#16a34a;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.reminder-btn:active{
  transform:scale(.98);
}

.back-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:11px;
  margin-top:15px;
  background:#64748b;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.empty{
  text-align:center;
  background:white;
  padding:30px;
  border-radius:18px;
  color:#687386;
}

.loading{
  text-align:center;
  background:white;
  padding:30px;
  border-radius:18px;
  color:#687386;
}

.error{
  text-align:center;
  background:#fee2e2;
  padding:20px;
  border-radius:15px;
  color:#b91c1c;
}

</style>

</head>


<body>


<div class="header">

  <h2>🔴 Expiring Soon</h2>

  <p>
    આવતા 10 દિવસમાં Expiry થનારા Documents
  </p>

</div>


<div class="container">

  <div id="list">

    <div class="loading">
      ⏳ Loading...
    </div>

  </div>


  <button
    class="back-btn"
    onclick="history.back()"
  >
    ⬅️ Back
  </button>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://lqbhafspabtlqeubqxjg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   ADVISOR DETAILS
===================================================== */

const ADVISOR_NAME =
"સહકાર ઓટો એડવાઇઝર";

const ADVISOR_PERSON =
"રમીઝભાઈ મેમણ";

const ADVISOR_ADDRESS =
"એ.પી.એમ.સી. માર્કેટ યાર્ડ, નસવાડી";


/* =====================================================
   DOCUMENT FIELDS
===================================================== */

const fields = [

  {
    key:"fitness_expiry",
    name:"ફિટનેસ"
  },

  {
    key:"insurance_expiry",
    name:"ઇન્શ્યોરન્સ"
  },

  {
    key:"tax_expiry",
    name:"ટેક્સ"
  },

  {
    key:"pucc_expiry",
    name:"PUCC"
  },

  {
    key:"permit_expiry",
    name:"પરમિટ"
  }

];


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(date){

  if(!date){
    return "";
  }

  const d =
    new Date(
      String(date).substring(0,10) +
      "T00:00:00"
    );

  if(isNaN(d.getTime())){
    return date;
  }

  const day =
    String(d.getDate()).padStart(2,"0");

  const month =
    String(d.getMonth()+1).padStart(2,"0");

  const year =
    d.getFullYear();

  return day + "/" + month + "/" + year;
}


/* =====================================================
   GET DAYS
===================================================== */

function getDays(date){

  if(!date){
    return null;
  }

  const dateOnly =
    String(date).substring(0,10);

  const today =
    new Date();

  today.setHours(0,0,0,0);

  const expiry =
    new Date(
      dateOnly + "T00:00:00"
    );

  if(isNaN(expiry.getTime())){
    return null;
  }

  return Math.ceil(
    (expiry - today) /
    (1000 * 60 * 60 * 24)
  );
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =====================================================
   GET MOBILE
===================================================== */

function getCustomerMobile(vehicle){

  const value =
    vehicle.customer_mobile ??
    vehicle.mobile ??
    "";

  return String(value).trim();
}


/* =====================================================
   CLEAN INDIAN MOBILE
===================================================== */

function cleanMobileNumber(number){

  let value =
    String(number || "").trim();

  /*
     Remove spaces
  */

  value =
    value.replace(/\s+/g,"");


  /*
     If multiple numbers are entered
     e.g.
     9265191856-8320706574

     Take first valid Indian 10 digit number.
  */

  const matches =
    value.match(/[6-9]\d{9}/g);


  if(matches && matches.length > 0){

    return "91" + matches[0];

  }


  /*
     Remove +, -, spaces etc.
  */

  let digits =
    value.replace(/\D/g,"");


  /*
     +91XXXXXXXXXX
  */

  if(
    digits.length === 12 &&
    digits.startsWith("91")
  ){

    return digits;

  }


  /*
     10 digit number
  */

  if(digits.length === 10){

    return "91" + digits;

  }


  return "";
}


/* =====================================================
   GET ALERTS
===================================================== */

function getVehicleAlerts(vehicle){

  const alerts = [];


  fields.forEach(function(field){

    const date =
      vehicle[field.key];


    if(!date){
      return;
    }


    /*
       Tax LTT = No expiry
    */

    if(
      field.key === "tax_expiry" &&
      String(date).trim().toUpperCase() === "LTT"
    ){

      return;

    }


    const days =
      getDays(date);


    if(days === null){
      return;
    }


    /*
       Expired OR next 10 days
    */

    if(days <= 10){

      alerts.push({

        name:field.name,

        date:date,

        days:days

      });

    }

  });


  return alerts;
}


/* =====================================================
   CREATE WHATSAPP MESSAGE
===================================================== */

function createReminder(vehicle,alerts){

  const customerName =
    String(
      vehicle.customer_name || ""
    ).trim();


  const customerMobile =
    getCustomerMobile(vehicle);


  let message = "";


  message +=
    ADVISOR_NAME + "\n";

  message +=
    ADVISOR_PERSON + "\n";

  message +=
    ADVISOR_ADDRESS + "\n\n";


  message +=
    "તમારી ગાડી\n";

  message +=
    "વાહન નંબર: " +
    (vehicle.vehicle_number || "") +
    "\nનું\n\n";


  alerts.forEach(function(alert){

    if(alert.days < 0){

      message +=
        "❌ " +
        alert.name +
        ": " +
        formatDate(alert.date) +
        " ના રોજ પૂર્ણ થઈ ગયું છે\n\n";

    }
    else if(alert.days === 0){

      message +=
        "⚠️ " +
        alert.name +
        ": આજે " +
        formatDate(alert.date) +
        " ના રોજ પૂરું થાય છે\n\n";

    }
    else{

      message +=
        "⚠️ " +
        alert.name +
        ": " +
        formatDate(alert.date) +
        " ના રોજ પૂરું થાય છે\n\n";

    }

  });


  message +=
    "સંપર્ક કરો:\n";


  message +=
    customerName ||
    ADVISOR_PERSON;


  message += "\n";


  message +=
    ADVISOR_ADDRESS +
    "\n";


  message +=
    "મોબાઇલ નંબર: " +
    customerMobile;


  return message;
}


/* =====================================================
   SEND WHATSAPP REMINDER
===================================================== */

async function sendReminder(vehicleId){

  try{

    /*
       Button click પછી
       Supabaseમાંથી vehicle ફરીથી લાવો.
    */

    const {
      data:vehicle,
      error
    } =
    await supabaseClient

      .from("vehicles")

      .select(`
        id,
        vehicle_number,
        customer_name,
        customer_mobile,
        mobile,
        fitness_expiry,
        insurance_expiry,
        tax_expiry,
        pucc_expiry,
        permit_expiry
      `)

      .eq("id",vehicleId)

      .single();


    if(error){

      console.error(error);

      alert(
        "Vehicle data load error:\n" +
        error.message
      );

      return;

    }


    if(!vehicle){

      alert(
        "Vehicle not found."
      );

      return;

    }


    /*
       Customer Mobile
    */

    const customerMobile =
      getCustomerMobile(vehicle);


    console.log(
      "Customer Mobile:",
      customerMobile
    );


    if(!customerMobile){

      alert(
        "આ ગાડી માટે Customer Mobile Number મળ્યો નથી."
      );

      return;

    }


    /*
       Get expiring documents
    */

    const alerts =
      getVehicleAlerts(vehicle);


    if(alerts.length === 0){

      alert(
        "આગામી 10 દિવસમાં કોઈ દસ્તાવેજની મુદત પૂર્ણ થતી નથી."
      );

      return;

    }


    /*
       Clean phone number
    */

    const phone =
      cleanMobileNumber(
        customerMobile
      );


    console.log(
      "WhatsApp Number:",
      phone
    );


    if(!phone){

      alert(
        "Customer Mobile Number સાચો નથી.\n\n" +
        "ઉદાહરણ: 9265191856"
      );

      return;

    }


    /*
       Create message
    */

    const message =
      createReminder(
        vehicle,
        alerts
      );


    console.log(
      "WhatsApp Message:",
      message
    );


    /*
       WhatsApp
    */

    const whatsappUrl =
      "https://wa.me/" +
      phone +
      "?text=" +
      encodeURIComponent(message);


    /*
       Open WhatsApp
    */

    window.location.href =
      whatsappUrl;

  }
  catch(error){

    console.error(error);

    alert(
      "Something went wrong:\n" +
      error.message
    );

  }

}


/* =====================================================
   DISPLAY EXPIRING VEHICLES
===================================================== */

async function displayExpiring(){

  const list =
    document.getElementById("list");


  list.innerHTML = `

    <div class="loading">
      ⏳ Loading...
    </div>

  `;


  try{

    const {
      data,
      error
    } =
    await supabaseClient

      .from("vehicles")

      .select(`
        id,
        created_at,
        vehicle_number,
        customer_name,
        customer_mobile,
        mobile,
        fitness_expiry,
        insurance_expiry,
        tax_expiry,
        pucc_expiry,
        permit_expiry
      `)

      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      console.error(
        "Supabase Error:",
        error
      );


      list.innerHTML = `

        <div class="error">

          ❌ Vehicle load error

          <br><br>

          ${escapeHtml(error.message)}

        </div>

      `;

      return;

    }


    let html = "";

    let found = false;


    data.forEach(function(vehicle){

      const alerts =
        getVehicleAlerts(vehicle);


      /*
         Only vehicles having
         expired or next 10 days documents
      */

      if(alerts.length === 0){

        return;

      }


      found = true;


      const customerMobile =
        getCustomerMobile(vehicle);


      /* ---------------------------------------------
         CUSTOMER
      --------------------------------------------- */

      let customerHTML = "";


      if(
        vehicle.customer_name ||
        customerMobile
      ){

        customerHTML = `

          <div class="customer-box">

            ${
              vehicle.customer_name
              ?
              `
              <b>Customer Name:</b>
              ${escapeHtml(vehicle.customer_name)}
              <br>
              `
              :
              ""
            }

            <b>📱 Customer Mobile:</b>

            ${
              customerMobile
              ?
              escapeHtml(customerMobile)
              :
              "Not Available"
            }

          </div>

        `;

      }


      /* ---------------------------------------------
         ALERTS
      --------------------------------------------- */

      let alertsHTML = "";


      alerts.forEach(function(alert){

        if(alert.days < 0){

          alertsHTML += `

            <div class="alert expired">

              ❌
              ${escapeHtml(alert.name)}
              :
              ${formatDate(alert.date)}
              ના રોજ પૂર્ણ થઈ ગયું છે

            </div>

          `;

        }
        else if(alert.days === 0){

          alertsHTML += `

            <div class="alert">

              ⚠️
              ${escapeHtml(alert.name)}
              :
              આજે
              ${formatDate(alert.date)}
              ના રોજ પૂરું થાય છે

            </div>

          `;

        }
        else{

          alertsHTML += `

            <div class="alert">

              ⚠️
              ${escapeHtml(alert.name)}
              :
              ${formatDate(alert.date)}
              ના રોજ પૂરું થાય છે

            </div>

          `;

        }

      });


      /* ---------------------------------------------
         REMINDER BUTTON
      --------------------------------------------- */

      let reminderHTML = "";


      if(customerMobile){

        reminderHTML = `

          <button
            class="reminder-btn"
            onclick="sendReminder('${String(vehicle.id)}')"
          >

            📲 WhatsApp Reminder મોકલો

          </button>

        `;

      }
      else{

        reminderHTML = `

          <div class="alert expired">

            📱 Customer Mobile Number ઉપલબ્ધ નથી.

          </div>

        `;

      }


      /* ---------------------------------------------
         CARD
      --------------------------------------------- */

      html += `

        <div class="card">

          <div class="title">

            🚘
            ${escapeHtml(
              vehicle.vehicle_number ||
              "Unknown Vehicle"
            )}

          </div>


          ${customerHTML}


          ${alertsHTML}


          ${reminderHTML}


        </div>

      `;

    });


    /*
       NOTHING FOUND
    */

    if(!found){

      html = `

        <div class="empty">

          🟢

          <br><br>

          આગામી 10 દિવસમાં કોઈ
          દસ્તાવેજની મુદત પૂર્ણ થતી નથી.

        </div>

      `;

    }


    list.innerHTML =
      html;


  }
  catch(error){

    console.error(error);


    list.innerHTML = `

      <div class="error">

        ❌ Something went wrong.

        <br><br>

        ${escapeHtml(error.message)}

      </div>

    `;

  }

}


/* =====================================================
   START
===================================================== */

displayExpiring();

</script>

</body>

</html>
