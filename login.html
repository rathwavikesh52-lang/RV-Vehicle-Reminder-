<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RV Vehicle Reminder - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 24px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .logo {
      font-size: 48px;
      text-align: center;
    }

    h1 {
      text-align: center;
      color: #222;
      font-size: 25px;
      margin: 8px 0;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      background: #e8f7ee;
      color: #16703a;
    }

    .error {
      background: #fdecec;
      color: #b42318;
    }

    .info {
      text-align: center;
      margin-top: 20px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">🚗</div>

    <h1>RV Vehicle Reminder</h1>

    <div class="subtitle">
      Secure login with Email Magic Link
    </div>

    <label for="email">Email Address</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="email"
    >

    <button id="loginBtn" onclick="sendMagicLink()">
      Send Magic Link
    </button>

    <div id="message" class="message"></div>

    <div class="info">
      We will send a secure login link to your email.
      No password required.
    </div>

  </div>

  <script>
    // SUPABASE CONFIGURATION
    // Important: Do NOT add /rest/v1/ at the end

    const SUPABASE_URL =
      "https://ksgxxzssnolveakfbvgy.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_4qX68fhDfCIXWVNRqvTsqQ_3inRIYiV";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    function showMessage(text, type) {
      const message = document.getElementById("message");

      message.innerText = text;
      message.className = "message " + type;
      message.style.display = "block";
    }

    async function sendMagicLink() {
      const emailInput = document.getElementById("email");
      const loginBtn = document.getElementById("loginBtn");

      const email = emailInput.value.trim();

      if (!email) {
        showMessage("Please enter your email address.", "error");
        return;
      }

      if (!email.includes("@")) {
        showMessage("Please enter a valid email address.", "error");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerText = "Sending...";

      try {
        const { error } =
          await supabaseClient.auth.signInWithOtp({
            email: email,
            options: {
              emailRedirectTo:
                "https://rathwavikesh52-lang.github.io/RV-Vehicle-Reminder-/index.html"
            }
          });

        if (error) {
          throw error;
        }

        showMessage(
          "Magic Link sent successfully. Please check your email inbox.",
          "success"
        );

      } catch (error) {
        console.error("Supabase Login Error:", error);

        showMessage(
          "Login failed: " + error.message,
          "error"
        );

      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = "Send Magic Link";
      }
    }

    async function checkLogin() {
      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (session) {
        window.location.href = "index.html";
      }
    }

    checkLogin();
  </script>

</body>
</html>
