
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - RV Vehicle Reminder</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.header{
  background:linear-gradient(135deg,#087cf5,#00b4ff);
  color:white;
  padding:22px;
  border-radius:0 0 25px 25px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:18px;
}

.summary-box{
  background:white;
  padding:14px 8px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 3px 12px #dce5f0;
}

.summary-box strong{
  display:block;
  font-size:22px;
  margin-bottom:5px;
}

.vehicle{
  background:white;
  border-radius:18px;
  padding:17px;
  margin-bottom:15px;
  box-shadow:0 4px 15px #dce5f0;
}

.vehicle h3{
  color:#087cf5;
  margin:0 0 14px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid #edf0f5;
  font-size:13px;
}

.row:last-child{
  border-bottom:0;
}

.label{
  color:#687386;
}

.valid{
  color:#16a34a;
  font-weight:bold;
}

.warning{
  color:#ea580c;
  font-weight:bold;
}

.expired{
  color:#dc2626;
  font-weight:bold;
}

button{
  width:100%;
  border:0;
  padding:14px;
  border-radius:12px;
  margin-top:12px;
  background:#087cf5;
  color:white;
  font-size:15px;
  font-weight:bold;
}

.back{
  background:#64748b;
}
</style>
</head>

<body>

<div class="header">
  <h2>📊 Vehicle Dashboard</h2>
  <p>RV Vehicle Reminder</p>
</div>

<div class="container">

  <div class="summary">
    <div class="summary-box">
      <strong id="total">0</strong>
      Total
    </div>

    <div class="summary-box">
      <strong id="soon">0</strong>
      Expiring
    </div>

    <div class="summary-box">
      <strong id="expired">0</strong>
      Expired
    </div>
  </div>

  <div id="vehicleList"></div>

  <button onclick="location.href='upload.html'">
    📸 Add Vehicle
  </button>

  <button class="back" onclick="history.back()">
    ⬅️ Back
  </button>

</div>

<script>

const documents = [
  {key:"fitness", name:"Fitness"},
  {key:"insurance", name:"Insurance"},
  {key:"tax", name:"Tax"},
  {key:"pucc", name:"PUCC"},
  {key:"permit", name:"Permit"}
];

function formatDate(date){
  if(!date) return "—";

  return new Date(date+"T00:00:00").toLocaleDateString("en-IN",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });
}

function daysLeft(date){

  if(!date) return null;

  const today=new Date();
  today.setHours(0,0,0,0);

  const expiry=new Date(date+"T00:00:00");

  return Math.ceil(
    (expiry-today)/(1000*60*60*24)
  );
}

function status(date){

  const days=daysLeft(date);

  if(days===null)
    return "—";

  if(days<0)
    return '<span class="expired">❌ Expired</span>';

  if(days<=10)
    return '<span class="warning">🔔 '+days+' Days Left</span>';

  return '<span class="valid">🟢 Valid</span>';
}

function loadDashboard(){

  const vehicles=
    JSON.parse(localStorage.getItem("vehicles")) || [];

  document.getElementById("total").innerText=
    vehicles.length;

  let soon=0;
  let expired=0;

  vehicles.forEach(v=>{

    documents.forEach(d=>{

      const days=daysLeft(v[d.key]);

      if(days!==null){

        if(days<0)
          expired++;

        else if(days<=10)
          soon++;
      }

    });

  });

  document.getElementById("soon").innerText=soon;
  document.getElementById("expired").innerText=expired;

  const list=document.getElementById("vehicleList");

  list.innerHTML="";

  if(vehicles.length===0){

    list.innerHTML=`
      <div class="vehicle" style="text-align:center;">
        🚗<br><br>
        હજુ કોઈ Vehicle Save નથી.
      </div>
    `;

    return;
  }

  /*
    Dashboardમાં વધુમાં વધુ 10 વાહનો
    એક સમયે બતાવવામાં આવે છે.
  */

  vehicles.slice(0,10).forEach(v=>{

    let html=`
      <div class="vehicle">

      <h3>🚘 ${v.vehicleNumber}</h3>

      <div class="row">
        <span class="label">Registration Date</span>
        <span>${formatDate(v.registrationDate)}</span>
      </div>
    `;

    documents.forEach(d=>{

      html+=`
        <div class="row">
          <span class="label">${d.name} Expiry</span>
          <span>
            ${formatDate(v[d.key])}<br>
            ${status(v[d.key])}
          </span>
        </div>
      `;

    });

    html+=`</div>`;

    list.innerHTML+=html;

  });

}

loadDashboard();

</script>

</body>
</html>
