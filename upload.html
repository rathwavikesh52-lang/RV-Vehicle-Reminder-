/* =========================================
   OCR NORMALIZE
========================================= */

function normalizeOCRText(text){

  return String(text || "")
    .replace(/\r/g,"")
    .replace(/[“”]/g,'"')
    .replace(/[‘’]/g,"'")
    .replace(/[|]/g,"I")
    .replace(/[ \t]+/g," ")
    .replace(/\n[ \t]+/g,"\n")
    .trim();

}


function getOCRLines(text){

  return normalizeOCRText(text)
    .split("\n")
    .map(function(line){

      return line
        .replace(/\s+/g," ")
        .trim();

    })
    .filter(function(line){

      return line.length > 0;

    });

}


/* =========================================
   MONTHS
========================================= */

const MONTHS = {

  JAN:"Jan",
  FEB:"Feb",
  MAR:"Mar",
  APR:"Apr",
  MAY:"May",
  JUN:"Jun",
  JUL:"Jul",
  AUG:"Aug",
  SEP:"Sep",
  OCT:"Oct",
  NOV:"Nov",
  DEC:"Dec"

};


function validDateParts(
  day,
  month,
  year
){

  const d =
    Number(day);

  const y =
    Number(year);

  if(
    !Number.isInteger(d) ||
    !Number.isInteger(y)
  ){
    return false;
  }

  if(d < 1 || d > 31){
    return false;
  }

  if(y < 1900 || y > 2200){
    return false;
  }

  return true;

}


/* =========================================
   NORMALIZE DATE
========================================= */

function normalizeDateString(value){

  if(!value) return "";

  let s =
    String(value)
      .toUpperCase()
      .replace(/,/g," ")
      .replace(/\s+/g," ")
      .trim();


  let m =
    s.match(
      /^(\d{1,2})[-\/\s]([A-Z]{3})[-\/\s](\d{4})$/
    );

  if(m){

    const day =
      m[1].padStart(2,"0");

    const month =
      MONTHS[m[2]];

    const year =
      m[3];

    if(
      month &&
      validDateParts(
        day,
        month,
        year
      )
    ){

      return (
        day +
        "-" +
        month +
        "-" +
        year
      );

    }

  }


  m =
    s.match(
      /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/
    );

  if(m){

    const day =
      m[1].padStart(2,"0");

    const monthNumber =
      Number(m[2]);

    const year =
      m[3];

    const monthNames = [

      "Jan",
      "Feb",
      "Mar",
      "Apr",
      "May",
      "Jun",
      "Jul",
      "Aug",
      "Sep",
      "Oct",
      "Nov",
      "Dec"

    ];

    if(
      monthNumber >= 1 &&
      monthNumber <= 12 &&
      validDateParts(
        day,
        monthNumber,
        year
      )
    ){

      return (
        day +
        "-" +
        monthNames[
          monthNumber - 1
        ] +
        "-" +
        year
      );

    }

  }


  m =
    s.match(
      /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/
    );

  if(m){

    const year =
      m[1];

    const monthNumber =
      Number(m[2]);

    const day =
      m[3].padStart(2,"0");

    const monthNames = [

      "Jan",
      "Feb",
      "Mar",
      "Apr",
      "May",
      "Jun",
      "Jul",
      "Aug",
      "Sep",
      "Oct",
      "Nov",
      "Dec"

    ];

    if(
      monthNumber >= 1 &&
      monthNumber <= 12 &&
      validDateParts(
        day,
        monthNumber,
        year
      )
    ){

      return (
        day +
        "-" +
        monthNames[
          monthNumber - 1
        ] +
        "-" +
        year
      );

    }

  }

  return "";

}


/* =========================================
   EXTRACT DATE
========================================= */

function extractDateFromText(text){

  const patterns = [

    /\b(\d{1,2})[-\/\s](JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[-\/\s](\d{4})\b/i,

    /\b(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})\b/,

    /\b(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})\b/

  ];


  for(
    let i = 0;
    i < patterns.length;
    i++
  ){

    const match =
      String(text || "")
        .match(patterns[i]);

    if(match){

      const result =
        normalizeDateString(
          match[0]
        );

      if(result){

        return result;

      }

    }

  }

  return "";

}


/* =========================================
   FIND VALUE AFTER LABEL
========================================= */

function findValueAfterLabels(
  text,
  labels,
  maxLines
){

  const lines =
    getOCRLines(text);

  maxLines =
    maxLines || 3;


  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    const line =
      lines[i];


    for(
      let j = 0;
      j < labels.length;
      j++
    ){

      const label =
        labels[j];

      const regex =
        new RegExp(
          label +
          "\\s*[:\\-]?\\s*(.*)",
          "i"
        );

      const match =
        line.match(regex);


      if(match){

        const sameLine =
          match[1] || "";

        const date =
          extractDateFromText(
            sameLine
          );

        if(date){

          return date;

        }


        for(
          let k = 1;
          k <= maxLines;
          k++
        ){

          if(!lines[i + k]){
            break;
          }

          const nextDate =
            extractDateFromText(
              lines[i + k]
            );

          if(nextDate){

            return nextDate;

          }

        }

      }

    }

  }

  return "";

}


/* =========================================
   INSURANCE BLOCK
========================================= */

function findInsuranceBlockDate(text){

  const lines =
    getOCRLines(text);

  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    if(
      /INSURANCE/i.test(lines[i])
    ){

      for(
        let j = i;
        j < Math.min(
          i + 5,
          lines.length
        );
        j++
      ){

        const date =
          extractDateFromText(
            lines[j]
          );

        if(date){

          return date;

        }

      }

    }

  }

  return "";

}


/* =========================================
   TAX
========================================= */

function findTaxValue(text){

  const lines =
    getOCRLines(text);

  const labels = [

    "MV TAX",
    "TAX VALID UPTO",
    "TAX VALID UP TO",
    "TAX VALID",
    "ROAD TAX",
    "TAX"

  ];


  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    for(
      let j = 0;
      j < labels.length;
      j++
    ){

      if(
        new RegExp(
          labels[j],
          "i"
        ).test(lines[i])
      ){

        let localText =
          lines[i];

        if(lines[i + 1]){

          localText +=
            " " +
            lines[i + 1];

        }

        if(lines[i + 2]){

          localText +=
            " " +
            lines[i + 2];

        }


        const taxMatch =
          localText.match(
            /\b(LTT|L7T|LT7|LIT|LII|L\s*T\s*T)\b/i
          );

        if(taxMatch){

          return "LTT";

        }


        const date =
          extractDateFromText(
            localText
          );

        if(date){

          return date;

        }

      }

    }

  }

  return "";

}


/* =========================================
   VEHICLE NUMBER
   ONLY OCR VEHICLE NUMBER FIX
========================================= */

function cleanVehicleCandidate(raw){

  if(!raw) return "";

  let s =
    String(raw)
      .toUpperCase()
      .replace(/[^A-Z0-9]/g,"");


  /*
    OCR GJ ને G7 / G1 વાંચે તો GJ કરો
  */

  s =
    s.replace(/^G7/,"GJ");

  s =
    s.replace(/^G1/,"GJ");


  /*
    OCR માં J ઘણી વાર 7 / 1 થઈ શકે
  */

  if(
    /^G[71]\d/.test(s)
  ){

    s =
      "GJ" +
      s.substring(2);

  }


  /*
    Standard Gujarat:
    GJ34S1419
    GJ34AB1234
  */

  if(
    /^GJ\d{2}[A-Z]\d{4}$/.test(s)
  ){

    return s;

  }


  if(
    /^GJ\d{2}[A-Z]{2}\d{4}$/.test(s)
  ){

    return s;

  }


  /*
    OCR ખાસ case:
    
    GJ3451419

    Actual:
    GJ34S1419

    એટલે GJ + 34 + 5 + 1419
    માં 5 ને S તરીકે વાંચવું.
  */

  let m =
    s.match(
      /^GJ(\d{2})(\d)(\d{4})$/
    );

  if(m){

    const rto =
      m[1];

    const middle =
      m[2];

    const last =
      m[3];


    if(middle === "5"){

      return (
        "GJ" +
        rto +
        "S" +
        last
      );

    }


    if(middle === "8"){

      return (
        "GJ" +
        rto +
        "B" +
        last
      );

    }


    if(middle === "0"){

      return (
        "GJ" +
        rto +
        "O" +
        last
      );

    }

  }


  /*
    10 digit format
  */

  if(
    /^GJ\d{2}[A-Z]{2}\d{4}$/.test(s)
  ){

    return s;

  }


  /*
    Other common OCR corrections
  */

  s =
    s.replace(
      /^GJ(\d{2})5(\d{4})$/,
      "GJ$1S$2"
    );

  s =
    s.replace(
      /^GJ(\d{2})8(\d{4})$/,
      "GJ$1B$2"
    );

  s =
    s.replace(
      /^GJ(\d{2})0(\d{4})$/,
      "GJ$1O$2"
    );


  if(
    /^GJ\d{2}[A-Z]\d{4}$/.test(s)
  ){

    return s;

  }


  if(
    /^GJ\d{2}[A-Z]{2}\d{4}$/.test(s)
  ){

    return s;

  }


  return "";

}


/* =========================================
   EXTRACT VEHICLE NUMBER
========================================= */

function extractVehicleNumber(text){

  const rawText =
    normalizeOCRText(text);

  const lines =
    getOCRLines(rawText);

  let candidates = [];


  /*
    Vehicle Number labelની આજુબાજુ શોધો
  */

  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    const line =
      lines[i];


    if(
      /VEHICLE\s*NUMBER/i.test(line) ||
      /VEHICLE\s*NO/i.test(line) ||
      /REGISTRATION\s*NUMBER/i.test(line) ||
      /REGN\s*NUMBER/i.test(line) ||
      /REGN\s*NO/i.test(line)
    ){

      let localText =
        line;


      if(lines[i + 1]){

        localText +=
          " " +
          lines[i + 1];

      }


      if(lines[i + 2]){

        localText +=
          " " +
          lines[i + 2];

      }


      /*
        Gujarat number candidate
      */

      const found =
        localText.match(
          /\b(?:GJ|G7|G1)[A-Z0-9]{6,10}\b/gi
        );


      if(found){

        candidates =
          candidates.concat(found);

      }

    }

  }


  /*
    આખા OCR textમાંથી શોધો
  */

  const globalMatches =
    rawText.match(
      /\b(?:GJ|G7|G1)[A-Z0-9]{6,10}\b/gi
    );


  if(globalMatches){

    candidates =
      candidates.concat(
        globalMatches
      );

  }


  /*
    Candidate repair
  */

  for(
    let i = 0;
    i < candidates.length;
    i++
  ){

    const repaired =
      cleanVehicleCandidate(
        candidates[i]
      );

    if(repaired){

      return repaired;

    }

  }


  /*
    Direct Vehicle Number label
  */

  const direct =
    rawText.match(
      /VEHICLE\s*(?:NUMBER|NO)[^A-Z0-9]{0,10}(GJ\d{7,8})/i
    );


  if(direct){

    const repaired =
      cleanVehicleCandidate(
        direct[1]
      );

    if(repaired){

      return repaired;

    }

  }


  return "";

}


/* =========================================
   VEHICLE CLASS
========================================= */

function detectVehicleClass(text){

  const upper =
    String(text || "")
      .toUpperCase();


  const codes = [

    "HGV",
    "MGV",
    "MPV",
    "LGV",
    "LMV",
    "LPV",
    "HPV",
    "2WN",
    "3WT",
    "OTH"

  ];


  for(
    let i = 0;
    i < codes.length;
    i++
  ){

    if(
      new RegExp(
        "\\b" +
        codes[i] +
        "\\b",
        "i"
      ).test(upper)
    ){

      return codes[i];

    }

  }


  if(
    /CONSTRUCTION\s+EQUIPMENT\s+VEHICLE/i
      .test(upper)
  ){

    return "OTH";

  }


  if(
    /M[-\s]?CYCLE|MOTORCYCLE|MOTOR\s+CYCLE|SCOOTER|TWO\s+WHEELER/i
      .test(upper)
  ){

    return "2WN";

  }


  if(
    /THREE\s+WHEELER|AUTO\s+RICKSHAW|AUTORICKSHAW/i
      .test(upper)
  ){

    return "3WT";

  }


  if(
    /\bBUS\b/i.test(upper)
  ){

    return "HPV";

  }


  if(
    /TRACTOR|PICK[-\s]?UP|GOODS\s+VEHICLE/i
      .test(upper)
  ){

    return "LGV";

  }


  if(
    /MOTOR\s+CAR|\bCAR\b/i
      .test(upper)
  ){

    return "LMV";

  }


  return "";

}


/* =========================================
   OCR DATA
========================================= */

function extractOCRData(){

  const text =
    document.getElementById(
      "ocrText"
    ).value;


  if(!text) return;


  /*
    CUSTOMER NAME અને MOBILE અહીં
    જાણબૂઝીને touch કરવામાં આવતા નથી.
  */

  const vehicleNumber =
    extractVehicleNumber(text);


  const registrationDate =
    findValueAfterLabels(
      text,
      [
        "REGISTRATION DATE",
        "REGISTRATION DT",
        "REGN DATE",
        "REGN DT",
        "REG DATE"
      ],
      3
    );


  const fitnessExpiry =
    findValueAfterLabels(
      text,
      [
        "FITNESS VALID UPTO",
        "FITNESS VALID UP TO",
        "FITNESS VALID",
        "FITNESS EXPIRY",
        "FITNESS EXPIRY DATE",
        "FITNESS/REGN"
      ],
      3
    );


  let insuranceExpiry =
    findValueAfterLabels(
      text,
      [
        "INSURANCE VALID UPTO",
        "INSURANCE VALID UP TO",
        "INSURANCE VALID",
        "INSURANCE EXPIRY",
        "INSURANCE VALIDITY"
      ],
      3
    );


  if(!insuranceExpiry){

    insuranceExpiry =
      findInsuranceBlockDate(
        text
      );

  }


  const taxExpiry =
    findTaxValue(text);


  const puccExpiry =
    findValueAfterLabels(
      text,
      [
        "PUCC VALID UPTO",
        "PUCC VALID UP TO",
        "PUC VALID UPTO",
        "PUC VALID UP TO",
        "PUCC EXPIRY",
        "PUC EXPIRY",
        "POLLUTION UNDER CONTROL",
        "PUCC",
        "PUC"
      ],
      3
    );


  const permitExpiry =
    findValueAfterLabels(
      text,
      [
        "PERMIT VALID UPTO",
        "PERMIT VALID UP TO",
        "PERMIT VALID",
        "PERMIT EXPIRY",
        "PERMIT EXPIRY DATE",
        "PERMIT"
      ],
      3
    );


  const vehicleClass =
    detectVehicleClass(text);


  /*
    ONLY VEHICLE DETAILS AUTO FILL
  */

  if(vehicleNumber){

    document.getElementById(
      "vehicleNumber"
    ).value =
      vehicleNumber;

  }


  if(registrationDate){

    document.getElementById(
      "registrationDate"
    ).value =
      registrationDate;

  }


  if(fitnessExpiry){

    document.getElementById(
      "fitnessExpiry"
    ).value =
      fitnessExpiry;

  }


  if(insuranceExpiry){

    document.getElementById(
      "insuranceExpiry"
    ).value =
      insuranceExpiry;

  }


  if(taxExpiry){

    document.getElementById(
      "taxExpiry"
    ).value =
      taxExpiry;

  }


  if(puccExpiry){

    document.getElementById(
      "puccExpiry"
    ).value =
      puccExpiry;

  }


  if(permitExpiry){

    document.getElementById(
      "permitExpiry"
    ).value =
      permitExpiry;

  }


  if(vehicleClass){

    selectVehicleClass(
      vehicleClass
    );

  }

}


/* =========================================
   ENHANCED IMAGE
========================================= */

function createEnhancedImage(file){

  return new Promise(
    function(resolve,reject){

      const img =
        new Image();

      const reader =
        new FileReader();


      reader.onload =
        function(e){

          img.onload =
            function(){

              const minWidth =
                1800;

              const scale =
                Math.max(
                  1,
                  minWidth / img.width
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                Math.round(
                  img.width * scale
                );

              canvas.height =
                Math.round(
                  img.height * scale
                );


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              const imageData =
                ctx.getImageData(
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );


              const data =
                imageData.data;


              for(
                let i = 0;
                i < data.length;
                i += 4
              ){

                const gray =
                  (
                    0.299 * data[i] +
                    0.587 * data[i+1] +
                    0.114 * data[i+2]
                  );


                const value =
                  gray > 160
                    ? 255
                    : gray < 90
                    ? 0
                    : gray;


                data[i] =
                  value;

                data[i+1] =
                  value;

                data[i+2] =
                  value;

              }


              ctx.putImageData(
                imageData,
                0,
                0
              );


              canvas.toBlob(
                function(blob){

                  if(blob){

                    resolve(
                      new File(
                        [blob],
                        "enhanced.jpg",
                        {
                          type:"image/jpeg"
                        }
                      )
                    );

                  }else{

                    reject(
                      new Error(
                        "Image enhancement failed"
                      )
                    );

                  }

                },
                "image/jpeg",
                0.95
              );

            };


          img.onerror =
            reject;

          img.src =
            e.target.result;

        };


      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );

}


/* =========================================
   OCR RECOGNITION
========================================= */

async function recognizeOCR(
  image,
  passNumber,
  totalPasses
){

  const result =
    await Tesseract.recognize(
      image,
      "eng",
      {

        logger:function(info){

          if(
            info.status ===
            "recognizing text"
          ){

            const localProgress =
              info.progress || 0;

            const overall =
              (
                (
                  passNumber - 1
                ) +
                localProgress
              ) /
              totalPasses *
              100;


            const fill =
              document.getElementById(
                "progressFill"
              );

            const text =
              document.getElementById(
                "progressText"
              );


            fill.style.width =
              Math.round(
                overall
              ) +
              "%";


            text.textContent =
              "OCR Pass " +
              passNumber +
              " / " +
              totalPasses +
              " - " +
              Math.round(
                localProgress * 100
              ) +
              "%";

          }

        }

      }
    );


  return result.data.text || "";

}


/* =========================================
   START OCR
========================================= */

async function startOCR(){

  if(!selectedFile){

    showMessage(
      "Please select vehicle photo first.",
      "error"
    );

    return;

  }


  const btn =
    document.getElementById(
      "ocrBtn"
    );


  const progressWrap =
    document.getElementById(
      "progressWrap"
    );


  progressWrap.style.display =
    "block";


  btn.disabled =
    true;


  try{

    /*
      PASS 1
    */

    const text1 =
      await recognizeOCR(
        selectedFile,
        1,
        3
      );


    /*
      PASS 2
    */

    const enhanced1 =
      await createEnhancedImage(
        selectedFile
      );


    const text2 =
      await recognizeOCR(
        enhanced1,
        2,
        3
      );


    /*
      PASS 3
    */

    const enhanced2 =
      await createEnhancedImage(
        enhanced1
      );


    const text3 =
      await recognizeOCR(
        enhanced2,
        3,
        3
      );


    /*
      Combine OCR
    */

    const combinedText =
      [
        text1,
        text2,
        text3
      ]
      .filter(function(t){

        return t &&
          t.trim();

      })
      .join(
        "\n\n--- OCR PASS ---\n\n"
      );


    document.getElementById(
      "ocrText"
    ).value =
      combinedText;


    /*
      Extract vehicle details
      Customer Name / Mobile untouched
    */

    extractOCRData();


    document.getElementById(
      "progressFill"
    ).style.width =
      "100%";


    document.getElementById(
      "progressText"
    ).textContent =
      "OCR completed successfully.";


    showMessage(
      "OCR completed successfully.",
      "success"
    );


  }catch(error){

    console.error(error);

    showMessage(
      "OCR failed. Please try again.",
      "error"
    );

  }finally{

    btn.disabled =
      false;

  }

}


/* =========================================
   UPLOAD VEHICLE PHOTO
========================================= */

async function uploadVehiclePhoto(
  file,
  vehicleNumber
){

  if(!file){

    return {
      photo_url:null,
      photo_path:null
    };

  }


  const safeNumber =
    (
      vehicleNumber ||
      "vehicle"
    )
    .replace(
      /[^A-Z0-9_-]/gi,
      ""
    );


  const path =
    safeNumber +
    "/" +
    Date.now() +
    "_" +
    file.name.replace(
      /[^A-Z0-9._-]/gi,
      "_"
    );


  const upload =
    await supabaseClient
      .storage
      .from("vehicle-photos")
      .upload(
        path,
        file,
        {
          upsert:false
        }
      );


  if(upload.error){

    throw upload.error;

  }


  const publicData =
    supabaseClient
      .storage
      .from("vehicle-photos")
      .getPublicUrl(
        path
      );


  return {

    photo_url:
      publicData.data.publicUrl,

    photo_path:
      path

  };

}


/* =========================================
   DELETE OLD PHOTO
========================================= */

async function deleteOldPhoto(
  photoPath
){

  if(!photoPath){

    return;

  }


  const result =
    await supabaseClient
      .storage
      .from("vehicle-photos")
      .remove([
        photoPath
      ]);


  if(result.error){

    console.error(
      "Old photo delete error:",
      result.error
    );

  }

}


/* =========================================
   SAVE VEHICLE
========================================= */

async function saveVehicle(){

  try{

    const customerName =
      document.getElementById(
        "customerName"
      ).value.trim();


    const customerMobile =
      document.getElementById(
        "customerMobile"
      ).value.trim();


    const vehicleNumber =
      document.getElementById(
        "vehicleNumber"
      ).value.trim()
      .toUpperCase();


    const vehicleClass =
      document.getElementById(
        "vehicleClass"
      ).value;


    const registrationDate =
      document.getElementById(
        "registrationDate"
      ).value.trim();


    const fitnessExpiry =
      document.getElementById(
        "fitnessExpiry"
      ).value.trim();


    const insuranceExpiry =
      document.getElementById(
        "insuranceExpiry"
      ).value.trim();


    const taxExpiry =
      document.getElementById(
        "taxExpiry"
      ).value.trim();


    const puccExpiry =
      document.getElementById(
        "puccExpiry"
      ).value.trim();


    const permitExpiry =
      document.getElementById(
        "permitExpiry"
      ).value.trim();


    const ocrText =
      document.getElementById(
        "ocrText"
      ).value;


    if(!vehicleNumber){

      showMessage(
        "Vehicle Number is required.",
        "error"
      );

      return;

    }


    let photoUrl =
      currentPhotoUrl ||
      null;

    let photoPath =
      oldPhotoPath ||
      null;


    /*
      New photo
    */

    if(selectedFile){

      const uploaded =
        await uploadVehiclePhoto(
          selectedFile,
          vehicleNumber
        );


      photoUrl =
        uploaded.photo_url;

      photoPath =
        uploaded.photo_path;

    }


    const vehicleData = {

      vehicle_number:
        vehicleNumber,

      customer_name:
        customerName,

      customer_mobile:
        customerMobile,

      mobile:
        customerMobile,

      vehicle_class:
        vehicleClass,

      registration_date:
        registrationDate,

      fitness_expiry:
        fitnessExpiry,

      insurance_expiry:
        insuranceExpiry,

      tax_expiry:
        taxExpiry,

      pucc_expiry:
        puccExpiry,

      permit_expiry:
        permitExpiry,

      photo_url:
        photoUrl,

      photo_path:
        photoPath,

      ocr_text:
        ocrText

    };


    /*
      EDIT
    */

    if(editingId){

      const update =
        await supabaseClient
          .from("vehicles")
          .update(vehicleData)
          .eq(
            "id",
            editingId
          );


      if(update.error){

        throw update.error;

      }


      /*
        Delete old photo only
        after successful update
      */

      if(
        selectedFile &&
        oldPhotoPath &&
        oldPhotoPath !== photoPath
      ){

        await deleteOldPhoto(
          oldPhotoPath
        );

      }


      showMessage(
        "Vehicle updated successfully. Old photo replaced.",
        "success"
      );


    }else{

      /*
        Check existing vehicle
      */

      const existing =
        await supabaseClient
          .from("vehicles")
          .select("*")
          .eq(
            "vehicle_number",
            vehicleNumber
          )
          .limit(1);


      if(existing.error){

        throw existing.error;

      }


      if(
        existing.data &&
        existing.data.length > 0
      ){

        const oldVehicle =
          existing.data[0];


        const update =
          await supabaseClient
            .from("vehicles")
            .update(vehicleData)
            .eq(
              "id",
              oldVehicle.id
            );


        if(update.error){

          throw update.error;

        }


        if(
          selectedFile &&
          oldVehicle.photo_path &&
          oldVehicle.photo_path !== photoPath
        ){

          await deleteOldPhoto(
            oldVehicle.photo_path
          );

        }


        showMessage(
          "Vehicle updated successfully.",
          "success"
        );


      }else{

        const insert =
          await supabaseClient
            .from("vehicles")
            .insert(
              vehicleData
            );


        if(insert.error){

          throw insert.error;

        }


        showMessage(
          "Vehicle saved successfully.",
          "success"
        );

      }

    }


    setTimeout(
      function(){

        window.location.href =
          "index.html";

      },
      1000
    );


  }catch(error){

    console.error(error);

    showMessage(
      error.message ||
      "Save failed.",
      "error"
    );

  }

}


/* =========================================
   LOAD VEHICLE
========================================= */

async function loadVehicle(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  editingId =
    params.get("id");


  if(!editingId){

    return;

  }


  try{

    const result =
      await supabaseClient
        .from("vehicles")
        .select("*")
        .eq(
          "id",
          editingId
        )
        .single();


    if(result.error){

      throw result.error;

    }


    const vehicle =
      result.data;


    /*
      Customer
    */

    document.getElementById(
      "customerName"
    ).value =
      vehicle.customer_name ||
      "";


    document.getElementById(
      "customerMobile"

      vehicle.mobile ||

      "vehicleNumber"

      vehicle.vehicle_number ||

    document.getElementById(
      "registrationDate"
    ).value =
      vehicle.registration_date ||
      "";


    document.getElementById(
      "fitnessExpiry"
    ).value =
      vehicle.fitness_expiry ||
      "";


    document.getElementById(
      "insuranceExpiry"
    ).value =
      vehicle.insurance_expiry ||
      "";


    document.getElementById(
      "taxExpiry"
    ).value =
      vehicle.tax_expiry ||

    document.getElementById(
      "puccExpiry"
    ).value =
      vehicle.pucc_expiry ||

    document.getElementById(

    ).value =
      vehicle.permit_expiry ||

    /*
      Photo
    */

    currentPhotoUrl =
      vehicle.photo_url ||
      "";

    oldPhotoPath =
      vehicle.photo_path ||

    if(currentPhotoUrl){

      const preview =
        document.getElementById(
          "preview"

        "block";

    }


  }catch(error){

    console.error(error);

    showMessage(
      error.message ||
      "Vehicle loading failed.",
      "error"
    );

  }

}
