<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RV Vehicle Reminder - Upload</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fb;
  color:#222;
}

.header{
  background:#123b70;
  color:#fff;
  padding:16px;
  text-align:center;
  font-size:21px;
  font-weight:bold;
}

.container{
  max-width:650px;
  margin:20px auto;
  padding:15px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.10);
}

h2{
  margin-top:0;
  color:#123b70;
  text-align:center;
}

label{
  display:block;
  margin-top:13px;
  margin-bottom:5px;
  font-weight:bold;
}

input,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #c8d0dc;
  border-radius:7px;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  width:100%;
  border:0;
  border-radius:8px;
  padding:13px;
  margin-top:15px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.btn-primary{
  background:#1266d3;
  color:white;
}

.btn-success{
  background:#159447;
  color:white;
}

.btn-secondary{
  background:#555;
  color:white;
}

.preview{
  width:100%;
  max-height:300px;
  object-fit:contain;
  margin-top:12px;
  border:1px solid #ddd;
  border-radius:8px;
  display:none;
}

.progress{
  margin-top:12px;
  padding:10px;
  background:#eef4ff;
  color:#123b70;
  border-radius:7px;
  display:none;
  font-size:14px;
}

.status{
  margin-top:12px;
  padding:12px;
  border-radius:7px;
  display:none;
  font-weight:bold;
}

.status.success{
  display:block;
  background:#e1f6e8;
  color:#167237;
}

.status.error{
  display:block;
  background:#ffe5e5;
  color:#a40000;
}

.status.info{
  display:block;
  background:#e7f0ff;
  color:#124c99;
}

.small{
  font-size:12px;
  color:#666;
  margin-top:5px;
}

.rawbox{
  display:none;
  margin-top:15px;
}

.rawbox textarea{
  font-size:12px;
  min-height:180px;
}
</style>
</head>

<body>

<div class="header">
  RV Vehicle Reminder
</div>

<div class="container">
  <div class="card">

    <h2>Upload Vehicle Details</h2>

    <label>Select Vehicle Photo / Screenshot</label>
    <input type="file" id="photoInput" accept="image/*">

    <div class="small">
      Upload a clear VAHAN / vehicle details screenshot or photo.
    </div>

    <img id="preview" class="preview">

    <button class="btn-primary" id="readBtn">
      READ PHOTO
    </button>

    <div id="progress" class="progress">
      OCR processing started...
    </div>

    <label>Vehicle Number</label>
    <input
      type="text"
      id="vehicleNumber"
      placeholder="Example: GJ06A78397"
    >

    <label>Registration Date</label>
    <input
      type="text"
      id="registrationDate"
      placeholder="DD/MM/YYYY"
    >

    <label>Fitness Expiry</label>
    <input
      type="text"
      id="fitnessExpiry"
      placeholder="DD/MM/YYYY"
    >

    <label>Insurance Expiry</label>
    <input
      type="text"
      id="insuranceExpiry"
      placeholder="DD/MM/YYYY"
    >

    <label>Tax Valid UpTo</label>
    <input
      type="text"
      id="taxExpiry"
      placeholder="DD/MM/YYYY or LTT"
    >

    <div class="small">
      Gujarat માટે Tax માં તારીખ અથવા LTT આવશે.
    </div>

    <label>PUCC Expiry</label>
    <input
      type="text"
      id="puccExpiry"
      placeholder="DD/MM/YYYY"
    >

    <label>Permit Expiry</label>
    <input
      type="text"
      id="permitExpiry"
      placeholder="DD/MM/YYYY"
    >

    <button class="btn-success" id="saveBtn">
      SAVE VEHICLE
    </button>

    <button class="btn-secondary" id="dashboardBtn">
      GO TO DASHBOARD
    </button>

    <div id="status" class="status"></div>

    <div class="rawbox" id="rawBox">
      <label>OCR Text</label>
      <textarea id="rawText" readonly></textarea>
    </div>

  </div>
</div>

<script>
const SUPABASE_URL =
  "https://lqbhafspabtlqeubqxjg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const photoInput = document.getElementById("photoInput");
const preview = document.getElementById("preview");
const readBtn = document.getElementById("readBtn");
const saveBtn = document.getElementById("saveBtn");
const dashboardBtn = document.getElementById("dashboardBtn");

const progress = document.getElementById("progress");
const statusBox = document.getElementById("status");
const rawBox = document.getElementById("rawBox");
const rawText = document.getElementById("rawText");

const vehicleNumber = document.getElementById("vehicleNumber");
const registrationDate = document.getElementById("registrationDate");
const fitnessExpiry = document.getElementById("fitnessExpiry");
const insuranceExpiry = document.getElementById("insuranceExpiry");
const taxExpiry = document.getElementById("taxExpiry");
const puccExpiry = document.getElementById("puccExpiry");
const permitExpiry = document.getElementById("permitExpiry");

let selectedFile = null;

/* ---------------- PHOTO SELECT ---------------- */

photoInput.addEventListener("change", function(){
  selectedFile = this.files[0];

  if(!selectedFile){
    return;
  }

  preview.src = URL.createObjectURL(selectedFile);
  preview.style.display = "block";

  showStatus(
    "Photo selected. Click READ PHOTO.",
    "info"
  );
});

/* ---------------- STATUS ---------------- */

function showStatus(message, type){
  statusBox.textContent = message;
  statusBox.className = "status " + type;
}

/* ---------------- TEXT CLEAN ---------------- */

function normalizeText(text){
  return text
    .replace(/\r/g, "\n")
    .replace(/[ \t]+/g, " ")
    .replace(/\n+/g, "\n")
    .trim();
}

/* ---------------- DATE CONVERSION ---------------- */

function convertOCRDate(value){
  if(!value){
    return "";
  }

  value = value
    .trim()
    .toUpperCase()
    .replace(/\s+/g, "");

  const months = {
    JAN:"01",
    FEB:"02",
    MAR:"03",
    APR:"04",
    MAY:"05",
    JUN:"06",
    JUL:"07",
    AUG:"08",
    SEP:"09",
    OCT:"10",
    NOV:"11",
    DEC:"12"
  };

  const monthDate = value.match(
    /^(\d{1,2})[-\/.]([A-Z]{3})[A-Z]*[-\/.](\d{4})$/i
  );

  if(monthDate){
    const day = monthDate[1].padStart(2,"0");
    const monthCode =
      monthDate[2].substring(0,3).toUpperCase();

    const month = months[monthCode];
    const year = monthDate[3];

    if(month){
      return `${day}/${month}/${year}`;
    }
  }

  const numericDate = value.match(
    /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/
  );

  if(numericDate){
    return (
      numericDate[1].padStart(2,"0") +
      "/" +
      numericDate[2].padStart(2,"0") +
      "/" +
      numericDate[3]
    );
  }

  return "";
}

function findDate(text){
  if(!text){
    return "";
  }

  const monthDate = text.match(
    /\b(\d{1,2})[-\/.\s](JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[A-Z]*[-\/.\s](\d{4})\b/i
  );

  if(monthDate){
    return convertOCRDate(
      monthDate[1] + "-" +
      monthDate[2] + "-" +
      monthDate[3]
    );
  }

  const numericDate = text.match(
    /\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})\b/
  );

  if(numericDate){
    return convertOCRDate(
      numericDate[1] + "/" +
      numericDate[2] + "/" +
      numericDate[3]
    );
  }

  return "";
}

/* ---------------- NEARBY TEXT ---------------- */

function getNearbyText(lines, index){
  return [
    lines[index] || "",
    lines[index + 1] || "",
    lines[index + 2] || "",
    lines[index + 3] || ""
  ].join(" ");
}

/* ---------------- DATE AFTER LABEL ---------------- */

function findDateAfterKeyword(text, keywords){
  const lines = text
    .split(/\n/)
    .map(x => x.trim())
    .filter(Boolean);

  for(let i = 0; i < lines.length; i++){

    const upperLine = lines[i].toUpperCase();

    if(
      keywords.some(keyword =>
        upperLine.includes(keyword)
      )
    ){
      const nearbyText = getNearbyText(lines, i);
      const result = findDate(nearbyText);

      if(result){
        return result;
      }
    }
  }

  return "";
}

/* ---------------- TAX DETECTION ---------------- */

/*
  Gujarat Tax Rules:
  1. Tax Valid UpTo પછી date હોય તો date
  2. Date ન હોય અને LTT હોય તો LTT
  3. LTP ignore
*/

function findTax(text){

  const lines = text
    .split(/\n/)
    .map(x => x.trim())
    .filter(Boolean);

  const taxKeywords = [
    "TAX VALID UPTO",
    "TAX VALID UP TO",
    "TAX VALID",
    "TAX UPTO",
    "TAX UP TO"
  ];

  for(let i = 0; i < lines.length; i++){

    const currentLine = lines[i].toUpperCase();

    const isTaxLine =
      taxKeywords.some(keyword =>
        currentLine.includes(keyword)
      ) ||
      currentLine === "TAX";

    if(!isTaxLine){
      continue;
    }

    const nearbyText = getNearbyText(lines, i);

    /*
      Date ને LTT કરતા પહેલાં priority આપવી
    */
    const dateValue = findDate(nearbyText);

    if(dateValue){
      return dateValue;
    }

    /*
      Date ન હોય ત્યારે માત્ર LTT
    */
    if(/\bLTT\b/i.test(nearbyText)){
      return "LTT";
    }
  }

  return "";
}

/* ---------------- VEHICLE NUMBER CLEAN ---------------- */

function cleanVehicleCandidate(value){

  let v = value
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, "");

  /*
    OCR common mistakes:
    JO -> GJ
    J0 -> GJ
    GO -> GJ
    G0 -> GJ
  */

  if(v.startsWith("JO")){
    v = "GJ" + v.substring(2);
  }
  else if(v.startsWith("J0")){
    v = "GJ" + v.substring(2);
  }
  else if(v.startsWith("GO")){
    v = "GJ" + v.substring(2);
  }
  else if(v.startsWith("G0")){
    v = "GJ" + v.substring(2);
  }

  return v;
}

function isValidGujaratNumber(value){

  const v = cleanVehicleCandidate(value);

  const patterns = [

    // GJ06425038
    /^GJ\d{2}\d{5}$/,

    // GJ06A78397
    /^GJ\d{2}[A-Z]\d{5}$/,

    // GJ05AB1234
    /^GJ\d{1,2}[A-Z]{1,3}\d{3,5}$/,

    // GJ01A1234
    /^GJ\d{2}[A-Z]\d{4}$/,

    // GJ05AB1234
    /^GJ\d{2}[A-Z]{2}\d{4}$/
  ];

  return patterns.some(pattern =>
    pattern.test(v)
  );
}

/* ---------------- VEHICLE NUMBER DETECTION ---------------- */

function findVehicleNumber(text){

  const upperText = text.toUpperCase();

  const lines = upperText
    .split(/\n/)
    .map(x => x.trim())
    .filter(Boolean);

  /*
    First priority:
    Vehicle Number label પછી number
  */

  for(let i = 0; i < lines.length; i++){

    const line = lines[i];

    if(
      line.includes("VEHICLE NUMBER") ||
      line.includes("VEHICLE NO") ||
      line.includes("REGISTRATION NUMBER") ||
      line.includes("REGISTRATION NO")
    ){

      const nearbyText = [
        lines[i],
        lines[i + 1] || "",
        lines[i + 2] || ""
      ].join(" ");

      const candidates =
        nearbyText.match(/\b[A-Z0-9]{8,12}\b/g) || [];

      for(let candidate of candidates){

        candidate = cleanVehicleCandidate(candidate);

        if(isValidGujaratNumber(candidate)){
          return candidate;
        }
      }
    }
  }

  /*
    Second priority:
    Whole OCR text માં search
  */

  const allCandidates =
    upperText.match(/\b[A-Z0-9]{8,12}\b/g) || [];

  for(let candidate of allCandidates){

    candidate = cleanVehicleCandidate(candidate);

    if(isValidGujaratNumber(candidate)){
      return candidate;
    }
  }

  return "";
}

/* ---------------- IMAGE PREPARATION ---------------- */

async function prepareImage(file){

  return new Promise((resolve, reject) => {

    const img = new Image();
    const reader = new FileReader();

    reader.onload = function(event){

      img.onload = function(){

        const maxWidth = 1800;

        let width = img.width;
        let height = img.height;

        if(width > maxWidth){
          height = Math.round(
            height * maxWidth / width
          );

          width = maxWidth;
        }

        const canvas =
          document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        resolve(
          canvas.toDataURL("image/jpeg", 0.92)
        );
      };

      img.onerror = reject;
      img.src = event.target.result;
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- OCR READ ---------------- */

readBtn.addEventListener("click", async function(){

  if(!selectedFile){
    showStatus(
      "Please select a photo first.",
      "error"
    );
    return;
  }

  readBtn.disabled = true;
  progress.style.display = "block";
  progress.textContent = "Reading photo. Please wait...";
  rawBox.style.display = "none";

  try{

    const processedImage =
      await prepareImage(selectedFile);

    const result = await Tesseract.recognize(
      processedImage,
      "eng",
      {
        logger: function(info){

          if(info.status){

            let percentage = "";

            if(info.progress){
              percentage =
                " " +
                Math.round(info.progress * 100) +
                "%";
            }

            progress.textContent =
              info.status + percentage;
          }
        }
      }
    );

    const text =
      normalizeText(result.data.text);

    rawText.value = text;
    rawBox.style.display = "block";

    const vehicle =
      findVehicleNumber(text);

    const regDate =
      findDateAfterKeyword(
        text,
        [
          "REGISTRATION DATE",
          "REGISTERED DATE",
          "REGISTRATION DAT",
          "REG DATE"
        ]
      );

    const fitness =
      findDateAfterKeyword(
        text,
        [
          "FITNESS VALID UPTO",
          "FITNESS VALID UP TO",
          "FITNESS UPTO",
          "FITNESS UP TO"
        ]
      );

    const insurance =
      findDateAfterKeyword(
        text,
        [
          "INSURANCE VALID UPTO",
          "INSURANCE VALID UP TO",
          "INSURANCE UPTO",
          "INSURANCE UP TO"
        ]
      );

    const tax =
      findTax(text);

    const pucc =
      findDateAfterKeyword(
        text,
        [
          "PUCC VALID UPTO",
          "PUCC VALID UP TO",
          "PUC VALID UPTO",
          "PUC VALID UP TO",
          "PUCC VALID",
          "PUC VALID"
        ]
      );

    const permit =
      findDateAfterKeyword(
        text,
        [
          "PERMIT VALID UPTO",
          "PERMIT VALID UP TO",
          "PERMIT UPTO",
          "PERMIT UP TO"
        ]
      );

    if(vehicle){
      vehicleNumber.value = vehicle;
    }

    if(regDate){
      registrationDate.value = regDate;
    }

    if(fitness){
      fitnessExpiry.value = fitness;
    }

    if(insurance){
      insuranceExpiry.value = insurance;
    }

    if(tax){
      taxExpiry.value = tax;
    }

    if(pucc){
      puccExpiry.value = pucc;
    }

    if(permit){
      permitExpiry.value = permit;
    }

    progress.style.display = "none";

    if(vehicle){

      showStatus(
        "Vehicle number detected: " +
        vehicle +
        ". Please check all details before saving.",
        "success"
      );

    }else{

      showStatus(
        "OCR completed. Please check details and enter Vehicle Number manually if needed.",
        "info"
      );
    }

  }catch(error){

    console.error(error);

    progress.style.display = "none";

    showStatus(
      "OCR failed. Please try a clearer photo.",
      "error"
    );
  }

  readBtn.disabled = false;
});

/* ---------------- DATABASE DATE ---------------- */

function convertToDatabaseDate(value){

  if(!value){
    return null;
  }

  value = value.trim();

  /*
    Tax LTT text તરીકે જ રહેશે
  */

  if(value.toUpperCase() === "LTT"){
    return "LTT";
  }

  const parts = value.split("/");

  if(parts.length === 3){

    return (
      parts[2] +
      "-" +
      parts[1] +
      "-" +
      parts[0]
    );
  }

  return value;
}

/* ---------------- PHOTO UPLOAD ---------------- */

async function uploadPhoto(vehicleNo){

  if(!selectedFile){

    return {
      photo_url:null,
      photo_path:null
    };
  }

  const safeName =
    vehicleNo
      .replace(/[^A-Z0-9]/gi, "_")
      .toUpperCase();

  const filePath =
    safeName +
    "_" +
    Date.now() +
    ".jpg";

  const { data, error } =
    await supabaseClient
      .storage
      .from("vehicle-photos")
      .upload(
        filePath,
        selectedFile,
        {
          contentType:"image/jpeg",
          upsert:false
        }
      );

  if(error){
    throw error;
  }

  const { data:publicData } =
    supabaseClient
      .storage
      .from("vehicle-photos")
      .getPublicUrl(filePath);

  return {
    photo_url:publicData.publicUrl,
    photo_path:filePath
  };
}

/* ---------------- SAVE / UPDATE ---------------- */

saveBtn.addEventListener("click", async function(){

  const vNo =
    vehicleNumber.value
      .trim()
      .toUpperCase();

  if(!vNo){

    showStatus(
      "Vehicle Number is required.",
      "error"
    );

    return;
  }

  saveBtn.disabled = true;

  showStatus(
    "Saving vehicle details...",
    "info"
  );

  try{

    const { data:existing, error:findError } =
      await supabaseClient
        .from("vehicles")
        .select("*")
        .eq("vehicle_number", vNo)
        .maybeSingle();

    if(findError){
      throw findError;
    }

    let photo_url =
      existing?.photo_url || null;

    let photo_path =
      existing?.photo_path || null;

    /*
      New photo upload અને old photo delete
    */

    if(selectedFile){

      const uploaded =
        await uploadPhoto(vNo);

      photo_url =
        uploaded.photo_url;

      photo_path =
        uploaded.photo_path;

      if(existing && existing.photo_path){

        await supabaseClient
          .storage
          .from("vehicle-photos")
          .remove([
            existing.photo_path
          ]);
      }
    }

    const vehicleData = {

      vehicle_number:vNo,

      registration_date:
        convertToDatabaseDate(
          registrationDate.value
        ),

      fitness_expiry:
        convertToDatabaseDate(
          fitnessExpiry.value
        ),

      insurance_expiry:
        convertToDatabaseDate(
          insuranceExpiry.value
        ),

      tax_expiry:
        taxExpiry.value.trim() || null,

      pucc_expiry:
        convertToDatabaseDate(
          puccExpiry.value
        ),

      permit_expiry:
        convertToDatabaseDate(
          permitExpiry.value
        ),

      photo_url:photo_url,

      photo_path:photo_path
    };

    if(existing){

      const { error:updateError } =
        await supabaseClient
          .from("vehicles")
          .update(vehicleData)
          .eq("id", existing.id);

      if(updateError){
        throw updateError;
      }

      showStatus(
        "Vehicle updated successfully. Old photo replaced.",
        "success"
      );

    }else{

      const { error:insertError } =
        await supabaseClient
          .from("vehicles")
          .insert([
            vehicleData
          ]);

      if(insertError){
        throw insertError;
      }

      showStatus(
        "Vehicle saved successfully.",
        "success"
      );
    }

    selectedFile = null;
    photoInput.value = "";
    preview.style.display = "none";

  }catch(error){

    console.error(error);

    showStatus(
      "Save failed: " +
      error.message,
      "error"
    );
  }

  saveBtn.disabled = false;
});

/* ---------------- DASHBOARD ---------------- */

dashboardBtn.addEventListener("click", function(){

  window.location.href = "index.html";

});
</script>

</body>
</html>
