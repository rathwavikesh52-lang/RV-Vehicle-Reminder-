<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RV Vehicle Reminder - Upload</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    margin-top:0;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    margin-top:15px;
    border:0;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

#readButton{
    background:#1976d2;
    color:white;
}

#saveButton{
    background:#2e7d32;
    color:white;
}

#dashboardButton{
    background:#555;
    color:white;
}

button:disabled{
    opacity:.5;
}

.preview{
    width:100%;
    max-height:350px;
    object-fit:contain;
    margin-top:15px;
    border-radius:10px;
    display:none;
    background:#eee;
}

.progressBox{
    display:none;
    margin-top:18px;
}

.progress{
    width:100%;
    height:18px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.progressBar{
    height:100%;
    width:0%;
    background:#1976d2;
    transition:width .3s;
}

.status{
    margin-top:10px;
    text-align:center;
    font-weight:bold;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;
}

.success{
    background:#e8f5e9;
    color:#1b5e20;
}

.error{
    background:#ffebee;
    color:#b71c1c;
}

.small{
    color:#666;
    font-size:13px;
    margin-top:8px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🚗 RV Vehicle Reminder</h1>

<label>Select Vehicle Photo</label>

<input
    type="file"
    id="photoInput"
    accept="image/*"
>

<div class="small">
Upload a clear VAHAN / vehicle details screenshot or photo.
</div>

<img
    id="preview"
    class="preview"
>

<button id="readButton">
📷 READ PHOTO
</button>

<div id="progressBox" class="progressBox">

    <div class="progress">
        <div id="progressBar" class="progressBar"></div>
    </div>

    <div id="ocrStatus" class="status">
        Waiting...
    </div>

</div>

<hr style="margin:25px 0;">

<h3>Vehicle Details</h3>

<label>Vehicle Number</label>
<input
    type="text"
    id="vehicleNumber"
    placeholder="GJ01AB1234"
>

<label>Registration Date</label>
<input
    type="date"
    id="registrationDate"
>

<label>Fitness Expiry</label>
<input
    type="date"
    id="fitnessExpiry"
>

<label>Insurance Expiry</label>
<input
    type="date"
    id="insuranceExpiry"
>

<label>Tax</label>
<input
    type="text"
    id="taxExpiry"
    placeholder="LTT / LTP"
>

<label>PUCC Expiry</label>
<input
    type="date"
    id="puccExpiry"
>

<label>Permit Expiry</label>
<input
    type="date"
    id="permitExpiry"
>

<button id="saveButton">
💾 SAVE VEHICLE
</button>

<button id="dashboardButton">
📋 GO TO DASHBOARD
</button>

<div id="successMessage" class="message success"></div>

<div id="errorMessage" class="message error"></div>

</div>
</div>


<script>

"use strict";

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
"https://lqbhafspabtlqeubqxjg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";

const STORAGE_BUCKET =
"vehicle-photos";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==============================
   ELEMENTS
============================== */

const photoInput =
document.getElementById("photoInput");

const preview =
document.getElementById("preview");

const readButton =
document.getElementById("readButton");

const saveButton =
document.getElementById("saveButton");

const dashboardButton =
document.getElementById("dashboardButton");

const progressBox =
document.getElementById("progressBox");

const progressBar =
document.getElementById("progressBar");

const ocrStatus =
document.getElementById("ocrStatus");

const successMessage =
document.getElementById("successMessage");

const errorMessage =
document.getElementById("errorMessage");

const vehicleNumber =
document.getElementById("vehicleNumber");

const registrationDate =
document.getElementById("registrationDate");

const fitnessExpiry =
document.getElementById("fitnessExpiry");

const insuranceExpiry =
document.getElementById("insuranceExpiry");

const taxExpiry =
document.getElementById("taxExpiry");

const puccExpiry =
document.getElementById("puccExpiry");

const permitExpiry =
document.getElementById("permitExpiry");


/* ==============================
   VARIABLES
============================== */

let selectedFile = null;
let existingVehicle = null;


/* ==============================
   MESSAGE
============================== */

function hideMessages(){

    successMessage.style.display = "none";
    errorMessage.style.display = "none";

}

function showSuccess(message){

    hideMessages();

    successMessage.innerText = message;

    successMessage.style.display = "block";

}

function showError(message){

    hideMessages();

    errorMessage.innerText = message;

    errorMessage.style.display = "block";

}


/* ==============================
   PHOTO PREVIEW
============================== */

photoInput.addEventListener(
"change",
function(){

    hideMessages();

    if(!photoInput.files.length){

        preview.style.display = "none";

        selectedFile = null;

        return;

    }

    selectedFile =
    photoInput.files[0];

    const url =
    URL.createObjectURL(selectedFile);

    preview.src = url;

    preview.style.display = "block";

});


/* ==============================
   IMAGE PREPARATION
============================== */

function prepareImage(file){

    return new Promise(
    function(resolve,reject){

        const image =
        new Image();

        const objectURL =
        URL.createObjectURL(file);

        image.onload =
        function(){

            try{

                let width =
                image.naturalWidth;

                let height =
                image.naturalHeight;

                const MAX_WIDTH = 1600;

                if(width > MAX_WIDTH){

                    const ratio =
                    MAX_WIDTH / width;

                    width =
                    Math.round(width * ratio);

                    height =
                    Math.round(height * ratio);

                }

                const canvas =
                document.createElement("canvas");

                canvas.width = width;
                canvas.height = height;

                const ctx =
                canvas.getContext("2d");

                ctx.drawImage(
                    image,
                    0,
                    0,
                    width,
                    height
                );

                canvas.toBlob(
                    function(blob){

                        URL.revokeObjectURL(objectURL);

                        if(!blob){

                            reject(
                                new Error(
                                    "Image processing failed."
                                )
                            );

                            return;

                        }

                        resolve(blob);

                    },
                    "image/jpeg",
                    0.85
                );

            }catch(error){

                URL.revokeObjectURL(objectURL);

                reject(error);

            }

        };

        image.onerror =
        function(){

            URL.revokeObjectURL(objectURL);

            reject(
                new Error(
                    "Unable to open image."
                )
            );

        };

        image.src = objectURL;

    });

}


/* ==============================
   DATE CONVERSION
============================== */

function convertDateToInput(value){

    if(!value){
        return "";
    }

    value =
    value.trim();

    let match;

    /* DD-MM-YYYY */

    match =
    value.match(
        /(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/
    );

    if(match){

        let day =
        match[1].padStart(2,"0");

        let month =
        match[2].padStart(2,"0");

        let year =
        match[3];

        return `${year}-${month}-${day}`;

    }


    /* DD-MMM-YYYY */

    match =
    value.match(
        /(\d{1,2})[-\s](JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[A-Z]*[-\s](\d{4})/i
    );

    if(match){

        const months = {

            JAN:"01",
            FEB:"02",
            MAR:"03",
            APR:"04",
            MAY:"05",
            JUN:"06",
            JUL:"07",
            AUG:"08",
            SEP:"09",
            OCT:"10",
            NOV:"11",
            DEC:"12"

        };

        const day =
        match[1].padStart(2,"0");

        const month =
        months[
            match[2].substring(0,3).toUpperCase()
        ];

        const year =
        match[3];

        return `${year}-${month}-${day}`;

    }

    return "";

}


/* ==============================
   VEHICLE NUMBER
============================== */

function findVehicleNumber(text){

    const clean =
    text
    .toUpperCase()
    .replace(/\s+/g," ");

    const patterns = [

        /\b[A-Z]{2}\s?\d{1,2}\s?[A-Z]{1,3}\s?\d{3,4}\b/g,

        /\b[A-Z]{2}\d{1,2}[A-Z]{1,3}\d{3,4}\b/g

    ];

    for(
        const pattern of patterns
    ){

        const matches =
        clean.match(pattern);

        if(matches && matches.length){

            return matches[0]
            .replace(/\s/g,"")
            .trim();

        }

    }

    return "";

}


/* ==============================
   FIND DATE AFTER KEYWORD
============================== */

function findDateAfterKeyword(
    text,
    keywords
){

    const lines =
    text
    .toUpperCase()
    .split(/\n+/);

    for(
        let i=0;
        i<lines.length;
        i++
    ){

        const line =
        lines[i];

        let found = false;

        for(
            const keyword of keywords
        ){

            if(
                line.includes(
                    keyword
                )
            ){

                found = true;

                break;

            }

        }

        if(!found){
            continue;
        }


        /* Same line */

        let match =
        line.match(
            /(\d{1,2}[-\/\s](?:\d{1,2}|JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[-\/\s]\d{4})/i
        );

        if(match){

            return convertDateToInput(
                match[1]
            );

        }


        /* Next lines */

        for(
            let j=i+1;
            j<Math.min(i+4,lines.length);
            j++
        ){

            match =
            lines[j].match(
                /(\d{1,2}[-\/\s](?:\d{1,2}|JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[-\/\s]\d{4})/i
            );

            if(match){

                return convertDateToInput(
                    match[1]
                );

            }

        }

    }

    return "";

}


/* ==============================
   FIND TAX
============================== */

function findTax(text){

    const upper =
    text.toUpperCase();

    if(
        /\bLTT\b/.test(upper)
    ){

        return "LTT";

    }

    if(
        /\bLTP\b/.test(upper)
    ){

        return "LTP";

    }

    return "";

}


/* ==============================
   OCR
============================== */

async function readPhoto(){

    hideMessages();

    if(!selectedFile){

        showError(
            "Please select a vehicle photo first."
        );

        return;

    }

    readButton.disabled = true;

    progressBox.style.display = "block";

    progressBar.style.width = "5%";

    ocrStatus.innerText =
    "Starting OCR...";


    try{

        /* STEP 1 */

        ocrStatus.innerText =
        "Preparing photo...";

        progressBar.style.width =
        "10%";

        const image =
        await prepareImage(
            selectedFile
        );


        /* STEP 2 */

        if(
            typeof Tesseract ===
            "undefined"
        ){

            throw new Error(
                "OCR library did not load. Please refresh the page."
            );

        }


        ocrStatus.innerText =
        "Loading OCR engine...";

        progressBar.style.width =
        "20%";


        /* STEP 3 */

        const result =
        await Tesseract.recognize(
            image,
            "eng",
            {

                logger:
                function(info){

                    if(
                        info.status ===
                        "recognizing text"
                    ){

                        const percent =
                        Math.round(
                            info.progress * 100
                        );

                        progressBar.style.width =
                        (
                            20 +
                            Math.round(
                                percent * 0.8
                            )
                        ) + "%";

                        ocrStatus.innerText =
                        "Reading photo... " +
                        percent +
                        "%";

                    }

                    else if(info.status){

                        ocrStatus.innerText =
                        info.status;

                    }

                }

            }
        );


        /* STEP 4 */

        ocrStatus.innerText =
        "Processing result...";

        progressBar.style.width =
        "95%";


        const text =
        result.data.text || "";


        console.log(
            "OCR TEXT:",
            text
        );


        /* VEHICLE */

        const vehicle =
        findVehicleNumber(text);

        if(vehicle){

            vehicleNumber.value =
            vehicle;

        }


        /* REGISTRATION */

        const regDate =
        findDateAfterKeyword(
            text,
            [
                "REGISTRATION DATE",
                "REGISTRATION",
                "REG DATE"
            ]
        );

        if(regDate){

            registrationDate.value =
            regDate;

        }


        /* FITNESS */

        const fitness =
        findDateAfterKeyword(
            text,
            [
                "FITNESS",
                "FITNESS VALID",
                "FITNESS UPTO",
                "FITNESS VALID UPTO"
            ]
        );

        if(fitness){

            fitnessExpiry.value =
            fitness;

        }


        /* INSURANCE */

        const insurance =
        findDateAfterKeyword(
            text,
            [
                "INSURANCE",
                "INSURANCE VALID",
                "INSURANCE UPTO",
                "INS VALID"
            ]
        );

        if(insurance){

            insuranceExpiry.value =
            insurance;

        }


        /* PUCC */

        const pucc =
        findDateAfterKeyword(
            text,
            [
                "PUCC",
                "PUC",
                "POLLUTION",
                "PUCC VALID"
            ]
        );

        if(pucc){

            puccExpiry.value =
            pucc;

        }


        /* PERMIT */

        const permit =
        findDateAfterKeyword(
            text,
            [
                "PERMIT",
                "PERMIT VALID",
                "PERMIT UPTO"
            ]
        );

        if(permit){

            permitExpiry.value =
            permit;

        }


        /* TAX */

        const tax =
        findTax(text);

        if(tax){

            taxExpiry.value =
            tax;

        }


        progressBar.style.width =
        "100%";

        ocrStatus.innerText =
        "✅ OCR completed. Please check the details.";


        if(!vehicle){

            showError(
                "OCR completed, but vehicle number was not detected. Please enter it manually."
            );

        }

    }
    catch(error){

        console.error(
            "OCR ERROR:",
            error
        );

        ocrStatus.innerText =
        "❌ OCR failed.";

        showError(
            "OCR Error: " +
            (
                error.message ||
                "Unknown error"
            )
        );

    }
    finally{

        readButton.disabled =
        false;

    }

}


/* ==============================
   FILE PATH
============================== */

function createPhotoPath(
    vehicle
){

    const clean =
    vehicle
    .toUpperCase()
    .replace(
        /[^A-Z0-9]/g,
        ""
    );

    return (
        clean +
        "_" +
        Date.now() +
        ".jpg"
    );

}


/* ==============================
   DELETE OLD PHOTO
============================== */

async function deleteOldPhoto(
    path
){

    if(!path){

        return;

    }

    try{

        await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .remove([
            path
        ]);

    }
    catch(error){

        console.log(
            "Old photo delete error:",
            error
        );

    }

}


/* ==============================
   SAVE VEHICLE
============================== */

async function saveVehicle(){

    hideMessages();

    const number =
    vehicleNumber.value
    .trim()
    .toUpperCase()
    .replace(/\s/g,"");


    if(!number){

        showError(
            "Vehicle Number is required."
        );

        return;

    }


    if(!selectedFile){

        showError(
            "Please select vehicle photo."
        );

        return;

    }


    saveButton.disabled =
    true;

    saveButton.innerText =
    "Saving...";


    try{

        /* FIND EXISTING VEHICLE */

        const {
            data: oldVehicle,
            error: findError
        } =
        await supabaseClient
        .from("vehicles")
        .select("*")
        .eq(
            "vehicle_number",
            number
        )
        .maybeSingle();


        if(findError){

            throw findError;

        }


        /* CREATE PHOTO PATH */

        const photoPath =
        createPhotoPath(
            number
        );


        /* PREPARE PHOTO */

        const photo =
        await prepareImage(
            selectedFile
        );


        /* UPLOAD NEW PHOTO */

        const {
            error:uploadError
        } =
        await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .upload(
            photoPath,
            photo,
            {
                contentType:
                "image/jpeg",

                upsert:false
            }
        );


        if(uploadError){

            throw uploadError;

        }


        /* PUBLIC URL */

        const {
            data:urlData
        } =
        supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .getPublicUrl(
            photoPath
        );


        const photoURL =
        urlData.publicUrl;


        /* VEHICLE DATA */

        const vehicleData = {

            vehicle_number:
            number,

            registration_date:
            registrationDate.value ||
            null,

            fitness_expiry:
            fitnessExpiry.value ||
            null,

            insurance_expiry:
            insuranceExpiry.value ||
            null,

            tax_expiry:
            taxExpiry.value.trim() ||
            null,

            pucc_expiry:
            puccExpiry.value ||
            null,

            permit_expiry:
            permitExpiry.value ||
            null,

            photo_url:
            photoURL,

            photo_path:
            photoPath

        };


        /* UPDATE EXISTING */

        if(oldVehicle){

            const {
                error:updateError
            } =
            await supabaseClient
            .from("vehicles")
            .update(
                vehicleData
            )
            .eq(
                "id",
                oldVehicle.id
            );


            if(updateError){

                /* DELETE NEW PHOTO IF DB UPDATE FAILS */

                await deleteOldPhoto(
                    photoPath
                );

                throw updateError;

            }


            /* DELETE OLD PHOTO */

            if(
                oldVehicle.photo_path &&
                oldVehicle.photo_path !==
                photoPath
            ){

                await deleteOldPhoto(
                    oldVehicle.photo_path
                );

            }


            showSuccess(
                "Vehicle updated successfully. Old photo replaced."
            );

        }

        /* INSERT NEW */

        else{

            const {
                error:insertError
            } =
            await supabaseClient
            .from("vehicles")
            .insert(
                vehicleData
            );


            if(insertError){

                await deleteOldPhoto(
                    photoPath
                );

                throw insertError;

            }


            showSuccess(
                "Vehicle saved successfully."
            );

        }


        existingVehicle =
        null;

    }
    catch(error){

        console.error(
            "SAVE ERROR:",
            error
        );

        showError(
            "Save Error: " +
            (
                error.message ||
                "Unknown error"
            )
        );

    }
    finally{

        saveButton.disabled =
        false;

        saveButton.innerText =
        "💾 SAVE VEHICLE";

    }

}


/* ==============================
   BUTTONS
============================== */

readButton.addEventListener(
    "click",
    readPhoto
);

saveButton.addEventListener(
    "click",
    saveVehicle
);

dashboardButton.addEventListener(
    "click",
    function(){

        window.location.href =
        "index.html";

    }
);


/* ==============================
   PAGE READY
============================== */

console.log(
    "RV Vehicle Reminder upload page loaded successfully."
);

</script>

</body>
