/* =========================================
   IMAGE PREPARATION
========================================= */

function prepareImage(file){

    return new Promise(
    function(resolve,reject){

        const image =
        new Image();

        const objectURL =
        URL.createObjectURL(file);

        image.onload =
        function(){

            try{

                let width =
                image.naturalWidth;

                let height =
                image.naturalHeight;

                const MAX_WIDTH =
                1800;

                if(width > MAX_WIDTH){

                    const ratio =
                    MAX_WIDTH / width;

                    width =
                    Math.round(
                        width * ratio
                    );

                    height =
                    Math.round(
                        height * ratio
                    );

                }

                const canvas =
                document.createElement(
                    "canvas"
                );

                canvas.width =
                width;

                canvas.height =
                height;

                const ctx =
                canvas.getContext("2d");

                ctx.drawImage(
                    image,
                    0,
                    0,
                    width,
                    height
                );

                canvas.toBlob(
                function(blob){

                    URL.revokeObjectURL(
                        objectURL
                    );

                    if(!blob){

                        reject(
                            new Error(
                                "Image processing failed."
                            )
                        );

                        return;

                    }

                    resolve(blob);

                },
                "image/jpeg",
                0.9);

            }
            catch(error){

                URL.revokeObjectURL(
                    objectURL
                );

                reject(error);

            }

        };


        image.onerror =
        function(){

            URL.revokeObjectURL(
                objectURL
            );

            reject(
                new Error(
                    "Unable to open image."
                )
            );

        };


        image.src =
        objectURL;

    });

}


/* =========================================
   OCR VEHICLE NUMBER CLEANING
========================================= */

function cleanVehicleCandidate(value){

    let v =
    value
    .toUpperCase()
    .replace(
        /[^A-Z0-9]/g,
        ""
    );


    /*
       OCR COMMON ERRORS
    */

    if(v.length >= 8){

        /*
           Gujarat registration starts with GJ
        */

        if(
            v.startsWith("GI") ||
            v.startsWith("G1") ||
            v.startsWith("GJ")
        ){

            v =
            "GJ" +
            v.substring(2);

        }

    }


    return v;

}


/* =========================================
   VEHICLE NUMBER VALIDATION
========================================= */

function isVehicleNumber(value){

    const v =
    cleanVehicleCandidate(
        value
    );


    return /^[A-Z]{2}\d{1,2}[A-Z]{1,3}\d{3,4}$/
    .test(v);

}


/* =========================================
   FIND VEHICLE NUMBER
========================================= */

function findVehicleNumber(text){

    let upper =
    text.toUpperCase();


    /*
       Convert common OCR mistakes
       around Gujarat number plates.
    */

    upper =
    upper
    .replace(/[|]/g,"I")
    .replace(/[“”"]/g," ")
    .replace(/[.,:;]/g," ");


    /*
       FIRST:
       Look for complete number
    */

    const completePatterns = [

        /\bGJ\d{1,2}[A-Z]{1,3}\d{3,4}\b/g,

        /\bGJ\s*\d{1,2}\s*[A-Z]{1,3}\s*\d{3,4}\b/g,

        /\bGJ[-\s]?\d{1,2}[-\s]?[A-Z]{1,3}[-\s]?\d{3,4}\b/g,

        /\b[A-Z]{2}\d{1,2}[A-Z]{1,3}\d{3,4}\b/g,

        /\b[A-Z]{2}\s+\d{1,2}\s+[A-Z]{1,3}\s+\d{3,4}\b/g

    ];


    for(
        const pattern of completePatterns
    ){

        const matches =
        upper.match(pattern);


        if(
            matches &&
            matches.length
        ){

            for(
                const item of matches
            ){

                const candidate =
                cleanVehicleCandidate(
                    item
                );


                if(
                    isVehicleNumber(
                        candidate
                    )
                ){

                    return candidate;

                }

            }

        }

    }


    /*
       SECOND:
       Search line-by-line.
       This helps when OCR inserts
       strange spaces.
    */

    const lines =
    upper.split(/\n+/);


    for(
        const line of lines
    ){

        const compact =
        line
        .replace(
            /[^A-Z0-9]/g,
            ""
        );


        /*
           Try normal candidate.
        */

        for(
            let start=0;
            start<compact.length;
            start++
        ){

            const part =
            compact.substring(
                start,
                start + 12
            );


            if(
                isVehicleNumber(
                    part
                )
            ){

                return cleanVehicleCandidate(
                    part
                );

            }

        }

    }


    /*
       THIRD:
       Search for:
       GJ + RTO + SERIES + NUMBER
    */

    const loose =
    upper
    .replace(
        /[^A-Z0-9]/g,
        " "
    )
    .split(/\s+/)
    .filter(Boolean);


    for(
        let i=0;
        i<loose.length;
        i++
    ){

        if(
            loose[i] === "GJ" &&
            loose[i+1] &&
            loose[i+2] &&
            loose[i+3]
        ){

            const candidate =
            "GJ" +
            loose[i+1] +
            loose[i+2] +
            loose[i+3];


            if(
                isVehicleNumber(
                    candidate
                )
            ){

                return cleanVehicleCandidate(
                    candidate
                );

            }

        }

    }


    return "";

}


/* =========================================
   DATE CONVERSION
========================================= */

function convertDateToInput(value){

    if(!value){

        return "";

    }


    value =
    value.trim();


    let match;


    /*
       DD-MM-YYYY
       DD/MM/YYYY
    */

    match =
    value.match(
        /(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/
    );


    if(match){

        const day =
        match[1].padStart(
            2,
            "0"
        );

        const month =
        match[2].padStart(
            2,
            "0"
        );

        const year =
        match[3];


        return (
            year +
            "-" +
            month +
            "-" +
            day
        );

    }


    /*
       DD-MMM-YYYY
    */

    match =
    value.match(
        /(\d{1,2})[-\s](JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[A-Z]*[-\s](\d{4})/i
    );


    if(match){

        const months = {

            JAN:"01",
            FEB:"02",
            MAR:"03",
            APR:"04",
            MAY:"05",
            JUN:"06",
            JUL:"07",
            AUG:"08",
            SEP:"09",
            OCT:"10",
            NOV:"11",
            DEC:"12"

        };


        const day =
        match[1].padStart(
            2,
            "0"
        );


        const month =
        months[
            match[2]
            .substring(0,3)
            .toUpperCase()
        ];


        const year =
        match[3];


        return (
            year +
            "-" +
            month +
            "-" +
            day
        );

    }


    return "";

}


/* =========================================
   FIND DATE
========================================= */

function findDateAfterKeyword(
    text,
    keywords
){

    const lines =
    text
    .toUpperCase()
    .split(/\n+/);


    for(
        let i=0;
        i<lines.length;
        i++
    ){

        const line =
        lines[i];


        let found =
        false;


        for(
            const keyword of keywords
        ){

            if(
                line.includes(
                    keyword
                )
            ){

                found = true;

                break;

            }

        }


        if(!found){

            continue;

        }


        /*
           Search same line
        */

        let match =
        line.match(
            /(\d{1,2}[-\/\s](?:\d{1,2}|JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[-\/\s]\d{4})/i
        );


        if(match){

            const date =
            convertDateToInput(
                match[1]
            );


            if(date){

                return date;

            }

        }


        /*
           Search next 4 lines
        */

        for(
            let j=i+1;
            j<Math.min(
                i+5,
                lines.length
            );
            j++
        ){

            match =
            lines[j].match(
                /(\d{1,2}[-\/\s](?:\d{1,2}|JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[-\/\s]\d{4})/i
            );


            if(match){

                const date =
                convertDateToInput(
                    match[1]
                );


                if(date){

                    return date;

                }

            }

        }

    }


    return "";

}


/* =========================================
   FIND TAX
========================================= */

function findTax(text){

    const upper =
    text.toUpperCase();


    if(
        /\bLTT\b/.test(
            upper
        )
    ){

        return "LTT";

    }


    if(
        /\bLTP\b/.test(
            upper
        )
    ){

        return "LTP";

    }


    return "";

}


/* =========================================
   OCR
========================================= */

async function readPhoto(){

    hideMessages();


    if(!selectedFile){

        showError(
            "Please select a vehicle photo first."
        );

        return;

    }


    readButton.disabled =
    true;


    progressBox.style.display =
    "block";


    progressBar.style.width =
    "5%";


    ocrStatus.innerText =
    "Starting OCR...";


    try{

        /*
           PREPARE
        */

        ocrStatus.innerText =
        "Preparing photo...";


        progressBar.style.width =
        "10%";


        const image =
        await prepareImage(
            selectedFile
        );


        /*
           CHECK OCR LIBRARY
        */

        if(
            typeof Tesseract ===
            "undefined"
        ){

            throw new Error(
                "OCR library did not load. Please refresh the page."
            );

        }


        /*
           START OCR
        */

        ocrStatus.innerText =
        "Loading OCR engine...";


        progressBar.style.width =
        "20%";


        const result =
        await Tesseract.recognize(
            image,
            "eng",
            {

                logger:
                function(info){

                    if(
                        info.status ===
                        "recognizing text"
                    ){

                        const percent =
                        Math.round(
                            info.progress * 100
                        );


                        progressBar.style.width =
                        (
                            20 +
                            Math.round(
                                percent * 0.8
                            )
                        ) +
                        "%";


                        ocrStatus.innerText =
                        "Reading photo... " +
                        percent +
                        "%";

                    }
                    else if(
                        info.status
                    ){

                        ocrStatus.innerText =
                        info.status;

                    }

                }

            }
        );


        /*
           OCR TEXT
        */

        const text =
        result.data.text ||
        "";


        console.log(
            "OCR RESULT:",
            text
        );


        /*
           SHOW RAW OCR FOR DEBUGGING
        */

        rawText.innerText =
        "OCR TEXT:\n\n" +
        text;

        rawText.style.display =
        "block";


        ocrStatus.innerText =
        "Finding vehicle details...";


        progressBar.style.width =
        "92%";


        /*
           VEHICLE NUMBER
        */

        const number =
        findVehicleNumber(
            text
        );


        if(number){

            vehicleNumber.value =
            number;

        }


        /*
           REGISTRATION
        */

        const regDate =
        findDateAfterKeyword(
            text,
            [
                "REGISTRATION DATE",
                "REGISTRATION",
                "REG DATE"
            ]
        );


        if(regDate){

            registrationDate.value =
            regDate;

        }


        /*
           FITNESS
        */

        const fitness =
        findDateAfterKeyword(
            text,
            [
                "FITNESS VALID UPTO",
                "FITNESS UPTO",
                "FITNESS VALID",
                "FITNESS"
            ]
        );


        if(fitness){

            fitnessExpiry.value =
            fitness;

        }


        /*
           INSURANCE
        */

        const insurance =
        findDateAfterKeyword(
            text,
            [
                "INSURANCE VALID UPTO",
                "INSURANCE UPTO",
                "INSURANCE VALID",
                "INSURANCE",
                "INS VALID"
            ]
        );


        if(insurance){

            insuranceExpiry.value =
            insurance;

        }


        /*
           PUCC
        */

        const pucc =
        findDateAfterKeyword(
            text,
            [
                "PUCC VALID UPTO",
                "PUCC",
                "PUC",
                "POLLUTION"
            ]
        );


        if(pucc){

            puccExpiry.value =
            pucc;

        }


        /*
           PERMIT
        */

        const permit =
        findDateAfterKeyword(
            text,
            [
                "PERMIT VALID UPTO",
                "PERMIT UPTO",
                "PERMIT VALID",
                "PERMIT"
            ]
        );


        if(permit){

            permitExpiry.value =
            permit;

        }


        /*
           TAX
        */

        const tax =
        findTax(
            text
        );


        if(tax){

            taxExpiry.value =
            tax;

        }


        progressBar.style.width =
        "100%";


        ocrStatus.innerText =
        "✅ OCR completed. Please check the details.";


        if(number){

            showSuccess(
                "Vehicle number detected: " +
                number
            );

        }
        else{

            showError(
                "OCR completed, but vehicle number was not detected. You can enter it manually."
            );

        }

    }
    catch(error){

        console.error(
            "OCR ERROR:",
            error
        );


        ocrStatus.innerText =
        "❌ OCR failed.";


        showError(
            "OCR Error: " +
            (
                error.message ||
                "Unknown error"
            )
        );

    }
    finally{

        readButton.disabled =
        false;

    }

}


/* =========================================
   PHOTO PATH
========================================= */

function createPhotoPath(
    vehicle
){

    const clean =
    vehicle
    .toUpperCase()
    .replace(
        /[^A-Z0-9]/g,
        ""
    );


    return (
        clean +
        "_" +
        Date.now() +
        ".jpg"
    );

}


/* =========================================
   DELETE OLD PHOTO
========================================= */

async function deleteOldPhoto(
    path
){

    if(!path){

        return;

    }


    try{

        await supabaseClient
        .storage
        .from(
            STORAGE_BUCKET
        )
        .remove([
            path
        ]);

    }
    catch(error){

        console.log(
            "Old photo delete error:",
            error
        );

    }

}


/* =========================================
   SAVE VEHICLE
========================================= */

async function saveVehicle(){

    hideMessages();


    const number =
    vehicleNumber.value
    .trim()
    .toUpperCase()
    .replace(
        /\s/g,
        ""
    );


    if(!number){

        showError(
            "Vehicle Number is required."
        );

        return;

    }


    if(!selectedFile){

        showError(
            "Please select vehicle photo."
        );

        return;

    }


    saveButton.disabled =
    true;


    saveButton.innerText =
    "Saving...";


    try{

        /*
           FIND EXISTING VEHICLE
        */

        const {
            data:oldVehicle,
            error:findError
        } =
        await supabaseClient
        .from("vehicles")
        .select("*")
        .eq(
            "vehicle_number",
            number
        )
        .maybeSingle();


        if(findError){

            throw findError;

        }


        /*
           PHOTO PATH
        */

        const photoPath =
        createPhotoPath(
            number
        );


        /*
           PREPARE PHOTO
        */

        const photo =
        await prepareImage(
            selectedFile
        );


        /*
           UPLOAD
        */

        const {
            error:uploadError
        } =
        await supabaseClient
        .storage
        .from(
            STORAGE_BUCKET
        )
        .upload(
            photoPath,
            photo,
            {
                contentType:
                "image/jpeg",

                upsert:false
            }
        );


        if(uploadError){

            throw uploadError;

        }


        /*
           PUBLIC URL
        */

        const {
            data:urlData
        } =
        supabaseClient
        .storage
        .from(
            STORAGE_BUCKET
        )
        .getPublicUrl(
            photoPath
        );


        const photoURL =
        urlData.publicUrl;


        /*
           DATA
        */

        const vehicleData = {

            vehicle_number:
            number,

            registration_date:
            registrationDate.value ||
            null,

            fitness_expiry:
            fitnessExpiry.value ||
            null,

            insurance_expiry:
            insuranceExpiry.value ||
            null,

            tax_expiry:
            taxExpiry.value.trim() ||
            null,

            pucc_expiry:
            puccExpiry.value ||
            null,

            permit_expiry:
            permitExpiry.value ||
            null,

            photo_url:
            photoURL,

            photo_path:
            photoPath

        };


        /*
           UPDATE
        */

        if(oldVehicle){

            const {
                error:updateError
            } =
            await supabaseClient
            .from("vehicles")
            .update(
                vehicleData
            )
            .eq(
                "id",
                oldVehicle.id
            );


            if(updateError){

                await deleteOldPhoto(
                    photoPath
                );

                throw updateError;

            }


            /*
               DELETE OLD PHOTO
            */

            if(
                oldVehicle.photo_path &&
                oldVehicle.photo_path !==
                photoPath
            ){

                await deleteOldPhoto(
                    oldVehicle.photo_path
                );

            }


            showSuccess(
                "Vehicle updated successfully. Old photo replaced."
            );

        }

        /*
           INSERT
        */

        else{

            const {
                error:insertError
            } =
            await supabaseClient
            .from("vehicles")
            .insert(
                vehicleData
            );


            if(insertError){

                await deleteOldPhoto(
                    photoPath
                );

                throw insertError;

            }


            showSuccess(
                "Vehicle saved successfully."
            );

        }

    }
    catch(error){

        console.error(
            "SAVE ERROR:",
            error
        );


        showError(
            "Save Error: " +
            (
                error.message ||
                "Unknown error"
            )
        );

    }
    finally{

        saveButton.disabled =
        false;


        saveButton.innerText =
        "💾 SAVE VEHICLE";

    }

}


/* =========================================
   BUTTONS
========================================= */

readButton.addEventListener(
    "click",
    readPhoto
);


saveButton.addEventListener(
    "click",
    saveVehicle
);


dashboardButton.addEventListener(
    "click",
    function(){

        window.location.href =
        "index.html";

    }
);


/* =========================================
   READY
========================================= */

console.log(
    "RV Vehicle Reminder upload.html loaded."
);

</script>
