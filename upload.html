/* =========================================================
   OCR SINGLE PASS
========================================================= */

async function ocrSinglePass(
  image,
  worker,
  psm="6"
){

  try{

    await worker.setParameters({

      tessedit_pageseg_mode:
        psm,

      preserve_interword_spaces:
        "1"

    });

  }catch(e){

    console.warn(
      "PSM set error",
      e
    );

  }

  const result =
    await worker.recognize(
      image
    );

  return (
    result &&
    result.data &&
    result.data.text
  ) || "";

}


/* =========================================================
   OCR
========================================================= */

async function runOCR(
  image
){

  const worker =
    await Tesseract.createWorker(
      "eng"
    );

  let outputs = [];

  try{

    setStatus(
      "OCR Pass 1/5 running..."
    );

    outputs.push(
      await ocrSinglePass(
        image,
        worker,
        "6"
      )
    );


    setStatus(
      "OCR Pass 2/5 running..."
    );

    outputs.push(
      await ocrSinglePass(
        image,
        worker,
        "11"
      )
    );


    setStatus(
      "OCR Pass 3/5 running..."
    );

    outputs.push(
      await ocrSinglePass(
        image,
        worker,
        "6"
      )
    );


    setStatus(
      "OCR Pass 4/5 running..."
    );

    outputs.push(
      await ocrSinglePass(
        image,
        worker,
        "11"
      )
    );


    setStatus(
      "OCR Pass 5/5 running..."
    );

    outputs.push(
      await ocrSinglePass(
        image,
        worker,
        "6"
      )
    );

  }finally{

    await worker.terminate();

  }

  return outputs
    .filter(Boolean)
    .join(
      "\n--- OCR PASS ---\n"
    );

}


/* =========================================================
   OCR NORMALIZATION
========================================================= */

function normalizeOCRText(
  text
){

  return String(text || "")

    .replace(
      /\r/g,
      "\n"
    )

    .replace(
      /[|]/g,
      "I"
    )

    .replace(
      /[ \t]+/g,
      " "
    )

    .replace(
      /\n{3,}/g,
      "\n\n"
    )

    .trim();

}


function getOCRLines(
  text
){

  return normalizeOCRText(
    text
  )
  .split("\n")
  .map(
    x => x.trim()
  )
  .filter(Boolean);

}


/* =========================================================
   DATE HELPERS
========================================================= */

const MONTHS = {

  JAN:"01",
  FEB:"02",
  MAR:"03",
  APR:"04",
  MAY:"05",
  JUN:"06",
  JUL:"07",
  AUG:"08",
  SEP:"09",
  OCT:"10",
  NOV:"11",
  DEC:"12"

};


function makeDate(
  day,
  month,
  year
){

  day =
    String(day).padStart(
      2,
      "0"
    );

  month =
    String(month).padStart(
      2,
      "0"
    );

  year =
    String(year);

  if(
    year.length === 2
  ){

    year =
      Number(year) >= 50
        ? "19" + year
        : "20" + year;

  }

  const y =
    Number(year);

  const m =
    Number(month);

  const d =
    Number(day);

  if(
    y < 1900 ||
    y > 2200 ||
    m < 1 ||
    m > 12 ||
    d < 1 ||
    d > 31
  ){
    return "";
  }

  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}


function parseDateFromText(
  text
){

  const s =
    String(text || "")
      .toUpperCase();


  let m;


  /* DD-MMM-YYYY */

  const re1 =
    /\b(\d{1,2})[\s\-./]+(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[A-Z]*[\s\-./]+(\d{4})\b/gi;

  m =
    re1.exec(s);

  if(m){

    return makeDate(
      m[1],
      MONTHS[
        m[2].substring(0,3)
      ],
      m[3]
    );

  }


  /* DD/MM/YYYY */

  const re2 =
    /\b(\d{1,2})[\s\-./]+(\d{1,2})[\s\-./]+(\d{4})\b/g;

  while(
    (m = re2.exec(s))
  ){

    const date =
      makeDate(
        m[1],
        m[2],
        m[3]
      );

    if(date){
      return date;
    }

  }


  /* YYYY-MM-DD */

  const re3 =
    /\b(\d{4})[\s\-./]+(\d{1,2})[\s\-./]+(\d{1,2})\b/g;

  m =
    re3.exec(s);

  if(m){

    return makeDate(
      m[3],
      m[2],
      m[1]
    );

  }


  return "";

}


/* =========================================================
   LABEL DATE EXTRACTION
========================================================= */

function extractDateAfterLabels(
  text,
  labels
){

  const lines =
    getOCRLines(
      text
    );

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const line =
      lines[i];

    for(
      const label of labels
    ){

      if(
        line.includes(
          label
        )
      ){

        const same =
          parseDateFromText(
            line
          );

        if(same){
          return same;
        }

        for(
          let j=1;
          j<=3;
          j++
        ){

          if(
            lines[i+j]
          ){

            const d =
              parseDateFromText(
                lines[i+j]
              );

            if(d){
              return d;
            }

          }

        }

      }

    }

  }

  return "";

}

/* =========================================================
   TAX
========================================================= */

function extractTax(
  text
){

  const s =
    normalizeOCRText(
      text
    ).toUpperCase();

  if(
    /\bLTT\b/.test(
      s
    )
  ){

    return "LTT";

  }

  if(
    /L[\s.\-]*T[\s.\-]*T/.test(
      s
    )
  ){

    return "LTT";

  }

  return extractDateAfterLabels(
    text,
    [
      "TAX VALID UPTO",
      "TAX EXPIRY",
      "TAX VALID",
      "TAX"
    ]
  );

}


/* =========================================================
   PUCC
========================================================= */

function extractPUCCDate(
  text
){

  const lines =
    getOCRLines(
      text
    );

  const labels = [
    "PUCC",
    "PUC",
    "POLLUTION",
    "POLLUTION UNDER CONTROL"
  ];

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const line =
      lines[i];

    const compact =
      line
        .toUpperCase()
        .replace(
          /[^A-Z0-9]/g,
          ""
        );

    let found =
      labels.some(
        label =>
          compact.includes(
            label.replace(
              /[^A-Z0-9]/g,
              ""
            )
          )
      );

    if(!found){
      continue;
    }

    const same =
      parseDateFromText(
        line
      );

    if(same){
      return same;
    }

    for(
      let j=1;
      j<=4;
      j++
    ){

      if(
        lines[i+j]
      ){

        const d =
          parseDateFromText(
            lines[i+j]
          );

        if(d){
          return d;
        }

      }

    }

  }

  return "";

}

      .toUpperCase();

  if(
    validStateCodes.has(
      s
    )
  ){

    return s;

  }

  const corrected =
    s
      .replace(
        /0/g,
        "O"
      )
      .replace(
        /1/g,
        "I"
      )
      .replace(
        /5/g,
        "S"
      )
      .replace(
        /8/g,
        "B"
      );

  if(
    validStateCodes.has(
      corrected
    )
  ){

    return corrected;

  }

  return "";

}


/* =========================================================
   FIX VEHICLE NUMBER

   Example:

   OCR:
   GJ3451419

   Parsing:
   GJ | 34 | S | 1419

   Result:
   GJ34S1419
========================================================= */

function fixVehicleNumberCandidate(
  value
){

  const s =
    cleanVehicleCandidate(
      value
    );

  if(
    !s ||
    s.length < 8 ||
    s.length > 11
  ){

    return "";

  }


  /* Try every possible starting window */

  const stringsToTry =
    [s];


  /* If extra OCR characters exist,
     try all windows 8-11 chars */

  for(
    let len=8;
    len<=11;
    len++
  ){

    if(
      s.length > len
    ){

      for(
        let start=0;
        start<=s.length-len;
        start++
      ){

        stringsToTry.push(
          s.substring(
            start,
            start+len
          )
        );

      }

    }

  }


  for(
    const candidate of stringsToTry
  ){

    if(
      candidate.length < 8 ||
      candidate.length > 11
    ){
      continue;
    }


    const stateRaw =
      candidate.substring(
        0,
        2
      );

    const state =
      correctStatePart(
        stateRaw
      );

    if(!state){
      continue;
    }


    /*
      RTO can be 1 or 2 digits
    */

    for(
      let rtoLen=1;
      rtoLen<=2;
      rtoLen++
    ){

      const rtoRaw =
        candidate.substring(
          2,
          2+rtoLen
        );

      const rto =
        correctRtoPart(
          rtoRaw
        );

      if(
        !/^\d{1,2}$/.test(
          rto
        )
      ){

        continue;

      }


      const rest =
        candidate.substring(
          2+rtoLen
        );


      /*
        Series can be 1-3 letters
      */

      for(
        let seriesLen=1;
        seriesLen<=3;
        seriesLen++
      ){

        if(
          rest.length <= seriesLen
        ){
          continue;
        }

        const seriesRaw =
          rest.substring(
            0,
            seriesLen
          );

        const numberRaw =
          rest.substring(
            seriesLen
          );


        const series =
          correctSeriesPart(
            seriesRaw
          );

        const number =
          correctFinalNumberPart(
            numberRaw
          );


        if(
          !/^[A-Z]{1,3}$/.test(
            series
          )
        ){

          continue;

        }


        if(
          !/^\d{3,4}$/.test(
            number
          )
        ){

          continue;

        }


        const finalNumber =
          state +
          rto +
          series +
          number;


        if(
          /^[A-Z]{2}\d{1,2}[A-Z]{1,3}\d{3,4}$/
            .test(
              finalNumber
            )
        ){

          return finalNumber;

        }

      }

    }

  }


  return "";

}


/* =========================================================
   VEHICLE NUMBER CANDIDATE ADD
========================================================= */

function addVehicleCandidate(
  list,
  value,
  score,
  source
){

  const fixed =
    fixVehicleNumberCandidate(
      value
    );

  if(!fixed){
    return;
  }

  const existing =
    list.find(
      x =>
        x.value === fixed
    );

  if(existing){

    existing.score +=
      score;

    existing.count++;

    existing.sources.push(
      source
    );

  }else{

    list.push({

      value:fixed,

      score:score,

      count:1,

      sources:[
        source
      ]

    });

  }

}


/* =========================================================
   COLLECT VEHICLE CANDIDATES
========================================================= */

function collectVehicleCandidates(
  text
){

  const candidates = [];

  const lines =
    getOCRLines(
      text
    );


  /* -------------------------------------------------------
     1. Registration label area
  ------------------------------------------------------- */

  const registrationLabels = [

    "REGISTRATION NO",
    "REGISTRATION NUMBER",
    "REGN NO",
    "REGN NUMBER",
    "REG NO",
    "REG NUMBER",
    "VEHICLE NO",
    "VEHICLE NUMBER",
    "REGISTRATION"

  ];


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const line =
      lines[i]
        .toUpperCase();


    const hasLabel =
      registrationLabels.some(
        label =>
          line.includes(
            label
          )
      );


    if(!hasLabel){
      continue;
    }


    /* Same line */

    const compact =
      cleanVehicleCandidate(
        line
      );


    for(
      let start=0;
      start<compact.length;
      start++
    ){

      if(
        compact.substring(
          start,
          start+2
        ) === "GJ"
      ){

        for(
          let len=8;
          len<=11;
          len++
        ){

          const part =
            compact.substring(
              start,
              start+len
            );

          if(
            part.length === len
          ){

            addVehicleCandidate(
              candidates,
              part,
              250,
              "registration label"
            );

          }

        }

      }

    }


    /* Next 3 lines */

    for(
      let j=1;
      j<=3;
      j++
    ){

      if(
        !lines[i+j]
      ){
        continue;
      }


      const next =
        cleanVehicleCandidate(
          lines[i+j]
        );


      for(
        let start=0;
        start<next.length;
        start++
      ){

        for(
          let len=8;
          len<=11;
          len++
        ){

          const part =
            next.substring(
              start,
              start+len
            );

          if(
            part.length === len
          ){

            addVehicleCandidate(
              candidates,
              part,
              220,
              "registration next line"
            );

          }

        }

      }

    }

  }


  /* -------------------------------------------------------
     2. Every OCR line
  ------------------------------------------------------- */

  for(
    const line of lines
  ){

    const compact =
      cleanVehicleCandidate(
        line
      );


    for(
      let start=0;
      start<compact.length;
      start++
    ){

      if(
        compact.substring(
          start,
          start+2
        ) !== "GJ"
      ){

        continue;

      }


      for(
        let len=8;
        len<=11;
        len++
      ){

        const part =
          compact.substring(
            start,
            start+len
          );

        if(
          part.length === len
        ){

          addVehicleCandidate(
            candidates,
            part,
            100,
            "OCR line"
          );

        }

      }

    }

  }


  /* -------------------------------------------------------
     3. Whole OCR text
  ------------------------------------------------------- */

  const all =
    cleanVehicleCandidate(
      text
    );


  for(
    let start=0;
    start<all.length;
    start++
  ){

    if(
      all.substring(
        start,
        start+2
      ) !== "GJ"
    ){
      continue;
    }


    for(
      let len=8;
      len<=11;
      len++
    ){

      const part =
        all.substring(
          start,
          start+len
        );


      if(
        part.length === len
      ){

        addVehicleCandidate(
          candidates,
          part,
          50,
          "full OCR"
        );

      }

    }

  }


  /* -------------------------------------------------------
     4. Spaced vehicle number
        GJ 34 S 1419
        GJ-34-S-1419
  ------------------------------------------------------- */

  const spacedRegex =
    /\b(GJ)\s*[-./]?\s*([0-9A-Z]{1,2})\s*[-./]?\s*([0-9A-Z]{1,3})\s*[-./]?\s*([0-9A-Z]{3,4})\b/gi;


  let match;

  while(
    (match =
      spacedRegex.exec(
        text
      ))
  ){

    const combined =
      match[1] +
      match[2] +
      match[3] +
      match[4];


    addVehicleCandidate(
      candidates,
      combined,
      300,
      "spaced registration"
    );

  }


  return candidates;

}


/* =========================================================
   EXTRACT VEHICLE NUMBER
========================================================= */

function extractVehicleNumber(
  text
){

  const candidates =
    collectVehicleCandidates(
      text
    );


  if(
    !candidates.length
  ){

    return "";

  }


  candidates.sort(
    (a,b) => {

      const scoreA =
        a.score +
        a.count * 35;

      const scoreB =
        b.score +
        b.count * 35;

      return scoreB-scoreA;

    }
  );


  return candidates[0].value;

}

/* =========================================================
   IMAGE ENHANCEMENT
========================================================= */

async function createEnhancedImage(
  file
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const img =
        new Image();

      const reader =
        new FileReader();


      reader.onload =
        function(e){

          img.onload =
            function(){

              const maxWidth =
                2200;

              const scale =
                Math.min(
                  1,
                  maxWidth /
                  img.width
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                Math.round(
                  img.width *
                  scale
                );

              canvas.height =
                Math.round(
                  img.height *
                  scale
                );


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              resolve(
                canvas
              );

            };


          img.onerror =
            reject;

          img.src =
            e.target.result;

        };


      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}

/* =========================================================
   IMAGE TO JPG
========================================================= */

async function convertImageToJpg(
  file
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const img =
        new Image();

      const reader =
        new FileReader();


      reader.onload =
        function(e){

          img.onload =
            function(){

              const canvas =
                document.createElement(
                  "canvas"
                );


              const max =
                1800;

              const scale =
                Math.min(
                  1,
                  max /
                  Math.max(
                    img.width,
                    img.height
                  )
                );


              canvas.width =
                Math.round(
                  img.width *
                  scale
                );

              canvas.height =
                Math.round(
                  img.height *
                  scale
                );


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              canvas.toBlob(
                blob => {

                  if(!blob){

                    reject(
                      new Error(
                        "Image conversion failed"
                      )
                    );

                    return;

                  }

                  resolve(
                    blob
                  );

                },
                "image/jpeg",
                0.88
              );

            };


          img.onerror =
            reject;

          img.src =
            e.target.result;

        };


      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   SAFE FILE NAME
========================================================= */

function safeFileName(
  value
){

  return String(
    value || "vehicle"
  )
  .replace(
    /[^A-Z0-9_-]/gi,
    "_"
  );

}


/* =========================================================
   UPLOAD PHOTO
========================================================= */

async function uploadPhoto(
  file,
  vehicleNumber
){

  const jpgBlob =
    await convertImageToJpg(
      file
    );


  const path =
    safeFileName(
      vehicleNumber
    ) +
    "_" +
    Date.now() +
    ".jpg";


  const result =
    await supabaseClient
      .storage
      .from(
        BUCKET
      )
      .upload(
        path,
        jpgBlob,
        {
          contentType:
            "image/jpeg",
          upsert:false
        }
      );


  if(result.error){

    throw result.error;

  }


  const publicResult =
    supabaseClient
      .storage
      .from(
        BUCKET
      )
      .getPublicUrl(
        path
      );


  return {

    path:path,

    url:
      publicResult.data
        .publicUrl

  };

}

/* =========================================================
   SAVE VEHICLE
========================================================= */

async function saveVehicle(){

  const saveBtn =
    document.getElementById(
      "saveBtn"
    );


  saveBtn.disabled =
    true;


  try{

    const data =
      getFormData();


    if(!data.vehicle_number){

      alert(
        "Vehicle Number required."
      );

      saveBtn.disabled =
        false;

      return;

    }


    /* -----------------------------------------------------
       Duplicate check
    ----------------------------------------------------- */

    let duplicateQuery =
      supabaseClient
        .from(
          "vehicles"
        )
        .select(
          "id,vehicle_number"
        )
        .eq(
          "vehicle_number",
          data.vehicle_number
        );


    if(editingId){

      duplicateQuery =
        duplicateQuery.neq(
          "id",
          editingId
        );

    }


    const duplicate =
      await duplicateQuery;


    if(
      duplicate.error
    ){

      throw duplicate.error;

    }


    if(
      duplicate.data &&
      duplicate.data.length
    ){

      alert(
        "આ Vehicle Number પહેલેથી saved છે."
      );

      saveBtn.disabled =
        false;

      return;

    }


    setStatus(
      "Saving vehicle..."
    );


    /* -----------------------------------------------------
       New photo
    ----------------------------------------------------- */

    let newPhoto = null;


    if(selectedPhotoFile){

      setStatus(
        "Uploading vehicle photo..."
      );


      newPhoto =
        await uploadPhoto(
          selectedPhotoFile,
          data.vehicle_number
        );

    }


    /* -----------------------------------------------------
       EDIT
    ----------------------------------------------------- */

    if(editingId){

      const updateData = {

        vehicle_number:
          data.vehicle_number,

        customer_name:
          data.customer_name,

        customer_mobile:
          data.customer_mobile,

        vehicle_class:
          data.vehicle_class,

        registration_date:
          data.registration_date,

        fitness_expiry:
          data.fitness_expiry,

        insurance_expiry:
          data.insurance_expiry,

        tax_expiry:
          data.tax_expiry,

        pucc_expiry:
          data.pucc_expiry,

        permit_expiry:
          data.permit_expiry,

        ocr_text:
          data.ocr_text

      };


      if(newPhoto){

        updateData.photo_url =
          newPhoto.url;

        updateData.photo_path =
          newPhoto.path;

      }


      const update =
        await supabaseClient
          .from(
            "vehicles"
          )
          .update(
            updateData
          )
          .eq(
            "id",
            editingId
          );


      if(update.error){

        /* If DB update fails,
           remove newly uploaded photo */

        if(newPhoto){

          await deletePhoto(
            newPhoto.path
          );

        }

        throw update.error;

      }


      /* ---------------------------------------------------
         Delete old photo only after successful update
      --------------------------------------------------- */

      if(
        newPhoto &&
        existingPhotoPath &&
        existingPhotoPath !==
          newPhoto.path
      ){

        await deletePhoto(
          existingPhotoPath
        );

      }


      setStatus(
        "Vehicle updated successfully." +
        (
          newPhoto
            ? "\nOld photo replaced."
            : ""
        )
      );


      setTimeout(
        goDashboard,
        1200
      );


      return;

    }


    /* -----------------------------------------------------
       NEW VEHICLE
    ----------------------------------------------------- */

    if(!newPhoto){

      alert(
        "Vehicle photo required."
      );

      saveBtn.disabled =
        false;

      return;

    }


    const insertData = {

      vehicle_number:
        data.vehicle_number,

      customer_name:
        data.customer_name,

      customer_mobile:
        data.customer_mobile,

      vehicle_class:
        data.vehicle_class,

      registration_date:
        data.registration_date,

      fitness_expiry:
        data.fitness_expiry,

      insurance_expiry:
        data.insurance_expiry,

      tax_expiry:
        data.tax_expiry,

      pucc_expiry:
        data.pucc_expiry,

      permit_expiry:
        data.permit_expiry,

      photo_url:
        newPhoto.url,

      photo_path:
        newPhoto.path,

      ocr_text:
        data.ocr_text

    };


    const insert =
      await supabaseClient
        .from(
          "vehicles"
        )
        .insert(
          insertData
        );


    if(insert.error){

      /* Delete uploaded photo
         if database insert fails */

      await deletePhoto(
        newPhoto.path
      );

      throw insert.error;

    }


    setStatus(
      "Vehicle saved successfully."
    );


    setTimeout(
      goDashboard,
      1200
    );


  }catch(error){

    console.error(
      error
    );


    setStatus(
      "Save Error:\n" +
      error.message
    );


    alert(
      "Save Error:\n" +
      error.message
    );

  }finally{

    saveBtn.disabled =
      false;

  }

}


/* =========================================================
   DASHBOARD
========================================================= */

function goDashboard(){

  window.location.href =
    "dashboard.html";

}


/* =========================================================
   MANUAL VEHICLE NUMBER NORMALIZATION
========================================================= */

document.getElementById(
  "vehicleNumber"
).addEventListener(
  "input",
  function(){

    this.value =
      this.value
        .toUpperCase()
        .replace(
          /[^A-Z0-9]/g,
          ""
        );

  }
);

</script>

</body>
</html>
