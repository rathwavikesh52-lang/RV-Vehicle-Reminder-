/* =========================================

function showStatus(

/* =========================================

photoInput.addEventListener(

/* =========================================
   SHOW CLASS PHOTO

    function(){

        "none";

      console.warn(

        vehicleClassPhotos[cls]
      );

    };

}


/* =========================================
   CLEAR OCR FIELDS
========================================= */

  vehicleClass.value = "";

/* =========================================
   NORMALIZE OCR TEXT
========================================= */

function normalizeOCRText(text){

  return text
    .replace(/\r/g,"")
    .replace(/[|]/g,"I")
    .replace(/[“”]/g,'"')
    .replace(/[‘’]/g,"'")
    .replace(/[ \t]+/g," ")
    .trim();

}


/* =========================================
   DATE CONVERSION
========================================= */

function toISODate(
  day,
  month,
  year
){

  day =
    String(day).padStart(
      2,
      "0"
    );

  month =
    String(month).padStart(
      2,
      "0"
    );

  return `${year}-${month}-${day}`;

}


/* =========================================
   PARSE DATE
========================================= */

function parseDateValue(
  value
){

  if(!value){
    return "";
  }


  let m;


  /* DD-MMM-YYYY */

  m =
    value.match(
      /(\d{1,2})[-\/\s](JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[A-Z]*[-\/\s](\d{4})/i
    );


  if(m){

    const months = {

      JAN:1,
      FEB:2,
      MAR:3,
      APR:4,
      MAY:5,
      JUN:6,
      JUL:7,
      AUG:8,
      SEP:9,
      OCT:10,
      NOV:11,
      DEC:12

    };

    return toISODate(
      m[1],
      months[
        m[2]
          .toUpperCase()
          .substring(0,3)
      ],
      m[3]
    );

  }


  /* YYYY-MM-DD */

  m =
    value.match(
      /(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/
    );


  if(m){

    return toISODate(
      m[3],
      m[2],
      m[1]
    );

  }


  /* DD/MM/YYYY */

  m =
    value.match(
      /(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/
    );


  if(m){

    return toISODate(
      m[1],
      m[2],
      m[3]
    );

  }


  return "";

}


/* =========================================
   FIND DATE AFTER LABEL
========================================= */

function findDateAfterLabel(
  text,
  labels
){

  for(
    const label of labels
  ){

    const regex =
      new RegExp(
        label +
        "\\s*[:\\-]?\\s*" +
        "([^\\n]{0,80})",
        "i"
      );

    const match =
      text.match(regex);

    if(match){

      const date =
        parseDateValue(
          match[1]
        );

      if(date){
        return date;
      }

    }

  }

  return "";

}


/* =========================================
   EXTRACT TAX
========================================= */

function extractTax(text){

  const upper =
    text.toUpperCase();


  const taxIndex =
    upper.search(
      /TAX|TAX VALID|ROAD TAX/
    );


  if(taxIndex >= 0){

    const part =
      upper.substring(
        taxIndex,
        taxIndex + 150
      );


    if(
      /\bLTT\b/.test(part) ||
      /\bL7T\b/.test(part) ||
      /\bLT7\b/.test(part) ||
      /\bLIT\b/.test(part) ||
      /\bLII\b/.test(part)
    ){

      return "LTT";

    }


    const date =
      parseDateValue(part);

    if(date){
      return date;
    }

  }


  if(
    /\bLTT\b/.test(upper)
  ){

    return "LTT";

  }


  return "";

}


/* =========================================
   EXTRACT VEHICLE NUMBER
========================================= */

function extractVehicleNumber(
  text
){

  let upper =
    text
      .toUpperCase()
      .replace(/[^A-Z0-9\s]/g," ");


  /* Common OCR corrections */

  upper =
    upper
      .replace(/\bGJ\s*(\d{2})/g,"GJ$1")
      .replace(/GJ\s*(\d{2})/g,"GJ$1");


  const matches =
    upper.match(
      /\bGJ\d{2}[A-Z]{1,3}\d{3,5}\b/g
    );


  if(
    matches &&
    matches.length
  ){

    return matches[0];

  }


  return "";

}


/* =========================================
   FIND VEHICLE CLASS
========================================= */

function findVehicleClass(
  text
){

  const upper =
    text.toUpperCase();


  /* Exact classes */

  if(
    /\b2WN\b/.test(upper)
  ){
    return "2WN";
  }


  if(
    /\b3WT\b/.test(upper)
  ){
    return "3WT";
  }


  if(
    /\bHGV\b/.test(upper)
  ){
    return "HGV";
  }


  if(
    /\bLGV\b/.test(upper)
  ){
    return "LGV";
  }


  if(
    /\bMGV\b/.test(upper)
  ){
    return "MGV";
  }


  if(
    /\bLMV\b/.test(upper)
  ){
    return "LMV";
  }


  if(
    /\bLPV\b/.test(upper)
  ){
    return "LPV";
  }


  if(
    /\bHPV\b/.test(upper)
  ){
    return "HPV";
  }


  /* Description */

  if(
    upper.includes(
      "MOTORCYCLE"
    ) ||
    upper.includes(
      "SCOOTER"
    ) ||
    upper.includes(
      "TWO WHEELER"
    )
  ){

    return "2WN";

  }


  if(
    upper.includes(
      "AUTO RICKSHAW"
    ) ||
    upper.includes(
      "THREE WHEELER"
    )
  ){

    return "3WT";

  }


  if(
    upper.includes(
      "BUS"
    )
  ){

    return "HPV";

  }


  if(
    upper.includes(
      "TRACTOR"
    ) ||
    upper.includes(
      "PICK-UP"
    ) ||
    upper.includes(
      "PICK UP"
    ) ||
    upper.includes(
      "PICKUP"
    ) ||
    upper.includes(
      "GOODS VEHICLE"
    )
  ){

    return "LGV";

  }


  if(
    upper.includes(
      "CAR"
    ) ||
    upper.includes(
      "MOTOR CAR"
    )
  ){

    return "LMV";

  }


  return "";

}


/* =========================================
   EXTRACT OCR DATA
========================================= */

function extractOCRData(
  text
){

  const cleanText =
    normalizeOCRText(
      text
    );


  vehicleNumber.value =
    extractVehicleNumber(
      cleanText
    );


  vehicleClass.value =
    findVehicleClass(
      cleanText
    );


  showClassPhoto(
    vehicleClass.value
  );


  registrationDate.value =
    findDateAfterLabel(
      cleanText,
      [
        "REGISTRATION DATE",
        "REGISTRATION",
        "REGN DATE",
        "REGN"
      ]
    );


  fitnessExpiry.value =
    findDateAfterLabel(
      cleanText,
      [
        "FITNESS VALID UPTO",
        "FITNESS VALID",
        "FITNESS EXPIRY",
        "FITNESS"
      ]
    );


  insuranceExpiry.value =
    findDateAfterLabel(
      cleanText,
      [
        "INSURANCE VALID UPTO",
        "INSURANCE VALID",
        "INSURANCE EXPIRY",
        "INSURANCE"
      ]
    );


  taxExpiry.value =
    extractTax(
      cleanText
    );


  puccExpiry.value =
    findDateAfterLabel(
      cleanText,
      [
        "PUCC VALID UPTO",
        "PUC VALID UPTO",
        "PUCC EXPIRY",
        "PUC EXPIRY",
        "PUCC",
        "PUC"
      ]
    );


  permitExpiry.value =
    findDateAfterLabel(
      cleanText,
      [
        "PERMIT VALID UPTO",
        "PERMIT VALID",
        "PERMIT EXPIRY",
        "PERMIT"
      ]
    );

}


/* =========================================
   OCR IMAGE
========================================= */

async function runOCR(
  file
){

  showStatus(
    "Reading photo... Please wait.",
    "warning"
  );


  const result =
    await Tesseract.recognize(
      file,
      "eng",
      {
        logger:
          function(info){

            if(
              info.status ===
              "recognizing text"
            ){

              const percent =
                Math.round(
                  (info.progress || 0) * 100
                );

              showStatus(
                "Reading photo... " +
                percent +
                "%",
                "warning"
              );

            }

          }
      }
    );


  return result.data.text || "";

}


/* =========================================
   ENHANCED IMAGE
========================================= */

function createEnhancedImage(
  file
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const img =
        new Image();

      const reader =
        new FileReader();


      reader.onload =
        function(e){

          img.onload =
            function(){

              const canvas =
                document.createElement(
                  "canvas"
                );

              const scale =
                Math.max(
                  1,
                  1800 / img.width
                );


              canvas.width =
                img.width * scale;

              canvas.height =
                img.height * scale;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              const imageData =
                ctx.getImageData(
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );


              const data =
                imageData.data;


              for(
                let i = 0;
                i < data.length;
                i += 4
              ){

                const gray =
                  (
                    data[i] * 0.299 +
                    data[i + 1] * 0.587 +
                    data[i + 2] * 0.114
                  );


                let value =
                  (gray - 128) * 1.5 + 128;


                value =
                  Math.max(
                    0,
                    Math.min(
                      255,
                      value
                    )
                  );


                data[i] =
                  value;

                data[i + 1] =
                  value;

                data[i + 2] =
                  value;

              }


              ctx.putImageData(
                imageData,
                0,
                0
              );


              canvas.toBlob(
                function(blob){

                  resolve(blob);

                },
                "image/jpeg",
                0.95
              );

            };


          img.onerror =
            reject;

          img.src =
            e.target.result;

        };


      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================
   READ PHOTO
========================================= */

readBtn.addEventListener(
  "click",
  async function(){

    hideStatus();


    if(!selectedFile){

      showStatus(
        "Please select a photo first.",
        "error"
      );

      return;

    }


    readBtn.disabled =
      true;


    saveBtn.disabled =
      true;


    try{

      clearOCRFields();


      /* OCR 1 */

      const text1 =
        await runOCR(
          selectedFile
        );


      let allText =
        text1 || "";


      /* OCR 2 */

      try{

        showStatus(
          "Improving photo and reading again...",
          "warning"
        );


        const enhanced =
          await createEnhancedImage(
            selectedFile
          );


        const text2Result =
          await Tesseract.recognize(
            enhanced,
            "eng"
          );


        const text2 =
          text2Result.data.text || "";


        allText +=
          "\n" +
          text2;

      }catch(e){

        console.warn(
          "Enhanced OCR failed:",
          e
        );

      }


      /* OCR 3 - high resolution */

      try{

        showStatus(
          "Final OCR check...",
          "warning"
        );


        const highRes =
          await createEnhancedImage(
            selectedFile
          );


        const text3Result =
          await Tesseract.recognize(
            highRes,
            "eng"
          );


        const text3 =
          text3Result.data.text || "";


        allText +=
          "\n" +
          text3;

      }catch(e){

        console.warn(
          "High resolution OCR failed:",
          e
        );

      }


      ocrText.value =
        normalizeOCRText(
          allText
        );


      extractOCRData(
        allText
      );


      showStatus(
        "Photo read successfully. Please check the fields before saving.",
        "success"
      );


    }catch(error){

      console.error(
        error
      );


      showStatus(
        "OCR failed. Please enter the vehicle details manually.",
        "error"
      );

    }


    readBtn.disabled =
      false;

    saveBtn.disabled =
      false;

  }
);


/* =========================================
   DATABASE DATE
========================================= */

function convertToDatabaseDate(
  value
){

  if(!value){
    return null;
  }


  if(
    value.toUpperCase() ===
    "LTT"
  ){

    return "LTT";

  }


  const date =
    parseDateValue(
      value
    );


  return date || value;

}


/* =========================================
   CLEAN VEHICLE NUMBER
========================================= */

function cleanVehicleNumber(
  value
){

  return (
    value || ""
  )
    .toUpperCase()
    .replace(
      /[^A-Z0-9]/g,
      ""
    )
    .trim();

}


/* =========================================
   UPLOAD PHOTO TO STORAGE
========================================= */

async function uploadPhoto(
  vehicleNo,
  file
){

  if(!file){
    return null;
  }


  const safeNumber =
    cleanVehicleNumber(
      vehicleNo
    );


  const fileName =
    safeNumber +
    "_" +
    Date.now() +
    ".jpg";


  const filePath =
    fileName;


  const uploadFile =
    file.type ===
    "image/jpeg"
      ? file
      : await convertImageToJPG(
          file
        );


  const {
    error
  } =
    await supabaseClient
      .storage
      .from(
        STORAGE_BUCKET
      )
      .upload(
        filePath,
        uploadFile,
        {
          contentType:
            "image/jpeg",
          upsert:
            false
        }
      );


  if(error){

    throw error;

  }


  const {
    data
  } =
    supabaseClient
      .storage
      .from(
        STORAGE_BUCKET
      )
      .getPublicUrl(
        filePath
      );


  return {

    path:
      filePath,

    url:
      data.publicUrl

  };

}


/* =========================================
   CONVERT IMAGE TO JPG
========================================= */

function convertImageToJPG(
  file
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const img =
        new Image();

      const reader =
        new FileReader();


      reader.onload =
        function(e){

          img.onload =
            function(){

              const canvas =
                document.createElement(
                  "canvas"
                );


              const maxWidth =
                2000;


              const scale =
                Math.min(
                  1,
                  maxWidth /
                  img.width
                );


              canvas.width =
                img.width * scale;

              canvas.height =
                img.height * scale;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              canvas.toBlob(
                function(blob){

                  resolve(blob);

                },
                "image/jpeg",
                0.9
              );

            };


          img.onerror =
            reject;

          img.src =
            e.target.result;

        };


      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================
   DELETE OLD PHOTO
========================================= */

async function deleteOldPhoto(
  path
){

  if(!path){
    return;
  }


  try{

    const {
      error
    } =
      await supabaseClient
        .storage
        .from(
          STORAGE_BUCKET
        )
        .remove(
          [path]
        );


    if(error){

      console.warn(
        "Old photo delete failed:",
        error
      );

    }

  }catch(error){

    console.warn(
      "Old photo delete error:",
      error
    );

  }

}


/* =========================================
   SAVE VEHICLE
========================================= */

saveBtn.addEventListener(
  "click",
  async function(){

    hideStatus();


    const number =
      cleanVehicleNumber(
        vehicleNumber.value
      );


    if(!number){

      showStatus(
        "Vehicle Number is required.",
        "error"
      );

      return;

    }


    saveBtn.disabled =
      true;

    readBtn.disabled =
      true;


    try{

      showStatus(
        "Saving vehicle...",
        "warning"
      );


      /* =====================================
         CHECK EXISTING VEHICLE
      ===================================== */

      const {
        data:
          existing,
        error:
          existingError
      } =
        await supabaseClient
          .from(
            "vehicles"
          )
          .select(
            "*"
          )
          .eq(
            "vehicle_number",
            number
          )
          .maybeSingle();


      if(existingError){

        throw existingError;

      }


      /* =====================================
         PHOTO
      ===================================== */

      let photoUrl =
        existing
          ? existing.photo_url
          : null;


      let photoPath =
        existing
          ? existing.photo_path
          : null;


      let newPhotoUploaded =
        false;


      if(selectedFile){

        const uploaded =
          await uploadPhoto(
            number,
            selectedFile
          );


        if(uploaded){

          photoUrl =
            uploaded.url;

          photoPath =
            uploaded.path;

          newPhotoUploaded =
            true;

        }

      }


      /* =====================================
         DATA
      ===================================== */

      const vehicleData = {

        vehicle_number:
          number,

        customer_name:
          customerName.value.trim(),

        mobile:
          mobile.value.trim(),

        vehicle_class:
          vehicleClass.value || null,

        registration_date:
          convertToDatabaseDate(
            registrationDate.value
          ),

        fitness_expiry:
          convertToDatabaseDate(
            fitnessExpiry.value
          ),

        insurance_expiry:
          convertToDatabaseDate(
            insuranceExpiry.value
          ),

        tax_expiry:
          convertToDatabaseDate(
            taxExpiry.value
          ),

        pucc_expiry:
          convertToDatabaseDate(
            puccExpiry.value
          ),

        permit_expiry:
          convertToDatabaseDate(
            permitExpiry.value
          ),

        photo_url:
          photoUrl,

        photo_path:
          photoPath,

        ocr_text:
          ocrText.value

      };


      /* =====================================
         UPDATE EXISTING
      ===================================== */

      if(existing){

        const {
          error
        } =
          await supabaseClient
            .from(
              "vehicles"
            )
            .update(
              vehicleData
            )
            .eq(
              "id",
              existing.id
            );


        if(error){

          /* If new photo was uploaded but
             database update failed, remove it */

          if(
            newPhotoUploaded &&
            photoPath &&
            photoPath !==
            existing.photo_path
          ){

            await deleteOldPhoto(
              photoPath
            );

          }


          throw error;

        }


        /* Delete previous photo only after
           successful database update */

        if(
          newPhotoUploaded &&
          existing.photo_path &&
          existing.photo_path !==
          photoPath
        ){

          await deleteOldPhoto(
            existing.photo_path
          );

        }


        showStatus(
          "Vehicle updated successfully. Old photo replaced.",
          "success"
        );


      }else{

        /* ===================================
           INSERT NEW
        =================================== */

        const {
          error
        } =
          await supabaseClient
            .from(
              "vehicles"
            )
            .insert(
              vehicleData
            );


        if(error){

          /* Remove uploaded photo if
             database insert failed */

          if(
            newPhotoUploaded &&
            photoPath
          ){

            await deleteOldPhoto(
              photoPath
            );

          }


          throw error;

        }


        showStatus(
          "Vehicle saved successfully.",
          "success"
        );

      }


      /* =====================================
         CLEAR PHOTO SELECTION
      ===================================== */

      selectedFile =
        null;

      photoInput.value =
        "";

      oldPhotoPath =
        photoPath || "";


    }catch(error){

      console.error(
        "SAVE ERROR:",
        error
      );


      showStatus(
        "Save failed: " +
        (
          error.message ||
          "Unknown error"
        ),
        "error"
      );

    }


    saveBtn.disabled =
      false;

    readBtn.disabled =
      false;

  }
);

/* =========================================
   LOAD EDIT VEHICLE
========================================= */

async function loadEditVehicle(){

  if(!editId){
    return;
  }


  try{

    showStatus(
      "Loading vehicle...",
      "warning"
    );


    const {
      data,
      error
    } =
      await supabaseClient
        .from(
          "vehicles"
        )
        .select(
          "*"
        )
        .eq(
          "id",
          editId
        )
        .single();


    if(error){

      throw error;

    }


    if(!data){

      throw new Error(
        "Vehicle not found."
      );

    }


    /* Customer */

    customerName.value =
      data.customer_name ||
      "";


    mobile.value =
      data.mobile ||
      data.customer_mobile ||
      "";


    /* Vehicle */

    vehicleNumber.value =
      data.vehicle_number ||
      "";


    vehicleClass.value =
      data.vehicle_class ||
      "";


    showClassPhoto(
      vehicleClass.value
    );


    registrationDate.value =
      data.registration_date &&
      data.registration_date !==
      "LTT"
        ? data.registration_date
        : "";


    fitnessExpiry.value =
      data.fitness_expiry &&
      data.fitness_expiry !==
      "LTT"
        ? data.fitness_expiry
        : "";


    insuranceExpiry.value =
      data.insurance_expiry &&
      data.insurance_expiry !==
      "LTT"
        ? data.insurance_expiry
        : "";


    taxExpiry.value =
      data.tax_expiry ||
      "";


    puccExpiry.value =
      data.pucc_expiry &&
      data.pucc_expiry !==
      "LTT"
        ? data.pucc_expiry
        : "";


    permitExpiry.value =
      data.permit_expiry &&
      data.permit_expiry !==
      "LTT"
        ? data.permit_expiry
        : "";


    ocrText.value =
      data.ocr_text ||
      "";


    oldPhotoPath =
      data.photo_path ||
      "";


    if(data.photo_url){

      photoPreview.src =
        data.photo_url;

      photoPreview.style.display =
        "block";

    }


    showStatus(
      "Vehicle loaded for editing.",
      "success"
    );


  }catch(error){

    console.error(
      error
    );


    showStatus(
      "Vehicle load failed: " +
      (
        error.message ||
        "Unknown error"
      ),
      "error"
    );

  }

}


/* =========================================
   PAGE LOAD

loadEditVehicle();
