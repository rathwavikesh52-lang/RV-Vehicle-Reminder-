/* =====================================
   TEXT NORMALIZE
===================================== */

function normalizeText(text){

  return text
    .replace(/\r/g,"\n")
    .replace(/[ \t]+/g," ")
    .replace(/\n+/g,"\n")
    .trim();
}


/* =====================================
   DATE CONVERSION
===================================== */

function convertOCRDate(value){

  if(!value){
    return "";
  }

  value =
    value
      .trim()
      .toUpperCase()
      .replace(/\s+/g,"");


  const months = {

    JAN:"01",
    FEB:"02",
    MAR:"03",
    APR:"04",
    MAY:"05",
    JUN:"06",
    JUL:"07",
    AUG:"08",
    SEP:"09",
    OCT:"10",
    NOV:"11",
    DEC:"12"

  };


  const monthDate =
    value.match(
      /^(\d{1,2})[-\/.]([A-Z]{3})[A-Z]*[-\/.](\d{4})$/i
    );


  if(monthDate){

    const day =
      monthDate[1].padStart(2,"0");

    const monthCode =
      monthDate[2]
        .substring(0,3)
        .toUpperCase();

    const month =
      months[monthCode];

    const year =
      monthDate[3];


    if(month){

      return (
        day +
        "/" +
        month +
        "/" +
        year
      );
    }
  }


  const numericDate =
    value.match(
      /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/
    );


  if(numericDate){

    return (
      numericDate[1].padStart(2,"0") +
      "/" +
      numericDate[2].padStart(2,"0") +
      "/" +
      numericDate[3]
    );
  }


  return "";
}


/* =====================================
   FIND DATE
===================================== */

function findDate(text){

  if(!text){
    return "";
  }


  const monthDate =
    text.match(
      /\b(\d{1,2})[-\/.\s](JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[A-Z]*[-\/.\s](\d{4})\b/i
    );


  if(monthDate){

    return convertOCRDate(
      monthDate[1] +
      "-" +
      monthDate[2] +
      "-" +
      monthDate[3]
    );
  }


  const numericDate =
    text.match(
      /\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})\b/
    );


  if(numericDate){

    return convertOCRDate(
      numericDate[1] +
      "/" +
      numericDate[2] +
      "/" +
      numericDate[3]
    );
  }


  return "";
}


/* =====================================
   NEARBY TEXT
===================================== */

function getNearbyText(
  lines,
  index
){

  return [

    lines[index] || "",

    lines[index + 1] || "",

    lines[index + 2] || "",

    lines[index + 3] || ""

  ].join(" ");
}


/* =====================================
   DATE AFTER KEYWORD
===================================== */

function findDateAfterKeyword(
  text,
  keywords
){

  const lines =
    text
      .split(/\n/)
      .map(x => x.trim())
      .filter(Boolean);


  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    const upperLine =
      lines[i].toUpperCase();


    if(
      keywords.some(
        keyword =>
          upperLine.includes(keyword)
      )
    ){

      const nearbyText =
        getNearbyText(
          lines,
          i
        );


      const result =
        findDate(
          nearbyText
        );


      if(result){
        return result;
      }
    }
  }


  return "";
}


/* =====================================
   TAX DETECTION
===================================== */

function findTax(text){

  const lines =
    text
      .split(/\n/)
      .map(x => x.trim())
      .filter(Boolean);


  const taxKeywords = [

    "TAX VALID UPTO",
    "TAX VALID UP TO",
    "TAX VALID UP",
    "TAX UPTO",
    "TAX UP TO",
    "TAX VALID",
    "TAX"

  ];


  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    const currentLine =
      lines[i].toUpperCase();


    const isTaxLine =
      taxKeywords.some(
        keyword =>
          currentLine.includes(keyword)
      );


    if(!isTaxLine){
      continue;
    }


    /*
      Check Tax label and next 5 lines.
    */

    const nearbyLines = [];


    for(
      let j = i;
      j <= Math.min(
        i + 5,
        lines.length - 1
      );
      j++
    ){

      nearbyLines.push(
        lines[j]
      );
    }


    const nearbyText =
      nearbyLines.join(" ");


    const upperNearby =
      nearbyText.toUpperCase();


    /*
      LTT has priority.
    */

    if(
      /\bLTT\b/.test(
        upperNearby
      )
    ){

      return "LTT";
    }


    /*
      Common OCR variants of LTT.
    */

    const possibleLTT =
      upperNearby.match(
        /\b(L7T|LT7|LIT|LII)\b/
      );


    if(possibleLTT){

      return "LTT";
    }


    /*
      Otherwise find Tax date.
    */

    const dateValue =
      findDate(
        nearbyText
      );


    if(dateValue){

      return dateValue;
    }
  }


  /*
    If Tax exists somewhere and
    LTT exists in OCR text.
  */

  if(
    /\bTAX\b/i.test(text) &&
    /\bLTT\b/i.test(text)
  ){

    return "LTT";
  }


  return "";
}


/* =====================================
   VEHICLE NUMBER CLEAN
===================================== */

function cleanVehicleCandidate(value){

  if(!value){
    return "";
  }


  let v =
    value
      .toUpperCase()
      .replace(
        /[^A-Z0-9]/g,
        ""
      );


  /*
    Common OCR errors in GJ prefix.
  */

  if(
    v.startsWith("JO") ||
    v.startsWith("J0") ||
    v.startsWith("GO") ||
    v.startsWith("G0")
  ){

    v =
      "GJ" +
      v.substring(2);
  }


  /*
    Sometimes OCR reads GJ as G0 / GO.
  */

  if(
    v.length >= 2 &&
    v[0] === "G" &&
    (
      v[1] === "0" ||
      v[1] === "O" ||
      v[1] === "Q"
    )
  ){

    v =
      "GJ" +
      v.substring(2);
  }


  /*
    Fix RTO code only.
  */

  if(
    v.startsWith("GJ") &&
    v.length >= 4
  ){

    let rto =
      v.substring(2,4);


    rto =
      rto
        .replace(/O/g,"0")
        .replace(/Q/g,"0")
        .replace(/D/g,"0")
        .replace(/I/g,"1")
        .replace(/L/g,"1")
        .replace(/S/g,"5")
        .replace(/B/g,"8");


    v =
      "GJ" +
      rto +
      v.substring(4);
  }


  return v;
}


/* =====================================
   VEHICLE NUMBER VALIDATION
===================================== */

function isValidGujaratNumber(value){

  const v =
    cleanVehicleCandidate(
      value
    );


  const patterns = [

    /*
      GJ06A1234
    */

    /^GJ\d{2}[A-Z]\d{4}$/,


    /*
      GJ06A12345
    */

    /^GJ\d{2}[A-Z]\d{5}$/,


    /*
      GJ0612345
    */

    /^GJ\d{2}\d{5}$/,


    /*
      GJ06AB1234
    */

    /^GJ\d{2}[A-Z]{2}\d{4}$/,


    /*
      GJ06AB12345
    */

    /^GJ\d{2}[A-Z]{2}\d{5}$/,


    /*
      Other Gujarat series
    */

    /^GJ\d{2}[A-Z]{3}\d{3,5}$/


  ];


  return patterns.some(
    pattern =>
      pattern.test(v)
  );
}


/* =====================================
   VEHICLE NUMBER CORRECTION
===================================== */

function correctVehicleNumber(
  candidate
){

  if(!candidate){
    return "";
  }


  let v =
    cleanVehicleCandidate(
      candidate
    );


  /*
    =================================
    SPECIAL CASE

    OCR example:

    GJO6AZ5038

    becomes after prefix cleaning:

    GJ06AZ5038

    Here:

    Z may actually be 2.

    Expected possible number:

    GJ06A25038
    =================================
  */


  let special =
    v.match(
      /^GJ(\d{2})([A-Z])Z(\d{4,5})$/
    );


  if(special){

    const rto =
      special[1];

    const series =
      special[2];

    const numbers =
      special[3];


    /*
      Z -> 2
    */

    const option =
      "GJ" +
      rto +
      series +
      "2" +
      numbers;


    /*
      Return only if this is
      a valid Gujarat format.
    */

    if(
      isValidGujaratNumber(
        option
      )
    ){

      return option;
    }
  }


  /*
    =================================
    Another common OCR case

    GJ06A25038
    =================================
  */

  if(
    /^GJ\d{2}[A-Z]\d{5}$/.test(v)
  ){

    return v;
  }


  /*
    =================================
    Normal numeric-series vehicle
    =================================
  */

  let normal =
    v.match(
      /^GJ(\d{2})([A-Z]{1,3})([A-Z0-9]{3,6})$/
    );


  if(normal){

    const rto =
      normal[1];

    const series =
      normal[2];

    let number =
      normal[3];


    /*
      Numeric portion OCR corrections.

      Only apply where character appears
      after a recognised letter series.
    */

    number =
      number
        .replace(/O/g,"0")
        .replace(/Q/g,"0")
        .replace(/I/g,"1")
        .replace(/L/g,"1")
        .replace(/S/g,"5")
        .replace(/B/g,"8");


    const result =
      "GJ" +
      rto +
      series +
      number;


    if(
      isValidGujaratNumber(
        result
      )
    ){

      return result;
    }
  }


  return v;
}


/* =====================================
   FIND VEHICLE NUMBER
===================================== */

function findVehicleNumber(text){

  const upperText =
    text.toUpperCase();


  const lines =
    upperText
      .split(/\n/)
      .map(x => x.trim())
      .filter(Boolean);


  /*
    =================================
    PRIORITY 1:
    Vehicle Number label
    =================================
  */

  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    const line =
      lines[i];


    if(
      line.includes("VEHICLE NUMBER") ||
      line.includes("VEHICLE NO") ||
      line.includes("VEHICLE NO.") ||
      line.includes("REGISTRATION NUMBER") ||
      line.includes("REGISTRATION NO") ||
      line.includes("REGISTRATION NO.")
    ){

      /*
        Check next 4 lines.
      */

      const nearbyLines = [];


      for(
        let j = i;
        j <= Math.min(
          i + 4,
          lines.length - 1
        );
        j++
      ){

        nearbyLines.push(
          lines[j]
        );
      }


      const nearbyText =
        nearbyLines.join(" ");


      /*
        Normal candidates.
      */

      const candidates =
        nearbyText.match(
          /[A-Z0-9]{8,14}/g
        ) || [];


      for(
        let candidate of candidates
      ){

        /*
          Ignore labels.
        */

        if(
          candidate === "VEHICLENUMBER" ||
          candidate === "VEHICLENO" ||
          candidate === "REGISTRATIONNUMBER" ||
          candidate === "REGISTRATIONNO"
        ){

          continue;
        }


        candidate =
          correctVehicleNumber(
            candidate
          );


        if(
          isValidGujaratNumber(
            candidate
          )
        ){

          return candidate;
        }
      }
    }
  }


  /*
    =================================
    PRIORITY 2:
    Search full OCR text
    =================================
  */

  const allCandidates =
    upperText.match(
      /[A-Z0-9]{8,14}/g
    ) || [];


  for(
    let candidate of allCandidates
  ){

    /*
      Ignore obvious words.
    */

    if(
      candidate === "VEHICLENUMBER" ||
      candidate === "VEHICLENO" ||
      candidate === "REGISTRATIONNUMBER" ||
      candidate === "REGISTRATIONNO" ||
      candidate === "OWNERNAM" ||
      candidate === "OWNERNAME" ||
      candidate === "VADODARA"
    ){

      continue;
    }


    candidate =
      correctVehicleNumber(
        candidate
      );


    if(
      isValidGujaratNumber(
        candidate
      )
    ){

      return candidate;
    }
  }


  /*
    =================================
    PRIORITY 3:
    OCR with spaces

    Example:

    GJ 06 A 78397

    GJ 06 A 25038
    =================================
  */

  const compactText =
    upperText.replace(
      /GJ\s*(\d{1,2})\s*([A-Z]{1,3})?\s*([A-Z0-9]{3,6})/g,
      "GJ$1$2$3"
    );


  const compactCandidates =
    compactText.match(
      /GJ[A-Z0-9]{7,13}/g
    ) || [];


  for(
    let candidate of compactCandidates
  ){

    candidate =
      correctVehicleNumber(
        candidate
      );


    if(
      isValidGujaratNumber(
        candidate
      )
    ){

      return candidate;
    }
  }


  /*
    =================================
    PRIORITY 4:
    Try direct OCR patterns

    This helps when OCR has:
    GJO6A25038
    GJ06AZ5038
    =================================
  */

  const specialCandidates =
    upperText.match(
      /GJ[A-Z0-9]{7,13}/g
    ) || [];


  for(
    let candidate of specialCandidates
  ){

    /*
      Fix O in RTO.
    */

    candidate =
      candidate
        .replace(
          /^GJ([OQ])(\d)/,
          "GJ0$2"
        );


    candidate =
      correctVehicleNumber(
        candidate
      );


    if(
      isValidGujaratNumber(
        candidate
      )
    ){

      return candidate;
    }
  }


  return "";
}


/* =====================================
   IMAGE PREPARATION
===================================== */

async function prepareImage(
  file
){

  return new Promise(
    (resolve,reject) => {

      const img =
        new Image();

      const reader =
        new FileReader();


      reader.onload =
      function(event){

        img.onload =
        function(){

          const maxWidth =
            1800;


          let width =
            img.width;

          let height =
            img.height;


          if(
            width > maxWidth
          ){

            height =
              Math.round(
                height *
                maxWidth /
                width
              );

            width =
              maxWidth;
          }


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              "2d"
            );


          /*
            White background.
          */

          ctx.fillStyle =
            "#ffffff";

          ctx.fillRect(
            0,
            0,
            width,
            height
          );


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          resolve(
            canvas.toDataURL(
              "image/jpeg",
              0.95
            )
          );
        };


        img.onerror =
          reject;

        img.src =
          event.target.result;
      };


      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );
    }
  );
}

    progress.style.display =
      "block";

    progress.textContent =
      "Reading photo. Please wait...";

    rawBox.style.display =
      "none";


    try{

      const processedImage =
        await prepareImage(
          selectedFile
        );


      const result =
        await Tesseract.recognize(
          processedImage,
          "eng",
          {

            logger:
            function(info){

              if(info.status){

                let percentage =
                  "";

                if(info.progress){

                  percentage =
                    " " +
                    Math.round(
                      info.progress * 100
                    ) +
                    "%";
                }


                progress.textContent =
                  info.status +
                  percentage;
              }
            }

          }
        );


      const text =
        normalizeText(
          result.data.text
        );


      /*
        Show raw OCR.
      */

      rawText.value =
        text;

      rawBox.style.display =
        "block";


      /* =========================
         EXTRACT DETAILS
      ========================= */

      const vehicle =
        findVehicleNumber(
          text
        );


      const regDate =
        findDateAfterKeyword(
          text,
          [
            "REGISTRATION DATE",
            "REGISTERED DATE",
            "REGISTRATION DAT",
            "REG DATE"
          ]
        );


      const fitness =
        findDateAfterKeyword(
          text,
          [
            "FITNESS VALID UPTO",
            "FITNESS VALID UP TO",
            "FITNESS VALID UP",
            "FITNESS UPTO",
            "FITNESS UP TO"
          ]
        );


      const insurance =
        findDateAfterKeyword(
          text,
          [
            "INSURANCE VALID UPTO",
            "INSURANCE VALID UP TO",
            "INSURANCE VALID UP",
            "INSURANCE UPTO",
            "INSURANCE UP TO"
          ]
        );


      const tax =
        findTax(
          text
        );


      const pucc =
        findDateAfterKeyword(
          text,
          [
            "PUCC VALID UPTO",
            "PUCC VALID UP TO",
            "PUC VALID UPTO",
            "PUC VALID UP TO",
            "PUCC VALID",
            "PUC VALID"
          ]
        );


      const permit =
        findDateAfterKeyword(
          text,
          [
            "PERMIT VALID UPTO",
            "PERMIT VALID UP TO",
            "PERMIT VALID UP",
            "PERMIT UPTO",
            "PERMIT UP TO"
          ]
        );


      /* =========================
         PUT VALUES
      ========================= */

      if(vehicle){

        vehicleNumber.value =
          vehicle;
      }


      if(regDate){

        registrationDate.value =
          regDate;
      }


      if(fitness){

        fitnessExpiry.value =
          fitness;
      }


      if(insurance){

        insuranceExpiry.value =
          insurance;
      }


      if(tax){

        taxExpiry.value =
          tax;
      }


      if(pucc){

        puccExpiry.value =
          pucc;
      }


      if(permit){

        permitExpiry.value =
          permit;
      }


      progress.style.display =
        "none";


      if(vehicle){

        showStatus(
          "Vehicle Number detected: " +
          vehicle +
          ". Please check all details before saving.",
          "success"
        );

      }else{

        showStatus(
          "OCR completed. Please check details and enter Vehicle Number manually if needed.",
          "info"
        );
      }


    }catch(error){

      console.error(error);


      progress.style.display =
        "none";


      showStatus(
        "OCR failed. Please try a clearer photo.",
        "error"
      );
    }


    readBtn.disabled =
      false;
  }
);


/* =====================================
   DATABASE DATE
===================================== */

function convertToDatabaseDate(
  value
){

  if(!value){
    return null;
  }


  value =
    value.trim();


  /*
    LTT remains text.
  */

  if(
    value.toUpperCase() ===
    "LTT"
  ){

    return "LTT";
  }


  const parts =
    value.split("/");


  if(parts.length === 3){

    return (
      parts[2] +
      "-" +
      parts[1] +
      "-" +
      parts[0]
    );
  }


  return value;
}


/* =====================================
   PHOTO UPLOAD
===================================== */

async function uploadPhoto(
  vehicleNo
){

  if(!selectedFile){

    return {

      photo_url:null,

      photo_path:null

    };
  }


  const safeName =
    vehicleNo
      .replace(
        /[^A-Z0-9]/gi,
        "_"
      )
      .toUpperCase();


  const filePath =
    safeName +
    "_" +
    Date.now() +
    ".jpg";


  const {
    data,
    error
  } =
    await supabaseClient
      .storage
      .from("vehicle-photos")
      .upload(
        filePath,
        selectedFile,
        {

          contentType:
            "image/jpeg",

          upsert:false

        }
      );


  if(error){

    throw error;
  }


  const {
    data:publicData
  } =
    supabaseClient
      .storage
      .from("vehicle-photos")
      .getPublicUrl(
        filePath
      );


  return {

    photo_url:
      publicData.publicUrl,

    photo_path:
      filePath

  };
}


/* =====================================
   SAVE / UPDATE
===================================== */

saveBtn.addEventListener(
  "click",
  async function(){

    const vNo =
      vehicleNumber.value
        .trim()
        .toUpperCase();


    if(!vNo){

      showStatus(
        "Vehicle Number is required.",
        "error"
      );

      return;
    }


    saveBtn.disabled =
      true;


    showStatus(
      "Saving vehicle details...",
      "info"
    );


    try{

      /*
        Find existing vehicle.
      */

      const {
        data:existing,
        error:findError
      } =
        await supabaseClient
          .from("vehicles")
          .select("*")
          .eq(
            "vehicle_number",
            vNo
          )
          .maybeSingle();


      if(findError){

        throw findError;
      }


      let photo_url =
        existing?.photo_url ||
        null;


      let photo_path =
        existing?.photo_path ||
        null;


      /*
        New photo:
        upload new photo
        and delete old photo.
      */

      if(selectedFile){

        const uploaded =
          await uploadPhoto(
            vNo
          );


        photo_url =
          uploaded.photo_url;


        photo_path =
          uploaded.photo_path;


        /*
          Delete old photo.
        */

        if(
          existing &&
          existing.photo_path
        ){

          const {
            error:deletePhotoError
          } =
            await supabaseClient
              .storage
              .from("vehicle-photos")
              .remove([
                existing.photo_path
              ]);


          if(deletePhotoError){

            console.warn(
              "Old photo delete warning:",
              deletePhotoError
            );
          }
        }
      }


      /*
        Vehicle data.
      */

      const vehicleData = {

        vehicle_number:
          vNo,

        registration_date:
          convertToDatabaseDate(
            registrationDate.value
          ),

        fitness_expiry:
          convertToDatabaseDate(
            fitnessExpiry.value
          ),

        insurance_expiry:
          convertToDatabaseDate(
            insuranceExpiry.value
          ),

        /*
          Tax:
          LTT stays LTT.
        */

        tax_expiry:
          taxExpiry.value.trim() ||
          null,

        pucc_expiry:
          convertToDatabaseDate(
            puccExpiry.value
          ),

        permit_expiry:
          convertToDatabaseDate(
            permitExpiry.value
          ),

        photo_url:
          photo_url,

        photo_path:
          photo_path

      };


      /*
        UPDATE
      */

      if(existing){

        const {
          error:updateError
        } =
          await supabaseClient
            .from("vehicles")
            .update(
              vehicleData
            )
            .eq(
              "id",
              existing.id
            );


        if(updateError){

          throw updateError;
        }


        showStatus(
          "Vehicle updated successfully. Old photo replaced.",
          "success"
        );

      }

      /*
        INSERT
      */

      else{

        const {
          error:insertError
        } =
          await supabaseClient
            .from("vehicles")
            .insert([
              vehicleData
            ]);


        if(insertError){

          throw insertError;
        }


        showStatus(
          "Vehicle saved successfully.",
          "success"
        );
      }


      /*
        Clear selected photo.
      */

      selectedFile =
        null;

      photoInput.value =
        "";

      preview.style.display =
        "none";


    }catch(error){

      console.error(error);


      showStatus(
        "Save failed: " +
        error.message,
        "error"
      );
    }


    saveBtn.disabled =
      false;
  }
);
