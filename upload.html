<style>

/* =========================================
   GLOBAL
========================================= */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
  color:#222;
}

.container{

h1{

.subtitle{

}

/* =========================================
   CARD
========================================= */

.card{
  background:#fff;
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
  font-size:20px;
}

/* =========================================
   LABEL / INPUT
========================================= */

label{
  display:block;
  font-weight:bold;
  margin:12px 0 6px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#1976d2;
}

textarea{
  min-height:180px;
  resize:vertical;
  font-family:monospace;
}

   BUTTONS
========================================= */

button{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#1976d2;
  color:#fff;
}

.success{
  background:#2e7d32;
  color:#fff;
}

.warning{
  background:#ef6c00;
  color:#fff;
}

.danger{
  background:#c62828;
  color:#fff;
}

.secondary{
  background:#555;
  color:#fff;
}

.button-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:15px;
}

/* =========================================
   PHOTO
========================================= */

.upload-box{
  border:2px dashed #aaa;
  border-radius:12px;
  padding:20px;
  text-align:center;
  cursor:pointer;
  background:#fafafa;
}

.upload-box:hover{
  background:#f0f4f8;
}

#photoPreview{

  width:100%;
  max-height:450px;
  object-fit:contain;
  margin-top:15px;
  border-radius:10px;
  border:1px solid #ddd;
}

/* =========================================
   VEHICLE CLASS
========================================= */

.class-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-top:10px;
}

.class-item{
  border:2px solid #ddd;
  border-radius:10px;
  padding:7px;
  text-align:center;
  cursor:pointer;
  background:#fff;
  transition:.2s;
}

.class-item:hover{

}

.class-item.selected{

  background:#eaf3ff;
}

.class-item img{

  height:70px;
  object-fit:contain;

}

.class-item span{
  display:block;
  font-weight:bold;
  margin-top:5px;

#selectedClassPhoto{

/* =========================================
   STATUS
========================================= */

#status{
  display:none;

}

.status-info{

}

.status-success{

}

.status-error{

/* =========================================
   OCR
========================================= */

.ocr-progress{

.progress-bar{

.progress-fill{

/* =========================================================

/* =========================================================

/* =========================================================

========================================================= */

document.addEventListener(

  async function(){

    const params =

   STATUS
========================================================= */

function showStatus(

/* =========================================================
   PHOTO SELECT
========================================================= */

function handlePhotoSelect(event){

  const file =

  }

  selectedFile =
    file;

  const preview =
    document.getElementById(
      "photoPreview"
    );

  preview.style.display =

  showStatus(
    "Photo selected successfully.",
    "success"
  );

/* =========================================================
   VEHICLE CLASS SELECT
========================================================= */

function selectVehicleClass(className){

  document
    .getElementById("vehicleClass")
    .value =
    className;

  document
    .querySelectorAll(".class-item")
    .forEach(function(item){

      item.classList.remove(

    });

/* =========================================================
   OCR NORMALIZE
========================================================= */

function normalizeOCRText(text){

  return String(text || "")
    .replace(/\r/g,"")
    .replace(/[“”]/g,'"')
    .replace(/[‘’]/g,"'")
    .replace(/[|]/g,"I")
    .replace(/[ \t]+/g," ")
    .replace(/\n[ \t]+/g,"\n")
    .trim();

}


/* =========================================================
   OCR LINES
========================================================= */

function getOCRLines(text){

  return normalizeOCRText(text)
    .split("\n")
    .map(function(line){

      return line
        .replace(/\s+/g," ")
        .trim();

    })
    .filter(function(line){

      return line.length > 0;

    });

}


/* =========================================================
   DATE PARSER
========================================================= */

const MONTHS = {

  JAN:"01",
  FEB:"02",
  MAR:"03",
  APR:"04",
  MAY:"05",
  JUN:"06",
  JUL:"07",
  AUG:"08",
  SEP:"09",
  OCT:"10",
  NOV:"11",
  DEC:"12"

};


function validDateParts(
  day,
  month,
  year
){

  day =
    Number(day);

  month =
    Number(month);

  year =
    Number(year);

  if(
    !Number.isInteger(day) ||
    !Number.isInteger(month) ||
    !Number.isInteger(year)
  ){

    return false;

  }

  if(
    day < 1 ||
    day > 31 ||
    month < 1 ||
    month > 12 ||
    year < 1900 ||
    year > 2100
  ){

    return false;

  }

  return true;

}


function normalizeDateString(value){

  if(!value){

    return "";

  }

  let s =
    String(value)
      .trim()
      .toUpperCase()
      .replace(/[.,]/g," ")
      .replace(/\s+/g," ");

  let m =
    s.match(
      /\b(\d{1,2})[\s\-\/]+([A-Z]{3})[\s\-\/]+(\d{4})\b/
    );

  if(m){

    const day =
      String(m[1]).padStart(2,"0");

    const mon =
      MONTHS[m[2]];

    const year =
      m[3];

    if(
      mon &&
      validDateParts(
        day,
        mon,
        year
      )
    ){

      return (
        day +
        "-" +
        m[2].charAt(0) +
        m[2].slice(1).toLowerCase() +
        "-" +
        year
      );

    }

  }


  m =
    s.match(
      /\b(\d{1,2})[\-\/\s](\d{1,2})[\-\/\s](\d{4})\b/
    );

  if(m){

    const day =
      Number(m[1]);

    const month =
      Number(m[2]);

    const year =
      Number(m[3]);

    if(
      validDateParts(
        day,
        month,
        year
      )
    ){

      const monthName =
        Object.keys(MONTHS)
          .find(function(key){

            return (
              Number(MONTHS[key]) ===
              month
            );

          });

      return (
        String(day).padStart(2,"0") +
        "-" +
        monthName.charAt(0) +
        monthName.slice(1).toLowerCase() +
        "-" +
        year
      );

    }

  }


  m =
    s.match(
      /\b(\d{4})[\-\/](\d{1,2})[\-\/](\d{1,2})\b/
    );

  if(m){

    const year =
      Number(m[1]);

    const month =
      Number(m[2]);

    const day =
      Number(m[3]);

    if(
      validDateParts(
        day,
        month,
        year
      )
    ){

      const monthName =
        Object.keys(MONTHS)
          .find(function(key){

            return (
              Number(MONTHS[key]) ===
              month
            );

          });

      return (
        String(day).padStart(2,"0") +
        "-" +
        monthName.charAt(0) +
        monthName.slice(1).toLowerCase() +
        "-" +
        year
      );

    }

  }


  return "";

}


/* =========================================================
   FIND DATE IN TEXT
========================================================= */

function extractDateFromText(text){

  const patterns = [

    /\b\d{1,2}[\-\/\s][A-Za-z]{3}[\-\/\s]\d{4}\b/i,

    /\b\d{1,2}[\-\/]\d{1,2}[\-\/]\d{4}\b/,

    /\b\d{4}[\-\/]\d{1,2}[\-\/]\d{1,2}\b/

  ];

  for(
    const pattern of patterns
  ){

    const match =
      String(text || "")
        .match(pattern);

    if(match){

      const result =
        normalizeDateString(
          match[0]
        );

      if(result){

        return result;

      }

    }

  }

  return "";

}


/* =========================================================
   STRICT VALUE AFTER LABEL
========================================================= */

function findValueAfterLabels(
  text,
  labels,
  maxLines=3
){

  const lines =
    getOCRLines(text);

  const normalizedLabels =
    labels.map(function(label){

      return label
        .toUpperCase()
        .replace(/\s+/g," ")
        .trim();

    });

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const current =
      lines[i]
        .toUpperCase()
        .replace(/\s+/g," ")
        .trim();

    let matchedLabel =
      null;

    for(
      const label of normalizedLabels
    ){

      if(
        current === label ||
        current.startsWith(
          label + ":"
        ) ||
        current.includes(
          label
        )
      ){

        matchedLabel =
          label;

        break;

      }

    }

    if(!matchedLabel){

      continue;

    }

    let sameLineValue =
      lines[i]
        .substring(
          current.indexOf(
            matchedLabel
          ) +
          matchedLabel.length
        )
        .replace(/^[:\-\s]+/,"")
        .trim();

    let date =
      extractDateFromText(
        sameLineValue
      );

    if(date){

      return date;

    }

    for(
      let j=1;
      j<=maxLines &&
      i+j<lines.length;
      j++
    ){

      date =
        extractDateFromText(
          lines[i+j]
        );

      if(date){

        return date;

      }

    }

  }

  return "";

}


/* =========================================================
   INSURANCE DETAILS BLOCK
========================================================= */

function findInsuranceBlockDate(text){

  const lines =
    getOCRLines(text);

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const line =
      lines[i]
        .toUpperCase();

    if(
      line.includes(
        "INSURANCE DETAILS"
      )
    ){

      for(
        let j=i+1;
        j<=i+8 &&
        j<lines.length;
        j++
      ){

        const check =
          lines[j]
            .toUpperCase();

        if(
          check.includes("VALIDITY") ||
          check.includes("VALID")
        ){

          const same =
            lines[j]
              .replace(
                /.*?VALID(?:ITY)?\s*[:\-]?\s*/i,
                ""
              );

          let date =
            extractDateFromText(
              same
            );

          if(date){

            return date;

          }

          for(
            let k=j+1;
            k<=j+2 &&
            k<lines.length;
            k++
          ){

            date =
              extractDateFromText(
                lines[k]
              );

            if(date){

              return date;

            }

          }

        }

      }

    }

  }

  return "";

}


/* =========================================================
   TAX EXTRACTION
========================================================= */

function findTaxValue(text){

  const lines =
    getOCRLines(text);

  const taxLabels = [

    "MV TAX",
    "TAX VALID UPTO",
    "TAX VALID UP TO",
    "TAX VALID",
    "ROAD TAX",
    "TAX"

  ];

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const upper =
      lines[i]
        .toUpperCase();

    let matched =
      false;

    for(
      const label of taxLabels
    ){

      if(
        upper === label ||
        upper.startsWith(label + ":") ||
        upper.includes(label)
      ){

        matched = true;

        break;

      }

    }

    if(!matched){

      continue;

    }

    const windowLines = [];

    windowLines.push(
      lines[i]
    );

    for(
      let j=1;
      j<=3 &&
      i+j<lines.length;
      j++
    ){

      windowLines.push(
        lines[i+j]
      );

    }

    const localText =
      windowLines.join(" ");

    if(
      /\bL\s*T\s*T\b/i.test(localText) ||
      /\bLTT\b/i.test(localText) ||
      /\bL7T\b/i.test(localText) ||
      /\bLT7\b/i.test(localText) ||
      /\bLIT\b/i.test(localText) ||
      /\bLII\b/i.test(localText)
    ){

      return "LTT";

    }

    const date =
      extractDateFromText(
        localText
      );

    if(date){

      return date;

    }

  }

  return "";

}


/* =========================================================
   VEHICLE NUMBER NORMALIZATION
   IMPORTANT:
   DO NOT CHANGE SERIES LETTERS.
   ONLY RTO 2 DIGITS MAY BE OCR-CORRECTED.
========================================================= */

function cleanVehicleCandidate(raw){

  if(!raw){

    return "";

  }

  let s =
    String(raw)
      .toUpperCase()
      .replace(/[^A-Z0-9]/g,"");

  if(!s){

    return "";

  }

  /*
     Only repair the beginning GJ.
  */

  if(/^G7/.test(s)){

    s =
      "GJ" +
      s.substring(2);

  }

  else if(/^6J/.test(s)){

    s =
      "GJ" +
      s.substring(2);

  }

  else if(/^GJ/.test(s)){

    /* correct */

  }

  else{

    return "";

  }


  /*
     Expected Gujarat format:

     GJ + 2 RTO digits
     + 1 to 3 series letters
     + 3 to 5 number digits
  */

  const match =
    s.match(
      /^GJ(.{2})([A-Z]{1,3})([A-Z0-9]{3,5})$/
    );

  if(!match){

    return "";

  }


  let rto =
    match[1];

  let series =
    match[2];

  let numberPart =
    match[3];


  /*
     RTO CODE ONLY:
     OCR corrections are allowed here.
  */

  rto =
    rto
      .replace(/O/g,"0")
      .replace(/Q/g,"0")
      .replace(/D/g,"0")
      .replace(/I/g,"1")
      .replace(/L/g,"1")
      .replace(/Z/g,"2")
      .replace(/S/g,"5")
      .replace(/B/g,"8")
      .replace(/G/g,"6")
      .replace(/T/g,"7");


  if(
    !/^\d{2}$/.test(rto)
  ){

    return "";

  }


  /*
     SERIES:
     Keep letters exactly as OCR reads them.

     IMPORTANT:
     S must remain S.
     Q must remain Q.
     I must remain I.
  */

  if(
    !/^[A-Z]{1,3}$/.test(series)
  ){

    return "";

  }


  /*
     NUMBER PART:
     Only OCR letter-to-number corrections.
     We DO NOT convert numbers into letters.
  */

  numberPart =
    numberPart
      .replace(/O/g,"0")
      .replace(/Q/g,"0")
      .replace(/D/g,"0")
      .replace(/I/g,"1")
      .replace(/L/g,"1")
      .replace(/Z/g,"2")
      .replace(/S/g,"5")
      .replace(/B/g,"8")
      .replace(/G/g,"6")
      .replace(/T/g,"7");


  if(
    !/^\d{3,5}$/.test(numberPart)
  ){

    return "";

  }


  return (
    "GJ" +
    rto +
    series +
    numberPart
  );

}


/* =========================================================
   VEHICLE NUMBER EXTRACTION
   NEW SAFE VERSION
========================================================= */

function extractVehicleNumber(text){

  const lines =
    getOCRLines(text);

  const candidates = [];


  function addCandidate(
    raw,
    score,
    source
  ){

    const cleaned =
      cleanVehicleCandidate(raw);

    if(!cleaned){

      return;

    }

    candidates.push({

      value:cleaned,

      score:score,

      source:source || ""

    });

  }


  /*
     -------------------------------------------------------
     STEP 1
     ONLY use text immediately after VEHICLE NUMBER.
     This is the most reliable source.
     -------------------------------------------------------
  */

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const originalLine =
      lines[i].trim();

    const upperLine =
      originalLine
        .toUpperCase()
        .replace(/\s+/g," ")
        .trim();


    const labelMatch =
      upperLine.match(
        /VEHICLE\s+NUMBER/
      );


    if(!labelMatch){

      continue;

    }


    /*
       Same line:
       Vehicle Number GJ34S1419
    */

    let sameLine =
      originalLine
        .replace(
          /^.*?VEHICLE\s+NUMBER\s*:?\s*/i,
          ""
        )
        .trim();


    /*
       Extract ONLY a vehicle-shaped token.
    */

    const sameMatch =
      sameLine.match(
        /(?:GJ|G7|6J)[A-Z0-9\s]{5,14}/i
      );


    if(sameMatch){

      addCandidate(
        sameMatch[0],
        120,
        "vehicle-number-same-line"
      );

    }


    /*
       Next 2 lines only.
    */

    for(
      let j=1;
      j<=2 &&
      i+j<lines.length;
      j++
    ){

      const nextLine =
        lines[i+j].trim();


      const match =
        nextLine.match(
          /(?:GJ|G7|6J)[A-Z0-9\s]{5,14}/i
        );


      if(match){

        addCandidate(
          match[0],
          115-j,
          "vehicle-number-next-line"
        );

      }

    }

  }


  /*
     -------------------------------------------------------
     STEP 2
     Scan individual tokens ONLY inside the local area
     around "Vehicle Number".
     -------------------------------------------------------
  */

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    if(
      !/VEHICLE\s+NUMBER/i.test(
        lines[i]
      )
    ){

      continue;

    }


    for(
      let j=0;
      j<=3 &&
      i+j<lines.length;
      j++
    ){

      const localLine =
        lines[i+j];


      const tokens =
        localLine
          .toUpperCase()
          .split(/[\s:,\-]+/)
          .filter(Boolean);


      for(
        const token of tokens
      ){

        if(
          /^(?:GJ|G7|6J)[A-Z0-9]{5,12}$/.test(
            token
          )
        ){

          addCandidate(
            token,
            105-j,
            "local-token"
          );

        }

      }

    }

  }


  /*
     -------------------------------------------------------
     STEP 3
     Global scan.
     This has LOW priority.
     -------------------------------------------------------
  */

  const normalized =
    normalizeOCRText(text)
      .toUpperCase();


  const globalTokens =
    normalized
      .replace(
        /[^A-Z0-9\s]/g,
        " "
      )
      .split(/\s+/)
      .filter(Boolean);


  for(
    const token of globalTokens
  ){

    if(
      /^(?:GJ|G7|6J)[A-Z0-9]{5,12}$/.test(
        token
      )
    ){

      addCandidate(
        token,
        30,
        "global"
      );

    }

  }


  /*
     -------------------------------------------------------
     STEP 4
     COUNT SAME VALID VEHICLE NUMBERS.

     If 3 OCR passes give the same number,
     that number gets priority.
     -------------------------------------------------------
  */

  const grouped = {};


  candidates.forEach(function(item){

    if(!grouped[item.value]){

      grouped[item.value] = {

        count:0,

        bestScore:0,

        value:item.value

      };

    }


    grouped[item.value].count++;


    if(
      item.score >
      grouped[item.value].bestScore
    ){

      grouped[item.value].bestScore =
        item.score;

    }

  });


  const finalCandidates =
    Object.values(grouped);


  finalCandidates.sort(
    function(a,b){

      /*
         First priority:
         repeated OCR result.

         Second:
         location score.

         This prevents one bad OCR pass from
         automatically winning.
      */

      const aScore =
        (
          a.count * 1000
        ) +
        a.bestScore;


      const bScore =
        (
          b.count * 1000
        ) +
        b.bestScore;


      return bScore - aScore;

    }
  );


  return (
    finalCandidates[0]?.value ||
    ""
  );

}


/* =========================================================
   VEHICLE CLASS DETECTION
========================================================= */

function detectVehicleClass(text){

  const upper =
    normalizeOCRText(text)
      .toUpperCase();


  if(
    /\bHGV\b/.test(upper)
  ){

    return "HGV";

  }

  if(
    /\bMGV\b/.test(upper)
  ){

    return "MGV";

  }

  if(
    /\bMPV\b/.test(upper)
  ){

    return "MPV";

  }

  if(
    /\bLGV\b/.test(upper)
  ){

    return "LGV";

  }

  if(
    /\bLMV\b/.test(upper)
  ){

    return "LMV";

  }

  if(
    /\bLPV\b/.test(upper)
  ){

    return "LPV";

  }

  if(
    /\bHPV\b/.test(upper)
  ){

    return "HPV";

  }

  if(
    /\b2WN\b/.test(upper)
  ){

    return "2WN";

  }

  if(
    /\b3WT\b/.test(upper)
  ){

    return "3WT";

  }

  if(
    /\bOTH\b/.test(upper)
  ){

    return "OTH";

  }


  if(
    upper.includes(
      "CONSTRUCTION EQUIPMENT VEHICLE"
    )
  ){

    return "OTH";

  }


  if(
    upper.includes("M-CYCLE") ||
    upper.includes("MOTORCYCLE") ||
    upper.includes("MOTOR CYCLE") ||
    upper.includes("SCOOTER") ||
    upper.includes("TWO WHEELER")
  ){

    return "2WN";

  }


  if(
    upper.includes("THREE WHEELER") ||
    upper.includes("AUTO RICKSHAW") ||
    upper.includes("AUTORICKSHAW")
  ){

    return "3WT";

  }


  if(
    upper.includes("BUS")
  ){

    return "HPV";

  }


  if(
    upper.includes("TRACTOR") ||
    upper.includes("PICK-UP") ||
    upper.includes("PICK UP") ||
    upper.includes("GOODS VEHICLE")
  ){

    return "LGV";

  }


  if(
    upper.includes("MOTOR CAR") ||
    upper.includes("CAR")
  ){

    return "LMV";

  }


  return "";

}

/* =========================================================
   ENHANCED IMAGE
========================================================= */

function createEnhancedImage(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();

      reader.onload =
        function(e){

          const img =
            new Image();

          img.onload =
            function(){

              const canvas =
                document.createElement(
                  "canvas"
                );

              const minWidth =
                1800;

              const scale =
                Math.max(
                  1,
                  minWidth /
                  img.width
                );

              canvas.width =
                Math.round(
                  img.width * scale
                );

              canvas.height =
                Math.round(
                  img.height * scale
                );


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              const imageData =
                ctx.getImageData(
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );


              const data =
                imageData.data;


              for(
                let i=0;
                i<data.length;
                i+=4
              ){

                const r =
                  data[i];

                const g =
                  data[i+1];

                const b =
                  data[i+2];


                const gray =
                  0.299*r +
                  0.587*g +
                  0.114*b;


                const contrast =
                  (gray - 128) *
                  1.5 +
                  128;


                const value =
                  Math.max(
                    0,
                    Math.min(
                      255,
                      contrast
                    )
                  );


                data[i] =
                  value;

                data[i+1] =
                  value;

                data[i+2] =
                  value;

              }


              ctx.putImageData(
                imageData,
                0,
                0
              );


              canvas.toBlob(
                function(blob){

                  if(blob){

                    resolve(blob);

                  }
                  else{

                    reject(
                      new Error(
                        "Could not create enhanced image."
                      )
                    );

                  }

                },
                "image/jpeg",
                0.95
              );

            };


          img.onerror =
            function(){

              reject(
                new Error(
                  "Image loading failed."
                )
              );

            };


          img.src =
            e.target.result;

        };


      reader.onerror =
        function(){

          reject(
            new Error(
              "File reading failed."
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   OCR PASS
========================================================= */

async function recognizeOCR(
  image,
  passNumber,
  totalPasses
){

  const result =
    await Tesseract.recognize(
      image,
      "eng",
      {

        logger:function(info){

          if(
            info.status ===
            "recognizing text"
          ){

            const local =
              Number(
                info.progress || 0
              );

            const percent =
              Math.round(
                (
                  (
                    passNumber - 1
                  ) /
                  totalPasses
                  +
                  local /
                  totalPasses
                ) * 100
              );

            document
              .getElementById(
                "progressFill"
              )
              .style.width =
              percent + "%";


            document
              .getElementById(
                "ocrStatus"
              )
              .textContent =
              "OCR Step " +
              passNumber +
              " of " +
              totalPasses +
              " — " +
              Math.round(
                local * 100
              ) +
              "%";

          }

        }

      }
    );

  return result.data.text || "";

}


/* =========================================================
   3-STEP OCR
========================================================= */

async function startOCR(){

  if(!selectedFile){

    showStatus(
      "Please select a vehicle photo first.",
      "error"
    );

    return;

  }


  const ocrButton =
    document.getElementById(
      "ocrButton"
    );

  ocrButton.disabled =
    true;

  ocrButton.textContent =
    "⏳ Reading...";


  document
    .getElementById(
      "ocrProgress"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "progressFill"
    )
    .style.width =
    "0%";


  try{

    /* OCR STEP 1 */

    document
      .getElementById(
        "ocrStatus"
      )
      .textContent =
      "OCR Step 1 of 3 — Original image";


    const text1 =
      await recognizeOCR(
        selectedFile,
        1,
        3
      );


    /* OCR STEP 2 */

    document
      .getElementById(
        "ocrStatus"
      )
      .textContent =
      "Preparing OCR Step 2...";


    const enhancedImage =
      await createEnhancedImage(
        selectedFile
      );


    const text2 =
      await recognizeOCR(
        enhancedImage,
        2,
        3
      );


    /* OCR STEP 3 */

    document
      .getElementById(
        "ocrStatus"
      )
      .textContent =
      "OCR Step 3 of 3 — High quality pass";


    const finalImage =
      await createEnhancedImage(
        selectedFile
      );


    const text3 =
      await recognizeOCR(
        finalImage,
        3,
        3
      );


    /* COMBINE */

    const combinedText =
      [
        text1,
        text2,
        text3
      ]
      .filter(function(text){

        return text &&
               text.trim();

      })
      .join(
        "\n\n===== OCR PASS =====\n\n"
      );


    document
      .getElementById(
        "ocrText"
      )
      .value =
      combinedText;


    extractOCRData();


    document
      .getElementById(
        "progressFill"
      )
      .style.width =
      "100%";


    document
      .getElementById(
        "ocrStatus"
      )
      .textContent =
      "OCR completed successfully.";


    showStatus(
      "3-step OCR completed. Please check Vehicle Number and dates before saving.",
      "success"
    );

  }
  catch(error){

    console.error(
      "OCR ERROR:",
      error
    );

    showStatus(
      "OCR failed: " +
      error.message,
      "error"
    );

  }
  finally{

    ocrButton.disabled =
      false;

    ocrButton.textContent =
      "🔍 Read Vehicle Details";

  }

}

        "vehicleNumber"
      )
      .value =
      data.vehicle_number ||
      "";


    document
      .getElementById(
        "registrationDate"
      )
      .value =
      data.registration_date ||
      "";


    document
      .getElementById(
        "fitnessExpiry"
      )
      .value =
      data.fitness_expiry ||
      "";


    document
      .getElementById(
        "insuranceExpiry"
      )
      .value =
      data.insurance_expiry ||
      "";


    document
      .getElementById(
        "taxExpiry"
      )
      .value =
      data.tax_expiry ||
      "";


    document
      .getElementById(
        "puccExpiry"
      )
      .value =
      data.pucc_expiry ||
      "";


    document
      .getElementById(
        "permitExpiry"
      )
      .value =
      data.permit_expiry ||
      "";


    document
      .getElementById(
        "ocrText"
      )
      .value =
      data.ocr_text ||
      "";


    if(data.vehicle_class){

      selectVehicleClass(
        data.vehicle_class
      );

    }


    oldPhotoPath =
      data.photo_path ||
      null;


    if(data.photo_url){

      const preview =
        document.getElementById(
          "photoPreview"
        );

      preview.src =
        data.photo_url;

      preview.style.display =
        "block";

    }


    showStatus(
      "Vehicle loaded for editing.",
      "success"

  }
  catch(error){

    console.error(
      error
    );

    showStatus(
      "Could not load vehicle: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   DELETE STORAGE FILE
========================================================= */

async function deleteStorageFile(
  path
){

  if(!path){

    return;

  }

  try{

    const {
      error
    } =
    await supabaseClient
      .storage
      .from(
        STORAGE_BUCKET
      )
      .remove([
        path
      ]);

    if(error){

      console.warn(
        "Old photo delete warning:",
        error
      );

    }

  }
  catch(error){

    console.warn(
      "Storage delete error:",
      error
    );

  }

}


/* =========================================================
   UPLOAD PHOTO
========================================================= */

async function uploadVehiclePhoto(
  file,
  vehicleNumber
){

  const cleanNumber =
    cleanVehicleNumberForFile(
      vehicleNumber
    );


  const fileName =
    cleanNumber +
    "_" +
    Date.now() +
    ".jpg";


  const filePath =
    fileName;


  const {
    error
  } =
  await supabaseClient
    .storage
    .from(
      STORAGE_BUCKET
    )
    .upload(
      filePath,
      file,
      {
        contentType:
          file.type ||
          "image/jpeg",
        upsert:false
      }
    );


  if(error){

    throw error;

  }


  const {
    data
  } =
  supabaseClient
    .storage
    .from(
      STORAGE_BUCKET
    )
    .getPublicUrl(
      filePath
    );


  return {

    path:filePath,

    url:
      data.publicUrl

  };

}


/* =========================================================
   SAVE VEHICLE
========================================================= */

async function saveVehicle(){

  const saveButton =
    document.getElementById(
      "saveButton"
    );

  const vehicleNumber =
    document
      .getElementById(
        "vehicleNumber"
      )
      .value
      .trim()
      .toUpperCase();


  const customerName =
    document
      .getElementById(
        "customerName"
      )
      .value
      .trim();


  const customerMobile =
    document
      .getElementById(
        "customerMobile"
      )
      .value
      .trim();


  const vehicleClass =
    document
      .getElementById(
        "vehicleClass"
      )
      .value
      .trim();


  const registrationDate =
    document
      .getElementById(
        "registrationDate"
      )
      .value
      .trim();


  const fitnessExpiry =
    document
      .getElementById(
        "fitnessExpiry"
      )
      .value
      .trim();


  const insuranceExpiry =
    document
      .getElementById(
        "insuranceExpiry"
      )
      .value
      .trim();


  const taxExpiry =
    document
      .getElementById(
        "taxExpiry"
      )
      .value
      .trim();


  const puccExpiry =
    document
      .getElementById(
        "puccExpiry"
      )
      .value
      .trim();


  const permitExpiry =
    document
      .getElementById(
        "permitExpiry"
      )
      .value
      .trim();


  const ocrText =
    document
      .getElementById(
        "ocrText"
      )
      .value;


  if(!vehicleNumber){

    showStatus(
      "Vehicle Number is required.",
      "error"
    );

    return;

  }


  const numberCheck =
    /^GJ\d{2}[A-Z]{1,3}\d{3,5}$/;


  if(
    !numberCheck.test(
      vehicleNumber
    )
  ){

    showStatus(
      "Please check Vehicle Number. Example: GJ34S1419",
      "error"
    );

    return;

  }


  saveButton.disabled =
    true;

  saveButton.textContent =
    "⏳ Saving...";


  let newPhotoPath =
    null;


  try{

    /* CHECK DUPLICATE */

    let duplicateQuery =
      supabaseClient
        .from("vehicles")
        .select("*")
        .eq(
          "vehicle_number",
          vehicleNumber
        );


    if(editId){

      duplicateQuery =
        duplicateQuery.neq(
          "id",
          editId
        );

    }


    const {
      data:duplicates,
      error:duplicateError
    } =
    await duplicateQuery;


    if(duplicateError){

      throw duplicateError;

    }


    if(
      duplicates &&
      duplicates.length > 0
    ){

      showStatus(
        "This vehicle number already exists.",
        "error"
      );

      return;

    }


    /* PHOTO */

    let photoUrl =
      null;

    let photoPath =
      null;


    if(selectedFile){

      const uploadResult =
        await uploadVehiclePhoto(
          selectedFile,
          vehicleNumber
        );


      photoUrl =
        uploadResult.url;

      photoPath =
        uploadResult.path;

      newPhotoPath =
        photoPath;

    }
    else if(editId){

      const {
        data:oldVehicle,
        error:oldVehicleError
      } =
      await supabaseClient
        .from("vehicles")
        .select(
          "photo_url,photo_path"
        )
        .eq(
          "id",
          editId
        )
        .single();


      if(oldVehicleError){

        throw oldVehicleError;

      }


      photoUrl =
        oldVehicle?.photo_url ||
        null;

      photoPath =
        oldVehicle?.photo_path ||
        oldPhotoPath ||
        null;

    }


    /* DATA */

    const vehicleData = {

      vehicle_number:
        vehicleNumber,

      customer_name:
        customerName,

      customer_mobile:
        customerMobile,

      mobile:
        customerMobile,

      vehicle_class:
        vehicleClass,

      registration_date:
        registrationDate,

      fitness_expiry:
        fitnessExpiry,

      insurance_expiry:
        insuranceExpiry,

      tax_expiry:
        taxExpiry,

      pucc_expiry:
        puccExpiry,

      permit_expiry:
        permitExpiry,

      photo_url:
        photoUrl,

      photo_path:
        photoPath,

      ocr_text:
        ocrText

    };


    /* UPDATE */

    if(editId){

      const {
        error
      } =
      await supabaseClient
        .from("vehicles")
        .update(
          vehicleData
        )
        .eq(
          "id",
          editId
        );


      if(error){

        if(newPhotoPath){

          await deleteStorageFile(
            newPhotoPath
          );

        }

        throw error;

      }


      if(
        newPhotoPath &&
        oldPhotoPath &&
        newPhotoPath !==
        oldPhotoPath
      ){

        await deleteStorageFile(
          oldPhotoPath
        );

      }


      showStatus(
        "Vehicle updated successfully. Old photo replaced.",
        "success"
      );

    }

    /* INSERT */

    else{

      const {
        error
      } =
      await supabaseClient
        .from("vehicles")
        .insert([
          vehicleData
        ]);


      if(error){

        if(newPhotoPath){

          await deleteStorageFile(
            newPhotoPath
          );

        }

        throw error;

      }


      showStatus(
        "Vehicle saved successfully.",
        "success"
      );

    }


    /* DASHBOARD */

    setTimeout(
      function(){

        window.location.href =
          "index.html";

      },
      1200
    );

  }
  catch(error){

    console.error(
      "SAVE ERROR:",
      error
    );


    showStatus(
      "Save failed: " +
      error.message,
      "error"
    );

  }
  finally{

    saveButton.disabled =
      false;

    saveButton.textContent =
      "💾 Save Vehicle";

  }

}

  window.location.href =

}
