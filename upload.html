   ===================================================== */

function showStatus(message,type="info"){

        "status " + type;

/* =====================================================
   VEHICLE CLASS IMAGE
   ===================================================== */

function normalizeVehicleClass(value){

    if(!value)
        return "";

    const v =
        value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g,"");

    if(
        v.includes("LMV") ||
        v.includes("MOTORCAR") ||
        v.includes("LIGHTMOTORVEHICLE")
    ){
        return "LMV";
    }

    if(
        v.includes("HGV") ||
        v.includes("HEAVYGOODS")
    ){
        return "HGV";
    }

    if(
        v.includes("LGV") ||
        v.includes("LIGHTGOODS")
    ){
        return "LGV";
    }

    if(
        v.includes("LPV") ||
        v.includes("LIGHTPASSENGER")
    ){
        return "LPV";
    }

    if(
        v.includes("2WN") ||
        v.includes("TWOWHEELER") ||
        v.includes("MOTORCYCLE")
    ){
        return "2WN";
    }

    if(
        v.includes("3WT") ||
        v.includes("THREEWHEELER")
    ){
        return "3WT";
    }

    if(
        v.includes("BUS")
    ){
        return "BUS";
    }

    return "";
}


function showVehicleClass(value){

    const classCode =
        normalizeVehicleClass(value);

    if(!classCode){

        vehicleClassBox.style.display =
            "none";

        vehicleClassImage.removeAttribute(
            "src"
        );

        return;
    }


    vehicleClassInput.value =
        classCode;


    vehicleClassName.textContent =
        classCode;


    const imageFile =
        classCode.toLowerCase() +
        ".png";


    vehicleClassImage.src =
        VEHICLE_CLASS_IMAGE_BASE +
        imageFile;


    vehicleClassImage.onerror =
        function(){

            vehicleClassBox.style.display =
                "none";

            console.warn(
                "Vehicle class image not found:",
                imageFile
            );
        };


    vehicleClassImage.onload =
        function(){

            vehicleClassBox.style.display =
                "block";
        };
}


/* =====================================================
   VEHICLE CLASS FROM OCR
   ===================================================== */

function findVehicleClass(text){

    const lines =
        text.split(/\n+/);

    for(const line of lines){

        const lower =
            line.toLowerCase();

        if(
            lower.includes("vehicle class") ||
            lower.includes("vehicleclass") ||
            lower.includes("class")
        ){

            const normalized =
                normalizeVehicleClass(
                    line
                );

            if(normalized)
                return normalized;
        }
    }


    const wholeText =
        text.toUpperCase();


    const classes = [
        "HGV",
        "LGV",
        "LMV",
        "LPV",
        "2WN",
        "3WT",
        "BUS"
    ];


    for(const cls of classes){

        if(
            new RegExp(
                "\\b" + cls + "\\b"
            ).test(wholeText)
        ){

            return cls;
        }
    }


    return "";
}


/* =====================================================
   PHOTO PREVIEW
   ===================================================== */

photoInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file){

            selectedFile = null;

            preview.innerHTML = "";

            return;
        }

        const url =
            URL.createObjectURL(file);


        preview.innerHTML = `
            <img
                src="${url}"
                alt="Vehicle Photo"
            >
        `;
    }
);


/* =====================================================
   DATE CONVERSION
   ===================================================== */

function convertOCRDate(value){

    if(!value)
        return "";

    value =
        value.trim();

    let m;


    /* DD-MMM-YYYY */

    m =
        value.match(
            /^(\d{1,2})[-\/ ]([A-Za-z]{3,})[-\/ ](\d{4})$/
        );


    if(m){

        const day =
            m[1].padStart(2,"0");


        const monthName =
            m[2]
            .substring(0,3)
            .toLowerCase();


        const months = {

            jan:"01",
            feb:"02",
            mar:"03",
            apr:"04",
            may:"05",
            jun:"06",
            jul:"07",
            aug:"08",
            sep:"09",
            oct:"10",
            nov:"11",
            dec:"12"
        };


        const month =
            months[monthName];


        if(month){

            return `${m[3]}-${month}-${day}`;
        }
    }


    /* DD/MM/YYYY */

    m =
        value.match(
            /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
        );


    if(m){

        return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
    }


    /* YYYY-MM-DD */

    m =
        value.match(
            /^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/
        );


    if(m){

        return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
    }


    return "";
}


/* =====================================================
   FIND DATE AFTER KEYWORD
   ===================================================== */

function findDateAfterKeyword(
    text,
    keywords
){

    const lines =
        text.split(/\n+/);


    for(const line of lines){

        const lower =
            line.toLowerCase();


        const found =
            keywords.some(
                k =>
                lower.includes(k)
            );


        if(!found)
            continue;


        const match =
            line.match(
                /\b\d{1,2}[-\/ ](?:[A-Za-z]{3,9}[-\/ ]|\d{1,2}[-\/])\d{4}\b|\b\d{4}[-\/]\d{1,2}[-\/]\d{1,2}\b/g
            );


        if(match){

            for(const d of match){

                const converted =
                    convertOCRDate(d);


                if(converted)
                    return converted;
            }
        }
    }


    return "";
}


/* =====================================================
   VEHICLE NUMBER
   ===================================================== */

function findVehicleNumber(text){

    const cleaned =
        text
        .toUpperCase()
        .replace(/\s+/g," ");


    const match =
        cleaned.match(
            /\b[A-Z]{2}\s?\d{1,2}\s?[A-Z]{1,3}\s?\d{3,4}\b/
        );


    if(!match)
        return "";


    return match[0]
        .replace(/\s+/g,"")
        .trim();
}


/* =====================================================
   TAX
   ===================================================== */

function findTax(text){

    const lines =
        text.split(/\n+/);


    for(const line of lines){

        const lower =
            line.toLowerCase();


        if(
            lower.includes("tax valid") ||
            lower.includes("tax valid up") ||
            lower.includes("tax")
        ){

            if(
                lower.includes("ltt") ||
                lower.includes("life time tax")
            ){

                return "LTT";
            }


            const date =
                convertOCRDate(
                    findDateFromLine(line)
                );


            if(date)
                return date;
        }
    }


    if(
        text
        .toLowerCase()
        .includes("ltt")
    ){

        return "LTT";
    }


    return "";
}


function findDateFromLine(line){

    const matches =
        line.match(
            /\b\d{1,2}[-\/ ](?:[A-Za-z]{3,9}[-\/ ]|\d{1,2}[-\/])\d{4}\b|\b\d{4}[-\/]\d{1,2}[-\/]\d{1,2}\b/g
        );


    if(!matches)
        return "";


    return matches[0];
}


/* =====================================================
   OCR
   ===================================================== */

ocrBtn.addEventListener(
    "click",
    async function(){

        if(!selectedFile){

            showStatus(
                "Please select a vehicle photo first.",
                "error"
            );

            return;
        }


        ocrBtn.disabled = true;


        showStatus(
            "Reading vehicle photo... Please wait.",
            "info"
        );


        try{

            const result =
                await Tesseract.recognize(
                    selectedFile,
                    "eng",
                    {

                        logger:
                        function(info){

                            if(
                                info.status ===
                                "recognizing text"
                            ){

                                const percent =
                                    Math.round(
                                        info.progress * 100
                                    );


                                showStatus(
                                    "OCR in progress: " +
                                    percent +
                                    "%",
                                    "info"
                                );
                            }
                        }
                    }
                );


            const text =
                result.data.text || "";


            document.getElementById(
                "ocrText"
            ).value = text;


            /* Vehicle Number */

            const vehicleNumber =
                findVehicleNumber(text);


            if(vehicleNumber){

                document.getElementById(
                    "vehicleNumber"
                ).value =
                    vehicleNumber;
            }


            /* Vehicle Class */

            const vehicleClass =
                findVehicleClass(text);


            if(vehicleClass){

                showVehicleClass(
                    vehicleClass
                );
            }


            /* Registration */

            const registration =
                findDateAfterKeyword(
                    text.toLowerCase(),
                    [
                        "registration",
                        "registering date",
                        "registered"
                    ]
                );


            if(registration){

                document.getElementById(
                    "registrationDate"
                ).value =
                    registration;
            }


            /* Fitness */

            const fitness =
                findDateAfterKeyword(
                    text.toLowerCase(),
                    [
                        "fitness",
                        "fitness valid"
                    ]
                );


            if(fitness){

                document.getElementById(
                    "fitnessExpiry"
                ).value =
                    fitness;
            }


            /* Insurance */

            const insurance =
                findDateAfterKeyword(
                    text.toLowerCase(),
                    [
                        "insurance",
                        "insurance valid"
                    ]
                );


            if(insurance){

                document.getElementById(
                    "insuranceExpiry"
                ).value =
                    insurance;
            }


            /* PUCC */

            const pucc =
                findDateAfterKeyword(
                    text.toLowerCase(),
                    [
                        "pucc",
                        "puc",
                        "pollution"
                    ]
                );


            if(pucc){

                document.getElementById(
                    "puccExpiry"
                ).value =
                    pucc;
            }


            /* Permit */

            const permit =
                findDateAfterKeyword(
                    text.toLowerCase(),
                    [
                        "permit",
                        "permit valid"
                    ]
                );


            if(permit){

                document.getElementById(
                    "permitExpiry"
                ).value =
                    permit;
            }


            /* Tax */

            const tax =
                findTax(text);


            if(tax){

                document.getElementById(
                    "taxExpiry"
                ).value =
                    tax;
            }


            showStatus(
                "OCR completed. Please check the details before saving.",
                "success"
            );

        }
        catch(error){

            console.error(error);


            showStatus(
                "OCR error: " +
                (
                    error.message ||
                    error
                ),
                "error"
            );

        }
        finally{

            ocrBtn.disabled = false;
        }
    }
);


/* =====================================================
   STORAGE PHOTO UPLOAD
   ===================================================== */

async function uploadPhoto(
    file,
    vehicleNumber
){

    if(!file)
        return null;


    const safeVehicle =
        vehicleNumber
        .toUpperCase()
        .replace(
            /[^A-Z0-9]/g,
            ""
        );


    const extension =
        file.name.includes(".")
        ? file.name
            .split(".")
            .pop()
            .toLowerCase()
        : "jpg";


    const fileName =
        safeVehicle +
        "_" +
        Date.now() +
        "." +
        extension;


    showStatus(
        "Uploading vehicle photo to Supabase Storage...",
        "info"
    );


    const {
        data,
        error
    } =
    await supabaseClient
        .storage
        .from("vehicle-photos")
        .upload(
            fileName,
            file,
            {
                upsert:false,

                contentType:
                    file.type ||
                    "image/jpeg"
            }
        );


    if(error){

        console.error(
            "Storage upload error:",
            error
        );


        throw new Error(
            "Photo upload failed: " +
            error.message
        );
    }


    const {
        data: publicData
    } =
    supabaseClient
        .storage
        .from("vehicle-photos")
        .getPublicUrl(
            fileName
        );


    if(
        !publicData ||
        !publicData.publicUrl
    ){

        throw new Error(
            "Photo uploaded, but public URL could not be created."
        );
    }


    return {

        url:
            publicData.publicUrl,

        path:
            fileName
    };
}


/* =====================================================
   DELETE OLD PHOTO
   ===================================================== */

async function deleteOldPhoto(path){

    if(!path)
        return;


    const {
        error
    } =
    await supabaseClient
        .storage
        .from("vehicle-photos")
        .remove(
            [path]
        );


    if(error){

        console.warn(
            "Old photo delete warning:",
            error
        );
    }
}


/* =====================================================
   SAVE VEHICLE
   ===================================================== */

saveBtn.addEventListener(
    "click",
    async function(){

        saveBtn.disabled = true;


        try{

            const vehicleNumber =
                document.getElementById(
                    "vehicleNumber"
                ).value
                .trim()
                .toUpperCase();


            if(!vehicleNumber){

                throw new Error(
                    "Vehicle Number is required."
                );
            }


            const customerName =
                document.getElementById(
                    "customerName"
                ).value
                .trim();


            const customerMobile =
                document.getElementById(
                    "customerMobile"
                ).value
                .trim();


            const vehicleClass =
                normalizeVehicleClass(
                    document.getElementById(
                        "vehicleClass"
                    ).value
                );


            const registrationDate =
                document.getElementById(
                    "registrationDate"
                ).value
                .trim();


            const fitnessExpiry =
                document.getElementById(
                    "fitnessExpiry"
                ).value
                .trim();


            const insuranceExpiry =
                document.getElementById(
                    "insuranceExpiry"
                ).value
                .trim();


            const taxExpiry =
                document.getElementById(
                    "taxExpiry"
                ).value
                .trim();


            const puccExpiry =
                document.getElementById(
                    "puccExpiry"
                ).value
                .trim();


            const permitExpiry =
                document.getElementById(
                    "permitExpiry"
                ).value
                .trim();


            const ocrText =
                document.getElementById(
                    "ocrText"
                ).value
                .trim();


            showStatus(
                "Checking existing vehicle...",
                "info"
            );


            const {
                data: existing,
                error: existingError
            } =
            await supabaseClient
                .from("vehicles")
                .select("*")
                .eq(
                    "vehicle_number",
                    vehicleNumber
                )
                .maybeSingle();


            if(existingError){

                throw new Error(
                    "Vehicle check failed: " +
                    existingError.message
                );
            }


            let photoUrl =
                existing?.photo_url ||
                null;


            let photoPath =
                existing?.photo_path ||
                null;


            /* =====================================
               NEW PHOTO
               ===================================== */

            if(selectedFile){

                const uploaded =
                    await uploadPhoto(
                        selectedFile,
                        vehicleNumber
                    );


                if(!uploaded){

                    throw new Error(
                        "Photo upload returned no result."
                    );
                }


                /*
                  Delete old photo only AFTER
                  new photo uploads successfully.
                */

                if(
                    existing &&
                    existing.photo_path
                ){

                    await deleteOldPhoto(
                        existing.photo_path
                    );
                }


                photoUrl =
                    uploaded.url;


                photoPath =
                    uploaded.path;
            }


            /* =====================================
               DATABASE DATA
               ===================================== */

            const vehicleData = {

                vehicle_number:
                    vehicleNumber,

                vehicle_class:
                    vehicleClass ||
                    null,

                customer_name:
                    customerName ||
                    null,

                customer_mobile:
                    customerMobile ||
                    null,

                registration_date:
                    registrationDate ||
                    null,

                fitness_expiry:
                    fitnessExpiry ||
                    null,

                insurance_expiry:
                    insuranceExpiry ||
                    null,

                tax_expiry:
                    taxExpiry ||
                    null,

                pucc_expiry:
                    puccExpiry ||
                    null,

                permit_expiry:
                    permitExpiry ||
                    null,

                ocr_text:
                    ocrText ||
                    null,

                photo_url:
                    photoUrl,

                photo_path:
                    photoPath
            };


            showStatus(
                "Saving vehicle...",
                "info"
            );


            /* =====================================
               UPDATE
               ===================================== */

            if(existing){

                const {
                    error
                } =
                await supabaseClient
                    .from("vehicles")
                    .update(
                        vehicleData
                    )
                    .eq(
                        "id",
                        existing.id
                    );


                if(error){

                    throw new Error(
                        "Vehicle update failed: " +
                        error.message
                    );
                }


                showStatus(
                    "Vehicle updated successfully.\nPhoto saved to Supabase Storage.",
                    "success"
                );

            }


            /* =====================================
               INSERT
               ===================================== */

            else{

                const {
                    error
                } =
                await supabaseClient
                    .from("vehicles")
                    .insert(
                        vehicleData
                    );


                if(error){

                    /*
                      If database save fails,
                      delete newly uploaded photo.
                    */

                    if(photoPath){

                        await deleteOldPhoto(
                            photoPath
                        );
                    }


                    throw new Error(
                        "Vehicle save failed: " +
                        error.message
                    );
                }


                showStatus(
                    "Vehicle saved successfully.\nPhoto saved to Supabase Storage.",
                    "success"
                );
            }


            selectedFile = null;

            photoInput.value = "";


        }
        catch(error){

            console.error(
                "SAVE ERROR:",
                error
            );


            showStatus(
                error.message ||
                "Something went wrong while saving.",
                "error"
            );

        }
        finally{

            saveBtn.disabled = false;
        }

    }
);

listBtn.addEventListener(
    "click",
    function(){

        window.location.href =
            "vehicles.html";

    }
);

</script>
