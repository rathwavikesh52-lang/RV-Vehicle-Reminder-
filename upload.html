/* =====================================================
   OCR NORMALIZE
===================================================== */

function normalizeOCRText(text){

  return String(text || "")
    .replace(/\r/g,"")
    .replace(/[“”]/g,'"')
    .replace(/[‘’]/g,"'")
    .replace(/[|]/g,"I")
    .replace(/[ \t]+/g," ")
    .replace(/\n[ \t]+/g,"\n")
    .trim();

}


function getOCRLines(text){

  return normalizeOCRText(text)
    .split("\n")
    .map(
      function(line){

        return line
          .replace(/\s+/g," ")
          .trim();

      }
    )
    .filter(
      function(line){

        return line.length > 0;

      }
    );

}


/* =====================================================
   MONTHS
===================================================== */

const MONTHS = {

  JAN:"01",
  FEB:"02",
  MAR:"03",
  APR:"04",
  MAY:"05",
  JUN:"06",
  JUL:"07",
  AUG:"08",
  SEP:"09",
  OCT:"10",
  NOV:"11",
  DEC:"12"

};


/* =====================================================
   DATE VALIDATION
===================================================== */

function validDateParts(
  day,
  month,
  year
){

  day =
    parseInt(
      day,
      10
    );

  month =
    parseInt(
      month,
      10
    );

  year =
    parseInt(
      year,
      10
    );


  if(!Number.isInteger(day))
    return false;

  if(!Number.isInteger(month))
    return false;

  if(!Number.isInteger(year))
    return false;


  if(day < 1 || day > 31)
    return false;

  if(month < 1 || month > 12)
    return false;

  if(year < 1900 || year > 2100)
    return false;


  return true;

}


/* =====================================================
   NORMALIZE DATE
===================================================== */

function normalizeDateString(value){

  if(!value) return "";

  let s =
    String(value)
      .trim()
      .replace(/[.,]/g,"-")
      .replace(/\s+/g," ");


  let m;


  /* DD-MMM-YYYY */

  m =
    s.match(
      /^(\d{1,2})[\-\/\s]([A-Za-z]{3})[\-\/\s](\d{4})$/i
    );


  if(m){

    const day =
      m[1];

    const mon =
      m[2].toUpperCase();

    const year =
      m[3];


    if(
      MONTHS[mon] &&
      validDateParts(
        day,
        MONTHS[mon],
        year
      )
    ){

      return (
        String(day).padStart(2,"0") +
        "-" +
        mon.charAt(0) +
        mon.slice(1).toLowerCase() +
        "-" +
        year
      );

    }

  }


  /* DD-MM-YYYY */

  m =
    s.match(
      /^(\d{1,2})[\-\/\s](\d{1,2})[\-\/\s](\d{4})$/
    );


  if(m){

    const day =
      m[1];

    const month =
      m[2];

    const year =
      m[3];


    if(
      validDateParts(
        day,
        month,
        year
      )
    ){

      const monthName =
        Object.keys(MONTHS)
          .find(
            function(key){

              return (
                MONTHS[key] ===
                String(month).padStart(2,"0")
              );

            }
          );


      if(monthName){

        return (
          String(day).padStart(2,"0") +
          "-" +
          monthName.charAt(0) +
          monthName.slice(1).toLowerCase() +
          "-" +
          year
        );

      }

    }

  }


  /* YYYY-MM-DD */

  m =
    s.match(
      /^(\d{4})[\-\/](\d{1,2})[\-\/](\d{1,2})$/
    );


  if(m){

    const year =
      m[1];

    const month =
      m[2];

    const day =
      m[3];


    if(
      validDateParts(
        day,
        month,
        year
      )
    ){

      const monthName =
        Object.keys(MONTHS)
          .find(
            function(key){

              return (
                MONTHS[key] ===
                String(month).padStart(2,"0")
              );

            }
          );


      if(monthName){

        return (
          String(day).padStart(2,"0") +
          "-" +
          monthName.charAt(0) +
          monthName.slice(1).toLowerCase() +
          "-" +
          year
        );

      }

    }

  }


  return "";

}


/* =====================================================
   DATE FROM TEXT
===================================================== */

function extractDateFromText(text){

  const patterns = [

    /\b\d{1,2}[\-\/\s][A-Za-z]{3}[\-\/\s]\d{4}\b/i,

    /\b\d{1,2}[\-\/]\d{1,2}[\-\/]\d{4}\b/,

    /\b\d{4}[\-\/]\d{1,2}[\-\/]\d{1,2}\b/

  ];


  for(
    let i=0;
    i<patterns.length;
    i++
  ){

    const match =
      String(text || "")
        .match(
          patterns[i]
        );


    if(match){

      const normalized =
        normalizeDateString(
          match[0]
        );


      if(normalized){

        return normalized;

      }

    }

  }


  return "";

}


/* =====================================================
   LABEL DATE
===================================================== */

function findValueAfterLabels(
  text,
  labels,
  maxLines = 3
){

  const lines =
    getOCRLines(text);


  const normalizedLabels =
    labels.map(
      function(label){

        return label
          .toUpperCase()
          .replace(/\s+/g," ")
          .trim();

      }
    );


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const line =
      lines[i];


    const upper =
      line
        .toUpperCase()
        .replace(/\s+/g," ")
        .trim();


    let matched =
      false;

    let matchedLabel =
      "";


    for(
      let j=0;
      j<normalizedLabels.length;
      j++
    ){

      const label =
        normalizedLabels[j];


      if(
        upper === label ||
        upper.startsWith(
          label + ":"
        ) ||
        upper.startsWith(
          label + " "
        )
      ){

        matched =
          true;

        matchedLabel =
          label;

        break;

      }

    }


    if(!matched)
      continue;


    let sameLine =
      line.replace(
        new RegExp(
          "^" +
          matchedLabel.replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&"
          ) +
          "\\s*:?",
          "i"
        ),
        ""
      ).trim();


    if(sameLine){

      const date =
        extractDateFromText(
          sameLine
        );


      if(date){

        return date;

      }

    }


    for(
      let j=1;
      j<=maxLines;
      j++
    ){

      if(!lines[i+j])
        continue;


      const date =
        extractDateFromText(
          lines[i+j]
        );


      if(date){

        return date;

      }

    }

  }


  return "";

}


/* =====================================================
   INSURANCE BLOCK
===================================================== */

function findInsuranceBlockDate(text){

  const lines =
    getOCRLines(text);


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    if(
      /INSURANCE\s+DETAILS/i.test(
        lines[i]
      )
    ){

      for(
        let j=i+1;
        j<=Math.min(
          i+8,
          lines.length-1
        );
        j++
      ){

        if(
          /VALIDITY|VALID/i.test(
            lines[j]
          )
        ){

          const same =
            lines[j]
              .replace(
                /^.*?(VALIDITY|VALID)\s*:?\s*/i,
                ""
              )
              .trim();


          if(same){

            const date =
              extractDateFromText(
                same
              );


            if(date){

              return date;

            }

          }


          for(
            let k=1;
            k<=2;
            k++
          ){

            if(!lines[j+k])
              continue;


            const date =
              extractDateFromText(
                lines[j+k]
              );


            if(date){

              return date;

            }

          }

        }

      }

    }

  }


  return "";

}


/* =====================================================
   TAX
===================================================== */

function findTaxValue(text){

  const lines =
    getOCRLines(text);


  const labels = [

    "MV TAX",

    "TAX VALID UPTO",

    "TAX VALID UP TO",

    "TAX VALID",

    "ROAD TAX",

    "TAX"

  ];


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const upper =
      lines[i]
        .toUpperCase()
        .replace(/\s+/g," ")
        .trim();


    let matched =
      false;


    for(
      let j=0;
      j<labels.length;
      j++
    ){

      if(
        upper === labels[j] ||
        upper.startsWith(
          labels[j] + ":"
        ) ||
        upper.startsWith(
          labels[j] + " "
        )
      ){

        matched =
          true;

        break;

      }

    }


    if(!matched)
      continue;


    const localText =
      lines
        .slice(
          i,
          Math.min(
            i+4,
            lines.length
          )
        )
        .join(" ");


    const taxMatch =
      localText.match(
        /\b(LTT|L7T|LT7|LIT|LII|L\s*T\s*T)\b/i
      );


    if(taxMatch){

      return "LTT";

    }


    const date =
      extractDateFromText(
        localText
      );


    if(date){

      return date;

    }

  }


  return "";

}


/* =====================================================
   VEHICLE NUMBER CLEAN
===================================================== */

function cleanVehicleCandidate(raw){

  if(!raw)
    return "";


  let s =
    String(raw)
      .toUpperCase()
      .replace(
        /[^A-Z0-9]/g,
        ""
      );


  /* Only repair GJ */

  if(
    s.startsWith("G7")
  ){

    s =
      "GJ" +
      s.slice(2);

  }


  if(
    s.startsWith("6J")
  ){

    s =
      "GJ" +
      s.slice(2);

  }


  if(
    !s.startsWith("GJ")
  ){

    return "";

  }


  /*
    GJ + 2 RTO digits
    + 1-3 series letters
    + 1-4 number digits

    Example:

    GJ34S1419
    = 9 characters

    GJ34Q6950
    = 9 characters

    GJ34AB1234
    = 10 characters
  */

  const body =
    s.slice(2);


  if(
    body.length < 4 ||
    body.length > 9
  ){

    return "";

  }


  /* RTO */

  let rto =
    body.slice(0,2);


  rto =
    rto
      .replace(/O/g,"0")
      .replace(/Q/g,"0")
      .replace(/D/g,"0")
      .replace(/I/g,"1")
      .replace(/L/g,"1")
      .replace(/Z/g,"2")
      .replace(/S/g,"5")
      .replace(/B/g,"8")
      .replace(/G/g,"6")
      .replace(/T/g,"7");


  if(
    !/^\d{2}$/.test(rto)
  ){

    return "";

  }


  const rest =
    body.slice(2);


  /*
    First try:
    series letters + number digits
  */

  let match =
    rest.match(
      /^([A-Z]{1,3})(\d{1,4})$/
    );


  if(match){

    return (
      "GJ" +
      rto +
      match[1] +
      match[2]
    );

  }


  /*
    OCR may confuse digits
    in final number section.
  */

  let possible =
    rest.match(
      /^([A-Z]{1,3})([A-Z0-9]{1,4})$/
    );


  if(!possible){

    return "";

  }


  const series =
    possible[1];


  let numberPart =
    possible[2]
      .replace(/O/g,"0")
      .replace(/Q/g,"0")
      .replace(/D/g,"0")
      .replace(/I/g,"1")
      .replace(/L/g,"1")
      .replace(/Z/g,"2")
      .replace(/S/g,"5")
      .replace(/B/g,"8")
      .replace(/G/g,"6")
      .replace(/T/g,"7");


  if(
    !/^\d{1,4}$/.test(
      numberPart
    )
  ){

    return "";

  }


  return (
    "GJ" +
    rto +
    series +
    numberPart
  );

}


/* =====================================================
   VEHICLE NUMBER EXTRACT
===================================================== */

function extractVehicleNumber(text){

  const lines =
    getOCRLines(text);


  let candidates = [];


  function addCandidate(
    raw,
    score
  ){

    if(!raw)
      return;


    const cleaned =
      cleanVehicleCandidate(
        raw
      );


    if(cleaned){

      candidates.push({

        value:
          cleaned,

        score:
          score

      });

    }

  }


  /* =================================================
     STEP 1
     AFTER VEHICLE NUMBER
  ================================================= */

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    if(
      /vehicle\s*(number|no|num|#)/i.test(
        lines[i]
      )
    ){

      /* SAME LINE */

      const same =
        lines[i]
          .replace(
            /.*?vehicle\s*(number|no|num|#)\s*:?\s*/i,
            ""
          )
          .trim();


      const sameMatch =
        same.match(
          /(?:GJ|G7|6J)[A-Z0-9\s]{5,12}/i
        );


      if(sameMatch){

        addCandidate(
          sameMatch[0],
          150
        );

      }


      /* NEXT 3 LINES */

      for(
        let j=1;
        j<=3;
        j++
      ){

        if(!lines[i+j])
          continue;


        const line =
          lines[i+j];


        const match =
          line.match(
            /(?:GJ|G7|6J)[A-Z0-9\s]{5,12}/i
          );


        if(match){

          addCandidate(
            match[0],
            145-j
          );

        }


        /*
          Spaces remove:

          GJ34S1419

          GJ 34 S1419

          GJ34 S 1419
        */

        const compact =
          line
            .replace(
              /[^A-Z0-9]/gi,
              ""
            )
            .toUpperCase();


        if(
          /^(?:GJ|G7|6J)[A-Z0-9]{5,10}$/.test(
            compact
          )
        ){

          addCandidate(
            compact,
            140-j
          );

        }

      }

    }

  }


  /* =================================================
     STEP 2
     NEAR VEHICLE NUMBER
  ================================================= */

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    if(
      /vehicle\s*(number|no|num|#)/i.test(
        lines[i]
      )
    ){

      for(
        let j=Math.max(
          0,
          i-3
        );
        j<=Math.min(
          lines.length-1,
          i+3
        );
        j++
      ){

        const tokens =
          lines[j]
            .split(/\s+/);


        for(
          let k=0;
          k<tokens.length;
          k++
        ){

          const token =
            tokens[k]
              .replace(
                /[^A-Z0-9]/gi,
                ""
              )
              .toUpperCase();


          if(
            /^(?:GJ|G7|6J)[A-Z0-9]{5,10}$/.test(
              token
            )
          ){

            addCandidate(
              token,
              120 -
              Math.abs(j-i)
            );

          }

        }

      }

    }

  }


  /* =================================================
     STEP 3
     GLOBAL
  ================================================= */

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const compact =
      lines[i]
        .replace(
          /[^A-Z0-9]/gi,
          ""
        )
        .toUpperCase();


    if(
      /^(?:GJ|G7|6J)[A-Z0-9]{5,10}$/.test(
        compact
      )
    ){

      addCandidate(
        compact,
        50
      );

    }

  }


  /* =================================================
     GROUP RESULTS
  ================================================= */

  const grouped = {};


  candidates.forEach(
    function(c){

      if(
        !grouped[c.value]
      ){

        grouped[c.value] = {

          count:0,

          bestScore:0

        };

      }


      grouped[c.value].count++;


      if(
        c.score >
        grouped[c.value].bestScore
      ){

        grouped[c.value].bestScore =
          c.score;

      }

    }
  );


  let best =
    "";

  let bestFinalScore =
    -1;


  Object.keys(grouped)
    .forEach(
      function(value){

        const data =
          grouped[value];


        let finalScore =
          (
            data.count *
            1000
          ) +
          data.bestScore;


        /*
          Prefer valid 9-character
          numbers such as:

          GJ34S1419
          GJ34Q6950
        */

        if(
          value.length === 9
        ){

          finalScore +=
            200;

        }


        if(
          finalScore >
          bestFinalScore
        ){

          bestFinalScore =
            finalScore;

          best =
            value;

        }

      }
    );


  return best;

}


/* =====================================================
   VEHICLE CLASS
===================================================== */

function detectVehicleClass(text){

  const upper =
    String(text || "")
      .toUpperCase();


  const codes = [

    "HGV",
    "MGV",
    "MPV",
    "LGV",
    "LMV",
    "LPV",
    "HPV",
    "2WN",
    "3WT",
    "OTH"

  ];


  for(
    let i=0;
    i<codes.length;
    i++
  ){

    const code =
      codes[i];


    if(
      new RegExp(
        "\\b" +
        code +
        "\\b",
        "i"
      ).test(
        upper
      )
    ){

      return code;

    }

  }


  if(
    /CONSTRUCTION\s+EQUIPMENT\s+VEHICLE/i.test(
      upper
    )
  ){

    return "OTH";

  }


  if(
    /M[-\s]?CYCLE|MOTORCYCLE|MOTOR\s+CYCLE|SCOOTER|TWO\s+WHEELER/i.test(
      upper
    )
  ){

    return "2WN";

  }


  if(
    /THREE\s+WHEELER|AUTO\s+RICKSHAW|AUTORICKSHAW/i.test(
      upper
    )
  ){

    return "3WT";

  }


  if(
    /\bBUS\b/i.test(
      upper
    )
  ){

    return "HPV";

  }


  if(
    /TRACTOR|PICK[-\s]?UP|GOODS\s+VEHICLE/i.test(
      upper
    )
  ){

    return "LGV";

  }


  if(
    /MOTOR\s+CAR|\bCAR\b/i.test(
      upper
    )
  ){

    return "LMV";

  }


  return "";

}

/* =====================================================
   ENHANCE IMAGE
===================================================== */

function createEnhancedImage(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(e){

          const img =
            new Image();


          img.onload =
            function(){

              const canvas =
                document.createElement(
                  "canvas"
                );


              const minWidth =
                1800;


              const scale =
                img.width <
                minWidth
                  ? minWidth /
                    img.width
                  : 1;


              canvas.width =
                Math.round(
                  img.width *
                  scale
                );


              canvas.height =
                Math.round(
                  img.height *
                  scale
                );


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              const imageData =
                ctx.getImageData(
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );


              const data =
                imageData.data;


              for(
                let i=0;
                i<data.length;
                i+=4
              ){

                const gray =
                  (
                    0.299 *
                    data[i]
                  ) +
                  (
                    0.587 *
                    data[i+1]
                  ) +
                  (
                    0.114 *
                    data[i+2]
                  );


                const contrast =
                  (
                    gray -
                    128
                  ) *
                  1.5 +
                  128;


                const value =
                  Math.max(
                    0,
                    Math.min(
                      255,
                      contrast
                    )
                  );


                data[i] =
                  value;

                data[i+1] =
                  value;

                data[i+2] =
                  value;

              }


              ctx.putImageData(
                imageData,
                0,
                0
              );


              canvas.toBlob(
                function(blob){

                  if(blob){

                    resolve(blob);

                  }else{

                    reject(
                      new Error(
                        "Image enhancement failed"
                      )
                    );

                  }

                },
                "image/jpeg",
                0.95
              );

            };


          img.onerror =
            reject;


          img.src =
            e.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =====================================================
   OCR RECOGNIZE
===================================================== */

async function recognizeOCR(
  image,
  passNumber,
  totalPasses
){

  const result =
    await Tesseract.recognize(
      image,
      "eng",
      {

        logger:function(info){

          if(
            info.status ===
            "recognizing text"
          ){

            const passProgress =
              Math.round(
                (
                  info.progress ||
                  0
                ) *
                100
              );


            const totalProgress =
              Math.round(
                (
                  (
                    passNumber -
                    1
                  ) *
                  100 +
                  passProgress
                ) /
                totalPasses
              );


            const bar =
              document
                .getElementById(
                  "ocrBar"
                );


            bar.style.width =
              totalProgress +
              "%";


            bar.textContent =
              totalProgress +
              "%";

          }

        }

      }
    );


  return result.data.text || "";

}


/* =====================================================
   START OCR - 3 PASS
===================================================== */

async function startOCR(){

  if(!selectedFile){

    showMessage(
      "Please upload vehicle photo first.",
      "error"
    );

    return;

  }


  const ocrBtn =
    document.getElementById(
      "ocrBtn"
    );

    true;


  hideMessage();


  const bar =
    document.getElementById(
      "ocrBar"
    );


  bar.style.width =
    "0%";

  bar.textContent =
    "0%";


  try{

    /* PASS 1 */

    const text1 =
      await recognizeOCR(
        selectedFile,
        1,
        3
      );


    /* PASS 2 */

    const enhanced =
      await createEnhancedImage(
        selectedFile
      );


    const text2 =
      await recognizeOCR(
        enhanced,
        2,
        3
      );


    /* PASS 3 */

    const enhanced2 =
      await createEnhancedImage(
        selectedFile
      );


    const text3 =
      await recognizeOCR(
        enhanced2,
        3,
        3
      );


    const combinedText =

      text1 +
      "\n\n===== OCR PASS =====\n\n" +
      text2 +
      "\n\n===== OCR PASS =====\n\n" +
      text3;


    document
      .getElementById(
        "ocrText"
      )
      .value =
      combinedText;


    extractOCRData();


    bar.style.width =
      "100%";

    bar.textContent =
      "100%";


    showMessage(
      "OCR completed successfully.",
      "success"
    );


  }catch(error){

    console.error(

      error
    );


    showMessage(

      error.message,
      "error"
    );

  }


  ocrBtn.disabled =
    false;

}


/* =====================================================
   UPLOAD PHOTO
===================================================== */

async function uploadVehiclePhoto(
  file,
  vehicleNumber
){

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase() ||
      "jpg";


  const safeNumber =
    vehicleNumber
      .replace(
        /[^A-Z0-9]/gi,
        ""
      );


  const filePath =
    safeNumber +
    "_" +
    Date.now() +
    "." +
    extension;


  const result =
    await supabaseClient
      .storage
      .from("vehicle-photos")
      .upload(
        filePath,
        file,
        {
          upsert:false,
          contentType:
            file.type ||
            "image/jpeg"
        }
      );


  if(result.error){

    throw result.error;

  }


  const publicUrl =
    supabaseClient
      .storage
      .from("vehicle-photos")
      .getPublicUrl(
        filePath
      );


  return {

    path:
      filePath,

    url:
      publicUrl.data.publicUrl

  };

}

        existingResult.data;

        await supabaseClient
          .from("vehicles")
          .update(
            vehicleData
          )
          .eq(

      );

      );

        .from("vehicles")

        selectedFile &&
        photoPath

        await deleteOldPhoto(
          photoPath
        );

      throw insertResult.error;

    showMessage(

    );

    );

    );

    );

    false;

}

        "puccExpiry"
      )
      .value =
      vehicle.pucc_expiry ||
      "";


    document
      .getElementById(
        "permitExpiry"
      )
      .value =
      vehicle.permit_expiry ||
      "";


    document
      .getElementById(
        "ocrText"
      )
      .value =
      vehicle.ocr_text ||
      "";


    if(
      vehicle.vehicle_class
    ){

      selectVehicleClass(
        vehicle.vehicle_class
      );

    }


    oldPhotoPath =
      vehicle.photo_path ||
      "";


    currentPhotoUrl =
      vehicle.photo_url ||
      "";


    if(
      vehicle.photo_url
    ){

      const preview =
        document.getElementById(
          "preview"
        );


      preview.src =
        vehicle.photo_url;


      preview.style.display =
        "block";

    }


    showMessage(
      "Vehicle loaded successfully.",
      "success"
    );


  }catch(error){

    console.error(
      "LOAD ERROR:",
      error
    );


    showMessage(
      "Vehicle load failed: " +
      error.message,
      "error"
    );

  }

}
