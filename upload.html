<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Vehicle Photo - RV Vehicle Reminder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#222;
}

.header{
    background:#111827;
    color:white;
    padding:16px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:23px;
}

.container{
    max-width:900px;
    margin:20px auto;
    padding:0 15px;
}

.card{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
}

h2{
    margin-top:0;
}

input[type="text"],
input[type="date"]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

input[type="file"]{
    width:100%;
    padding:10px;
}

label{
    display:block;
    font-weight:bold;
    margin:15px 0 6px;
}

#preview{
    width:100%;
    max-height:450px;
    object-fit:contain;
    display:none;
    margin-top:15px;
    border-radius:10px;
    border:1px solid #ddd;
}

.progress{
    width:100%;
    height:10px;
    background:#e5e7eb;
    border-radius:10px;
    overflow:hidden;
    margin-top:15px;
    display:none;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#2563eb;
    transition:.2s;
}

.status{
    margin-top:10px;
    font-weight:bold;
    line-height:1.5;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.full{
    grid-column:1 / -1;
}

button{
    border:0;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    margin-top:15px;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.btn-secondary{
    background:#6b7280;
    color:white;
}

.action-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.note{
    background:#eff6ff;
    border-left:4px solid #2563eb;
    padding:12px;
    margin-top:15px;
    border-radius:6px;
    line-height:1.5;
}

.success{
    background:#ecfdf5;
    color:#166534;
    padding:12px;
    border-radius:8px;
    display:none;
    margin-top:15px;
}

.error{
    background:#fef2f2;
    color:#991b1b;
    padding:12px;
    border-radius:8px;
    display:none;
    margin-top:15px;
}

.ocr-box{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    padding:12px;
    border-radius:8px;
    margin-top:15px;
}

.ocr-box summary{
    cursor:pointer;
    font-weight:bold;
}

#rawText{
    white-space:pre-wrap;
    font-size:13px;
    line-height:1.5;
    margin-top:10px;
}

@media(max-width:650px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .header h1{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🚘 RV Vehicle Reminder</h1>
</div>

<div class="container">

<div class="card">

<h2>Upload Vehicle Photo</h2>

<input
    type="file"
    id="photoInput"
    accept="image/*"
    onchange="previewPhoto()"
>

<img id="preview" alt="Vehicle Photo Preview">

<div class="progress" id="progress">
    <div class="progress-bar" id="progressBar"></div>
</div>

<div class="status" id="ocrStatus"></div>

<button
    type="button"
    class="btn-primary"
    id="readButton"
    onclick="readPhoto();"
>
🔍 Read Vehicle Details
</button>

<div class="note">
Upload a clear VAHAN / vehicle details screenshot.
After OCR, check all details and correct anything before saving.
</div>

<details class="ocr-box">
<summary>Show OCR text</summary>
<div id="rawText"></div>
</details>

</div>

<div class="card">

<h2>Vehicle Details</h2>

<div class="form-grid">

<div class="full">

<label>Vehicle Number</label>

<input
    type="text"
    id="vehicleNumber"
    placeholder="GJ04AB1234"
>

</div>

<div>

<label>Registration Date</label>

<input
    type="date"
    id="registrationDate"
>

</div>

<div>

<label>Fitness Expiry</label>

<input
    type="date"
    id="fitness"
>

</div>

<div>

<label>Insurance Expiry</label>

<input
    type="date"
    id="insurance"
>

</div>

<div>

<label>Tax</label>

<input
    type="text"
    id="tax"
    placeholder="LTT / LTP"
>

</div>

<div>

<label>PUCC Expiry</label>

<input
    type="date"
    id="pucc"
>

</div>

<div>

<label>Permit Expiry</label>

<input
    type="date"
    id="permit"
>

</div>

</div>

<div id="successMessage" class="success"></div>

<div id="errorMessage" class="error"></div>

<div class="action-buttons">

<button
    class="btn-success"
    id="saveButton"
    onclick="saveVehicle()"
>
💾 Save Vehicle
</button>

<button
    class="btn-secondary"
    onclick="goDashboard()"
>
Dashboard
</button>

</div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://lqbhafspabtlqeubqxjg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const STORAGE_BUCKET =
"vehicle-photos";


function previewPhoto(){

    const input =
        document.getElementById("photoInput");

    const preview =
        document.getElementById("preview");

    if(!input.files || !input.files[0]){

        preview.style.display="none";

        return;
    }

    preview.src =
        URL.createObjectURL(
            input.files[0]
        );

    preview.style.display="block";

    hideMessages();

    document.getElementById(
        "rawText"
    ).innerText="";

    document.getElementById(
        "ocrStatus"
    ).innerText =
        "Photo selected. Tap Read Vehicle Details.";

}


function prepareImage(file){

    return new Promise((resolve,reject)=>{

        const reader =
            new FileReader();

        reader.onload=function(){

            const img =
                new Image();

            img.onload=function(){

                const maxWidth=1800;

                let width=img.width;
                let height=img.height;

                if(width>maxWidth){

                    height =
                        Math.round(
                            height *
                            maxWidth /
                            width
                        );

                    width=maxWidth;
                }

                const canvas =
                    document.createElement("canvas");

                canvas.width=width;
                canvas.height=height;

                const ctx =
                    canvas.getContext("2d");

                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );

                canvas.toBlob(
                    function(blob){

                        if(!blob){

                            reject(
                                new Error(
                                    "Image processing failed"
                                )
                            );

                            return;
                        }

                        resolve(blob);

                    },
                    "image/jpeg",
                    0.85
                );

            };

            img.onerror=function(){

                reject(
                    new Error(
                        "Could not open image"
                    )
                );

            };

            img.src=reader.result;

        };

        reader.onerror=function(){

            reject(
                new Error(
                    "Could not read image"
                )
            );

        };

        reader.readAsDataURL(file);

    });

    }
    /* =========================================================
   OCR
========================================================= */

async function readPhoto(){

    const input =
        document.getElementById("photoInput");

    const button =
        document.getElementById("readButton");

    const status =
        document.getElementById("ocrStatus");

    const progress =
        document.getElementById("progress");

    const progressBar =
        document.getElementById("progressBar");

    if(
        !input.files ||
        !input.files[0]
    ){

        alert(
            "Please select a vehicle photo first."
        );

        return;
    }

    button.disabled=true;

    progress.style.display="block";

    progressBar.style.width="0%";

    status.innerText=
        "Preparing photo...";

    hideMessages();

    try{

        const originalFile =
            input.files[0];

        const processedImage =
            await prepareImage(
                originalFile
            );

        status.innerText=
            "Starting OCR...";

        const result =
            await Tesseract.recognize(
                processedImage,
                "eng",
                {
                    logger:function(info){

                        if(
                            info.status ===
                            "recognizing text"
                        ){

                            const percent =
                                Math.round(
                                    info.progress * 100
                                );

                            progressBar.style.width =
                                percent + "%";

                            status.innerText =
                                "Reading photo... " +
                                percent +
                                "%";
                        }

                        else if(info.status){

                            status.innerText =
                                info.status;
                        }

                    }
                }
            );

        const ocrText =
            result &&
            result.data &&
            result.data.text
                ? result.data.text
                : "";

        console.log(
            "OCR TEXT:",
            ocrText
        );

        document.getElementById(
            "rawText"
        ).innerText =
            ocrText ||
            "No text detected.";

        progressBar.style.width="100%";

        if(!ocrText.trim()){

            status.innerText =
                "⚠️ No text found. Please upload a clearer screenshot.";

            showError(
                "No readable text was found in the photo."
            );

            return;
        }

        extractVehicleData(
            ocrText
        );

        status.innerText =
            "✅ Reading complete. Please check and edit the details before saving.";

    }

    catch(error){

        console.error(
            "OCR ERROR:",
            error
        );

        status.innerText =
            "❌ OCR failed.";

        showError(
            "OCR could not read this image. Please use a clear VAHAN screenshot and try again."
        );

    }

    finally{

        button.disabled=false;

    }

}


/* =========================================================
   DATE REGEX
========================================================= */

const datePart =
"(\\d{1,2}[\\/-](?:\\d{1,2}|Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)[\\/-]\\d{4})";


/* =========================================================
   FIND DATE
========================================================= */

function findDate(text,patterns){

    for(
        const pattern of patterns
    ){

        const match =
            text.match(pattern);

        if(
            match &&
            match[1]
        ){

            return match[1];

        }

    }

    return "";

}


/* =========================================================
   EXTRACT VEHICLE DATA
========================================================= */

function extractVehicleData(text){

    const normalized =
        text
            .replace(/\r/g,"\n")
            .replace(/[|]/g," ")
            .replace(/[ \t]+/g," ");


    /* VEHICLE NUMBER */

    const vehicleCandidates =
        normalized.match(
            /\b[A-Z]{2}\s*[-]?\s*\d{1,2}\s*[-]?\s*[A-Z]{1,3}\s*[-]?\s*\d{3,4}\b/gi
        ) || [];


    if(vehicleCandidates.length){

        const vehicleNumber =
            cleanVehicleNumber(
                vehicleCandidates[0]
            );

        document.getElementById(
            "vehicleNumber"
        ).value =
            vehicleNumber;

    }


    /* REGISTRATION */

    const registration =
        findDate(
            normalized,
            [
                new RegExp(
                    "(?:Registration\\s*Date|Registered\\s*Date|Date\\s*of\\s*Registration|Reg(?:istration)?\\s*Date)[\\s:\\-]*" +
                    datePart,
                    "i"
                )
            ]
        );


    if(registration){

        setDateValue(
            "registrationDate",
            registration
        );

    }


    /* FITNESS */

    const fitness =
        findDate(
            normalized,
            [
                new RegExp(
                    "(?:Fitness\\s*Valid\\s*Up\\s*To|Fitness\\s*Valid\\s*Upto|Fitness\\s*Expiry|Fitness\\s*Up\\s*To|Fitness)[\\s:\\-]*" +
                    datePart,
                    "i"
                )
            ]
        );


    if(fitness){

        setDateValue(
            "fitness",
            fitness
        );

    }


    /* INSURANCE */

    const insurance =
        findDate(
            normalized,
            [
                new RegExp(
                    "(?:Insurance\\s*Valid\\s*Up\\s*To|Insurance\\s*Valid\\s*Upto|Insurance\\s*Expiry|Insurance\\s*Up\\s*To|Insurance)[\\s:\\-]*" +
                    datePart,
                    "i"
                )
            ]
        );


    if(insurance){

        setDateValue(
            "insurance",
            insurance
        );

    }


    /* PUCC */

    const pucc =
        findDate(
            normalized,
            [
                new RegExp(
                    "(?:PUCC\\s*Valid\\s*Up\\s*To|PUCC\\s*Valid\\s*Upto|PUCC\\s*Expiry|PUC\\s*Valid\\s*Up\\s*To|PUC\\s*Valid\\s*Upto|PUC\\s*Expiry|PUCC|PUC)[\\s:\\-]*" +
                    datePart,
                    "i"
                )
            ]
        );


    if(pucc){

        setDateValue(
            "pucc",
            pucc
        );

    }


    /* PERMIT */

    const permit =
        findDate(
            normalized,
            [
                new RegExp(
                    "(?:Permit\\s*Valid\\s*Up\\s*To|Permit\\s*Valid\\s*Upto|Permit\\s*Expiry|Permit\\s*Up\\s*To|Permit)[\\s:\\-]*" +
                    datePart,
                    "i"
                )
            ]
        );


    if(permit){

        setDateValue(
            "permit",
            permit
        );

    }


    /* TAX */

    const tax =
        normalized.match(
            /(?:MV\s*Tax|Tax\s*Valid\s*Up\s*To|Tax\s*Valid\s*Upto|Tax)[\s:\-]*(LTT|LTP)\b/i
        );


    if(tax){

        document.getElementById(
            "tax"
        ).value =
            tax[1].toUpperCase();

    }

}


/* =========================================================
   CLEAN VEHICLE NUMBER
========================================================= */

function cleanVehicleNumber(value){

    return(
        value || ""
    )
    .toUpperCase()
    .replace(
        /[^A-Z0-9]/g,
        ""
    )
    .trim();

}


/* =========================================================
   SET DATE
========================================================= */

function setDateValue(id,value){

    const converted =
        convertDate(value);

    if(converted){

        document.getElementById(id).value =
            converted;

    }

}


/* =========================================================
   CONVERT DATE
========================================================= */

function convertDate(value){

    if(!value){

        return "";

    }

    value =
        value
            .trim()
            .replace(/[\/]/g,"-");

    const parts =
        value.split("-");

    if(parts.length!==3){

        return "";

    }

    let day =
        parts[0].trim();

    let month =
        parts[1].trim();

    let year =
        parts[2].trim();

    const months={

        jan:"01",
        january:"01",

        feb:"02",
        february:"02",

        mar:"03",
        march:"03",

        apr:"04",
        april:"04",

        may:"05",

        jun:"06",
        june:"06",

        jul:"07",
        july:"07",

        aug:"08",
        august:"08",

        sep:"09",
        sept:"09",
        september:"09",

        oct:"10",
        october:"10",

        nov:"11",
        november:"11",

        dec:"12",
        december:"12"

    };

    if(isNaN(month)){

        month =
            months[
                month.toLowerCase()
            ] || "";

    }
    else{

        month =
            month.padStart(
                2,
                "0"
            );

    }

    day =
        day.padStart(
            2,
            "0"
        );

    if(
        !year ||
        !month ||
        !day
    ){

        return "";

    }

    return(
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =========================================================
   NORMALIZE VEHICLE NUMBER
========================================================= */

function normalizeVehicleNumber(number){

    return(
        number || ""
    )
    .replace(
        /[\s-]/g,
        ""
    )
    .toUpperCase()
    .trim();

}


/* =========================================================
   PHOTO PATH
========================================================= */

function createPhotoPath(vehicleNumber){

    const safe =
        normalizeVehicleNumber(
            vehicleNumber
        )
        .replace(
            /[^A-Z0-9]/g,
            ""
        );

    return(
        safe +
        "_" +
        Date.now() +
        ".jpg"
    );/* =========================================================
   SAVE VEHICLE
========================================================= */

async function saveVehicle(){

    hideMessages();

    const vehicleNumber =
        normalizeVehicleNumber(
            document.getElementById(
                "vehicleNumber"
            ).value
        );

    const registrationDate =
        document.getElementById(
            "registrationDate"
        ).value || null;

    const fitness =
        document.getElementById(
            "fitness"
        ).value || null;

    const insurance =
        document.getElementById(
            "insurance"
        ).value || null;

    const tax =
        document.getElementById(
            "tax"
        ).value
        .trim()
        .toUpperCase() || null;

    const pucc =
        document.getElementById(
            "pucc"
        ).value || null;

    const permit =
        document.getElementById(
            "permit"
        ).value || null;

    if(!vehicleNumber){

        showError(
            "Vehicle Number is required."
        );

        return;

    }

    const saveButton =
        document.getElementById(
            "saveButton"
        );

    saveButton.disabled=true;

    saveButton.innerText=
        "Saving...";

    try{

        const {
            data: existingRows,
            error: findError
        } =
            await supabaseClient
                .from("vehicles")
                .select("*")
                .eq(
                    "vehicle_number",
                    vehicleNumber
                )
                .limit(1);

        if(findError){

            throw findError;

        }

        const existing =
            existingRows &&
            existingRows.length
                ? existingRows[0]
                : null;

        let photoPath =
            existing?.photo_path ||
            null;

        let photoUrl =
            existing?.photo_url ||
            null;

        const photoInput =
            document.getElementById(
                "photoInput"
            );

        /* UPLOAD NEW PHOTO */

        if(
            photoInput.files &&
            photoInput.files[0]
        ){

            const file =
                photoInput.files[0];

            const newPath =
                createPhotoPath(
                    vehicleNumber
                );

            const {
                error: uploadError
            } =
                await supabaseClient
                    .storage
                    .from(
                        STORAGE_BUCKET
                    )
                    .upload(
                        newPath,
                        file,
                        {
                            cacheControl:"3600",
                            upsert:false,
                            contentType:
                                file.type ||
                                "image/jpeg"
                        }
                    );

            if(uploadError){

                throw uploadError;

            }

            const {
                data: publicData
            } =
                supabaseClient
                    .storage
                    .from(
                        STORAGE_BUCKET
                    )
                    .getPublicUrl(
                        newPath
                    );

            photoPath =
                newPath;

            photoUrl =
                publicData &&
                publicData.publicUrl
                    ? publicData.publicUrl
                    : null;

            /* DELETE OLD PHOTO */

            if(
                existing &&
                existing.photo_path
            ){

                const {
                    error: deleteOldError
                } =
                    await supabaseClient
                        .storage
                        .from(
                            STORAGE_BUCKET
                        )
                        .remove([
                            existing.photo_path
                        ]);

                if(deleteOldError){

                    console.warn(
                        "Old photo delete warning:",
                        deleteOldError
                    );

                }

            }

        }

        const vehicleData={

            vehicle_number:
                vehicleNumber,

            registration_date:
                registrationDate,

            fitness_expiry:
                fitness,

            insurance_expiry:
                insurance,

            tax_expiry:
                tax,

            pucc_expiry:
                pucc,

            permit_expiry:
                permit,

            photo_url:
                photoUrl,

            photo_path:
                photoPath

        };

        /* UPDATE EXISTING */

        if(existing){

            const {
                error:updateError
            } =
                await supabaseClient
                    .from("vehicles")
                    .update(
                        vehicleData
                    )
                    .eq(
                        "id",
                        existing.id
                    );

            if(updateError){

                throw updateError;

            }

            showSuccess(
                "Vehicle updated successfully. Old photo replaced."
            );

        }

        /* INSERT NEW */

        else{

            const {
                error:insertError
            } =
                await supabaseClient
                    .from("vehicles")
                    .insert(
                        [vehicleData]
                    );

            if(insertError){

                throw insertError;

            }

            showSuccess(
                "Vehicle saved successfully."
            );

        }

        photoInput.value="";

        document.getElementById(
            "preview"
        ).style.display="none";

        document.getElementById(
            "ocrStatus"
        ).innerText=
            "Vehicle saved. You can upload another photo.";

        document.getElementById(
            "rawText"
        ).innerText="";

    }

    catch(error){

        console.error(
            "SAVE ERROR:",
            error
        );

        showError(
            "Could not save vehicle. " +
            (
                error?.message ||
                "Please try again."
            )
        );

    }

    finally{

        saveButton.disabled=false;

        saveButton.innerText=
            "💾 Save Vehicle";

    }

}


/* =========================================================
   DASHBOARD
========================================================= */

function goDashboard(){

    window.location.href=
        "index.html";

}


/* =========================================================
   MESSAGES
========================================================= */

function showSuccess(message){

    const box =
        document.getElementById(
            "successMessage"
        );

    box.innerText=message;

    box.style.display="block";

}


function showError(message){

    const box =
        document.getElementById(
            "errorMessage"
        );

    box.innerText=message;

    box.style.display="block";

}


function hideMessages(){

    document.getElementById(
        "successMessage"
    ).style.display="none";

    document.getElementById(
        "errorMessage"
    ).style.display="none";

}

</script>

</body>
</html>

    }
