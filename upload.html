function selectVehicleClass(value){

/* =========================================
   PROGRESS
========================================= */

function setProgress(
  percent,
  text

/* =========================================
   OLD WORKING OCR
   NORMALIZE
========================================= */

function normalizeOCRText(text){

  return String(text || "")
    .replace(/\r/g,"")
    .replace(/[“”]/g,'"')
    .replace(/[‘’]/g,"'")
    .replace(/[|]/g,"I")
    .replace(/[ \t]+/g," ")
    .replace(/\n[ \t]+/g,"\n")
    .trim();

}


/* =========================================
   OCR LINES
========================================= */

function getOCRLines(text){

  return normalizeOCRText(text)
    .split("\n")
    .map(function(line){

      return line
        .replace(/\s+/g," ")
        .trim();

    })
    .filter(function(line){

      return line.length > 0;

    });

}


/* =========================================
   MONTHS
========================================= */

const MONTHS = {

  JAN:"01",
  FEB:"02",
  MAR:"03",
  APR:"04",
  MAY:"05",
  JUN:"06",
  JUL:"07",
  AUG:"08",
  SEP:"09",
  OCT:"10",
  NOV:"11",
  DEC:"12"

};


/* =========================================
   VALID DATE PARTS
========================================= */

function validDateParts(
  day,
  month,
  year
){

  day = parseInt(day,10);

  month = parseInt(month,10);

  year = parseInt(year,10);

  if(
    !Number.isInteger(day) ||
    !Number.isInteger(month) ||
    !Number.isInteger(year)
  ){
    return false;
  }

  if(day < 1 || day > 31){
    return false;
  }

  if(month < 1 || month > 12){
    return false;
  }

  if(year < 1900 || year > 2100){
    return false;
  }

  return true;

}


/* =========================================
   NORMALIZE DATE
========================================= */

function normalizeDateString(value){

  if(!value){
    return "";
  }

  let s =
    String(value)
      .trim()
      .replace(/[|]/g,"I")
      .replace(/\s+/g," ");

  let m;


  /* DD-MMM-YYYY */

  m =
    s.match(
      /^(\d{1,2})[\-\/\s]([A-Za-z]{3})[\-\/\s](\d{4})$/i
    );

  if(m){

    const day =
      parseInt(m[1],10);

    const mon =
      m[2].toUpperCase();

    const year =
      parseInt(m[3],10);

    if(
      MONTHS[mon] &&
      validDateParts(
        day,
        MONTHS[mon],
        year
      )
    ){

      return (
        String(day).padStart(2,"0") +
        "-" +
        mon.charAt(0) +
        mon.slice(1).toLowerCase() +
        "-" +
        year
      );

    }

  }


  /* DD/MM/YYYY or DD-MM-YYYY */

  m =
    s.match(
      /^(\d{1,2})[\-\/\s](\d{1,2})[\-\/\s](\d{4})$/
    );

  if(m){

    const day =
      parseInt(m[1],10);

    const month =
      parseInt(m[2],10);

    const year =
      parseInt(m[3],10);

    if(
      validDateParts(
        day,
        month,
        year
      )
    ){

      const monthNames = [
        "Jan","Feb","Mar","Apr",
        "May","Jun","Jul","Aug",
        "Sep","Oct","Nov","Dec"
      ];

      return (
        String(day).padStart(2,"0") +
        "-" +
        monthNames[month-1] +
        "-" +
        year
      );

    }

  }


  /* YYYY-MM-DD */

  m =
    s.match(
      /^(\d{4})[\-\/](\d{1,2})[\-\/](\d{1,2})$/
    );

  if(m){

    const year =
      parseInt(m[1],10);

    const month =
      parseInt(m[2],10);

    const day =
      parseInt(m[3],10);

    if(
      validDateParts(
        day,
        month,
        year
      )
    ){

      const monthNames = [
        "Jan","Feb","Mar","Apr",
        "May","Jun","Jul","Aug",
        "Sep","Oct","Nov","Dec"
      ];

      return (
        String(day).padStart(2,"0") +
        "-" +
        monthNames[month-1] +
        "-" +
        year
      );

    }

  }

  return "";

}


/* =========================================
   EXTRACT DATE FROM TEXT
========================================= */

function extractDateFromText(text){

  const source =
    String(text || "");


  const patterns = [

    /\b\d{1,2}[\-\/\s][A-Za-z]{3}[\-\/\s]\d{4}\b/i,

    /\b\d{1,2}[\-\/]\d{1,2}[\-\/]\d{4}\b/,

    /\b\d{4}[\-\/]\d{1,2}[\-\/]\d{1,2}\b/

  ];


  for(
    let i=0;
    i<patterns.length;
    i++
  ){

    const match =
      source.match(patterns[i]);

    if(match){

      const result =
        normalizeDateString(
          match[0]
        );

      if(result){
        return result;
      }

    }

  }

  return "";

}


/* =========================================
   FIND VALUE AFTER LABELS
========================================= */

function findValueAfterLabels(
  text,
  labels,
  maxLines = 3
){

  const lines =
    getOCRLines(text);

  const normalizedLabels =
    labels.map(function(label){

      return label
        .toUpperCase()
        .replace(/\s+/g," ")
        .trim();

    });


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const upper =
      lines[i]
        .toUpperCase()
        .replace(/\s+/g," ")
        .trim();


    let matched = false;

    let matchedLabel = "";


    for(
      let j=0;
      j<normalizedLabels.length;
      j++
    ){

      const label =
        normalizedLabels[j];

      if(
        upper === label ||
        upper.indexOf(label + ":") === 0 ||
        upper.indexOf(label + " ") === 0 ||
        upper.indexOf(label) === 0 ||
        upper.indexOf(label) >= 0
      ){

        matched = true;
        matchedLabel = label;
        break;

      }

    }


    if(!matched){
      continue;
    }


    /* SAME LINE */

    let sameLine =
      lines[i];

    let pos =
      sameLine
        .toUpperCase()
        .indexOf(
          matchedLabel
        );

    if(pos >= 0){

      let after =
        sameLine
          .substring(
            pos + matchedLabel.length
          )
          .replace(/^[:\-\s]+/,"")
          .trim();

      const date =
        extractDateFromText(after);

      if(date){
        return date;
      }

    }


    /* NEXT LINES */

    for(
      let j=1;
      j<=maxLines;
      j++
    ){

      if(
        !lines[i+j]
      ){
        break;
      }

      const date =
        extractDateFromText(
          lines[i+j]
        );

      if(date){
        return date;
      }

    }

  }

  return "";

}


/* =========================================
   INSURANCE BLOCK
========================================= */

function findInsuranceBlockDate(text){

  const lines =
    getOCRLines(text);

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const upper =
      lines[i].toUpperCase();

    if(
      upper.indexOf(
        "INSURANCE DETAILS"
      ) >= 0
    ){

      const end =
        Math.min(
          lines.length,
          i + 9
        );

      for(
        let j=i+1;
        j<end;
        j++
      ){

        const lineUpper =
          lines[j]
            .toUpperCase();

        if(
          lineUpper.indexOf("VALIDITY") >= 0 ||
          lineUpper.indexOf("VALID") >= 0
        ){

          const same =
            extractDateFromText(
              lines[j]
            );

          if(same){
            return same;
          }


          for(
            let k=1;
            k<=2;
            k++
          ){

            if(!lines[j+k]){
              break;
            }

            const date =
              extractDateFromText(
                lines[j+k]
              );

            if(date){
              return date;
            }

          }

        }

      }

    }

  }

  return "";

}


/* =========================================
   TAX
========================================= */

function findTaxValue(text){

  const lines =
    getOCRLines(text);


  const labels = [

    "MV TAX",
    "TAX VALID UPTO",
    "TAX VALID UP TO",
    "TAX VALID",
    "ROAD TAX",
    "TAX"

  ];


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const upper =
      lines[i]
        .toUpperCase()
        .replace(/\s+/g," ")
        .trim();


    let matched = false;


    for(
      let j=0;
      j<labels.length;
      j++
    ){

      if(
        upper === labels[j] ||
        upper.indexOf(
          labels[j]
        ) === 0
      ){

        matched = true;
        break;

      }

    }


    if(!matched){
      continue;
    }


    let localText =
      lines
        .slice(
          i,
          Math.min(
            lines.length,
            i+4
          )
        )
        .join(" ");


    const localUpper =
      localText.toUpperCase();


    /* LTT OCR variants */

    if(
      /\bLTT\b/.test(localUpper) ||
      /\bL7T\b/.test(localUpper) ||
      /\bLT7\b/.test(localUpper) ||
      /\bLIT\b/.test(localUpper) ||
      /\bLII\b/.test(localUpper) ||
      /\bL\s*T\s*T\b/.test(localUpper)
    ){

      return "LTT";

    }


    const date =
      extractDateFromText(
        localText
      );

    if(date){
      return date;
    }

  }

  return "";

}


/* =========================================
   CLEAN VEHICLE CANDIDATE
========================================= */

function cleanVehicleCandidate(raw){

  if(!raw){
    return "";
  }


  let s =
    String(raw)
      .toUpperCase()
      .replace(/[^A-Z0-9]/g,"");


  /* Repair beginning only */

  if(
    s.indexOf("G7") === 0
  ){
    s =
      "GJ" +
      s.substring(2);
  }

  if(
    s.indexOf("6J") === 0
  ){
    s =
      "GJ" +
      s.substring(2);
  }


  if(
    s.indexOf("GJ") !== 0
  ){
    return "";
  }


  /*
    GJ
    + 2 RTO digits
    + 1-3 series letters
    + 3-5 number chars
  */

  const match =
    s.match(
      /^GJ(.{2})([A-Z]{1,3})([A-Z0-9]{3,5})$/
    );


  if(!match){
    return "";
  }


  let rto =
    match[1];

  let series =
    match[2];

  let numberPart =
    match[3];


  /* RTO corrections ONLY */

  rto =
    rto
      .replace(/O/g,"0")
      .replace(/Q/g,"0")
      .replace(/D/g,"0")
      .replace(/I/g,"1")
      .replace(/L/g,"1")
      .replace(/Z/g,"2")
      .replace(/S/g,"5")
      .replace(/B/g,"8")
      .replace(/G/g,"6")
      .replace(/T/g,"7");


  if(
    !/^\d{2}$/.test(rto)
  ){
    return "";
  }


  /*
    IMPORTANT:
    Series letters remain
    exactly as OCR reads.
  */

  if(
    !/^[A-Z]{1,3}$/.test(series)
  ){
    return "";
  }


  /* Number corrections */

  numberPart =
    numberPart
      .replace(/O/g,"0")
      .replace(/Q/g,"0")
      .replace(/D/g,"0")
      .replace(/I/g,"1")
      .replace(/L/g,"1")
      .replace(/Z/g,"2")
      .replace(/S/g,"5")
      .replace(/B/g,"8")
      .replace(/G/g,"6")
      .replace(/T/g,"7");


  if(
    !/^\d{3,5}$/.test(numberPart)
  ){
    return "";
  }


  return (
    "GJ" +
    rto +
    series +
    numberPart
  );

}


/* =========================================
   EXTRACT VEHICLE NUMBER
========================================= */

function extractVehicleNumber(text){

  const lines =
    getOCRLines(text);

  const candidates = [];


  function addCandidate(
    raw,
    score
  ){

    const cleaned =
      cleanVehicleCandidate(
        raw
      );

    if(cleaned){

      candidates.push({
        value:cleaned,
        score:score
      });

    }

  }


  /* =======================================
     STEP 1
     Immediately after VEHICLE NUMBER
  ======================================= */

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const upper =
      lines[i].toUpperCase();


    if(
      upper.indexOf(
        "VEHICLE NUMBER"
      ) >= 0
    ){

      /*
        SAME LINE
      */

      const sameMatch =
        lines[i].match(
          /(?:GJ|G7|6J)[A-Z0-9\s]{5,14}/i
        );

      if(sameMatch){

        addCandidate(
          sameMatch[0],
          120
        );

      }


      /*
        NEXT 1-2 LINES
      */

      for(
        let j=1;
        j<=2;
        j++
      ){

        if(!lines[i+j]){
          continue;
        }

        const nextMatch =
          lines[i+j].match(
            /(?:GJ|G7|6J)[A-Z0-9\s]{5,14}/i
          );

        if(nextMatch){

          addCandidate(
            nextMatch[0],
            115-j
          );

        }

      }

    }

  }


  /* =======================================
     STEP 2
     Individual tokens around label
  ======================================= */

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    if(
      lines[i]
        .toUpperCase()
        .indexOf(
          "VEHICLE NUMBER"
        ) >= 0
    ){

      for(
        let j=0;
        j<=3;
        j++
      ){

        if(!lines[i+j]){
          continue;
        }

        const tokens =
          lines[i+j]
            .split(/\s+/);


        for(
          let k=0;
          k<tokens.length;
          k++
        ){

          if(
            /^(?:GJ|G7|6J)[A-Z0-9]{5,12}$/i
              .test(tokens[k])
          ){

            addCandidate(
              tokens[k],
              105-j
            );

          }

        }

      }

    }

  }


  /* =======================================
     STEP 3
     Global scan
  ======================================= */

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const tokens =
      lines[i]
        .split(/\s+/);


    for(
      let j=0;
      j<tokens.length;
      j++
    ){

      if(
        /^(?:GJ|G7|6J)[A-Z0-9]{5,12}$/i
          .test(tokens[j])
      ){

        addCandidate(
          tokens[j],
          30
        );

      }

    }

  }


  /* =======================================
     GROUP REPEATED CANDIDATES
  ======================================= */

  const groups = {};


  candidates.forEach(function(item){

    if(!groups[item.value]){

      groups[item.value] = {
        count:0,
        bestScore:0
      };

    }

    groups[item.value].count++;

    if(
      item.score >
      groups[item.value].bestScore
    ){

      groups[item.value].bestScore =
        item.score;

    }

  });


  let best = "";

  let bestFinalScore = -1;


  Object.keys(groups)
    .forEach(function(value){

      const data =
        groups[value];

      const finalScore =
        data.count * 1000 +
        data.bestScore;


      if(
        finalScore >
        bestFinalScore
      ){

        bestFinalScore =
          finalScore;

        best =
          value;

      }

    });


  return best;

}


/* =========================================
   VEHICLE CLASS
========================================= */

function detectVehicleClass(text){

  const upper =
    normalizeOCRText(text)
      .toUpperCase();


  const codes = [
    "HGV",
    "MGV",
    "MPV",
    "LGV",
    "LMV",
    "LPV",
    "HPV",
    "2WN",
    "3WT",
    "OTH"
  ];


  for(
    let i=0;
    i<codes.length;
    i++
  ){

    const code =
      codes[i];

    if(
      new RegExp(
        "\\b" +
        code +
        "\\b"
      ).test(upper)
    ){

      return code;

    }

  }


  /* Description fallbacks */


  if(
    upper.indexOf(
      "CONSTRUCTION EQUIPMENT VEHICLE"
    ) >= 0
  ){

    return "OTH";

  }


  if(
    upper.indexOf("M-CYCLE") >= 0 ||
    upper.indexOf("MOTORCYCLE") >= 0 ||
    upper.indexOf("MOTOR CYCLE") >= 0 ||
    upper.indexOf("SCOOTER") >= 0 ||
    upper.indexOf("TWO WHEELER") >= 0
  ){

    return "2WN";

  }


  if(
    upper.indexOf("THREE WHEELER") >= 0 ||
    upper.indexOf("AUTO RICKSHAW") >= 0 ||
    upper.indexOf("AUTORICKSHAW") >= 0
  ){

    return "3WT";

  }


  if(
    upper.indexOf("BUS") >= 0
  ){

    return "HPV";

  }


  if(
    upper.indexOf("TRACTOR") >= 0 ||
    upper.indexOf("PICK-UP") >= 0 ||
    upper.indexOf("PICK UP") >= 0 ||
    upper.indexOf("GOODS VEHICLE") >= 0
  ){

    return "LGV";

  }


  if(
    upper.indexOf("MOTOR CAR") >= 0 ||
    upper.indexOf("CAR") >= 0
  ){

    return "LMV";

  }


  return "";

}

/* =========================================
   CREATE ENHANCED IMAGE
========================================= */

function createEnhancedImage(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(e){

          const img =
            new Image();


          img.onload =
            function(){

              let width =
                img.width;

              let height =
                img.height;


              if(width < 1800){

                const scale =
                  1800 / width;

                width =
                  1800;

                height =
                  Math.round(
                    height * scale
                  );

              }


              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              const imageData =
                ctx.getImageData(
                  0,
                  0,
                  width,
                  height
                );


              const data =
                imageData.data;


              for(
                let i=0;
                i<data.length;
                i+=4
              ){

                const gray =
                  0.299 * data[i] +
                  0.587 * data[i+1] +
                  0.114 * data[i+2];


                const contrast =
                  Math.max(
                    0,
                    Math.min(
                      255,
                      (gray - 128) * 1.5 + 128
                    )
                  );


                data[i] =
                  contrast;

                data[i+1] =
                  contrast;

                data[i+2] =
                  contrast;

              }


              ctx.putImageData(
                imageData,
                0,
                0
              );


              canvas.toBlob(
                function(blob){

                  if(blob){

                    resolve(blob);

                  }else{

                    reject(
                      new Error(
                        "Image enhancement failed"
                      )
                    );

                  }

                },
                "image/jpeg",
                0.95
              );

            };


          img.onerror =
            reject;

          img.src =
            e.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(file);

    }
  );

}


/* =========================================
   TESSERACT OCR
========================================= */

async function recognizeOCR(
  image,
  passNumber,
  totalPasses
){

  const result =
    await Tesseract.recognize(
      image,
      "eng",
      {
        logger:function(info){

          if(
            info.status ===
            "recognizing text"
          ){

            const local =
              Math.round(
                (info.progress || 0) * 100
              );


            const base =
              ((passNumber - 1) /
                totalPasses) * 100;


            const step =
              100 /
              totalPasses;


            const total =
              Math.round(
                base +
                local * step / 100
              );


            setProgress(
              total,
              "OCR Pass " +
              passNumber +
              "/" +
              totalPasses +
              " - " +
              local +
              "%"
            );

          }

        }
      }
    );


  return result.data.text || "";

}


/* =========================================
   OLD 3-STEP OCR
========================================= */

async function startOCR(){

  if(!selectedFile){

    showMessage(
      "Please upload a VAHAN photo first.",
      "error"
    );

    return;

  }


  const btn =
    document.getElementById(
      "ocrBtn"
    );


  btn.disabled = true;


  document
    .getElementById(
      "progressWrap"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "message"
    )
    .style.display =
    "none";


  setProgress(
    0,
    "Starting OCR..."
  );


  try{

    /*
      STEP 1
      Original image
    */

    const text1 =
      await recognizeOCR(
        selectedFile,
        1,
        3
      );


    /*
      STEP 2
      Enhanced image
    */

    const enhanced =
      await createEnhancedImage(
        selectedFile
      );


    const text2 =
      await recognizeOCR(
        enhanced,
        2,
        3
      );


    /*
      STEP 3
      Enhanced image again
      High quality pass
    */

    const enhanced2 =
      await createEnhancedImage(
        selectedFile
      );


    const text3 =
      await recognizeOCR(
        enhanced2,
        3,
        3
      );


    /*
      Combine all OCR passes
    */

    const combined =
      text1 +
      "\n\n===== OCR PASS =====\n\n" +
      text2 +
      "\n\n===== OCR PASS =====\n\n" +
      text3;


    document
      .getElementById("ocrText")
      .value =
      combined;


    /*
      Extract fields
    */

    extractOCRData();


    setProgress(
      100,
      "OCR Complete - 100%"
    );


    showMessage(
      "OCR completed successfully. Please check the details before saving.",
      "success"
    );


  }catch(error){

    console.error(
      "OCR ERROR:",
      error
    );


    showMessage(
      "OCR failed: " +
      (
        error.message ||
        error
      ),
      "error"
    );


  }finally{

    btn.disabled =
      false;

  }

}

/* =========================================
   UPLOAD PHOTO
========================================= */

async function uploadVehiclePhoto(
  file,
  vehicleNumber
){

  const extension =
    (
      file.name
        .split(".")
        .pop() ||
      "jpg"
    )
    .toLowerCase();


  const safeNumber =
    vehicleNumber
      .replace(
        /[^A-Z0-9]/gi,
        ""
      );


  const filePath =
    safeNumber +
    "_" +
    Date.now() +
    "." +
    extension;


  const {
    error
  } =
    await supabaseClient
      .storage
      .from("vehicle-photos")
      .upload(
        filePath,
        file,
        {
          upsert:false,
          contentType:
            file.type ||
            "image/jpeg"
        }
      );


  if(error){
    throw error;
  }


  const {
    data
  } =
    supabaseClient
      .storage
      .from("vehicle-photos")
      .getPublicUrl(
        filePath
      );


  return {
    path:filePath,
    url:data.publicUrl
  };

}

        ){

          await deleteOldPhoto(
            oldPath
          );

        }


        showMessage(
          "Vehicle updated successfully. Old photo replaced.",
          "success"
        );


        saveBtn.disabled =
          false;

        return;

      }


      /*
        New vehicle
      */

      result =
        await supabaseClient
          .from("vehicles")
          .insert([
            vehicleData
          ]);

    }


    if(result.error){
      throw result.error;
    }


    /*
      Edit mode:
      delete old photo only after
      DB update succeeded.
    */

    if(
      editingId &&
      selectedFile &&
      oldPhotoPath &&
      oldPhotoPath !== photoPath
    ){

      await deleteOldPhoto(
        oldPhotoPath
      );


      showMessage(
        "Vehicle updated successfully. Old photo replaced.",
        "success"
      );

    }else{

      showMessage(
        editingId
          ? "Vehicle updated successfully."
          : "Vehicle saved successfully.",
        "success"
      );

    }


    /*
      Clear selected file
    */

    selectedFile =
      null;


    document
      .getElementById(
        "photoInput"
      )
      .value =
      "";


    currentPhotoUrl =
      photoUrl;

    oldPhotoPath =
      photoPath;


  }catch(error){

    console.error(
      "SAVE ERROR:",
      error
    );


    showMessage(
      "Save failed: " +
      (
        error.message ||
        error
      ),
      "error"
    );


  }finally{

    saveBtn.disabled =
      false;

  }

}


/* =========================================
   PAGE LOAD
========================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadVehicle();

  }
);

</script>

</body>

</html>
