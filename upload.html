/* =====================================================
   NORMALIZE OCR
===================================================== */

function normalizeOCRText(text){

  return String(text || "")
    .replace(/\r/g,"\n")
    .replace(/[|]/g,"I")
    .replace(/[“”]/g,'"')
    .replace(/[‘’]/g,"'")
    .replace(/\u00a0/g," ")
    .replace(/[ \t]+/g," ")
    .replace(/\n{2,}/g,"\n")
    .trim();

}


function getOCRLines(text){

  return normalizeOCRText(text)
    .split("\n")
    .map(x => x.trim())
    .filter(Boolean);

}


/* =====================================================
   DATE PARSER
===================================================== */

const MONTHS = {

  JAN:"01",
  JANUARY:"01",

  FEB:"02",
  FEBRUARY:"02",

  MAR:"03",
  MARCH:"03",

  APR:"04",
  APRIL:"04",

  MAY:"05",

  JUN:"06",
  JUNE:"06",

  JUL:"07",
  JULY:"07",

  AUG:"08",
  AUGUST:"08",

  SEP:"09",
  SEPT:"09",
  SEPTEMBER:"09",

  OCT:"10",
  OCTOBER:"10",

  NOV:"11",
  NOVEMBER:"11",

  DEC:"12",
  DECEMBER:"12"

};


function normalizeDate(day,month,year){

  day =
  String(day)
  .replace(/[^\d]/g,"");

  month =
  String(month)
  .toUpperCase()
  .replace(/[^A-Z0-9]/g,"");

  year =
  String(year)
  .replace(/[^\d]/g,"");

  if(year.length === 2){

    year =
    Number(year) >= 50
      ? "19" + year
      : "20" + year;

  }

  if(day.length === 1)
    day = "0" + day;

  if(/^\d+$/.test(month)){

    month =
    month.padStart(2,"0");

  }else{

    month =
    MONTHS[month] || "";

  }

  if(
    !/^\d{2}$/.test(day) ||
    !/^\d{2}$/.test(month) ||
    !/^\d{4}$/.test(year)
  ){

    return "";

  }

  const d =
  Number(day);

  const m =
  Number(month);

  const y =
  Number(year);

  const dt =
  new Date(y,m-1,d);

  if(
    dt.getFullYear() !== y ||
    dt.getMonth() !== m-1 ||
    dt.getDate() !== d
  ){

    return "";

  }

  const monthNames = [
    "Jan","Feb","Mar","Apr",
    "May","Jun","Jul","Aug",
    "Sep","Oct","Nov","Dec"
  ];

  return (
    day +
    "-" +
    monthNames[m-1] +
    "-" +
    year
  );

}


function parseDateFromText(text){

  if(!text) return "";

  const t =
  String(text)
  .replace(/,/g," ")
  .replace(/\s+/g," ")
  .trim();


  /* DD-MMM-YYYY */

  let m =
  t.match(
    /\b(\d{1,2})\s*[-\/.\s]\s*([A-Za-z]{3,9})\s*[-\/.\s]\s*(\d{2,4})\b/i
  );

  if(m){

    const result =
    normalizeDate(
      m[1],
      m[2],
      m[3]
    );

    if(result) return result;

  }


  /* DD-MM-YYYY */

  m =
  t.match(
    /\b(\d{1,2})\s*[-\/.]\s*(\d{1,2})\s*[-\/.]\s*(\d{2,4})\b/
  );

  if(m){

    const result =
    normalizeDate(
      m[1],
      m[2],
      m[3]
    );

    if(result) return result;

  }


  /* YYYY-MM-DD */

  m =
  t.match(
    /\b(20\d{2}|19\d{2})\s*[-\/.]\s*(\d{1,2})\s*[-\/.]\s*(\d{1,2})\b/
  );

  if(m){

    const result =
    normalizeDate(
      m[3],
      m[2],
      m[1]
    );

    if(result) return result;

  }


  return "";

}


/* =====================================================
   STRICT LABEL DATE EXTRACTION
===================================================== */

function extractDateNearLabels(
  lines,
  labels,
  maxNextLines = 3
){

  const upperLines =
  lines.map(x =>
    x.toUpperCase()
  );


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const line =
    upperLines[i];


    for(
      const label of labels
    ){

      if(
        line.includes(label)
      ){

        /* Same line */

        const sameLine =
        lines[i]
        .replace(
          new RegExp(
            label.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),
            "i"
          ),
          " "
        );

        let date =
        parseDateFromText(
          sameLine
        );

        if(date)
          return date;


        /* Next 1-3 lines ONLY */

        for(
          let j=1;
          j<=maxNextLines;
          j++
        ){

          if(
            i+j >= lines.length
          ) break;

          date =
          parseDateFromText(
            lines[i+j]
          );

          if(date)
            return date;

        }

      }

    }

  }

  return "";

}


/* =====================================================
   REGISTRATION DATE
   STRICT - NO RANDOM DATE
===================================================== */

function extractRegistrationDate(lines){

  const labels = [

    "REGISTRATION DATE",
    "REGISTRATION DT",
    "REGN DATE",
    "REGN DT",
    "REG DATE"

  ];

  return extractDateNearLabels(
    lines,
    labels,
    3
  );

}


/* =====================================================
   FITNESS
===================================================== */

function extractFitnessDate(lines){

  const labels = [

    "FITNESS VALID UPTO",
    "FITNESS VALID UP TO",
    "FITNESS VALID",
    "FITNESS/REGN",
    "FITNESS / REGN",
    "FITNESS EXPIRY",
    "FITNESS EXPIRY DATE",
    "FITNESS"

  ];

  return extractDateNearLabels(
    lines,
    labels,
    3
  );

}


/* =====================================================
   INSURANCE
===================================================== */

function extractInsuranceDate(lines){

  const labels = [

    "INSURANCE VALID UPTO",
    "INSURANCE VALID UP TO",
    "INSURANCE VALID",
    "INSURANCE EXPIRY",
    "INSURANCE EXPIRY DATE",
    "INSURANCE VALIDITY"

  ];

  let result =
  extractDateNearLabels(
    lines,
    labels,
    3
  );

  if(result)
    return result;


  /*
    VAHAN old format:

    Insurance Details
    Company:
    ...
    Validity:
    24-Nov-2029

    So search only inside the insurance block.
  */

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    if(
      lines[i]
      .toUpperCase()
      .includes("INSURANCE DETAILS")
    ){

      for(
        let j=i+1;
        j<Math.min(
          i+12,
          lines.length
        );
        j++
      ){

        if(
          lines[j]
          .toUpperCase()
          .startsWith("VALIDITY")
        ){

          const same =
          parseDateFromText(
            lines[j]
          );

          if(same)
            return same;


          for(
            let k=j+1;
            k<=j+2 &&
            k<lines.length;
            k++
          ){

            const d =
            parseDateFromText(
              lines[k]
            );

            if(d)
              return d;

          }

        }

      }

    }

  }

  return "";

}


/* =====================================================
   TAX
===================================================== */

function extractTax(lines){

  const labels = [

    "MV TAX",
    "TAX VALID UPTO",
    "TAX VALID UP TO",
    "TAX VALID",
    "TAX EXPIRY",
    "TAX"

  ];


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const upper =
    lines[i].toUpperCase();


    let matched = false;

    for(
      const label of labels
    ){

      if(
        upper.includes(label)
      ){

        matched = true;
        break;

      }

    }

    if(!matched)
      continue;


    /* LTT in same line */

    if(
      /\bL\s*[- ]?\s*T\s*[- ]?\s*T\b/i
      .test(lines[i])
    ){

      return "LTT";

    }


    if(
      /\bLTT\b/i
      .test(lines[i])
    ){

      return "LTT";

    }


    /* Same line date */

    let date =
    parseDateFromText(
      lines[i]
    );

    if(date)
      return date;


    /* Next 1-3 lines */

    for(
      let j=1;
      j<=3;
      j++
    ){

      if(
        i+j >= lines.length
      ) break;


      const next =
      lines[i+j];


      if(
        /\bL\s*[- ]?\s*T\s*[- ]?\s*T\b/i
        .test(next) ||
        /\bLTT\b/i.test(next)
      ){

        return "LTT";

      }


      date =
      parseDateFromText(
        next
      );

      if(date)
        return date;

    }

  }

  return "";

}

/* =====================================================
   VEHICLE CLASS OCR
===================================================== */

function extractVehicleClass(lines){

  const text =
  lines
  .join(" ")
  .toUpperCase();


  if(
    text.includes("M-CYCLE") ||
    text.includes("MCYCLE") ||
    text.includes("MOTORCYCLE") ||
    text.includes("SCOOTER") ||
    text.includes("2WN")
  ){

    return "2WN";

  }


  if(
    text.includes("CONSTRUCTION EQUIPMENT VEHICLE") ||
    text.includes("(OTH)") ||
    /\bOTH\b/.test(text)
  ){

    return "OTH";

  }


  if(
    /\bMGV\b/.test(text)
  ){

    return "MGV";

  }


  if(
    /\bHGV\b/.test(text)
  ){

    return "HGV";

  }


  if(
    /\bLGV\b/.test(text)
  ){

    return "LGV";

  }


  if(
    /\bLMV\b/.test(text)
  ){

    return "LMV";

  }


  if(
    /\bLPV\b/.test(text)
  ){

    return "LPV";

  }


  if(
    /\bHPV\b/.test(text)
  ){

    return "HPV";

  }


  if(
    /\b3WT\b/.test(text) ||
    text.includes("3 WHEELER")
  ){

    return "3WT";

  }


  return "";

}


/* =====================================================
   VEHICLE NUMBER
===================================================== */

function correctStatePart(part){

  return part
    .toUpperCase()
    .replace(/0/g,"O")
    .replace(/1/g,"I")
    .replace(/2/g,"Z")
    .replace(/5/g,"S")
    .replace(/8/g,"B")
    .replace(/6/g,"G")
    .replace(/7/g,"T");

}


function correctRtoPart(part){

  return part
    .toUpperCase()
    .replace(/O/g,"0")
    .replace(/Q/g,"0")
    .replace(/D/g,"0")
    .replace(/I/g,"1")
    .replace(/L/g,"1")
    .replace(/Z/g,"2")
    .replace(/S/g,"5")
    .replace(/B/g,"8")
    .replace(/G/g,"6")
    .replace(/T/g,"7")
    .replace(/[^0-9]/g,"");

}


function correctSeriesPart(part){

  return part
    .toUpperCase()
    .replace(/5/g,"S")
    .replace(/0/g,"O")
    .replace(/1/g,"I")
    .replace(/2/g,"Z")
    .replace(/8/g,"B")
    .replace(/6/g,"G")
    .replace(/7/g,"T")
    .replace(/[^A-Z]/g,"");

}


function correctFinalNumberPart(part){

  return part
    .toUpperCase()
    .replace(/O/g,"0")
    .replace(/Q/g,"0")
    .replace(/D/g,"0")
    .replace(/I/g,"1")
    .replace(/L/g,"1")
    .replace(/Z/g,"2")
    .replace(/S/g,"5")
    .replace(/B/g,"8")
    .replace(/G/g,"6")
    .replace(/T/g,"7")
    .replace(/[^0-9]/g,"");

}


function fixVehicleNumberCandidate(raw){

  if(!raw)
    return "";

  let s =
  raw
  .toUpperCase()
  .replace(/[^A-Z0-9]/g,"");


  /*
    Standard Indian format:

    GJ34S1419

    State = GJ
    RTO   = 34
    Series = S
    Number = 1419
  */

  if(s.length < 7)
    return "";


  let state =
  correctStatePart(
    s.slice(0,2)
  );


  if(
    state.length !== 2
  )
    return "";


  let rtoRaw =
  s.slice(2,4);


  let rto =
  correctRtoPart(
    rtoRaw
  );


  if(
    rto.length !== 2
  )
    return "";


  let remaining =
  s.slice(4);


  /*
    Usually 1-3 letters + 1-4 digits
  */

  let match =
  remaining.match(
    /^([A-Z0-9]{1,3})(\d{1,4})$/
  );


  if(!match){

    const last4 =
    remaining.slice(-4);

    const seriesRaw =
    remaining.slice(
      0,
      -4
    );

    const series =
    correctSeriesPart(
      seriesRaw
    );

    const num =
    correctFinalNumberPart(
      last4
    );

    if(
      series &&
      num.length === 4
    ){

      return (
        state +
        rto +
        series +
        num
      );

    }

    return "";

  }


  const series =
  correctSeriesPart(
    match[1]
  );

  const number =
  correctFinalNumberPart(
    match[2]
  );


  if(
    !series ||
    number.length < 1
  ){

    return "";

  }


  return (
    state +
    rto +
    series +
    number
  );

}


/* =====================================================
   VEHICLE NUMBER CANDIDATES
===================================================== */

function collectVehicleNumberCandidates(text){

  const candidates = [];

  const lines =
  getOCRLines(text);


  for(
    const line of lines
  ){

    const cleaned =
    line
    .toUpperCase()
    .replace(/[^A-Z0-9]/g,"");


    /*
      Direct pattern
    */

    const matches =
    cleaned.match(
      /[A-Z]{1,3}[0-9OQDI LZS BGT]{1,10}/gi
    );


    if(matches){

      for(
        const m of matches
      ){

        const fixed =
        fixVehicleNumberCandidate(
          m.replace(/\s/g,"")
        );

        if(
          fixed &&
          fixed.length >= 7
        ){

          candidates.push(fixed);

        }

      }

    }


    /*
      Search specifically around GJ etc.
    */

    const gjMatches =
    line
    .toUpperCase()
    .match(
      /GJ[\s\-.:]*[0-9OQDISBLZG]{2}[\s\-.:]*[A-Z0-9]{1,3}[\s\-.:]*[0-9OQDISBLZG]{1,4}/g
    );


    if(gjMatches){

      for(
        const m of gjMatches
      ){

        const fixed =
        fixVehicleNumberCandidate(
          m
        );

        if(fixed)
          candidates.push(fixed);

      }

    }

  }


  return [
    ...new Set(candidates)
  ];

}


/* =====================================================
   BEST VEHICLE NUMBER
===================================================== */

function extractVehicleNumber(text){

  const lines =
  getOCRLines(text);


  /*
    First priority:
    line containing "Vehicle Number"
  */

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    if(
      lines[i]
      .toUpperCase()
      .includes("VEHICLE NUMBER")
    ){

      for(
        let j=0;
        j<=2;
        j++
      ){

        if(
          i+j >= lines.length
        ) break;


        const candidates =
        lines[i+j]
        .match(
          /[A-Z0-9]{7,12}/g
        ) || [];


        for(
          const candidate of candidates
        ){

          const fixed =
          fixVehicleNumberCandidate(
            candidate
          );

          if(fixed)
            return fixed;

        }

      }

    }

  }


  const candidates =
  collectVehicleNumberCandidates(
    text
  );


  if(candidates.length)
    return candidates[0];


  return "";

}


/* =====================================================
   OCR
===================================================== */

async function runOCR(file){

  loading.style.display =
    "block";

  ocrStatus.className =
    "status";

  ocrStatus.innerText =
    "⏳ OCR શરૂ થઈ રહ્યું છે...";


  try{

    const imageUrl =
    URL.createObjectURL(file);


    /*
      Multiple OCR passes
    */

    const configs = [

      "--psm 6",

      "--psm 11",

      "--psm 6 -c preserve_interword_spaces=1",

      "--psm 11 -c preserve_interword_spaces=1",

      "--psm 12"

    ];


    let allText = "";


    for(
      let i=0;
      i<configs.length;
      i++
    ){

      ocrStatus.innerText =
        "⏳ OCR pass " +
        (i+1) +
        " / " +
        configs.length +
        "...";


      const result =
      await Tesseract.recognize(
        imageUrl,
        "eng",
        {
          logger: m => {

            if(
              m.status ===
              "recognizing text"
            ){

              const p =
              Math.round(
                (m.progress || 0) * 100
              );

              ocrStatus.innerText =
                "⏳ OCR pass " +
                (i+1) +
                " / " +
                configs.length +
                " — " +
                p +
                "%";

            }

          },
          config: configs[i]
        }
      );


      allText +=
        "\n" +
        result.data.text;

    }


    URL.revokeObjectURL(
      imageUrl
    );


    allText =
    normalizeOCRText(
      allText
    );


    document.getElementById(
      "ocrText"
    ).value =
    allText;


    fillFromOCR(
      allText
    );


    ocrStatus.className =
      "status success";

    ocrStatus.innerText =
      "✅ OCR complete. Details automatically filled.";


  }catch(error){

    console.error(error);

    ocrStatus.className =
      "status error";

    ocrStatus.innerText =
      "❌ OCR error: " +
      error.message;

  }


  loading.style.display =
    "none";

}


/* =====================================================
   FILL FORM FROM OCR
===================================================== */

function fillFromOCR(text){

  const lines =
  getOCRLines(text);


  /* Vehicle Number */

  const vehicleNumber =
  extractVehicleNumber(text);

  if(vehicleNumber){

    document.getElementById(
      "vehicleNumber"
    ).value =
      vehicleNumber;

  }


  /* Registration */

  const registrationDate =
  extractRegistrationDate(
    lines
  );

  document.getElementById(
    "registrationDate"
  ).value =
    registrationDate || "";


  /* Fitness */

  const fitness =
  extractFitnessDate(
    lines
  );

  document.getElementById(
    "fitnessExpiry"
  ).value =
    fitness || "";


  /* Insurance */

  const insurance =
  extractInsuranceDate(
    lines
  );

  document.getElementById(
    "insuranceExpiry"
  ).value =
    insurance || "";


  /* Tax */

  const tax =
  extractTax(
    lines
  );

  document.getElementById(
    "taxExpiry"
  ).value =
    tax || "";


  /* PUCC */

  const pucc =
  extractPUCCDate(
    lines
  );

  document.getElementById(
    "puccExpiry"
  ).value =
    pucc || "";


  /* Permit */

  const permit =
  extractPermitDate(
    lines
  );

  document.getElementById(
    "permitExpiry"
  ).value =
    permit || "";


  /* Vehicle Class */

  const vehicleClass =
  extractVehicleClass(
    lines
  );

  if(vehicleClass){

    setVehicleClass(
      vehicleClass
    );

  }


  console.log(
    "OCR RESULT:",
    {
      vehicleNumber,
      registrationDate,
      fitness,
      insurance,
      tax,
      pucc,
      permit,
      vehicleClass
    }
  );

}

/* =====================================================
   JPG CONVERSION
===================================================== */

async function convertToJPG(file){

  if(
    file.type ===
    "image/jpeg"
  ){

    return file;

  }


  return new Promise(
    (resolve,reject)=>{

      const img =
      new Image();

      img.onload = () => {

        const canvas =
        document.createElement(
          "canvas"
        );

        canvas.width =
        img.naturalWidth;

        canvas.height =
        img.naturalHeight;


        const ctx =
        canvas.getContext(
          "2d"
        );


        ctx.drawImage(
          img,
          0,
          0
        );


        canvas.toBlob(
          blob => {

            if(!blob){

              reject(
                new Error(
                  "Image conversion failed"
                )
              );

              return;

            }


            resolve(
              new File(
                [blob],
                "vehicle.jpg",
                {
                  type:
                  "image/jpeg"
                }
              )
            );

          },
          "image/jpeg",
          0.90
        );

      };


      img.onerror =
      reject;

      img.src =
      URL.createObjectURL(
        file
      );

    }
  );

}


/* =====================================================
   STORAGE UPLOAD
===================================================== */

async function uploadPhoto(file){

  const jpgFile =
  await convertToJPG(
    file
  );


  const unique =
  Date.now() +
  "_" +
  Math.random()
    .toString(36)
    .substring(2,8);


  const path =
    "vehicles/" +
    unique +
    ".jpg";


  const {
    error
  } =
  await supabaseClient
    .storage
    .from("vehicle-photos")
    .upload(
      path,
      jpgFile,
      {
        cacheControl:
          "3600",
        upsert:false,
        contentType:
          "image/jpeg"
      }
    );


  if(error)
    throw error;


  const {
    data
  } =
  supabaseClient
    .storage
    .from("vehicle-photos")
    .getPublicUrl(
      path
    );


  return {

    path,

    url:
      data.publicUrl

  };

}


/* =====================================================
   DELETE OLD PHOTO
===================================================== */

async function deletePhoto(
  photoPath
){

  if(!photoPath)
    return;


  const {
    error
  } =
  await supabaseClient
    .storage
    .from("vehicle-photos")
    .remove([
      photoPath
    ]);


  if(error){

    console.warn(
      "Old photo delete error:",
      error
    );

  }

}

  params.get("id");


  if(!editingId)
    return;


  saveBtn.innerText =
    "💾 Update Vehicle";


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("vehicles")
      .select("*")
      .eq("id",editingId)
      .single();


    if(error)
      throw error;


    if(!data)

      data.mobile ||

    document.getElementById(
      "vehicleNumber"
    ).value =

    ).value =

    document.getElementById(
      "fitnessExpiry"
    ).value =
      data.fitness_expiry || "";


    document.getElementById(
      "insuranceExpiry"
    ).value =

      "taxExpiry"
    ).value =
      data.tax_expiry || "";


    document.getElementById(
      "puccExpiry"
    ).value =
      data.pucc_expiry || "";


    document.getElementById(
      "permitExpiry"
    ).value =
      data.permit_expiry || "";


    document.getElementById(
      "ocrText"
    ).value =
      data.ocr_text || "";


    setVehicleClass(
      data.vehicle_class || ""
    );


    oldPhotoPath =
      data.photo_path || "";


    oldPhotoUrl =
      data.photo_url || "";


    if(oldPhotoUrl){

      preview.src =
        oldPhotoUrl;

      preview.style.display =
        "block";

    }


    ocrStatus.className =
      "status success";

    ocrStatus.innerText =
      "✏️ Edit mode — existing vehicle loaded.";


  }catch(error){

    console.error(error);

    ocrStatus.className =
      "status error";

    ocrStatus.innerText =
      "❌ Load error: " +
      error.message;

  }

}


/* =====================================================
   SAVE / UPDATE
===================================================== */

saveBtn.addEventListener(
  "click",
  async function(){

    saveBtn.disabled =
      true;

    saveBtn.innerText =
      "⏳ Saving...";


    const saveStatus =
    document.getElementById(
      "saveStatus"
    );


    saveStatus.style.display =
      "block";

    saveStatus.className =
      "status";

    saveStatus.innerText =
      "Saving vehicle...";


    try{

      let vehicleNumber =
      document.getElementById(
        "vehicleNumber"
      ).value
      .trim()
      .toUpperCase();


      /*
        Manual vehicle number પણ
        correction formatમાંથી પસાર કરો.
      */

      const corrected =
      fixVehicleNumberCandidate(
        vehicleNumber
      );


      if(corrected){

        vehicleNumber =
          corrected;

      }


      if(!vehicleNumber){

        throw new Error(
          "Vehicle Number નાખો."
        );

      }


      const customerName =
      document.getElementById(
        "customerName"
      ).value
      .trim();


      const customerMobile =
      document.getElementById(
        "customerMobile"
      ).value
      .trim();


      const vehicleClass =
      document.getElementById(
        "vehicleClass"
      ).value
      .trim();


      const registrationDate =
      document.getElementById(
        "registrationDate"
      ).value
      .trim();


      const fitnessExpiry =
      document.getElementById(
        "fitnessExpiry"
      ).value
      .trim();


      const insuranceExpiry =
      document.getElementById(
        "insuranceExpiry"
      ).value
      .trim();


      const taxExpiry =
      document.getElementById(
        "taxExpiry"
      ).value
      .trim();


      const puccExpiry =
      document.getElementById(
        "puccExpiry"
      ).value
      .trim();


      const permitExpiry =
      document.getElementById(
        "permitExpiry"
      ).value
      .trim();


      const ocrText =
      document.getElementById(
        "ocrText"
      ).value;


      /* =================================================
         PHOTO
      ================================================= */

      let newPhoto =
      null;


      if(selectedFile){

        saveStatus.innerText =
          "⏳ Uploading vehicle photo...";


        newPhoto =
        await uploadPhoto(
          selectedFile
        );

      }


      /* =================================================
         DATA
      ================================================= */

      const vehicleData = {

        vehicle_number:
          vehicleNumber,

        customer_name:
          customerName,

        customer_mobile:
          customerMobile,

        vehicle_class:
          vehicleClass,

        registration_date:
          registrationDate || null,

        fitness_expiry:
          fitnessExpiry || null,

        insurance_expiry:
          insuranceExpiry || null,

        tax_expiry:
          taxExpiry || null,

        pucc_expiry:
          puccExpiry || null,

        permit_expiry:
          permitExpiry || null,

        ocr_text:
          ocrText || null

      };


      /* =================================================
         PHOTO DATA
      ================================================= */

      if(newPhoto){

        vehicleData.photo_url =
          newPhoto.url;

        vehicleData.photo_path =
          newPhoto.path;

      }


      /* =================================================
         UPDATE
      ================================================= */

      if(editingId){

        saveStatus.innerText =
          "⏳ Updating vehicle...";


        const {
          error
        } =
        await supabaseClient
          .from("vehicles")
          .update(
            vehicleData
          )
          .eq(
            "id",
            editingId
          );


        if(error){

          /*
            If DB update failed,
            remove newly uploaded photo
            to avoid orphan file.
          */

          if(newPhoto){

            await deletePhoto(
              newPhoto.path
            );

          }

          throw error;

        }


        /*
          DB update successful.
          Now delete old photo.
        */

        if(
          newPhoto &&
          oldPhotoPath &&
          oldPhotoPath !==
          newPhoto.path
        ){

          await deletePhoto(
            oldPhotoPath
          );

        }


        saveStatus.className =
          "status success";

        saveStatus.innerText =
          "✅ Vehicle updated successfully. Old photo replaced.";


        selectedFile =
          null;

        oldPhotoPath =
          newPhoto
            ? newPhoto.path
            : oldPhotoPath;


        oldPhotoUrl =
          newPhoto
            ? newPhoto.url
            : oldPhotoUrl;


      }


      /* =================================================
         INSERT
      ================================================= */

      else{

        saveStatus.innerText =
          "⏳ Saving vehicle...";


        /*
          Same vehicle number હોય તો
          old record/photo replace કરવો.
        */

        const {
          data: existing,
          error:
          existingError
        } =
        await supabaseClient
          .from("vehicles")
          .select("*")
          .eq(
            "vehicle_number",
            vehicleNumber
          );


        if(existingError)
          throw existingError;


        if(
          existing &&
          existing.length > 0
        ){

          const old =
          existing[0];


          /*
            If no new photo selected,
            retain old photo.
          */

          if(!newPhoto){

            vehicleData.photo_url =
              old.photo_url ||
              null;

            vehicleData.photo_path =
              old.photo_path ||
              null;

          }


          const {
            error:
            updateError
          } =
          await supabaseClient
            .from("vehicles")
            .update(
              vehicleData
            )
            .eq(
              "id",
              old.id
            );


          if(updateError){

            if(newPhoto){

              await deletePhoto(
                newPhoto.path
              );

            }

            throw updateError;

          }


          /*
            New photo successfully saved:
            delete old photo.
          */

          if(
            newPhoto &&
            old.photo_path
          ){

            await deletePhoto(
              old.photo_path
            );

          }


          saveStatus.className =
            "status success";

          saveStatus.innerText =
            "✅ Same vehicle updated successfully. Old photo replaced.";


        }

        else{

          const {
            error
          } =
          await supabaseClient
            .from("vehicles")
            .insert(
              vehicleData
            );


          if(error){

            if(newPhoto){

              await deletePhoto(
                newPhoto.path
              );

            }

            throw error;

          }


          saveStatus.className =
            "status success";

          saveStatus.innerText =
            "✅ Vehicle saved successfully.";

        }


        selectedFile =
          null;

      }


      /*
        Dashboard પર જવું
        1.5 seconds પછી
      */

      setTimeout(
        () => {

          window.location.href =
            "dashboard.html";

        },
        1500
      );


    }catch(error){

      console.error(
        "SAVE ERROR:",
        error
      );


      saveStatus.className =
        "status error";

      saveStatus.innerText =
        "❌ Save Error: " +
        (
          error.message ||
          error
        );


      saveBtn.disabled =
        false;

      saveBtn.innerText =
        editingId
          ? "💾 Update Vehicle"
          : "💾 Save Vehicle";

    }

  }
);
