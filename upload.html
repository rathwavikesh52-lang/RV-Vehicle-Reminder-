    return;

========================================================= */

/* =========================================================
   NORMALIZE OCR TEXT
========================================================= */

function normalizeText(text){

  return text
    .replace(/\r/g,"\n")
    .replace(/[ \t]+/g," ")
    .replace(/\n+/g,"\n")
    .trim();

}


/* =========================================================
   DATE CONVERSION
   OCR DATE -> DD/MM/YYYY
========================================================= */

function convertOCRDate(value){

  if(!value) return "";

  value = value.trim();

  const months = {
    JAN:"01",
    FEB:"02",
    MAR:"03",
    APR:"04",
    MAY:"05",
    JUN:"06",
    JUL:"07",
    AUG:"08",
    SEP:"09",
    OCT:"10",
    NOV:"11",
    DEC:"12"
  };

  /* DD-MMM-YYYY */

  let m = value.match(
    /\b(\d{1,2})[-\/.\s]([A-Za-z]{3,})[-\/.\s](\d{4})\b/i
  );

  if(m){

    let day =
      String(m[1]).padStart(2,"0");

    let mon =
      m[2].substring(0,3).toUpperCase();

    let year =
      m[3];

    if(months[mon]){

      return `${day}/${months[mon]}/${year}`;

    }

  }


  /* YYYY-MM-DD */

  m = value.match(
    /\b(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/
  );

  if(m){

    return `${String(m[3]).padStart(2,"0")}/${String(m[2]).padStart(2,"0")}/${m[1]}`;

  }


  /* DD/MM/YYYY */

  m = value.match(
    /\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})\b/
  );

  if(m){

    return `${String(m[1]).padStart(2,"0")}/${String(m[2]).padStart(2,"0")}/${m[3]}`;

  }

  return "";

}


/* =========================================================
   FIND DATE
========================================================= */

function findDate(text){

  if(!text) return "";

  const patterns = [

    /\b\d{1,2}[-\/.\s][A-Za-z]{3,9}[-\/.\s]\d{4}\b/gi,

    /\b\d{1,2}[-\/.]\d{1,2}[-\/.]\d{4}\b/g,

    /\b\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2}\b/g

  ];

  for(const pattern of patterns){

    const match =
      text.match(pattern);

    if(match && match.length){

      const converted =
        convertOCRDate(match[0]);

      if(converted){
        return converted;
      }

    }

  }

  return "";

}


/* =========================================================
   GET NEARBY TEXT
========================================================= */

function getNearbyText(lines,index,count=2){

  let result = [];

  for(
    let i=index;
    i<=Math.min(index+count,lines.length-1);
    i++
  ){

    result.push(lines[i]);

  }

  return result.join(" ");

}


/* =========================================================
   FIND DATE AFTER KEYWORD
========================================================= */

function findDateAfterKeyword(text,keywords){

  const lines =
    text.split(/\n/)
    .map(x => x.trim())
    .filter(Boolean);

  for(let i=0;i<lines.length;i++){

    const upper =
      lines[i].toUpperCase();

    const found =
      keywords.some(k =>
        upper.includes(k)
      );

    if(!found) continue;


    /* First check SAME line */

    let sameLineDate =
      findDate(lines[i]);

    if(sameLineDate){

      return sameLineDate;

    }


    /* Then check only next 1-2 lines */

    for(
      let j=i+1;
      j<=Math.min(i+2,lines.length-1);
      j++
    ){

      const nextLine =
        lines[j].toUpperCase();

      /*
        Stop if another known field starts.
      */

      const anotherField =
        /REGISTRATION DATE|FITNESS|INSURANCE|PUCC|PUC|TAX|PERMIT/.test(
          nextLine
        );

      if(anotherField){
        break;
      }

      const date =
        findDate(lines[j]);

      if(date){

        return date;

      }

    }

  }

  return "";

}


/* =========================================================
   FIND TAX
   LTT OR TAX DATE
========================================================= */

function findTax(text){

  const lines =
    text.split(/\n/)
    .map(x => x.trim())
    .filter(Boolean);


  for(let i=0;i<lines.length;i++){

    const current =
      lines[i].toUpperCase();


    if(
      !current.includes("TAX")
    ){
      continue;
    }


    /* LTT on same line */

    if(/\bLTT\b/.test(current)){

      return "LTT";

    }


    /* Common OCR mistakes for LTT */

    const lttSameLine =
      current.match(
        /\b(L7T|LT7|LIT|LII)\b/
      );

    if(lttSameLine){

      return "LTT";

    }


    /* Check ONLY immediate next line */

    if(i+1 < lines.length){

      const next =
        lines[i+1].toUpperCase();


      if(/\bLTT\b/.test(next)){

        return "LTT";

      }


      if(
        /\b(L7T|LT7|LIT|LII)\b/.test(next)
      ){

        return "LTT";

      }


      const date =
        findDate(lines[i+1]);

      if(date){

        return date;

      }

    }

  }

  return "";

}


/* =========================================================
   VEHICLE NUMBER CLEANING
========================================================= */

function cleanVehicleCandidate(value){

  if(!value) return "";

  let v =
    value
      .toUpperCase()
      .replace(/[^A-Z0-9]/g,"");


  /*
    Common OCR corrections
  */

  if(v.startsWith("GJO")){

    v =
      "GJ0" +
      v.substring(3);

  }

  if(v.startsWith("GIO")){

    v =
      "GJ0" +
      v.substring(3);

  }


  /*
    Must start with GJ
  */

  if(
    !v.startsWith("GJ")
  ){

    return "";

  }


  /*
    Correct RTO numeric section.
    Only characters in positions 2-3.
  */

  if(v.length >= 4){

    let chars =
      v.split("");

    const corrections = {
      O:"0",
      Q:"0",
      D:"0",
      I:"1",
      L:"1",
      S:"5",
      B:"8"
    };

    for(let i=2;i<4;i++){

      if(corrections[chars[i]]){

        chars[i] =
          corrections[chars[i]];

      }

    }

    v =
      chars.join("");

  }

  return v;

}


/* =========================================================
   VALID GUJARAT VEHICLE NUMBER
========================================================= */

function isValidGujaratNumber(v){

  if(!v) return false;

  const patterns = [

    /^GJ\d{2}[A-Z]\d{4}$/,

    /^GJ\d{2}[A-Z]\d{5}$/,

    /^GJ\d{2}\d{5}$/,

    /^GJ\d{2}[A-Z]{2}\d{4}$/,

    /^GJ\d{2}[A-Z]{2}\d{5}$/,

    /^GJ\d{2}[A-Z]{3}\d{3,5}$/

  ];

  return patterns.some(
    pattern => pattern.test(v)
  );

}


/* =========================================================
   CORRECT VEHICLE NUMBER
========================================================= */

function correctVehicleNumber(value){

  if(!value) return "";

  let v =
    cleanVehicleCandidate(value);


  /*
    Special OCR case:
    GJ06AZ5038
    can sometimes represent
    GJ06A25038
  */

  if(
    /^GJ\d{2}AZ\d{4}$/.test(v)
  ){

    v =
      v.replace(
        /^GJ(\d{2})AZ(\d{4})$/,
        "GJ$1A2$2"
      );

  }


  return v;

}


/* =========================================================
   FIND VEHICLE NUMBER
========================================================= */

function findVehicleNumber(text){

  const lines =
    text.split(/\n/)
    .map(x => x.trim())
    .filter(Boolean);


  /*
    First search near vehicle number labels
  */

  const keywords = [

    "VEHICLE NUMBER",
    "VEHICLE NO",
    "REGISTRATION NUMBER",
    "REGISTRATION NO",
    "REGN NO",
    "REG NO",
    "REGISTRATION"

  ];


  for(let i=0;i<lines.length;i++){

    const upper =
      lines[i].toUpperCase();

    if(
      keywords.some(k =>
        upper.includes(k)
      )
    ){

      /*
        Same line
      */

      let candidates =
        lines[i]
          .toUpperCase()
          .match(
            /GJ[\s\-]?\d{2}[\s\-]?[A-Z0-9]{1,3}[\s\-]?\d{3,5}/g
          );

      if(candidates){

        for(const candidate of candidates){

          const cleaned =
            correctVehicleNumber(candidate);

          if(
            isValidGujaratNumber(cleaned)
          ){

            return cleaned;

          }

        }

      }


      /*
        Next two lines
      */

      for(
        let j=i+1;
        j<=Math.min(i+2,lines.length-1);
        j++
      ){

        const matches =
          lines[j]
            .toUpperCase()
            .match(
              /GJ[\s\-]?\d{2}[\s\-]?[A-Z0-9]{1,3}[\s\-]?\d{3,5}/g
            );

        if(matches){

          for(const candidate of matches){

            const cleaned =
              correctVehicleNumber(candidate);

            if(
              isValidGujaratNumber(cleaned)
            ){

              return cleaned;

            }

          }

        }

      }

    }

  }


  /*
    Whole OCR text search
  */

  const matches =
    text
      .toUpperCase()
      .match(
        /GJ[\s\-]?\d{2}[\s\-]?[A-Z0-9]{1,3}[\s\-]?\d{3,5}/g
      );


  if(matches){

    for(const candidate of matches){

      const cleaned =
        correctVehicleNumber(candidate);

      if(
        isValidGujaratNumber(cleaned)
      ){

        return cleaned;

      }

    }

  }


  return "";

}


/* =========================================================
   PREPARE IMAGE
========================================================= */

async function prepareImage(file){

  /*
    Tesseract can directly process the uploaded image.
    Resize/compression is intentionally kept simple.
  */

  return file;

}


/* =========================================================
   CLEAR ALL OCR FIELDS
   IMPORTANT FIX
========================================================= */

function clearOCRFields(){

  vehicleNumber.value = "";

  registrationDate.value = "";

  fitnessExpiry.value = "";

  insuranceExpiry.value = "";

  taxExpiry.value = "";

  puccExpiry.value = "";

  permitExpiry.value = "";

  ocrText.value = "";

}


/* =========================================================
   READ PHOTO / OCR
========================================================= */

async function readPhoto(){

  const file =
    photoInput.files[0];


  if(!file){

    alert(
      "Please select a vehicle photo first."
    );

    return;

  }


  /*
    IMPORTANT:
    Clear previous photo's values BEFORE OCR.
    
    This prevents old dates such as:
    Fitness 01/04/2029
    Permit 14/05/2031
    Tax LTT
    
    from appearing when the new photo
    does not contain those values.
  */

  clearOCRFields();


  readBtn.disabled = true;

  saveBtn.disabled = true;


  showStatus(
    "Reading photo...\nPlease wait."
  );


  try{

    const image =
      await prepareImage(file);


    const result =
      await Tesseract.recognize(
        image,
        "eng",
        {
          logger: function(info){

            if(
              info.status === "recognizing text"
            ){

              const percent =
                Math.round(
                  (info.progress || 0) * 100
                );

              showStatus(
                "Reading photo...\nOCR Progress: " +
                percent +
                "%"
              );

            }

          }
        }
      );


    const rawText =
      normalizeText(
        result.data.text || ""
      );


    ocrText.value =
      rawText;


    /*
      VEHICLE NUMBER
    */

    const foundVehicleNumber =
      findVehicleNumber(rawText);

    if(foundVehicleNumber){

      vehicleNumber.value =
        foundVehicleNumber;

    }


    /*
      REGISTRATION DATE
    */

    const foundRegistrationDate =
      findDateAfterKeyword(
        rawText,
        [
          "REGISTRATION DATE",
          "REGISTRATION DT",
          "REGN DATE",
          "REG DATE"
        ]
      );

    if(foundRegistrationDate){

      registrationDate.value =
        foundRegistrationDate;

    }


    /*
      FITNESS
    */

    const foundFitness =
      findDateAfterKeyword(
        rawText,
        [
          "FITNESS VALID UPTO",
          "FITNESS VALID UP TO",
          "FITNESS UPTO",
          "FITNESS UP TO",
          "FITNESS"
        ]
      );

    if(foundFitness){

      fitnessExpiry.value =
        foundFitness;

    }


    /*
      INSURANCE
    */

    const foundInsurance =
      findDateAfterKeyword(
        rawText,
        [
          "INSURANCE VALID UPTO",
          "INSURANCE VALID UP TO",
          "INSURANCE UPTO",
          "INSURANCE UP TO",
          "INSURANCE"
        ]
      );

    if(foundInsurance){

      insuranceExpiry.value =
        foundInsurance;

    }


    /*
      TAX

      If source has no Tax value,
      field remains BLANK.
    */

    const foundTax =
      findTax(rawText);

    if(foundTax){

      taxExpiry.value =
        foundTax;

    }


    /*
      PUCC
    */

    const foundPUCC =
      findDateAfterKeyword(
        rawText,
        [
          "PUCC VALID UPTO",
          "PUCC VALID UP TO",
          "PUC VALID UPTO",
          "PUC VALID UP TO",
          "PUCC",
          "PUC"
        ]
      );

    if(foundPUCC){

      puccExpiry.value =
        foundPUCC;

    }


    /*
      PERMIT

      If Permit line is NOT present,
      permit field stays completely blank.
    */

    const foundPermit =
      findDateAfterKeyword(
        rawText,
        [
          "PERMIT VALID UPTO",
          "PERMIT VALID UP TO",
          "PERMIT UPTO",
          "PERMIT UP TO",
          "PERMIT"
        ]
      );

    if(foundPermit){

      permitExpiry.value =
        foundPermit;

    }


    showStatus(
      "OCR completed successfully.\n\n" +
      "Please check the extracted details before saving."
    );


  }catch(error){

    console.error(error);

    showStatus(
      "OCR Error:\n" +
      (error.message || error)
    );

  }


  readBtn.disabled = false;

  saveBtn.disabled = false;

}


/* =========================================================
   DATABASE DATE CONVERSION
   DD/MM/YYYY -> YYYY-MM-DD
========================================================= */

function convertToDatabaseDate(value){

  if(!value) return null;

  value =
    value.trim();


  /*
    Tax can be LTT
  */

  if(
    value.toUpperCase() === "LTT"
  ){

    return "LTT";

  }


  const m =
    value.match(
      /^(\d{2})\/(\d{2})\/(\d{4})$/
    );


  if(!m){

    return null;

  }


  return (
    m[3] +
    "-" +
    m[2] +
    "-" +
    m[1]
  );

}


/* =========================================================
   UPLOAD PHOTO TO STORAGE
========================================================= */

async function uploadPhoto(
  file,
  vehicleNo
){

  if(!file) return null;


  const safeVehicle =
    vehicleNo.replace(
      /[^A-Z0-9]/gi,
      ""
    );


  const fileName =
    safeVehicle +
    "_" +
    Date.now() +
    ".jpg";


  const filePath =
    fileName;


  const preparedFile =
    await prepareImage(file);


  const {
    error:uploadError
  } =
    await supabaseClient
      .storage
      .from("vehicle-photos")
      .upload(
        filePath,
        preparedFile,
        {
          upsert:false,
          contentType:
            file.type || "image/jpeg"
        }
      );


  if(uploadError){

    throw uploadError;

  }


  const {
    data
  } =
    supabaseClient
      .storage
      .from("vehicle-photos")
      .getPublicUrl(filePath);


  return {
    url:data.publicUrl,
    path:filePath
  };

}


/* =========================================================
   DELETE OLD PHOTO
========================================================= */

async function deleteOldPhoto(path){

  if(!path) return;


  try{

    const {
      error
    } =
      await supabaseClient
        .storage
        .from("vehicle-photos")
        .remove([path]);


    if(error){

      console.warn(
        "Old photo delete error:",
        error
      );

    }

  }catch(error){

    console.warn(
      "Old photo delete exception:",
      error
    );

  }

}


/* =========================================================
   SAVE VEHICLE
========================================================= */

async function saveVehicle(){

  const vNumber =
    vehicleNumber.value
      .trim()
      .toUpperCase();


  if(!vNumber){

    alert(
      "Vehicle Number is required."
    );

    return;

  }


  saveBtn.disabled = true;


  showStatus(
    "Saving vehicle..."
  );


  try{

    /*
      Check existing vehicle
    */

    const {
      data:existing,
      error:findError
    } =
      await supabaseClient
        .from("vehicles")
        .select("*")
        .eq(
          "vehicle_number",
          vNumber
        )
        .maybeSingle();


    if(findError){

      throw findError;

    }


    /*
      Prepare database values
    */

    const vehicleData = {

      vehicle_number:vNumber,

      registration_date:
        convertToDatabaseDate(
          registrationDate.value
        ),

      fitness_expiry:
        convertToDatabaseDate(
          fitnessExpiry.value
        ),

      insurance_expiry:
        convertToDatabaseDate(
          insuranceExpiry.value
        ),

      tax_expiry:
        convertToDatabaseDate(
          taxExpiry.value
        ),

      pucc_expiry:
        convertToDatabaseDate(
          puccExpiry.value
        ),

      permit_expiry:
        convertToDatabaseDate(
          permitExpiry.value
        )

    };


    /*
      PHOTO
    */

    const file =
      photoInput.files[0];


    let uploadedPhoto =
      null;


    if(file){

      uploadedPhoto =
        await uploadPhoto(
          file,
          vNumber
        );

    }


    /*
      EXISTING VEHICLE
    */

    if(existing){

      /*
        If new photo uploaded,
        delete old photo first.
      */

      if(uploadedPhoto){

        if(existing.photo_path){

          await deleteOldPhoto(
            existing.photo_path
          );

        }

        vehicleData.photo_url =
          uploadedPhoto.url;

        vehicleData.photo_path =
          uploadedPhoto.path;

      }


      const {
        error:updateError
      } =
        await supabaseClient
          .from("vehicles")
          .update(vehicleData)
          .eq(
            "id",
            existing.id
          );


      if(updateError){

        /*
          If database update fails,
          remove newly uploaded photo
          so storage doesn't remain unused.
        */

        if(uploadedPhoto){

          await deleteOldPhoto(
            uploadedPhoto.path
          );

        }

        throw updateError;

      }


      showStatus(
        "Vehicle updated successfully."
      );


      alert(
        "Vehicle updated successfully."
      );


    }else{

      /*
        NEW VEHICLE
      */

      if(uploadedPhoto){

        vehicleData.photo_url =
          uploadedPhoto.url;

        vehicleData.photo_path =
          uploadedPhoto.path;

      }


      const {
        error:insertError
      } =
        await supabaseClient
          .from("vehicles")
          .insert([
            vehicleData
          ]);


      if(insertError){

        /*
          If insert fails,
          delete newly uploaded photo.
        */

        if(uploadedPhoto){

          await deleteOldPhoto(
            uploadedPhoto.path
          );

        }

        throw insertError;

      }


      showStatus(
        "Vehicle saved successfully."
      );


      alert(
        "Vehicle saved successfully."
      );

    }


  }catch(error){

    console.error(error);

    showStatus(
      "Save Error:\n" +
      (error.message || error)
    );


    alert(
      "Error saving vehicle:\n" +
      (error.message || error)
    );

  }


  saveBtn.disabled = false;

}
