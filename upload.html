/* =========================================
   NORMALIZE OCR TEXT
========================================= */

function normalizeOCRText(text){

  return String(text || "")
    .replace(/\r/g,"")
    .replace(/[“”]/g,'"')
    .replace(/[‘’]/g,"'")
    .replace(/[ \t]+/g," ")
    .replace(/\n{2,}/g,"\n")
    .trim();

}


function getOCRLines(text){

  return normalizeOCRText(text)
    .split("\n")
    .map(function(line){
      return line.trim();
    })
    .filter(Boolean);

}


/* =========================================
   DATE PARSER
========================================= */

function toISODate(
  day,
  month,
  year
){

  day =
    String(day)
      .replace(/[^\d]/g,"")
      .padStart(2,"0");

  month =
    String(month)
      .replace(/[^\d]/g,"")
      .padStart(2,"0");

  year =
    String(year)
      .replace(/[^\d]/g,"");


  if(
    day.length !== 2 ||
    month.length !== 2 ||
    year.length !== 4
  ){

    return "";

  }


  const d =
    Number(day);

  const m =
    Number(month);

  const y =
    Number(year);


  const dt =
    new Date(
      y,
      m - 1,
      d
    );


  if(
    dt.getFullYear() !== y ||
    dt.getMonth() !== m - 1 ||
    dt.getDate() !== d
  ){

    return "";

  }


  return (
    y +
    "-" +
    month +
    "-" +
    day
  );

}


function parseDateValue(value){

  if(!value){
    return "";
  }


  const text =
    String(value)
      .replace(/,/g," ")
      .replace(/\s+/g," ")
      .trim();


  let m;


  /* =====================================
     DD-MMM-YYYY
  ===================================== */

  m =
    text.match(
      /\b(\d{1,2})[-\/.\s](JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|SEPT|OCT|NOV|DEC)[A-Z]*[-\/.\s](\d{4})\b/i
    );


  if(m){

    const months = {

      JAN:1,
      FEB:2,
      MAR:3,
      APR:4,
      MAY:5,
      JUN:6,
      JUL:7,
      AUG:8,
      SEP:9,
      SEPT:9,
      OCT:10,
      NOV:11,
      DEC:12

    };


    return toISODate(
      m[1],
      months[
        m[2]
          .toUpperCase()
          .substring(0,4) === "SEPT"
          ? "SEPT"
          : m[2]
            .toUpperCase()
            .substring(0,3)
      ],
      m[3]
    );

  }


  /* =====================================
     DD-MM-YYYY / DD/MM/YYYY
  ===================================== */

  m =
    text.match(
      /\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})\b/
    );


  if(m){

    return toISODate(
      m[1],
      m[2],
      m[3]
    );

  }


  /* =====================================
     YYYY-MM-DD
  ===================================== */

  m =
    text.match(
      /\b(19\d{2}|20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/
    );


  if(m){

    return toISODate(
      m[3],
      m[2],
      m[1]
    );

  }


  return "";

}


/* =========================================
   STRICT DATE AFTER LABEL
========================================= */

function findStrictDateAfterLabel(
  lines,
  labels,
  nextLines = 3
){

  const upperLines =
    lines.map(function(line){

      return line
        .toUpperCase()
        .replace(/\s+/g," ")
        .trim();

    });


  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    const current =
      upperLines[i];


    let matched =
      false;


    for(
      const label of labels
    ){

      if(
        current.includes(label)
      ){

        matched = true;
        break;

      }

    }


    if(!matched){
      continue;
    }


    /* Same line */

    let date =
      parseDateValue(
        lines[i]
      );


    if(date){
      return date;
    }


    /* Only next 1-3 lines */

    for(
      let j = 1;
      j <= nextLines;
      j++
    ){

      if(
        i + j >= lines.length
      ){

        break;

      }


      date =
        parseDateValue(
          lines[i+j]
        );


      if(date){

        return date;

      }

    }

  }


  return "";

}


/* =========================================
   REGISTRATION DATE
========================================= */

function extractRegistrationDate(lines){

  return findStrictDateAfterLabel(
    lines,
    [
      "REGISTRATION DATE",
      "REGISTRATION DT",
      "REGN DATE",
      "REGN DT",
      "REG DATE"
    ],
    3
  );

}


/* =========================================
   FITNESS DATE
========================================= */

function extractFitnessDate(lines){

  return findStrictDateAfterLabel(
    lines,
    [
      "FITNESS VALID UPTO",
      "FITNESS VALID UP TO",
      "FITNESS VALID",
      "FITNESS/REGN",
      "FITNESS / REGN",
      "FITNESS EXPIRY DATE",
      "FITNESS EXPIRY"
    ],
    3
  );

}


/* =========================================
   INSURANCE DATE
========================================= */

function extractInsuranceDate(lines){

  let result;


  /* New VAHAN format */

  result =
    findStrictDateAfterLabel(
      lines,
      [
        "INSURANCE VALID UPTO",
        "INSURANCE VALID UP TO",
        "INSURANCE VALID",
        "INSURANCE EXPIRY DATE",
        "INSURANCE EXPIRY"
      ],
      3
    );


  if(result){
    return result;
  }


  /* =====================================
     Old VAHAN format

     Insurance Details
     Company:
     ...
     Validity:
     24-Nov-2029
  ===================================== */

  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    if(
      lines[i]
        .toUpperCase()
        .includes(
          "INSURANCE DETAILS"
        )
    ){

      for(
        let j = i + 1;
        j < Math.min(
          i + 15,
          lines.length
        );
        j++
      ){

        const upper =
          lines[j]
            .toUpperCase()
            .trim();


        if(
          upper === "VALIDITY:" ||
          upper.startsWith("VALIDITY:")
        ){

          result =
            parseDateValue(
              lines[j]
            );


          if(result){
            return result;
          }


          for(
            let k = j + 1;
            k <= j + 3 &&
            k < lines.length;
            k++
          ){

            result =
              parseDateValue(
                lines[k]
              );


            if(result){
              return result;
            }

          }

        }

      }

    }

  }


  return "";

}


/* =========================================
   TAX
========================================= */

function extractTax(lines){

  const labels = [

    "TAX VALID UPTO",
    "TAX VALID UP TO",
    "TAX VALID",
    "MV TAX",
    "ROAD TAX",
    "TAX EXPIRY"

  ];


  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    const upper =
      lines[i]
        .toUpperCase()
        .replace(/\s+/g," ");


    let matched =
      false;


    for(
      const label of labels
    ){

      if(
        upper.includes(label)
      ){

        matched = true;
        break;

      }

    }


    if(!matched){
      continue;
    }


    /* LTT */

    if(
      /\bL\s*[- ]?\s*T\s*[- ]?\s*T\b/i
        .test(lines[i]) ||
      /\bLTT\b/i.test(lines[i]) ||
      /\bL7T\b/i.test(lines[i]) ||
      /\bLT7\b/i.test(lines[i])
    ){

      return "LTT";

    }


    /* Same line date */

    let date =
      parseDateValue(
        lines[i]
      );


    if(date){
      return date;
    }


    /* Next 3 lines */

    for(
      let j = 1;
      j <= 3;
      j++
    ){

      if(
        i + j >= lines.length
      ){
        break;
      }


      const next =
        lines[i+j];


      if(
        /\bL\s*[- ]?\s*T\s*[- ]?\s*T\b/i
          .test(next) ||
        /\bLTT\b/i.test(next) ||
        /\bL7T\b/i.test(next) ||
        /\bLT7\b/i.test(next)
      ){

        return "LTT";

      }


      date =
        parseDateValue(
          next

}

/* =========================================
   VEHICLE CLASS
========================================= */

function findVehicleClass(text){

  const upper =
    text.toUpperCase();


  /* 2 Wheeler */

  if(
    /\b2WN\b/.test(upper) ||
    upper.includes("M-CYCLE") ||
    upper.includes("MCYCLE") ||
    upper.includes("MOTORCYCLE") ||
    upper.includes("SCOOTER")
  ){

    return "2WN";

  }


  /* 3 Wheeler */

  if(
    /\b3WT\b/.test(upper) ||
    upper.includes("THREE WHEELER") ||
    upper.includes("AUTO RICKSHAW")
  ){

    return "3WT";

  }


  /* MGV */

  if(
    /\bMGV\b/.test(upper) ||
    upper.includes("MEDIUM GOODS")
  ){

    return "MGV";

  }


  /* HGV */

  if(
    /\bHGV\b/.test(upper) ||
    upper.includes("HEAVY GOODS VEHICLE")
  ){

    return "HGV";

  }


  /* LGV */

  if(
    /\bLGV\b/.test(upper) ||
    upper.includes("LIGHT GOODS VEHICLE")
  ){

    return "LGV";

  }


  /* LMV */

  if(
    /\bLMV\b/.test(upper)
  ){

    return "LMV";

  }


  /* LPV */

  if(
    /\bLPV\b/.test(upper)
  ){

    return "LPV";

  }


  /* HPV */

  if(
    /\bHPV\b/.test(upper) ||
    upper.includes("HEAVY PASSENGER") ||
    upper.includes("BUS")
  ){

    return "HPV";

  }


  /* OTH */

  if(
    /\bOTH\b/.test(upper) ||
    upper.includes(
      "CONSTRUCTION EQUIPMENT VEHICLE"
    )
  ){

    return "OTH";

  }


  return "";

}


/* =========================================
   VEHICLE NUMBER - CHARACTER CORRECTION
========================================= */

function correctRTOCharacters(value){

  return String(value || "")
    .toUpperCase()
    .replace(/O/g,"0")
    .replace(/Q/g,"0")
    .replace(/D/g,"0")
    .replace(/I/g,"1")
    .replace(/L/g,"1")
    .replace(/Z/g,"2")
    .replace(/S/g,"5")
    .replace(/B/g,"8")
    .replace(/G/g,"6")
    .replace(/T/g,"7")
    .replace(/[^0-9]/g,"");

}


function correctSeriesCharacters(value){

  return String(value || "")
    .toUpperCase()
    .replace(/5/g,"S")
    .replace(/0/g,"O")
    .replace(/1/g,"I")
    .replace(/2/g,"Z")
    .replace(/8/g,"B")
    .replace(/6/g,"G")
    .replace(/7/g,"T")
    .replace(/[^A-Z]/g,"");

}


function correctFinalNumberCharacters(value){

  return String(value || "")
    .toUpperCase()
    .replace(/O/g,"0")
    .replace(/Q/g,"0")
    .replace(/D/g,"0")
    .replace(/I/g,"1")
    .replace(/L/g,"1")
    .replace(/Z/g,"2")
    .replace(/S/g,"5")
    .replace(/B/g,"8")
    .replace(/G/g,"6")
    .replace(/T/g,"7")
    .replace(/[^0-9]/g,"");

}


/* =========================================
   STRICT VEHICLE NUMBER PARSER

   IMPORTANT:

   GJ3451419
   = GJ + 34 + 5 + 1419
   = GJ34S1419

   GJ02VVG6630
   = GJ + 02 + VVG + 6630
   = GJ02VVG6630
========================================= */

function parseVehicleNumber(raw){

  if(!raw){
    return "";
  }


  let s =
    String(raw)
      .toUpperCase()
      .replace(/[^A-Z0-9]/g,"");


  if(s.length < 8){
    return "";
  }


  /* State */

  let state =
    s.substring(0,2);


  if(
    !/^[A-Z]{2}$/.test(state)
  ){

    return "";

  }


  /* RTO */

  let rtoRaw =
    s.substring(2,4);


  let rto =
    correctRTOCharacters(
      rtoRaw
    );


  if(
    rto.length !== 2
  ){

    return "";

  }


  const rest =
    s.substring(4);


  /*
    VERY IMPORTANT:

    Final registration number is normally
    4 digits.

    So first try last 4 characters
    as the number.

    This fixes:

    GJ3451419
    rest = 5 + 1419

    and

    GJ02VVG6630
    rest = VVG + 6630
  */

  if(rest.length >= 5){

    const last4 =
      rest.substring(
        rest.length - 4
      );


    const seriesRaw =
      rest.substring(
        0,
        rest.length - 4
      );


    const finalNumber =
      correctFinalNumberCharacters(
        last4
      );


    const series =
      correctSeriesCharacters(
        seriesRaw
      );


    if(
      finalNumber.length === 4 &&
      series.length >= 1 &&
      series.length <= 3
    ){

      return (
        state +
        rto +
        series +
        finalNumber
      );

    }

  }


  /*
    Fallback:

    Last 3 digits
  */

  if(rest.length >= 4){

    const last3 =
      rest.substring(
        rest.length - 3
      );


    const seriesRaw =
      rest.substring(
        0,
        rest.length - 3
      );


    const finalNumber =
      correctFinalNumberCharacters(
        last3
      );


    const series =
      correctSeriesCharacters(
        seriesRaw
      );


    if(
      finalNumber.length === 3 &&
      series.length >= 1 &&
      series.length <= 3
    ){

      return (
        state +
        rto +
        series +
        finalNumber
      );

    }

  }


  return "";

}


/* =========================================
   VEHICLE NUMBER CANDIDATES
========================================= */

function getVehicleNumberCandidates(
  text
){

  const candidates = [];

  const lines =
    getOCRLines(text);


  /*
    First priority:
    Vehicle Number labelની આસપાસ
  */

  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    const upper =
      lines[i]
        .toUpperCase();


    if(
      upper.includes(
        "VEHICLE NUMBER"
      )
    ){

      /*
        Same line + next 2 lines
      */

      for(
        let j = 0;
        j <= 2;
        j++
      ){

        if(
          i + j >= lines.length
        ){
          break;
        }


        const line =
          lines[i+j];


        const cleaned =
          line
            .toUpperCase()
            .replace(
              /[^A-Z0-9]/g,
              " "
            );


        const words =
          cleaned
            .split(/\s+/)
            .filter(Boolean);


        for(
          const word of words
        ){

          if(
            word.length >= 7 &&
            word.length <= 12
          ){

            const parsed =
              parseVehicleNumber(
                word
              );


            if(parsed){

              candidates.push({
                value:parsed,
                priority:100
              });

            }

          }

        }


        /*
          Spaces વચ્ચે split થયેલો number
          join કરવાનો પ્રયાસ
        */

        const joined =
          cleaned.replace(
            /\s/g,
            ""
          );


        if(
          joined.length >= 8 &&
          joined.length <= 12
        ){

          const parsed =
            parseVehicleNumber(
              joined
            );


          if(parsed){

            candidates.push({
              value:parsed,
              priority:110
            });

          }

        }

      }

    }

  }


  /*
    Entire OCR fallback
  */

  for(
    const line of lines
  ){

    const cleaned =
      line
        .toUpperCase()
        .replace(
          /[^A-Z0-9]/g,
          " "
        );


    const words =
      cleaned
        .split(/\s+/)
        .filter(Boolean);


    for(
      const word of words
    ){

      if(
        word.length >= 8 &&
        word.length <= 12
      ){

        const parsed =
          parseVehicleNumber(
            word
          );


        if(parsed){

          candidates.push({
            value:parsed,
            priority:50
          });

        }

      }

    }

  }


  return candidates;

}


/* =========================================
   FINAL VEHICLE NUMBER
========================================= */

function extractVehicleNumber(
  text
){

  const candidates =
    getVehicleNumberCandidates(
      text
    );


  if(!candidates.length){
    return "";
  }


  /*
    Count same results
  */

  const map = {};


  candidates.forEach(
    function(item){

      if(
        !map[item.value]
      ){

        map[item.value] = {
          count:0,
          priority:0
        };

      }


      map[item.value].count++;

      map[item.value].priority =
        Math.max(
          map[item.value].priority,
          item.priority
        );

    }
  );


  let best = "";

  let bestScore = -1;


  Object.keys(map)
    .forEach(
      function(value){

        const item =
          map[value];


        /*
          Same result appearing
          in multiple OCR passes
          gets higher score.
        */

        const score =
          item.count * 100 +
          item.priority;


        if(
          score > bestScore
        ){

          bestScore =
            score;

          best =
            value;

        }

      }
    );


  return best;

}

/* =========================================
   ENHANCED IMAGE
========================================= */

function createEnhancedImage(
  file
){

  return new Promise(
    function(
      resolve,
      reject
    ){

      const img =
        new Image();

      const reader =
        new FileReader();


      reader.onload =
        function(e){

          img.onload =
            function(){

              const canvas =
                document.createElement(
                  "canvas"
                );


              const scale =
                Math.max(
                  1,
                  1800 / img.width
                );


              canvas.width =
                Math.round(
                  img.width * scale
                );


              canvas.height =
                Math.round(
                  img.height * scale
                );


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              const imageData =
                ctx.getImageData(
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );


              const data =
                imageData.data;


              for(
                let i = 0;
                i < data.length;
                i += 4
              ){

                const gray =
                  (
                    data[i] * 0.299 +
                    data[i+1] * 0.587 +
                    data[i+2] * 0.114
                  );


                let value =
                  (gray - 128) * 1.5 + 128;


                value =
                  Math.max(
                    0,
                    Math.min(
                      255,
                      value
                    )
                  );


                data[i] =
                  value;

                data[i+1] =
                  value;

                data[i+2] =
                  value;

              }


              ctx.putImageData(
                imageData,
                0,
                0
              );


              canvas.toBlob(
                function(blob){

                  if(!blob){

                    reject(
                      new Error(
                        "Image enhancement failed"
                      )
                    );

                    return;

                  }


                  resolve(
                    blob
                  );

                },
                "image/jpeg",
                0.95
              );

            };


          img.onerror =
            reject;


          img.src =
            e.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}

/* =========================================
   UPLOAD PHOTO
========================================= */

async function uploadPhoto(
  vehicleNo,
  file
){

  if(!file){
    return null;
  }


  const safeNumber =
    cleanVehicleNumber(
      vehicleNo
    );


  const fileName =
    safeNumber +
    "_" +
    Date.now() +
    ".jpg";


  const uploadFile =
    file.type ===
    "image/jpeg"
      ? file
      : await convertImageToJPG(
          file
        );


  const {
    error
  } =
    await supabaseClient
      .storage
      .from(
        STORAGE_BUCKET
      )
      .upload(
        fileName,
        uploadFile,
        {
          contentType:
            "image/jpeg",
          upsert:
            false
        }
      );


  if(error){
    throw error;
  }


  const {
    data
  } =
    supabaseClient
      .storage
      .from(
        STORAGE_BUCKET
      )
      .getPublicUrl(
        fileName
      );


  return {

    path:
      fileName,

    url:
      data.publicUrl

  };

}


/* =========================================
   CONVERT IMAGE JPG
========================================= */

function convertImageToJPG(
  file
){

  return new Promise(
    function(
      resolve,
      reject
    ){

      const img =
        new Image();

      const reader =
        new FileReader();


      reader.onload =
        function(e){

          img.onload =
            function(){

              const canvas =
                document.createElement(
                  "canvas"
                );


              const maxWidth =
                2000;


              const scale =
                Math.min(
                  1,
                  maxWidth /
                  img.width
                );


              canvas.width =
                Math.round(
                  img.width * scale
                );


              canvas.height =
                Math.round(
                  img.height * scale
                );


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              canvas.toBlob(
                function(blob){

                  resolve(
                    blob
                  );

                },
                "image/jpeg",
                0.9
              );

            };


          img.onerror =
            reject;


          img.src =
            e.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}

      /* =====================================
         UPDATE EXISTING
      ===================================== */

      if(existing){

        const {
          error
        } =
          await supabaseClient
            .from("vehicles")
            .update(
              vehicleData
            )
            .eq(
              "id",
              existing.id
            );


        if(error){

          if(
            newPhotoUploaded &&
            photoPath &&
            photoPath !==
            existing.photo_path
          ){

            await deleteOldPhoto(
              photoPath
            );

          }

          throw error;

        }


        /* Delete old photo */

        if(
          newPhotoUploaded &&
          existing.photo_path &&
          existing.photo_path !==
          photoPath
        ){

          await deleteOldPhoto(
            existing.photo_path
          );

        }


        showStatus(
          "Vehicle updated successfully. Old photo replaced.",
          "success"
        );

      }

      else{

        /* ===================================
           INSERT NEW
        =================================== */

        const {
          error
        } =
          await supabaseClient
            .from("vehicles")
            .insert(
              vehicleData
            );


        if(error){

          if(
            newPhotoUploaded &&
            photoPath
          ){

            await deleteOldPhoto(
              photoPath
            );

          }

          throw error;

        }


        showStatus(
          "Vehicle saved successfully.",
          "success"
        );

      }


      selectedFile =
        null;

      photoInput.value =
        "";

      oldPhotoPath =
        photoPath || "";


    }catch(error){

      console.error(
        "SAVE ERROR:",
        error
      );


      showStatus(
        "Save failed: " +
        (
          error.message ||
          "Unknown error"
        ),
        "error"
      );

    }


    saveBtn.disabled =
      false;

    readBtn.disabled =
      false;

  }
);


/* =========================================
   DASHBOARD
========================================= */

dashboardBtn.addEventListener(
  "click",
  function(){

    window.location.href =
      "index.html";

  }
);


/* =========================================
   LOAD EDIT VEHICLE
========================================= */

async function loadEditVehicle(){

  if(!editId){
    return;
  }


  try{

    showStatus(
      "Loading vehicle...",
      "warning"
    );


    const {
      data,
      error
    } =
      await supabaseClient
        .from("vehicles")
        .select("*")
        .eq(
          "id",
          editId
        )
        .single();


    if(error){
      throw error;
    }


    if(!data){

      throw new Error(
        "Vehicle not found."
      );

    }


    /* Customer */

    customerName.value =
      data.customer_name || "";


    mobile.value =
      data.mobile ||
      data.customer_mobile ||
      "";


    /* Vehicle */

    vehicleNumber.value =
      data.vehicle_number || "";


    vehicleClass.value =
      data.vehicle_class || "";


    showClassPhoto(
      vehicleClass.value
    );


    registrationDate.value =
      data.registration_date &&
      data.registration_date !==
      "LTT"
        ? data.registration_date
        : "";


    fitnessExpiry.value =
      data.fitness_expiry &&
      data.fitness_expiry !==
      "LTT"
        ? data.fitness_expiry
        : "";


    insuranceExpiry.value =
      data.insurance_expiry &&
      data.insurance_expiry !==
      "LTT"
        ? data.insurance_expiry
        : "";


    taxExpiry.value =
      data.tax_expiry || "";


    puccExpiry.value =
      data.pucc_expiry &&
      data.pucc_expiry !==
      "LTT"
        ? data.pucc_expiry
        : "";


    permitExpiry.value =
      data.permit_expiry &&
      data.permit_expiry !==
      "LTT"
        ? data.permit_expiry
        : "";


    ocrText.value =
      data.ocr_text || "";


    oldPhotoPath =
      data.photo_path || "";


    if(data.photo_url){

      photoPreview.src =
        data.photo_url;

      photoPreview.style.display =
        "block";

    }


    showStatus(
      "Vehicle loaded for editing.",
      "success"
    );


  }catch(error){

    console.error(
      error
    );


    showStatus(
      "Vehicle load failed: " +
      (
        error.message ||
        "Unknown error"
      ),
      "error"
    );

  }

}


/* =========================================
   PAGE LOAD
========================================= */

loadEditVehicle();

</script>
