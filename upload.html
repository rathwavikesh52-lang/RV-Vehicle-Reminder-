<script>

/* =========================================================
   CLEAR OLD OCR VALUES
   IMPORTANT: Prevent stale values
========================================================= */

function clearAllFields(){

  vehicleNumber.value = "";

  registrationDate.value = "";

  fitnessExpiry.value = "";

  insuranceExpiry.value = "";

  taxExpiry.value = "";

/* =========================================================
   NORMALIZE OCR TEXT
========================================================= */

function normalizeText(text){

  if(!text) return "";

  return text
    .replace(/\r/g,"\n")
    .replace(/[|]/g,"I")
    .replace(/[ \t]+/g," ")
    .replace(/\n\s*\n+/g,"\n")
    .trim();
}


/* =========================================================
   VEHICLE NUMBER CLEAN
========================================================= */

function cleanVehicleNumberOCR(value){

  if(!value) return "";

  let v =
    value
      .toUpperCase()
      .replace(/[^A-Z0-9]/g,"");


  /*
     Common OCR mistakes only near GJ prefix
  */

  if(v.startsWith("GJO")){

    v =
      "GJ0" +
      v.substring(3);

  }


  if(v.startsWith("GIO")){

    v =
      "GJ0" +
      v.substring(3);

  }


  if(v.startsWith("GJ") && v.length >= 4){

    let chars =
      v.split("");

    const corrections = {

      O:"0",
      Q:"0",
      D:"0",
      I:"1",
      L:"1",
      S:"5",
      B:"8",
      Z:"2"

    };


    /*
       Only correct Gujarat RTO digits
       positions 2 and 3
    */

    for(let i=2;i<4;i++){

      if(corrections[chars[i]]){

        chars[i] =
          corrections[chars[i]];

      }

    }

    v =
      chars.join("");

  }

  return v;
}


/* =========================================================
   VEHICLE FORMAT
========================================================= */

function isVehicleNumberFormat(v){

  if(!v) return false;

  return (

    /^GJ\d{2}[A-Z]\d{4}$/.test(v) ||

    /^GJ\d{2}[A-Z]\d{5}$/.test(v) ||

    /^GJ\d{2}[A-Z]{2}\d{4}$/.test(v) ||

    /^GJ\d{2}[A-Z]{2}\d{5}$/.test(v) ||

    /^GJ\d{2}[A-Z]{3}\d{3,5}$/.test(v)

  );

}


/* =========================================================
   SMART VEHICLE CORRECTION
========================================================= */

function smartVehicleCorrection(candidate){

  if(!candidate) return "";

  let v =
    cleanVehicleNumberOCR(candidate);


  /*
     Example OCR:
     GJ06AZ5038
     Sometimes Z appears as an extra separator.
  */

  if(/^GJ\d{2}[A-Z]Z\d{4}$/.test(v)){

    v =
      v.replace(
        /^GJ(\d{2})([A-Z])Z(\d{4})$/,
        "GJ$1$2$3"
      );

  }

  return v;
}


/* =========================================================
   EXTRACT VEHICLE CANDIDATES
========================================================= */

function extractVehicleCandidates(text){

  if(!text) return [];

  let t =
    normalizeText(text)
      .toUpperCase();

  let candidates = [];


  const patterns = [

    /GJ[\s\-]?\d{2}[\s\-]?[A-Z0-9]{1,3}[\s\-]?\d{3,5}/g,

    /GJ[A-Z0-9]{8,11}/g

  ];


  for(const pattern of patterns){

    const matches =
      t.match(pattern);

    if(matches){

      matches.forEach(item=>{

        const cleaned =
          smartVehicleCorrection(item);

        if(cleaned){

          candidates.push(cleaned);

        }

      });

    }

  }


  /*
     Compact OCR pass
  */

  const compact =
    t.replace(/[^A-Z0-9]/g,"");


  const compactMatches =
    compact.match(/GJ[A-Z0-9]{7,10}/g);


  if(compactMatches){

    compactMatches.forEach(item=>{

      const cleaned =
        smartVehicleCorrection(item);

      if(cleaned){

        candidates.push(cleaned);

      }

    });

  }


  return [
    ...new Set(candidates)
  ];

}


/* =========================================================
   CHOOSE BEST VEHICLE NUMBER
========================================================= */

function chooseBestVehicleNumber(candidates){

  if(!candidates.length){

    return "";

  }

  const scored = [];


  for(const candidate of candidates){

    const value =
      smartVehicleCorrection(candidate);

    let score = 0;


    if(isVehicleNumberFormat(value)){

      score += 100;

    }


    if(/^GJ\d{2}/.test(value)){

      score += 50;

    }


    if(value.length === 10){

      score += 20;

    }


    if(value.length === 11){

      score += 15;

    }


    if(/^GJ\d{2}[A-Z]/.test(value)){

      score += 20;

    }


    scored.push({

      value:value,
      score:score

    });

  }


  scored.sort(
    (a,b)=>b.score-a.score
  );


  return scored.length
    ? scored[0].value
    : "";

}


/* =========================================================
   HIGH ACCURACY VEHICLE OCR
========================================================= */

async function highAccuracyVehicleOCR(file){

  let allText = "";

  /*
     Pass 1
  */

  statusText.innerText =
    "Vehicle OCR pass 1/3...";

  const result1 =
    await Tesseract.recognize(
      file,
      "eng",
      {

        logger: m => {

          if(m.status === "recognizing text"){

            const p =
              Math.round(
                (m.progress || 0) * 100
              );

            progressFill.style.width =
              Math.min(
                33,
                Math.max(0,p/3)
              ) + "%";

          }

        }

      }
    );


  allText +=
    "\n" +
    result1.data.text;


  /*
     Pass 2
  */

  statusText.innerText =
    "Vehicle OCR pass 2/3...";


  const result2 =
    await Tesseract.recognize(
      file,
      "eng"
    );


  allText +=
    "\n" +
    result2.data.text;


  /*
     Pass 3
  */

  statusText.innerText =
    "Vehicle OCR pass 3/3...";


  const result3 =
    await Tesseract.recognize(
      file,
      "eng"
    );


  allText +=
    "\n" +
    result3.data.text;


  progressFill.style.width =
    "35%";


  return allText;

}


/* =========================================================
   DATE PARSER
========================================================= */

function parseDateValue(value){

  if(!value) return "";

  let v =
    value.trim()
      .replace(/[.,]/g,"-")
      .replace(/\//g,"-");


  /*
     DD-MMM-YYYY
     03-Oct-2026
  */

  const monthNames = {

    JAN:"01",
    FEB:"02",
    MAR:"03",
    APR:"04",
    MAY:"05",
    JUN:"06",
    JUL:"07",
    AUG:"08",
    SEP:"09",
    OCT:"10",
    NOV:"11",
    DEC:"12"

  };


  let m =
    v.match(
      /^(\d{1,2})[- ]([A-Z]{3})[- ](\d{4})$/i
    );


  if(m){

    const day =
      m[1].padStart(2,"0");

    const mon =
      monthNames[m[2].toUpperCase()];

    const year =
      m[3];

    if(mon){

      return `${day}/${mon}/${year}`;

    }

  }


  /*
     DD-MM-YYYY
  */

  m =
    v.match(
      /^(\d{1,2})-(\d{1,2})-(\d{4})$/
    );


  if(m){

    return (

      m[1].padStart(2,"0") +
      "/" +
      m[2].padStart(2,"0") +
      "/" +
      m[3]

    );

  }


  return "";

}


/* =========================================================
   FIND DATE
========================================================= */

function findDate(text){

  if(!text) return "";

  let t =
    text.toUpperCase();


  /*
     05-May-2023
     05 May 2023
     05/05/2023
     05-05-2023
  */

  const patterns = [

    /\b\d{1,2}[-\/ ](?:JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[A-Z]*[-\/ ]\d{4}\b/i,

    /\b\d{1,2}[-\/]\d{1,2}[-\/]\d{4}\b/,

    /\b\d{1,2}[- ](?:JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[- ]\d{4}\b/i

  ];


  for(const pattern of patterns){

    const match =
      t.match(pattern);

    if(match){

      const parsed =
        parseDateValue(match[0]);

      if(parsed){

        return parsed;

      }

    }

  }


  return "";

}


/* =========================================================
   STRICT FIELD DATE
========================================================= */

function findFieldDate(text, labels){

  if(!text) return "";

  const lines =
    text
      .split(/\n/)
      .map(x=>x.trim())
      .filter(Boolean);


  for(let i=0;i<lines.length;i++){

    const line =
      lines[i];

    const upper =
      line.toUpperCase();


    let matched = false;


    for(const label of labels){

      if(upper.includes(label)){

        matched = true;
        break;

      }

    }


    if(!matched) continue;


    /*
       Same line date
    */

    const sameLineDate =
      findDate(line);


    if(sameLineDate){

      return sameLineDate;

    }


    /*
       Immediate next line only
    */

    if(i + 1 < lines.length){

      const next =
        lines[i + 1];


      /*
         Do not steal another field's date
      */

      const nextUpper =
        next.toUpperCase();


      if(

        /INSURANCE|PUCC|PUC|PERMIT|FITNESS|TAX|REGISTRATION DATE/
        .test(nextUpper)

      ){

        return "";

      }


      const nextDate =
        findDate(next);


      if(nextDate){

        return nextDate;

      }

    }


    return "";

  }


  return "";

}


/* =========================================================
   REGISTRATION DATE
========================================================= */

function findRegistrationDate(text){

}

/* =========================================================
   STRICT TAX EXTRACTION
   VERY IMPORTANT
========================================================= */

function findTax(text){

  if(!text) return "";

  const lines =
    text
      .split(/\n/)
      .map(x=>x.trim())
      .filter(Boolean);


  for(let i=0;i<lines.length;i++){

    const line =
      lines[i];

    const upper =
      line.toUpperCase();


    /*
       ONLY TAX LABEL
    */

    if(!(

      upper.includes("TAX VALID UPTO") ||

      upper.includes("TAX VALID UP TO") ||

      upper.includes("TAX VALID") ||

      upper.includes("TAX UPTO") ||

      upper.includes("TAX UP TO")

    )){

      continue;

    }


    /*
       RULE 1:
       Tax = LTT
    */

    if(/\bLTT\b/.test(upper)){

      return "LTT";

    }


    /*
       OCR mistakes for LTT
    */

    if(
      /\b(L7T|LT7|LIT|LII|L1T)\b/.test(upper)
    ){

      return "LTT";

    }


    /*
       Check ONLY immediate next line
    */

    if(i + 1 < lines.length){

      const next =
        lines[i + 1];

      const nextUpper =
        next.toUpperCase();


      /*
         Next line LTT
      */

      if(/\bLTT\b/.test(nextUpper)){

        return "LTT";

      }


      /*
         OCR LTT
      */

      if(
        /\b(L7T|LT7|LIT|LII|L1T)\b/.test(nextUpper)
      ){

        return "LTT";

      }

    }


    /*
       Rule 2:
       Tax date must come ONLY from
       the TAX line itself.
    */

    const sameLineDate =
      findDate(line);


    if(sameLineDate){

      return sameLineDate;

    }


    /*
       Check immediate next line for date,
       BUT NEVER cross into another field.
    */

    if(i + 1 < lines.length){

      const next =
        lines[i + 1];

      const nextUpper =
        next.toUpperCase();


      /*
         If next line belongs to another field,
         Tax must remain blank.
      */

      if(

        /INSURANCE|PUCC|PUC|PERMIT|FITNESS|REGISTRATION DATE|TAX/
        .test(nextUpper)

      ){

        return "";

      }


      const nextDate =
        findDate(next);


      if(nextDate){

        return nextDate;

      }

    }


    /*
       Tax label exists but no tax value
    */

    return "";

  }


  /*
     No Tax field found
  */

  return "";

}


/* =========================================================
   VEHICLE NUMBER DIRECT EXTRACTION
========================================================= */

function findVehicleNumber(text){

  const candidates =
    extractVehicleCandidates(text);


  return chooseBestVehicleNumber(
    candidates
  );

}


/* =========================================================
   READ PHOTO
========================================================= */

async function readPhoto(){

  if(!selectedFile){

    showError(
      "Please select a vehicle photo first."
    );

    return;

  }


  /*
     CRITICAL:
     Clear old values BEFORE OCR
  */

  clearAllFields();


  readBtn.disabled = true;

  progressBox.style.display =
    "block";

  progressFill.style.width =
    "0%";


  try{

    statusText.innerText =
      "Starting OCR...";


    const rawText =
      await highAccuracyVehicleOCR(
        selectedFile
      );


    /*
       Normalize and show OCR
    */

    const normalized =
      normalizeText(rawText);


    ocrText.value =
      normalized;


    progressFill.style.width =
      "70%";


    statusText.innerText =
      "Extracting vehicle details...";


    /*
       VEHICLE NUMBER
    */

    const vNumber =
      findVehicleNumber(normalized);


    if(vNumber){

      vehicleNumber.value =
        vNumber;

    }


    /*
       REGISTRATION
    */

    const reg =
      findRegistrationDate(
        normalized
      );


    if(reg){

      registrationDate.value =
        reg;

    }


    /*
       FITNESS
    */

    const fitness =
      findFitness(normalized);


    if(fitness){

      fitnessExpiry.value =
        fitness;

    }


    /*
       INSURANCE
    */

    const insurance =
      findInsurance(normalized);


    if(insurance){

      insuranceExpiry.value =
        insurance;

    }


    /*
       TAX
       STRICT
    */

    const tax =
      findTax(normalized);


    if(tax){

      taxExpiry.value =
        tax;

    }else{

      /*
         NEVER keep old Tax
      */

      taxExpiry.value =
        "";

    }


    /*
       PUCC
    */

    const pucc =
      findPUCC(normalized);


    if(pucc){

      puccExpiry.value =
        pucc;

    }


    /*
       PERMIT
    */

    const permit =
      findPermit(normalized);


    if(permit){

      permitExpiry.value =
        permit;

    }else{

      /*
         If Permit isn't present
         in source, keep blank.
      */

      permitExpiry.value =
        "";

    }


    progressFill.style.width =
      "100%";


    statusText.innerText =
      "OCR completed.";


    showSuccess(
      "Photo read successfully. Please verify the values before saving."
    );


  }catch(error){

    console.error(error);

    showError(
      "OCR failed. Please upload a clearer screenshot."
    );

  }


  readBtn.disabled = false;

}


/* =========================================================
   DATE TO DATABASE FORMAT
========================================================= */

function convertToISO(value){

  if(!value) return null;

  const m =
    value.match(
      /^(\d{2})\/(\d{2})\/(\d{4})$/
    );


  if(!m){

    return null;

  }


  return (
    m[3] +
    "-" +
    m[2] +
    "-" +
    m[1]
  );

}


/* =========================================================
   UPLOAD PHOTO TO STORAGE
========================================================= */

async function uploadPhoto(
  vehicleNo
){

  if(!selectedFile){

    return {
      photo_url:null,
      photo_path:null
    };

  }


  const safeName =
    vehicleNo
      .replace(/[^A-Z0-9]/gi,"_");


  const fileName =
    safeName +
    "_" +
    Date.now() +
    ".jpg";


  const filePath =
    fileName;


  const {
    error
  } =
    await supabaseClient
      .storage
      .from("vehicle-photos")
      .upload(
        filePath,
        selectedFile,
        {
          upsert:false,
          contentType:
            selectedFile.type ||
            "image/jpeg"
        }
      );


  if(error){

    throw error;

  }


  const {
    data
  } =
    supabaseClient
      .storage
      .from("vehicle-photos")
      .getPublicUrl(
        filePath
      );


  return {

    photo_url:
      data.publicUrl,

    photo_path:
      filePath

  };

}


/* =========================================================
   DELETE OLD PHOTO
========================================================= */

async function deleteOldPhoto(
  photoPath
){

  if(!photoPath) return;


  try{

    await supabaseClient
      .storage
      .from("vehicle-photos")
      .remove([
        photoPath
      ]);

  }catch(error){

    console.warn(
      "Old photo delete failed:",
      error
    );

  }

}


/* =========================================================
   SAVE VEHICLE
========================================================= */

async function saveVehicle(){

  hideMessages();


  const vNo =
    vehicleNumber.value
      .trim()
      .toUpperCase();


  if(!vNo){

    showError(
      "Vehicle Number is required."
    );

    return;

  }


  saveBtn.disabled = true;

  saveBtn.innerText =
    "SAVING...";


  try{

    /*
       Find existing vehicle
    */

    const {
      data:existing,
      error:findError
    } =
      await supabaseClient
        .from("vehicles")
        .select("*")
        .eq(
          "vehicle_number",
          vNo
        )
        .maybeSingle();


    if(findError){

      throw findError;

    }


    /*
       Upload new photo first
    */

    let newPhoto = {

      photo_url:
        existing?.photo_url ||
        null,

      photo_path:
        existing?.photo_path ||
        null

    };


    if(selectedFile){

      newPhoto =
        await uploadPhoto(
          vNo
        );

    }


    /*
       Database object
    */

    const vehicleData = {

      vehicle_number:
        vNo,

      registration_date:
        convertToISO(
          registrationDate.value.trim()
        ),

      fitness_expiry:
        convertToISO(
          fitnessExpiry.value.trim()
        ),

      insurance_expiry:
        convertToISO(
          insuranceExpiry.value.trim()
        ),

      /*
         TAX:
         LTT or date or null
      */

      tax_expiry:
        taxExpiry.value.trim()
          ? (
              taxExpiry.value.trim()
            )
          : null,

      pucc_expiry:
        convertToISO(
          puccExpiry.value.trim()
        ),

      permit_expiry:
        convertToISO(
          permitExpiry.value.trim()
        ),

      photo_url:
        newPhoto.photo_url,

      photo_path:
        newPhoto.photo_path

    };


    /*
       UPDATE existing vehicle
    */

    if(existing){

      const {
        error:updateError
      } =
        await supabaseClient
          .from("vehicles")
          .update(
            vehicleData
          )
          .eq(
            "id",
            existing.id
          );


      if(updateError){

        /*
           If DB update fails,
           delete newly uploaded photo
        */

        if(
          selectedFile &&
          newPhoto.photo_path
        ){

          await deleteOldPhoto(
            newPhoto.photo_path
          );

        }

        throw updateError;

      }


      /*
         Delete OLD photo only AFTER
         successful database update
      */

      if(
        selectedFile &&
        existing.photo_path &&
        existing.photo_path !==
        newPhoto.photo_path
      ){

        await deleteOldPhoto(
          existing.photo_path
        );

      }


      showSuccess(
        "Vehicle updated successfully. Old photo replaced."
      );

    }


    /*
       INSERT new vehicle
    */

    else{

      const {
        error:insertError
      } =
        await supabaseClient
          .from("vehicles")
          .insert(
            vehicleData
          );


      if(insertError){

        if(
          selectedFile &&
          newPhoto.photo_path
        ){

          await deleteOldPhoto(
            newPhoto.photo_path
          );

        }

        throw insertError;

      }


      showSuccess(
        "Vehicle saved successfully."
      );

    }


  }catch(error){

    console.error(error);

    showError(
      error.message ||
      "Vehicle save failed."
    );

  }


  saveBtn.disabled = false;

  saveBtn.innerText =
    "SAVE VEHICLE";

}

========================================================= */

function showSuccess(message){

  successBox.innerText =
    message;

  successBox.style.display =
    "block";

  errorBox.style.display =

}


function showError(message){

  errorBox.innerText =

  errorBox.style.display =
    "block";

  successBox.style.display =
    "none";

}


function hideMessages(){

  successBox.style.display =
    "none";

  errorBox.style.display =
    "none";

}
