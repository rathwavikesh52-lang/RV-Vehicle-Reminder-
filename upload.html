/* =========================================================

photoInput.addEventListener(

/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalizeText(text){

  return text
    .replace(/\r/g,"\n")
    .replace(/[ \t]+/g," ")
    .replace(/\n+/g,"\n")
    .trim();

}


/* =========================================================
   DATE CONVERSION
========================================================= */

function convertOCRDate(value){

  if(!value) return "";

  value =
  value.trim();

  const months = {

    JAN:"01",
    FEB:"02",
    MAR:"03",
    APR:"04",
    MAY:"05",
    JUN:"06",
    JUL:"07",
    AUG:"08",
    SEP:"09",
    OCT:"10",
    NOV:"11",
    DEC:"12"

  };


  /* DD-MMM-YYYY */

  let m =
  value.match(
    /\b(\d{1,2})[-\/.\s]([A-Za-z]{3,9})[-\/.\s](\d{4})\b/i
  );

  if(m){

    const day =
    String(m[1]).padStart(2,"0");

    const mon =
    m[2]
      .substring(0,3)
      .toUpperCase();

    const year =
    m[3];

    if(months[mon]){

      return (
        day +
        "/" +
        months[mon] +
        "/" +
        year
      );

    }

  }


  /* YYYY-MM-DD */

  m =
  value.match(
    /\b(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/
  );

  if(m){

    return (
      String(m[3]).padStart(2,"0") +
      "/" +
      String(m[2]).padStart(2,"0") +
      "/" +
      m[1]
    );

  }


  /* DD/MM/YYYY */

  m =
  value.match(
    /\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})\b/
  );

  if(m){

    return (
      String(m[1]).padStart(2,"0") +
      "/" +
      String(m[2]).padStart(2,"0") +
      "/" +
      m[3]
    );

  }


  return "";

}


/* =========================================================
   FIND DATE
========================================================= */

function findDate(text){

  if(!text) return "";

  const patterns = [

    /\b\d{1,2}[-\/.\s][A-Za-z]{3,9}[-\/.\s]\d{4}\b/gi,

    /\b\d{1,2}[-\/.]\d{1,2}[-\/.]\d{4}\b/g,

    /\b\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2}\b/g

  ];


  for(
    const pattern of patterns
  ){

    const match =
    text.match(pattern);

    if(
      match &&
      match.length
    ){

      const converted =
      convertOCRDate(match[0]);

      if(converted){

        return converted;

      }

    }

  }


  return "";

}


/* =========================================================
   FIELD DATE EXTRACTION
========================================================= */

function findDateAfterKeyword(
  text,
  keywords
){

  const lines =
  text
    .split(/\n/)
    .map(x => x.trim())
    .filter(Boolean);


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const upper =
    lines[i].toUpperCase();


    const found =
    keywords.some(
      keyword =>
      upper.includes(keyword)
    );


    if(!found) continue;


    /* Same line first */

    const sameLine =
    findDate(lines[i]);

    if(sameLine){

      return sameLine;

    }


    /*
      Only next 2 lines.
    */

    for(
      let j=i+1;
      j<=Math.min(
        i+2,
        lines.length-1
      );
      j++
    ){

      const nextUpper =
      lines[j].toUpperCase();


      if(
        /REGISTRATION DATE|FITNESS|INSURANCE|PUCC|PUC|TAX|PERMIT/.test(
          nextUpper
        )
      ){

        break;

      }


      const date =
      findDate(lines[j]);

      if(date){

        return date;

      }

    }

  }


  return "";

}


/* =========================================================
   RC INSURANCE DATE
========================================================= */

function findRCInsuranceDate(text){

  const lines =
  text
    .split(/\n/)
    .map(x => x.trim())
    .filter(Boolean);


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const upper =
    lines[i].toUpperCase();


    if(
      upper.includes("INSURANCE DETAILS") ||
      upper.includes("INSURANCE DETAIL")
    ){

      const sameLine =
      findDate(lines[i]);

      if(sameLine){

        return sameLine;

      }


      for(
        let j=i+1;
        j<=Math.min(i+4,lines.length-1);
        j++
      ){

        const line =
        lines[j].toUpperCase();


        if(
          line.includes("VALIDITY")
        ){

          const date =
          findDate(lines[j]);

          if(date){

            return date;

          }

          if(j+1 < lines.length){

            const nextDate =
            findDate(lines[j+1]);

            if(nextDate){

              return nextDate;

            }

          }

        }

      }

    }

  }


  return "";

}


/* =========================================================
   TAX
========================================================= */

function findTax(text){

  const lines =
    text
      .split(/\n/)
      .map(x => x.trim())
      .filter(Boolean);


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const current =
    lines[i].toUpperCase();


    if(
      !current.includes("TAX")
    ){

      continue;

    }


    /*
      LTT
    */

    if(
      /\bLTT\b/.test(current)
    ){

      return "LTT";

    }


    /*
      Common OCR mistakes
    */

    if(
      /\b(L7T|LT7|LIT|LII)\b/.test(
        current
      )
    ){

      return "LTT";

    }


    /*
      Immediate next line
    */

    if(
      i+1 < lines.length
    ){

      const next =
      lines[i+1].toUpperCase();


      if(
        /\bLTT\b/.test(next)
      ){

        return "LTT";

      }


      if(
        /\b(L7T|LT7|LIT|LII)\b/.test(next)
      ){

        return "LTT";

      }


      const date =
      findDate(lines[i+1]);

      if(date){

        return date;

      }

    }

  }


  return "";

}


/* =========================================================
   VEHICLE NUMBER CLEANING
========================================================= */

function cleanVehicleNumberOCR(
  value
){

  if(!value) return "";

  let v =
    value
      .toUpperCase()
      .replace(/[^A-Z0-9]/g,"");


  /*
    Fix GJ OCR
  */

  if(
    v.startsWith("GJO")
  ){

    v =
      "GJ0" +
      v.substring(3);

  }


  if(
    v.startsWith("GIO")
  ){

    v =
      "GJ0" +
      v.substring(3);

  }


  /*
    Numeric RTO section
  */

  if(
    v.startsWith("GJ") &&
    v.length >= 4
  ){

    let chars =
      v.split("");


    const corrections = {

      O:"0",
      Q:"0",
      D:"0",
      I:"1",
      L:"1",
      S:"5",
      B:"8",
      Z:"2"

    };


    for(
      let i=2;
      i<4;
      i++
    ){

      if(
        corrections[chars[i]]
      ){

        chars[i] =
          corrections[chars[i]];

      }

    }


    v =
      chars.join("");

  }


  return v;

}


/* =========================================================
   VEHICLE NUMBER FORMAT
========================================================= */

function isVehicleNumberFormat(v){

  if(!v) return false;


  return (

    /^GJ\d{2}[A-Z]\d{4}$/.test(v) ||

    /^GJ\d{2}[A-Z]\d{5}$/.test(v) ||

    /^GJ\d{2}[A-Z]{2}\d{4}$/.test(v) ||

    /^GJ\d{2}[A-Z]{2}\d{5}$/.test(v) ||

    /^GJ\d{2}[A-Z]{3}\d{3,5}$/.test(v)

  );

}


/* =========================================================
   SMART VEHICLE CORRECTION
========================================================= */

function smartVehicleCorrection(
  candidate
){

  if(!candidate) return "";

  let v =
    cleanVehicleNumberOCR(
      candidate
    );


  /*
    Example:

    GJO6AZ5038

    ↓

    GJ06AZ5038

  */

  if(
    /^GJ\d{2}[A-Z]Z\d{4}$/.test(v)
  ){

    v =
      v.replace(
        /^GJ(\d{2})([A-Z])Z(\d{4})$/,
        "GJ$1$2$3"
      );

  }


  return v;

}


/* =========================================================
   EXTRACT VEHICLE CANDIDATES
========================================================= */

function extractVehicleCandidates(
  text
){

  if(!text) return [];


  let t =
    normalizeText(text)
      .toUpperCase();


  let candidates = [];


  const patterns = [

    /GJ[\s\-]?\d{2}[\s\-]?[A-Z0-9]{1,3}[\s\-]?\d{3,5}/g,

    /GJ[A-Z0-9]{8,11}/g

  ];


  for(
    const pattern of patterns
  ){

    const matches =
      t.match(pattern);


    if(matches){

      matches.forEach(
        item => {

          const cleaned =
            smartVehicleCorrection(
              item
            );


          if(cleaned){

            candidates.push(
              cleaned
            );

          }

        }
      );

    }

  }


  /*
    Compact OCR search
  */

  const compact =
    t.replace(
      /[^A-Z0-9]/g,
      ""
    );


  const compactMatches =
    compact.match(
      /GJ[A-Z0-9]{7,10}/g
    );


  if(compactMatches){

    compactMatches.forEach(
      item => {

        const cleaned =
          smartVehicleCorrection(
            item
          );


        if(cleaned){

          candidates.push(
            cleaned
          );

        }

      }
    );

  }


  return [
    ...new Set(candidates)
  ];

}


/* =========================================================
   BEST VEHICLE NUMBER
========================================================= */

function chooseBestVehicleNumber(
  candidates
){

  if(!candidates.length){

    return "";

  }


  const scored = [];


  for(
    const candidate of candidates
  ){

    const value =
      smartVehicleCorrection(
        candidate
      );


    let score = 0;


    if(
      isVehicleNumberFormat(value)
    ){

      score += 100;

    }


    if(
      /^GJ\d{2}/.test(value)
    ){

      score += 50;

    }


    if(
      value.length === 10
    ){

      score += 20;

    }


    if(
      value.length === 11
    ){

      score += 15;

    }


    if(
      /^GJ\d{2}[A-Z]/.test(value)
    ){

      score += 20;

    }


    scored.push({
      value:value,
      score:score
    });

  }


  scored.sort(
    (a,b) =>
      b.score - a.score
  );


  return scored.length
    ? scored[0].value
    : "";

}


/* =========================================================
   VEHICLE CLASS OCR
========================================================= */

function findVehicleClass(text){

  if(!text) return "";

  const lines =
    text
      .split(/\n/)
      .map(x => x.trim())
      .filter(Boolean);


  /*
    First look for explicit
    Vehicle Class / Class of Vehicle
  */

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const upper =
      lines[i].toUpperCase();


    if(
      upper.includes("VEHICLE CLASS") ||
      upper.includes("CLASS OF VEHICLE") ||
      upper.includes("VEHICLE CLASSIFICATION")
    ){

      const sameLine =
        upper.match(
          /\b(HGV|LGV|LMV|LPV|HPV|2WN|3WT)\b/
        );


      if(sameLine){

        return sameLine[1];

      }


      /*
        Check next two lines
      */

      for(
        let j=i+1;
        j<=Math.min(i+2,lines.length-1);
        j++
      ){

        const next =
          lines[j]
            .toUpperCase();


        const match =
          next.match(
            /\b(HGV|LGV|LMV|LPV|HPV|2WN|3WT)\b/
          );


        if(match){

          return match[1];

        }

      }

    }

  }


  /*
    Search entire OCR text
    if class code appears.
  */

  const allText =
    text.toUpperCase();


  const codes =
    allText.match(
      /\b(HGV|LGV|LMV|LPV|HPV|2WN|3WT)\b/g
    );


  if(codes && codes.length){

    return codes[0];

  }


  return "";

}

      ...extractVehicleCandidates(
        result3.data.text || ""
      )
    );


  }catch(error){

    console.warn(
      "Vehicle OCR Pass 3:",
      error
    );

  }


  candidates =
    [...new Set(candidates)];


  return chooseBestVehicleNumber(
    candidates
  );

}


/* =========================================================
   READ PHOTO
========================================================= */

async function readPhoto(){

  const file =
    photoInput.files[0];


  if(!file){

    alert(
      "Please select a vehicle photo first."
    );

    return;

  }


  /*
    Clear old values
  */

  clearOCRFields();


  readBtn.disabled =
    true;

  saveBtn.disabled =
    true;


  try{

    showStatus(
      "Reading photo...\nPlease wait."
    );


    /*
      MAIN OCR
    */

    const result =
      await Tesseract.recognize(
        file,
        "eng",
        {
          logger:function(info){

            if(
              info.status ===
              "recognizing text"
            ){

              const p =
                Math.round(
                  (info.progress || 0) *
                  100
                );


              showStatus(
                "Reading complete vehicle document...\n" +
                p +
                "%"
              );

            }

          }
        }
      );


    const rawText =
      normalizeText(
        result.data.text || ""
      );


    ocrText.value =
      rawText;


    /*
      HIGH ACCURACY VEHICLE NUMBER
    */

    const highAccuracyNumber =
      await highAccuracyVehicleOCR(
        file
      );


    if(highAccuracyNumber){

      vehicleNumber.value =
        highAccuracyNumber;

    }


    /*
      VEHICLE CLASS

      Only fills automatically
      when OCR actually finds it.
    */

    const detectedClass =
      findVehicleClass(
        rawText
      );


    if(detectedClass){

      vehicleClass.value =
        detectedClass;

    }


    /*
      REGISTRATION DATE
    */

    const registration =
      findDateAfterKeyword(
        rawText,
        [
          "REGISTRATION DATE",
          "REGISTRATION DT",
          "REGN DATE",
          "REG DATE"
        ]
      );


    if(registration){

      registrationDate.value =
        registration;

    }


    /*
      FITNESS
    */

    const fitness =
      findDateAfterKeyword(
        rawText,
        [
          "FITNESS VALID UPTO",
          "FITNESS VALID UP TO",
          "FITNESS UPTO",
          "FITNESS UP TO",
          "FITNESS",
          "REGN"
        ]
      );


    if(fitness){

      fitnessExpiry.value =
        fitness;

    }


    /*
      INSURANCE
    */

    let insurance =
      findDateAfterKeyword(
        rawText,
        [
          "INSURANCE VALID UPTO",
          "INSURANCE VALID UP TO",
          "INSURANCE UPTO",
          "INSURANCE UP TO",
          "INSURANCE"
        ]
      );


    /*
      RC STATUS SCREEN
    */

    if(!insurance){

      insurance =
        findRCInsuranceDate(
          rawText
        );

    }


    if(insurance){

      insuranceExpiry.value =
        insurance;

    }


    /*
      TAX
    */

    const tax =
      findTax(
        rawText
      );


    if(tax){

      taxExpiry.value =
        tax;

    }


    /*
      PUCC
    */

    const pucc =
      findDateAfterKeyword(
        rawText,
        [
          "PUCC VALID UPTO",
          "PUCC VALID UP TO",
          "PUC VALID UPTO",
          "PUC VALID UP TO",
          "PUCC",
          "PUC"
        ]
      );


    if(pucc){

      puccExpiry.value =
        pucc;

    }


    /*
      PERMIT

      If Permit is not available,
      field remains blank.
    */

    const permit =
      findDateAfterKeyword(
        rawText,
        [
          "PERMIT VALID UPTO",
          "PERMIT VALID UP TO",
          "PERMIT UPTO",
          "PERMIT UP TO",
          "PERMIT"
        ]
      );


    if(permit){

      permitExpiry.value =
        permit;

    }


    showStatus(
      "OCR completed successfully.\n\n" +
      "Please check the extracted details before saving."
    );


  }catch(error){

    console.error(error);


    showStatus(
      "OCR Error:\n" +
      (
        error.message ||
        error
      )
    );

  }


  readBtn.disabled =
    false;

  saveBtn.disabled =
    false;

}


/* =========================================================
   DATABASE DATE
========================================================= */

function convertToDatabaseDate(
  value
){

  if(!value){

    return null;

  }


  value =
    value.trim();


  if(
    value.toUpperCase() ===
    "LTT"
  ){

    return "LTT";

  }


  const m =
    value.match(
      /^(\d{2})\/(\d{2})\/(\d{4})$/
    );


  if(!m){

    return null;

  }


  return (
    m[3] +
    "-" +
    m[2] +
    "-" +
    m[1]
  );

}


/* =========================================================
   UPLOAD PHOTO
========================================================= */

async function uploadPhoto(
  file,
  vehicleNo
){

  if(!file){

    return null;

  }


  const safeVehicle =
    vehicleNo.replace(
      /[^A-Z0-9]/gi,
      ""
    );


  const fileName =
    safeVehicle +
    "_" +
    Date.now() +
    ".jpg";


  const {
    error:uploadError
  } =
    await supabaseClient
      .storage
      .from("vehicle-photos")
      .upload(
        fileName,
        file,
        {
          upsert:false,
          contentType:
            file.type ||
            "image/jpeg"
        }
      );


  if(uploadError){

    throw uploadError;

  }


  const {
    data
  } =
    supabaseClient
      .storage
      .from("vehicle-photos")
      .getPublicUrl(
        fileName
      );


  return {

    url:data.publicUrl,

    path:fileName

  };

}


/* =========================================================
   DELETE OLD PHOTO
========================================================= */

async function deleteOldPhoto(
  path
){

  if(!path){

    return;

  }


  try{

    await supabaseClient
      .storage
      .from("vehicle-photos")
      .remove([
        path
      ]);

  }catch(error){

    console.warn(
      "Old photo delete error:",
      error
    );

  }

}


/* =========================================================
   SAVE VEHICLE
========================================================= */

async function saveVehicle(){

  const vNumber =
    vehicleNumber.value
      .trim()
      .toUpperCase();


  if(!vNumber){

    alert(
      "Vehicle Number is required."
    );

    return;

  }


  saveBtn.disabled =
    true;


  try{

    showStatus(
      "Checking vehicle..."
    );


    /*
      Find existing vehicle
    */

    const {
      data:existing,
      error:findError
    } =
      await supabaseClient
        .from("vehicles")
        .select("*")
        .eq(
          "vehicle_number",
          vNumber
        )
        .maybeSingle();


    if(findError){

      throw findError;

    }


    /*
      Vehicle Class
    */

    const selectedClass =
      vehicleClass.value
        .trim()
        .toUpperCase();


    /*
      Vehicle data
    */

    const vehicleData = {

      vehicle_number:
        vNumber,

      vehicle_class:
        selectedClass || null,

      registration_date:
        convertToDatabaseDate(
          registrationDate.value
        ),

      fitness_expiry:
        convertToDatabaseDate(
          fitnessExpiry.value
        ),

      insurance_expiry:
        convertToDatabaseDate(
          insuranceExpiry.value
        ),

      tax_expiry:
        convertToDatabaseDate(
          taxExpiry.value
        ),

      pucc_expiry:
        convertToDatabaseDate(
          puccExpiry.value
        ),

      permit_expiry:
        convertToDatabaseDate(
          permitExpiry.value
        )

    };


    /*
      PHOTO
    */

    const file =
      photoInput.files[0];


    let uploadedPhoto =
      null;


    if(file){

      showStatus(
        "Uploading vehicle photo..."
      );


      uploadedPhoto =
        await uploadPhoto(
          file,
          vNumber
        );

    }


    /*
      EXISTING VEHICLE
    */

    if(existing){

      /*
        Delete old photo only
        when new photo uploaded.
      */

      if(uploadedPhoto){

        if(existing.photo_path){

          await deleteOldPhoto(
            existing.photo_path
          );

        }


        vehicleData.photo_url =
          uploadedPhoto.url;


        vehicleData.photo_path =
          uploadedPhoto.path;

      }


      const {
        error:updateError
      } =
        await supabaseClient
          .from("vehicles")
          .update(
            vehicleData
          )
          .eq(
            "id",
            existing.id
          );


      if(updateError){

        if(uploadedPhoto){

          await deleteOldPhoto(
            uploadedPhoto.path
          );

        }

        throw updateError;

      }


      showStatus(
        "Vehicle updated successfully."
      );


      alert(
        "Vehicle updated successfully."
      );


    }else{

      /*
        NEW VEHICLE
      */

      if(uploadedPhoto){

        vehicleData.photo_url =
          uploadedPhoto.url;

        vehicleData.photo_path =
          uploadedPhoto.path;

      }


      const {
        error:insertError
      } =
        await supabaseClient
          .from("vehicles")
          .insert([
            vehicleData
          ]);


      if(insertError){

        if(uploadedPhoto){

          await deleteOldPhoto(
            uploadedPhoto.path
          );

        }

        throw insertError;

      }


      showStatus(
        "Vehicle saved successfully."
      );


      alert(
        "Vehicle saved successfully."
      );

    }


  }catch(error){

    console.error(error);


    showStatus(
      "Save Error:\n" +
      (
        error.message ||
        error
      )
    );


    alert(
      "Error saving vehicle:\n" +
      (
        error.message ||
        error
      )
    );

  }


  saveBtn.disabled =
    false;

}
