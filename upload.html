/* =========================================

/* =========================================
   CLASS GRID
========================================= */

function createClassGrid(){

  const grid =
    document.getElementById(
      "classGrid"
    );


  if(!grid){

    return;

  }


  grid.innerHTML = "";


  VEHICLE_CLASSES.forEach(
    function(item){

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "class-item";


      div.dataset.code =
        item.code;


      const img =
        document.createElement(
          "img"
        );


      img.src =
        ASSET_BASE +
        item.image;


      img.alt =
        item.name;


      img.loading =
        "lazy";


      img.decoding =
        "async";


      const span =
        document.createElement(
          "span"
        );


      span.textContent =
        item.name;


      div.appendChild(img);

      div.appendChild(span);


      div.onclick =
        function(){

          selectVehicleClass(
            item.code
          );

        };


      grid.appendChild(div);

    }
  );

}


/* =========================================
   SELECT CLASS
========================================= */

function selectVehicleClass(code){

  const hidden =
    document.getElementById(
      "vehicleClass"
    );


  if(hidden){

    hidden.value =
      code || "";

  }


  document
    .querySelectorAll(
      ".class-item"
    )
    .forEach(
      function(item){

        item.classList.toggle(
          "active",
          item.dataset.code === code
        );

      }
    );

}


/* =========================================
   PHOTO INPUT
========================================= */

document

    "photoInput"
  )
  .addEventListener(
    "change",
    function(e){

      const file =
        e.target.files[0];


      if(!file){

        selectedFile = null;

        return;

      }


      if(
        !file.type ||
        !file.type.startsWith("image/")
      ){

        showMessage(
          "Please select an image file.",
          "error"
        );

        e.target.value = "";

        selectedFile = null;

        return;

      }


      selectedFile =
        file;


      const preview =
        document.getElementById(
          "preview"
        );


      if(
        preview.dataset.objectUrl
      ){

        URL.revokeObjectURL(
          preview.dataset.objectUrl
        );

      }


      const objectUrl =
        URL.createObjectURL(
          file
        );


      preview.dataset.objectUrl =
        objectUrl;


      preview.src =
        objectUrl;


      preview.style.display =
        "block";

    }
  );

/* =========================================
   OCR NORMALIZE
========================================= */

function normalizeOCRText(text){

  return String(text || "")
    .replace(/\r/g,"")
    .replace(/[“”]/g,'"')
    .replace(/[‘’]/g,"'")
    .replace(/[|]/g,"I")
    .replace(/[ \t]+/g," ")
    .replace(/\n[ \t]+/g,"\n")
    .trim();

}


function getOCRLines(text){

  return normalizeOCRText(text)
    .split("\n")
    .map(
      function(line){

        return line
          .replace(/\s+/g," ")
          .trim();

      }
    )
    .filter(
      function(line){

        return line.length > 0;

      }
    );

}


/* =========================================
   MONTHS
========================================= */

const MONTHS = {

  JAN:"Jan",
  FEB:"Feb",
  MAR:"Mar",
  APR:"Apr",
  MAY:"May",
  JUN:"Jun",
  JUL:"Jul",
  AUG:"Aug",
  SEP:"Sep",
  OCT:"Oct",
  NOV:"Nov",
  DEC:"Dec"

};


/* =========================================
   VALID DATE
========================================= */

function validDateParts(
  day,
  month,
  year
){

  const d =
    Number(day);


  const y =
    Number(year);


  if(
    !Number.isInteger(d) ||
    !Number.isInteger(y)
  ){

    return false;

  }


  if(
    d < 1 ||
    d > 31
  ){

    return false;

  }


  if(
    y < 1900 ||
    y > 2200
  ){

    return false;

  }


  return true;

}


/* =========================================
   NORMALIZE DATE
========================================= */

function normalizeDateString(value){

  if(!value){

    return "";

  }


  let s =
    String(value)
      .toUpperCase()
      .replace(/,/g," ")
      .replace(/\s+/g," ")
      .trim();


  let m =
    s.match(
      /^(\d{1,2})[-\/\s]([A-Z]{3})[-\/\s](\d{4})$/
    );


  if(m){

    const day =
      m[1].padStart(2,"0");


    const month =
      MONTHS[m[2]];


    const year =
      m[3];


    if(
      month &&
      validDateParts(
        day,
        month,
        year
      )
    ){

      return (
        day +
        "-" +
        month +
        "-" +
        year
      );

    }

  }


  m =
    s.match(
      /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/
    );


  if(m){

    const day =
      m[1].padStart(2,"0");


    const monthNumber =
      Number(m[2]);


    const year =
      m[3];


    const monthNames = [

      "Jan",
      "Feb",
      "Mar",
      "Apr",
      "May",
      "Jun",
      "Jul",
      "Aug",
      "Sep",
      "Oct",
      "Nov",
      "Dec"

    ];


    if(
      monthNumber >= 1 &&
      monthNumber <= 12 &&
      validDateParts(
        day,
        monthNumber,
        year
      )
    ){

      return (
        day +
        "-" +
        monthNames[
          monthNumber - 1
        ] +
        "-" +
        year
      );

    }

  }


  m =
    s.match(
      /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/
    );


  if(m){

    const year =
      m[1];


    const monthNumber =
      Number(m[2]);


    const day =
      m[3].padStart(2,"0");


    const monthNames = [

      "Jan",
      "Feb",
      "Mar",
      "Apr",
      "May",
      "Jun",
      "Jul",
      "Aug",
      "Sep",
      "Oct",
      "Nov",
      "Dec"

    ];


    if(
      monthNumber >= 1 &&
      monthNumber <= 12 &&
      validDateParts(
        day,
        monthNumber,
        year
      )
    ){

      return (
        day +
        "-" +
        monthNames[
          monthNumber - 1
        ] +
        "-" +
        year
      );

    }

  }


  return "";

}


/* =========================================
   EXTRACT DATE
========================================= */

function extractDateFromText(text){

  const patterns = [

    /\b(\d{1,2})[-\/\s](JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[-\/\s](\d{4})\b/i,

    /\b(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})\b/,

    /\b(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})\b/

  ];


  for(
    let i = 0;
    i < patterns.length;
    i++
  ){

    const match =
      String(text || "")
        .match(
          patterns[i]
        );


    if(match){

      const result =
        normalizeDateString(
          match[0]
        );


      if(result){

        return result;

      }

    }

  }


  return "";

}


/* =========================================
   FIND VALUE AFTER LABEL
========================================= */

function findValueAfterLabels(
  text,
  labels,
  maxLines
){

  const lines =
    getOCRLines(text);


  maxLines =
    maxLines || 3;


  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    const line =
      lines[i];


    for(
      let j = 0;
      j < labels.length;
      j++
    ){

      const label =
        labels[j];


      const regex =
        new RegExp(
          label +
          "\\s*[:\\-]?\\s*(.*)",
          "i"
        );


      const match =
        line.match(
          regex
        );


      if(match){

        const sameLine =
          match[1] || "";


        const date =
          extractDateFromText(
            sameLine
          );


        if(date){

          return date;

        }


        for(
          let k = 1;
          k <= maxLines;
          k++
        ){

          if(!lines[i + k]){

            break;

          }


          const nextDate =
            extractDateFromText(
              lines[i + k]
            );


          if(nextDate){

            return nextDate;

          }

        }

      }

    }

  }


  return "";

}


/* =========================================
   INSURANCE BLOCK
========================================= */

function findInsuranceBlockDate(text){

  const lines =
    getOCRLines(text);


  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    if(
      /INSURANCE/i.test(
        lines[i]
      )
    ){

      for(
        let j = i;
        j < Math.min(
          i + 5,
          lines.length
        );
        j++
      ){

        const date =
          extractDateFromText(
            lines[j]
          );


        if(date){

          return date;

        }

      }

    }

  }


  return "";

}


/* =========================================
   TAX
========================================= */

function findTaxValue(text){

  const lines =
    getOCRLines(text);


  const labels = [

    "MV TAX",
    "TAX VALID UPTO",
    "TAX VALID UP TO",
    "TAX VALID",
    "ROAD TAX",
    "TAX"

  ];


  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    for(
      let j = 0;
      j < labels.length;
      j++
    ){

      if(
        new RegExp(
          labels[j],
          "i"
        ).test(
          lines[i]
        )
      ){

        let localText =
          lines[i];


        if(lines[i + 1]){

          localText +=
            " " +
            lines[i + 1];

        }


        if(lines[i + 2]){

          localText +=
            " " +
            lines[i + 2];

        }


        const taxMatch =
          localText.match(
            /\b(LTT|L7T|LT7|LIT|LII|L\s*T\s*T)\b/i
          );


        if(taxMatch){

          return "LTT";

        }


        const date =
          extractDateFromText(
            localText
          );


        if(date){

          return date;

        }

      }

    }

  }


  return "";

}


/* =========================================
   VEHICLE NUMBER
========================================= */

function cleanVehicleCandidate(raw){

  if(!raw){

    return "";

  }


  let s =
    String(raw)
      .toUpperCase()
      .replace(
        /[^A-Z0-9]/g,
        ""
      );


  /*
    Common OCR correction:
    G7 -> GJ
    G1 -> GJ
  */

  s =
    s.replace(
      /^G7/,
      "GJ"
    );


  s =
    s.replace(
      /^G1/,
      "GJ"
    );


  if(
    /^G[71]\d/.test(s)
  ){

    s =
      "GJ" +
      s.substring(2);

  }


  /*
    Already valid:
    GJ34S1419
  */

  if(
    /^GJ\d{2}[A-Z]\d{4}$/.test(s)
  ){

    return s;

  }


  /*
    Two-letter series:
    GJ34AB1234
  */

  if(
    /^GJ\d{2}[A-Z]{2}\d{4}$/.test(s)
  ){

    return s;

  }


  /*
    OCR correction:

    GJ3451419
    -> GJ34S1419

    GJ3481419
    -> GJ34B1419

    GJ3401419
    -> GJ34O1419
  */

  let m =
    s.match(
      /^GJ(\d{2})(\d)(\d{4})$/
    );


  if(m){

    const rto =
      m[1];


    const middle =
      m[2];


    const last =
      m[3];


    if(middle === "5"){

      return (
        "GJ" +
        rto +
        "S" +
        last
      );

    }


    if(middle === "8"){

      return (
        "GJ" +
        rto +
        "B" +
        last
      );

    }


    if(middle === "0"){

      return (
        "GJ" +
        rto +
        "O" +
        last
      );

    }

  }


  s =
    s.replace(
      /^GJ(\d{2})5(\d{4})$/,
      "GJ$1S$2"
    );


  s =
    s.replace(
      /^GJ(\d{2})8(\d{4})$/,
      "GJ$1B$2"
    );


  s =
    s.replace(
      /^GJ(\d{2})0(\d{4})$/,
      "GJ$1O$2"
    );


  if(
    /^GJ\d{2}[A-Z]\d{4}$/.test(s)
  ){

    return s;

  }


  if(
    /^GJ\d{2}[A-Z]{2}\d{4}$/.test(s)
  ){

    return s;

  }


  return "";

}


/* =========================================
   EXTRACT VEHICLE NUMBER
========================================= */

function extractVehicleNumber(text){

  const rawText =
    normalizeOCRText(text);


  const lines =
    getOCRLines(rawText);


  let candidates = [];


  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    const line =
      lines[i];


    if(
      /VEHICLE\s*NUMBER/i.test(line) ||
      /VEHICLE\s*NO/i.test(line) ||
      /REGISTRATION\s*NUMBER/i.test(line) ||
      /REGN\s*NUMBER/i.test(line) ||
      /REGN\s*NO/i.test(line)
    ){

      let localText =
        line;


      if(lines[i + 1]){

        localText +=
          " " +
          lines[i + 1];

      }


      if(lines[i + 2]){

        localText +=
          " " +
          lines[i + 2];

      }


      const found =
        localText.match(
          /\b(?:GJ|G7|G1)[A-Z0-9]{6,10}\b/gi
        );


      if(found){

        candidates =
          candidates.concat(
            found
          );

      }

    }

  }


  const globalMatches =
    rawText.match(
      /\b(?:GJ|G7|G1)[A-Z0-9]{6,10}\b/gi
    );


  if(globalMatches){

    candidates =
      candidates.concat(
        globalMatches
      );

  }


  for(
    let i = 0;
    i < candidates.length;
    i++
  ){

    const repaired =
      cleanVehicleCandidate(
        candidates[i]
      );


    if(repaired){

      return repaired;

    }

  }


  const direct =
    rawText.match(
      /VEHICLE\s*(?:NUMBER|NO)[^A-Z0-9]{0,10}(GJ\d{7,8})/i
    );


  if(direct){

    const repaired =
      cleanVehicleCandidate(
        direct[1]
      );


    if(repaired){

      return repaired;

    }

  }


  return "";

}


/* =========================================
   VEHICLE CLASS
========================================= */

function detectVehicleClass(text){

  const upper =
    String(text || "")
      .toUpperCase();


  const codes = [

    "HGV",
    "MGV",
    "MPV",
    "LGV",
    "LMV",
    "LPV",
    "HPV",
    "2WN",
    "3WT",
    "OTH"

  ];


  for(
    let i = 0;
    i < codes.length;
    i++
  ){

    if(
      new RegExp(
        "\\b" +
        codes[i] +
        "\\b",
        "i"
      ).test(upper)
    ){

      return codes[i];

    }

  }


  /*
    Construction Equipment
  */

  if(
    /CONSTRUCTION\s+EQUIPMENT\s+VEHICLE/i
      .test(upper)
  ){

    return "OTH";

  }


  /*
    Motorcycle / Scooter
    -> 2WN
  */

  if(
    /M[-\s]?CYCLE|MOTORCYCLE|MOTOR\s+CYCLE|SCOOTER|TWO\s+WHEELER/i
      .test(upper)
  ){

    return "2WN";

  }


  /*
    Three Wheeler
    -> 3WT
  */

  if(
    /THREE\s+WHEELER|AUTO\s+RICKSHAW|AUTORICKSHAW/i
      .test(upper)
  ){

    return "3WT";

  }


  /*
    Bus
    -> HPV
  */

  if(
    /\bBUS\b/i.test(upper)
  ){

    return "HPV";

  }


  /*
    Tractor / Pick-up / Goods
    -> LGV
  */

  if(
    /TRACTOR|PICK[-\s]?UP|GOODS\s+VEHICLE/i
      .test(upper)
  ){

    return "LGV";

  }


  /*
    Car
    -> LMV
  */

  if(
    /MOTOR\s+CAR|\bCAR\b/i
      .test(upper)
  ){

    return "LMV";

  }


  return "";

}

/* =========================================
   ENHANCED IMAGE
========================================= */

function createEnhancedImage(file){

  return new Promise(
    function(resolve,reject){

      const img =
        new Image();


      const reader =
        new FileReader();


      reader.onload =
        function(e){

          img.onload =
            function(){

              const minWidth =
                1800;


              const scale =
                Math.max(
                  1,
                  minWidth / img.width
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                Math.round(
                  img.width * scale
                );


              canvas.height =
                Math.round(
                  img.height * scale
                );


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              const imageData =
                ctx.getImageData(
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );


              const data =
                imageData.data;


              for(
                let i = 0;
                i < data.length;
                i += 4
              ){

                const gray =
                  (
                    0.299 * data[i] +
                    0.587 * data[i+1] +
                    0.114 * data[i+2]
                  );


                const value =
                  gray > 160
                    ? 255
                    : gray < 90
                    ? 0
                    : gray;


                data[i] =
                  value;

                data[i+1] =
                  value;

                data[i+2] =
                  value;

              }


              ctx.putImageData(
                imageData,
                0,
                0
              );


              canvas.toBlob(
                function(blob){

                  if(blob){

                    resolve(
                      new File(
                        [blob],
                        "enhanced.jpg",
                        {
                          type:"image/jpeg"
                        }
                      )
                    );

                  }else{

                    reject(
                      new Error(
                        "Image enhancement failed"
                      )
                    );

                  }

                },
                "image/jpeg",
                0.95
              );

            };


          img.onerror =
            reject;


          img.src =
            e.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================
   OCR RECOGNITION
========================================= */

async function recognizeOCR(
  image,
  passNumber,
  totalPasses
){

  const result =
    await Tesseract.recognize(
      image,
      "eng",
      {

        logger:function(info){

          if(
            info.status ===
            "recognizing text"
          ){

            const localProgress =
              info.progress || 0;


            const overall =
              (
                (
                  passNumber - 1
                ) +
                localProgress
              ) /
              totalPasses *
              100;


            const fill =
              document.getElementById(
                "progressFill"
              );


            const text =
              document.getElementById(
                "progressText"
              );


            if(fill){

              fill.style.width =
                Math.round(
                  overall
                ) +
                "%";

            }


            if(text){

              text.textContent =
                "OCR Pass " +
                passNumber +
                " / " +
                totalPasses +
                " - " +
                Math.round(
                  localProgress * 100
                ) +
                "%";

            }

          }

        }

      }
    );


  return result.data.text || "";

}


/* =========================================
   START OCR
========================================= */

async function startOCR(){

  /*
    Prevent duplicate OCR
  */

  if(isOCRRunning){

    return;

  }


  if(!selectedFile){

    showMessage(
      "Please select vehicle photo first.",
      "error"
    );

    return;

  }


  const btn =
    document.getElementById(
      "ocrBtn"
    );


  const progressWrap =
    document.getElementById(
      "progressWrap"
    );


  isOCRRunning =
    true;


  progressWrap.style.display =
    "block";


  btn.disabled =
    true;


  btn.textContent =
    "Reading...";


  try{

    /*
      PASS 1
    */

    const text1 =
      await recognizeOCR(
        selectedFile,
        1,
        3
      );


    /*
      ENHANCE 1
    */

    const enhanced1 =
      await createEnhancedImage(
        selectedFile
      );


    /*
      PASS 2
    */

    const text2 =
      await recognizeOCR(
        enhanced1,
        2,
        3
      );


    /*
      ENHANCE 2
    */

    const enhanced2 =
      await createEnhancedImage(
        enhanced1
      );


    /*
      PASS 3
    */

    const text3 =
      await recognizeOCR(
        enhanced2,
        3,
        3
      );


    /*
      COMBINE OCR
    */

    const combinedText =
      [
        text1,
        text2,
        text3
      ]
      .filter(
        function(t){

          return t &&
            t.trim();

        }
      )
      .join(
        "\n\n--- OCR PASS ---\n\n"
      );


    document.getElementById(
      "ocrText"
    ).value =
      combinedText;


    /*
      EXTRACT DATA
    */

    extractOCRData();


    document.getElementById(
      "progressFill"
    ).style.width =
      "100%";


    document.getElementById(
      "progressText"
    ).textContent =
      "OCR completed successfully.";


    showMessage(
      "OCR completed successfully.",
      "success"
    );


  }catch(error){

    console.error(
      "OCR ERROR:",
      error
    );


    showMessage(
      "OCR failed. Please try again.",
      "error"
    );

  }finally{

    isOCRRunning =
      false;


    btn.disabled =
      false;


    btn.textContent =
      "Read Vehicle Details";

  }

}


/* =========================================
   UPLOAD VEHICLE PHOTO
========================================= */

async function uploadVehiclePhoto(
  file,
  vehicleNumber
){

  if(!file){

    return {

      photo_url:null,

      photo_path:null

    };

  }


  const safeNumber =
    (
      vehicleNumber ||
      "vehicle"
    )
    .replace(
      /[^A-Z0-9_-]/gi,
      ""
    );


  const safeFileName =
    file.name.replace(
      /[^A-Z0-9._-]/gi,
      "_"
    );


  const path =
    safeNumber +
    "/" +
    Date.now() +
    "_" +
    safeFileName;


  const upload =
    await supabaseClient
      .storage
      .from(
        "vehicle-photos"
      )
      .upload(
        path,
        file,
        {
          upsert:false
        }
      );


  if(upload.error){

    throw upload.error;

  }


  const publicData =
    supabaseClient
      .storage
      .from(
        "vehicle-photos"
      )
      .getPublicUrl(
        path
      );


  return {

    photo_url:
      publicData.data.publicUrl,

    photo_path:
      path

  };

}

/* =========================================
   DATE FOR SUPABASE
========================================= */

function dateForSupabase(value){

  if(!value){

    return null;

  }


  const s =
    String(value)
      .trim();


  /*
    Already YYYY-MM-DD
  */

  if(
    /^\d{4}-\d{2}-\d{2}$/.test(s)
  ){

    return s;

  }


  /*
    DD-Mmm-YYYY
  */

  let m =
    s.match(
      /^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/
    );


  if(m){

    const months = {

      Jan:"01",
      Feb:"02",
      Mar:"03",
      Apr:"04",
      May:"05",
      Jun:"06",
      Jul:"07",
      Aug:"08",
      Sep:"09",
      Oct:"10",
      Nov:"11",
      Dec:"12"

    };


    const monthName =
      m[2].charAt(0).toUpperCase() +
      m[2].slice(1).toLowerCase();


    const month =
      months[
        monthName
      ];


    if(month){

      return (
        m[3] +
        "-" +
        month +
        "-" +
        m[1].padStart(
          2,
          "0"
        )
      );

    }

  }


  /*
    DD-MM-YYYY
  */

  m =
    s.match(
      /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/
    );


  if(m){

    const day =
      m[1].padStart(
        2,
        "0"
      );


    const month =
      m[2].padStart(
        2,
        "0"
      );


    const year =
      m[3];


    return (
      year +
      "-" +
      month +
      "-" +
      day
    );

  }


  return null;

}

async function saveVehicle(){

  */

      );

        ).value.trim()
      );

        "ocrText"
      ).value;

    if(!vehicleNumber){

      showMessage(
        "Vehicle Number is required.",
        "error"
      );

    }


    /* PHOTO */

    let photoUrl =
      currentPhotoUrl ||
      null;

      oldPhotoPath ||
      null;

    */

    if(selectedFile){

        await uploadVehiclePhoto(

        );

        uploaded.photo_url;


      photoPath =
        uploaded.photo_path;

    /* =====================================

        vehicleNumber,

      customer_name:
        customerName,

      customer_mobile:
        customerMobile,

      mobile:

      vehicle_class:
        vehicleClass,

        fitnessExpiry,

        photoUrl,

        photoPath,

        ocrText

    /* =====================================

    ====================================== */

    if(editingId){

        await supabaseClient
          .from(
            "vehicles"
          )
          .update(
            vehicleData
          )
          .eq(
            "id",
            editingId
          );

      */

      ){

        );

      }


      showMessage(
        "Vehicle updated successfully. Old photo replaced.",

      );

        await supabaseClient
          .from(
            "vehicles"
          )
          .select(
            "*"
          )
          .eq(
            "vehicle_number",
            vehicleNumber
          )
          .limit(
            1
          );


      if(existing.error){

        throw existing.error;

      }


      /*
        EXISTING VEHICLE
      */

      if(
        existing.data &&
        existing.data.length > 0
      ){

          existing.data[0];

          await supabaseClient
            .from(
              "vehicles"
            )
            .update(
              vehicleData
            )
            .eq(
              "id",
              oldVehicle.id
            );


        if(update.error){

          throw update.error;

        }


        /*
          Delete old photo
        */

        if(
          selectedFile &&
          oldVehicle.photo_path &&
          oldVehicle.photo_path !== photoPath
        ){

          await deleteOldPhoto(
            oldVehicle.photo_path
          );

        );

        */

            .from(

            )

            );

        }

          "Vehicle saved successfully.",
          "success"
        );

      }

    );

      "SAVE ERROR:",
      error
    );


    showMessage(
      error.message ||
      "Save failed.",
      "error"
    );


  }finally{

    /*
      If page is not redirected
    */

    setTimeout(
      function(){

        isSaving =
          false;

        saveBtn.disabled =
          false;

        saveBtn.textContent =
          "Save Vehicle";

      },
      1500
    );

  }

}


/* =========================================
   LOAD VEHICLE
========================================= */

async function loadVehicle(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  editingId =
    params.get("id");


  /*
    NEW VEHICLE
  */

  if(!editingId){

    return;

  }


  try{

    const result =
      await supabaseClient
        .from(
          "vehicles"
        )
        .select(
          "*"
        )
        .eq(
          "id",
          editingId
        )
        .single();


    if(result.error){

      throw result.error;

    }


    const vehicle =
      result.data;


    /* CUSTOMER NAME */

    document.getElementById(
      "customerName"
    ).value =
      vehicle.customer_name ||
      "";


    /* MOBILE */

    document.getElementById(
      "customerMobile"
    ).value =
      vehicle.customer_mobile ||
      vehicle.mobile ||
      "";


    /* VEHICLE NUMBER */

    document.getElementById(
      "vehicleNumber"
    ).value =
      vehicle.vehicle_number ||
      "";


    /* REGISTRATION */

    document.getElementById(
      "registrationDate"
    ).value =
      vehicle.registration_date ||
      "";


    /* FITNESS */

    document.getElementById(
      "fitnessExpiry"
    ).value =
      vehicle.fitness_expiry ||
      "";


    /* INSURANCE */

    document.getElementById(
      "insuranceExpiry"
    ).value =
      vehicle.insurance_expiry ||
      "";


    /* TAX */

    document.getElementById(
      "taxExpiry"
    ).value =
      vehicle.tax_expiry ||
      "";


    /* PUCC */

    document.getElementById(
      "puccExpiry"
    ).value =
      vehicle.pucc_expiry ||
      "";


    /* PERMIT */

    document.getElementById(
      "permitExpiry"
    ).value =
      vehicle.permit_expiry ||
      "";


    /* OCR */

    document.getElementById(
      "ocrText"
    ).value =
      vehicle.ocr_text ||
      "";


    /* CLASS */

    if(vehicle.vehicle_class){

      selectVehicleClass(
        vehicle.vehicle_class
      );

    }


    /* PHOTO */

    currentPhotoUrl =
      vehicle.photo_url ||
      "";


    oldPhotoPath =
      vehicle.photo_path ||
      "";


    if(currentPhotoUrl){

      const preview =
        document.getElementById(
          "preview"
        );


      preview.src =
        currentPhotoUrl;


      preview.style.display =
        "block";

    }


  }catch(error){

    console.error(
      "LOAD ERROR:",
      error
    );


    showMessage(
      error.message ||
      "Vehicle loading failed.",
      "error"
    );

  }

}
