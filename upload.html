<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Vehicle Photo - RV Vehicle Reminder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#222;
}

.header{
    background:#111827;
    color:white;
    padding:16px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:23px;
}

.container{
    max-width:900px;
    margin:20px auto;
    padding:0 15px;
}

.card{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
}

h2{
    margin-top:0;
}

input[type="text"],
input[type="date"]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

input[type="file"]{
    width:100%;
    padding:10px;
}

label{
    display:block;
    font-weight:bold;
    margin:15px 0 6px;
}

#preview{
    width:100%;
    max-height:450px;
    object-fit:contain;
    display:none;
    margin-top:15px;
    border-radius:10px;
    border:1px solid #ddd;
}

.progress{
    width:100%;
    height:10px;
    background:#e5e7eb;
    border-radius:10px;
    overflow:hidden;
    margin-top:15px;
    display:none;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#2563eb;
    transition:.2s;
}

.status{
    margin-top:10px;
    font-weight:bold;
    line-height:1.5;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.full{
    grid-column:1 / -1;
}

button{
    border:0;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    margin-top:15px;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.btn-secondary{
    background:#6b7280;
    color:white;
}

.action-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.note{
    background:#eff6ff;
    border-left:4px solid #2563eb;
    padding:12px;
    margin-top:15px;
    border-radius:6px;
    line-height:1.5;
}

.success{
    background:#ecfdf5;
    color:#166534;
    padding:12px;
    border-radius:8px;
    display:none;
    margin-top:15px;
}

.error{
    background:#fef2f2;
    color:#991b1b;
    padding:12px;
    border-radius:8px;
    display:none;
    margin-top:15px;
}

.ocr-box{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    padding:12px;
    border-radius:8px;
    margin-top:15px;
}

.ocr-box summary{
    cursor:pointer;
    font-weight:bold;
}

#rawText{
    white-space:pre-wrap;
    font-size:13px;
    line-height:1.5;
    margin-top:10px;
}

@media(max-width:650px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .header h1{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🚘 RV Vehicle Reminder</h1>
</div>

<div class="container">

<div class="card">

    <h2>Upload Vehicle Photo</h2>

    <input
        type="file"
        id="photoInput"
        accept="image/*"
        onchange="previewPhoto()"
    >

    <img id="preview" alt="Vehicle Photo Preview">

    <div class="progress" id="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status" id="ocrStatus"></div>

    <button
        class="btn-primary"
        id="readButton"
        onclick="readPhoto()">
        🔍 Read Vehicle Details
    </button>

    <div class="note">
        Upload a clear VAHAN / vehicle details screenshot.
        After OCR, check all details and correct anything before saving.
    </div>

    <details class="ocr-box">
        <summary>Show OCR text</summary>
        <div id="rawText"></div>
    </details>

</div>


<div class="card">

    <h2>Vehicle Details</h2>

    <div class="form-grid">

        <div class="full">
            <label>Vehicle Number</label>
            <input
                type="text"
                id="vehicleNumber"
                placeholder="GJ04AB1234">
        </div>

        <div>
            <label>Registration Date</label>
            <input type="date" id="registrationDate">
        </div>

        <div>
            <label>Fitness Expiry</label>
            <input type="date" id="fitness">
        </div>

        <div>
            <label>Insurance Expiry</label>
            <input type="date" id="insurance">
        </div>

        <div>
            <label>Tax</label>
            <input
                type="text"
                id="tax"
                placeholder="LTT / LTP">
        </div>

        <div>
            <label>PUCC Expiry</label>
            <input type="date" id="pucc">
        </div>

        <div>
            <label>Permit Expiry</label>
            <input type="date" id="permit">
        </div>

    </div>

    <div id="successMessage" class="success"></div>
    <div id="errorMessage" class="error"></div>

    <div class="action-buttons">

        <button
            class="btn-success"
            id="saveButton"
            onclick="saveVehicle()">
            💾 Save Vehicle
        </button>

        <button
            class="btn-secondary"
            onclick="goDashboard()">
            Dashboard
        </button>

    </div>

</div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://lqbhafspabtlqeubqxjg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const STORAGE_BUCKET = "vehicle-photos";


/* =========================================================
   PREVIEW
========================================================= */

function previewPhoto(){

    const input =
        document.getElementById("photoInput");

    const preview =
        document.getElementById("preview");

    if(!input.files || !input.files[0]){
        preview.style.display = "none";
        return;
    }

    preview.src =
        URL.createObjectURL(input.files[0]);

    preview.style.display = "block";

    hideMessages();

    document.getElementById("ocrStatus").innerText =
        "Photo selected. Tap Read Vehicle Details.";
}


/* =========================================================
   OCR
========================================================= */

async function readPhoto(){

    const input =
        document.getElementById("photoInput");

    const button =
        document.getElementById("readButton");

    const status =
        document.getElementById("ocrStatus");

    const progress =
        document.getElementById("progress");

    const progressBar =
        document.getElementById("progressBar");

    if(!input.files || !input.files[0]){

        alert(
            "Please select a vehicle photo first."
        );

        return;
    }

    button.disabled = true;

    progress.style.display = "block";

    progressBar.style.width = "0%";

    status.innerText =
        "Starting OCR...";

    hideMessages();

    try{

        const file =
            input.files[0];

        const result =
            await Tesseract.recognize(
                file,
                "eng",
                {
                    logger:function(info){

                        if(info.status === "recognizing text"){

                            const percent =
                                Math.round(
                                    info.progress * 100
                                );

                            progressBar.style.width =
                                percent + "%";

                            status.innerText =
                                "Reading photo... " +
                                percent + "%";
                        }

                    }
                }
            );


        const ocrText =
            result.data.text || "";


        console.log(
            "OCR TEXT:",
            ocrText
        );


        document.getElementById(
            "rawText"
        ).innerText =
            ocrText || "No text detected.";


        extractVehicleData(ocrText);


        status.innerText =
            "✅ Reading complete. Please check and edit the details before saving.";

    }
    catch(error){

        console.error(
            "OCR ERROR:",
            error
        );

        status.innerText =
            "❌ OCR failed.";

        showError(
            "Could not read the photo. Please upload a clearer screenshot."
        );

    }
    finally{

        button.disabled = false;

    }

}


/* =========================================================
   DATE REGEX
========================================================= */

const datePart =
"(\\d{1,2}[\\/-](?:\\d{1,2}|Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)[\\/-]\\d{4})";


/* =========================================================
   DATE FINDER
========================================================= */

function findDate(text, patterns){

    for(const pattern of patterns){

        const match =
            text.match(pattern);

        if(match && match[1]){

            return match[1];

        }

    }

    return "";
}


/* =========================================================
   EXTRACT VEHICLE DATA
========================================================= */

function extractVehicleData(text){

    const normalized =
        text
            .replace(/\r/g,"\n")
            .replace(/[|]/g," ")
            .replace(/[ \t]+/g," ");


    /*
     * Do NOT clear existing values if OCR finds nothing.
     */

    /* =====================================================
       VEHICLE NUMBER
    ===================================================== */

    const vehicleCandidates =
        normalized.match(
            /\b[A-Z]{2}\s*[-]?\s*\d{1,2}\s*[-]?\s*[A-Z]{1,3}\s*[-]?\s*\d{3,4}\b/gi
        ) || [];


    if(vehicleCandidates.length){

        let vehicleNumber =
            cleanVehicleNumber(
                vehicleCandidates[0]
            );

        document.getElementById(
            "vehicleNumber"
        ).value =
            vehicleNumber;

    }


    /* =====================================================
       REGISTRATION
    ===================================================== */

    const registration =
        findDate(
            normalized,
            [
                new RegExp(
                    "(?:Registration\\s*Date|Registered\\s*Date|Date\\s*of\\s*Registration|Reg(?:istration)?\\s*Date)[\\s:\\-]*" +
                    datePart,
                    "i"
                )
            ]
        );


    if(registration){

        setDateValue(
            "registrationDate",
            registration
        );

    }


    /* =====================================================
       FITNESS
    ===================================================== */

    const fitness =
        findDate(
            normalized,
            [
                new RegExp(
                    "(?:Fitness\\s*Valid\\s*Up\\s*To|Fitness\\s*Valid\\s*Upto|Fitness\\s*Expiry|Fitness\\s*Up\\s*To|Fitness)[\\s:\\-]*" +
                    datePart,
                    "i"
                )
            ]
        );


    if(fitness){

        setDateValue(
            "fitness",
            fitness
        );

    }


    /* =====================================================
       INSURANCE
    ===================================================== */

    const insurance =
        findDate(
            normalized,
            [
                new RegExp(
                    "(?:Insurance\\s*Valid\\s*Up\\s*To|Insurance\\s*Valid\\s*Upto|Insurance\\s*Expiry|Insurance\\s*Up\\s*To|Insurance)[\\s:\\-]*" +
                    datePart,
                    "i"
                )
            ]
        );


    if(insurance){

        setDateValue(
            "insurance",
            insurance
        );

    }


    /* =====================================================
       PUCC / PUC
    ===================================================== */

    const pucc =
        findDate(
            normalized,
            [
                new RegExp(
                    "(?:PUCC\\s*Valid\\s*Up\\s*To|PUCC\\s*Valid\\s*Upto|PUCC\\s*Expiry|PUC\\s*Valid\\s*Up\\s*To|PUC\\s*Valid\\s*Upto|PUC\\s*Expiry|PUCC|PUC)[\\s:\\-]*" +
                    datePart,
                    "i"
                )
            ]
        );


    if(pucc){

        setDateValue(
            "pucc",
            pucc
        );

    }


    /* =====================================================
       PERMIT
    ===================================================== */

    const permit =
        findDate(
            normalized,
            [
                new RegExp(
                    "(?:Permit\\s*Valid\\s*Up\\s*To|Permit\\s*Valid\\s*Upto|Permit\\s*Expiry|Permit\\s*Up\\s*To|Permit)[\\s:\\-]*" +
                    datePart,
                    "i"
                )
            ]
        );


    if(permit){

        setDateValue(
            "permit",
            permit
        );

    }


    /* =====================================================
       TAX
    ===================================================== */

    const tax =
        normalized.match(
            /(?:MV\s*Tax|Tax\s*Valid\s*Up\s*To|Tax\s*Valid\s*Upto|Tax)[\s:\-]*(LTT|LTP)\b/i
        );


    if(tax){

        document.getElementById(
            "tax"
        ).value =
            tax[1].toUpperCase();

    }

}


/* =========================================================
   VEHICLE NUMBER CLEAN
========================================================= */

function cleanVehicleNumber(value){

    return (value || "")
        .toUpperCase()
        .replace(/[^A-Z0-9]/g,"")
        .trim();

}


/* =========================================================
   SET DATE
========================================================= */

function setDateValue(id, value){

    const converted =
        convertDate(value);

    if(converted){

        document.getElementById(id).value =
            converted;

    }

}


/* =========================================================
   DATE CONVERSION
========================================================= */

function convertDate(value){

    if(!value){

        return "";

    }


    value =
        value
            .trim()
            .replace(/[\/]/g,"-");


    const parts =
        value.split("-");


    if(parts.length !== 3){

        return "";

    }


    let day =
        parts[0].trim();

    let month =
        parts[1].trim();

    let year =
        parts[2].trim();


    const months = {

        jan:"01",
        january:"01",

        feb:"02",
        february:"02",

        mar:"03",
        march:"03",

        apr:"04",
        april:"04",

        may:"05",

        jun:"06",
        june:"06",

        jul:"07",
        july:"07",

        aug:"08",
        august:"08",

        sep:"09",
        sept:"09",
        september:"09",

        oct:"10",
        october:"10",

        nov:"11",
        november:"11",

        dec:"12",
        december:"12"

    };


    if(isNaN(month)){

        month =
            months[
                month.toLowerCase()
            ] || "";

    }
    else{

        month =
            month.padStart(2,"0");

    }


    day =
        day.padStart(2,"0");


    if(
        !year ||
        !month ||
        !day
    ){

        return "";

    }


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =========================================================
   NORMALIZE VEHICLE NUMBER
========================================================= */

function normalizeVehicleNumber(number){

    return (number || "")
        .replace(/[\s-]/g,"")
        .toUpperCase()
        .trim();

}


/* =========================================================
   PHOTO PATH
========================================================= */

function createPhotoPath(vehicleNumber){

    const safe =
        normalizeVehicleNumber(
            vehicleNumber
        )
        .replace(
            /[^A-Z0-9]/g,
            ""
        );


    return (
        safe +
        "_" +
        Date.now() +
        ".jpg"
    );

}


/* =========================================================
   SAVE VEHICLE
========================================================= */

async function saveVehicle(){

    hideMessages();


    const vehicleNumber =
        normalizeVehicleNumber(
            document.getElementById(
                "vehicleNumber"
            ).value
        );


    const registrationDate =
        document.getElementById(
            "registrationDate"
        ).value;


    const fitness =
        document.getElementById(
            "fitness"
        ).value;


    const insurance =
        document.getElementById(
            "insurance"
        ).value;


    const tax =
        document.getElementById(
            "tax"
        ).value
        .trim()
        .toUpperCase();


    const pucc =
        document.getElementById(
            "pucc"
        ).value;


    const permit =
        document.getElementById(
            "permit"
        ).value;


    if(!vehicleNumber){

        showError(
            "Vehicle Number is required."
        );

        return;

    }


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    saveButton.disabled =
        true;


    saveButton.innerText =
        "Saving...";


    try{

        /* =================================================
           FIND EXISTING VEHICLE
        ================================================= */

        const {
            data: existingRows,
            error: findError
        } =
            await supabaseClient
                .from("vehicles")
                .select("*")
                .eq(
                    "vehicle_number",
                    vehicleNumber
                )
                .limit(1);


        if(findError){

            throw findError;

        }


        const existing =
            existingRows &&
            existingRows.length
                ? existingRows[0]
                : null;


        /* =================================================
           PHOTO
        ================================================= */

        let photoPath =
            existing?.photo_path || null;


        let photoUrl =
            existing?.photo_url || null;


        const photoInput =
            document.getElementById(
                "photoInput"
            );


        if(
            photoInput.files &&
            photoInput.files[0]
        ){

            const file =
                photoInput.files[0];


            const newPath =
                createPhotoPath(
                    vehicleNumber
                );


            /* Upload new photo */

            const {
                error: uploadError
            } =
                await supabaseClient
                    .storage
                    .from(
                        STORAGE_BUCKET
                    )
                    .upload(
                        newPath,
                        file,
                        {
                            cacheControl:"3600",
                            upsert:false,
                            contentType:
                                file.type ||
