<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RV Vehicle Reminder - Upload</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#222;
}

.header{
    background:#111827;
    color:white;
    padding:16px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:23px;
}

.container{
    max-width:900px;
    margin:20px auto;
    padding:0 15px;
}

.card{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
}

h2{
    margin-top:0;
}

input[type="text"],
input[type="date"]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

input[type="file"]{
    width:100%;
    padding:10px;
}

label{
    display:block;
    font-weight:bold;
    margin:15px 0 6px;
}

#preview{
    width:100%;
    max-height:450px;
    object-fit:contain;
    display:none;
    margin-top:15px;
    border-radius:10px;
    border:1px solid #ddd;
}

.progress{
    width:100%;
    height:10px;
    background:#e5e7eb;
    border-radius:10px;
    overflow:hidden;
    margin-top:15px;
    display:none;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#2563eb;
    transition:.2s;
}

.status{
    margin-top:10px;
    font-weight:bold;
    line-height:1.5;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.full{
    grid-column:1 / -1;
}

button{
    border:0;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    margin-top:15px;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.btn-secondary{
    background:#6b7280;
    color:white;
}

.action-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.note{
    background:#eff6ff;
    border-left:4px solid #2563eb;
    padding:12px;
    margin-top:15px;
    border-radius:6px;
    line-height:1.5;
}

.success{
    background:#ecfdf5;
    color:#166534;
    padding:12px;
    border-radius:8px;
    display:none;
    margin-top:15px;
}

.error{
    background:#fef2f2;
    color:#991b1b;
    padding:12px;
    border-radius:8px;
    display:none;
    margin-top:15px;
}

.ocr-box{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    padding:12px;
    border-radius:8px;
    margin-top:15px;
}

.ocr-box summary{
    cursor:pointer;
    font-weight:bold;
}

#rawText{
    white-space:pre-wrap;
    font-size:13px;
    line-height:1.5;
    margin-top:10px;
}

@media(max-width:650px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .header h1{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🚘 RV Vehicle Reminder</h1>
</div>

<div class="container">

    <!-- PHOTO CARD -->
    <div class="card">

        <h2>Upload Vehicle Photo</h2>

        <input
            type="file"
            id="photoInput"
            accept="image/*"
        >

        <img
            id="preview"
            alt="Vehicle Photo Preview"
        >

        <div
            class="progress"
            id="progress"
        >
            <div
                class="progress-bar"
                id="progressBar"
            ></div>
        </div>

        <div
            class="status"
            id="ocrStatus"
        >
        </div>

        <button
            type="button"
            class="btn-primary"
            id="readButton"
        >
            🔍 Read Vehicle Details
        </button>

        <div class="note">
            Upload a clear VAHAN / vehicle details screenshot.
            After OCR, check all details and correct anything before saving.
        </div>

        <details class="ocr-box">

            <summary>Show OCR text</summary>

            <div id="rawText"></div>

        </details>

    </div>


    <!-- VEHICLE DETAILS CARD -->
    <div class="card">

        <h2>Vehicle Details</h2>

        <div class="form-grid">

            <div class="full">

                <label>Vehicle Number</label>

                <input
                    type="text"
                    id="vehicleNumber"
                    placeholder="GJ04AB1234"
                >

            </div>


            <div>

                <label>Registration Date</label>

                <input
                    type="date"
                    id="registrationDate"
                >

            </div>


            <div>

                <label>Fitness Expiry</label>

                <input
                    type="date"
                    id="fitness"
                >

            </div>


            <div>

                <label>Insurance Expiry</label>

                <input
                    type="date"
                    id="insurance"
                >

            </div>


            <div>

                <label>Tax</label>

                <input
                    type="text"
                    id="tax"
                    placeholder="LTT / LTP"
                >

            </div>


            <div>

                <label>PUCC Expiry</label>

                <input
                    type="date"
                    id="pucc"
                >

            </div>


            <div>

                <label>Permit Expiry</label>

                <input
                    type="date"
                    id="permit"
                >

            </div>

        </div>


        <div
            id="successMessage"
            class="success"
        ></div>


        <div
            id="errorMessage"
            class="error"
        ></div>


        <div class="action-buttons">

            <button
                type="button"
                class="btn-success"
                id="saveButton"
            >
                💾 Save Vehicle
            </button>


            <button
                type="button"
                class="btn-secondary"
                id="dashboardButton"
            >
                Dashboard
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://lqbhafspabtlqeubqxjg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

const STORAGE_BUCKET =
    "vehicle-photos";


/* =========================================================
   ELEMENTS
========================================================= */

const photoInput =
    document.getElementById("photoInput");

const preview =
    document.getElementById("preview");

const readButton =
    document.getElementById("readButton");

const saveButton =
    document.getElementById("saveButton");

const dashboardButton =
    document.getElementById("dashboardButton");

const ocrStatus =
    document.getElementById("ocrStatus");

const progress =
    document.getElementById("progress");

const progressBar =
    document.getElementById("progressBar");

const rawText =
    document.getElementById("rawText");


/* =========================================================
   PHOTO PREVIEW
========================================================= */

photoInput.addEventListener(
    "change",
    function(){

        if(
            !photoInput.files ||
            !photoInput.files[0]
        ){

            preview.style.display = "none";

            ocrStatus.innerText = "";

            return;
        }

        const file =
            photoInput.files[0];

        preview.src =
            URL.createObjectURL(file);

        preview.style.display =
            "block";

        rawText.innerText = "";

        hideMessages();

        ocrStatus.innerText =
            "Photo selected. Tap Read Vehicle Details.";

    }
);


/* =========================================================
   IMAGE PREPARATION
========================================================= */

function prepareImage(file){

    return new Promise(
        function(resolve,reject){

            const reader =
                new FileReader();

            reader.onload =
                function(){

                    const img =
                        new Image();

                    img.onload =
                        function(){

                            const maxWidth =
                                1800;

                            let width =
                                img.width;

                            let height =
                                img.height;

                            if(
                                width > maxWidth
                            ){

                                height =
                                    Math.round(
                                        height *
                                        maxWidth /
                                        width
                                    );

                                width =
                                    maxWidth;
                            }

                            const canvas =
                                document.createElement(
                                    "canvas"
                                );

                            canvas.width =
                                width;

                            canvas.height =
                                height;

                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );

                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );

                            canvas.toBlob(
                                function(blob){

                                    if(!blob){

                                        reject(
                                            new Error(
                                                "Image processing failed."
                                            )
                                        );

                                        return;
                                    }

                                    resolve(blob);

                                },
                                "image/jpeg",
                                0.9
                            );

                        };


                    img.onerror =
                        function(){

                            reject(
                                new Error(
                                    "Could not open image."
                                )
                            );

                        };


                    img.src =
                        reader.result;

                };


            reader.onerror =
                function(){

                    reject(
                        new Error(
                            "Could not read image."
                        )
                    );

                };


            reader.readAsDataURL(file);

        }
    );
}


/* =========================================================
   OCR
========================================================= */

async function readPhoto(){

    hideMessages();

    if(
        !photoInput.files ||
        !photoInput.files[0]
    ){

        showError(
            "Please select a vehicle photo first."
        );

        return;
    }


    readButton.disabled =
        true;

    progress.style.display =
        "block";

    progressBar.style.width =
        "5%";

    ocrStatus.innerText =
        "Starting OCR...";


    try{

        const file =
            photoInput.files[0];


        ocrStatus.innerText =
            "Preparing photo...";

        progressBar.style.width =
            "10%";


        const processedImage =
            await prepareImage(file);


        if(
            typeof Tesseract ===
            "undefined"
        ){

            throw new Error(
                "Tesseract OCR library did not load."
            );
        }


        ocrStatus.innerText =
            "Loading OCR engine...";

        progressBar.style.width =
            "20%";


        const result =
            await Tesseract.recognize(
                processedImage,
                "eng",
                {

                    logger:
                        function(info){

                            if(
                                info.status ===
                                "recognizing text"
                            ){

                                const percent =
                                    Math.round(
                                        info.progress *
                                        100
                                    );

                                progressBar.style.width =
                                    (
                                        20 +
                                        Math.round(
                                            percent *
                                            0.8
                                        )
                                    ) + "%";

                                ocrStatus.innerText =
                                    "Reading photo... " +
                                    percent +
                                    "%";

                            }
                            else if(
                                info.status
                            ){

                                ocrStatus.innerText =
                                    info.status;

                            }

                        }

                }
            );


        const text =
            result &&
            result.data &&
            result.data.text
                ? result.data.text
                : "";


        console.log(
            "OCR TEXT:",
            text
        );


        rawText.innerText =
            text ||
            "No text detected.";


        progressBar.style.width =
            "100%";


        if(
            !text.trim()
        ){

            ocrStatus.innerText =
                "⚠️ No readable text found.";

            showError(
                "No readable text was found. Please upload a clear VAHAN screenshot."
            );

            return;
        }


        extractVehicleData(text);


        ocrStatus.innerText =
            "✅ Reading complete. Please check the details before saving.";

    }
    catch(error){

        console.error(
            "OCR ERROR:",
            error
        );

        ocrStatus.innerText =
            "❌ OCR failed.";

        showError(
            "OCR Error: " +
            (
                error.message ||
                "Unknown error."
            )
        );

    }
    finally{

        readButton.disabled =
            false;

    }

}


/* =========================================================
   VEHICLE NUMBER
========================================================= */

function cleanVehicleNumber(value){

    return(
        value || ""
    )
    .toUpperCase()
    .replace(
        /[^A-Z0-9]/g,
        ""
    )
    .trim();

}


/* =========================================================
   DATE CONVERSION
========================================================= */

function convertDate(value){

    if(!value){

        return "";
    }


    let text =
        value
            .trim()
            .replace(
                /\//g,
                "-"
            );


    const parts =
        text.split("-");


    if(
        parts.length !== 3
    ){

        return "";
    }


    let day =
        parts[0].trim();

    let month =
        parts[1].trim();

    let year =
        parts[2].trim();


    const months = {

        jan:"01",
        january:"01",

        feb:"02",
        february:"02",

        mar:"03",
        march:"03",

        apr:"04",
        april:"04",

        may:"05",

        jun:"06",
        june:"06",

        jul:"07",
        july:"07",

        aug:"08",
        august:"08",

        sep:"09",
        sept:"09",
        september:"09",

        oct:"10",
        october:"10",

        nov:"11",
        november:"11",

        dec:"12",
        december:"12"

    };


    if(
        isNaN(month)
    ){

        month =
            months[
                month.toLowerCase()
            ] || "";

    }
    else{

        month =
            month.padStart(
                2,
                "0"
            );

    }


    day =
        day.padStart(
            2,
            "0"
        );


    if(
        !year ||
        !month ||
        !day
    ){

        return "";
    }


    return(
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =========================================================
   SET DATE
========================================================= */

function setDateValue(
    id,
    value
){

    const converted =
        convertDate(value);

    if(converted){

        const element =
            document.getElementById(id);

        if(element){

            element.value =
                converted;
        }

    }

}


/* =========================================================
   EXTRACT DATA FROM OCR
========================================================= */

function extractVehicleData(text){

    const normalized =
        text
            .replace(
                /\r/g,
                "\n"
            )
            .replace(
                /[|]/g,
                " "
            );


    /* VEHICLE NUMBER */

    const vehicleMatches =
        normalized.match(
            /\b[A-Z]{2}\s*[-]?\s*\d{1,2}\s*[-]?\s*[A-Z]{1,3}\s*[-]?\s*\d{3,4}\b/gi
        ) || [];


    if(
        vehicleMatches.length
    ){

        document.getElementById(
            "vehicleNumber"
        ).value =
            cleanVehicleNumber(
                vehicleMatches[0]
            );

    }


    /* ALL DATE PATTERNS */

    const datePattern =
        "(\\d{1,2}[\\/-]\\d{1,2}[\\/-]\\d{4}|\\d{1,2}[\\/-][A-Za-z]{3,9}[\\/-]\\d{4})";


    /* REGISTRATION */

    const registrationMatch =
        normalized.match(
            new RegExp(
                "(?:Registration\\s*Date|Registered\\s*Date|Date\\s*of\\s*Registration)[\\s:\\-]*" +
                datePattern,
                "i"
            )
        );


    if(
        registrationMatch
    ){

        setDateValue(
            "registrationDate",
            registrationMatch[1]
        );

    }


    /* FITNESS */

    const fitnessMatch =
        normalized.match(
            new RegExp(
                "(?:Fitness\\s*Valid\\s*Up\\s*To|Fitness\\s*Valid\\s*Upto|Fitness\\s*Expiry|Fitness\\s*Up\\s*To|Fitness)[\\s:\\-]*" +
                datePattern,
                "i"
            )
        );


    if(
        fitnessMatch
    ){

        setDateValue(
            "fitness",
            fitnessMatch[1]
        );

    }


    /* INSURANCE */

    const insuranceMatch =
        normalized.match(
            new RegExp(
                "(?:Insurance\\s*Valid\\s*Up\\s*To|Insurance\\s*Valid\\s*Upto|Insurance\\s*Expiry|Insurance\\s*Up\\s*To|Insurance)[\\s:\\-]*" +
                datePattern,
                "i"
            )
        );


    if(
        insuranceMatch
    ){

        setDateValue(
            "insurance",
            insuranceMatch[1]
        );

    }


    /* PUCC */

    const puccMatch =
        normalized.match(
            new RegExp(
                "(?:PUCC\\s*Valid\\s*Up\\s*To|PUCC\\s*Valid\\s*Upto|PUCC\\s*Expiry|PUC\\s*Valid\\s*Up\\s*To|PUC\\s*Valid\\s*Upto|PUC\\s*Expiry)[\\s:\\-]*" +
                datePattern,
                "i"
            )
        );


    if(
        puccMatch
    ){

        setDateValue(
            "pucc",
            puccMatch[1]
        );

    }


    /* PERMIT */

    const permitMatch =
        normalized.match(
            new RegExp(
                "(?:Permit\\s*Valid\\s*Up\\s*To|Permit\\s*Valid\\s*Upto|Permit\\s*Expiry|Permit\\s*Up\\s*To|Permit)[\\s:\\-]*" +
                datePattern,
                "i"
            )
        );


    if(
        permitMatch
    ){

        setDateValue(
            "permit",
            permitMatch[1]
        );

    }


    /* TAX */

    const taxMatch =
        normalized.match(
            /(?:MV\s*Tax|Tax\s*Valid\s*Up\s*To|Tax\s*Valid\s*Upto|Tax)[\s:\-]*(LTT|LTP)\b/i
        );


    if(
        taxMatch
    ){

        document.getElementById(
            "tax"
        ).value =
            taxMatch[1].toUpperCase();

    }

}


/* =========================================================
   NORMALIZE VEHICLE NUMBER
========================================================= */

function normalizeVehicleNumber(number){

    return(
        number || ""
    )
    .replace(
        /[\s-]/g,
        ""
    )
    .toUpperCase()
    .trim();

}


/* =========================================================
   PHOTO PATH
========================================================= */

function createPhotoPath(
    vehicleNumber
){

    const safe =
        normalizeVehicleNumber(
            vehicleNumber
        )
        .replace(
            /[^A-Z0-9]/g,
            ""
        );


    return(
        safe +
        "_" +
        Date.now() +
        ".jpg"
    );

}


/* =========================================================
   SAVE VEHICLE
========================================================= */

async function saveVehicle(){

    hideMessages();


    const vehicleNumber =
        normalizeVehicleNumber(
            document.getElementById(
                "vehicleNumber"
            ).value
        );


    const registrationDate =
        document.getElementById(
            "registrationDate"
        ).value || null;


    const fitness =
        document.getElementById(
            "fitness"
        ).value || null;


    const insurance =
        document.getElementById(
            "insurance"
        ).value || null;


    const tax =
        document.getElementById(
            "tax"
        ).value
        .trim()
        .toUpperCase() || null;


    const pucc =
        document.getElementById(
            "pucc"
        ).value || null;


    const permit =
        document.getElementById(
            "permit"
        ).value || null;


    if(
        !vehicleNumber
    ){

        showError(
            "Vehicle Number is required."
        );

        return;
    }


    saveButton.disabled =
        true;

    saveButton.innerText =
        "Saving...";


    try{

        const {
            data: existingRows,
            error: findError
        } =
            await supabaseClient
                .from("vehicles")
                .select("*")
                .eq(
                    "vehicle_number",
                    vehicleNumber
                )
                .limit(1);


        if(findError){

            throw findError;
        }


        const existing =
            existingRows &&
            existingRows.length
                ? existingRows[0]
                : null;


        let photoPath =
            existing?.photo_path ||
            null;


        let photoUrl =
            existing?.photo_url ||
            null;


        const file =
            photoInput.files &&
            photoInput.files[0]
                ? photoInput.files[0]
                : null;


        /* UPLOAD NEW PHOTO */

        if(file){

            const newPath =
                createPhotoPath(
                    vehicleNumber
                );


            const {
                error: uploadError
            } =
                await supabaseClient
                    .storage
                    .from(
                        STORAGE_BUCKET
                    )
                    .upload(
                        newPath,
                        file,
                        {
                            cacheControl:"3600",
                            upsert:false,
                            contentType:
                                file.type ||
                                "image/jpeg"
                        }
                    );


            if(uploadError){

                throw uploadError;
            }


            const {
                data: publicData
            } =
                supabaseClient
                    .storage
                    .from(
                        STORAGE_BUCKET
                    )
                    .getPublicUrl(
                        newPath
                    );


            photoPath =
                newPath;


            photoUrl =
                publicData?.publicUrl ||
                null;


            /* DELETE OLD PHOTO */

            if(
                existing &&
                existing.photo_path
            ){

                const {
                    error: oldPhotoError
                } =
                    await supabaseClient
                        .storage
                        .from(
                            STORAGE_BUCKET
                        )
                        .remove([
                            existing.photo_path
                        ]);


                if(oldPhotoError){

                    console.warn(
                        "Old photo delete warning:",
                        oldPhotoError
                    );

                }

            }

        }


        const vehicleData = {

            vehicle_number:
                vehicleNumber,

            registration_date:
                registrationDate,

            fitness_expiry:
                fitness,

            insurance_expiry:
                insurance,

            tax_expiry:
                tax,

            pucc_expiry:
                pucc,

            permit_expiry:
                permit,

            photo_url:
                photoUrl,

            photo_path:
                photoPath

        };


        /* UPDATE */

        if(existing){

            const {
                error:updateError
            } =
                await supabaseClient
                    .from("vehicles")
                    .update(
                        vehicleData
                    )
                    .eq(
                        "id",
                        existing.id
                    );


            if(updateError){

                throw updateError;
            }


            showSuccess(
                "Vehicle updated successfully. Old photo replaced."
            );

        }


        /* INSERT */

        else{

            const {
                error:insertError
            } =
                await supabaseClient
                    .from("vehicles")
                    .insert(
                        [vehicleData]
                    );


            if(insertError){

                throw insertError;
            }


            showSuccess(
                "Vehicle saved successfully."
            );

        }


        photoInput.value =
            "";


        preview.style.display =
            "none";


        rawText.innerText =
            "";


        ocrStatus.innerText =
            "Vehicle saved. You can upload another photo.";

    }
    catch(error){

        console.error(
            "SAVE ERROR:",
            error
        );


        showError(
            "Could not save vehicle. " +
            (
                error?.message ||
                "Please try again."
            )
        );

    }
    finally{

        saveButton.disabled =
            false;

        saveButton.innerText =
            "💾 Save Vehicle";

    }

}


/* =========================================================
   BUTTONS
========================================================= */

readButton.addEventListener(
    "click",
    readPhoto
);


saveButton.addEventListener(
    "click",
    saveVehicle
);


dashboardButton.addEventListener(
    "click",
    function(){

        window.location.href =
            "index.html";

    }
);


/* =========================================================
   MESSAGES
========================================================= */

function showSuccess(message){

    const box =
        document.getElementById(
            "successMessage"
        );

    box.innerText =
        message;

    box.style.display =
        "block";

}


function showError(message){

    const box =
        document.getElementById(
            "errorMessage"
        );

    box.innerText =
        message;

    box.style.display =
        "block";

}


function hideMessages(){

    document.getElementById(
        "successMessage"
    ).style.display =
        "none";

    document.getElementById(
        "errorMessage"
    ).style.display =
        "none";

}

</script>
