<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Vehicle Photo - RV Vehicle Reminder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#222;
}

.header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:24px;
}

.container{
    max-width:900px;
    margin:20px auto;
    padding:0 15px;
}

.card{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
}

h2{
    margin-top:0;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:6px;
}

input[type="text"],
input[type="date"]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

input[type="file"]{
    width:100%;
    padding:10px;
}

button{
    border:0;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    margin-top:15px;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.btn-secondary{
    background:#6b7280;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#preview{
    width:100%;
    max-height:450px;
    object-fit:contain;
    display:none;
    margin-top:15px;
    border-radius:10px;
    border:1px solid #ddd;
}

.progress{
    width:100%;
    height:10px;
    background:#e5e7eb;
    border-radius:10px;
    overflow:hidden;
    margin-top:15px;
    display:none;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#2563eb;
    transition:.2s;
}

.status{
    margin-top:10px;
    font-weight:bold;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.full{
    grid-column:1 / -1;
}

.action-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.note{
    background:#eff6ff;
    border-left:4px solid #2563eb;
    padding:12px;
    margin-top:15px;
    border-radius:6px;
    line-height:1.5;
}

.success{
    background:#ecfdf5;
    color:#166534;
    padding:12px;
    border-radius:8px;
    display:none;
    margin-top:15px;
}

.error{
    background:#fef2f2;
    color:#991b1b;
    padding:12px;
    border-radius:8px;
    display:none;
    margin-top:15px;
}

@media(max-width:650px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .header h1{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>RV Vehicle Reminder</h1>
</div>

<div class="container">

    <div class="card">

        <h2>Upload Vehicle Photo</h2>

        <input
            type="file"
            id="photoInput"
            accept="image/*"
            onchange="previewPhoto()"
        >

        <img id="preview" alt="Vehicle Photo Preview">

        <div class="progress" id="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="status" id="ocrStatus"></div>

        <button
            class="btn-primary"
            id="readButton"
            onclick="readPhoto()"
        >
            Read Vehicle Details
        </button>

        <div class="note">
            Upload a clear VAHAN / vehicle details screenshot.
            OCR will try to read Vehicle Number, Registration Date,
            Fitness, Insurance, Tax, PUCC and Permit details.
        </div>

    </div>


    <div class="card">

        <h2>Vehicle Details</h2>

        <div class="form-grid">

            <div class="full">
                <label>Vehicle Number</label>
                <input type="text" id="vehicleNumber" placeholder="GJ04AB1234">
            </div>

            <div>
                <label>Registration Date</label>
                <input type="date" id="registrationDate">
            </div>

            <div>
                <label>Fitness Expiry</label>
                <input type="date" id="fitness">
            </div>

            <div>
                <label>Insurance Expiry</label>
                <input type="date" id="insurance">
            </div>

            <div>
                <label>Tax</label>
                <input
                    type="text"
                    id="tax"
                    placeholder="LTT / LTP"
                >
            </div>

            <div>
                <label>PUCC Expiry</label>
                <input type="date" id="pucc">
            </div>

            <div>
                <label>Permit Expiry</label>
                <input type="date" id="permit">
            </div>

        </div>

        <div id="successMessage" class="success"></div>
        <div id="errorMessage" class="error"></div>

        <div class="action-buttons">

            <button
                class="btn-success"
                id="saveButton"
                onclick="saveVehicle()"
            >
                Save Vehicle
            </button>

            <button
                class="btn-secondary"
                onclick="goDashboard()"
            >
                Dashboard
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
"https://lqbhafspabtlqeubqxjg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const STORAGE_BUCKET = "vehicle-photos";


/* =========================================================
   PHOTO PREVIEW
========================================================= */

function previewPhoto(){

    const input =
        document.getElementById("photoInput");

    const preview =
        document.getElementById("preview");

    if(!input.files || !input.files[0]){
        preview.style.display = "none";
        return;
    }

    const file = input.files[0];

    preview.src =
        URL.createObjectURL(file);

    preview.style.display = "block";
}


/* =========================================================
   OCR
========================================================= */

async function readPhoto(){

    const input =
        document.getElementById("photoInput");

    const status =
        document.getElementById("ocrStatus");

    const button =
        document.getElementById("readButton");

    if(!input.files || !input.files[0]){

        alert("Please select a vehicle photo first.");

        return;
    }

    button.disabled = true;

    status.innerText =
        "Reading vehicle photo... Please wait.";

    document.getElementById("progress").style.display =
        "block";

    document.getElementById("progressBar").style.width =
        "0%";

    try{

        const result =
            await Tesseract.recognize(
                input.files[0],
                "eng",
                {
                    logger: function(info){

                        if(info.status === "recognizing text"){

                            const percent =
                                Math.round(
                                    info.progress * 100
                                );

                            document.getElementById(
                                "progressBar"
                            ).style.width =
                                percent + "%";

                            status.innerText =
                                "Reading photo... " +
                                percent +
                                "%";
                        }
                    }
                }
            );

        const text =
            result.data.text;

        console.log("OCR TEXT:");
        console.log(text);

        extractVehicleData(text);

        status.innerText =
            "Vehicle details extracted. Please check and edit before saving.";

    }catch(error){

        console.error(error);

        status.innerText =
            "OCR failed. Please try a clearer photo.";

        showError(
            "Could not read the photo."
        );

    }finally{

        button.disabled = false;

    }
}


/* =========================================================
   DATE PATTERN
========================================================= */

const datePattern =
    "(\\d{1,2}[\\/-](?:\\d{1,2}|Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)[\\/-]\\d{4})";


/* =========================================================
   FIND DATE
========================================================= */

function findDate(text, patterns){

    for(const pattern of patterns){

        const match =
            text.match(pattern);

        if(match && match[1]){
            return match[1];
        }
    }

    return "";
}


/* =========================================================
   VEHICLE DATA EXTRACTION
========================================================= */

function extractVehicleData(text){

    const clean =
        text.replace(/\r/g," ");

    /* Clear old values */

    document.getElementById("vehicleNumber").value = "";
    document.getElementById("registrationDate").value = "";
    document.getElementById("fitness").value = "";
    document.getElementById("insurance").value = "";
    document.getElementById("tax").value = "";
    document.getElementById("pucc").value = "";
    document.getElementById("permit").value = "";


    /* =====================================================
       VEHICLE NUMBER
    ===================================================== */

    const vehicleMatch =
        clean.match(
            /\b[A-Z]{2}\s?\d{1,2}\s?[A-Z]{1,3}\s?\d{3,4}\b/i
        );

    if(vehicleMatch){

        document.getElementById("vehicleNumber").value =
            vehicleMatch[0]
                .replace(/\s+/g,"")
                .toUpperCase();
    }


    /* =====================================================
       REGISTRATION DATE
    ===================================================== */

    const registrationDate =
        findDate(
            clean,
            [
                new RegExp(
                    "(?:Registration\\s*Date|Registered\\s*Date|Date\\s*of\\s*Registration)[\\s:\\-]*" +
                    datePattern,
                    "i"
                )
            ]
        );

    if(registrationDate){

        document.getElementById("registrationDate").value =
            convertDate(registrationDate);
    }


    /* =====================================================
       FITNESS
    ===================================================== */

    const fitnessDate =
        findDate(
            clean,
            [
                new RegExp(
                    "(?:Fitness\\s*Valid\\s*Up\\s*To|Fitness\\s*Valid\\s*Upto|Fitness\\s*Expiry|Fitness)[\\s:\\-]*" +
                    datePattern,
                    "i"
                )
            ]
        );

    if(fitnessDate){

        document.getElementById("fitness").value =
            convertDate(fitnessDate);
    }


    /* =====================================================
       INSURANCE
    ===================================================== */

    const insuranceDate =
        findDate(
            clean,
            [
                new RegExp(
                    "(?:Insurance\\s*Valid\\s*Up\\s*To|Insurance\\s*Valid\\s*Upto|Insurance\\s*Expiry|Insurance)[\\s:\\-]*" +
                    datePattern,
                    "i"
                )
            ]
        );

    if(insuranceDate){

        document.getElementById("insurance").value =
            convertDate(insuranceDate);
    }


    /* =====================================================
       PUCC
    ===================================================== */

    const puccDate =
        findDate(
            clean,
            [
                new RegExp(
                    "(?:PUCC\\s*Valid\\s*Up\\s*To|PUCC\\s*Valid\\s*Upto|PUC\\s*Valid\\s*Up\\s*To|PUC\\s*Valid\\s*Upto|PUCC\\s*Expiry|PUC\\s*Expiry)[\\s:\\-]*" +
                    datePattern,
                    "i"
                )
            ]
        );

    if(puccDate){

        document.getElementById("pucc").value =
            convertDate(puccDate);
    }


    /* =====================================================
       TAX
       ONLY LTT / LTP
    ===================================================== */

    const taxMatch =
        clean.match(
            /(?:MV\s*Tax|Tax\s*Valid\s*Up\s*To|Tax\s*Valid\s*Upto|Tax)[\s:\-]*(LTT|LTP)\b/i
        );

    if(taxMatch){

        document.getElementById("tax").value =
            taxMatch[1].toUpperCase();

    }else{

        document.getElementById("tax").value = "";

    }


    /* =====================================================
       PERMIT
       ONLY READ WHEN PERMIT LABEL EXISTS
    ===================================================== */

    const permitDate =
        findDate(
            clean,
            [
                new RegExp(
                    "(?:Permit\\s*Valid\\s*Up\\s*To|Permit\\s*Valid\\s*Upto|Permit\\s*Expiry|Permit)[\\s:\\-]*" +
                    datePattern,
                    "i"
                )
            ]
        );

    if(permitDate){

        document.getElementById("permit").value =
            convertDate(permitDate);
    }

}


/* =========================================================
   CONVERT OCR DATE TO YYYY-MM-DD
========================================================= */

function convertDate(value){

    if(!value){
        return "";
    }

    value =
        value.trim()
            .replace(/\//g,"-");

    const parts =
        value.split("-");

    if(parts.length !== 3){
        return "";
    }

    let day =
        parts[0].trim();

    let month =
        parts[1].trim();

    let year =
        parts[2].trim();


    const months = {

        jan:"01",
        january:"01",

        feb:"02",
        february:"02",

        mar:"03",
        march:"03",

        apr:"04",
        april:"04",

        may:"05",

        jun:"06",
        june:"06",

        jul:"07",
        july:"07",

        aug:"08",
        august:"08",

        sep:"09",
        sept:"09",
        september:"09",

        oct:"10",
        october:"10",

        nov:"11",
        november:"11",

        dec:"12",
        december:"12"
    };


    if(isNaN(month)){

        const key =
            month.toLowerCase();

        month =
            months[key] || "";
    }else{

        month =
            month.padStart(2,"0");
    }


    day =
        day.padStart(2,"0");


    if(
        !year ||
        !month ||
        !day
    ){
        return "";
    }


    return `${year}-${month}-${day}`;
}


/* =========================================================
   NORMALIZE VEHICLE NUMBER
========================================================= */

function normalizeVehicleNumber(number){

    return (number || "")
        .replace(/[\s-]/g,"")
        .toUpperCase()
        .trim();

}


/* =========================================================
   CREATE PHOTO PATH
========================================================= */

function createPhotoPath(vehicleNumber){

    const safeNumber =
        normalizeVehicleNumber(vehicleNumber)
            .replace(/[^A-Z0-9]/g,"");

    return safeNumber +
        "_" +
        Date.now() +
        ".jpg";
}


/* =========================================================
   SAVE VEHICLE
========================================================= */

async function saveVehicle(){

    hideMessages();


    const vehicleNumber =
        normalizeVehicleNumber(
            document.getElementById("vehicleNumber").value
        );

    const registrationDate =
        document.getElementById("registrationDate").value;

    const fitness =
        document.getElementById("fitness").value;

    const insurance =
        document.getElementById("insurance").value;

    const tax =
        document.getElementById("tax").value
            .trim()
            .toUpperCase();

    const pucc =
        document.getElementById("pucc").value;

    const permit =
        document.getElementById("permit").value;


    if(!vehicleNumber){

        showError(
            "Vehicle Number is required."
        );

        return;
    }


    const saveButton =
        document.getElementById("saveButton");

    saveButton.disabled = true;

    saveButton.innerText =
        "Saving...";


    try{

        /* =================================================
           CHECK EXISTING VEHICLE
        ================================================= */

        const { data: existingRows, error: findError } =
            await supabaseClient
                .from("vehicles")
                .select("*")
                .eq("vehicle_number", vehicleNumber)
                .limit(1);


        if(findError){

            throw findError;

        }


        const existing =
            existingRows &&
            existingRows.length
                ? existingRows[0]
                : null;


        /* =================================================
           PHOTO UPLOAD
        ================================================= */

        let photoPath =
            existing?.photo_path || null;

        let photoUrl =
            existing?.photo_url || null;


        const photoInput =
            document.getElementById("photoInput");


        if(
            photoInput.files &&
            photoInput.files[0]
        ){

            const file =
                photoInput.files[0];


            /*
             * First upload new photo
             */

            const newPath =
                createPhotoPath(vehicleNumber);


            const { error: uploadError } =
                await supabaseClient
                    .storage
                    .from(STORAGE_BUCKET)
                    .upload(
                        newPath,
                        file,
                        {
                            cacheControl:"3600",
                            upsert:false,
                            contentType:file.type || "image/jpeg"
                        }
                    );


            if(uploadError){

                throw uploadError;

            }


            /*
             * Get public URL
             */

            const { data: publicData } =
                supabaseClient
                    .storage
                    .from(STORAGE_BUCKET)
                    .getPublicUrl(newPath);


            photoPath =
                newPath;

            photoUrl =
                publicData.publicUrl;


            /*
             * Delete old photo AFTER
             * successful new upload
             */

            if(
                existing &&
                existing.photo_path &&
                existing.photo_path !== newPath
            ){

                const { error: deleteOldError } =
                    await supabaseClient
                        .storage
                        .from(STORAGE_BUCKET)
                        .remove([
                            existing.photo_path
                        ]);


                if(deleteOldError){

                    console.warn(
                        "Old photo delete warning:",
                        deleteOldError
                    );

                }
            }
        }


        /* =================================================
           VEHICLE DATA
        ================================================= */

        const vehicleData = {

            vehicle_number:
                vehicleNumber,

            registration_date:
                registrationDate || null,

            fitness_expiry:
                fitness || null,

            insurance_expiry:
                insurance || null,

            tax_expiry:
                tax || null,

            pucc_expiry:
                pucc || null,

            permit_expiry:
                permit || null,

            photo_path:
                photoPath,

            photo_url:
                photoUrl
        };


        /* =================================================
           INSERT OR UPDATE
        ================================================= */

        let saveResult;


        if(existing){

            saveResult =
                await supabaseClient
                    .from("vehicles")
                    .update(vehicleData)
                    .eq("id", existing.id);

        }else{

            saveResult =
                await supabaseClient
                    .from("vehicles")
                    .insert([vehicleData]);

        }


        if(saveResult.error){

            throw saveResult.error;

        }


        /* =================================================
           SUCCESS
        ================================================= */

        if(existing){

            showSuccess(
                "Vehicle updated successfully. Old photo replaced."
            );

        }else{

            showSuccess(
                "Vehicle saved successfully."
            );

        }


        /*
         * Clear selected photo
         */

        document.getElementById("photoInput").value = "";

        document.getElementById("preview").style.display =
            "none";


        /*
         * Keep vehicle details visible
         */

    }catch(error){

        console.error(
            "SAVE ERROR:",
            error
        );

        showError(
            "Save failed: " +
            (error.message || "Unknown error")
        );

    }finally{

        saveButton.disabled = false;

        saveButton.innerText =
            "Save Vehicle";

    }

}


/* =========================================================
   DASHBOARD
========================================================= */

function goDashboard(){

    window.location.href =
        "index.html";

}


/* =========================================================
   MESSAGES
========================================================= */

function showSuccess(message){

    const box =
        document.getElementById(
            "successMessage"
        );

    box.innerText =
        message;

    box.style.display =
        "block";

}


function showError(message){

    const box =
        document.getElementById(
            "errorMessage"
        );

    box.innerText =
        message;

    box.style.display =
        "block";

}


function hideMessages(){

    document.getElementById(
        "successMessage"
    ).style.display =
        "none";

    document.getElementById(
        "errorMessage"
    ).style.display =
        "none";

}

</script>

</body>
</html>
