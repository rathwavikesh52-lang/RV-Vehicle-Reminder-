<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RV Vehicle Reminder - OCR Upload</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.header{
  background:linear-gradient(135deg,#087cf5,#00b4ff);
  color:white;
  padding:22px;
  border-radius:0 0 25px 25px;
}

.container{
  max-width:600px;
  margin:auto;
  padding:18px;
}

.box{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:18px;
  box-shadow:0 4px 15px #dce5f0;
}

label{
  display:block;
  margin-top:14px;
  font-weight:bold;
  font-size:14px;
}

input{
  width:100%;
  padding:13px;
  margin-top:6px;
  border:1px solid #d5dce8;
  border-radius:10px;
  font-size:15px;
  box-sizing:border-box;
}

.preview{
  width:100%;
  max-height:300px;
  object-fit:contain;
  margin-top:15px;
  border-radius:12px;
  display:none;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  margin-top:15px;
  font-size:16px;
  font-weight:bold;
  background:#087cf5;
  color:white;
}

.ocr{
  background:#16a34a;
}

.back{
  background:#64748b;
}

#loading{
  display:none;
  text-align:center;
  padding:15px;
  color:#087cf5;
  font-weight:bold;
}

#result{
  display:none;
}
</style>

<!-- OCR Library -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

</head>

<body>

<div class="header">
  <h2>📸 Upload Vehicle Photo</h2>
  <p>RV Vehicle Reminder</p>
</div>

<div class="container">

<div class="box">

  <h2>📷 Vehicle Screenshot</h2>

  <input
    type="file"
    id="photo"
    accept="image/*"
    onchange="previewPhoto()">

  <img id="preview" class="preview">

  <button class="ocr" onclick="readPhoto()">
    🔎 Read Vehicle Details
  </button>

  <div id="loading">
    ⏳ Photo વાંચી રહ્યા છીએ... થોડી રાહ જુઓ.
  </div>

</div>

<div class="box" id="result">

  <h2>🚘 Vehicle Details</h2>

  <label>Vehicle Number</label>
  <input id="vehicleNumber" placeholder="GJ01AB1234">

  <label>Registration Date</label>
  <input type="date" id="registrationDate">

  <label>Fitness Expiry</label>
  <input type="date" id="fitness">

  <label>Insurance Expiry</label>
  <input type="date" id="insurance">

  <label>Tax Expiry</label>
  <input type="text" id="tax" placeholder="LTT / Date">

  <label>PUCC Expiry</label>
  <input type="date" id="pucc">

  <label>Permit Expiry</label>
  <input type="date" id="permit">

  <button onclick="saveVehicle()">
    💾 Confirm & Save
  </button>

</div>

<button class="back" onclick="history.back()">
  ⬅️ Back
</button>

</div>

<script>

let selectedPhoto = null;

function previewPhoto(){

  const file =
    document.getElementById("photo").files[0];

  if(!file) return;

  selectedPhoto = file;

  const preview =
    document.getElementById("preview");

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
}


async function readPhoto(){

  if(!selectedPhoto){

    alert("📸 પહેલા Vehicle Photo પસંદ કરો.");
    return;
  }

  document.getElementById("loading").style.display="block";

  try{

    const result =
      await Tesseract.recognize(
        selectedPhoto,
        "eng"
      );

    const text =
      result.data.text;

    console.log(text);

    extractVehicleData(text);

    document.getElementById("result").style.display="block";

  }catch(error){

    console.error(error);

    alert(
      "❌ Photo વાંચવામાં સમસ્યા આવી. કૃપા કરીને સ્પષ્ટ screenshot upload કરો."
    );

  }

  document.getElementById("loading").style.display="none";
}


function extractVehicleData(text){

  const clean =
    text.replace(/\r/g,"");

  /*
    Vehicle Number
    Example:
    GJ16AW3752
    GJ06FH4718
  */

  const vehicleMatch =
    clean.match(
      /\b[A-Z]{2}\s?\d{1,2}\s?[A-Z]{1,3}\s?\d{3,4}\b/i
    );

  if(vehicleMatch){

    document.getElementById("vehicleNumber").value =
      vehicleMatch[0]
      .replace(/\s/g,"")
      .toUpperCase();
  }


  /*
    Date converter
  */

  function findDate(patterns){

    for(const pattern of patterns){

      const match =
        clean.match(pattern);

      if(match){

        return convertDate(match[1]);
      }
    }

    return "";
  }


  /*
    Registration Date
  */

  const registration =
    findDate([
      /Registration Date\s*[:\-]?\s*(\d{1,2}[-\/][A-Za-z]{3}[-\/]\d{4})/i,
      /Registration Date\s*[:\-]?\s*(\d{1,2}[-\/]\d{1,2}[-\/]\d{4})/i
    ]);

  if(registration)
    document.getElementById("registrationDate").value=registration;


  /*
    Fitness
  */

  const fitness =
    findDate([
      /Fitness\/REGN\s*[:\-]?\s*(\d{1,2}[-\/][A-Za-z]{3}[-\/]\d{4})/i,
      /Fitness Valid UpTo\s*[:\-]?\s*(\d{1,2}[-\/][A-Za-z]{3}[-\/]\d{4})/i
    ]);

  if(fitness)
    document.getElementById("fitness").value=fitness;


  /*
    Insurance
  */

  const insurance =
    findDate([
      /Insurance Valid UpTo\s*[:\-]?\s*(\d{1,2}[-\/][A-Za-z]{3}[-\/]\d{4})/i,
      /Insurance\s*Validity\s*[:\-]?\s*(\d{1,2}[-\/][A-Za-z]{3}[-\/]\d{4})/i,
      /Validity\s*[:\-]?\s*(\d{1,2}[-\/][A-Za-z]{3}[-\/]\d{4})/i
    ]);

  if(insurance)
    document.getElementById("insurance").value=insurance;


  /*
    PUCC
  */

  const pucc =
    findDate([
      /PUCC\s*[:\-]?\s*(\d{1,2}[-\/][A-Za-z]{3}[-\/]\d{4})/i,
      /PUCC Valid UpTo\s*[:\-]?\s*(\d{1,2}[-\/][A-Za-z]{3}[-\/]\d{4})/i
    ]);

  if(pucc)
    document.getElementById("pucc").value=pucc;


  /*
    Permit
  */

  const permit =
    findDate([
      /Valid upto\s*[:\-]?\s*(\d{1,2}[-\/][A-Za-z]{3}[-\/]\d{4})/i
    ]);

  if(permit)
    document.getElementById("permit").value=permit;


  /*
    Tax

    Some RC Status screenshots show:
    MV Tax: LTT

    So we keep text if no date is available.
  */

  const taxMatch =
    clean.match(
      /MV Tax\s*[:\-]?\s*([A-Za-z0-9\-\/]+)/i
    );

  if(taxMatch){

    document.getElementById("tax").value =
      taxMatch[1].trim();
  }

}


function convertDate(value){

  if(!value) return "";

  value =
    value.replace(/\//g,"-");

  const parts =
    value.split("-");

  if(parts.length !== 3)
    return "";

  let day = parts[0];
  let month = parts[1];
  let year = parts[2];

  const months = {
    Jan:"01",
    Feb:"02",
    Mar:"03",
    Apr:"04",
    May:"05",
    Jun:"06",
    Jul:"07",
    Aug:"08",
    Sep:"09",
    Oct:"10",
    Nov:"11",
    Dec:"12"
  };

  if(months[month])
    month = months[month];

  if(!/^\d+$/.test(month))
    return "";

  return `${year}-${month.padStart(2,"0")}-${day.padStart(2,"0")}`;
}


function saveVehicle(){

  const vehicleNumber =
    document
    .getElementById("vehicleNumber")
    .value
    .trim()
    .toUpperCase();

  if(!vehicleNumber){

    alert("❌ Vehicle Number મળ્યો નથી.");
    return;
  }

  let vehicles =
    JSON.parse(
      localStorage.getItem("vehicles")
    ) || [];


  const newVehicle = {

    vehicleNumber:

      vehicleNumber
      .replace(/\s/g,""),

    registrationDate:
      document.getElementById(
        "registrationDate"
      ).value,

    fitness:
      document.getElementById(
        "fitness"
      ).value,

    insurance:
      document.getElementById(
        "insurance"
      ).value,

    tax:
      document.getElementById(
        "tax"
      ).value,

    pucc:
      document.getElementById(
        "pucc"
      ).value,

    permit:
      document.getElementById(
        "permit"
      ).value,

    updatedAt:
      new Date().toISOString()
  };


  const existingIndex =
    vehicles.findIndex(
      v =>
      v.vehicleNumber ===
      newVehicle.vehicleNumber
    );


  if(existingIndex !== -1){

    vehicles[existingIndex] =
      newVehicle;

    alert(
      "🔄 Vehicle પહેલેથી હાજર હતું.\nજૂની માહિતી Update થઈ ગઈ."
    );

  }else{

    vehicles.push(newVehicle);

    alert(
      "✅ Vehicle Successfully Saved!"
    );
  }


  localStorage.setItem(
    "vehicles",
    JSON.stringify(vehicles)
  );

}

</script>

</body>
</html>
