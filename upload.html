/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalizeText(text){

  if(!text){
    return "";
  }


  return text

    .replace(/\r/g,"\n")

    .replace(/[ \t]+/g," ")

    .replace(/\n{2,}/g,"\n")

    .split("\n")

    .map(
      x => x.trim()
    )

    .filter(Boolean)

    .join("\n")

    .trim();

}


/* =========================================================
   DATE CONVERSION
========================================================= */

function convertOCRDate(value){

  if(!value){
    return "";
  }


  value =
  value
    .trim()
    .replace(/[|]/g,"")
    .replace(/\s+/g," ");


  const months = {

    JAN:"01",
    FEB:"02",
    MAR:"03",
    APR:"04",
    MAY:"05",
    JUN:"06",
    JUL:"07",
    AUG:"08",
    SEP:"09",
    OCT:"10",
    NOV:"11",
    DEC:"12"

  };


  /* -------------------------------------------------------
     DD-MMM-YYYY
  ------------------------------------------------------- */

  let m =
  value.match(
    /\b(\d{1,2})[-\/.\s]([A-Za-z]{3,9})[-\/.\s](\d{4})\b/i
  );


  if(m){

    const day =
    String(m[1]).padStart(2,"0");

    const month =
    m[2]
      .substring(0,3)
      .toUpperCase();

    const year =
    m[3];


    if(months[month]){

      return (
        day +
        "/" +
        months[month] +
        "/" +
        year
      );

    }

  }


  /* -------------------------------------------------------
     YYYY-MM-DD
  ------------------------------------------------------- */

  m =
  value.match(
    /\b(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/
  );


  if(m){

    return (

      String(m[3]).padStart(2,"0") +
      "/" +
      String(m[2]).padStart(2,"0") +
      "/" +
      m[1]

    );

  }


  /* -------------------------------------------------------
     DD/MM/YYYY
  ------------------------------------------------------- */

  m =
  value.match(
    /\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})\b/
  );


  if(m){

    const day =
    Number(m[1]);

    const month =
    Number(m[2]);

    const year =
    Number(m[3]);


    if(
      day >= 1 &&
      day <= 31 &&
      month >= 1 &&
      month <= 12 &&
      year >= 1900 &&
      year <= 2100
    ){

      return (

        String(day).padStart(2,"0") +
        "/" +
        String(month).padStart(2,"0") +
        "/" +
        year

      );

    }

  }


  return "";

}


/* =========================================================
   FIND DATE IN ONE LINE
========================================================= */

function findDateInLine(line){

  if(!line){
    return "";
  }


  const patterns = [

    /\b\d{1,2}[-\/.\s][A-Za-z]{3,9}[-\/.\s]\d{4}\b/i,

    /\b\d{1,2}[-\/.]\d{1,2}[-\/.]\d{4}\b/,

    /\b\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2}\b/

  ];


  for(
    const pattern of patterns
  ){

    const match =
    line.match(pattern);


    if(match){

      const date =
      convertOCRDate(
        match[0]
      );


      if(date){
        return date;
      }

    }

  }


  return "";

}


/* =========================================================
   FIELD LABELS
========================================================= */

const ALL_FIELD_LABELS = [

  "REGISTRATION DATE",
  "REGN DATE",
  "REG DATE",

  "FITNESS VALID UPTO",
  "FITNESS VALID UP TO",
  "FITNESS/REGN",
  "FITNESS",

  "TAX VALID UPTO",
  "TAX VALID UP TO",
  "MV TAX",
  "TAX",

  "INSURANCE VALID UPTO",
  "INSURANCE VALID UP TO",
  "INSURANCE",

  "PUCC VALID UPTO",
  "PUCC VALID UP TO",
  "PUCC",

  "PERMIT VALID UPTO",
  "PERMIT VALID UP TO",
  "PERMIT",

  "VEHICLE NUMBER",
  "VEHICLE NO",
  "REGISTRATION NUMBER",
  "REGISTRATION NO",

  "VEHICLE CLASS"

];


function isAnotherFieldLabel(line){

  if(!line){
    return false;
  }


  const upper =
  line
    .toUpperCase()
    .replace(/\s+/g," ")
    .trim();


  return ALL_FIELD_LABELS.some(
    label =>
    upper.includes(label)
  );

}


/* =========================================================
   STRICT FIELD DATE
========================================================= */

function findStrictFieldDate(
  text,
  labels
){

  const lines =
  text
    .split(/\n/)
    .map(
      x => x.trim()
    )
    .filter(Boolean);


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const line =
    lines[i];

    const upper =
    line.toUpperCase();


    const matchedLabel =
    labels.find(
      label =>
      upper.includes(label)
    );


    if(!matchedLabel){
      continue;
    }


    /* -----------------------------------------------------
       SAME LINE
    ----------------------------------------------------- */

    const labelIndex =
    upper.indexOf(
      matchedLabel
    );


    const afterLabel =
    line.substring(
      labelIndex +
      matchedLabel.length
    );


    const sameLineDate =
    findDateInLine(
      afterLabel
    );


    if(sameLineDate){

      return sameLineDate;

    }


    /* -----------------------------------------------------
       NEXT 2 LINES
    ----------------------------------------------------- */

    for(
      let j=i+1;
      j<=Math.min(
        i+2,
        lines.length-1
      );
      j++
    ){

      const next =
      lines[j];


      /*
        NEVER cross another field.
      */

      if(
        isAnotherFieldLabel(
          next
        )
      ){

        break;

      }


      const date =
      findDateInLine(
        next
      );


      if(date){

        return date;

      }

    }

  }


  return "";

}


/* =========================================================
   STRICT TAX
========================================================= */

function findStrictTax(text){

  const lines =
  text
    .split(/\n/)
    .map(
      x => x.trim()
    )
    .filter(Boolean);


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const line =
    lines[i];

    const upper =
    line.toUpperCase();


    const hasTaxLabel =
    (
      upper.includes(
        "TAX VALID UPTO"
      ) ||

      upper.includes(
        "TAX VALID UP TO"
      ) ||

      upper.includes(
        "MV TAX"
      ) ||

      upper.includes(
        "TAX:"
      )
    );


    if(!hasTaxLabel){
      continue;
    }


    /* =====================================================
       LTT HAS FIRST PRIORITY
    ===================================================== */

    if(
      /\bLTT\b/.test(
        upper
      )
    ){

      return "LTT";

    }


    /*
      Common OCR mistakes.

      These are accepted ONLY on a TAX line
      or immediately following TAX value line.
    */

    if(
      /\b(L7T|LT7|LIT|LII)\b/.test(
        upper
      )
    ){

      return "LTT";

    }


    /* -----------------------------------------------------
       SAME LINE DATE
    ----------------------------------------------------- */

    const sameLineDate =
    findDateInLine(
      line
    );


    if(sameLineDate){

      return sameLineDate;

    }


    /* -----------------------------------------------------
       NEXT LINES
    ----------------------------------------------------- */

    for(
      let j=i+1;
      j<=Math.min(
        i+2,
        lines.length-1
      );
      j++
    ){

      const next =
      lines[j];

      const nextUpper =
      next.toUpperCase();


      /*
        Stop at another field.
      */

      if(
        isAnotherFieldLabel(
          next
        )
      ){

        break;

      }


      if(
        /\bLTT\b/.test(
          nextUpper
        )
      ){

        return "LTT";

      }


      if(
        /\b(L7T|LT7|LIT|LII)\b/.test(
          nextUpper
        )
      ){

        return "LTT";

      }


      const date =
      findDateInLine(
        next
      );


      if(date){

        return date;

      }

    }

  }


  /*
    NEVER take a random date
    when Tax label is absent.
  */

  return "";

}


/* =========================================================
   VEHICLE NUMBER CLEANING
========================================================= */

function cleanVehicleNumber(
  value
){

  if(!value){
    return "";
  }


  let v =
  value
    .toUpperCase()
    .replace(
      /[^A-Z0-9]/g,
      ""
    );


  /*
    Fix common GJ OCR errors.
  */

  if(
    v.startsWith("GIO")
  ){

    v =
    "GJ0" +
    v.substring(3);

  }


  if(
    v.startsWith("GJO")
  ){

    v =
    "GJ0" +
    v.substring(3);

  }


  /*
    Fix numeric RTO section only.
  */

  if(
    v.startsWith("GJ") &&
    v.length >= 4
  ){

    const chars =
    v.split("");


    const corrections = {

      O:"0",
      Q:"0",
      D:"0",

      I:"1",
      L:"1",

      S:"5",
      B:"8",
      Z:"2"

    };


    for(
      let i=2;
      i<4;
      i++
    ){

      if(
        corrections[
          chars[i]
        ]
      ){

        chars[i] =
        corrections[
          chars[i]
        ];

      }

    }


    v =
    chars.join("");

  }


  /*
    Separate prefix and number.
  */

  const match =
  v.match(
    /^(GJ\d{2}[A-Z]{1,3})([A-Z0-9]{3,5})$/
  );


  if(match){

    const prefix =
    match[1];

    let numberPart =
    match[2];


    numberPart =
    numberPart
      .replace(/O/g,"0")
      .replace(/Q/g,"0")
      .replace(/D/g,"0")
      .replace(/I/g,"1")
      .replace(/L/g,"1")
      .replace(/S/g,"5")
      .replace(/B/g,"8")
      .replace(/Z/g,"2");


    v =
    prefix +
    numberPart;

  }


  return v;

}


/* =========================================================
   VEHICLE NUMBER FORMAT
========================================================= */

function isVehicleNumberFormat(
  value
){

  if(!value){
    return false;
  }


  return /^GJ\d{2}[A-Z]{1,3}\d{3,5}$/
    .test(value);

}


/* =========================================================
   VEHICLE NUMBER EXTRACTION
========================================================= */

function extractVehicleCandidates(
  text
){

  if(!text){
    return [];
  }


  const upper =
  text.toUpperCase();


  const candidates = [];


  const patterns = [

    /\bGJ[\s\-]?\d{2}[\s\-]?[A-Z0-9]{1,3}[\s\-]?[A-Z0-9]{3,5}\b/g,

    /\bGJ[A-Z0-9]{8,11}\b/g

  ];


  for(
    const pattern of patterns
  ){

    const matches =
    upper.match(pattern);


    if(!matches){
      continue;
    }


    matches.forEach(
      item => {

        const cleaned =
        cleanVehicleNumber(
          item
        );


        if(
          isVehicleNumberFormat(
            cleaned
          )
        ){

          candidates.push(
            cleaned
          );

        }

      }
    );

  }


  /*
    Compact fallback.
  */

  const compact =
  upper.replace(
    /[^A-Z0-9]/g,
    ""
  );


  const compactMatches =
  compact.match(
    /GJ[A-Z0-9]{8,11}/g
  );


  if(compactMatches){

    compactMatches.forEach(
      item => {

        const cleaned =
        cleanVehicleNumber(
          item
        );


        if(
          isVehicleNumberFormat(
            cleaned
          )
        ){

          candidates.push(
            cleaned
          );

        }

      }
    );

  }


  return [
    ...new Set(
      candidates
    )
  ];

}


/* =========================================================
   VEHICLE NUMBER FROM LABEL
========================================================= */

function findVehicleNumberFromLabel(
  text
){

  const lines =
  text
    .split(/\n/)
    .map(
      x => x.trim()
    )
    .filter(Boolean);


  const labels = [

    "VEHICLE NUMBER",
    "VEHICLE NO",
    "REGISTRATION NUMBER",
    "REGISTRATION NO"

  ];


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const upper =
    lines[i].toUpperCase();


    const foundLabel =
    labels.find(
      label =>
      upper.includes(label)
    );


    if(!foundLabel){
      continue;
    }


    /*
      Same line
    */

    const same =
    extractVehicleCandidates(
      lines[i]
    );


    if(same.length){

      return chooseBestVehicleNumber(
        same
      );

    }


    /*
      Next line
    */

    if(
      i+1 <
      lines.length
    ){

      const next =
      extractVehicleCandidates(
        lines[i+1]
      );


      if(next.length){

        return chooseBestVehicleNumber(
          next
        );

      }

    }

  }


  return "";

}


/* =========================================================
   CHOOSE VEHICLE NUMBER
========================================================= */

function chooseBestVehicleNumber(
  candidates
){

  if(
    !candidates.length
  ){

    return "";

  }


  const scored =
  candidates.map(
    value => {

      let score = 0;


      if(
        isVehicleNumberFormat(
          value
        )
      ){

        score += 100;

      }


      if(
        /^GJ\d{2}/.test(
          value
        )
      ){

        score += 50;

      }


      if(
        /^GJ\d{2}[A-Z]{1,3}\d{4}$/
          .test(value)
      ){

        score += 30;

      }


      return {
        value:value,
        score:score
      };

    }
  );


  scored.sort(
    (a,b) =>
    b.score -
    a.score
  );


  return scored[0].value;

}


/* =========================================================
   VEHICLE CLASS
========================================================= */

function findVehicleClass(
  text
){

  if(!text){
    return "";
  }


  const upper =
  text.toUpperCase();


  /*
    Exact codes first.
  */

  if(
    /\b2WN\b/.test(
      upper
    )
  ){

    return "2WN";

  }


  if(
    /\b3WT\b/.test(
      upper
    )
  ){

    return "3WT";

  }


  if(
    /\bHGV\b/.test(
      upper
    )
  ){

    return "HGV";

  }


  if(
    /\bLGV\b/.test(
      upper
    )
  ){

    return "LGV";

  }


  if(
    /\bLMV\b/.test(
      upper
    )
  ){

    return "LMV";

  }


  if(
    /\bLPV\b/.test(
      upper
    )
  ){

    return "LPV";

  }


  if(
    /\bHPV\b/.test(
      upper
    )
  ){

    return "HPV";

  }


  /*
    Description fallback.
  */

  if(
    upper.includes("M-CYCLE") ||
    upper.includes("M CYCLE") ||
    upper.includes("MOTOR CYCLE") ||
    upper.includes("MOTORCYCLE") ||
    upper.includes("SCOOTER") ||
    upper.includes("TWO WHEELER")
  ){

    return "2WN";

  }


  if(
    upper.includes("AUTO RICKSHAW") ||
    upper.includes("THREE WHEELER")
  ){

    return "3WT";

  }


  if(
    upper.includes("BUS")
  ){

    return "LPV";

  }


  if(
    upper.includes("TRACTOR") ||
    upper.includes("PICK-UP") ||
    upper.includes("PICK UP") ||
    upper.includes("PICKUP") ||
    upper.includes("GOODS VEHICLE")
  ){

    return "LGV";

  }


  if(
    upper.includes("CAR")
  ){

    return "LMV";

  }


  return "";

}


/* =========================================================
   IMAGE PREPROCESSING
========================================================= */

function preprocessImage(
  file,
  mode
){

  return new Promise(
    (resolve,reject) => {

      const img =
      new Image();

      const reader =
      new FileReader();


      reader.onload =
      function(e){

        img.onload =
        function(){

          const scale =
          2;


          const canvas =
          document.createElement(
            "canvas"
          );


          canvas.width =
          img.width *
          scale;

          canvas.height =
          img.height *
          scale;


          const ctx =
          canvas.getContext(
            "2d"
          );


          ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
          );


          if(
            mode ===
            "enhanced"
          ){

            const imageData =
            ctx.getImageData(
              0,
              0,
              canvas.width,
              canvas.height
            );


            const data =
            imageData.data;


            for(
              let i=0;
              i<data.length;
              i+=4
            ){

              let gray =
              (
                0.299 *
                data[i]
              ) +
              (
                0.587 *
                data[i+1]
              ) +
              (
                0.114 *
                data[i+2]
              );


              gray =
              (
                gray -
                128
              ) *
              1.35 +
              128;


              gray =
              Math.max(
                0,
                Math.min(
                  255,
                  gray
                )
              );


              data[i] =
              gray;

              data[i+1] =
              gray;

              data[i+2] =
              gray;

            }


            ctx.putImageData(
              imageData,
              0,
              0
            );

          }


          canvas.toBlob(
            blob => {

              if(blob){

                resolve(blob);

              }else{

                reject(
                  new Error(
                    "Image processing failed."
                  )
                );

              }

            },
            "image/jpeg",
            .95
          );

        };


        img.onerror =
        reject;

        img.src =
        e.target.result;

      };


      reader.onerror =
      reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   OCR
========================================================= */

async function runOCR(
  image,
  label
){

  showStatus(
    label +
    "\nPlease wait..."
  );


  const result =
  await Tesseract.recognize(
    image,
    "eng",
    {

      logger:function(info){

        if(
          info.status ===
          "recognizing text"
        ){

          const progress =
          Math.round(
            (
              info.progress ||
              0
            ) * 100
          );


          showStatus(
            label +
            "\n" +
            progress +
            "%"
          );

        }

      }

    }
  );


  return normalizeText(
    result.data.text ||
    ""
  );

}


/* =========================================================
   MERGE OCR
========================================================= */

function mergeOCRText(
  texts
){

  const result = [];


  texts.forEach(
    text => {

      if(!text){
        return;
      }


      text
        .split(/\n/)
        .map(
          x => x.trim()
        )
        .filter(Boolean)
        .forEach(
          line => {

            if(
              !result.includes(
                line
              )
            ){

              result.push(
                line
              );

            }

          }
        );

    }
  );


  return result.join(
    "\n"
  );

}


/* =========================================================
   READ PHOTO
========================================================= */

async function readPhoto(){

  const file =
  photoInput.files[0];


  if(!file){

    alert(
      "Please select a vehicle photo first."
    );

    return;

  }


  /*
    IMPORTANT:

    Manual Customer Name
    and Mobile are NOT cleared.
  */

  clearOCRFields();


  readBtn.disabled =
  true;

  saveBtn.disabled =
  true;


  try{

    /* -----------------------------------------------------
       OCR PASS 1
    ----------------------------------------------------- */

    const text1 =
    await runOCR(
      file,
      "OCR Pass 1/3 - Original"
    );


    /* -----------------------------------------------------
       OCR PASS 2
    ----------------------------------------------------- */

    const enhanced =
    await preprocessImage(
      file,
      "enhanced"
    );


    const text2 =
    await runOCR(
      enhanced,
      "OCR Pass 2/3 - Enhanced"
    );


    /* -----------------------------------------------------
       OCR PASS 3
    ----------------------------------------------------- */

    const enlarged =
    await preprocessImage(
      file,
      "normal"
    );


    const text3 =
    await runOCR(
      enlarged,
      "OCR Pass 3/3 - High Resolution"
    );


    /* -----------------------------------------------------
       MERGE
    ----------------------------------------------------- */

    const rawText =
    mergeOCRText(
      [
        text1,
        text2,
        text3
      ]
    );


    ocrText.value =
    rawText;


    /* =====================================================
       VEHICLE NUMBER
    ===================================================== */

    let number =
    findVehicleNumberFromLabel(
      rawText
    );


    if(!number){

      const candidates =
      extractVehicleCandidates(
        rawText
      );


      number =
      chooseBestVehicleNumber(
        candidates
      );

    }


    if(number){

      vehicleNumber.value =
      number;

    }


    /* =====================================================
       VEHICLE CLASS
    ===================================================== */

    const cls =
    findVehicleClass(
      rawText
    );


    if(cls){

      vehicleClass.value =
      cls;

      showClassPhoto(
        cls
      );

    }


    /* =====================================================
       REGISTRATION
    ===================================================== */

    const registration =
    findStrictFieldDate(
      rawText,
      [
        "REGISTRATION DATE",
        "REGN DATE",
        "REG DATE"
      ]
    );


    if(registration){

      registrationDate.value =
      registration;

    }


    /* =====================================================
       FITNESS
    ===================================================== */

    const fitness =
    findStrictFieldDate(
      rawText,
      [
        "FITNESS VALID UPTO",
        "FITNESS VALID UP TO",
        "FITNESS/REGN",
        "FITNESS"
      ]
    );


    if(fitness){

      fitnessExpiry.value =
      fitness;

    }


    /* =====================================================
       TAX
    ===================================================== */

    const tax =
    findStrictTax(
      rawText
    );


    if(tax){

      taxExpiry.value =
      tax;

    }


    /* =====================================================
       INSURANCE
    ===================================================== */

    const insurance =
    findStrictFieldDate(
      rawText,
      [
        "INSURANCE VALID UPTO",
        "INSURANCE VALID UP TO",
        "INSURANCE"
      ]
    );


    if(insurance){

      insuranceExpiry.value =
      insurance;

    }


    /* =====================================================
       PUCC
    ===================================================== */

    const pucc =
    findStrictFieldDate(
      rawText,
      [
        "PUCC VALID UPTO",
        "PUCC VALID UP TO",
        "PUCC"
      ]
    );


    if(pucc){

      puccExpiry.value =
      pucc;

    }


    /* =====================================================
       PERMIT
    ===================================================== */

    const permit =
    findStrictFieldDate(
      rawText,
      [
        "PERMIT VALID UPTO",
        "PERMIT VALID UP TO",
        "PERMIT"
      ]
    );


    if(permit){

      permitExpiry.value =
      permit;

    }


    showStatus(
      "OCR completed successfully.\n\n" +
      "Vehicle document details extracted.\n" +
      "Customer Name and Mobile remain manual.\n\n" +
      "Please check the details before saving."
    );


  }catch(error){

    console.error(
      "OCR Error:",
      error
    );


    showStatus(
      "OCR Error:\n" +
      (
        error.message ||
        error
      )
    );

  }


  readBtn.disabled =
  false;

  saveBtn.disabled =
  false;

}


/* =========================================================
   DATABASE DATE
========================================================= */

function convertToDatabaseDate(
  value
){

  if(!value){

    return null;

  }


  value =
  value.trim();


  if(
    value.toUpperCase() ===
    "LTT"
  ){

    return "LTT";

  }


  const m =
  value.match(
    /^(\d{2})\/(\d{2})\/(\d{4})$/
  );


  if(!m){

    return null;

  }


  return (
    m[3] +
    "-" +
    m[2] +
    "-" +
    m[1]
  );

}


/* =========================================================
   UPLOAD PHOTO
========================================================= */

async function uploadPhoto(
  file,
  vehicleNo
){

  if(!file){

    return null;

  }


  const safeVehicle =
  vehicleNo.replace(
    /[^A-Z0-9]/gi,
    ""
  );


  const fileName =
  safeVehicle +
  "_" +
  Date.now() +
  ".jpg";


  const {
    error:uploadError
  } =
  await supabaseClient
    .storage
    .from("vehicle-photos")
    .upload(
      fileName,
      file,
      {
        upsert:false,
        contentType:
          file.type ||
          "image/jpeg"
      }
    );


  if(uploadError){

    throw uploadError;

  }


  const {
    data
  } =
  supabaseClient
    .storage
    .from("vehicle-photos")
    .getPublicUrl(
      fileName
    );


  return {

    url:
      data.publicUrl,

    path:
      fileName

  };

}


/* =========================================================
   DELETE PHOTO
========================================================= */

async function deleteOldPhoto(
  path
){

  if(!path){

    return;

  }


  try{

    await supabaseClient
      .storage
      .from("vehicle-photos")
      .remove([
        path
      ]);

  }catch(error){

    console.warn(
      "Photo delete error:",
      error
    );

  }

}


/* =========================================================
   VALIDATE MOBILE
========================================================= */

function validateMobile(
  value
){

  if(!value){

    return true;

  }


  return /^[6-9]\d{9}$/.test(
    value
  );

}


/* =========================================================
   SAVE VEHICLE
========================================================= */

async function saveVehicle(){

  const vNumber =
  vehicleNumber.value
    .trim()
    .toUpperCase();


  const customer =
  customerName.value
    .trim();


  const phone =
  mobile.value
    .trim();


  if(!vNumber){

    alert(
      "Vehicle Number is required."
    );

    return;

  }


  if(
    phone &&
    !validateMobile(phone)
  ){

    alert(
      "Please enter a valid 10 digit mobile number."
    );

    return;

  }


  saveBtn.disabled =
  true;


  try{

    showStatus(
      "Checking vehicle number..."
    );


    /* =====================================================
       CHECK EXISTING VEHICLE
    ===================================================== */

    const {
      data:existing,
      error:findError
    } =
    await supabaseClient
      .from("vehicles")
      .select("*")
      .eq(
        "vehicle_number",
        vNumber
      )
      .maybeSingle();


    if(findError){

      throw findError;

    }


    /* =====================================================
       VEHICLE DATA
    ===================================================== */

    const vehicleData = {

      vehicle_number:
        vNumber,

      customer_name:
        customer,

      mobile:
        phone,

      vehicle_class:
        vehicleClass.value
          .trim(),

      registration_date:
        convertToDatabaseDate(
          registrationDate.value
        ),

      fitness_expiry:
        convertToDatabaseDate(
          fitnessExpiry.value
        ),

      insurance_expiry:
        convertToDatabaseDate(
          insuranceExpiry.value
        ),

      tax_expiry:
        convertToDatabaseDate(
          taxExpiry.value
        ),

      pucc_expiry:
        convertToDatabaseDate(
          puccExpiry.value
        ),

      permit_expiry:
        convertToDatabaseDate(
          permitExpiry.value
        ),

      ocr_text:
        ocrText.value

    };


    /* =====================================================
       PHOTO
    ===================================================== */

    const file =
    photoInput.files[0];


    let uploadedPhoto =
    null;


    if(file){

      showStatus(
        "Uploading new vehicle photo..."
      );


      uploadedPhoto =
      await uploadPhoto(
        file,
        vNumber
      );

    }


    /* =====================================================
       DUPLICATE VEHICLE
    ===================================================== */

    if(existing){

      /*
        IMPORTANT:

        Same Vehicle Number found.

        Old record will NOT remain duplicated.

        We update the existing record with
        the new information.
      */


      showStatus(
        "Same vehicle found.\n" +
        "Replacing old vehicle details..."
      );


      /*
        If new photo exists,
        remove old photo after successful
        new photo upload.
      */

      if(uploadedPhoto){

        vehicleData.photo_url =
        uploadedPhoto.url;

        vehicleData.photo_path =
        uploadedPhoto.path;

      }


      const {
        error:updateError
      } =
      await supabaseClient
        .from("vehicles")
        .update(
          vehicleData
        )
        .eq(
          "id",
          existing.id
        );


      if(updateError){

        /*
          Database update failed.

          Remove newly uploaded photo
          so an unused file is not left.
        */

        if(uploadedPhoto){

          await deleteOldPhoto(
            uploadedPhoto.path
          );

        }


        throw updateError;

      }


      /*
        Database update successful.

        Now delete OLD photo.
      */

      if(
        uploadedPhoto &&
        existing.photo_path &&
        existing.photo_path !==
        uploadedPhoto.path
      ){

        await deleteOldPhoto(
          existing.photo_path
        );

      }


      showStatus(
        "Vehicle updated successfully.\n\n" +
        "Existing vehicle number found.\n" +
        "Old record replaced with new details."
      );


      alert(
        "Vehicle already existed.\n\n" +
        "Old record has been automatically updated with the new details."
      );


    }else{

      /* =================================================
         NEW VEHICLE
      ================================================= */

      if(uploadedPhoto){

        vehicleData.photo_url =
        uploadedPhoto.url;

        vehicleData.photo_path =
        uploadedPhoto.path;

      }


      showStatus(
        "Saving new vehicle..."
      );


      const {
        error:insertError
      } =
      await supabaseClient
        .from("vehicles")
        .insert([
          vehicleData
        ]);


      if(insertError){

        if(uploadedPhoto){

          await deleteOldPhoto(
            uploadedPhoto.path
          );

        }


        throw insertError;

      }


      showStatus(
        "Vehicle saved successfully."
      );


      alert(
        "New vehicle saved successfully."
      );

    }


  }catch(error){

    console.error(
      "Save Error:",
      error
    );


    showStatus(
      "Save Error:\n" +
      (
        error.message ||
        error
      )
    );


    alert(
      "Error saving vehicle:\n" +
      (
        error.message ||
        error
      )
    );

  }


  saveBtn.disabled =
  false;

}
