
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Vehicles - RV Vehicle Reminder</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  margin: 0;
  color: #172033;
}

.header {
  background: linear-gradient(135deg,#087cf5,#00b4ff);
  color: white;
  padding: 22px;
  border-radius: 0 0 25px 25px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.topbar {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}

input {
  flex: 1;
  padding: 13px;
  border: 1px solid #d5dce8;
  border-radius: 10px;
  font-size: 14px;
}

.vehicle-card {
  background: white;
  padding: 18px;
  border-radius: 18px;
  margin-bottom: 16px;
  box-shadow: 0 4px 15px #dce5f0;
}

.vehicle-title {
  font-size: 20px;
  font-weight: bold;
  color: #087cf5;
  margin-bottom: 15px;
}

.row {
  display: flex;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid #edf0f5;
  font-size: 14px;
}

.row:last-child {
  border-bottom: none;
}

.label {
  color: #687386;
}

.status {
  font-weight: bold;
}

.green {
  color: #16a34a;
}

.red {
  color: #dc2626;
}

.orange {
  color: #ea580c;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 11px;
  margin-top: 15px;
  background: #087cf5;
  color: white;
  font-size: 15px;
  font-weight: bold;
}

.empty {
  text-align: center;
  background: white;
  padding: 30px;
  border-radius: 18px;
  color: #687386;
}
</style>
</head>

<body>

<div class="header">
  <h2>🚘 All Vehicles</h2>
  <p>RV Vehicle Reminder</p>
</div>

<div class="container">

  <div class="topbar">
    <input type="text" id="search" placeholder="🔍 Vehicle Number Search" oninput="displayVehicles()">
  </div>

  <div id="vehicleList"></div>

  <button onclick="location.href='upload.html'">
    📸 Add New Vehicle
  </button>

  <button onclick="history.back()" style="background:#64748b;">
    ⬅️ Back
  </button>

</div>

<script>

function formatDate(date) {
  if (!date) return "Not Available";

  const d = new Date(date + "T00:00:00");

  return d.toLocaleDateString("en-IN", {
    day: "2-digit",
    month: "short",
    year: "numeric"
  });
}

function getStatus(date) {
  if (!date) {
    return '<span class="status">—</span>';
  }

  const today = new Date();
  today.setHours(0,0,0,0);

  const expiry = new Date(date + "T00:00:00");
  const diff = Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));

  if (diff < 0) {
    return '<span class="status red">❌ Expired</span>';
  }

  if (diff <= 10) {
    return '<span class="status orange">🔔 ' + diff + ' Days Left</span>';
  }

  return '<span class="status green">🟢 Valid</span>';
}

function displayVehicles() {

  const list = document.getElementById("vehicleList");
  const search = document.getElementById("search").value.toUpperCase();

  let vehicles = JSON.parse(localStorage.getItem("vehicles")) || [];

  vehicles = vehicles.filter(v =>
    v.vehicleNumber.includes(search)
  );

  list.innerHTML = "";

  if (vehicles.length === 0) {
    list.innerHTML = `
      <div class="empty">
        🚗<br><br>
        કોઈ Vehicle Record મળ્યો નથી.
      </div>
    `;
    return;
  }

  vehicles.forEach((v, index) => {

    list.innerHTML += `
      <div class="vehicle-card">

        <div class="vehicle-title">
          🚘 ${v.vehicleNumber}
        </div>

        <div class="row">
          <span class="label">Registration Date</span>
          <span>${formatDate(v.registrationDate)}</span>
        </div>

        <div class="row">
          <span class="label">Fitness Expiry</span>
          <span>${formatDate(v.fitness)}</span>
        </div>

        <div class="row">
          <span class="label">Status</span>
          <span>${getStatus(v.fitness)}</span>
        </div>

        <div class="row">
          <span class="label">Insurance Expiry</span>
          <span>${formatDate(v.insurance)}</span>
        </div>

        <div class="row">
          <span class="label">Tax Expiry</span>
          <span>${formatDate(v.tax)}</span>
        </div>

        <div class="row">
          <span class="label">PUCC Expiry</span>
          <span>${formatDate(v.pucc)}</span>
        </div>

        <div class="row">
          <span class="label">Permit Expiry</span>
          <span>${formatDate(v.permit)}</span>
        </div>

        <button onclick="deleteVehicle(${index})" style="background:#dc2626;">
          🗑️ Delete Vehicle
        </button>

      </div>
    `;
  });
}

function deleteVehicle(index) {

  if (confirm("શું તમે આ Vehicle Delete કરવા માંગો છો?")) {

    let vehicles = JSON.parse(localStorage.getItem("vehicles")) || [];

    vehicles.splice(index, 1);

    localStorage.setItem("vehicles", JSON.stringify(vehicles));

    displayVehicles();
  }
}

displayVehicles();

</script>

</body>
</html>
