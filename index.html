<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta

<title>RV Vehicle Reminder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
}

body{

  color:#172033;

  background-image:url("./assets/background.png");

  background-size:cover;

  background-position:center center;

  background-repeat:no-repeat;

  background-attachment:fixed;

}


/* =====================================================
   HEADER
===================================================== */

.header{

  background:linear-gradient(
    135deg,
    #061a3a,
    #123b70
  );

  color:white;

  padding:16px 20px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.25);

}

.brand{

  display:flex;

  align-items:center;

  gap:13px;

}

.logo{

  width:58px;

  height:58px;

  object-fit:contain;

  border-radius:12px;

  background:white;

  padding:4px;

}

.brand-text h1{

  margin:0;

  font-size:25px;

  font-weight:800;

  letter-spacing:.5px;

}

.brand-text p{

  margin:4px 0 0;

  font-size:13px;

  opacity:.9;

}


/* =====================================================
   LANGUAGE
===================================================== */

.language-box{

  display:flex;

  gap:6px;

  flex-wrap:wrap;

  justify-content:flex-end;

}

.language-box button{

  border:1px solid rgba(255,255,255,.35);

  background:rgba(255,255,255,.12);

  color:white;

  padding:8px 12px;

  border-radius:8px;

  cursor:pointer;

  font-size:13px;

  font-weight:700;

}

.language-box button:hover{

  background:rgba(255,255,255,.25);

}


/* =====================================================
   MAIN
===================================================== */

.container{

  max-width:1200px;

  margin:25px auto;

  padding:0 15px;

}


/* =====================================================
   TOP CONTROLS
===================================================== */

.top-bar{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:12px;

  margin-bottom:20px;

}

.page-title{

  background:rgba(255,255,255,.82);

  backdrop-filter:blur(10px);

  padding:12px 18px;

  border-radius:13px;

  font-size:20px;

  font-weight:800;

  color:#092754;

  box-shadow:
    0 5px 20px rgba(0,0,0,.10);

}

.actions{

  display:flex;

  gap:9px;

}

.action-btn{

  border:0;

  padding:12px 16px;

  border-radius:10px;

  color:white;

  font-weight:700;

  cursor:pointer;

  font-size:14px;

}

.add-btn{

  background:#0b7a43;

}

.refresh-btn{

  background:#123b70;

}

.action-btn:hover{

  opacity:.9;

  transform:translateY(-1px);

}


/* =====================================================
   SUMMARY
===================================================== */

.summary-grid{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:14px;

  margin-bottom:22px;

}

.summary-card{

  background:rgba(255,255,255,.92);

  backdrop-filter:blur(10px);

  border-radius:16px;

  padding:18px;

  box-shadow:
    0 7px 25px rgba(0,0,0,.13);

  border-top:5px solid #123b70;

}

.summary-card:nth-child(2){

  border-top-color:#f39c12;

}

.summary-card:nth-child(3){

  border-top-color:#d63031;

}

.summary-card:nth-child(4){

  border-top-color:#0b7a43;

}

.summary-label{

  color:#667085;

  font-size:13px;

  font-weight:700;

}

.summary-number{

  font-size:31px;

  font-weight:800;

  margin-top:7px;

  color:#092754;

}


/* =====================================================
   SECTION
===================================================== */

.section{

  background:rgba(255,255,255,.90);

  backdrop-filter:blur(12px);

  border-radius:18px;

  padding:20px;

  margin-bottom:20px;

  box-shadow:
    0 7px 28px rgba(0,0,0,.13);

}

.section-title{

  margin:0 0 15px;

  color:#092754;

  font-size:20px;

  font-weight:800;

}


/* =====================================================
   TODAY EXPIRY
===================================================== */

.today-grid{

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:12px;

}

.today-card{

  background:white;

  border-radius:13px;

  padding:15px;

  text-align:center;

  box-shadow:
    0 3px 14px rgba(0,0,0,.08);

  border:1px solid #e1e6ed;

}

.today-icon{

  font-size:25px;

}

.today-name{

  margin-top:7px;

  font-size:12px;

  font-weight:800;

  color:#667085;

}

.today-value{

  margin-top:6px;

  font-size:15px;

  font-weight:800;

  color:#092754;

}


/* =====================================================
   SEARCH
===================================================== */

.search-box{

  position:relative;

  margin-bottom:18px;

}

.search-box input{

  width:100%;

  padding:14px 15px 14px 43px;

  border:1px solid #ccd3dd;

  border-radius:12px;

  font-size:15px;

  outline:none;

  background:rgba(255,255,255,.95);

}

.search-box input:focus{

  border-color:#1d5fa7;

  box-shadow:
    0 0 0 3px rgba(29,95,167,.10);

}

.search-icon{

  position:absolute;

  left:15px;

  top:50%;

  transform:translateY(-50%);

  font-size:18px;

  color:#667085;

}


/* =====================================================
   VEHICLE CARD
===================================================== */

.vehicle-card{

  background:rgba(255,255,255,.96);

  border-radius:16px;

  margin-bottom:15px;

  padding:18px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.10);

  border-left:5px solid #123b70;

  transition:.2s;

}

.vehicle-card:hover{

  transform:translateY(-2px);

  box-shadow:
    0 8px 25px rgba(0,0,0,.14);

}

.vehicle-top{

  display:flex;

  justify-content:space-between;

  align-items:flex-start;

  gap:12px;

  margin-bottom:13px;

}

.vehicle-number{

  font-size:21px;

  font-weight:800;

  color:#092754;

}

.customer-info{

  margin-top:5px;

  color:#667085;

  font-size:13px;

  line-height:1.6;

}

.vehicle-actions{

  display:flex;

  gap:7px;

}

.edit-btn,
.delete-btn{

  border:0;

  padding:8px 12px;

  border-radius:8px;

  color:white;

  font-weight:700;

  cursor:pointer;

  font-size:12px;

}

.edit-btn{

  background:#123b70;

}

.delete-btn{

  background:#c62828;

}


/* =====================================================
   DETAILS
===================================================== */

.details-grid{

  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  gap:9px;

}

.detail-box{

  background:#f5f8fc;

  border-radius:10px;

  padding:11px;

  border:1px solid #e2e8f0;

}

.detail-label{

  font-size:10px;

  font-weight:800;

  color:#667085;

  text-transform:uppercase;

  margin-bottom:5px;

}

.detail-value{

  font-size:13px;

  font-weight:800;

  color:#172033;

  word-break:break-word;

}

.detail-value.expiring{

  color:#d97706;

}

.detail-value.expired{

  color:#c62828;

}

.detail-value.valid{

  color:#087443;

}

.detail-value.today{

  color:#7c3aed;

}


/* =====================================================
   PAGINATION
===================================================== */

.pagination{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:10px;

  margin-top:20px;

}

.pagination button{

  border:0;

  background:#123b70;

  color:white;

  padding:10px 16px;

  border-radius:9px;

  cursor:pointer;

  font-weight:700;

}

.pagination button:disabled{

  opacity:.45;

  cursor:not-allowed;

}

.page-info{

  font-weight:700;

  color:#172033;

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

  text-align:center;

  padding:35px 15px;

  color:#667085;

  font-weight:600;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:900px){

  .summary-grid{

    grid-template-columns:
      repeat(2,1fr);

  }

  .today-grid{

    grid-template-columns:
      repeat(3,1fr);

  }

  .details-grid{

    grid-template-columns:
      repeat(3,1fr);

  }

}


@media(max-width:650px){

  .header{

    padding:13px;

  }

  .brand-text h1{

    font-size:19px;

  }

  .brand-text p{

    font-size:11px;

  }

  .logo{

    width:48px;

    height:48px;

  }

  .top-bar{

    flex-direction:column;

    align-items:stretch;

  }

  .page-title{

    text-align:center;

  }

  .actions{

    width:100%;

  }

  .action-btn{

    flex:1;

  }

  .summary-grid{

    grid-template-columns:
      repeat(2,1fr);

  }

  .today-grid{

    grid-template-columns:
      repeat(2,1fr);

  }

  .details-grid{

    grid-template-columns:
      repeat(2,1fr);

  }

  .vehicle-top{

    flex-direction:column;

  }

  .vehicle-actions{

    width:100%;

  }

  .edit-btn,
  .delete-btn{

    flex:1;

  }

}


@media(max-width:420px){

  .summary-grid{

    grid-template-columns:1fr;

  }

  .today-grid{

    grid-template-columns:1fr 1fr;

  }

  .details-grid{

    grid-template-columns:1fr 1fr;

  }

}

</style>

</head>

<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://lqbhafspabtlqeubqxjg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let allVehicles = [];

let filteredVehicles = [];

let currentPage = 1;

const recordsPerPage = 10;


/* =====================================================
   DATE PARSER
===================================================== */

function parseDate(value){

  if(!value){

    return null;

  }


  if(
    String(value).toUpperCase() ===
    "LTT"
  ){

    return null;

  }


  const date =
  new Date(value);

  if(
    isNaN(date.getTime())
  ){

    return null;

  }


  return date;

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

  if(!value){

    return "-";

  }


  if(
    String(value).toUpperCase() ===
    "LTT"
  ){

    return "LTT";

  }


  const date =
  parseDate(value);


  if(!date){

    return value;

  }


  const day =
  String(
    date.getDate()
  ).padStart(2,"0");


  const month =
  String(
    date.getMonth()+1
  ).padStart(2,"0");


  const year =
  date.getFullYear();


  return (
    day +
    "/" +
    month +
    "/" +
    year
  );

}


/* =====================================================
   TODAY
===================================================== */

function isToday(value){

  const date =
  parseDate(value);

  if(!date){

    return false;

  }


  const today =
  new Date();


  return (

    date.getDate() ===
    today.getDate() &&

    date.getMonth() ===
    today.getMonth() &&

    date.getFullYear() ===
    today.getFullYear()

  );

}


/* =====================================================
   DATE CLASS
===================================================== */

function getDateClass(value){

  if(!value){

    return "";

  }


  if(
    String(value).toUpperCase() ===
    "LTT"
  ){

    return "valid";

  }


  const date =
  parseDate(value);

  if(!date){

    return "";

  }


  const today =
  new Date();

  today.setHours(
    0,0,0,0
  );

  date.setHours(
    0,0,0,0
  );


  const difference =
    Math.ceil(
      (
        date - today
      ) /
      (
        1000 *
        60 *
        60 *
        24
      )
    );


  if(
    difference < 0
  ){

    return "expired";

  }


  if(
    difference === 0
  ){

    return "today";

  }


  if(
    difference <= 10
  ){

    return "expiring";

  }


  return "valid";

}


/* =====================================================
   EXPIRING CHECK
===================================================== */

function isExpiringSoon(value){

  if(!value){

    return false;

  }


  if(
    String(value).toUpperCase() ===
    "LTT"
  ){

    return false;

  }


  const date =
  parseDate(value);

  if(!date){

    return false;

  }


  const today =
  new Date();

  today.setHours(
    0,0,0,0
  );

  date.setHours(
    0,0,0,0
  );


  const days =
    Math.ceil(
      (
        date - today
      ) /
      (
        1000 *
        60 *
        60 *
        24
      )
    );


  return (
    days >= 0 &&
    days <= 10
  );

}


/* =====================================================
   EXPIRED CHECK
===================================================== */

function isExpired(value){

  if(!value){

    return false;

  }


  if(
    String(value).toUpperCase() ===
    "LTT"
  ){

    return false;

  }


  const date =
  parseDate(value);

  if(!date){

    return false;

  }


  const today =
  new Date();

  today.setHours(
    0,0,0,0
  );

  date.setHours(
    0,0,0,0
  );


  return date < today;

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

  let total =
    allVehicles.length;


  let expiring = 0;

  let expired = 0;

  let today = 0;


  let fitnessToday = 0;

  let insuranceToday = 0;

  let puccToday = 0;

  let taxToday = 0;

  let permitToday = 0;


  allVehicles.forEach(
    vehicle => {


      const fields = [

        vehicle.fitness_expiry,

        vehicle.insurance_expiry,

        vehicle.tax_expiry,

        vehicle.pucc_expiry,

        vehicle.permit_expiry

      ];


      fields.forEach(
        value => {

          if(
            isExpiringSoon(value)
          ){

            expiring++;

          }


          if(
            isExpired(value)
          ){

            expired++;

          }

        }
      );


      if(
        isToday(
          vehicle.fitness_expiry
        )
      ){

        fitnessToday++;

        today++;

      }


      if(
        isToday(
          vehicle.insurance_expiry
        )
      ){

        insuranceToday++;

        today++;

      }


      if(
        isToday(
          vehicle.pucc_expiry
        )
      ){

        puccToday++;

        today++;

      }


      if(
        isToday(
          vehicle.tax_expiry
        )
      ){

        taxToday++;

        today++;

      }


      if(
        isToday(
          vehicle.permit_expiry
        )
      ){

        permitToday++;

        today++;

      }

    }
  );


  document.getElementById(
    "totalVehicles"
  ).textContent =
    total;


  document.getElementById(
    "expiringVehicles"
  ).textContent =
    expiring;


  document.getElementById(
    "expiredVehicles"
  ).textContent =
    expired;


  document.getElementById(
    "todayVehicles"
  ).textContent =
    today;


  document.getElementById(
    "todayFitness"
  ).textContent =
    fitnessToday;


  document.getElementById(
    "todayInsurance"
  ).textContent =
    insuranceToday;


  document.getElementById(
    "todayPucc"
  ).textContent =
    puccToday;


  document.getElementById(
    "todayTax"
  ).textContent =
    taxToday;


  document.getElementById(
    "todayPermit"
  ).textContent =
    permitToday;

}


/* =====================================================
   LOAD VEHICLES
===================================================== */

async function loadVehicles(){

  const list =
  document.getElementById(
    "vehicleList"
  );


  list.innerHTML =
    `<div class="empty">
      Loading vehicles...
    </div>`;


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("vehicles")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      throw error;

    }


    allVehicles =
      data || [];


    filteredVehicles =
      [...allVehicles];


    currentPage =
      1;


    updateSummary();

    renderTable();


  }catch(error){

    console.error(error);


    list.innerHTML =
      `<div class="empty">
        Error loading vehicles.<br><br>
        ${error.message || error}
      </div>`;

  }

}


/* =====================================================
   RENDER
===================================================== */

function renderTable(){

  const list =
  document.getElementById(
    "vehicleList"
  );


  if(
    filteredVehicles.length === 0
  ){

    list.innerHTML =
      `<div class="empty">
        No vehicles found.
      </div>`;

    updatePagination();

    return;

  }


  const start =
    (
      currentPage - 1
    ) *
    recordsPerPage;


  const end =
    start +
    recordsPerPage;


  const pageVehicles =
    filteredVehicles.slice(
      start,
      end
    );


  list.innerHTML =
    pageVehicles
      .map(
        vehicle => {


          const customer =
            vehicle.customer_name ||
            "-";


          const mobile =
            vehicle.mobile ||
            "-";


          const registration =
            formatDate(
              vehicle.registration_date
            );


          const fitness =
            formatDate(
              vehicle.fitness_expiry
            );


          const insurance =
            formatDate(
              vehicle.insurance_expiry
            );


          const tax =
            vehicle.tax_expiry ||
            "-";


          const pucc =
            formatDate(
              vehicle.pucc_expiry
            );


          const permit =
            formatDate(
              vehicle.permit_expiry
            );


          return `

            <div class="vehicle-card">

              <div class="vehicle-top">

                <div>

                  <div class="vehicle-number">
                    ${vehicle.vehicle_number || "-"}
                  </div>

                  <div class="customer-info">

                    👤 ${customer}

                    <br>

                    📱 ${mobile}

                  </div>

                </div>


                <div class="vehicle-actions">

                  <button
                    class="edit-btn"
                    onclick="editVehicle('${vehicle.id}')"
                  >
                    Edit
                  </button>

                  <button
                    class="delete-btn"
                    onclick="deleteVehicle('${vehicle.id}')"
                  >
                    Delete
                  </button>

                </div>

              </div>


              <div class="details-grid">


                <div class="detail-box">

                  <div class="detail-label">
                    Registration
                  </div>

                  <div class="detail-value">
                    ${registration}
                  </div>

                </div>


                <div class="detail-box">

                  <div class="detail-label">
                    Fitness
                  </div>

                  <div class="detail-value ${getDateClass(vehicle.fitness_expiry)}">
                    ${fitness}
                  </div>

                </div>


                <div class="detail-box">

                  <div class="detail-label">
                    Insurance
                  </div>

                  <div class="detail-value ${getDateClass(vehicle.insurance_expiry)}">
                    ${insurance}
                  </div>

                </div>


                <div class="detail-box">

                  <div class="detail-label">
                    Tax
                  </div>

                  <div class="detail-value ${getDateClass(vehicle.tax_expiry)}">
                    ${tax}
                  </div>

                </div>


                <div class="detail-box">

                  <div class="detail-label">
                    PUCC
                  </div>

                  <div class="detail-value ${getDateClass(vehicle.pucc_expiry)}">
                    ${pucc}
                  </div>

                </div>


                <div class="detail-box">

                  <div class="detail-label">
                    Permit
                  </div>

                  <div class="detail-value ${getDateClass(vehicle.permit_expiry)}">
                    ${permit}
                  </div>

                </div>


              </div>

            </div>

          `;

        }
      )
      .join("");


  updatePagination();

}


/* =====================================================
   SEARCH
===================================================== */

function searchVehicle(){

  const search =
    document.getElementById(
      "searchInput"
    )
    .value
    .trim()
    .toLowerCase();


  if(!search){

    filteredVehicles =
      [...allVehicles];

  }else{

    filteredVehicles =
      allVehicles.filter(
        vehicle => {


          const number =
            String(
              vehicle.vehicle_number ||
              ""
            )
            .toLowerCase();


          const customer =
            String(
              vehicle.customer_name ||
              ""
            )
            .toLowerCase();


          const mobile =
            String(
              vehicle.mobile ||
              ""
            )
            .toLowerCase();


          return (

            number.includes(search) ||

            customer.includes(search) ||

            mobile.includes(search)

          );

        }
      );

  }


  currentPage =
    1;


  renderTable();

}


/* =====================================================
   PAGINATION
===================================================== */

function updatePagination(){

  const totalPages =
    Math.max(
      1,
      Math.ceil(
        filteredVehicles.length /
        recordsPerPage
      )
    );


  document.getElementById(
    "pageInfo"
  ).textContent =
    "Page " +
    currentPage +
    " of " +
    totalPages;


  document.getElementById(
    "previousBtn"
  ).disabled =
    currentPage <= 1;


  document.getElementById(
    "nextBtn"
  ).disabled =
    currentPage >= totalPages;

}


function nextPage(){

  const totalPages =
    Math.ceil(
      filteredVehicles.length /
      recordsPerPage
    );


  if(
    currentPage <
    totalPages
  ){

    currentPage++;

    renderTable();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


function previousPage(){

  if(
    currentPage > 1
  ){

    currentPage--;

    renderTable();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


/* =====================================================
   GO TO UPLOAD
===================================================== */

function goToUpload(){

  window.location.href =
    "upload.html";

}


/* =====================================================
   EDIT VEHICLE
===================================================== */

function editVehicle(id){

  window.location.href =
    "upload.html?id=" +
    encodeURIComponent(id);

}


/* =====================================================
   DELETE VEHICLE
===================================================== */

async function deleteVehicle(id){

  const vehicle =
    allVehicles.find(
      item =>
      String(item.id) ===
      String(id)
    );


  if(!vehicle){

    return;

  }


  const confirmed =
    confirm(
      "Are you sure you want to delete vehicle " +
      vehicle.vehicle_number +
      "?"
    );


  if(!confirmed){

    return;

  }


  try{

    /*
      Delete photo from storage
    */

    if(
      vehicle.photo_path
    ){

      const {
        error:storageError
      } =
      await supabaseClient
        .storage
        .from("vehicle-photos")
        .remove([
          vehicle.photo_path
        ]);


      if(storageError){

        console.warn(
          "Photo delete error:",
          storageError
        );

      }

    }


    /*
      Delete database record
    */

    const {
      error
    } =
    await supabaseClient
      .from("vehicles")
      .delete()
      .eq(
        "id",
        id
      );


    if(error){

      throw error;

    }


    alert(
      "Vehicle deleted successfully."
    );


    await loadVehicles();


  }catch(error){

    console.error(error);


    alert(
      "Error deleting vehicle:\n" +
      (
        error.message ||
        error
      )
    );

  }

}

loadVehicles();
