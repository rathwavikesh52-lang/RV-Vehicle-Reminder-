<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RV Vehicle Reminder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    color:#172033;
    background:
        linear-gradient(rgba(225,238,250,.72),rgba(247,250,253,.96)),
        linear-gradient(135deg,#9dbbd4 0%,#dceaf5 48%,#eef3f7 100%);
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:38vh;
    z-index:-2;
    background:
        linear-gradient(155deg,transparent 0 24%,rgba(66,92,111,.30) 25% 37%,transparent 38%),
        linear-gradient(205deg,transparent 0 31%,rgba(79,105,124,.25) 32% 46%,transparent 47%),
        linear-gradient(180deg,transparent 0 48%,rgba(55,72,84,.35) 49% 100%);
    clip-path:polygon(
        0 42%,10% 25%,18% 40%,30% 8%,42% 38%,
        55% 15%,68% 43%,79% 20%,90% 39%,100% 17%,
        100% 100%,0 100%
    );
}

body::after{
    content:"";
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:18vh;
    z-index:-1;
    background:
        linear-gradient(173deg,
        transparent 0 34%,
        rgba(42,49,56,.72) 35% 63%,
        transparent 64%);
    opacity:.55;
}

/* HEADER */

header{
    width:100%;
    padding:18px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    background:rgba(255,255,255,.84);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.7);
    box-shadow:0 5px 25px rgba(25,50,75,.10);
}

.logo-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-icon{
    width:52px;
    height:52px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:900;
    font-size:21px;
    background:linear-gradient(135deg,#092f63,#f28b21);
    box-shadow:0 7px 18px rgba(18,55,95,.28);
}

.logo-title{
    font-size:24px;
    font-weight:800;
    color:#12345a;
}

.logo-subtitle{
    margin-top:3px;
    font-size:12px;
    color:#657487;
}

.language-buttons{
    display:flex;
    gap:6px;
}

.language-buttons button{
    border:1px solid #d6dee7;
    background:white;
    border-radius:8px;
    padding:7px 10px;
    cursor:pointer;
}

/* MAIN */

.container{
    width:min(1250px,94%);
    margin:25px auto 35px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:18px;
}

.page-heading h1{
    font-size:30px;
    color:#12345a;
}

.page-heading p{
    color:#64748b;
    margin-top:5px;
}

.total-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.total-card{
    background:rgba(255,255,255,.86);
    padding:13px 20px;
    border-radius:15px;
    box-shadow:0 7px 25px rgba(27,54,81,.12);
    text-align:center;
}

.total-card span{
    display:block;
    font-size:12px;
    color:#68778a;
}

.total-card strong{
    display:block;
    font-size:27px;
    color:#12345a;
    margin-top:3px;
}

.add-btn{
    border:0;
    background:linear-gradient(135deg,#123f72,#f18a20);
    color:#fff;
    padding:13px 18px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 7px 18px rgba(30,66,104,.25);
}

/* TODAY EXPIRY BOXES */

.today-expiry-row{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    margin-bottom:18px;
}

.today-expiry-box{
    background:rgba(255,255,255,.93);
    border:1px solid #e0e7ef;
    border-radius:14px;
    padding:13px 8px;
    text-align:center;
    box-shadow:0 6px 18px rgba(28,57,84,.10);
    user-select:none;
    cursor:default;
}

.today-expiry-box .expiry-label{
    display:block;
    font-size:12px;
    font-weight:800;
    color:#536477;
    letter-spacing:.3px;
}

.today-expiry-box strong{
    display:block;
    margin-top:4px;
    font-size:25px;
    color:#123f72;
}

/* SEARCH */

.search-box{
    background:rgba(255,255,255,.88);
    padding:15px;
    border-radius:15px;
    box-shadow:0 7px 25px rgba(27,54,81,.10);
    margin-bottom:18px;
}

.search-box input{
    width:100%;
    border:1px solid #d9e1e9;
    padding:13px 15px;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

/* VEHICLE LIST */

.vehicle-list-box{
    background:rgba(255,255,255,.91);
    border-radius:20px;
    padding:20px;
    box-shadow:0 12px 35px rgba(28,57,84,.14);
}

.vehicle-list-title{
    font-size:21px;
    font-weight:800;
    color:#12345a;
    margin-bottom:16px;
}

/* VEHICLE CARD */

.vehicle-card{
    position:relative;
    margin-bottom:15px;
    padding:20px;
    border:1px solid #e1e8ef;
    border-radius:16px;
    background:rgba(255,255,255,.97);
    box-shadow:0 5px 16px rgba(32,56,80,.08);
}

/* MAIN ONE-LINE INFORMATION */

.vehicle-main-line{
    display:flex;
    align-items:center;
    gap:18px;
    white-space:nowrap;
    overflow-x:auto;
    padding-bottom:3px;
    margin-bottom:15px;
    padding-right:150px;
}

.vehicle-number-text{
    font-size:22px;
    font-weight:900;
    color:#123f72;
    letter-spacing:.4px;
}

.customer-text{
    font-size:16px;
    font-weight:700;
    color:#344255;
}

.mobile-text{
    font-size:16px;
    font-weight:700;
    color:#17528d;
}

.vehicle-details{
    display:grid;
    grid-template-columns:repeat(2,minmax(250px,1fr));
    gap:10px 30px;
}

.detail-row{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:14px;
    color:#344255;
}

.detail-label{
    font-weight:700;
}

.detail-value{
    font-weight:700;
    padding:4px 7px;
    border-radius:6px;
}

/* DATE COLORS */

.date-normal{
    color:#146c3a;
    background:#e8f7ee;
}

.date-15{
    color:#806400;
    background:#fff4bd;
}

.date-10{
    color:#9a4d00;
    background:#ffe1b3;
}

.date-5{
    color:#9b235e;
    background:#ffd8e8;
}

.date-expired{
    color:#b40000;
    background:#ffd7d7;
}

/* BUTTONS */

.delete-btn{
    position:absolute;
    right:15px;
    top:15px;
    border:0;
    background:#ffe3e3;
    color:#b40000;
    padding:7px 10px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

.edit-btn{
    position:absolute;
    right:85px;
    top:15px;
    border:0;
    background:#e5efff;
    color:#17528d;
    padding:7px 10px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

/* PAGINATION */

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin:20px 0;
}

.pagination button{
    border:1px solid #d4dde6;
    background:white;
    padding:8px 13px;
    border-radius:8px;
    cursor:pointer;
}

.pagination button.active{
    background:#123f72;
    color:white;
}

/* STATUS */

.status-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-top:18px;
}

.status-box{
    background:rgba(255,255,255,.92);
    padding:20px;
    border-radius:18px;
    box-shadow:0 9px 25px rgba(30,57,82,.11);
}

.status-box h3{
    margin-bottom:7px;
    color:#12345a;
}

.status-box strong{
    font-size:28px;
}

.expiring-count{
    color:#9a6d00;
}

.expired-count{
    color:#c00000;
}

footer{
    text-align:center;
    margin-top:28px;
    color:#68778a;
    font-size:13px;
}

/* MOBILE */

@media(max-width:750px){

    header{
        padding:14px;
    }

    .logo-title{
        font-size:19px;
    }

    .logo-subtitle{
        font-size:10px;
    }

    .logo-icon{
        width:44px;
        height:44px;
        font-size:17px;
    }

    .topbar{
        align-items:stretch;
        flex-direction:column;
    }

    .total-area{
        width:100%;
    }

    .total-card{
        flex:1;
    }

    .add-btn{
        flex:1;
    }

    .today-expiry-row{
        grid-template-columns:repeat(5,1fr);
        gap:5px;
    }

    .today-expiry-box{
        padding:10px 3px;
        border-radius:10px;
    }

    .today-expiry-box .expiry-label{
        font-size:9px;
        letter-spacing:0;
    }

    .today-expiry-box strong{
        font-size:20px;
    }

    .vehicle-list-box{
        padding:13px;
    }

    .vehicle-card{
        padding:15px;
    }

    .vehicle-main-line{
        gap:10px;
        padding-right:0;
        margin-top:35px;
        margin-bottom:15px;
    }

    .vehicle-number-text{
        font-size:17px;
    }

    .customer-text,
    .mobile-text{
        font-size:12px;
    }

    .vehicle-details{
        grid-template-columns:1fr;
        gap:8px;
    }

    .detail-row{
        font-size:13px;
        flex-wrap:wrap;
    }

    .edit-btn{
        top:10px;
        right:68px;
    }

    .delete-btn{
        top:10px;
        right:10px;
    }

    .status-row{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .status-box{
        padding:15px;
    }

    .status-box h3{
        font-size:14px;
    }

    .status-box strong{
        font-size:23px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo-area">

        <div class="logo-icon">
            RV
        </div>

        <div>
            <div class="logo-title">
                RV Vehicle Reminder
            </div>

            <div class="logo-subtitle">
                Vehicle Expiry Management System
            </div>
        </div>

    </div>

    <div class="language-buttons">
        <button onclick="setLanguage('en')">EN</button>
        <button onclick="setLanguage('gu')">ગુ</button>
    </div>

</header>

<div class="container">

    <div class="topbar">

        <div class="page-heading">

            <h1 id="dashboardTitle">
                Dashboard
            </h1>

            <p id="dashboardSubtitle">
                Stay Alert • Stay Legal • Drive Safe.
            </p>

        </div>

        <div class="total-area">

            <div class="total-card">

                <span id="totalLabel">
                    Total Vehicles
                </span>

                <strong id="totalVehicles">
                    0
                </strong>

            </div>

            <button
                class="add-btn"
                onclick="goToUpload()">
                + Add Vehicle
            </button>

        </div>

    </div>

    <!-- TODAY EXPIRY COUNTS -->

    <div class="today-expiry-row">

        <div class="today-expiry-box">
            <span class="expiry-label">FITNESS</span>
            <strong id="fitnessToday">0</strong>
        </div>

        <div class="today-expiry-box">
            <span class="expiry-label">INSURANCE</span>
            <strong id="insuranceToday">0</strong>
        </div>

        <div class="today-expiry-box">
            <span class="expiry-label">PUC</span>
            <strong id="pucToday">0</strong>
        </div>

        <div class="today-expiry-box">
            <span class="expiry-label">TAX</span>
            <strong id="taxToday">0</strong>
        </div>

        <div class="today-expiry-box">
            <span class="expiry-label">PERMIT</span>
            <strong id="permitToday">0</strong>
        </div>

    </div>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search Vehicle Number, Customer Name or Mobile..."
            oninput="searchVehicle()">

    </div>

    <div class="vehicle-list-box">

        <div class="vehicle-list-title">
            🚗 VEHICLE LIST
        </div>

        <div id="vehicleTable"></div>

    </div>

    <div
        class="pagination"
        id="pagination">
    </div>

    <div class="status-row">

        <div class="status-box">

            <h3>
                🟡 Expiring Soon
            </h3>

            <strong
                class="expiring-count"
                id="expiringCount">
                0
            </strong>

        </div>

        <div class="status-box">

            <h3>
                🔴 Expired Vehicles
            </h3>

            <strong
                class="expired-count"
                id="expiredCount">
                0
            </strong>

        </div>

    </div>

    <footer>
        RV Vehicle Reminder © 2026
    </footer>

</div>

<script>

/* SUPABASE */

const SUPABASE_URL =
"https://lqbhafspabtlqeubqxjg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* VARIABLES */

let allVehicles = [];

let filteredVehicles = [];

let currentPage = 1;

const perPage = 10;

let currentLanguage = "en";

/* LANGUAGE */

function setLanguage(lang){

    currentLanguage = lang;

    if(lang === "gu"){

        document.getElementById("dashboardTitle").innerText =
        "ડેશબોર્ડ";

        document.getElementById("dashboardSubtitle").innerText =
        "સાવચેત રહો • કાયદેસર રહો • સુરક્ષિત ડ્રાઇવ કરો";

        document.getElementById("totalLabel").innerText =
        "કુલ વાહનો";

        document.getElementById("searchInput").placeholder =
        "વાહન નંબર, ગ્રાહકનું નામ અથવા મોબાઇલ શોધો...";

    }else{

        document.getElementById("dashboardTitle").innerText =
        "Dashboard";

        document.getElementById("dashboardSubtitle").innerText =
        "Stay Alert • Stay Legal • Drive Safe.";

        document.getElementById("totalLabel").innerText =
        "Total Vehicles";

        document.getElementById("searchInput").placeholder =
        "Search Vehicle Number, Customer Name or Mobile...";
    }
}

/* LOAD VEHICLES */

async function loadVehicles(){

    const {
        data,
        error
    } = await supabaseClient
        .from("vehicles")
        .select("*")
        .order("id",{ascending:false});

    if(error){

        console.error(error);

        document.getElementById("vehicleTable").innerHTML =
        "<p style='color:red'>Unable to load vehicles.</p>";

        return;
    }

    allVehicles = data || [];

    filteredVehicles = [...allVehicles];

    document.getElementById("totalVehicles").innerText =
    allVehicles.length;

    updateCounts();

    updateTodayExpiryCounts();

    renderTable();
}

/* DATE PARSER */

function parseDate(value){

    if(!value)
        return null;

    if(value instanceof Date)
        return value;

    let text =
    String(value).trim();

    if(!text || text.toUpperCase() === "LTT")
        return null;

    let match =
    text.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);

    if(match){

        return new Date(
            Number(match[3]),
            Number(match[2])-1,
            Number(match[1])
        );
    }

    match =
    text.match(/^(\d{4})-(\d{2})-(\d{2})$/);

    if(match){

        return new Date(
            Number(match[1]),
            Number(match[2])-1,
            Number(match[3])
        );
    }

    const d =
    new Date(text);

    if(isNaN(d.getTime()))
        return null;

    return new Date(
        d.getFullYear(),
        d.getMonth(),
        d.getDate()
    );
}

/* FORMAT DATE */

function formatDate(value){

    const date =
    parseDate(value);

    if(!date)
        return value || "-";

    const day =
    String(date.getDate()).padStart(2,"0");

    const month =
    String(date.getMonth()+1).padStart(2,"0");

    const year =
    date.getFullYear();

    return `${day}/${month}/${year}`;
}

/* DATE COLOR */

function getDateClass(value){

    const date =
    parseDate(value);

    if(!date)
        return "date-normal";

    const today =
    new Date();

    today.setHours(0,0,0,0);

    date.setHours(0,0,0,0);

    const diff =
    Math.ceil(
        (date - today) /
        (1000*60*60*24)
    );

    if(diff <= 0)
        return "date-expired";

    if(diff <= 5)
        return "date-5";

    if(diff <= 10)
        return "date-10";

    if(diff <= 15)
        return "date-15";

    return "date-normal";
}

/* STATUS COUNTS */

function updateCounts(){

    let expiring = 0;

    let expired = 0;

    allVehicles.forEach(vehicle => {

        const fields = [

            vehicle.fitness_expiry,

            vehicle.insurance_expiry,

            vehicle.pucc_expiry,

            vehicle.permit_expiry,

            vehicle.tax_expiry

        ];

        fields.forEach(value => {

            const date =
            parseDate(value);

            if(!date)
                return;

            const today =
            new Date();

            today.setHours(0,0,0,0);

            date.setHours(0,0,0,0);

            const diff =
            Math.ceil(
                (date-today) /
                (1000*60*60*24)
            );

            if(diff <= 0){

                expired++;

            }else if(diff <= 15){

                expiring++;
            }

        });

    });

    document.getElementById("expiringCount").innerText =
    expiring;

    document.getElementById("expiredCount").innerText =
    expired;
}

/* TODAY EXPIRY COUNTS */

function isToday(value){

    const date =
    parseDate(value);

    if(!date)
        return false;

    const today =
    new Date();

    return (
        date.getFullYear() === today.getFullYear() &&
        date.getMonth() === today.getMonth() &&
        date.getDate() === today.getDate()
    );
}

function updateTodayExpiryCounts(){

    let fitness = 0;
    let insurance = 0;
    let puc = 0;
    let tax = 0;
    let permit = 0;

    allVehicles.forEach(vehicle => {

        if(isToday(vehicle.fitness_expiry))
            fitness++;

        if(isToday(vehicle.insurance_expiry))
            insurance++;

        if(isToday(vehicle.pucc_expiry))
            puc++;

        if(isToday(vehicle.tax_expiry))
            tax++;

        if(isToday(vehicle.permit_expiry))
            permit++;

    });

    document.getElementById("fitnessToday").innerText =
    fitness;

    document.getElementById("insuranceToday").innerText =
    insurance;

    document.getElementById("pucToday").innerText =
    puc;

    document.getElementById("taxToday").innerText =
    tax;

    document.getElementById("permitToday").innerText =
    permit;
}

/* RENDER VEHICLES */

function renderTable(){

    const container =
    document.getElementById("vehicleTable");

    if(filteredVehicles.length === 0){

        container.innerHTML =
        "<p style='padding:20px;text-align:center;color:#777'>No vehicles found.</p>";

        document.getElementById("pagination").innerHTML =
        "";

        return;
    }

    const start =
    (currentPage-1)*perPage;

    const end =
    start+perPage;

    const pageVehicles =
    filteredVehicles.slice(start,end);

    container.innerHTML =
    "";

    pageVehicles.forEach(vehicle => {

        const card =
        document.createElement("div");

        card.className =
        "vehicle-card";

        card.innerHTML = `

            <div class="vehicle-main-line">

                <span class="vehicle-number-text">
                    🚗 ${vehicle.vehicle_number || "-"}
                </span>

                <span class="customer-text">
                    👤 ${vehicle.customer_name || "-"}
                </span>

                <span class="mobile-text">
                    📞 ${vehicle.mobile || "-"}
                </span>

            </div>

            <div class="vehicle-details">

                <div class="detail-row">

                    <span class="detail-label">
                        Registration Date-
                    </span>

                    <span class="detail-value date-normal">
                        ${formatDate(vehicle.registration_date)}
                    </span>

                </div>

                <div class="detail-row">

                    <span class="detail-label">
                        FITNESS -
                    </span>

                    <span class="detail-value ${getDateClass(vehicle.fitness_expiry)}">
                        ${formatDate(vehicle.fitness_expiry)}
                    </span>

                </div>

                <div class="detail-row">

                    <span class="detail-label">
                        TAX -
                    </span>

                    <span class="detail-value ${getDateClass(vehicle.tax_expiry)}">
                        ${formatDate(vehicle.tax_expiry)}
                    </span>

                </div>

                <div class="detail-row">

                    <span class="detail-label">
                        INSURANCE -
                    </span>

                    <span class="detail-value ${getDateClass(vehicle.insurance_expiry)}">
                        ${formatDate(vehicle.insurance_expiry)}
                    </span>

                </div>

                <div class="detail-row">

                    <span class="detail-label">
                        PUC -
                    </span>

                    <span class="detail-value ${getDateClass(vehicle.pucc_expiry)}">
                        ${formatDate(vehicle.pucc_expiry)}
                    </span>

                </div>

                <div class="detail-row">

                    <span class="detail-label">
                        PERMIT -
                    </span>

                    <span class="detail-value ${getDateClass(vehicle.permit_expiry)}">
                        ${formatDate(vehicle.permit_expiry)}
                    </span>

                </div>

            </div>

            <button
                class="edit-btn"
                onclick="editVehicle(${vehicle.id})">
                Edit
            </button>

            <button
                class="delete-btn"
                onclick="permanentDelete(${vehicle.id}, '${vehicle.photo_path || ""}')">
                Delete
            </button>

        `;

        container.appendChild(card);

    });

    renderPagination();
}

/* SEARCH */

function searchVehicle(){

    const search =
    document.getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

    filteredVehicles =
    allVehicles.filter(vehicle => {

        return (
            String(vehicle.vehicle_number || "")
                .toLowerCase()
                .includes(search)

            ||

            String(vehicle.customer_name || "")
                .toLowerCase()
                .includes(search)

            ||

            String(vehicle.mobile || "")
                .toLowerCase()
                .includes(search)
        );

    });

    currentPage = 1;

    renderTable();
}

/* PAGINATION */

function renderPagination(){

    const totalPages =
    Math.ceil(
        filteredVehicles.length /
        perPage
    );

    const pagination =
    document.getElementById("pagination");

    pagination.innerHTML =
    "";

    if(totalPages <= 1)
        return;

    for(
        let i=1;
        i<=totalPages;
        i++
    ){

        const button =
        document.createElement("button");

        button.innerText =
        i;

        if(i === currentPage)
            button.classList.add("active");

        button.onclick = () => {

            currentPage =
            i;

            renderTable();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        };

        pagination.appendChild(button);
    }
}

/* DELETE */

async function permanentDelete(
    id,
    photoPath
){

    const confirmDelete =
    confirm(
        "Are you sure you want to delete this vehicle?"
    );

    if(!confirmDelete)
        return;

    if(photoPath){

        const {
            error: storageError
        } = await supabaseClient
            .storage
            .from("vehicle-photos")
            .remove([photoPath]);

        if(storageError)
            console.log(storageError);
    }

    const {
        error
    } = await supabaseClient
        .from("vehicles")
        .delete()
        .eq("id",id);

    if(error){

        alert("Delete failed.");

        console.error(error);

        return;
    }

    await loadVehicles();
}
