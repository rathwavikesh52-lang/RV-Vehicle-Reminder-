/* =========================================================
   DATE HELPERS
========================================================= */

function parseDate(value){

  if(!value){

    return null;

  }


  if(
    String(value).toUpperCase() ===
    "LTT"
  ){

    return null;

  }


  const valueString =
  String(value);


  let match =
  valueString.match(
    /^(\d{4})-(\d{2})-(\d{2})/
  );


  if(match){

    return new Date(
      Number(match[1]),
      Number(match[2])-1,
      Number(match[3])
    );

  }


  match =
  valueString.match(
    /^(\d{2})\/(\d{2})\/(\d{4})$/
  );


  if(match){

    return new Date(
      Number(match[3]),
      Number(match[2])-1,
      Number(match[1])
    );

  }


  return null;

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(value){

  if(!value){

    return translations[
      currentLanguage
    ].noDate;

  }


  if(
    String(value).toUpperCase() ===
    "LTT"
  ){

    return "LTT";

  }


  const date =
  parseDate(value);


  if(!date){

    return String(value);

  }


  const day =
  String(
    date.getDate()
  ).padStart(2,"0");


  const month =
  String(
    date.getMonth()+1
  ).padStart(2,"0");


  const year =
  date.getFullYear();


  return (
    day +
    "/" +
    month +
    "/" +
    year
  );

}


/* =========================================================
   DAYS UNTIL EXPIRY
========================================================= */

function daysUntil(value){

  const date =
  parseDate(value);


  if(!date){

    return null;

  }


  const today =
  new Date();

  today.setHours(
    0,0,0,0
  );


  date.setHours(
    0,0,0,0
  );


  const difference =
  date.getTime() -
  today.getTime();


  return Math.ceil(
    difference /
    (1000 * 60 * 60 * 24)
  );

}


/* =========================================================
   DOCUMENT STATUS
========================================================= */

function getVehicleStatus(vehicle){

  const fields = [

    vehicle.fitness_expiry,

    vehicle.insurance_expiry,

    vehicle.pucc_expiry,

    vehicle.permit_expiry

  ];


  let minimumDays =
  null;


  fields.forEach(
    value => {

      const days =
      daysUntil(value);


      if(days === null){

        return;

      }


      if(
        minimumDays === null ||
        days < minimumDays
      ){

        minimumDays =
        days;

      }

    }
  );


  if(
    minimumDays !== null &&
    minimumDays < 0
  ){

    return "expired";

  }


  if(
    minimumDays !== null &&
    minimumDays <= 10
  ){

    return "expiring";

  }


  return "normal";

}


/* =========================================================
   EXPIRING DOCUMENT
========================================================= */

function getExpiringDocuments(vehicle){

  const docs = [

    {
      name:"Fitness",
      value:vehicle.fitness_expiry
    },

    {
      name:"Insurance",
      value:vehicle.insurance_expiry
    },

    {
      name:"PUCC",
      value:vehicle.pucc_expiry
    },

    {
      name:"Permit",
      value:vehicle.permit_expiry
    }

  ];


  return docs.filter(
    doc => {

      const days =
      daysUntil(
        doc.value
      );


      return (
        days !== null &&
        days >= 0 &&
        days <= 10
      );

    }
  );

}

    }

  ];


  return docs.filter(
    doc => {

      const days =
      daysUntil(
        doc.value
      );


      return (
        days !== null &&
        days < 0
      );

    }
  );

}


/* =========================================================
   CLASS PHOTO
========================================================= */

function getVehicleClassPhoto(
  vehicle
){

  const cls =
  String(
    vehicle.vehicle_class ||
    ""
  ).toUpperCase().trim();


  return (
    vehicleClassPhotos[cls] ||
    vehicleClassPhotos.LMV
  );

}


/* =========================================================
   CLASS NAME
========================================================= */

function getVehicleClassName(
  vehicle
){

  const cls =
  String(
    vehicle.vehicle_class ||
    ""
  ).toUpperCase();


  const names = {

    HGV:"HGV - Heavy Goods Vehicle",

    LGV:"LGV - Pick-up",

    LMV:"LMV - Light Motor Vehicle",

    LPV:"LPV - Passenger Vehicle",

    HPV:"HPV - Heavy Passenger Vehicle",

    "2WN":"2WN - Two Wheeler",

    "3WT":"3WT - Three Wheeler"

  };


  return (
    names[cls] ||
    "Vehicle Class"
  );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =========================================================
   RENDER EXPIRING / EXPIRED
========================================================= */

function renderAlerts(){

  const expiring =
  allVehicles.filter(
    vehicle =>
    getVehicleStatus(vehicle)
    === "expiring"
  );


  const expired =
  allVehicles.filter(
    vehicle =>
    getVehicleStatus(vehicle)
    === "expired"
  );


  document.getElementById(
    "expiringCount"
  ).textContent =
  expiring.length;


  document.getElementById(
    "expiredCount"
  ).textContent =
  expired.length;


  const expiringList =
  document.getElementById(
    "expiringList"
  );


  const expiredList =
  document.getElementById(
    "expiredList"
  );


  const t =
  translations[
    currentLanguage
  ];


  if(!expiring.length){

    expiringList.innerHTML =
      `<div class="empty">
        ${t.noExpiring}
      </div>`;

  }else{

    expiringList.innerHTML =
      expiring
        .map(
          vehicle =>
          smallVehicleCard(
            vehicle,
            false
          )
        )
        .join("");

  }


  if(!expired.length){

    expiredList.innerHTML =
      `<div class="empty">
        ${t.noExpired}
      </div>`;

  }else{

    expiredList.innerHTML =
      expired
        .map(
          vehicle =>
          smallVehicleCard(
            vehicle,
            true
          )
        )
        .join("");

  }

}


/* =========================================================
   SEARCH
========================================================= */

function searchVehicles(){

  const search =
  document.getElementById(
    "searchInput"
  ).value
    .trim()
    .toLowerCase();


  if(!search){

    filteredVehicles =
    [...allVehicles];

  }else{

    filteredVehicles =
    allVehicles.filter(
      vehicle => {

        const number =
        String(
          vehicle.vehicle_number ||
          ""
        ).toLowerCase();


        const customer =
        String(
          vehicle.customer_name ||
          ""
        ).toLowerCase();


        const phone =
        String(
          vehicle.mobile ||
          ""
        ).toLowerCase();


        const cls =
        String(
          vehicle.vehicle_class ||
          ""
        ).toLowerCase();


        return (
          number.includes(search) ||
          customer.includes(search) ||
          phone.includes(search) ||
          cls.includes(search)
        );

      }
    );

  }


  currentPage = 1;

  renderVehicleList();

}


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll(){

  renderAlerts();

  renderVehicleList();

}


/* =========================================================
   VEHICLE LIST
========================================================= */

function renderVehicleList(){

  const list =
  document.getElementById(
    "vehicleList"
  );


  const t =
  translations[
    currentLanguage
  ];


  document.getElementById(
    "recordCount"
  ).textContent =
  filteredVehicles.length +
  " " +
  t.records;


  if(!filteredVehicles.length){

    list.innerHTML =
      `<div class="empty">
        ${t.noVehicles}
      </div>`;


    updatePagination();

    return;

  }


  const totalPages =
  Math.ceil(
    filteredVehicles.length /
    VEHICLES_PER_PAGE
  );


  if(
    currentPage > totalPages
  ){

    currentPage =
    totalPages;

  }


  const start =
  (currentPage - 1) *
  VEHICLES_PER_PAGE;


  const end =
  start +
  VEHICLES_PER_PAGE;


  const pageVehicles =
  filteredVehicles.slice(
    start,
    end
  );


  list.innerHTML =
  pageVehicles
    .map(
      vehicle =>
      vehicleCard(vehicle)
    )
    .join("");


  updatePagination();

}


/* =========================================================
   PAGINATION
========================================================= */

function updatePagination(){

  const totalPages =
  Math.max(
    1,
    Math.ceil(
      filteredVehicles.length /
      VEHICLES_PER_PAGE
    )
  );


  document.getElementById(
    "pageInfo"
  ).textContent =
  translations[
    currentLanguage
  ].page +
  " " +
  currentPage +
  " / " +
  totalPages;


  document.getElementById(
    "prevBtn"
  ).disabled =
  currentPage <= 1;


  document.getElementById(
    "nextBtn"
  ).disabled =
  currentPage >= totalPages;

}


function previousPage(){

  if(
    currentPage > 1
  ){

    currentPage--;

    renderVehicleList();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


function nextPage(){

  const totalPages =
  Math.ceil(
    filteredVehicles.length /
    VEHICLES_PER_PAGE
  );


  if(
    currentPage < totalPages
  ){

    currentPage++;

    renderVehicleList();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


/* =========================================================
   LOAD VEHICLES
========================================================= */

async function loadVehicles(){

  const list =
  document.getElementById(
    "vehicleList"
  );


  list.innerHTML =
    `<div class="loading">
      Loading vehicles...
    </div>`;


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("vehicles")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(
        MAX_VEHICLES
      );


    if(error){

      throw error;

    }


    allVehicles =
    data || [];


    filteredVehicles =
    [...allVehicles];


    currentPage =
    1;


    document.getElementById(
      "totalCount"
    ).textContent =
    allVehicles.length;


    renderAll();


  }catch(error){

    console.error(error);


    list.innerHTML =
      `<div class="empty">
        Error loading vehicles:<br><br>
        ${escapeHtml(
          error.message ||
          error
        )}
      </div>`;

  }

}


/* =========================================================
   EDIT
========================================================= */

function editVehicle(id){

  window.location.href =
    "upload.html?id=" +
    encodeURIComponent(id);

}


/* =========================================================
   DELETE VEHICLE
========================================================= */

async function deleteVehicle(id){

  const t =
  translations[
    currentLanguage
  ];


  const confirmDelete =
  window.confirm(
    t.confirmDelete
  );


  if(!confirmDelete){

    return;

  }


  try{

    /*
      First find vehicle
    */

    const {
      data:vehicle,
      error:findError
    } =
    await supabaseClient
      .from("vehicles")
      .select(
        "id,photo_path"
      )
      .eq(
        "id",
        id
      )
      .maybeSingle();


    if(findError){

      throw findError;

    }


    /*
      Delete stored photo
    */

    if(
      vehicle &&
      vehicle.photo_path
    ){

      const {
        error:storageError
      } =
      await supabaseClient
        .storage
        .from("vehicle-photos")
        .remove([
          vehicle.photo_path
        ]);


      if(storageError){

        console.warn(
          "Photo delete warning:",
          storageError
        );

      }

    }


    /*
      Delete database record
    */

    const {
      error:deleteError
    } =
    await supabaseClient
      .from("vehicles")
      .delete()
      .eq(
        "id",
        id
      );


    if(deleteError){

      throw deleteError;

    }


    alert(
      t.deleted
    );


    await loadVehicles();


  }catch(error){

    console.error(error);


    alert(
      t.deleteError +
      "\n" +
      (
        error.message ||
        error
      )
    );

  }

}


/* =========================================================
   WHATSAPP
========================================================= */

function sendWhatsApp(id){

  const vehicle =
  allVehicles.find(
    item =>
    String(item.id) ===
    String(id)
  );


  if(!vehicle){

    return;

  }


  const t =
  translations[
    currentLanguage
  ];


  let phone =
  String(
    vehicle.mobile ||
    ""
  )
    .replace(
      /\D/g,
      ""
    );


  if(!phone){

    alert(
      t.noMobile
    );

    return;

  }


  /*
    Indian number
  */

  if(
    phone.length === 10
  ){

    phone =
    "91" +
    phone;

  }


  const expiringDocs =
  getExpiringDocuments(
    vehicle
  );


  const expiredDocs =
  getExpiredDocuments(
    vehicle
  );


  let documentDetails =
  "";


  if(
    expiringDocs.length
  ){

    documentDetails +=
      "\n\nExpiring Documents:\n" +
      expiringDocs
        .map(
          doc =>
          doc.name +
          ": " +
          formatDate(
            doc.value
          )
        )
        .join("\n");

  }


  if(
    expiredDocs.length
  ){

    documentDetails +=
      "\n\nExpired Documents:\n" +
      expiredDocs
        .map(
          doc =>
          doc.name +
          ": " +
          formatDate(
            doc.value
          )
        )
        .join("\n");

  }


  const message =
    t.whatsappMessage +
    (
      vehicle.vehicle_number ||
      ""
    ) +
    documentDetails +
    t.reminder;


  const url =
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(
      message
    );


  window.open(
    url,
    "_blank"
  );

}
