<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    linear-gradient(rgba(255,255,255,.90),rgba(255,255,255,.90)),
    url("https://rathwavikesh52-lang.github.io/RV-Vehicle-Reminder-/assets/background.png")
    center/cover fixed no-repeat;
  color:#222;
}

/* ================= HEADER ================= */

.header{
  background:#ffffff;
  border-bottom:1px solid #ddd;
  padding:10px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:55px;
  height:55px;
  object-fit:contain;
}

.header-title{
  font-size:22px;
  font-weight:800;
  color:#111;
}

.header-subtitle{
  font-size:12px;
  color:#666;
  margin-top:2px;
}

.language-buttons{
  display:flex;
  gap:6px;
}

.language-buttons button{
  border:none;
  padding:8px 12px;
  border-radius:7px;
  cursor:pointer;
  background:#eee;
  font-weight:700;
}

.language-buttons button.active{
  background:#007bff;
  color:white;
}

/* ================= MAIN ================= */

.container{
  width:100%;
  max-width:1500px;
  margin:auto;
  padding:15px;
}

/* ================= TOP BUTTON ================= */

.top-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
  gap:10px;
}

.add-btn{
  background:#198754;
  color:white;
  border:none;
  border-radius:8px;
  padding:11px 18px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.add-btn:hover{
  opacity:.9;
}

/* ================= STAT BOXES ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:12px;
}

.stat-box{
  background:white;
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.stat-title{
  font-size:13px;
  color:#555;
  font-weight:700;
}

.stat-number{
  font-size:26px;
  font-weight:800;
  margin-top:4px;
}

.total-number{
  color:#007bff;
}

.expiring-number{
  color:#e67e00;
}

.expired-number{
  color:#dc3545;
}

/* ================= DOCUMENT STATS ================= */

.document-expiry-stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-bottom:15px;
}

.document-box{
  background:white;
  border:1px solid #ddd;
  border-radius:9px;
  padding:9px 5px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,.07);
}

.document-title{
  font-size:12px;
  font-weight:700;
  color:#555;
}

.document-number{
  font-size:21px;
  font-weight:800;
  margin-top:3px;
  color:#dc3545;
}

/* ================= TODAY EXPIRY BOX ================= */

.today-expiry-box{
  background:white;
  border:1px solid #d7d7d7;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:15px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.today-expiry-header{
  background:#007bff;
  color:white;
  padding:9px 12px;
  font-size:14px;
  font-weight:800;
}

.today-expiry-scroll{
  max-height:52px;
  overflow-y:auto;
  overflow-x:hidden;
}

.today-expiry-row{
  display:grid;
  grid-template-columns:
    1.35fr
    1fr
    1fr
    1fr
    1fr
    1fr;
  min-width:650px;
  align-items:center;
  padding:7px 8px;
  border-bottom:1px solid #eee;
  font-size:12px;
}

.today-expiry-row:last-child{
  border-bottom:none;
}

.today-vehicle-number{
  font-weight:800;
  color:#111;
}

.today-expiry-item{
  text-align:center;
  font-weight:700;
}

.today-empty{
  padding:9px;
  text-align:center;
  color:#777;
  font-size:13px;
}

/* ================= SEARCH ================= */

.search-area{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.search-input{
  flex:1;
  padding:11px 12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:14px;
  outline:none;
}

.search-input:focus{
  border-color:#007bff;
}

/* ================= VEHICLE LIST ================= */

.section-title{
  font-size:18px;
  font-weight:800;
  margin:10px 0;
}

.vehicle-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* IMPORTANT:
   Vehicle card background NEVER changes based on expiry.
*/

.vehicle-card{
  display:grid;
  grid-template-columns:
    120px
    1.15fr
    1fr
    1fr
    82px;

  align-items:stretch;

  background:white;
  border:1px solid #ddd;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}

/* ================= VEHICLE PHOTO ================= */

.vehicle-photo{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px;
  border-right:1px solid #eee;
  background:white;
}

.vehicle-photo img{
  width:100%;
  max-width:100px;
  height:75px;
  object-fit:contain;
}

/* ================= VEHICLE INFO ================= */

.vehicle-info,
.vehicle-docs{
  padding:8px 10px;
  border-right:1px solid #eee;
  min-width:0;
}

.info-row,
.doc-row{
  display:flex;
  align-items:center;
  gap:5px;
  line-height:1.55;
}

.label{
  font-size:11px;
  color:#666;
  font-weight:700;
  white-space:nowrap;
}

.value{
  font-size:12px;
  font-weight:700;
  word-break:break-word;
}

/* ================= ONLY EXPIRY DATE COLORS ================= */

/* Expired */
.expiry-date-expired{
  color:#dc3545 !important;
  font-weight:800;
}

/* 0 to 5 days */
.expiry-date-near{
  color:#e67e00 !important;
  font-weight:800;
}

/* 6 to 15 days */
.expiry-date-soon{
  color:#b79500 !important;
  font-weight:800;
}

/* 16+ days = normal */

/* ================= ACTIONS ================= */

.vehicle-actions{
  display:flex;
  flex-direction:column;
  gap:5px;
  padding:7px;
  justify-content:center;
}

.action-btn{
  border:none;
  border-radius:6px;
  padding:6px 4px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}

.edit-btn{
  background:#ffc107;
  color:#111;
}

.whatsapp-btn{
  background:#25d366;
  color:white;
}

.delete-btn{
  background:#dc3545;
  color:white;
}

/* ================= PAGINATION ================= */

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin:18px 0;
}

.page-btn{
  border:none;
  background:#007bff;
  color:white;
  padding:7px 12px;
  border-radius:6px;
  cursor:pointer;
  font-weight:700;
}

.page-btn:disabled{
  background:#aaa;
  cursor:not-allowed;
}

.page-info{
  font-size:13px;
  font-weight:700;
}

/* ================= MESSAGE ================= */

.message{
  text-align:center;
  padding:20px;
  color:#777;
}

.error-message{
  color:#dc3545;
  font-weight:700;
}

/* ================= TABLET ================= */

/* ================= MOBILE ================= */

  .value{

  }

/* ================= HORIZONTAL SCROLL FOR VERY SMALL ================= */

.today-expiry-box{

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   ESCAPE JAVASCRIPT
===================================================== */

function escapeJs(value){

  return String(value || "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,'\\"')
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");

}


/* =====================================================
   DATE PARSER
===================================================== */

function parseDate(value){

  if(!value) return null;

  const str = String(value).trim();

  if(!str) return null;

  if(str.toUpperCase() === "LTT"){
    return null;
  }


  let match =
    str.match(
      /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
    );

  if(match){

    const day =
      Number(match[1]);

    const month =
      Number(match[2]) - 1;

    const year =
      Number(match[3]);

    const date =
      new Date(
        year,
        month,
        day
      );

    date.setHours(
      0,0,0,0
    );

    return date;

  }


  match =
    str.match(
      /^(\d{4})-(\d{1,2})-(\d{1,2})/
    );

  if(match){

    const year =
      Number(match[1]);

    const month =
      Number(match[2]) - 1;

    const day =
      Number(match[3]);

    const date =
      new Date(
        year,
        month,
        day
      );

    date.setHours(
      0,0,0,0
    );

    return date;

  }


  const date =
    new Date(str);

  if(!isNaN(date.getTime())){

    date.setHours(
      0,0,0,0
    );

    return date;

  }

  return null;

}


/* =====================================================
   DISPLAY DATE
===================================================== */

function displayDate(value){

  if(!value) return "";

  const str =
    String(value).trim();

  if(
    str.toUpperCase() === "LTT"
  ){
    return "LTT";
  }

  const date =
    parseDate(str);

  if(!date){
    return str;
  }

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");

  const month =
    String(
      date.getMonth()+1
    ).padStart(2,"0");

  const year =
    date.getFullYear();

  return `${day}/${month}/${year}`;

}


/* =====================================================
   DAYS UNTIL EXPIRY
===================================================== */

function daysUntil(value){

  const date =
    parseDate(value);

  if(!date){
    return null;
  }

  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );

  const difference =
    date.getTime() -
    today.getTime();

  return Math.ceil(
    difference /
    (1000*60*60*24)
  );

}


/* =====================================================
   ONLY DATE TEXT COLOR
===================================================== */

function getExpiryDateClass(value){

  const days =
    daysUntil(value);

  if(days === null){
    return "";
  }

  /* Expired */
  if(days < 0){
    return "expiry-date-expired";
  }

  /* 0 to 5 days */
  if(days >= 0 && days <= 5){
    return "expiry-date-near";
  }

  /* 6 to 15 days */
  if(days >= 6 && days <= 15){
    return "expiry-date-soon";
  }

  /* 16+ days */
  return "";

}


/* =====================================================
   EXISTING OVERALL EXPIRY STATUS
===================================================== */

function getExpiryStatus(vehicle){

  const fields = [

    vehicle.fitness_expiry,

    vehicle.insurance_expiry,

    vehicle.pucc_expiry,

    vehicle.permit_expiry

  ];

  const days =
    fields
      .map(daysUntil)
      .filter(
        value => value !== null
      );

  if(!days.length){
    return "normal";
  }

  const minimum =
    Math.min(...days);

  if(minimum < 0){
    return "expired";
  }

  if(minimum <= 10){
    return "expiring";
  }

  return "normal";

}


function isExpiring(vehicle){

  return getExpiryStatus(vehicle)
    === "expiring";

}


function isExpired(vehicle){

  return getExpiryStatus(vehicle)
    === "expired";

}


/* =====================================================
   TODAY COUNT
===================================================== */

function countTodayExpiry(field){

  return allVehicles.filter(
    vehicle =>
      daysUntil(
        vehicle[field]
      ) === 0
  ).length;

}

function renderVehicleList(){

  const container =
    document.getElementById(
      "vehicleList"
    );


  if(!filteredVehicles.length){

    container.innerHTML =
      `<div class="message">
        ${escapeHtml(
          translations[currentLanguage]
            .noVehicles
        )}
      </div>`;

    updatePagination();

    return;

  }


  const start =
    (currentPage - 1) *
    vehiclesPerPage;

  const end =
    start +
    vehiclesPerPage;


  const pageVehicles =
    filteredVehicles.slice(
      start,
      end
    );


  container.innerHTML =
    pageVehicles
      .map(vehicleCard)
      .join("");


  updatePagination();

}


/* =====================================================
   SEARCH
===================================================== */

function handleSearch(){

  const query =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  if(!query){

    filteredVehicles =
      [...allVehicles];

  }else{

    filteredVehicles =
      allVehicles.filter(
        vehicle => {

          const text = [

            vehicle.vehicle_number,

            vehicle.customer_name,

            vehicle.customer_mobile,

            vehicle.mobile,

            vehicle.vehicle_class

          ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();


          return text.includes(
            query
          );

        }
      );

  }


  currentPage = 1;

  renderVehicleList();

}


/* =====================================================
   PAGINATION
===================================================== */

function updatePagination(){

  const totalPages =
    Math.max(
      1,
      Math.ceil(
        filteredVehicles.length /
        vehiclesPerPage
      )
    );


  document.getElementById(
    "pageInfo"
  ).textContent =
    `Page ${currentPage} / ${totalPages}`;


  document.getElementById(
    "prevBtn"
  ).disabled =
    currentPage <= 1;


  document.getElementById(
    "nextBtn"
  ).disabled =
    currentPage >= totalPages;

}


function previousPage(){

  if(currentPage > 1){

    currentPage--;

    renderVehicleList();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


function nextPage(){

  const totalPages =
    Math.ceil(
      filteredVehicles.length /
      vehiclesPerPage
    );


  if(currentPage < totalPages){

    currentPage++;

    renderVehicleList();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}

/* =====================================================
   DELETE VEHICLE
===================================================== */

async function deleteVehicle(id){

  const confirmDelete =
    confirm(
      translations[currentLanguage]
        .deleteConfirm
    );


  if(!confirmDelete){
    return;
  }


  const vehicle =
    allVehicles.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(!vehicle){
    return;
  }


  try{

    /* --------------------------------
       Delete storage photo
    -------------------------------- */

    if(vehicle.photo_path){

      const {
        error:
        storageError
      } =
        await supabaseClient
          .storage
          .from(
            "vehicle-photos"
          )
          .remove([
            vehicle.photo_path
          ]);


      if(storageError){

        console.error(
          "Storage delete error:",
          storageError
        );

      }

    }


    /* --------------------------------
       Delete database row
    -------------------------------- */

    const {
      error:
      databaseError
    } =
      await supabaseClient
        .from("vehicles")
        .delete()
        .eq(
          "id",
          id
        );


    if(databaseError){

      console.error(
        databaseError
      );

      alert(
        translations[currentLanguage]
          .deleteFailed
      );

      return;

    }


    alert(
      translations[currentLanguage]
        .deleteSuccess
    );


    await loadVehicles();

  }catch(error){

    console.error(error);

    alert(
      translations[currentLanguage]
        .deleteFailed
    );

  }

}
