<style>
*{

}

body{

.header{

.brand-text h1{

.total-icon{

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://lqbhafspabtlqeubqxjg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let allVehicles = [];

let filteredVehicles = [];

let currentPage = 1;

const recordsPerPage = 10;


/* =========================================================
   STATUS
========================================================= */

function showStatus(message){

  const box =
  document.getElementById("status");

  if(!box) return;

  box.style.display =
  "block";

  box.textContent =
  message;

}


/* =========================================================
   TODAY DATE
========================================================= */

function getTodayDateString(){

  const today =
  new Date();

  const y =
  today.getFullYear();

  const m =
  String(
    today.getMonth()+1
  ).padStart(2,"0");

  const d =
  String(
    today.getDate()
  ).padStart(2,"0");

  return (
    y +
    "-" +
    m +
    "-" +
    d
  );

}


/* =========================================================
   TODAY DATE DISPLAY
========================================================= */

function updateTodayExpiryDate(){

  const todayString =
  getTodayDateString();

  const parts =
  todayString.split("-");

  const element =
  document.getElementById(
    "todayExpiryDate"
  );

  if(element){

    element.textContent =
      "(" +
      parts[2] +
      "/" +
      parts[1] +
      "/" +
      parts[0] +
      ")";

  }

}


/* =========================================================
   TODAY EXPIRY COUNTS
========================================================= */

function updateTodayExpiryCounts(){

  const todayString =
  getTodayDateString();


  const fields = {

    fitness_expiry:
      "todayFitness",

    insurance_expiry:
      "todayInsurance",

    pucc_expiry:
      "todayPuc",

    tax_expiry:
      "todayTax",

    permit_expiry:
      "todayPermit"

  };


  Object.entries(fields)
  .forEach(
    ([field,id]) => {


      const count =
      allVehicles.filter(
        vehicle => {


          if(
            !vehicle[field]
          ){

            return false;

          }


          const value =
          String(
            vehicle[field]
          ).trim();


          /*
            LTT is not a date.
          */

          if(
            value.toUpperCase()
            === "LTT"
          ){

            return false;

          }


          /*
            Exact today's date only.
          */

          return (
            value.slice(0,10)
            ===
            todayString
          );

        }
      ).length;


      const element =
      document.getElementById(id);


      if(element){

        element.textContent =
          count;

      }

    }
  );

}


/* =========================================================
   PARSE DATE
========================================================= */

function parseDate(value){

  if(!value) return null;

  const stringValue =
  String(value).trim();


  if(
    stringValue.toUpperCase()
    === "LTT"
  ){

    return null;

  }


  /*
    YYYY-MM-DD
  */

  let match =
  stringValue.match(
    /^(\d{4})-(\d{2})-(\d{2})/
  );


  if(match){

    return new Date(
      Number(match[1]),
      Number(match[2])-1,
      Number(match[3])
    );

  }


  /*
    DD/MM/YYYY
  */

  match =
  stringValue.match(
    /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
  );


  if(match){

    return new Date(
      Number(match[3]),
      Number(match[2])-1,
      Number(match[1])
    );

  }


  /*
    DD-MM-YYYY
  */

  match =
  stringValue.match(
    /^(\d{1,2})-(\d{1,2})-(\d{4})$/
  );


  if(match){

    return new Date(
      Number(match[3]),
      Number(match[2])-1,
      Number(match[1])
    );

  }


  return null;

}


/* =========================================================
   DAYS LEFT
========================================================= */

function daysLeft(value){

  const date =
  parseDate(value);

  if(!date){

    return null;

  }


  const today =
  new Date();

  today.setHours(
    0,0,0,0
  );

  date.setHours(
    0,0,0,0
  );


  return Math.ceil(
    (
      date.getTime() -
      today.getTime()
    ) /
    86400000
  );

}


/* =========================================================
   EXPIRED
========================================================= */

function isExpired(value){

  const days =
  daysLeft(value);

  return (
    days !== null &&
    days < 0
  );

}


/* =========================================================
   EXPIRING SOON
========================================================= */

function isExpiringSoon(value){

  const days =
  daysLeft(value);

  return (
    days !== null &&
    days >= 0 &&
    days <= 10
  );

}


/* =========================================================
   FORMAT DATE
   ALWAYS DD/MM/YYYY
========================================================= */

function formatDate(value){

  if(!value){

    return "-";

  }


  if(
    String(value)
      .trim()
      .toUpperCase()
      ===
      "LTT"
  ){

    return "LTT";

  }


  const valueString =
  String(value).trim();


  /*
    YYYY-MM-DD
  */

  let match =
  valueString.match(
    /^(\d{4})-(\d{2})-(\d{2})/
  );


  if(match){

    return (
      match[3] +
      "/" +
      match[2] +
      "/" +
      match[1]
    );

  }


  /*
    DD/MM/YYYY
    DD-MM-YYYY
    DD.MM.YYYY
  */

  match =
  valueString.match(
    /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/
  );


  if(match){

    return (
      String(match[1]).padStart(2,"0") +
      "/" +
      String(match[2]).padStart(2,"0") +
      "/" +
      match[3]
    );

  }


  /*
    DD-MMM-YYYY
  */

  const months = {

    JAN:"01",
    FEB:"02",
    MAR:"03",
    APR:"04",
    MAY:"05",
    JUN:"06",
    JUL:"07",
    AUG:"08",
    SEP:"09",
    OCT:"10",
    NOV:"11",
    DEC:"12"

  };


  match =
  valueString.match(
    /^(\d{1,2})[-\/.\s]([A-Za-z]{3,9})[-\/.\s](\d{4})$/i
  );


  if(match){

    const day =
    String(match[1])
      .padStart(2,"0");

    const month =
    months[
      match[2]
        .substring(0,3)
        .toUpperCase()
    ];

    const year =
    match[3];


    if(month){

      return (
        day +
        "/" +
        month +
        "/" +
        year
      );

    }

  }


  return valueString;

}


/* =========================================================
   BADGE
========================================================= */

function getDateBadge(value){

  if(!value){

    return `<span class="detail-value">-</span>`;

  }


  if(
    String(value)
      .trim()
      .toUpperCase()
      ===
      "LTT"
  ){

    return `
      <span class="badge badge-ltt">
        LTT
      </span>
    `;

  }


  const formatted =
  formatDate(value);


  if(
    isExpired(value)
  ){

    return `
      <span class="badge badge-expired">
        ${formatted}
      </span>
    `;

  }


  if(
    isExpiringSoon(value)
  ){

    return `
      <span class="badge badge-soon">
        ${formatted}
      </span>
    `;

  }


  return `
    <span class="badge badge-normal">
      ${formatted}
    </span>
  `;

}

/* =========================================================
   ACTIVE EXPIRY PRIORITY
========================================================= */

function getVehicleExpiryPriority(vehicle){

  const fields = [

    "fitness_expiry",
    "insurance_expiry",
    "pucc_expiry",
    "tax_expiry",
    "permit_expiry"

  ];


  let best =
  999999;


  fields.forEach(
    field => {

      const days =
      daysLeft(
        vehicle[field]
      );


      if(
        days !== null &&
        days < best
      ){

        best = days;

      }

    }
  );


  return best;

}

/* =========================================================
   UPDATE SUMMARY
========================================================= */

function updateSummary(){

  let expiringSoon =
  0;

  let expired =
  0;


  const fields = [

    "fitness_expiry",
    "insurance_expiry",
    "tax_expiry",
    "pucc_expiry",
    "permit_expiry"

  ];


  allVehicles.forEach(
    vehicle => {

      fields.forEach(
        field => {

          const value =
          vehicle[field];


          if(
            isExpired(value)
          ){

            expired++;

          }else if(
            isExpiringSoon(value)
          ){

            expiringSoon++;

          }

        }
      );

    }
  );


  document.getElementById(
    "expiringSoonCount"
  ).textContent =
    expiringSoon;


  document.getElementById(
    "expiredCount"
  ).textContent =
    expired;

}


/* =========================================================
   SORT VEHICLES
========================================================= */

function sortVehiclesForDisplay(){

  filteredVehicles.sort(
    (a,b) => {

      const aPriority =
      getVehicleExpiryPriority(a);

      const bPriority =
      getVehicleExpiryPriority(b);


      return (
        aPriority -
        bPriority
      );

    }
  );

}


/* =========================================================
   RENDER LIST
========================================================= */

function renderList(){

  const list =
  document.getElementById(
    "vehicleList"
  );


  const pagination =
  document.getElementById(
    "pagination"
  );


  if(
    !filteredVehicles.length
  ){

    list.innerHTML = `
      <div class="empty">
        No vehicles found.
      </div>
    `;

    pagination.innerHTML =
      "";

    return;

  }


  const totalPages =
  Math.ceil(
    filteredVehicles.length /
    recordsPerPage
  );


  if(
    currentPage > totalPages
  ){

    currentPage =
      totalPages;

  }


  const start =
  (
    currentPage - 1
  ) *
  recordsPerPage;


  const end =
  start +
  recordsPerPage;


  const pageVehicles =
  filteredVehicles.slice(
    start,
    end
  );


  list.innerHTML =
    pageVehicles
      .map(
        renderVehicle
      )
      .join("");


  renderPagination(
    totalPages
  );

}


/* =========================================================
   PAGINATION
========================================================= */

function renderPagination(
  totalPages
){

  const pagination =
  document.getElementById(
    "pagination"
  );


  if(
    totalPages <= 1
  ){

    pagination.innerHTML =
      "";

    return;

  }


  let html = "";


  html += `
    <button
      class="page-btn"
      onclick="changePage(${currentPage-1})"
      ${currentPage===1 ? "disabled" : ""}
    >
      Previous
    </button>
  `;


  for(
    let i=1;
    i<=totalPages;
    i++
  ){

    html += `
      <button
        class="page-btn ${i===currentPage ? "active" : ""}"
        onclick="changePage(${i})"
      >
        ${i}
      </button>
    `;

  }


  html += `
    <span class="page-info">
      Page ${currentPage} of ${totalPages}
    </span>
  `;


  html += `
    <button
      class="page-btn"
      onclick="changePage(${currentPage+1})"
      ${currentPage===totalPages ? "disabled" : ""}
    >
      Next
    </button>
  `;


  pagination.innerHTML =
    html;

}


/* =========================================================
   CHANGE PAGE
========================================================= */

function changePage(page){

  const totalPages =
  Math.ceil(
    filteredVehicles.length /
    recordsPerPage
  );


  if(
    page < 1 ||
    page > totalPages
  ){

    return;

  }


  currentPage =
    page;


  renderList();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   SEARCH
========================================================= */

function handleSearch(){

  const search =
  document.getElementById(
    "searchInput"
  )
  .value
  .trim()
  .toLowerCase();


  if(!search){

    filteredVehicles =
      [...allVehicles];

  }else{

    filteredVehicles =
      allVehicles.filter(
        vehicle => {

          const number =
          String(
            vehicle.vehicle_number || ""
          ).toLowerCase();

          const customer =
          String(
            vehicle.customer_name || ""
          ).toLowerCase();

          const mobile =
          String(
            vehicle.mobile || ""
          ).toLowerCase();


          return (
            number.includes(search) ||
            customer.includes(search) ||
            mobile.includes(search)
          );

        }
      );

  }


  currentPage =
    1;


  sortVehiclesForDisplay();

  renderList();

}


/* =========================================================
   LOAD VEHICLES
========================================================= */

async function loadVehicles(){

  try{

    showStatus(
      "Loading vehicles..."
    );


    const {
      data,
      error
    } =
    await supabaseClient
      .from("vehicles")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      throw error;

    }


    allVehicles =
      data || [];


    filteredVehicles =
      [...allVehicles];


    document.getElementById(
      "headerTotalVehicles"
    ).textContent =
      allVehicles.length;


    updateTodayExpiryDate();

    updateTodayExpiryCounts();

    updateSummary();

    sortVehiclesForDisplay();

    renderList();


    document.getElementById(
      "status"
    ).style.display =
      "none";


  }catch(error){

    console.error(
      error
    );


    showStatus(
      "Error loading vehicles:\n" +
      (
        error.message ||
        error
      )
    );

  }

}

/* =========================================================
   EDIT VEHICLE
========================================================= */

function editVehicle(id){

  const vehicle =
  allVehicles.find(
    item =>
    String(item.id)
    ===
    String(id)
  );


  if(!vehicle){

    alert(
      "Vehicle not found."
    );

    return;

  }


  /*
    Store selected vehicle
    for upload page.
  */

  localStorage.setItem(
    "editVehicle",
    JSON.stringify(vehicle)
  );


  window.location.href =
    "upload.html";

}


/* =========================================================
   DELETE PHOTO
========================================================= */

async function deletePhoto(
  path
){

  if(!path){

    return;

  }


  try{

    const {
      error
    } =
    await supabaseClient
      .storage
      .from("vehicle-photos")
      .remove([
        path
      ]);


    if(error){

      console.warn(
        "Photo delete error:",
        error
      );

    }

  }catch(error){

    console.warn(
      error
    );

  }

}


/* =========================================================
   DELETE VEHICLE
========================================================= */

async function deleteVehicle(id){

  const vehicle =
  allVehicles.find(
    item =>
    String(item.id)
    ===
    String(id)
  );


  if(!vehicle){

    return;

  }


  const confirmed =
  confirm(
    "Are you sure you want to delete vehicle " +
    (
      vehicle.vehicle_number ||
      ""
    ) +
    "?"
  );


  if(!confirmed){

    return;

  }


  try{

    showStatus(
      "Deleting vehicle..."
    );


    /*
      Delete photo first.
    */

    if(
      vehicle.photo_path
    ){

      await deletePhoto(
        vehicle.photo_path
      );

    }


    /*
      Delete database record.
    */

    const {
      error
    } =
    await supabaseClient
      .from("vehicles")
      .delete()
      .eq(
        "id",
        id
      );


    if(error){

      throw error;

    }


    alert(
      "Vehicle deleted successfully."
    );


    await loadVehicles();


  }catch(error){

    console.error(
      error
    );


    showStatus(
      "Delete Error:\n" +
      (
        error.message ||
        error
      )
    );

  }

}
