<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RV Vehicle Reminder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#092754;

  background-image:
    url("./assets/background.png");

  background-size:cover;

  background-position:
    center center;

  background-repeat:no-repeat;

  background-attachment:fixed;

  min-height:100vh;
}


/* =====================================================
   PAGE
===================================================== */

.page{
  width:100%;

  max-width:1380px;

  margin:0 auto;

  padding:
    24px
    22px
    35px;
}


/* =====================================================
   HEADER
===================================================== */

.top-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:25px;

  margin-bottom:25px;
}


.brand{

  display:flex;

  align-items:center;

  gap:18px;

  min-width:0;
}


.logo{

  width:205px;

  height:145px;

  object-fit:contain;

  filter:
    drop-shadow(
      0 3px 4px
      rgba(0,0,0,.12)
    );
}


.brand-text{

  min-width:0;
}


.brand-text h1{

  margin:0;

  font-size:42px;

  font-weight:800;

  color:#0b315f;

  letter-spacing:-1px;
}


.brand-text p{

  margin:
    7px
    0
    0;

  font-size:22px;

  color:#21466e;
}


.tagline{

  margin-top:14px;

  font-size:19px;

  font-style:italic;

  color:#173d64;

  font-weight:600;
}


.tagline span{

  color:#e59a1c;

  margin:
    0
    7px;
}


/* =====================================================
   TOTAL VEHICLES
===================================================== */

.total-card{

  background:
    rgba(
      255,
      255,
      255,
      .95
    );

  border-radius:20px;

  min-width:285px;

  padding:
    22px
    28px;

  display:flex;

  align-items:center;

  gap:18px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.13);
}


.total-icon{

  width:72px;

  height:72px;

  border-radius:50%;

  background:#1478df;

  display:flex;

  align-items:center;

  justify-content:center;

  color:white;

  flex-shrink:0;
}


.total-icon svg{

  width:47px;

  height:47px;
}


.total-label{

  font-size:20px;

  font-weight:700;

  color:#102f56;
}


.total-number{

  margin-top:3px;

  font-size:44px;

  line-height:1;

  color:#1265c7;

  font-weight:800;
}


/* =====================================================
   MAIN DASHBOARD
===================================================== */

.dashboard{

  background:
    rgba(
      255,
      255,
      255,
      .94
    );

  border-radius:22px;

  padding:20px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.14);
}


/* =====================================================
   LIST HEADER
===================================================== */

.list-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  margin-bottom:14px;
}


.list-title{

  display:flex;

  align-items:center;

  gap:13px;

  font-size:27px;

  font-weight:800;

  color:#092754;

  white-space:nowrap;
}


.list-title svg{

  width:42px;

  height:42px;

  flex-shrink:0;
}


/* =====================================================
   SEARCH + ADD
===================================================== */

.list-tools{

  display:flex;

  align-items:center;

  gap:12px;
}


.search-box{

  width:430px;

  height:45px;

  border:
    1px solid
    #cbd8e8;

  border-radius:12px;

  background:white;

  display:flex;

  align-items:center;

  padding:
    0
    14px;
}


.search-box svg{

  width:21px;

  height:21px;

  color:#55718f;

  flex-shrink:0;
}


.search-box input{

  width:100%;

  border:0;

  outline:0;

  font-size:15px;

  margin-left:9px;

  color:#183b60;
}


.search-box input::placeholder{

  color:#6d8095;
}


.add-btn{

  height:45px;

  border:0;

  border-radius:11px;

  background:#1675db;

  color:white;

  padding:
    0
    19px;

  display:flex;

  align-items:center;

  gap:8px;

  font-size:15px;

  font-weight:700;

  cursor:pointer;

  box-shadow:
    0 3px 8px
    rgba(
      22,
      117,
      219,
      .25
    );
}


.add-btn:hover{

  background:#0964c7;
}


.add-btn svg{

  width:20px;

  height:20px;
}


/* =====================================================
   VEHICLE LIST
===================================================== */

#vehicleList{

  display:flex;

  flex-direction:column;

  gap:12px;
}


/* =====================================================
   VEHICLE CARD
===================================================== */

.vehicle-card{

  width:100%;

  min-height:160px;

  background:
    rgba(
      255,
      255,
      255,
      .97
    );

  border:
    1px solid
    #dce6f1;

  border-radius:15px;

  display:grid;

  grid-template-columns:
    330px
    minmax(270px,1fr)
    minmax(270px,1fr)
    80px;

  align-items:stretch;

  overflow:hidden;

  box-shadow:
    0 3px 12px
    rgba(
      20,
      55,
      90,
      .07
    );

  transition:
    .2s ease;
}


.vehicle-card:hover{

  box-shadow:
    0 5px 18px
    rgba(
      20,
      55,
      90,
      .13
    );

  transform:
    translateY(-1px);
}


/* =====================================================
   VEHICLE MAIN
===================================================== */

.vehicle-main{

  display:flex;

  align-items:center;

  gap:18px;

  padding:18px;

  min-width:0;
}


.vehicle-photo{

  width:116px;

  height:116px;

  object-fit:cover;

  border-radius:10px;

  background:#e8f0f7;

  flex-shrink:0;
}


.vehicle-photo.no-photo{

  object-fit:contain;

  padding:18px;
}


.vehicle-basic{

  min-width:0;
}


.vehicle-number{

  font-size:24px;

  font-weight:800;

  color:#0a315f;

  letter-spacing:.3px;

  word-break:break-word;
}


.vehicle-type{

  display:inline-block;

  margin-top:9px;

  padding:
    6px
    13px;

  border-radius:20px;

  background:#dff0ff;

  color:#1162a9;

  font-size:14px;

  font-weight:700;
}


.customer-name{

  margin-top:8px;

  font-size:13px;

  color:#60758c;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  max-width:170px;
}


.mobile-number{

  margin-top:4px;

  font-size:12px;

  color:#788da3;
}


/* =====================================================
   DETAILS
===================================================== */

.detail-column{

  padding:
    17px
    20px;

  border-left:
    1px solid
    #d8e2ec;

  display:flex;

  flex-direction:column;

  justify-content:center;

  gap:15px;
}


.detail-item{

  display:grid;

  grid-template-columns:
    24px
    minmax(100px,1fr)
    auto;

  align-items:center;

  gap:7px;

  min-width:0;
}


.detail-icon{

  width:21px;

  height:21px;

  color:#0867be;
}


.detail-label{

  font-size:14px;

  color:#355573;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


.date-badge{

  padding:
    7px
    13px;

  border-radius:16px;

  font-size:13px;

  font-weight:800;

  white-space:nowrap;

  text-align:center;

  min-width:105px;
}


/* =====================================================
   BADGES
===================================================== */

.badge-blue{

  background:#dff0ff;

  color:#0961af;
}


.badge-green{

  background:#dff7e9;

  color:#168044;
}


.badge-purple{

  background:#eee5ff;

  color:#6542ad;
}


.badge-orange{

  background:#fff0d7;

  color:#db7710;
}


.badge-red{

  background:#ffe1e5;

  color:#e32735;
}


.badge-teal{

  background:#dcf7f3;

  color:#118b81;
}


/* =====================================================
   ACTION ICONS
===================================================== */

.card-actions{

  border-left:
    1px solid
    #d8e2ec;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:10px;

  background:
    rgba(
      249,
      252,
      255,
      .75
    );
}


.icon-btn{

  width:42px;

  height:42px;

  border:0;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  cursor:pointer;

  transition:.2s ease;

  color:white;
}


.icon-btn svg{

  width:21px;

  height:21px;
}


.icon-btn:hover{

  transform:
    scale(1.08);
}


.edit-icon{

  background:#1478df;
}


.delete-icon{

  background:#ef3039;
}


.whatsapp-icon{

  background:#12b76a;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{

  padding:
    55px
    20px;

  text-align:center;

  color:#637a91;

  font-size:17px;
}


/* =====================================================
   PAGINATION
===================================================== */

.pagination{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:28px;

  padding:
    18px
    0
    4px;
}


.page-btn{

  min-width:105px;

  height:40px;

  border:0;

  border-radius:10px;

  background:#0d427e;

  color:white;

  font-size:14px;

  font-weight:700;

  cursor:pointer;
}


.page-btn:hover:not(:disabled){

  background:#082f5d;
}


.page-btn:disabled{

  opacity:.45;

  cursor:not-allowed;
}


.page-info{

  font-size:15px;

  font-weight:700;

  color:#153e68;
}


/* =====================================================
   BOTTOM SUMMARY
===================================================== */

.bottom-summary{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:55px;

  margin-top:16px;

  padding:
    0
    10px
    4px;
}


.summary-box{

  min-height:80px;

  border-radius:15px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    14px
    22px;

  border:
    1px solid
    transparent;
}


.summary-left{

  display:flex;

  align-items:center;

  gap:17px;
}


.summary-icon{

  width:43px;

  height:43px;
}


.summary-title{

  font-size:20px;

  font-weight:800;
}


.summary-count{

  font-size:37px;

  font-weight:800;
}


.expiring-box{

  background:#fff6df;

  border-color:#f7dfad;

  color:#ef8d08;
}


.expiring-box .summary-title{

  color:#112f52;
}


.expired-box{

  background:#fff0f2;

  border-color:#f4d2d7;

  color:#e52c38;
}


.expired-box .summary-title{

  color:#112f52;
}


/* =====================================================
   STATUS
===================================================== */

.status-message{

  display:none;

  margin:
    12px
    0;

  padding:
    11px
    14px;

  border-radius:10px;

  background:#eef6ff;

  color:#174a7d;

  font-size:14px;
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:1100px){

  .page{
    padding:
      15px
      12px
      25px;
  }


  .logo{

    width:150px;

    height:110px;
  }


  .brand-text h1{

    font-size:30px;
  }


  .brand-text p{

    font-size:17px;
  }


  .tagline{

    font-size:14px;
  }


  .total-card{

    min-width:230px;

    padding:16px;
  }


  .vehicle-card{

    grid-template-columns:
      285px
      minmax(250px,1fr)
      minmax(250px,1fr)
      75px;
  }


  .vehicle-main{

    min-width:285px;
  }


  .detail-column{

    min-width:250px;
  }


  .card-actions{

    min-width:75px;
  }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  body{

    background-attachment:scroll;
  }


  .page{

    padding:
      10px
      8px
      20px;
  }


  .top-header{

    flex-direction:column;

    gap:10px;
  }


  .brand{

    width:100%;

    gap:10px;
  }


  .logo{

    width:100px;

    height:80px;
  }


  .brand-text h1{

    font-size:23px;

    letter-spacing:-.5px;
  }


  .brand-text p{

    font-size:13px;

    margin-top:4px;
  }


  .tagline{

    font-size:12px;

    margin-top:6px;
  }


  .total-card{

    width:100%;

    min-width:0;

    padding:
      12px
      18px;

    border-radius:15px;
  }


  .total-icon{

    width:48px;

    height:48px;
  }


  .total-icon svg{

    width:32px;

    height:32px;
  }


  .total-label{

    font-size:14px;
  }


  .total-number{

    font-size:29px;
  }


  .dashboard{

    padding:12px;

    border-radius:17px;
  }


  .list-header{

    flex-direction:column;

    align-items:stretch;
  }


  .list-title{

    font-size:21px;
  }


  .list-title svg{

    width:32px;

    height:32px;
  }


  .list-tools{

    width:100%;
  }


  .search-box{

    flex:1;

    width:auto;
  }


  .add-btn{

    padding:
      0
      13px;
  }


  /* MOBILE SWIPE */

  #vehicleList{

    display:flex;

    flex-direction:row;

    overflow-x:auto;

    overflow-y:hidden;

    gap:12px;

    scroll-snap-type:
      x mandatory;

    -webkit-overflow-scrolling:
      touch;

    scrollbar-width:none;

    padding:
      2px
      2px
      12px;

    touch-action:pan-x;
  }


  #vehicleList::-webkit-scrollbar{

    display:none;
  }


  .vehicle-card{

    flex:
      0 0 94%;

    width:94%;

    min-width:94%;

    display:grid;

    grid-template-columns:
      260px
      250px
      250px
      70px;

    scroll-snap-align:start;

    scroll-snap-stop:always;

    min-height:150px;

    overflow:hidden;
  }


  .vehicle-main{

    min-width:260px;
  }


  .vehicle-photo{

    width:90px;

    height:90px;
  }


  .vehicle-number{

    font-size:20px;
  }


  .detail-column{

    min-width:250px;

    padding:
      14px
      15px;
  }


  .detail-label{

    font-size:12px;
  }


  .date-badge{

    font-size:11px;

    min-width:90px;

    padding:
      6px
      8px;
  }


  .icon-btn{

    width:38px;

    height:38px;
  }


  .pagination{

    gap:13px;
  }


  .page-btn{

    min-width:85px;
  }


  .bottom-summary{

    grid-template-columns:
      1fr
      1fr;

    gap:8px;

    padding:0;
  }


  .summary-box{

    min-height:70px;

    padding:10px;
  }


  .summary-left{

    gap:7px;
  }


  .summary-icon{

    width:31px;

    height:31px;
  }


  .summary-title{

    font-size:13px;
  }


  .summary-count{

    font-size:27px;
  }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:390px){

  .vehicle-card{

    flex:
      0 0 96%;

    width:96%;

    min-width:96%;
  }


  .bottom-summary{

    gap:5px;
  }


  .summary-title{

    font-size:12px;
  }


  .summary-count{

    font-size:24px;
  }

}

</style>
</head>


<body>


<div class="page">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="top-header">


  <div class="brand">


    <img
      src="./assets/logo.png"
      class="logo"
      alt="RV Vehicle Reminder"
    >


    <div class="brand-text">


      <h1>
        RV Vehicle Reminder
      </h1>


      <p>
        Vehicle Expiry Management System
      </p>


      <div class="tagline">

        Stay Alert

        <span>•</span>

        Stay Legal

        <span>•</span>

        Drive Safe

      </div>


    </div>


  </div>



  <!-- TOTAL VEHICLES -->

  <div class="total-card">


    <div class="total-icon">


      <!-- FRONT CAR ICON -->

      <svg
        viewBox="0 0 64 64"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >

        <path
          d="M15 38L19 25C19.8 22.2 22.4 20 25.3 20H38.7C41.6 20 44.2 22.2 45 25L49 38"
          stroke="white"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <rect
          x="11"
          y="35"
          width="42"
          height="15"
          rx="4"
          fill="white"
        />

        <rect
          x="16"
          y="39"
          width="9"
          height="5"
          rx="2"
          fill="#1478df"
        />

        <rect
          x="39"
          y="39"
          width="9"
          height="5"
          rx="2"
          fill="#1478df"
        />

        <circle
          cx="19"
          cy="51"
          r="4"
          fill="white"
        />

        <circle
          cx="45"
          cy="51"
          r="4"
          fill="white"
        />

      </svg>


    </div>


    <div>


      <div class="total-label">
        Total Vehicles
      </div>


      <div
        class="total-number"
        id="headerTotalVehicles"
      >
        0
      </div>


    </div>


  </div>


</header>



<!-- =====================================================
     DASHBOARD
===================================================== -->

<main class="dashboard">


  <div
    id="statusMessage"
    class="status-message"
  ></div>



  <!-- ===================================================
       LIST HEADER
  ==================================================== -->

  <div class="list-header">


    <div class="list-title">


      <!-- VEHICLE LIST CAR ICON -->

      <svg
        viewBox="0 0 64 64"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >

        <path
          d="M14 38L18 25C18.8 22.2 21.4 20 24.3 20H39.7C42.6 20 45.2 22.2 46 25L50 38"
          stroke="#092754"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <rect
          x="10"
          y="34"
          width="44"
          height="16"
          rx="4"
          fill="#092754"
        />

        <rect
          x="16"
          y="38"
          width="10"
          height="5"
          rx="2"
          fill="white"
        />

        <rect
          x="38"
          y="38"
          width="10"
          height="5"
          rx="2"
          fill="white"
        />

        <circle
          cx="19"
          cy="51"
          r="4"
          fill="#092754"
        />

        <circle
          cx="45"
          cy="51"
          r="4"
          fill="#092754"
        />

      </svg>


      VEHICLE LIST


    </div>



    <div class="list-tools">


      <!-- SEARCH -->

      <div class="search-box">


        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <circle
            cx="11"
            cy="11"
            r="7"
          />

          <path
            d="M20 20l-4-4"
          />

        </svg>


        <input
          type="text"
          id="searchInput"
          placeholder="Search by Vehicle Number..."
          oninput="handleSearch()"
        >


      </div>



      <!-- ADD VEHICLE -->

      <button
        class="add-btn"
        onclick="goUpload()"
      >


        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >

          <path d="M12 5v14"/>

          <path d="M5 12h14"/>

        </svg>


        Add Vehicle


      </button>


    </div>


  </div>



  <!-- ===================================================
       VEHICLE LIST
  ==================================================== -->

  <div id="vehicleList"></div>



  <!-- ===================================================
       PAGINATION
  ==================================================== -->

  <div class="pagination">


    <button
      id="previousBtn"
      class="page-btn"
      onclick="previousPage()"
    >
      Previous
    </button>


    <div
      id="pageInfo"
      class="page-info"
    >
      Page 1 of 1
    </div>


    <button
      id="nextBtn"
      class="page-btn"
      onclick="nextPage()"
    >
      Next
    </button>


  </div>



  <!-- ===================================================
       BOTTOM SUMMARY
  ==================================================== -->

  <div class="bottom-summary">


    <!-- EXPIRING SOON -->

    <div
      class="summary-box expiring-box"
    >


      <div class="summary-left">


        <svg
          class="summary-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <circle
            cx="12"
            cy="13"
            r="7"
          />

          <path

/* =====================================================
   DATE PARSE
===================================================== */

function parseDate(value){

  if(!value){
    return null;
  }


  if(
    typeof value !==
    "string"
  ){

    return null;
  }


  if(
    value
      .toUpperCase() ===
    "LTT"
  ){

    return null;
  }


  const date =
    new Date(
      value +
      "T00:00:00"
    );


  if(
    isNaN(
      date.getTime()
    )
  ){

    return null;
  }


  return date;
}


/* =====================================================
   DAYS LEFT
===================================================== */

function daysLeft(value){

  const date =
    parseDate(value);


  if(!date){
    return null;
  }


  const today =
    new Date();


  today.setHours(
    0,
    0,
    0,
    0
  );


  const difference =
    date.getTime() -
    today.getTime();


  return Math.ceil(
    difference /
    (
      1000 *
      60 *
      60 *
      24
    )
  );
}


/* =====================================================
   EXPIRING
===================================================== */

function isExpiringSoon(value){

  const days =
    daysLeft(value);


  return (
    days !== null &&
    days >= 0 &&
    days <= 10
  );
}


/* =====================================================
   EXPIRED
===================================================== */

function isExpired(value){

  const days =
    daysLeft(value);


  return (
    days !== null &&
    days < 0
  );
}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

  if(!value){
    return "-";
  }


  if(
    String(value)
      .toUpperCase() ===
    "LTT"
  ){

    return "LTT";
  }


  const date =
    parseDate(value);


  if(!date){
    return value;
  }


  const months = [

    "Jan",
    "Feb",
    "Mar",
    "Apr",
    "May",
    "Jun",
    "Jul",
    "Aug",
    "Sep",
    "Oct",
    "Nov",
    "Dec"

  ];


  return (

    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    )

    +

    "-"

    +

    months[
      date.getMonth()
    ]

    +

    "-"

    +

    date.getFullYear()

  );
}

/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

  const total =
    allVehicles.length;


  let expiring = 0;

  let expired = 0;


  allVehicles.forEach(
    vehicle => {


      const fields = [

        vehicle.fitness_expiry,

        vehicle.insurance_expiry,

        vehicle.tax_expiry,

        vehicle.pucc_expiry,

        vehicle.permit_expiry

      ];


      fields.forEach(
        date => {


          if(
            isExpiringSoon(
              date
            )
          ){

            expiring++;

          }


          if(
            isExpired(
              date
            )
          ){

            expired++;

          }

        }
      );

    }
  );


  headerTotalVehicles.textContent =
    total;


  expiringCount.textContent =
    expiring;


  expiredCount.textContent =
    expired;

}


/* =====================================================
   RENDER LIST
===================================================== */

function renderList(){

  const total =
    filteredVehicles.length;


  const totalPages =
    Math.max(
      1,
      Math.ceil(
        total /
        recordsPerPage
      )
    );


  if(
    currentPage >
    totalPages
  ){

    currentPage =
      totalPages;

  }


  const start =
    (
      currentPage -
      1
    ) *
    recordsPerPage;


  const end =
    start +
    recordsPerPage;


  const pageVehicles =
    filteredVehicles.slice(
      start,
      end
    );


  if(
    !pageVehicles.length
  ){

    vehicleList.innerHTML = `

      <div class="empty">

        No vehicles found.

      </div>

    `;

  }else{

    vehicleList.innerHTML =

      pageVehicles

        .map(
          vehicle =>
            renderVehicle(
              vehicle
            )
        )

        .join("");

  }


  pageInfo.textContent =
    `Page ${currentPage} of ${totalPages}`;


  previousBtn.disabled =
    currentPage <= 1;


  nextBtn.disabled =
    currentPage >= totalPages;

}


/* =====================================================
   SEARCH
===================================================== */

function handleSearch(){

  const query =
    searchInput.value
      .trim()
      .toLowerCase();


  if(!query){

    filteredVehicles =
      [
        ...allVehicles
      ];

  }else{

    filteredVehicles =
      allVehicles.filter(
        vehicle => {


          const number =
            String(
              vehicle.vehicle_number ||
              ""
            ).toLowerCase();


          const customer =
            String(
              vehicle.customer_name ||
              ""
            ).toLowerCase();


          const mobile =
            String(
              vehicle.mobile ||
              ""
            ).toLowerCase();


          return (

            number.includes(
              query
            )

            ||

            customer.includes(
              query
            )

            ||

            mobile.includes(
              query
            )

          );

        }
      );

  }


  currentPage = 1;

  renderList();

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousPage(){

  if(
    currentPage > 1
  ){

    currentPage--;

    renderList();


    window.scrollTo({

      top:0,

      behavior:"smooth"

    });

  }

}


/* =====================================================
   NEXT
===================================================== */

function nextPage(){

  const totalPages =
    Math.max(
      1,
      Math.ceil(
        filteredVehicles.length /
        recordsPerPage
      )
    );


  if(
    currentPage <
    totalPages
  ){

    currentPage++;

    renderList();


    window.scrollTo({

      top:0,

      behavior:"smooth"

    });

  }

}

    } =

    await supabaseClient

      .from("vehicles")

      .select("*")

      .order(
        "created_at",
        {
          ascending:false

    if(error){

      throw error;

    }


    allVehicles =
      data || [];


    filteredVehicles =
      [
        ...allVehicles

    updateSummary();

    renderList();

    hideStatus();


  }catch(error){

    console.error(
      error
    );


    showStatus(

      "Error loading vehicles: " +

      (
        error.message ||
        error
      )

    );

  }

}

/* =====================================================

===================================================== */

async function deleteVehicle(
  id
){

  const vehicle =
    allVehicles.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(!vehicle){

    return;

  }


  const confirmDelete =
    confirm(

      "Are you sure you want to delete vehicle " +

      (
        vehicle.vehicle_number ||
        ""
      )

      +

      "?"

    );


  if(!confirmDelete){

    return;

  }


  try{


    showStatus(
      "Deleting vehicle..."
    );


    if(
      vehicle.photo_path
    ){

      await deletePhoto(
        vehicle.photo_path
      );

    }


    const {

      error

    } =

    await supabaseClient

      .from("vehicles")

      .delete()

      .eq(
        "id",
        id
      );


    if(error){

      throw error;

    }


    allVehicles =
      allVehicles.filter(
        item =>
          String(item.id) !==
          String(id)
      );


    filteredVehicles =
      [
        ...allVehicles
      ];


    updateSummary();

    renderList();

    hideStatus();


    alert(
      "Vehicle deleted successfully."
    );


  }catch(error){

    console.error(
      error
    );


    showStatus(

      "Delete Error:\n" +

      (
        error.message ||
        error
      )

    );

  }

}
