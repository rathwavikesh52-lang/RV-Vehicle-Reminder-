/* =========================================
   GLOBAL
========================================= */

*{

}

body{

  color:#222;

img{

/* =========================================
   HEADER
========================================= */

.header{
  background:#ffffff;

  justify-content:space-between;
  box-shadow:0 2px 8px rgba(0,0,0,0.10);

}

.logo-area{

.logo{

/* =========================================

========================================= */

.stat-title{

/* =========================================

========================================= */

.document-boxes{

  margin-bottom:20px;
}

.document-box{

========================================= */

.today-section h2{

}

/* =========================================

========================================= */

.vehicle-list{

}

.vehicle-card{

.vehicle-top{

========================================= */

.pagination{

.pagination button{

/* =========================================

========================================= */

.add-button{

/* =========================================
   LOAD VEHICLES
========================================= */

async function loadVehicles(){

  const {
    data,
    error
  } = await supabaseClient
    .from("vehicles")
    .select("*")
    .order(
      "id",
      {
        ascending:false
      }
    );

  if(error){

    console.error(error);

    document.getElementById(
      "vehicleList"
    ).innerHTML =
      "<div class='loading'>Error loading vehicles.</div>";

    return;
  }

  allVehicles = data || [];

  filteredVehicles =
    [...allVehicles];

  updateStatistics();

  renderTodayExpiry();

  renderVehicles();

}


/* =========================================
   UPDATE STATISTICS
========================================= */

function updateStatistics(){

  const total =
    allVehicles.length;

  let expiring = 0;

  let expired = 0;

  let fitnessCount = 0;

  let insuranceCount = 0;

  let pucCount = 0;

  let taxCount = 0;

  let permitCount = 0;


  allVehicles.forEach(vehicle => {

    const documents = [

      {
        date:vehicle.fitness_expiry,
        limit:60
      },

      {
        date:vehicle.insurance_expiry,
        limit:30
      },

      {
        date:vehicle.pucc_expiry,
        limit:15
      },

      {
        date:vehicle.tax_expiry,
        limit:15
      },

      {
        date:vehicle.permit_expiry,
        limit:30
      }

    ];


    documents.forEach(doc => {

      if(!doc.date) return;

      const days =
        daysUntil(doc.date);

      if(days < 0){

        expired++;

      }
      else if(days <= doc.limit){

        expiring++;

      }

    });


    if(
      vehicle.fitness_expiry
    ){

      const days =
        daysUntil(
          vehicle.fitness_expiry
        );

      if(
        days >= 0 &&
        days <= 60
      ){

        fitnessCount++;

      }

    }


    if(
      vehicle.insurance_expiry
    ){

      const days =
        daysUntil(
          vehicle.insurance_expiry
        );

      if(
        days >= 0 &&
        days <= 30
      ){

        insuranceCount++;

      }

    }


    if(
      vehicle.pucc_expiry
    ){

      const days =
        daysUntil(
          vehicle.pucc_expiry
        );

      if(
        days >= 0 &&
        days <= 15
      ){

        pucCount++;

      }

    }


    if(
      vehicle.tax_expiry
    ){

      const days =
        daysUntil(
          vehicle.tax_expiry
        );

      if(
        days >= 0 &&
        days <= 15
      ){

        taxCount++;

      }

    }


    if(
      vehicle.permit_expiry
    ){

      const days =
        daysUntil(
          vehicle.permit_expiry
        );

      if(
        days >= 0 &&
        days <= 30
      ){

        permitCount++;

      }

    }

  });


  document.getElementById(
    "totalVehicles"
  ).textContent =
    total;


  document.getElementById(
    "expiringVehicles"
  ).textContent =
    expiring;


  document.getElementById(
    "expiredVehicles"
  ).textContent =
    expired;


  document.getElementById(
    "fitnessCount"
  ).textContent =
    fitnessCount;


  document.getElementById(
    "insuranceCount"

/* =========================================
   DATE PARSER
========================================= */

function parseDate(value){

  if(!value) return null;

  const text =
    String(value).trim();

  let match =
    text.match(
      /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/
    );

  if(match){

    return new Date(
      Number(match[3]),
      Number(match[2]) - 1,
      Number(match[1])
    );

  }


  match =
    text.match(
      /^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/
    );

  if(match){

    const months = {

      Jan:0,
      Feb:1,
      Mar:2,
      Apr:3,
      May:4,
      Jun:5,
      Jul:6,
      Aug:7,
      Sep:8,
      Oct:9,
      Nov:10,
      Dec:11

    };

    const month =
      months[
        match[2]
          .substring(0,1)
          .toUpperCase() +
        match[2]
          .substring(1)
          .toLowerCase()
      ];

    if(month !== undefined){

      return new Date(
        Number(match[3]),
        month,
        Number(match[1])
      );

    }

  }


  const d =
    new Date(text);

  if(!isNaN(d.getTime())){

    return d;

  }

  return null;

}


/* =========================================
   DAYS UNTIL
========================================= */

function daysUntil(value){

  const date =
    parseDate(value);

  if(!date) return null;

  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );

  date.setHours(
    0,0,0,0
  );

  return Math.round(
    (
      date.getTime() -
      today.getTime()
    ) /
    (
      1000 *
      60 *
      60 *
      24
    )
  );

}


/* =========================================
   DATE DISPLAY
========================================= */

function displayDate(value){

  if(!value) return "-";

  return value;

}


/* =========================================
   EXPIRY CLASS
========================================= */

function expiryClass(
  value,
  limit
){

  if(!value) return "";

  const days =
    daysUntil(value);

  if(days === null) return "";

  if(days < 0){

    return "expired";

  }

  if(days <= 5){

    return "expiring-critical";

  }

  if(days <= limit){

    return "expiring";

  }

  return "";

}

function renderTodayExpiry(){

  allVehicles.forEach(vehicle => {

    const fields = [

      vehicle.fitness_expiry,

      vehicle.insurance_expiry,

      vehicle.tax_expiry,

      vehicle.pucc_expiry,

      vehicle.permit_expiry

    ];

    const hasToday =
      fields.some(
        date =>
          date &&
          daysUntil(date) === 0
      );

    }

/* =========================================

========================================= */

function searchVehicles(){

  const value =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();


  if(!value){

    filteredVehicles =
      [...allVehicles];

  }
  else{

    filteredVehicles =
      allVehicles.filter(
        vehicle => {

          const number =
            String(
              vehicle.vehicle_number ||
              ""
            ).toLowerCase();

          const name =
            String(
              vehicle.customer_name ||
              ""
            ).toLowerCase();

          const mobile =
            String(
              vehicle.customer_mobile ||
              vehicle.mobile ||
              ""
            ).toLowerCase();

          return (
            number.includes(value) ||
            name.includes(value) ||
            mobile.includes(value)
          );

        }
      );

  }


  currentPage = 1;

  renderVehicles();

}


/* =========================================
   RENDER VEHICLES
========================================= */

  const container =
    document.getElementById(
      "vehicleList"
    );


  if(
    filteredVehicles.length === 0
  ){

    container.innerHTML =
      `
      <div class="loading">
        ${
          translations[
            currentLanguage
          ].noVehicles
        }
      </div>
      `;

    updatePagination();

    return;

  }


  const start =
    (
      currentPage - 1
    ) *
    vehiclesPerPage;


  const end =
    start +
    vehiclesPerPage;


  const pageVehicles =
    filteredVehicles.slice(
      start,
      end
    );


  container.innerHTML =
    pageVehicles
      .map(
        vehicle =>
          createVehicleCard(
            vehicle
          )
      )
      .join("");


  updatePagination();

}

/* =========================================
   PAGINATION
========================================= */

function updatePagination(){

  const totalPages =
    Math.max(
      1,
      Math.ceil(
        filteredVehicles.length /
        vehiclesPerPage
      )
    );


  document.getElementById(
    "pageInfo"
  ).textContent =
    `Page ${currentPage} / ${totalPages}`;


  document.getElementById(
    "previousBtn"
  ).disabled =
    currentPage <= 1;


  document.getElementById(
    "nextBtn"
  ).disabled =
    currentPage >= totalPages;

}


function previousPage(){

  if(currentPage > 1){

    currentPage--;

    renderVehicles();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


function nextPage(){

  const totalPages =
    Math.ceil(
      filteredVehicles.length /
      vehiclesPerPage
    );


  if(currentPage < totalPages){

    currentPage++;

    renderVehicles();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}

/* =========================================
   DELETE VEHICLE
========================================= */

async function deleteVehicle(id){

  const confirmed =
    confirm(
      translations[
        currentLanguage
      ].confirmDelete
    );


  if(!confirmed) return;


  const vehicle =
    allVehicles.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(!vehicle){

    alert(
      "Vehicle not found."
    );

    return;

  }


  try{

    /* DELETE STORAGE PHOTO */

    if(vehicle.photo_path){

      const {
        error:
          storageError
      } =
        await supabaseClient
          .storage
          .from(
            "vehicle-photos"
          )
          .remove([
            vehicle.photo_path
          ]);


      if(storageError){

        console.error(
          storageError
        );

      }

    }


    /* DELETE DATABASE ROW */

    const {
      error
    } =
      await supabaseClient
        .from("vehicles")
        .delete()
        .eq(
          "id",
          id
        );


    if(error){

      console.error(error);

      alert(
        "Delete failed."
      );

      return;

    }


    alert(
      "Vehicle deleted successfully."
    );


    await loadVehicles();

  }
  catch(error){

    console.error(error);

    alert(
      "Delete failed."
    );

  }

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value){

  return escapeHtml(value);

}
