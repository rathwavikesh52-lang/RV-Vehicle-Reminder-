/* =========================================================
   DATE PARSER
========================================================= */

function parseDate(
  value
){

  if(!value){
    return null;
  }


  if(
    String(value)
      .toUpperCase()
      .trim() === "LTT"
  ){

    return null;

  }


  const valueString =
    String(value)
      .trim();


  let match =
    valueString.match(
      /^(\d{2})\/(\d{2})\/(\d{4})$/
    );


  if(match){

    const day =
      Number(match[1]);

    const month =
      Number(match[2]) - 1;

    const year =
      Number(match[3]);


    const date =
      new Date(
        year,
        month,
        day
      );


    if(
      date.getFullYear() === year &&
      date.getMonth() === month &&
      date.getDate() === day
    ){

      return date;

    }

  }


  /*
    Supabase DATE:
    YYYY-MM-DD
  */

  match =
    valueString.match(
      /^(\d{4})-(\d{2})-(\d{2})$/
    );


  if(match){

    const date =
      new Date(
        Number(match[1]),
        Number(match[2]) - 1,
        Number(match[3])
      );

    return date;

  }


  return null;

}


/* =========================================================
   DATE DISPLAY
========================================================= */

function displayDate(
  value
){

  if(!value){
    return "";
  }


  if(
    String(value)
      .toUpperCase()
      .trim() === "LTT"
  ){

    return "LTT";

  }


  const date =
    parseDate(value);


  if(!date){
    return value;
  }


  return (
    String(
      date.getDate()
    ).padStart(2,"0")
    +
    "/"
    +
    String(
      date.getMonth() + 1
    ).padStart(2,"0")
    +
    "/"
    +
    date.getFullYear()
  );

}


/* =========================================================
   DAYS DIFFERENCE
========================================================= */

function daysUntil(
  value
){

  const date =
    parseDate(value);


  if(!date){
    return null;
  }


  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );


  date.setHours(
    0,0,0,0
  );


  return Math.ceil(
    (
      date.getTime() -
      today.getTime()
    )
    /
    (
      1000 *
      60 *
      60 *
      24
    )
  );

}


/* =========================================================
   EXPIRY STATUS
========================================================= */

function getExpiryStatus(
  vehicle
){

  const fields = [

    vehicle.fitness_expiry,

    vehicle.insurance_expiry,

    vehicle.pucc_expiry,

    vehicle.permit_expiry

  ];


  let minimum =
    null;


  fields.forEach(
    field => {

      const days =
        daysUntil(field);


      if(days === null){
        return;
      }


      if(
        minimum === null ||
        days < minimum
      ){

        minimum =
          days;

      }

    }
  );


  if(minimum === null){

    return {
      type:"normal",
      days:null
    };

  }


  if(minimum < 0){

    return {
      type:"expired",
      days:minimum
    };

  }


  if(minimum <= 10){

    return {
      type:"expiring",
      days:minimum
    };

  }


  return {
    type:"normal",
    days:minimum
  };

}


/* =========================================================
   EXPIRING CHECK
========================================================= */

function isExpiring(
  vehicle
){

  const status =
    getExpiryStatus(vehicle);


  return (
    status.type ===
    "expiring"
  );

}


/* =========================================================
   EXPIRED CHECK
========================================================= */

function isExpired(
  vehicle
){

  const status =
    getExpiryStatus(vehicle);


  return (
    status.type ===
    "expired"
  );

}

        ?

        <div class="customer-mobile">
          📞
          ${escapeHTML(
            vehicle.mobile
          )}
        </div>
        `
        :
        ""
      }


      ${
        className
        ?
        `
        <div class="class-badge">
          ${escapeHTML(
            className
          )}
        </div>
        `
        :
        ""
      }


      <div class="details">


        ${
          detailRow(
            translations[
              currentLanguage
            ].registration,
            vehicle.registration_date
          )
        }


        ${
          detailRow(
            translations[
              currentLanguage
            ].fitness,
            vehicle.fitness_expiry
          )
        }


        ${
          detailRow(
            translations[
              currentLanguage
            ].insurance,
            vehicle.insurance_expiry
          )
        }


        ${
          detailRow(
            translations[
              currentLanguage
            ].tax,
            vehicle.tax_expiry
          )
        }


        ${
          detailRow(
            translations[
              currentLanguage
            ].pucc,
            vehicle.pucc_expiry
          )
        }


        ${
          detailRow(
            translations[
              currentLanguage
            ].permit,
            vehicle.permit_expiry
          )
        }


        ${
          status.days !== null
          ?
          `
          <div class="detail-row">

            <div class="detail-label">
              Status
            </div>

            <div
              class="detail-value ${statusClass}"
            >
              ${
                status.type === "expired"
                ?
                (
                  currentLanguage === "gu"
                  ?
                  "Expired"
                  :
                  "Expired"
                )
                :
                status.type === "expiring"
                ?
                (
                  currentLanguage === "gu"
                  ?
                  status.days +
                  " દિવસ બાકી"
                  :
                  status.days +
                  " days left"
                )
                :
                (
                  currentLanguage === "gu"
                  ?
                  "Valid"
                  :
                  "Valid"
                )
              }
            </div>

          </div>
          `
          :
          ""
        }


      </div>


      <div class="actions">


        <button

          class="action-btn edit-btn"

          onclick="
            editVehicle(
              '${vehicle.id}'
            )
          "

        >
          ${translations[
            currentLanguage
          ].edit}
        </button>


        <button

          class="action-btn whatsapp-btn"

          onclick="
            sendWhatsApp(
              '${vehicle.id}'
            )
          "

        >
          ${translations[
            currentLanguage
          ].whatsapp}
        </button>


        <button

          class="action-btn delete-btn"

          onclick="
            deleteVehicle(
              '${vehicle.id}'
            )
          "

        >
          ${translations[
            currentLanguage
          ].delete}
        </button>


      </div>


    </div>

  `;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
  value
){

  return String(
    value === undefined ||
    value === null
      ?
      ""
      :
      value
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   LOAD VEHICLES
========================================================= */

async function loadVehicles(){

  const loading =
    document.getElementById(
      "loading"
    );


  loading.style.display =
    "block";


  try{

    const {
      data,
      error
    } =
    await supabaseClient

      .from("vehicles")

      .select("*")

      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      throw error;

    }


    allVehicles =
      data || [];


    filteredVehicles =
      [...allVehicles];


    updateStats();

    renderAll();


  }catch(error){

    console.error(
      "Load vehicles error:",
      error
    );


    loading.textContent =
      "Error loading vehicles: " +
      error.message;

  }

}


/* =========================================================
   UPDATE STATS
========================================================= */

function updateStats(){

  const expiring =
    allVehicles.filter(
      isExpiring
    ).length;


  const expired =
    allVehicles.filter(
      isExpired
    ).length;


  document
    .getElementById(
      "totalCount"
    )
    .textContent =
    allVehicles.length;


  document
    .getElementById(
      "expiringCount"
    )
    .textContent =
    expiring;


  document
    .getElementById(
      "expiredCount"
    )
    .textContent =
    expired;

}


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll(){

  const search =
    document
      .getElementById(
        "searchBox"
      )
      .value
      .trim()
      .toLowerCase();


  if(search){

    filteredVehicles =
      allVehicles.filter(
        vehicle => {

          return (

            String(
              vehicle.vehicle_number ||
              ""
            )
            .toLowerCase()
            .includes(search)

            ||

            String(
              vehicle.customer_name ||
              ""
            )
            .toLowerCase()
            .includes(search)

            ||

            String(
              vehicle.mobile ||
              ""
            )
            .toLowerCase()
            .includes(search)

            ||

            String(
              vehicle.vehicle_class ||
              ""
            )
            .toLowerCase()
            .includes(search)

          );

        }
      );

  }else{

    filteredVehicles =
      [...allVehicles];

  }


  renderExpiring();

  renderExpired();

  renderVehicleList();

}


/* =========================================================
   RENDER EXPIRING
========================================================= */

function renderExpiring(){

  const grid =
    document.getElementById(
      "expiringGrid"
    );


  const vehicles =
    allVehicles.filter(
      isExpiring
    );


  if(!vehicles.length){

    grid.innerHTML = `
      <div class="empty">
        ${
          translations[
            currentLanguage
          ].noExpiring
        }
      </div>
    `;

    return;

  }


  grid.innerHTML =
    vehicles
      .map(
        vehicle =>
          vehicleCard(
            vehicle
          )
      )
      .join("");

}


/* =========================================================
   RENDER EXPIRED
========================================================= */

function renderExpired(){

  const grid =
    document.getElementById(
      "expiredGrid"
    );


  const vehicles =
    allVehicles.filter(
      isExpired
    );


  if(!vehicles.length){

    grid.innerHTML = `
      <div class="empty">
        ${
          translations[
            currentLanguage
          ].noExpired
        }
      </div>
    `;

    return;

  }


  grid.innerHTML =
    vehicles
      .map(
        vehicle =>
          vehicleCard(
            vehicle
          )
      )
      .join("");

}


/* =========================================================
   RENDER VEHICLE LIST
========================================================= */

function renderVehicleList(){

  const loading =
    document.getElementById(
      "loading"
    );


  const grid =
    document.getElementById(
      "vehicleGrid"
    );


  const empty =
    document.getElementById(
      "empty"
    );


  const pagination =
    document.getElementById(
      "pagination"
    );


  loading.style.display =
    "none";


  if(!filteredVehicles.length){

    grid.style.display =
      "none";

    pagination.style.display =
      "none";

    empty.style.display =
      "block";

    empty.textContent =
      translations[
        currentLanguage
      ].noVehicles;

    return;

  }


  empty.style.display =
    "none";


  grid.style.display =
    "grid";


  const totalPages =
    Math.ceil(
      filteredVehicles.length /
      vehiclesPerPage
    );


  if(
    currentPage >
    totalPages
  ){

    currentPage =
      totalPages;

  }


  const start =
    (
      currentPage - 1
    ) *
    vehiclesPerPage;


  const end =
    start +
    vehiclesPerPage;


  const pageVehicles =
    filteredVehicles.slice(
      start,
      end
    );


  grid.innerHTML =
    pageVehicles
      .map(
        vehicle =>
          vehicleCard(
            vehicle
          )
      )
      .join("");


  pagination.style.display =
    totalPages > 1
      ?
      "flex"
      :
      "none";


  document
    .getElementById(
      "pageInfo"
    )
    .textContent =
    translations[
      currentLanguage
    ].page +
    " " +
    currentPage +
    " / " +
    totalPages;


  document
    .getElementById(
      "prevBtn"
    )
    .disabled =
    currentPage <= 1;


  document
    .getElementById(
      "nextBtn"
    )
    .disabled =
    currentPage >= totalPages;

}


/* =========================================================
   SEARCH
========================================================= */

function handleSearch(){

  currentPage =
    1;

  renderAll();

}


/* =========================================================
   NEXT PAGE
========================================================= */

function nextPage(){

  const totalPages =
    Math.ceil(
      filteredVehicles.length /
      vehiclesPerPage
    );


  if(
    currentPage <
    totalPages
  ){

    currentPage++;

    renderVehicleList();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


/* =========================================================
   PREVIOUS PAGE
========================================================= */

function previousPage(){

  if(
    currentPage >
    1
  ){

    currentPage--;

    renderVehicleList();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


/* =========================================================
   EDIT
========================================================= */

function editVehicle(
  id
){

  window.location.href =
    "upload.html?id=" +
    encodeURIComponent(id);

}


/* =========================================================
   DELETE STORAGE PHOTO
========================================================= */

async function deleteStoragePhoto(
  path
){

  if(!path){

    return;

  }


  const {
    error
  } =
  await supabaseClient

    .storage

    .from(
      "vehicle-photos"
    )

    .remove([
      path
    ]);


  if(error){

    console.warn(
      "Storage delete error:",
      error
    );

  }

}


/* =========================================================
   DELETE VEHICLE
========================================================= */

async function deleteVehicle(
  id
){

  const vehicle =
    allVehicles.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(!vehicle){

    return;

  }


  const confirmText =
    currentLanguage === "gu"

    ?

    "શું તમે આ વાહનને કાયમ માટે Delete કરવા માંગો છો?"

    :

    "Do you want to permanently delete this vehicle?";


  if(
    !confirm(confirmText)
  ){

    return;

  }


  try{

    /*
      Delete storage photo first
    */

    if(
      vehicle.photo_path
    ){

      await deleteStoragePhoto(
        vehicle.photo_path
      );

    }


    /*
      Delete database record
    */

    const {
      error
    } =
    await supabaseClient

      .from("vehicles")

      .delete()

      .eq(
        "id",
        id
      );


    if(error){

      throw error;

    }


    alert(
      currentLanguage === "gu"
      ?
      "વાહન કાયમ માટે Delete થઈ ગયું."
      :
      "Vehicle permanently deleted."
    );


    await loadVehicles();


  }catch(error){

    console.error(
      "Delete error:",
      error
    );


    alert(
      "Delete Error:\n" +
      error.message
    );

  }

}


/* =========================================================
   WHATSAPP
========================================================= */

function sendWhatsApp(
  id
){

  const vehicle =
    allVehicles.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(!vehicle){

    return;

  }


  const mobile =
    String(
      vehicle.mobile ||
      ""
    )
    .replace(
      /\D/g,
      ""
    );


  if(!mobile){

    alert(
      currentLanguage === "gu"
      ?
      "આ વાહન માટે Mobile Number ઉપલબ્ધ નથી."
      :
      "Mobile Number is not available for this vehicle."
    );

    return;

  }


  let phone =
    mobile;


  /*
    Indian number
  */

  if(
    phone.length === 10
  ){

    phone =
      "91" +
      phone;

  }


  const customerName =
    vehicle.customer_name ||
    "";


  const vehicleNumber =
    vehicle.vehicle_number ||
    "";


  const lines = [];


  if(
    currentLanguage === "gu"
  ){

    lines.push(
      "RV Vehicle Reminder"
    );

    lines.push("");

    lines.push(
      "નમસ્તે " +
      customerName
    );

    lines.push(
      "તમારા વાહન " +
      vehicleNumber +
      " ના દસ્તાવેજની માન્યતા તપાસવા વિનંતી."
    );

    if(
      vehicle.fitness_expiry
    ){

      lines.push(
        "Fitness: " +
        displayDate(
          vehicle.fitness_expiry
        )
      );

    }

    if(
      vehicle.insurance_expiry
    ){

      lines.push(
        "Insurance: " +
        displayDate(
          vehicle.insurance_expiry
        )
      );

    }

    if(
      vehicle.pucc_expiry
    ){

      lines.push(
        "PUCC: " +
        displayDate(
          vehicle.pucc_expiry
        )
      );

    }

    if(
      vehicle.permit_expiry
    ){

      lines.push(
        "Permit: " +
        displayDate(
          vehicle.permit_expiry
        )
      );

    }

  }else{

    lines.push(
      "RV Vehicle Reminder"
    );

    lines.push("");

    lines.push(
      "Hello " +
      customerName
    );

    lines.push(
      "Please check the document validity of your vehicle " +
      vehicleNumber +
      "."
    );

    if(
      vehicle.fitness_expiry
    ){

      lines.push(
        "Fitness: " +
        displayDate(
          vehicle.fitness_expiry
        )
      );

    }

    if(
      vehicle.insurance_expiry
    ){

      lines.push(
        "Insurance: " +
        displayDate(
          vehicle.insurance_expiry
        )
      );

    }

    if(
      vehicle.pucc_expiry
    ){

      lines.push(
        "PUCC: " +
        displayDate(
          vehicle.pucc_expiry
        )
      );

    }

    if(
      vehicle.permit_expiry
    ){

      lines.push(
        "Permit: " +
        displayDate(
          vehicle.permit_expiry
        )
      );

    }

  }


  const message =
    encodeURIComponent(
      lines.join("\n")
    );


  window.open(
    "https://wa.me/" +
    phone +
    "?text=" +
    message,

    "_blank"
  );

}

document.addEventListener(

setInterval(
