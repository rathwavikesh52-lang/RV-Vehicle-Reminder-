<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>RV Vehicle Reminder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}


/* =========================================================
   BODY
========================================================= */

body{

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background-image:
    url("./assets/background.png");

  background-size:cover;

  background-position:center center;

  background-repeat:no-repeat;

  background-attachment:fixed;

  color:#172033;

  min-height:100vh;

}


/* =========================================================
   HEADER
========================================================= */

.header{

  background:transparent;

  padding:
    18px
    18px
    12px;

}


/* =========================================================
   HEADER BRAND
========================================================= */

.brand{

  max-width:1250px;

  margin:0 auto;

  display:flex;

  align-items:center;

  gap:18px;

}


.logo{

  width:105px;

  height:105px;

  object-fit:contain;

}


.brand-text{

  flex:1;

}


.brand-text h1{

  font-size:38px;

  font-weight:800;

  color:#0b2d55;

  line-height:1.1;

}


.brand-text p{

  margin-top:8px;

  font-size:19px;

  color:#23466f;

}


.brand-tagline{

  margin-top:10px;

  font-size:18px;

  font-style:italic;

  color:#172f4f;

}


/* =========================================================
   TOTAL VEHICLES
========================================================= */

.header-total{

  min-width:245px;

  padding:20px 28px;

  background:
    rgba(255,255,255,.90);

  border-radius:18px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.10);

  text-align:left;

}


.header-total-title{

  display:flex;

  align-items:center;

  gap:12px;

  font-size:20px;

  font-weight:700;

  color:#172033;

}


.total-icon{

  width:50px;

  height:50px;

  border-radius:50%;

  background:#1976d2;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:27px;

}


.header-total strong{

  display:block;

  margin-left:62px;

  margin-top:-2px;

  font-size:39px;

  color:#1769c2;

}


/* =========================================================
   HEADER EXPIRY MENU
========================================================= */

.expiry-menu{

  display:flex;

  justify-content:center;

  gap:55px;

  margin-top:18px;

  color:#061a3a;

  text-align:center;

}


.expiry-item{

  min-width:75px;

}


.expiry-item .label{

  font-size:14px;

  font-weight:700;

}


.expiry-item .count{

  font-size:23px;

  font-weight:800;

  margin-top:4px;

}


/* =========================================================
   LANGUAGE
========================================================= */

.language-buttons{

  display:flex;

  justify-content:center;

  gap:8px;

  margin-top:14px;

}


.language-buttons button{

  border:
    1px solid #061a3a;

  background:
    rgba(255,255,255,.45);

  color:#061a3a;

  padding:
    7px 12px;

  border-radius:8px;

  font-size:13px;

  font-weight:700;

  cursor:pointer;

}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{

  max-width:1250px;

  margin:0 auto;

  padding:
    0 14px
    30px;

}


/* =========================================================
   TOP ACTIONS
========================================================= */

.top-actions{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;

  margin-bottom:16px;

}


.add-btn,
.refresh-btn{

  border:0;

  padding:14px;

  border-radius:11px;

  font-size:16px;

  font-weight:700;

  cursor:pointer;

}


.add-btn{

  background:#0b7a43;

  color:white;

}


.refresh-btn{

  background:#061a3a;

  color:white;

}


.add-btn:hover,
.refresh-btn:hover{

  opacity:.9;

}


/* =========================================================
   SEARCH
========================================================= */

.search-box{

  background:
    rgba(255,255,255,.94);

  border-radius:17px;

  padding:14px;

  margin-bottom:14px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.08);

}


.search-box input{

  width:100%;

  padding:14px 16px;

  border:
    1px solid #d0d5dd;

  border-radius:10px;

  font-size:16px;

  outline:none;

}


.search-box input:focus{

  border-color:#1976d2;

}


/* =========================================================
   VEHICLE LIST MAIN PANEL
========================================================= */

.vehicle-list-panel{

  background:
    rgba(255,255,255,.90);

  border-radius:22px;

  padding:20px;

  box-shadow:
    0 7px 25px
    rgba(0,0,0,.12);

}


/* =========================================================
   VEHICLE LIST HEADER
========================================================= */

.list-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:15px;

}


.list-title{

  display:flex;

  align-items:center;

  gap:12px;

}


.list-icon{

  font-size:30px;

  color:#061a3a;

}


.list-title h2{

  color:#061a3a;

  font-size:27px;

  text-transform:uppercase;

}


.list-title p{

  margin-top:4px;

  font-size:13px;

  color:#667085;

}


/* =========================================================
   VEHICLE LIST
========================================================= */

#vehicleList{

  display:flex;

  flex-direction:column;

  gap:14px;

}


/* =========================================================
   VEHICLE CARD
========================================================= */

.vehicle-card{

  background:
    rgba(255,255,255,.96);

  border-radius:16px;

  padding:18px;

  box-shadow:
    0 4px 16px
    rgba(0,0,0,.08);

  display:grid;

  grid-template-columns:
    280px
    1fr
    1fr
    120px;

  gap:18px;

  align-items:center;

}


/* =========================================================
   VEHICLE BASIC
========================================================= */

.vehicle-basic{

  display:flex;

  align-items:center;

  gap:16px;

  min-width:0;

}


.vehicle-photo{

  width:115px;

  height:110px;

  object-fit:cover;

  border-radius:10px;

  background:#edf2f7;

  border:1px solid #e1e5ea;

  flex-shrink:0;

}


.vehicle-photo-placeholder{

  width:115px;

  height:110px;

  border-radius:10px;

  background:#edf2f7;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:42px;

  color:#667085;

  flex-shrink:0;

}


.vehicle-basic-info{

  min-width:0;

}


.vehicle-number{

  font-size:22px;

  font-weight:800;

  color:#061a3a;

  word-break:break-word;

}


.vehicle-type{

  display:inline-block;

  margin-top:9px;

  padding:
    5px 10px;

  background:#e8f1fb;

  color:#1769c2;

  border-radius:15px;

  font-size:12px;

  font-weight:700;

}


.customer-small{

  margin-top:10px;

  font-size:13px;

  color:#475467;

}


.vehicle-status{

  display:inline-block;

  margin-top:8px;

  padding:
    5px 8px;

  border-radius:15px;

  font-size:10px;

  font-weight:700;

}


.status-normal{

  background:#e8f5ee;

  color:#087443;

}


.status-expiring{

  background:#fff3d6;

  color:#b54708;

}


.status-expired{

  background:#fee4e2;

  color:#b42318;

}


/* =========================================================
   VEHICLE DETAILS COLUMNS
========================================================= */

.details-column{

  display:flex;

  flex-direction:column;

  gap:13px;

  border-left:
    1px solid #d9dee7;

  padding-left:22px;

}


.detail-row{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

}


.detail-label{

  font-size:13px;

  color:#475467;

  white-space:nowrap;

}


.detail-value{

  padding:
    6px 12px;

  border-radius:13px;

  font-size:13px;

  font-weight:700;

  white-space:nowrap;

}


.detail-value.normal{

  background:#e8f7ee;

  color:#087443;

}


.detail-value.expiring{

  background:#fff0d7;

  color:#b54708;

}


.detail-value.expired{

  background:#fee4e2;

  color:#b42318;

}


.detail-value.ltt{

  background:#eee7ff;

  color:#6941c6;

}


/* =========================================================
   CARD ACTIONS
========================================================= */

.card-actions{

  border-left:
    1px solid #d9dee7;

  padding-left:16px;

  display:flex;

  flex-direction:column;

  gap:9px;

}


.edit-btn,
.delete-btn{

  border:0;

  padding:11px;

  border-radius:9px;

  font-size:14px;

  font-weight:700;

  cursor:pointer;

}


.edit-btn{

  background:#1976d2;

  color:white;

}


.delete-btn{

  background:#e53935;

  color:white;

}


.edit-btn:hover,
.delete-btn:hover{

  opacity:.88;

}


/* =========================================================
   EMPTY / LOADING
========================================================= */

.empty-box,
.loading{

  background:
    rgba(255,255,255,.95);

  border-radius:15px;

  padding:35px 20px;

  text-align:center;

  color:#667085;

}


.empty-box h3{

  color:#061a3a;

  margin-bottom:7px;

}


/* =========================================================
   PAGINATION
========================================================= */

.pagination{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:12px;

  margin-top:18px;

}


.pagination button{

  border:0;

  background:#061a3a;

  color:white;

  padding:
    10px 17px;

  border-radius:9px;

  font-weight:700;

  cursor:pointer;

}


.pagination button:disabled{

  opacity:.4;

}


.page-info{

  font-size:14px;

  font-weight:700;

  color:#061a3a;

}


/* =========================================================
   BOTTOM EXPIRY SUMMARY
========================================================= */

.bottom-summary{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:20px;

  margin-top:18px;

}


.bottom-summary-card{

  border-radius:16px;

  padding:
    17px 25px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.06);

}


.bottom-expiring{

  background:
    rgba(255,248,225,.94);

  border:
    1px solid #f6d98b;

}


.bottom-expired{

  background:
    rgba(255,239,239,.94);

  border:
    1px solid #f3c2c2;

}


.bottom-summary-left{

  display:flex;

  align-items:center;

  gap:15px;

}


.bottom-summary-icon{

  font-size:34px;

}


.bottom-summary-title{

  font-size:20px;

  font-weight:800;

  color:#061a3a;

}


.bottom-summary-count{

  font-size:39px;

  font-weight:800;

}


.bottom-expiring .bottom-summary-icon,
.bottom-expiring .bottom-summary-count{

  color:#ed9200;

}


.bottom-expired .bottom-summary-icon,
.bottom-expired .bottom-summary-count{

  color:#d92d20;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

  .header{

    padding:
      12px
      8px;

  }


  .brand{

    gap:8px;

    flex-wrap:wrap;

    justify-content:center;

  }


  .logo{

    width:62px;

    height:62px;

  }


  .brand-text{

    flex:0 1 auto;

  }


  .brand-text h1{

    font-size:21px;

  }


  .brand-text p{

    font-size:11px;

  }


  .brand-tagline{

    display:none;

  }


  .header-total{

    min-width:150px;

    padding:
      11px 15px;

  }


  .header-total-title{

    font-size:12px;

  }


  .total-icon{

    width:32px;

    height:32px;

    font-size:17px;

  }


  .header-total strong{

    margin-left:44px;

    font-size:25px;

  }


  .expiry-menu{

    gap:0;

    justify-content:space-between;

    width:100%;

    margin-top:12px;

  }


  .expiry-item{

    flex:1;

    min-width:0;

  }


  .expiry-item .label{

    font-size:9px;

  }


  .expiry-item .count{

    font-size:18px;

  }


  .language-buttons{

    margin-top:10px;

  }


  .language-buttons button{

    padding:
      6px 9px;

    font-size:11px;

  }


  .container{

    padding:
      0 8px
      25px;

  }


  .top-actions{

    gap:8px;

  }


  .add-btn,
  .refresh-btn{

    padding:12px 8px;

    font-size:14px;

  }


  .vehicle-list-panel{

    padding:12px;

    border-radius:17px;

  }


  .list-title h2{

    font-size:20px;

  }


  .list-icon{

    font-size:24px;

  }


  /*
    Mobile vehicle cards
    horizontal swipe
  */

  #vehicleList{

    flex-direction:row;

    overflow-x:auto;

    overflow-y:hidden;

    gap:12px;

    scroll-snap-type:x mandatory;

    -webkit-overflow-scrolling:touch;

    touch-action:pan-x;

    scrollbar-width:none;

    padding:
      3px
      2px
      12px;

  }


  #vehicleList::-webkit-scrollbar{

    display:none;

  }


  .vehicle-card{

    flex:
      0 0 92%;

    width:92%;

    display:flex;

    flex-direction:column;

    align-items:stretch;

    gap:12px;

    scroll-snap-align:start;

    padding:15px;

  }


  .vehicle-basic{

    align-items:flex-start;

  }


  .vehicle-photo,
  .vehicle-photo-placeholder{

    width:90px;

    height:85px;

  }


  .vehicle-number{

    font-size:19px;

  }


  .details-column{

    border-left:0;

    border-top:
      1px solid #d9dee7;

    padding-left:0;

    padding-top:12px;

  }


  .detail-label{

    font-size:12px;

  }


  .detail-value{

    font-size:12px;

  }


  .card-actions{

    border-left:0;

    border-top:
      1px solid #d9dee7;

    padding-left:0;

    padding-top:12px;

    display:grid;

    grid-template-columns:1fr 1fr;

  }


  /*
    Bottom Expiring / Expired
    same line
  */

  .bottom-summary{

    grid-template-columns:
      1fr 1fr;

    gap:8px;

  }


  .bottom-summary-card{

    padding:
      12px 8px;

  }


  .bottom-summary-left{

    gap:6px;

  }


  .bottom-summary-icon{

    font-size:22px;

  }


  .bottom-summary-title{

    font-size:12px;

  }


  .bottom-summary-count{

    font-size:25px;

  }

}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media(max-width:390px){

  .brand-text h1{

    font-size:18px;

  }


  .brand-text p{

    font-size:9px;

  }


  .header-total{

    min-width:125px;

    padding:9px;

  }


  .header-total-title{

    font-size:10px;

  }


  .header-total strong{

    margin-left:37px;

    font-size:21px;

  }


  .expiry-item .label{

    font-size:8px;

  }


  .expiry-item .count{

    font-size:16px;

  }


  #vehicleList .vehicle-card{

    flex:
      0 0 94%;

    width:94%;

  }


  .bottom-summary-title{

    font-size:10px;

  }


  .bottom-summary-count{

    font-size:21px;

  }

}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:900px){

  #vehicleList{

    display:flex;

    flex-direction:column;

  }


  .vehicle-card{

    min-height:170px;

  }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

  <div class="brand">

    <img
      src="./assets/logo.png"
      class="logo"
      alt="RV Vehicle Reminder Logo"
    >

    <div class="brand-text">

      <h1>
        RV Vehicle Reminder
      </h1>

      <p>
        Vehicle Expiry Management System
      </p>

      <div class="brand-tagline">
        Stay Alert • Stay Legal • Drive Safe
      </div>

    </div>


    <div class="header-total">

      <div class="header-total-title">

        <div class="total-icon">
          🚗
        </div>

        <div>
          Total Vehicles
        </div>

      </div>

      <strong id="headerTotalVehicles">
        0
      </strong>

    </div>

  </div>


  <!-- EXPIRY COUNTS -->

  <div class="expiry-menu">

    <div class="expiry-item">

      <div class="label">
        FITNESS
      </div>

      <div
        class="count"
        id="headerFitnessCount"
      >
        0
      </div>

    </div>


    <div class="expiry-item">

      <div class="label">
        INSURANCE
      </div>

      <div
        class="count"
        id="headerInsuranceCount"
      >
        0
      </div>

    </div>


    <div class="expiry-item">

      <div class="label">
        PUC
      </div>

      <div
        class="count"
        id="headerPucCount"
      >
        0
      </div>

    </div>


    <div class="expiry-item">

      <div class="label">
        TAX
      </div>

      <div
        class="count"
        id="headerTaxCount"
      >
        0
      </div>

    </div>


    <div class="expiry-item">

      <div class="label">
        PERMIT
      </div>

      <div
        class="count"
        id="headerPermitCount"
      >
        0
      </div>

    </div>

  </div>


  <!-- LANGUAGE -->

  <div class="language-buttons">

    <button onclick="setLanguage('en')">
      English
    </button>

    <button onclick="setLanguage('gu')">
      ગુજરાતી
    </button>

    <button onclick="setLanguage('hi')">
      हिन्दी
    </button>

  </div>

</header>


<!-- =======================================================
     MAIN
======================================================= -->

<div class="container">


  <!-- ACTIONS -->

  <div class="top-actions">

    <button
      class="add-btn"
      onclick="goToUpload()"
    >
      + Add Vehicle
    </button>


    <button
      class="refresh-btn"
      onclick="loadVehicles()"
    >
      ↻ Refresh
    </button>

  </div>


  <!-- SEARCH -->

  <div class="search-box">

    <input
      type="text"
      id="searchInput"
      placeholder="Search Vehicle Number, Customer Name or Mobile..."
      oninput="searchVehicle()"
    >

  </div>


  <!-- VEHICLE LIST PANEL -->

  <div class="vehicle-list-panel">


    <div class="list-header">

      <div class="list-title">

        <div class="list-icon">
          🚗
        </div>

        <div>

          <h2>
            Vehicle List
          </h2>

          <p id="listInfo">
            Loading vehicles...
          </p>

        </div>

      </div>

    </div>


    <!-- VEHICLE LIST -->

    <div id="vehicleList">

      <div class="loading">
        Loading vehicles...
      </div>

    </div>


    <!-- PAGINATION -->

    <div
      class="pagination"
      id="pagination"
      style="display:none;"
    >

      <button
        id="previousBtn"
        onclick="previousPage()"
      >
        Previous
      </button>

      <div
        class="page-info"
        id="pageInfo"
      >
        Page 1
      </div>

      <button
        id="nextBtn"
        onclick="nextPage()"
      >
        Next
      </button>

    </div>


    <!-- =====================================================
         BOTTOM EXPIRY SUMMARY
    ====================================================== -->

    <div class="bottom-summary">


      <div class="bottom-summary-card bottom-expiring">

        <div class="bottom-summary-left">

          <div class="bottom-summary-icon">
            ⏰
          </div>

          <div class="bottom-summary-title">
            Expiring Soon
          </div>

        </div>

        <div
          class="bottom-summary-count"
          id="expiringCount"
        >
          0
        </div>

      </div>


      <div class="bottom-summary-card bottom-expired">

        <div class="bottom-summary-left">

          <div class="bottom-summary-icon">
            ⚠
          </div>

          <div class="bottom-summary-title">
            Expired Vehicles
          </div>

        </div>

        <div
          class="bottom-summary-count"
          id="expiredCount"
        >
          0
        </div>

      </div>


    </div>


  </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://lqbhafspabtlqeubqxjg.supabase.co";


const SUPABASE_KEY =
"sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   GLOBAL
========================================================= */

let allVehicles = [];

let filteredVehicles = [];

let currentPage = 1;

const recordsPerPage = 10;


/* =========================================================
   EXPIRY FIELDS
========================================================= */

const expiryFields = [

  "fitness_expiry",

  "insurance_expiry",

  "tax_expiry",

  "pucc_expiry",

  "permit_expiry"

];


/* =========================================================
   LANGUAGE
========================================================= */

function setLanguage(language){

  if(language === "gu"){

    alert(
      "ગુજરાતી ભાષા પસંદ કરવામાં આવી."
    );

    return;

  }


  if(language === "hi"){

    alert(
      "हिन्दी भाषा चुनी गई."
    );

    return;

  }


  alert(
    "English language selected."
  );

}


/* =========================================================
   DATE PARSER
========================================================= */

function parseDate(value){

  if(!value){

    return null;

  }


  if(
    String(value)
      .toUpperCase() === "LTT"
  ){

    return null;

  }


  const text =
    String(value).trim();


  /*
    Supabase DATE:
    YYYY-MM-DD
  */

  let match =
    text.match(
      /^(\d{4})-(\d{2})-(\d{2})/
    );


  if(match){

    return new Date(
      Number(match[1]),
      Number(match[2]) - 1,
      Number(match[3])
    );

  }


  const date =
    new Date(text);


  if(
    isNaN(date.getTime())
  ){

    return null;

  }


  return date;

}


/* =========================================================
   DAYS DIFFERENCE
========================================================= */

function getDaysDifference(value){

  const date =
    parseDate(value);


  if(!date){

    return null;

  }


  const today =
    new Date();


  today.setHours(
    0,
    0,
    0,
    0
  );


  date.setHours(
    0,
    0,
    0,
    0
  );


  const difference =
    date.getTime() -
    today.getTime();


  return Math.ceil(
    difference /
    (1000 * 60 * 60 * 24)
  );

}


/* =========================================================
   EXPIRING SOON
========================================================= */

function isExpiringSoon(value){

  const days =
    getDaysDifference(value);


  return (

    days !== null &&
    days >= 0 &&
    days <= 10

  );

}


/* =========================================================
   EXPIRED
========================================================= */

function isExpired(value){

  const days =
    getDaysDifference(value);


  return (

    days !== null &&
    days < 0

  );

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(value){

  if(!value){

    return "-";

  }


  if(
    String(value)
      .toUpperCase() === "LTT"
  ){

    return "LTT";

  }


  const date =
    parseDate(value);


  if(!date){

    return value;

  }


  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );


  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const year =
    date.getFullYear();


  return (

    day +
    "/" +
    month +
    "/" +
    year

  );

}


/* =========================================================
   DATE CLASS
========================================================= */

function getDateClass(value){

  if(
    String(value || "")
      .toUpperCase() === "LTT"
  ){

    return "ltt";

  }


  if(
    isExpired(value)
  ){

    return "expired";

  }


  if(
    isExpiringSoon(value)
  ){

    return "expiring";

  }


  return "normal";

}


/* =========================================================
   VEHICLE EXPIRING
========================================================= */

function vehicleIsExpiring(vehicle){

  return expiryFields.some(

    field =>
      isExpiringSoon(
        vehicle[field]
      )

  );

}


/* =========================================================
   VEHICLE EXPIRED
========================================================= */

function vehicleIsExpired(vehicle){

  return expiryFields.some(

    field =>
      isExpired(
        vehicle[field]
      )

  );

}


/* =========================================================
   LOAD VEHICLES
========================================================= */

async function loadVehicles(){

  const vehicleList =
    document.getElementById(
      "vehicleList"
    );


  vehicleList.innerHTML = `

    <div class="loading">
      Loading vehicles...
    </div>

  `;


  try{

    const {
      data,
      error
    } =
    await supabaseClient

      .from("vehicles")

      .select("*")

      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      throw error;

    }


    allVehicles =
      data || [];


    filteredVehicles =
      [...allVehicles];


    currentPage = 1;


    updateSummary();

    renderVehicles();


  }catch(error){

    console.error(error);


    vehicleList.innerHTML = `

      <div class="empty-box">

        <h3>
          Error Loading Vehicles
        </h3>

        <p>
          ${escapeHTML(
            error.message ||
            String(error)
          )}
        </p>

      </div>

    `;

  }

}


/* =========================================================
   UPDATE SUMMARY
========================================================= */

function updateSummary(){

  const total =
    allVehicles.length;


  let expiring = 0;

  let expired = 0;


  allVehicles.forEach(
    vehicle => {

      if(
        vehicleIsExpiring(vehicle)
      ){

        expiring++;

      }


      if(
        vehicleIsExpired(vehicle)
      ){

        expired++;

      }

    }
  );


  document.getElementById(
    "headerTotalVehicles"
  ).textContent =
    total;


  document.getElementById(
    "expiringCount"
  ).textContent =
    expiring;


  document.getElementById(
    "expiredCount"
  ).textContent =
    expired;


  /*
    FITNESS
  */

  document.getElementById(
    "headerFitnessCount"
  ).textContent =

    allVehicles.filter(
      vehicle =>
        isExpiringSoon(
          vehicle.fitness_expiry
        )
    ).length;


  /*
    INSURANCE
  */

  document.getElementById(
    "headerInsuranceCount"
  ).textContent =

    allVehicles.filter(
      vehicle =>
        isExpiringSoon(
          vehicle.insurance_expiry
        )
    ).length;


  /*
    PUC
  */

  document.getElementById(
    "headerPucCount"
  ).textContent =

    allVehicles.filter(
      vehicle =>
        isExpiringSoon(
          vehicle.pucc_expiry
        )
    ).length;


  /*
    TAX
  */

  document.getElementById(
    "headerTaxCount"
  ).textContent =

    allVehicles.filter(
      vehicle =>
        isExpiringSoon(
          vehicle.tax_expiry
        )
    ).length;


  /*
    PERMIT
  */

  document.getElementById(
    "headerPermitCount"
  ).textContent =

    allVehicles.filter(
      vehicle =>
        isExpiringSoon(
          vehicle.permit_expiry
        )
    ).length;

}


/* =========================================================
   RENDER VEHICLES
========================================================= */

function renderVehicles(){

  const vehicleList =
    document.getElementById(
      "vehicleList"
    );


  const pagination =
    document.getElementById(
      "pagination"
    );


  const listInfo =
    document.getElementById(
      "listInfo"
    );


  if(
    !filteredVehicles.length
  ){

    vehicleList.innerHTML = `

      <div class="empty-box">

        <h3>
          No Vehicles Found
        </h3>

        <p>
          Add a vehicle to start monitoring expiry dates.
        </p>

      </div>

    `;


    pagination.style.display =
      "none";


    listInfo.textContent =
      "0 vehicles";


    return;

  }


  const totalPages =
    Math.ceil(
      filteredVehicles.length /
      recordsPerPage
    );


  if(
    currentPage > totalPages
  ){

    currentPage =
      totalPages;

  }


  const startIndex =
    (currentPage - 1) *
    recordsPerPage;


  const endIndex =
    startIndex +
    recordsPerPage;


  const pageVehicles =
    filteredVehicles.slice(
      startIndex,
      endIndex
    );


  vehicleList.innerHTML =

    pageVehicles
      .map(
        vehicle =>
          createVehicleCard(
            vehicle
          )
      )
      .join("");


  listInfo.textContent =

    `${filteredVehicles.length} vehicle(s) • Showing ${startIndex + 1}-${Math.min(endIndex, filteredVehicles.length)}`;


  pagination.style.display =

    totalPages > 1
      ? "flex"
      : "none";


  document.getElementById(
    "pageInfo"
  ).textContent =

    `Page ${currentPage} of ${totalPages}`;


  document.getElementById(
    "previousBtn"
  ).disabled =
    currentPage <= 1;


  document.getElementById(
    "nextBtn"
  ).disabled =
    currentPage >= totalPages;

}


/* =========================================================
   CREATE VEHICLE CARD
========================================================= */

function createVehicleCard(vehicle){

  let statusText =
    "ACTIVE";


  let statusClass =
    "status-normal";


  if(
    vehicleIsExpired(vehicle)
  ){

    statusText =
      "EXPIRED";


    statusClass =
      "status-expired";

  }
  else if(
    vehicleIsExpiring(vehicle)
  ){

    statusText =
      "EXPIRING SOON";


    statusClass =
      "status-expiring";

  }


  /*
    PHOTO
  */

  let photoHTML = "";


  if(vehicle.photo_url){

    photoHTML = `

      <img
        src="${escapeHTML(
          vehicle.photo_url
        )}"
        class="vehicle-photo"
        alt="Vehicle Photo"
        loading="lazy"
      >

    `;

  }
  else{

    photoHTML = `

      <div class="vehicle-photo-placeholder">
        🚗
      </div>

    `;

  }


  return `

    <div class="vehicle-card">


      <!-- BASIC -->

      <div class="vehicle-basic">

        ${photoHTML}


        <div class="vehicle-basic-info">

          <div class="vehicle-number">

            ${escapeHTML(
              vehicle.vehicle_number ||
              "-"
            )}

          </div>


          <div class="vehicle-type">

            ${escapeHTML(
              vehicle.vehicle_type ||
              "Vehicle"
            )}

          </div>


          <div class="customer-small">

            <strong>Customer:</strong>
            ${escapeHTML(
              vehicle.customer_name ||
              "-"
            )}

          </div>


          <div class="customer-small">

            <strong>Mobile:</strong>
            ${escapeHTML(
              vehicle.mobile ||
              "-"
            )}

          </div>


          <div
            class="vehicle-status ${statusClass}"
          >

            ${statusText}

          </div>

        </div>

      </div>



      <!-- DETAILS COLUMN 1 -->

      <div class="details-column">

        ${detailRowHTML(
          "Registration Date",
          vehicle.registration_date
        )}


        ${detailRowHTML(
          "Fitness Valid UpTo",
          vehicle.fitness_expiry
        )}


        ${detailRowHTML(
          "Tax Valid UpTo",
          vehicle.tax_expiry
        )}

      </div>



      <!-- DETAILS COLUMN 2 -->

      <div class="details-column">

        ${detailRowHTML(
          "Insurance Valid UpTo",
          vehicle.insurance_expiry
        )}


        ${detailRowHTML(
          "PUCC Valid UpTo",
          vehicle.pucc_expiry
        )}


        ${detailRowHTML(
          "Permit Valid UpTo",
          vehicle.permit_expiry
        )}

      </div>



      <!-- ACTIONS -->

      <div class="card-actions">

        <button
          class="edit-btn"
          onclick="editVehicle('${vehicle.id}')"
        >
          ✎ Edit
        </button>


        <button
          class="delete-btn"
          onclick="deleteVehicle('${vehicle.id}')"
        >
          🗑 Delete
        </button>

      </div>


    </div>

  `;

}


/* =========================================================
   DETAIL ROW
========================================================= */

function detailRowHTML(
  label,
  value
){

  const displayValue =
    formatDate(value);


  const dateClass =
    getDateClass(value);


  return `

    <div class="detail-row">

      <span class="detail-label">
        ${escapeHTML(label)}
      </span>

      <span
        class="detail-value ${dateClass}"
      >
        ${escapeHTML(displayValue)}
      </span>

    </div>

  `;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   SEARCH
========================================================= */

function searchVehicle(){

  const input =
    document.getElementById(
      "searchInput"
    );


  const query =
    input.value
      .trim()
      .toLowerCase();


  if(!query){

    filteredVehicles =
      [...allVehicles];

  }
  else{

    filteredVehicles =

      allVehicles.filter(
        vehicle => {

          const vehicleNumber =
            String(
              vehicle.vehicle_number ||
              ""
            ).toLowerCase();


          const customerName =
            String(
              vehicle.customer_name ||
              ""
            ).toLowerCase();


          const mobile =
            String(
              vehicle.mobile ||
              ""
            ).toLowerCase();


          return (

            vehicleNumber.includes(query)

            ||

            customerName.includes(query)

            ||

            mobile.includes(query)

          );

        }
      );

  }


  currentPage = 1;

  renderVehicles();

}


/* =========================================================
   PAGINATION
========================================================= */

function previousPage(){

  if(
    currentPage > 1
  ){

    currentPage--;

    renderVehicles();

  }

}


function nextPage(){

  const totalPages =
    Math.ceil(
      filteredVehicles.length /
      recordsPerPage
    );


  if(
    currentPage < totalPages
  ){

    currentPage++;

    renderVehicles();

  }

}


/* =========================================================
   GO TO UPLOAD
========================================================= */

function goToUpload(){

  window.location.href =
    "upload.html";

}


/* =========================================================
   EDIT
========================================================= */

function editVehicle(id){

  localStorage.setItem(
    "editVehicleId",
    id
  );


  window.location.href =
    "upload.html";

}


/* =========================================================
   DELETE STORAGE PHOTO
========================================================= */

async function deleteStoragePhoto(path){

  if(!path){

    return;

  }


  try{

    const {
      error
    } =
    await supabaseClient

      .storage

      .from(
        "vehicle-photos"
      )

      .remove([
        path
      ]);


    if(error){

      console.warn(
        "Photo delete error:",
        error
      );

    }

  }catch(error){

    console.warn(
      "Storage delete error:",
      error
    );

  }

}


/* =========================================================
   DELETE VEHICLE
========================================================= */

async function deleteVehicle(id){

  const vehicle =
    allVehicles.find(
      v =>
        String(v.id) ===
        String(id)
    );


  if(!vehicle){

    return;

  }


  const confirmed =
    confirm(
      "Are you sure you want to delete this vehicle?"
    );


  if(!confirmed){

    return;

  }


  try{

    /*
      DELETE PHOTO
    */

    if(
      vehicle.photo_path
    ){

      await deleteStoragePhoto(
        vehicle.photo_path
      );

    }


    /*
      DELETE DATABASE RECORD
    */

    const {
      error
    } =
    await supabaseClient

      .from("vehicles")

      .delete()

      .eq(
        "id",
        id
      );


    if(error){

      throw error;

    }


    alert(
      "Vehicle deleted successfully."
    );


    await loadVehicles();


  }catch(error){

    console.error(
      error
    );


    alert(
      "Error deleting vehicle:\n" +
      (
        error.message ||
        String(error)
      )
    );

  }

}


/* =========================================================
   START
========================================================= */

loadVehicles();

</script>
