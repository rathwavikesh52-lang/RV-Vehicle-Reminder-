<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RV Vehicle Reminder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#1e293b;

    background-image:url("./assets/background.png");
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    padding:18px 25px;
    display:flex;
    align-items:center;
    gap:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
}

.logo{
    width:48px;
    height:48px;
    border-radius:12px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    flex-shrink:0;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:12px;
}

.header-text h1{
    margin:0;
    font-size:25px;
    font-weight:700;
}

.header-text p{
    margin:4px 0 0;
    font-size:13px;
    opacity:0.9;
}

.language-buttons{
    margin-left:auto;
    display:flex;
    gap:6px;
}

.language-buttons button{
    border:none;
    padding:7px 10px;
    border-radius:6px;
    background:rgba(255,255,255,0.2);
    color:white;
    cursor:pointer;
    font-size:12px;
}

.language-buttons button:hover{
    background:rgba(255,255,255,0.35);
}

/* MAIN CONTAINER */

.container{
    max-width:1250px;
    margin:25px auto;
    padding:0 15px;
}

/* TOP TITLE */

.page-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:12px;
}

.page-title h2{
    margin:0;
    font-size:24px;
    color:#0f172a;
}

.top-buttons{
    display:flex;
    gap:10px;
}

.btn{
    border:none;
    padding:11px 17px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    transition:0.2s;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-primary:hover{
    background:#1d4ed8;
}

.btn-refresh{
    background:#16a34a;
    color:white;
}

.btn-refresh:hover{
    background:#15803d;
}

/* SUMMARY CARDS */

.summary-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.summary-card{
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(8px);
    border-radius:12px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
    border-left:5px solid #2563eb;
}

.summary-card h3{
    margin:0 0 10px;
    font-size:14px;
    color:#64748b;
}

.summary-card .number{
    font-size:30px;
    font-weight:700;
    color:#0f172a;
}

.summary-card.expiring{
    border-left-color:#f59e0b;
}

.summary-card.expired{
    border-left-color:#dc2626;
}

.summary-card.today{
    border-left-color:#16a34a;
}

/* TODAY SECTION */

.today-section{
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(8px);
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
    margin-bottom:20px;
}

.today-section h3{
    margin:0 0 15px;
    font-size:18px;
    color:#0f172a;
}

.today-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
}

.today-card{
    padding:15px;
    background:#f8fafc;
    border-radius:10px;
    text-align:center;
    border:1px solid #e2e8f0;
}

.today-card .label{
    font-size:12px;
    color:#64748b;
    margin-bottom:6px;
    font-weight:bold;
}

.today-card .value{
    font-size:24px;
    font-weight:bold;
    color:#16a34a;
}

/* SEARCH */

.search-box{
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(8px);
    padding:15px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
    margin-bottom:20px;
}

.search-box input{
    width:100%;
    padding:13px 15px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

.search-box input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,0.12);
}

/* VEHICLE LIST */

.vehicle-list{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.vehicle-card{
    background:rgba(255,255,255,0.94);
    backdrop-filter:blur(8px);
    border-radius:12px;
    padding:18px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
    border-left:5px solid #2563eb;
}

.vehicle-main-line{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.vehicle-number-text{
    font-size:19px;
    font-weight:700;
    color:#1d4ed8;
}

.customer-group{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-left:auto;
}

.customer-text{
    font-size:15px;
    font-weight:700;
    color:#334155;
}

.mobile-text{
    font-size:14px;
    font-weight:600;
    color:#475569;
}

.vehicle-details{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
    margin-bottom:15px;
}

.detail-box{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    padding:10px;
    border-radius:8px;
}

.detail-box .label{
    display:block;
    font-size:11px;
    color:#64748b;
    font-weight:bold;
    margin-bottom:5px;
    text-transform:uppercase;
}

.detail-box .value{
    font-size:13px;
    font-weight:700;
    color:#334155;
}

.date-normal{
    color:#16a34a !important;
}

.date-warning{
    color:#f59e0b !important;
}

.date-danger{
    color:#dc2626 !important;
}

.vehicle-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

.action-btn{
    border:none;
    padding:8px 13px;
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
}

.edit-btn{
    background:#dbeafe;
    color:#1d4ed8;
}

.delete-btn{
    background:#fee2e2;
    color:#dc2626;
}

.edit-btn:hover{
    background:#bfdbfe;
}

.delete-btn:hover{
    background:#fecaca;
}

/* EMPTY */

.empty{
    background:rgba(255,255,255,0.94);
    backdrop-filter:blur(8px);
    padding:40px 20px;
    text-align:center;
    border-radius:12px;
    color:#64748b;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

/* PAGINATION */

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    margin:25px 0;
}

.pagination button{
    border:none;
    background:#2563eb;
    color:white;
    padding:9px 15px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.pagination button:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

#pageInfo{
    font-size:14px;
    font-weight:bold;
    color:#334155;
}

/* LOADING */

.loading{
    text-align:center;
    padding:30px;
    font-size:16px;
    color:#64748b;
}

/* RESPONSIVE */

@media(max-width:900px){

    .summary-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .today-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .vehicle-details{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:600px){

    .header{
        padding:15px;
    }

    .header-text h1{
        font-size:19px;
    }

    .header-text p{
        font-size:11px;
    }

    .language-buttons{
        display:none;
    }

    .container{
        margin:18px auto;
        padding:0 10px;
    }

    .page-title h2{
        font-size:20px;
    }

    .top-buttons{
        width:100%;
    }

    .top-buttons .btn{
        flex:1;
    }

    .summary-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .summary-card{
        padding:15px;
    }

    .summary-card .number{
        font-size:25px;
    }

    .today-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .vehicle-main-line{
        display:block;
    }

    .customer-group{
        margin-left:0;
        margin-top:10px;
    }

    .vehicle-details{
        grid-template-columns:repeat(2,1fr);
    }

    .vehicle-card{
        padding:14px;
    }

}

/* FOOTER */

.footer{
    text-align:center;
    padding:20px;
    color:#64748b;
    font-size:12px;
}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <div class="logo">
        <img src="./assets/logo.png" alt="RV Logo">
    </div>

    <div class="header-text">
        <h1>RV Vehicle Reminder</h1>
        <p>Vehicle Expiry Management System</p>
    </div>

    <div class="language-buttons">
        <button onclick="setLanguage('en')">English</button>
        <button onclick="setLanguage('gu')">ગુજરાતી</button>
        <button onclick="setLanguage('hi')">हिंदी</button>
    </div>

</div>


<div class="container">

    <!-- PAGE TITLE -->

    <div class="page-title">

        <h2 id="dashboardTitle">Dashboard</h2>

        <div class="top-buttons">
            <button class="btn btn-primary" onclick="goToUpload()">
                + Add Vehicle
            </button>

            <button class="btn btn-refresh" onclick="loadVehicles()">
                ↻ Refresh
            </button>
        </div>

    </div>


    <!-- SUMMARY -->

    <div class="summary-grid">

        <div class="summary-card">
            <h3>Total Vehicles</h3>
            <div class="number" id="totalVehicles">0</div>
        </div>

        <div class="summary-card expiring">
            <h3>Expiring Soon</h3>
            <div class="number" id="expiringVehicles">0</div>
        </div>

        <div class="summary-card expired">
            <h3>Expired Vehicles</h3>
            <div class="number" id="expiredVehicles">0</div>
        </div>

        <div class="summary-card today">
            <h3>Today's Expiry</h3>
            <div class="number" id="todayVehicles">0</div>
        </div>

    </div>


    <!-- TODAY EXPIRY -->

    <div class="today-section">

        <h3>Today's Expiry Details</h3>

        <div class="today-grid">

            <div class="today-card">
                <div class="label">FITNESS</div>
                <div class="value" id="todayFitness">0</div>
            </div>

            <div class="today-card">
                <div class="label">INSURANCE</div>
                <div class="value" id="todayInsurance">0</div>
            </div>

            <div class="today-card">
                <div class="label">PUC</div>
                <div class="value" id="todayPuc">0</div>
            </div>

            <div class="today-card">
                <div class="label">TAX</div>
                <div class="value" id="todayTax">0</div>
            </div>

            <div class="today-card">
                <div class="label">PERMIT</div>
                <div class="value" id="todayPermit">0</div>
            </div>

        </div>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search by Vehicle Number, Customer Name or Mobile..."
            oninput="searchVehicle()"
        >

    </div>


    <!-- VEHICLE LIST -->

    <div id="vehicleList" class="vehicle-list">

        <div class="loading">
            Loading vehicles...
        </div>

    </div>


    <!-- PAGINATION -->

    <div class="pagination">

        <button id="prevBtn" onclick="previousPage()">
            Previous
        </button>

        <span id="pageInfo">Page 1</span>

        <button id="nextBtn" onclick="nextPage()">
            Next
        </button>

    </div>

</div>


<div class="footer">
    © 2026 RV Vehicle Reminder
</div>


<script>

/* SUPABASE CONFIG */

const SUPABASE_URL =
"https://lqbhafspabtlqeubqxjg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* GLOBAL VARIABLES */

let allVehicles = [];
let filteredVehicles = [];

let currentPage = 1;
const perPage = 10;


/* LOAD VEHICLES */

async function loadVehicles(){

    document.getElementById("vehicleList").innerHTML =
    `<div class="loading">Loading vehicles...</div>`;

    const { data, error } = await supabaseClient
        .from("vehicles")
        .select("*")
        .order("id", { ascending:false });

    if(error){

        console.error(error);

        document.getElementById("vehicleList").innerHTML =
        `<div class="empty">Unable to load vehicles.</div>`;

        return;
    }

    allVehicles = data || [];
    filteredVehicles = [...allVehicles];

    currentPage = 1;

    updateSummary();

    renderTable();

}


/* DATE PARSER */

function parseDate(date){

    if(!date) return null;

    const d = new Date(date);

    if(isNaN(d.getTime())) return null;

    return d;
}


/* FORMAT DATE */

function formatDate(date){

    if(!date) return "-";

    const d = parseDate(date);

    if(!d) return date;

    const day = String(d.getDate()).padStart(2,"0");

    const monthNames = [
        "Jan","Feb","Mar","Apr","May","Jun",
        "Jul","Aug","Sep","Oct","Nov","Dec"
    ];

    const month = monthNames[d.getMonth()];

    const year = d.getFullYear();

    return `${day}-${month}-${year}`;

}


/* DATE STATUS */

function getDateClass(date){

    if(!date) return "";

    const d = parseDate(date);

    if(!d) return "";

    const today = new Date();

    today.setHours(0,0,0,0);

    d.setHours(0,0,0,0);

    const difference =
    Math.ceil((d - today) / (1000*60*60*24));

    if(difference < 0){
        return "date-danger";
    }

    if(difference <= 10){
        return "date-warning";
    }

    return "date-normal";

}


/* TODAY CHECK */

function isToday(date){

    if(!date) return false;

    const d = parseDate(date);

    if(!d) return false;

    const today = new Date();

    return (
        d.getFullYear() === today.getFullYear() &&
        d.getMonth() === today.getMonth() &&
        d.getDate() === today.getDate()
    );

}


/* UPDATE SUMMARY */

function updateSummary(){

    let expired = 0;
    let expiring = 0;
    let todayCount = 0;

    let todayFitness = 0;
    let todayInsurance = 0;
    let todayPuc = 0;
    let todayTax = 0;
    let todayPermit = 0;

    allVehicles.forEach(vehicle => {

        const expiryFields = [
            "fitness_expiry",
            "insurance_expiry",
            "pucc_expiry",
            "tax_expiry",
            "permit_expiry"
        ];

        let vehicleExpired = false;
        let vehicleExpiring = false;

        expiryFields.forEach(field => {

            const date = vehicle[field];

            if(!date) return;

            const d = parseDate(date);

            if(!d) return;

            const today = new Date();

            today.setHours(0,0,0,0);
            d.setHours(0,0,0,0);

            const diff =
            Math.ceil((d - today)/(1000*60*60*24));

            if(diff < 0){
                vehicleExpired = true;
            }
            else if(diff <= 10){
                vehicleExpiring = true;
            }

            if(isToday(date)){

                todayCount++;

                if(field === "fitness_expiry") todayFitness++;
                if(field === "insurance_expiry") todayInsurance++;
                if(field === "pucc_expiry") todayPuc++;
                if(field === "tax_expiry") todayTax++;
                if(field === "permit_expiry") todayPermit++;

            }

        });

        if(vehicleExpired){
            expired++;
        }
        else if(vehicleExpiring){
            expiring++;
        }

    });


    document.getElementById("totalVehicles").innerText =
    allVehicles.length;

    document.getElementById("expiredVehicles").innerText =
    expired;

    document.getElementById("expiringVehicles").innerText =
    expiring;

    document.getElementById("todayVehicles").innerText =
    todayCount;

    document.getElementById("todayFitness").innerText =
    todayFitness;

    document.getElementById("todayInsurance").innerText =
    todayInsurance;

    document.getElementById("todayPuc").innerText =
    todayPuc;

    document.getElementById("todayTax").innerText =
    todayTax;

    document.getElementById("todayPermit").innerText =
    todayPermit;

}


/* RENDER VEHICLES */

function renderTable(){

    const list = document.getElementById("vehicleList");

    if(filteredVehicles.length === 0){

        list.innerHTML =
        `<div class="empty">No vehicles found.</div>`;

        document.getElementById("pageInfo").innerText =
        "Page 0";

        document.getElementById("prevBtn").disabled = true;
        document.getElementById("nextBtn").disabled = true;

        return;
    }


    const totalPages =
    Math.ceil(filteredVehicles.length / perPage);

    if(currentPage > totalPages){
        currentPage = totalPages;
    }

    const start =
    (currentPage - 1) * perPage;

    const end = start + perPage;

    const pageVehicles =
    filteredVehicles.slice(start,end);


    list.innerHTML = pageVehicles.map(vehicle => {

        return `

        <div class="vehicle-card">

            <div class="vehicle-main-line">

                <span class="vehicle-number-text">
                    🚗 ${vehicle.vehicle_number || "-"}
                </span>

                <div class="customer-group">

                    <span class="customer-text">
                        👤 ${vehicle.customer_name || "-"}
                    </span>

                    <span class="mobile-text">
                        📞 ${vehicle.mobile || "-"}
                    </span>

                </div>

            </div>


            <div class="vehicle-details">

                <div class="detail-box">
                    <span class="label">Registration</span>
                    <span class="value">
                        ${formatDate(vehicle.registration_date)}
                    </span>
                </div>

                <div class="detail-box">
                    <span class="label">Fitness</span>
                    <span class="value ${getDateClass(vehicle.fitness_expiry)}">
                        ${formatDate(vehicle.fitness_expiry)}
                    </span>
                </div>

                <div class="detail-box">
                    <span class="label">Insurance</span>
                    <span class="value ${getDateClass(vehicle.insurance_expiry)}">
                        ${formatDate(vehicle.insurance_expiry)}
                    </span>
                </div>

                <div class="detail-box">
                    <span class="label">Tax</span>
                    <span class="value ${getDateClass(vehicle.tax_expiry)}">
                        ${vehicle.tax_expiry || "-"}
                    </span>
                </div>

                <div class="detail-box">
                    <span class="label">PUCC</span>
                    <span class="value ${getDateClass(vehicle.pucc_expiry)}">
                        ${formatDate(vehicle.pucc_expiry)}
                    </span>
                </div>

                <div class="detail-box">
                    <span class="label">Permit</span>
                    <span class="value ${getDateClass(vehicle.permit_expiry)}">
                        ${formatDate(vehicle.permit_expiry)}
                    </span>
                </div>

            </div>


            <div class="vehicle-actions">

                <button
                    class="action-btn edit-btn"
                    onclick="editVehicle(${vehicle.id})">
                    Edit
                </button>

                <button
                    class="action-btn delete-btn"
                    onclick="deleteVehicle(${vehicle.id})">
                    Delete
                </button>

            </div>

        </div>

        `;

    }).join("");


    document.getElementById("pageInfo").innerText =
    `Page ${currentPage} of ${totalPages}`;

    document.getElementById("prevBtn").disabled =
    currentPage === 1;

    document.getElementById("nextBtn").disabled =
    currentPage === totalPages;

}


/* SEARCH */

function searchVehicle(){

    const search =
    document.getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

    filteredVehicles = allVehicles.filter(vehicle => {

        return (

            (vehicle.vehicle_number || "")
            .toLowerCase()
            .includes(search)

            ||

            (vehicle.customer_name || "")
            .toLowerCase()
            .includes(search)

            ||

            (vehicle.mobile || "")
            .toLowerCase()
            .includes(search)

        );

    });

    currentPage = 1;

    renderTable();

}


/* PAGINATION */

function nextPage(){

    const totalPages =
    Math.ceil(filteredVehicles.length / perPage);

    if(currentPage < totalPages){

        currentPage++;

        renderTable();

    }

}


function previousPage(){

    if(currentPage > 1){

        currentPage--;

        renderTable();

    }

}


/* NAVIGATION */

function goToUpload(){

    window.location.href = "upload.html";

}


function editVehicle(id){

    window.location.href =
    `upload.html?id=${id}`;

}


/* DELETE VEHICLE */

async function deleteVehicle(id){

    const confirmDelete =
    confirm("Are you sure you want to delete this vehicle?");

    if(!confirmDelete) return;


    const vehicle =
    allVehicles.find(v => v.id === id);


    if(vehicle && vehicle.photo_path){

        const { error: storageError } =
        await supabaseClient
        .storage
        .from("vehicle-photos")
        .remove([vehicle.photo_path]);

        if(storageError){
            console.log(storageError);
        }

    }


    const { error } =
    await supabaseClient
    .from("vehicles")
    .delete()
    .eq("id",id);


    if(error){

        alert("Delete failed: " + error.message);

        return;

    }


    alert("Vehicle deleted successfully!");

    loadVehicles();

}


/* LANGUAGE */

function setLanguage(language){

    const title =
    document.getElementById("dashboardTitle");

    if(language === "gu"){
        title.innerText = "ડેશબોર્ડ";
    }
    else if(language === "hi"){
        title.innerText = "डैशबोर्ड";
    }
    else{
        title.innerText = "Dashboard";
    }

}


/* INITIAL LOAD */

loadVehicles();

</script>

</body>
</html>
