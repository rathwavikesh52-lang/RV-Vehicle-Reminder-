<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://lqbhafspabtlqeubqxjg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let allVehicles = [];

let filteredVehicles = [];

let currentPage = 1;

const recordsPerPage = 10;


/* =========================================================
   EXPIRY FIELDS
========================================================= */

const expiryFields = [

  "fitness_expiry",

  "insurance_expiry",

  "tax_expiry",

  "pucc_expiry",

  "permit_expiry"

];


/* =========================================================
   LANGUAGE
========================================================= */

function setLanguage(language){

  if(language === "gu"){

    alert(
      "ગુજરાતી ભાષા પસંદ કરવામાં આવી."
    );

    return;

  }


  if(language === "hi"){

    alert(
      "हिन्दी भाषा चुनी गई."
    );

    return;

  }


  alert(
    "English language selected."
  );

}


/* =========================================================
   DATE PARSER
========================================================= */

function parseDate(value){

  if(!value){

    return null;

  }


  if(
    String(value).toUpperCase() ===
    "LTT"
  ){

    return null;

  }


  const date =
  new Date(value);


  if(
    isNaN(date.getTime())
  ){

    return null;

  }


  return date;

}


/* =========================================================
   DAYS DIFFERENCE
========================================================= */

function getDaysDifference(value){

  const date =
  parseDate(value);


  if(!date){

    return null;

  }


  const today =
  new Date();


  today.setHours(
    0,0,0,0
  );


  date.setHours(
    0,0,0,0
  );


  const difference =
    date.getTime() -
    today.getTime();


  return Math.ceil(
    difference /
    (1000 * 60 * 60 * 24)
  );

}


/* =========================================================
   EXPIRING SOON
========================================================= */

function isExpiringSoon(value){

  const days =
  getDaysDifference(value);


  return (
    days !== null &&
    days >= 0 &&
    days <= 10
  );

}


/* =========================================================
   EXPIRED
========================================================= */

function isExpired(value){

  const days =
  getDaysDifference(value);


  return (
    days !== null &&
    days < 0
  );

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(value){

  if(!value){

    return "-";

  }


  if(
    String(value).toUpperCase() ===
    "LTT"
  ){

    return "LTT";

  }


  const date =
  new Date(value);


  if(
    isNaN(date.getTime())
  ){

    return value;

  }


  const day =
    String(
      date.getDate()
    ).padStart(2,"0");


  const month =
    String(
      date.getMonth()+1
    ).padStart(2,"0");


  const year =
    date.getFullYear();


  return (
    day +
    "/" +
    month +
    "/" +
    year
  );

}


/* =========================================================
   DATE CLASS
========================================================= */

function getDateClass(value){

  if(
    isExpired(value)
  ){

    return "expired";

  }


  if(
    isExpiringSoon(value)
  ){

    return "expiring";

  }


  return "normal";

}


/* =========================================================
   VEHICLE EXPIRING
========================================================= */

function vehicleIsExpiring(vehicle){

  return expiryFields.some(
    field =>
    isExpiringSoon(
      vehicle[field]
    )
  );

}


/* =========================================================
   VEHICLE EXPIRED
========================================================= */

function vehicleIsExpired(vehicle){

  return expiryFields.some(
    field =>
    isExpired(
      vehicle[field]
    )
  );

}


/* =========================================================
   LOAD VEHICLES
========================================================= */

async function loadVehicles(){

  const vehicleList =
    document.getElementById(
      "vehicleList"
    );


  vehicleList.innerHTML = `
    <div class="loading">
      Loading vehicles...
    </div>
  `;


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("vehicles")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      throw error;

    }


    allVehicles =
      data || [];


    filteredVehicles =
      [...allVehicles];


    currentPage =
      1;


    updateSummary();

    renderVehicles();


  }catch(error){

    console.error(error);


    vehicleList.innerHTML = `
      <div class="empty-box">
        <h3>Error Loading Vehicles</h3>
        <p>${escapeHTML(
          error.message ||
          String(error)
        )}</p>
      </div>
    `;

  }

}


/* =========================================================
   UPDATE SUMMARY
========================================================= */

function updateSummary(){

  const total =
    allVehicles.length;


  let expiring = 0;

  let expired = 0;


  allVehicles.forEach(
    vehicle => {

      if(
        vehicleIsExpiring(
          vehicle
        )
      ){

        expiring++;

      }


      if(
        vehicleIsExpired(
          vehicle
        )
      ){

        expired++;

      }

    }
  );


  document.getElementById(
    "headerTotalVehicles"
  ).textContent =
    total;


  document.getElementById(
    "expiringCount"
  ).textContent =
    expiring;


  document.getElementById(
    "expiredCount"
  ).textContent =
    expired;


  /*
    HEADER FITNESS
  */

  document.getElementById(
    "headerFitnessCount"
  ).textContent =
    allVehicles.filter(
      v =>
      isExpiringSoon(
        v.fitness_expiry
      )
    ).length;


  /*
    HEADER INSURANCE
  */

  document.getElementById(
    "headerInsuranceCount"
  ).textContent =
    allVehicles.filter(
      v =>
      isExpiringSoon(
        v.insurance_expiry
      )
    ).length;


  /*
    HEADER PUC
  */

  document.getElementById(
    "headerPucCount"
  ).textContent =
    allVehicles.filter(
      v =>
      isExpiringSoon(
        v.pucc_expiry
      )
    ).length;


  /*
    HEADER TAX
  */

  document.getElementById(
    "headerTaxCount"
  ).textContent =
    allVehicles.filter(
      v =>
      isExpiringSoon(
        v.tax_expiry
      )
    ).length;


  /*
    HEADER PERMIT
  */

  document.getElementById(
    "headerPermitCount"
  ).textContent =
    allVehicles.filter(
      v =>
      isExpiringSoon(
        v.permit_expiry
      )
    ).length;

}


/* =========================================================
   RENDER VEHICLES
========================================================= */

function renderVehicles(){

  const vehicleList =
    document.getElementById(
      "vehicleList"
    );


  const pagination =
    document.getElementById(
      "pagination"
    );


  const listInfo =
    document.getElementById(
      "listInfo"
    );


  if(
    !filteredVehicles.length
  ){

    vehicleList.innerHTML = `
      <div class="empty-box">
        <h3>No Vehicles Found</h3>
        <p>
          Add a vehicle to start monitoring expiry dates.
        </p>
      </div>
    `;


    pagination.style.display =
      "none";


    listInfo.textContent =
      "0 vehicles";


    return;

  }


  const totalPages =
    Math.ceil(
      filteredVehicles.length /
      recordsPerPage
    );


  if(
    currentPage > totalPages
  ){

    currentPage =
      totalPages;

  }


  const startIndex =
    (currentPage - 1) *
    recordsPerPage;


  const endIndex =
    startIndex +
    recordsPerPage;


  const pageVehicles =
    filteredVehicles.slice(
      startIndex,
      endIndex
    );


  vehicleList.innerHTML =
    pageVehicles
      .map(
        vehicle =>
        createVehicleCard(
          vehicle
        )
      )
      .join("");


  listInfo.textContent =
    `${filteredVehicles.length} vehicle(s) • Showing ${startIndex + 1}-${Math.min(endIndex, filteredVehicles.length)}`;


  pagination.style.display =
    totalPages > 1
      ? "flex"
      : "none";


  document.getElementById(
    "pageInfo"
  ).textContent =
    `Page ${currentPage} of ${totalPages}`;


  document.getElementById(
    "previousBtn"
  ).disabled =
    currentPage <= 1;


  document.getElementById(
    "nextBtn"
  ).disabled =
    currentPage >= totalPages;

}


/* =========================================================
   CREATE VEHICLE CARD
========================================================= */

function createVehicleCard(
  vehicle
){

  let statusText =
    "ACTIVE";

  let statusClass =
    "status-normal";


  if(
    vehicleIsExpired(
      vehicle
    )
  ){

    statusText =
      "EXPIRED";

    statusClass =
      "status-expired";

  }
  else if(
    vehicleIsExpiring(
      vehicle
    )
  ){

    statusText =
      "EXPIRING SOON";

    statusClass =
      "status-expiring";

  }


  return `

    <div class="vehicle-card">


      <div class="vehicle-header">

        <div class="vehicle-number">

          ${escapeHTML(
            vehicle.vehicle_number ||
            "-"
          )}

        </div>


        <div
          class="vehicle-status ${statusClass}"
        >

          ${statusText}

        </div>

      </div>


      <div class="customer-info">

        <div class="customer-row">

          <span class="customer-label">
            Customer:
          </span>

          <span class="customer-value">

            ${escapeHTML(
              vehicle.customer_name ||
              "-"
            )}

          </span>

        </div>


        <div class="customer-row">

          <span class="customer-label">
            Mobile:
          </span>

          <span class="customer-value">

            ${escapeHTML(
              vehicle.mobile ||
              "-"
            )}

          </span>

        </div>

      </div>


      <div class="details-grid">

        ${detailHTML(
          "Registration",
          vehicle.registration_date
        )}


        ${detailHTML(
          "Fitness",
          vehicle.fitness_expiry
        )}


        ${detailHTML(
          "Insurance",
          vehicle.insurance_expiry
        )}


        ${detailHTML(
          "Tax",
          vehicle.tax_expiry
        )}


        ${detailHTML(
          "PUCC",
          vehicle.pucc_expiry
        )}


        ${detailHTML(
          "Permit",
          vehicle.permit_expiry
        )}

      </div>


      <div class="card-actions">

        <button
          class="edit-btn"
          onclick="editVehicle('${vehicle.id}')"
        >
          Edit
        </button>


        <button
          class="delete-btn"
          onclick="deleteVehicle('${vehicle.id}')"
        >
          Delete
        </button>

      </div>

    </div>

  `;

}


/* =========================================================
   DETAIL HTML
========================================================= */

function detailHTML(
  label,
  value
){

  const displayValue =
    formatDate(value);


  const dateClass =
    getDateClass(value);


  return `

    <div class="detail-box">

      <div class="detail-label">

        ${label}

      </div>

      <div
        class="detail-value ${dateClass}"
      >

        ${escapeHTML(
          displayValue
        )}

      </div>

    </div>

  `;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   SEARCH
========================================================= */

function searchVehicle(){

  const input =
    document.getElementById(
      "searchInput"
    );


  const query =
    input.value
      .trim()
      .toLowerCase();


  if(!query){

    filteredVehicles =
      [...allVehicles];

  }else{

    filteredVehicles =
      allVehicles.filter(
        vehicle => {

          const vehicleNumber =
            String(
              vehicle.vehicle_number ||
              ""
            ).toLowerCase();


          const customerName =
            String(
              vehicle.customer_name ||
              ""
            ).toLowerCase();


          const mobile =
            String(
              vehicle.mobile ||
              ""
            ).toLowerCase();


          return (

            vehicleNumber.includes(
              query
            ) ||

            customerName.includes(
              query
            ) ||

            mobile.includes(
              query
            )

          );

        }
      );

  }


  currentPage =
    1;


  renderVehicles();

}


/* =========================================================
   PREVIOUS PAGE
========================================================= */

function previousPage(){

  if(
    currentPage > 1
  ){

    currentPage--;

    renderVehicles();

  }

}


/* =========================================================
   NEXT PAGE
========================================================= */

function nextPage(){

  const totalPages =
    Math.ceil(
      filteredVehicles.length /
      recordsPerPage
    );


  if(
    currentPage <
    totalPages
  ){

    currentPage++;

    renderVehicles();

  }

}

/* =========================================================
   DELETE STORAGE PHOTO
========================================================= */

async function deleteStoragePhoto(
  path
){

  if(!path){

    return;

  }


  try{

    const {
      error
    } =
    await supabaseClient
      .storage
      .from("vehicle-photos")
      .remove([
        path
      ]);


    if(error){

      console.warn(
        "Photo delete error:",
        error
      );

    }

  }catch(error){

    console.warn(
      "Storage delete error:",
      error
    );

  }

}


/* =========================================================
   DELETE VEHICLE
========================================================= */

async function deleteVehicle(id){

  const vehicle =
    allVehicles.find(
      v =>
      String(v.id) ===
      String(id)
    );


  if(!vehicle){

    return;

  }


  const confirmed =
    confirm(
      "Are you sure you want to delete this vehicle?"
    );


  if(!confirmed){

    return;

  }


  try{

    /*
      Delete photo first
    */

    if(
      vehicle.photo_path
    ){

      await deleteStoragePhoto(
        vehicle.photo_path
      );

    }


    /*
      Delete database record
    */

    const {
      error
    } =
    await supabaseClient
      .from("vehicles")
      .delete()
      .eq(
        "id",
        id
      );


    if(error){

      throw error;

    }


    alert(
      "Vehicle deleted successfully."
    );


    await loadVehicles();


  }catch(error){

    console.error(error);


    alert(
      "Error deleting vehicle:\n" +
      (
        error.message ||
        String(error)
      )
    );

  }

}
