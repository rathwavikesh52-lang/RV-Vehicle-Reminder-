<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RV Vehicle Reminder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial, sans-serif;
    color:#1e293b;

    background-image:url("./assets/background.png");
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,rgba(15,61,104,.94),rgba(23,105,170,.90));
    color:white;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:48px;
    height:48px;
    border-radius:12px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
}

.header-title{
    font-size:23px;
    font-weight:bold;
}

.header-subtitle{
    font-size:12px;
    opacity:.85;
    margin-top:3px;
}

.language-buttons{
    display:flex;
    gap:6px;
}

.language-buttons button{
    border:none;
    background:white;
    color:#174b7b;
    padding:7px 10px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

/* CONTAINER */

.container{
    max-width:1250px;
    margin:auto;
    padding:18px;
}

/* TOPBAR */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:18px;
}

.page-title{
    font-size:24px;
    font-weight:bold;
    color:#123e68;
}

.top-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:11px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.btn-primary{
    background:#1769aa;
    color:white;
}

.btn-success{
    background:#16803c;
    color:white;
}

/* SUMMARY */

.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:18px;
}

.summary-card{
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);
    border-radius:12px;
    padding:16px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
    border-left:5px solid #1769aa;
}

.summary-card.expiring{
    border-left-color:#f59e0b;
}

.summary-card.expired{
    border-left-color:#dc2626;
}

.summary-card.today{
    border-left-color:#7c3aed;
}

.summary-title{
    font-size:13px;
    color:#64748b;
    margin-bottom:7px;
}

.summary-number{
    font-size:25px;
    font-weight:bold;
    color:#123e68;
}

/* TODAY */

.today-section{
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);
    padding:15px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
    margin-bottom:18px;
}

.section-title{
    font-size:17px;
    font-weight:bold;
    color:#123e68;
    margin-bottom:12px;
}

.today-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.today-box{
    border-radius:9px;
    padding:12px;
    text-align:center;
    background:rgba(241,245,249,.90);
}

.today-box strong{
    display:block;
    font-size:12px;
    color:#475569;
    margin-bottom:6px;
}

.today-box span{
    font-size:22px;
    font-weight:bold;
    color:#123e68;
}

/* SEARCH */

.search-box{
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);
    padding:14px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
    margin-bottom:18px;
}

.search-box input{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:15px;
    outline:none;
    background:white;
}

/* VEHICLE CARD */

.vehicle-card{
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(8px);
    border-radius:13px;
    padding:17px;
    margin-bottom:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
    border-left:5px solid #1769aa;
}

/* VEHICLE NUMBER + CUSTOMER */

.vehicle-main-line{
    display:flex;
    align-items:flex-start;
    gap:20px;
    margin-bottom:15px;
    min-width:0;
}

.vehicle-number-text{
    font-size:18px;
    font-weight:bold;
    color:#123e68;
    white-space:nowrap;
    padding-top:2px;
}

.customer-group{
    display:flex;
    flex-direction:column;
    gap:5px;
    min-width:0;
}

.customer-text{
    font-size:16px;
    font-weight:700;
    color:#344255;
    white-space:nowrap;
}

.mobile-text{
    display:block;
    font-size:14px;
    font-weight:700;
    color:#17528d;
    white-space:nowrap;
}

/* DETAILS */

.vehicle-details{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:9px;
}

.detail-box{
    background:rgba(248,250,252,.92);
    border-radius:8px;
    padding:10px;
    border:1px solid #e2e8f0;
}

.detail-label{
    font-size:11px;
    color:#64748b;
    margin-bottom:5px;
    font-weight:bold;
}

.detail-value{
    font-size:13px;
    font-weight:bold;
    color:#1e293b;
}

.status-normal{
    color:#16803c;
}

.status-expiring{
    color:#d97706;
}

.status-expired{
    color:#dc2626;
}

/* ACTIONS */

.vehicle-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:13px;
}

.small-btn{
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
}

.edit-btn{
    background:#e0f2fe;
    color:#075985;
}

.delete-btn{
    background:#fee2e2;
    color:#b91c1c;
}

/* EMPTY */

.empty{
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(8px);
    border-radius:12px;
    padding:35px;
    text-align:center;
    color:#64748b;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

/* PAGINATION */

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin:20px 0;
}

.pagination button{
    border:none;
    background:#1769aa;
    color:white;
    padding:9px 14px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.pagination button:disabled{
    background:#cbd5e1;
    cursor:not-allowed;
}

.page-info{
    font-weight:bold;
    color:#334155;
}

/* FOOTER */

.footer{
    text-align:center;
    padding:20px;
    color:#ffffff;
    font-size:12px;
    text-shadow:0 1px 3px rgba(0,0,0,.5);
}

/* MOBILE */

@media(max-width:1000px){

    .summary{
        grid-template-columns:repeat(2,1fr);
    }

    .today-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .vehicle-details{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:600px){

    body{
        background-position:center top;
        background-attachment:scroll;
    }

    .header{
        padding:14px;
    }

    .header-title{
        font-size:19px;
    }

    .container{
        padding:12px;
    }

    .page-title{
        font-size:21px;
    }

    .summary{
        grid-template-columns:repeat(2,1fr);
        gap:8px;
    }

    .summary-card{
        padding:12px;
    }

    .summary-number{
        font-size:22px;
    }

    .today-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .vehicle-card{
        padding:13px;
    }

    .vehicle-main-line{
        gap:12px;
        overflow-x:auto;
        padding-bottom:3px;
    }

    .vehicle-number-text{
        font-size:16px;
    }

    .customer-text{
        font-size:14px;
    }

    .mobile-text{
        font-size:13px;
    }

    .vehicle-details{
        grid-template-columns:repeat(2,1fr);
    }

    .vehicle-actions{
        justify-content:flex-start;
    }

}


/* SUPABASE */

const SUPABASE_URL =
"https://lqbhafspabtlqeubqxjg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* VARIABLES */

let allVehicles = [];
let filteredVehicles = [];
let currentPage = 1;

const perPage = 10;


/* LANGUAGE */

function setLanguage(language){

    if(language === "gu"){

        document.getElementById("dashboardTitle").innerText =
        "ડેશબોર્ડ";

    }

    else if(language === "hi"){

        document.getElementById("dashboardTitle").innerText =
        "डैशबोर्ड";

    }

    else{

        document.getElementById("dashboardTitle").innerText =
        "Dashboard";

    }

}


/* LOAD VEHICLES */

async function loadVehicles(){

    const { data, error } = await supabaseClient
        .from("vehicles")
        .select("*")
        .order("id", { ascending:false });


    if(error){

        console.error("Load error:", error);

        document.getElementById("vehicleList").innerHTML =
        `
        <div class="empty">
            ❌ Error loading vehicles
        </div>
        `;

        return;

    }


    allVehicles = data || [];

    filteredVehicles = [...allVehicles];

    currentPage = 1;

    updateCounts();

    updateTodayExpiryCounts();

    renderTable();

}


/* DATE PARSER */

function parseDate(value){

    if(!value) return null;

    const date = new Date(value);

    if(isNaN(date.getTime())) return null;

    return date;

}


/* FORMAT DATE */

function formatDate(value){

    if(!value) return "-";

    const date = parseDate(value);

    if(!date) return value;

    return date.toLocaleDateString("en-GB",{
        day:"2-digit",
        month:"short",
        year:"numeric"
    });

}


/* DATE CLASS */

function getDateClass(value){

    if(!value) return "";

    const date = parseDate(value);

    if(!date) return "";

    const today = new Date();

    today.setHours(0,0,0,0);

    date.setHours(0,0,0,0);

    const diff =
        Math.ceil(
            (date - today) /
            (1000 * 60 * 60 * 24)
        );


    if(diff < 0){
        return "status-expired";
    }

    if(diff <= 10){
        return "status-expiring";
    }

    return "status-normal";

}


/* TODAY CHECK */

function isToday(value){

    if(!value) return false;

    const date = parseDate(value);

    if(!date) return false;

    const today = new Date();

    return (
        date.getDate() === today.getDate() &&
        date.getMonth() === today.getMonth() &&
        date.getFullYear() === today.getFullYear()
    );

}


/* COUNTS */

function updateCounts(){

    document.getElementById("totalVehicles").innerText =
        allVehicles.length;


    let expiring = 0;
    let expired = 0;


    allVehicles.forEach(vehicle => {

        const dates = [

            vehicle.fitness_expiry,
            vehicle.insurance_expiry,
            vehicle.pucc_expiry,
            vehicle.tax_expiry,
            vehicle.permit_expiry

        ];


        dates.forEach(value => {

            if(!value) return;

            const date = parseDate(value);

            if(!date) return;


            const today = new Date();

            today.setHours(0,0,0,0);

            date.setHours(0,0,0,0);


            const diff =
                Math.ceil(
                    (date - today) /
                    (1000 * 60 * 60 * 24)
                );


            if(diff < 0){
                expired++;
            }

            else if(diff <= 10){
                expiring++;
            }

        });

    });


    document.getElementById("expiringVehicles").innerText =
        expiring;

    document.getElementById("expiredVehicles").innerText =
        expired;

}


/* TODAY COUNTS */

function updateTodayExpiryCounts(){

    let fitness = 0;
    let insurance = 0;
    let puc = 0;
    let tax = 0;
    let permit = 0;


    allVehicles.forEach(vehicle => {

        if(isToday(vehicle.fitness_expiry)) fitness++;

        if(isToday(vehicle.insurance_expiry)) insurance++;

        if(isToday(vehicle.pucc_expiry)) puc++;

        if(isToday(vehicle.tax_expiry)) tax++;

        if(isToday(vehicle.permit_expiry)) permit++;

    });


    document.getElementById("todayFitness").innerText =
        fitness;

    document.getElementById("todayInsurance").innerText =
        insurance;

    document.getElementById("todayPuc").innerText =
        puc;

    document.getElementById("todayTax").innerText =
        tax;

    document.getElementById("todayPermit").innerText =
        permit;

    document.getElementById("todayTotal").innerText =
        fitness + insurance + puc + tax + permit;

}


/* RENDER VEHICLES */

function renderTable(){

    const list =
        document.getElementById("vehicleList");


    if(filteredVehicles.length === 0){

        list.innerHTML =
        `
        <div class="empty">
            🚗 No vehicles found
        </div>
        `;

        document.getElementById("pageInfo").innerText =
            "Page 0";

        document.getElementById("prevBtn").disabled = true;

        document.getElementById("nextBtn").disabled = true;

        return;

    }


    const start =
        (currentPage - 1) * perPage;

    const end =
        start + perPage;

    const pageVehicles =
        filteredVehicles.slice(start,end);


    list.innerHTML = "";


    pageVehicles.forEach(vehicle => {

        const card =
            document.createElement("div");

        card.className =
            "vehicle-card";


        card.innerHTML = `

            <div class="vehicle-main-line">

                <span class="vehicle-number-text">
                    🚗 ${vehicle.vehicle_number || "-"}
                </span>


                <div class="customer-group">

                    <span class="customer-text">
                        👤 ${vehicle.customer_name || "-"}
                    </span>

                    <span class="mobile-text">
                        📞 ${vehicle.mobile || "-"}
                    </span>

                </div>

            </div>


            <div class="vehicle-details">

                <div class="detail-box">

                    <div class="detail-label">
                        Registration Date
                    </div>

                    <div class="detail-value">
                        ${formatDate(vehicle.registration_date)}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        FITNESS
                    </div>

                    <div class="detail-value ${getDateClass(vehicle.fitness_expiry)}">
                        ${formatDate(vehicle.fitness_expiry)}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        INSURANCE
                    </div>

                    <div class="detail-value ${getDateClass(vehicle.insurance_expiry)}">
                        ${formatDate(vehicle.insurance_expiry)}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        TAX
                    </div>

                    <div class="detail-value">
                        ${vehicle.tax_expiry || "-"}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        PUCC
                    </div>

                    <div class="detail-value ${getDateClass(vehicle.pucc_expiry)}">
                        ${formatDate(vehicle.pucc_expiry)}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        PERMIT
                    </div>

                    <div class="detail-value ${getDateClass(vehicle.permit_expiry)}">
                        ${formatDate(vehicle.permit_expiry)}
                    </div>

                </div>

            </div>


            <div class="vehicle-actions">

                <button
                    class="small-btn edit-btn"
                    onclick="editVehicle('${vehicle.id}')">
                    ✏️ Edit
                </button>


                <button
                    class="small-btn delete-btn"
                    onclick="deleteVehicle('${vehicle.id}')">
                    🗑️ Delete
                </button>

            </div>

        `;


        list.appendChild(card);

    });


    const totalPages =
        Math.ceil(filteredVehicles.length / perPage);


    document.getElementById("pageInfo").innerText =
        `Page ${currentPage} of ${totalPages}`;


    document.getElementById("prevBtn").disabled =
        currentPage === 1;

    document.getElementById("nextBtn").disabled =
        currentPage === totalPages;

}


/* SEARCH */

function searchVehicle(){

    const query =
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    filteredVehicles =
        allVehicles.filter(vehicle => {

            const vehicleNumber =
                String(vehicle.vehicle_number || "")
                .toLowerCase();

            const customerName =
                String(vehicle.customer_name || "")
                .toLowerCase();

            const mobile =
                String(vehicle.mobile || "")
                .toLowerCase();


            return (
                vehicleNumber.includes(query) ||
                customerName.includes(query) ||
                mobile.includes(query)
            );

        });


    currentPage = 1;

    renderTable();

}


/* NEXT */

function nextPage(){

    const totalPages =
        Math.ceil(filteredVehicles.length / perPage);


    if(currentPage < totalPages){

        currentPage++;

        renderTable();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* PREVIOUS */

function previousPage(){

    if(currentPage > 1){

        currentPage--;

        renderTable();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* UPLOAD PAGE */

function goToUpload(){

    window.location.href =
        "upload.html";

}


/* EDIT */

function editVehicle(id){

    window.location.href =
        "upload.html?id=" + id;

}


/* DELETE */

async function deleteVehicle(id){

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this vehicle?"
        );


    if(!confirmDelete) return;


    const vehicle =
        allVehicles.find(
            item => String(item.id) === String(id)
        );


    if(vehicle && vehicle.photo_path){

        const { error: storageError } =
            await supabaseClient
            .storage
            .from("vehicle-photos")
            .remove([vehicle.photo_path]);


        if(storageError){

            console.log(
                "Photo delete error:",
                storageError
            );

        }

    }


    const { error } =
        await supabaseClient
        .from("vehicles")
        .delete()
        .eq("id", id);


    if(error){

        alert(
            "Delete failed: " +
            error.message
        );

        return;

    }


    alert(
        "Vehicle deleted successfully"
    );


    loadVehicles();

}


/* START */

loadVehicles();

</script>
