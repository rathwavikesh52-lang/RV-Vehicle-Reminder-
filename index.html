/* =========================================================
   DATE PARSER
========================================================= */

function parseDate(
  value
){

  if(!value){

    return null;

  }


  if(
    String(value)
      .toUpperCase()
      .trim() ===
      "LTT"
  ){

    return null;

  }


  const text =
    String(value)
      .trim();


  let match =
    text.match(
      /^(\d{2})\/(\d{2})\/(\d{4})$/
    );


  if(match){

    const day =
      Number(match[1]);

    const month =
      Number(match[2]) - 1;

    const year =
      Number(match[3]);


    const date =
      new Date(
        year,
        month,
        day
      );


    if(
      date.getFullYear() === year &&
      date.getMonth() === month &&
      date.getDate() === day
    ){

      return date;

    }

  }


  match =
    text.match(
      /^(\d{4})-(\d{2})-(\d{2})$/
    );


  if(match){

    return new Date(
      Number(match[1]),
      Number(match[2]) - 1,
      Number(match[3])
    );

  }


  return null;

}


/* =========================================================
   DISPLAY DATE
========================================================= */

function displayDate(
  value
){

  if(!value){

    return "";

  }


  if(
    String(value)
      .toUpperCase()
      .trim() ===
      "LTT"
  ){

    return "LTT";

  }


  const date =
    parseDate(value);


  if(!date){

    return value;

  }


  return (

    String(
      date.getDate()
    ).padStart(2,"0")

    +

    "/"

    +

    String(
      date.getMonth() + 1
    ).padStart(2,"0")

    +

    "/"

    +

    date.getFullYear()

  );

}


/* =========================================================
   DAYS UNTIL
========================================================= */

function daysUntil(
  value
){

  const date =
    parseDate(value);


  if(!date){

    return null;

  }


  const today =
    new Date();


  today.setHours(
    0,
    0,
    0,
    0
  );


  date.setHours(
    0,
    0,
    0,
    0
  );


  return Math.ceil(

    (
      date.getTime() -
      today.getTime()
    )

    /

    (
      1000 *
      60 *
      60 *
      24
    )

  );

}


/* =========================================================
   EXPIRY STATUS
========================================================= */

function getExpiryStatus(
  vehicle
){

  const fields = [

    vehicle.fitness_expiry,

    vehicle.insurance_expiry,

    vehicle.pucc_expiry,

    vehicle.permit_expiry

  ];


  let minimum =
    null;


  fields.forEach(
    field => {

      const days =
        daysUntil(field);


      if(
        days === null
      ){

        return;

      }


      if(
        minimum === null ||
        days < minimum
      ){

        minimum =
          days;

      }

    }
  );


  if(
    minimum === null
  ){

    return {
      type:"normal",
      days:null
    };

  }


  if(
    minimum < 0
  ){

    return {
      type:"expired",
      days:minimum
    };

  }


  if(
    minimum <= 10
  ){

    return {
      type:"expiring",
      days:minimum
    };

  }


  return {
    type:"normal",
    days:minimum
  };

}


/* =========================================================
   EXPIRING
========================================================= */

  vehicle
){

  return (
    getExpiryStatus(vehicle).type ===
    "expiring"
  );

/* =========================================================

========================================================= */

  vehicle
){

  return (
    getExpiryStatus(vehicle).type ===
    "expired"
  );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(
  value
){

  return String(
    value === undefined ||
    value === null
      ?
      ""
      :
      value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   DETAIL ROW
========================================================= */

function detailRow(
  label,
  value
){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return "";

  }


  return `

    <div class="detail-row">

      <div class="detail-label">

        ${escapeHTML(label)}:

      </div>

      <div class="detail-value">

        ${escapeHTML(
          displayDate(value)
        )}

      </div>

    </div>

  `;

}


/* =========================================================
   VEHICLE CARD - NEW DESIGN
========================================================= */

function vehicleCard(
  vehicle
){

  const photo =
    getVehicleClassPhoto(
      vehicle
    );


  const status =
    getExpiryStatus(
      vehicle
    );


  let statusClass =
    "expiry-normal";


  if(
    status.type ===
    "expiring"
  ){

    statusClass =
      "expiry-warning";

  }


  if(
    status.type ===
    "expired"
  ){

    statusClass =
      "expiry-danger";

  }


  const className =
    vehicle.vehicle_class ||
    "";


  let statusText =
    "";


  if(
    status.days !== null
  ){

    if(
      status.type ===
      "expired"
    ){

      statusText =
        translations[
          currentLanguage
        ].expiredStatus;

    }

    else if(
      status.type ===
      "expiring"
    ){

      statusText =
        status.days +
        " " +
        translations[
          currentLanguage
        ].daysLeft;

    }

    else{

      statusText =
        translations[
          currentLanguage
        ].valid;

    }

  }


  return `

    <div class="vehicle-card">


      <!-- CLASS PHOTO -->

      <img

        src="${photo}"

        class="vehicle-class-photo"

        alt="${escapeHTML(
          className ||
          "Vehicle"
        )}"

        loading="lazy"

        onerror="
          this.onerror=null;
          this.src='${vehicleClassPhotos.LMV}'
        "

      >


      <!-- RIGHT SIDE CONTENT -->

      <div class="vehicle-content">


        <!-- VEHICLE NUMBER / NAME / MOBILE -->

        <div class="vehicle-top-line">


          <div class="vehicle-number">

            🚗
            ${escapeHTML(
              vehicle.vehicle_number ||
              ""
            )}

          </div>


          ${
            vehicle.customer_name
            ?

            `

            <div class="customer-name">

              👤
              ${escapeHTML(
                vehicle.customer_name
              )}

            </div>

            `

            :

            ""
          }


          ${
            (
              vehicle.customer_mobile ||
              vehicle.mobile
            )

            ?

            `

            <div class="customer-mobile">

              📞
              ${escapeHTML(
                vehicle.customer_mobile ||
                vehicle.mobile ||
                ""
              )}

            </div>

            `

            :

            ""
          }


        </div>


        <!-- VEHICLE CLASS -->

        ${
          className

          ?

          `

          <div class="class-badge">

            ${escapeHTML(
              className
            )}

          </div>

          `

          :

          ""
        }


        <!-- DOCUMENT DETAILS -->

        <div class="details">


          ${
            detailRow(
              translations[
                currentLanguage
              ].registration,

              vehicle.registration_date
            )
          }


          ${
            detailRow(
              translations[
                currentLanguage
              ].fitness,

              vehicle.fitness_expiry
            )
          }


          ${
            detailRow(
              translations[
                currentLanguage
              ].tax,

              vehicle.tax_expiry
            )
          }


          ${
            detailRow(
              translations[
                currentLanguage
              ].insurance,

              vehicle.insurance_expiry
            )
          }


          ${
            detailRow(
              translations[
                currentLanguage
              ].pucc,

              vehicle.pucc_expiry
            )
          }


          ${
            detailRow(
              translations[
                currentLanguage
              ].permit,

              vehicle.permit_expiry
            )
          }


          ${
            status.days !== null

            ?

            `

            <div class="detail-row">

              <div class="detail-label">

                ${translations[
                  currentLanguage
                ].status}:

              </div>

              <div
                class="detail-value ${statusClass}"
              >

                ${escapeHTML(
                  statusText
                )}

              </div>

            </div>

            `

            :

            ""
          }


        </div>


        <!-- ACTIONS -->

        <div class="actions">


          <button

            class="action-btn edit-btn"

            onclick="
              editVehicle(
                '${vehicle.id}'
              )
            "

          >

            ${translations[
              currentLanguage
            ].edit}

          </button>


          <button

            class="action-btn whatsapp-btn"

            onclick="
              sendWhatsApp(
                '${vehicle.id}'
              )
            "

          >

            ${translations[
              currentLanguage
            ].whatsapp}

          </button>


          <button

            class="action-btn delete-btn"

            onclick="
              deleteVehicle(
                '${vehicle.id}'
              )
            "

          >

            ${translations[
              currentLanguage
            ].delete}

          </button>


        </div>


      </div>


    </div>

  `;

}


/* =========================================================
   LOAD VEHICLES
========================================================= */

async function loadVehicles(){

  const loading =
    document.getElementById(
      "loading"
    );


  loading.style.display =
    "block";


  try{

    const {
      data,
      error
    } =

      await supabaseClient

        .from("vehicles")

        .select("*")

        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error){

      throw error;

    }


    allVehicles =
      data || [];


    filteredVehicles =
      [
        ...allVehicles
      ];


    updateStats();

    renderAll();


  }catch(error){

    console.error(
      "Load vehicles error:",
      error
    );


    loading.textContent =
      "Error loading vehicles: " +
      error.message;

  }

}


/* =========================================================
   UPDATE STATS
========================================================= */

function updateStats(){

  const expiring =
    allVehicles.filter(
      isExpiring
    ).length;


  const expired =
    allVehicles.filter(
      isExpired
    ).length;


  document
    .getElementById(
      "totalCount"
    )
    .textContent =
    allVehicles.length;


  document
    .getElementById(
      "expiringCount"
    )
    .textContent =
    expiring;


  document
    .getElementById(
      "expiredCount"
    )
    .textContent =
    expired;

}


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll(){

  const search =
    document
      .getElementById(
        "searchBox"
      )
      .value
      .trim()
      .toLowerCase();


  if(search){

    filteredVehicles =
      allVehicles.filter(
        vehicle => {

          return (

            String(
              vehicle.vehicle_number ||
              ""
            )
            .toLowerCase()
            .includes(search)

            ||

            String(
              vehicle.customer_name ||
              ""
            )
            .toLowerCase()
            .includes(search)

            ||

            String(
              vehicle.customer_mobile ||
              vehicle.mobile ||
              ""
            )
            .toLowerCase()
            .includes(search)

            ||

            String(
              vehicle.vehicle_class ||
              ""
            )
            .toLowerCase()
            .includes(search)

          );

        }
      );

  }

  else{

    filteredVehicles =
      [
        ...allVehicles
      ];

  }


  renderVehicleList();

}


/* =========================================================
   VEHICLE LIST
========================================================= */

function renderVehicleList(){

  const loading =
    document.getElementById(
      "loading"
    );


  const grid =
    document.getElementById(
      "vehicleGrid"
    );


  const empty =
    document.getElementById(
      "empty"
    );


  const pagination =
    document.getElementById(
      "pagination"
    );


  loading.style.display =
    "none";


  if(
    !filteredVehicles.length
  ){

    grid.style.display =
      "none";


    pagination.style.display =
      "none";


    empty.style.display =
      "block";


    empty.textContent =
      translations[
        currentLanguage
      ].noVehicles;


    return;

  }


  empty.style.display =
    "none";


  grid.style.display =
    "grid";


  const totalPages =
    Math.ceil(
      filteredVehicles.length /
      vehiclesPerPage
    );


  if(
    currentPage >
    totalPages
  ){

    currentPage =
      totalPages;

  }


  const start =
    (
      currentPage - 1
    ) *
    vehiclesPerPage;


  const end =
    start +
    vehiclesPerPage;


  const pageVehicles =
    filteredVehicles.slice(
      start,
      end
    );


  grid.innerHTML =
    pageVehicles

      .map(
        vehicle =>
          vehicleCard(
            vehicle
          )
      )

      .join("");


  pagination.style.display =
    totalPages > 1
      ?
      "flex"
      :
      "none";


  document
    .getElementById(
      "pageInfo"
    )
    .textContent =

      translations[
        currentLanguage
      ].page +

      " " +

      currentPage +

      " / " +

      totalPages;


  document
    .getElementById(
      "prevBtn"
    )
    .disabled =
    currentPage <= 1;


  document
    .getElementById(
      "nextBtn"
    )
    .disabled =
    currentPage >= totalPages;

}


/* =========================================================
   SEARCH
========================================================= */

function handleSearch(){

  currentPage =
    1;


  renderAll();

}


/* =========================================================
   NEXT PAGE
========================================================= */

function nextPage(){

  const totalPages =
    Math.ceil(
      filteredVehicles.length /
      vehiclesPerPage
    );


  if(
    currentPage <
    totalPages
  ){

    currentPage++;


    renderVehicleList();


    window.scrollTo({

      top:0,

      behavior:"smooth"

    });

  }

}


/* =========================================================
   PREVIOUS PAGE
========================================================= */

function previousPage(){

  if(
    currentPage >
    1
  ){

    currentPage--;


    renderVehicleList();


    window.scrollTo({

      top:0,

      behavior:"smooth"

    });

  }

}


/* =========================================================
   EDIT VEHICLE
========================================================= */

function editVehicle(
  id
){

  window.location.href =
    "./upload.html?id=" +
    encodeURIComponent(
      id
    );

}


/* =========================================================
   DELETE STORAGE PHOTO
========================================================= */

async function deleteStoragePhoto(
  path
){

  if(!path){

    return;

  }


  const {
    error
  } =

    await supabaseClient

      .storage

      .from(
        "vehicle-photos"
      )

      .remove([
        path
      ]);


  if(error){

    console.warn(
      "Storage delete error:",
      error
    );

  }

}


/* =========================================================
   DELETE VEHICLE
========================================================= */

async function deleteVehicle(
  id
){

  const vehicle =
    allVehicles.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(!vehicle){

    return;

  }


  const confirmText =

    currentLanguage === "gu"

    ?

    "શું તમે આ વાહનને કાયમ માટે Delete કરવા માંગો છો?"

    :

    "Do you want to permanently delete this vehicle?";


  if(
    !confirm(
      confirmText
    )
  ){

    return;

  }


  try{

    if(
      vehicle.photo_path
    ){

      await deleteStoragePhoto(
        vehicle.photo_path
      );

    }


    const {
      error
    } =

      await supabaseClient

        .from("vehicles")

        .delete()

        .eq(
          "id",
          id
        );


    if(error){

      throw error;

    }


    alert(

      currentLanguage === "gu"

      ?

      "વાહન કાયમ માટે Delete થઈ ગયું."

      :

      "Vehicle permanently deleted."

    );


    await loadVehicles();


  }catch(error){

    console.error(
      "Delete error:",
      error
    );


    alert(
      "Delete Error:\n" +
      error.message
    );

  }

}


/* =========================================================
   WHATSAPP REMINDER
========================================================= */

function sendWhatsApp(
  id
){

  const vehicle =
    allVehicles.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(!vehicle){

    return;

  }


  let mobile =
    vehicle.customer_mobile ||
    vehicle.mobile ||
    "";


  mobile =
    String(mobile)
      .replace(
        /\D/g,
        ""
      );


  if(!mobile){

    alert(

      currentLanguage === "gu"

      ?

      "આ વાહન માટે Mobile Number ઉપલબ્ધ નથી."

      :

      "Mobile Number is not available for this vehicle."

    );

    return;

  }


  let phone =
    mobile;


  if(
    phone.length === 10
  ){

    phone =
      "91" +
      phone;

  }


  const customerName =
    String(
      vehicle.customer_name ||
      ""
    )
    .trim();


  const vehicleNumber =
    String(
      vehicle.vehicle_number ||
      ""
    )
    .trim();


  const expiryDocuments =
    [];


  /* FITNESS */

  if(
    vehicle.fitness_expiry
  ){

    const days =
      daysUntil(
        vehicle.fitness_expiry
      );


    if(
      days !== null
    ){

      expiryDocuments.push({

        name:
          "Fitness",

        date:
          vehicle.fitness_expiry,

        days:
          days

      });

    }

  }


  /* INSURANCE */

  if(
    vehicle.insurance_expiry
  ){

    const days =
      daysUntil(
        vehicle.insurance_expiry
      );


    if(
      days !== null
    ){

      expiryDocuments.push({

        name:
          "Insurance",

        date:
          vehicle.insurance_expiry,

        days:
          days

      });

    }

  }


  /* PUCC */

  if(
    vehicle.pucc_expiry
  ){

    const days =
      daysUntil(
        vehicle.pucc_expiry
      );


    if(
      days !== null
    ){

      expiryDocuments.push({

        name:
          "PUCC",

        date:
          vehicle.pucc_expiry,

        days:
          days

      });

    }

  }


  /* PERMIT */

  if(
    vehicle.permit_expiry &&
    String(
      vehicle.permit_expiry
    )
    .toUpperCase()
    .trim() !==
    "LTT"
  ){

    const days =
      daysUntil(
        vehicle.permit_expiry
      );


    if(
      days !== null
    ){

      expiryDocuments.push({

        name:
          "Permit",

        date:
          vehicle.permit_expiry,

        days:
          days

      });

    }

  }


  if(
    !expiryDocuments.length
  ){

    alert(

      currentLanguage === "gu"

      ?

      "આ વાહન માટે કોઈ valid expiry date ઉપલબ્ધ નથી."

      :

      "No valid expiry date is available for this vehicle."

    );

    return;

  }


  expiryDocuments.sort(

    (a,b) =>
      a.days - b.days

  );


  const nearest =
    expiryDocuments[0];


  const expiryDate =
    displayDate(
      nearest.date
    );


  const documentName =
    nearest.name;


  let message =
    "";


  /* GUJARATI */

  if(
    currentLanguage === "gu"
  ){

    message =

`*SAHKAR AUTO ADVISOR*
*NASVADI*

નમસ્તે ${customerName || "ગ્રાહક"},

તમારા વાહન *${vehicleNumber}* નું ${documentName}
*${expiryDate}* ના રોજ expire થવાનું છે.

કૃપા કરીને સમયસર renewal કરાવી લેશો.

📞 *Renewal માટે સંપર્ક કરો:*
9714733501
8000033501

રમીઝભાઈ મેમણ
નસવાડી`;

  }


  /* ENGLISH */

  else{

    message =

`*SAHKAR AUTO ADVISOR*
*NASVADI*

Hello ${customerName || "Customer"},

The *${documentName}* of your vehicle
*${vehicleNumber}* will expire on *${expiryDate}*.

Please get the renewal done on time.

📞 *For renewal, contact:*
9714733501
8000033501

Ramizbhai Memon
Nasvadi`;

  }


  const whatsappURL =

    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(
      message
    );


  window.open(
    whatsappURL,
    "_blank"
  );

}

   INITIAL LOAD
========================================================= */

document.addEventListener(

    setLanguage("en");

    loadVehicles();

  }
);

========================================================= */

setInterval(
