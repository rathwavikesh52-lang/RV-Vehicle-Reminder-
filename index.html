<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RV Vehicle Reminder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#172033;

    background-image:
        linear-gradient(
            rgba(240,245,255,.82),
            rgba(240,245,255,.82)
        ),
        url("./assets/background.png");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}


/* =========================
   HEADER
========================= */

.header{
    min-height:82px;

    background:linear-gradient(
        135deg,
        #0f3c91,
        #1769d1,
        #1687e8
    );

    color:white;

    display:flex;
    align-items:center;

    padding:14px 28px;

    box-shadow:
        0 8px 25px rgba(15,60,145,.25);

    position:relative;
    z-index:10;
}

.logo{
    width:55px;
    height:55px;

    background:white;

    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    box-shadow:
        0 5px 15px rgba(0,0,0,.18);

    flex-shrink:0;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.header-text{
    margin-left:15px;
}

.header-text h1{
    font-size:25px;
    font-weight:800;
    letter-spacing:.2px;
}

.header-text p{
    margin-top:4px;
    font-size:12px;
    opacity:.9;
}

.language-buttons{
    margin-left:auto;

    display:flex;
    gap:7px;
}

.language-buttons button{
    border:1px solid rgba(255,255,255,.35);

    padding:8px 11px;

    border-radius:9px;

    background:rgba(255,255,255,.14);

    color:white;

    cursor:pointer;

    font-size:12px;
    font-weight:600;

    backdrop-filter:blur(5px);
}

.language-buttons button:hover{
    background:rgba(255,255,255,.28);
}


/* =========================
   MAIN CONTAINER
========================= */

.container{
    max-width:1250px;

    margin:0 auto;

    padding:30px 18px 10px;
}


/* =========================
   TOP TITLE
========================= */

.page-title{
    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:22px;

    gap:15px;

    flex-wrap:wrap;
}

.page-title h2{
    font-size:27px;
    font-weight:800;

    color:#102a56;
}

.page-title h2::after{
    content:"";

    display:block;

    width:48px;
    height:4px;

    margin-top:7px;

    border-radius:10px;

    background:#1687e8;
}

.top-buttons{
    display:flex;
    gap:10px;
}

.btn{
    border:none;

    padding:12px 18px;

    border-radius:11px;

    cursor:pointer;

    font-size:14px;
    font-weight:700;

    transition:.2s;

    box-shadow:0 5px 12px rgba(0,0,0,.08);
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-primary{
    background:linear-gradient(135deg,#1769d1,#1687e8);
    color:white;
}

.btn-refresh{
    background:white;
    color:#1769d1;
    border:1px solid #d8e5f5;
}


/* =========================
   SUMMARY CARDS
========================= */

.summary-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:16px;

    margin-bottom:20px;
}

.summary-card{
    position:relative;

    overflow:hidden;

    background:rgba(255,255,255,.94);

    border:1px solid rgba(210,224,242,.9);

    border-radius:17px;

    padding:20px;

    box-shadow:
        0 8px 25px rgba(30,70,120,.10);

    transition:.2s;
}

.summary-card:hover{
    transform:translateY(-4px);

    box-shadow:
        0 14px 30px rgba(30,70,120,.15);
}

.summary-card::after{
    content:"";

    position:absolute;

    right:-25px;
    top:-25px;

    width:85px;
    height:85px;

    border-radius:50%;

    background:#eaf3ff;
}

.summary-card h3{
    position:relative;
    z-index:1;

    font-size:13px;

    color:#64748b;

    margin-bottom:12px;

    font-weight:700;
}

.summary-card .number{
    position:relative;
    z-index:1;

    font-size:34px;

    font-weight:800;

    color:#102a56;
}

.summary-card{
    border-top:4px solid #1769d1;
}

.summary-card.expiring{
    border-top-color:#f59e0b;
}

.summary-card.expired{
    border-top-color:#dc2626;
}

.summary-card.today{
    border-top-color:#16a34a;
}


/* =========================
   TODAY SECTION
========================= */

.today-section{
    background:rgba(255,255,255,.94);

    border:1px solid #dce7f5;

    border-radius:17px;

    padding:20px;

    margin-bottom:20px;

    box-shadow:
        0 8px 25px rgba(30,70,120,.08);
}

.today-heading{
    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:17px;
}

.today-icon{
    width:36px;
    height:36px;

    border-radius:10px;

    background:#e8f8ef;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;
}

.today-section h3{
    font-size:18px;
    color:#102a56;
}

.today-grid{
    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:12px;
}

.today-card{
    background:#f8fbff;

    border:1px solid #dce8f5;

    padding:16px 10px;

    border-radius:13px;

    text-align:center;

    transition:.2s;
}

.today-card:hover{
    background:#eef6ff;
    transform:translateY(-2px);
}

.today-card .label{
    font-size:11px;

    color:#64748b;

    margin-bottom:8px;

    font-weight:800;

    letter-spacing:.4px;
}

.today-card .value{
    font-size:27px;

    font-weight:800;

    color:#16a34a;
}


/* =========================
   SEARCH
========================= */

.search-box{
    background:rgba(255,255,255,.95);

    border:1px solid #dce7f5;

    border-radius:15px;

    padding:15px;

    margin-bottom:20px;

    box-shadow:
        0 8px 25px rgba(30,70,120,.08);
}

.search-wrapper{
    position:relative;
}

.search-icon{
    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    font-size:18px;

    color:#64748b;
}

.search-box input{
    width:100%;

    padding:14px 15px 14px 44px;

    border:1px solid #cbd8e8;

    border-radius:11px;

    font-size:14px;

    outline:none;

    color:#172033;

    background:#fbfdff;
}

.search-box input:focus{
    border-color:#1687e8;

    box-shadow:
        0 0 0 3px rgba(22,135,232,.10);
}


/* =========================
   VEHICLE LIST
========================= */

.vehicle-list{
    display:flex;

    flex-direction:column;

    gap:16px;
}


/* =========================
   VEHICLE CARD
========================= */

.vehicle-card{
    background:rgba(255,255,255,.96);

    border:1px solid #dce7f5;

    border-left:6px solid #1769d1;

    border-radius:17px;

    padding:19px;

    box-shadow:
        0 8px 25px rgba(30,70,120,.08);

    transition:.2s;
}

.vehicle-card:hover{
    transform:translateY(-2px);

    box-shadow:
        0 12px 30px rgba(30,70,120,.13);
}


/* =========================
   VEHICLE TOP
========================= */

.vehicle-main-line{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    flex-wrap:wrap;

    margin-bottom:17px;

    padding-bottom:14px;

    border-bottom:1px solid #edf2f7;
}

.vehicle-number-text{
    font-size:20px;

    font-weight:800;

    color:#0f4da8;

    letter-spacing:.3px;
}

.customer-group{
    display:flex;

    flex-direction:column;

    align-items:flex-end;

    gap:4px;
}

.customer-text{
    font-size:14px;

    font-weight:700;

    color:#26364d;
}

.mobile-text{
    font-size:13px;

    font-weight:600;

    color:#64748b;
}


/* =========================
   VEHICLE DETAILS
========================= */

.vehicle-details{
    display:grid;

    grid-template-columns:
        repeat(6,1fr);

    gap:10px;

    margin-bottom:16px;
}

.detail-box{
    background:#f8fbff;

    border:1px solid #e1eaf4;

    padding:12px;

    border-radius:11px;
}

.detail-box .label{
    display:block;

    font-size:10px;

    color:#718096;

    font-weight:800;

    margin-bottom:6px;

    text-transform:uppercase;

    letter-spacing:.4px;
}

.detail-box .value{
    font-size:13px;

    font-weight:800;

    color:#26364d;
}

.date-normal{
    color:#16a34a!important;
}

.date-warning{
    color:#d97706!important;
}

.date-danger{
    color:#dc2626!important;
}


/* =========================
   ACTIONS
========================= */

.vehicle-actions{
    display:flex;

    justify-content:flex-end;

    gap:8px;

    padding-top:13px;

    border-top:1px solid #edf2f7;
}

.action-btn{
    border:none;

    padding:9px 15px;

    border-radius:9px;

    cursor:pointer;

    font-size:12px;

    font-weight:800;

    transition:.2s;
}

.action-btn:hover{
    transform:translateY(-1px);
}

.edit-btn{
    background:#e8f2ff;

    color:#1769d1;
}

.delete-btn{
    background:#fff0f0;

    color:#dc2626;
}


/* =========================
   EMPTY / LOADING
========================= */

.empty{
    background:rgba(255,255,255,.96);

    border:1px solid #dce7f5;

    padding:55px 20px;

    text-align:center;

    border-radius:17px;

    color:#64748b;

    box-shadow:
        0 8px 25px rgba(30,70,120,.08);
}

.loading{
    background:rgba(255,255,255,.96);

    padding:40px;

    text-align:center;

    border-radius:17px;

    color:#64748b;

    box-shadow:
        0 8px 25px rgba(30,70,120,.08);
}


/* =========================
   PAGINATION
========================= */

.pagination{
    display:flex;

    justify-content:center;

    align-items:center;

    gap:15px;

    margin:25px 0;
}

.pagination button{
    border:none;

    background:#1769d1;

    color:white;

    padding:10px 17px;

    border-radius:9px;

    cursor:pointer;

    font-weight:700;
}

.pagination button:hover{
    background:#0f4da8;
}

.pagination button:disabled{
    background:#aebdce;

    cursor:not-allowed;
}

#pageInfo{
    font-size:14px;

    font-weight:800;

    color:#334155;
}


/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;

    padding:25px;

    color:#64748b;

    font-size:12px;
}


/* =========================
   TABLET
========================= */

@media(max-width:1000px){

    .summary-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

    .today-grid{
        grid-template-columns:
            repeat(3,1fr);
    }

    .vehicle-details{
        grid-template-columns:
            repeat(3,1fr);
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        padding:12px 14px;

        min-height:70px;
    }

    .logo{
        width:45px;
        height:45px;

        border-radius:12px;
    }

    .header-text{
        margin-left:10px;
    }

    .header-text h1{
        font-size:18px;
    }

    .header-text p{
        font-size:10px;
    }

    .language-buttons{
        display:none;
    }

    .container{
        padding:20px 10px 5px;
    }

    .page-title{

    }

    .page-title h2{
        font-size:22px;
    }

    .top-buttons{
        width:100%;
    }

    .top-buttons .btn{
        flex:1;

        padding:11px 8px;
    }

    .summary-grid{
        grid-template-columns:

    }

    .summary-card{
        padding:15px;

        border-radius:14px;
    }

    .summary-card h3{
        font-size:11px;
    }

    .summary-card .number{
        font-size:27px;
    }

    .today-section{
        padding:15px;

        border-radius:14px;
    }

    .today-grid{
        grid-template-columns:

    .today-card{
        padding:13px 8px;
    }

    .today-card .value{
        font-size:24px;
    }

    .vehicle-card{
        padding:14px;

        border-radius:14px;
    }

    .vehicle-main-line{
        display:block;

        margin-bottom:13px;
    }

    .vehicle-number-text{
        display:block;

    .customer-group{

    }

    .detail-box{

    }

    .detail-box .value{
        font-size:12px;
    }

    .vehicle-actions{

    }

        padding:10px;
    }

}


/* =========================
   SMALL PHONE
========================= */

@media(max-width:380px){

    .summary-card .number{
        font-size:24px;
    }

    .vehicle-number-text{
        font-size:16px;
    }

    .detail-box .label{
        font-size:9px;
    }

}

</style>
</head>


<body>


<!-- =========================

<div class="header">

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://lqbhafspabtlqeubqxjg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   VARIABLES
========================= */

let allVehicles = [];

let filteredVehicles = [];

let currentPage = 1;

const perPage = 10;


/* =========================
   LOAD VEHICLES
========================= */

async function loadVehicles(){

    document.getElementById(
        "vehicleList"
    ).innerHTML =
    `<div class="loading">
        Loading vehicles...
     </div>`;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("vehicles")
        .select("*")
        .order("id",{ascending:false});


    if(error){

        console.error(error);

        document.getElementById(
            "vehicleList"
        ).innerHTML =
        `<div class="empty">
            Unable to load vehicles.
         </div>`;

        return;
    }


    allVehicles = data || [];

    filteredVehicles =
        [...allVehicles];

    currentPage = 1;

    updateSummary();

    renderTable();
}


/* =========================
   PARSE DATE
========================= */

function parseDate(date){

    if(!date)
        return null;

    const d = new Date(date);

    if(isNaN(d.getTime()))
        return null;

    return d;
}


/* =========================
   FORMAT DATE
========================= */

function formatDate(date){

    if(!date)
        return "-";

    const d =
        parseDate(date);

    if(!d)
        return date;

    const day =
        String(d.getDate())
        .padStart(2,"0");

    const monthNames = [
        "Jan","Feb","Mar",
        "Apr","May","Jun",
        "Jul","Aug","Sep",
        "Oct","Nov","Dec"
    ];

    const month =
        monthNames[d.getMonth()];

    const year =
        d.getFullYear();

    return `${day}-${month}-${year}`;
}


/* =========================
   DATE COLOR
========================= */

function getDateClass(date){

    if(!date)
        return "";

    const d =
        parseDate(date);

    if(!d)
        return "";

    const today =
        new Date();

    today.setHours(
        0,0,0,0
    );

    d.setHours(
        0,0,0,0
    );

    const difference =
        Math.ceil(
            (d-today) /
            (1000*60*60*24)
        );


    if(difference < 0)
        return "date-danger";


    if(difference <= 10)
        return "date-warning";


    return "date-normal";
}


/* =========================
   TODAY CHECK
========================= */

function isToday(date){

    if(!date)
        return false;

    const d =
        parseDate(date);

    if(!d)
        return false;

    const today =
        new Date();

    return (
        d.getFullYear()
        === today.getFullYear()
        &&
        d.getMonth()
        === today.getMonth()
        &&
        d.getDate()
        === today.getDate()
    );
}


/* =========================
   SUMMARY
========================= */

function updateSummary(){

    let expired = 0;

    let expiring = 0;

    let todayCount = 0;

    let todayFitness = 0;

    let todayInsurance = 0;

    let todayPuc = 0;

    let todayTax = 0;

    let todayPermit = 0;


    allVehicles.forEach(
        vehicle => {

        const expiryFields = [

            "fitness_expiry",

            "insurance_expiry",

            "pucc_expiry",

            "tax_expiry",

            "permit_expiry"

        ];


        let vehicleExpired =
            false;

        let vehicleExpiring =
            false;


        expiryFields.forEach(
            field => {

            const date =
                vehicle[field];

            if(!date)
                return;


            const d =
                parseDate(date);

            if(!d)
                return;


            const today =
                new Date();

            today.setHours(
                0,0,0,0
            );

            d.setHours(
                0,0,0,0
            );


            const diff =
                Math.ceil(
                    (d-today) /
                    (1000*60*60*24)
                );


            if(diff < 0){

                vehicleExpired =
                    true;

            }

            else if(diff <= 10){

                vehicleExpiring =
                    true;

            }


            if(isToday(date)){

                todayCount++;


                if(field ===
                    "fitness_expiry"){

                    todayFitness++;

                }


                if(field ===
                    "insurance_expiry"){

                    todayInsurance++;

                }


                if(field ===
                    "pucc_expiry"){

                    todayPuc++;

                }


                if(field ===
                    "tax_expiry"){

                    todayTax++;

                }


                if(field ===
                    "permit_expiry"){

                    todayPermit++;

                }

            }

        });


        if(vehicleExpired){

            expired++;

        }

        else if(vehicleExpiring){

            expiring++;

        }

    });


    document.getElementById(
        "totalVehicles"
    ).innerText =
        allVehicles.length;


    document.getElementById(
        "expiredVehicles"
    ).innerText =
        expired;


    document.getElementById(
        "expiringVehicles"
    ).innerText =
        expiring;


    document.getElementById(
        "todayVehicles"
    ).innerText =
        todayCount;


    document.getElementById(
        "todayFitness"
    ).innerText =
        todayFitness;


    document.getElementById(
        "todayInsurance"
    ).innerText =
        todayInsurance;


    document.getElementById(
        "todayPuc"
    ).innerText =
        todayPuc;


    document.getElementById(
        "todayTax"
    ).innerText =
        todayTax;


    document.getElementById(
        "todayPermit"
    ).innerText =
        todayPermit;

}


/* =========================
   RENDER VEHICLES
========================= */

function renderTable(){

    const list =
        document.getElementById(
            "vehicleList"
        );


    if(filteredVehicles.length === 0){

        list.innerHTML =
        `<div class="empty">
            No vehicles found.
         </div>`;

        document.getElementById(
            "pageInfo"
        ).innerText =
            "Page 0";

        document.getElementById(
            "prevBtn"
        ).disabled = true;

        document.getElementById(
            "nextBtn"
        ).disabled = true;

        return;
    }


    const totalPages =
        Math.ceil(
            filteredVehicles.length /
            perPage
        );


    if(currentPage > totalPages)
        currentPage = totalPages;


    const start =
        (currentPage-1) *
        perPage;


    const end =
        start + perPage;


    const pageVehicles =
        filteredVehicles.slice(
            start,
            end
        );


    list.innerHTML =
        pageVehicles.map(
            vehicle => `

        <div class="vehicle-card">

            <div class="vehicle-main-line">

                <span class="vehicle-number-text">
                    🚗 ${vehicle.vehicle_number || "-"}
                </span>

                <div class="customer-group">

                    <span class="customer-text">
                        👤 ${vehicle.customer_name || "-"}
                    </span>

                    <span class="mobile-text">
                        📞 ${vehicle.mobile || "-"}
                    </span>

                </div>

            </div>


            <div class="vehicle-details">


                <div class="detail-box">

                    <span class="label">
                        Registration
                    </span>

                    <span class="value">
                        ${formatDate(
                            vehicle.registration_date
                        )}
                    </span>

                </div>


                <div class="detail-box">

                    <span class="label">
                        Fitness
                    </span>

                    <span
                        class="value
                        ${getDateClass(
                            vehicle.fitness_expiry
                        )}"
                    >
                        ${formatDate(
                            vehicle.fitness_expiry
                        )}
                    </span>

                </div>


                <div class="detail-box">

                    <span class="label">
                        Insurance
                    </span>

                    <span
                        class="value
                        ${getDateClass(
                            vehicle.insurance_expiry
                        )}"
                    >
                        ${formatDate(
                            vehicle.insurance_expiry
                        )}
                    </span>

                </div>


                <div class="detail-box">

                    <span class="label">
                        Tax
                    </span>

                    <span
                        class="value
                        ${getDateClass(
                            vehicle.tax_expiry
                        )}"
                    >
                        ${vehicle.tax_expiry || "-"}
                    </span>

                </div>


                <div class="detail-box">

                    <span class="label">
                        PUCC
                    </span>

                    <span
                        class="value
                        ${getDateClass(
                            vehicle.pucc_expiry
                        )}"
                    >
                        ${formatDate(
                            vehicle.pucc_expiry
                        )}
                    </span>

                </div>


                <div class="detail-box">

                    <span class="label">
                        Permit
                    </span>

                    <span
                        class="value
                        ${getDateClass(
                            vehicle.permit_expiry
                        )}"
                    >
                        ${formatDate(
                            vehicle.permit_expiry
                        )}
                    </span>

                </div>


            </div>


            <div class="vehicle-actions">

                <button
                    class="action-btn edit-btn"
                    onclick="editVehicle(${vehicle.id})"
                >
                    Edit
                </button>


                <button
                    class="action-btn delete-btn"
                    onclick="deleteVehicle(${vehicle.id})"
                >
                    Delete
                </button>

            </div>

        </div>

    `
    ).join("");


    document.getElementById(
        "pageInfo"
    ).innerText =
        `Page ${currentPage} of ${totalPages}`;


    document.getElementById(
        "prevBtn"
    ).disabled =
        currentPage === 1;


    document.getElementById(
        "nextBtn"
    ).disabled =
        currentPage === totalPages;

}


/* =========================
   SEARCH
========================= */

function searchVehicle(){

    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    filteredVehicles =
        allVehicles.filter(
            vehicle =>

            (vehicle.vehicle_number || "")
            .toLowerCase()
            .includes(search)

            ||

            (vehicle.customer_name || "")
            .toLowerCase()
            .includes(search)

            ||

            (vehicle.mobile || "")
            .toLowerCase()
            .includes(search)
        );


    currentPage = 1;

    renderTable();

}


/* =========================
   NEXT PAGE
========================= */

function nextPage(){

    const totalPages =
        Math.ceil(
            filteredVehicles.length /
            perPage
        );


    if(currentPage < totalPages){

        currentPage++;

        renderTable();

    }

}


/* =========================
   PREVIOUS PAGE
========================= */

function previousPage(){

    if(currentPage > 1){

        currentPage--;

        renderTable();

    }

}


/* =========================
   ADD VEHICLE
========================= */

function goToUpload(){

    window.location.href =
        "upload.html";

}


/* =========================
   EDIT VEHICLE
========================= */

function editVehicle(id){

    window.location.href =
        `upload.html?id=${id}`;

}


/* =========================
   DELETE VEHICLE
========================= */

async function deleteVehicle(id){

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this vehicle?"
        );


    if(!confirmDelete)
        return;


    const vehicle =
        allVehicles.find(
            v => v.id === id
        );


    if(vehicle &&
       vehicle.photo_path){

        const {
            error:storageError
        } =
        await supabaseClient
            .storage
            .from("vehicle-photos")
            .remove([
                vehicle.photo_path
            ]);


        if(storageError)
            console.log(
                storageError
            );

    }


    const {
        error
    } =
    await supabaseClient
        .from("vehicles")
        .delete()
        .eq("id",id);


    if(error){

        alert(
            "Delete failed: "
            + error.message
        );

        return;
    }


    alert(
        "Vehicle deleted successfully!"
    );


    loadVehicles();

}

   LANGUAGE
========================= */

function setLanguage(language){

    const title =
        document.getElementById(
            "dashboardTitle"
        );


    if(language === "gu"){

        title.innerText =
            "ડેશબોર્ડ";

    }

    else if(language === "hi"){

        title.innerText =
            "डैशबोर्ड";

    }

    else{

        title.innerText =
            "Dashboard";

    }

}


/* =========================
   START
========================= */

loadVehicles();
