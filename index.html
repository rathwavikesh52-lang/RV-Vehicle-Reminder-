<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RV Vehicle Reminder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

html{
  min-height:100%;
}

body{
  color:#102a43;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;

  /*
    PREMIUM HIGHWAY / MOUNTAIN BACKGROUND
  */
  background:
    linear-gradient(
      rgba(7,28,52,.32),
      rgba(7,28,52,.52)
    ),
    linear-gradient(
      180deg,
      #78c5e8 0%,
      #c7e5ef 26%,
      #91a98f 27%,
      #5d7b61 40%,
      #38533e 52%,
      #29372f 56%,
      #20282d 57%,
      #11171b 100%
    );

  background-attachment:fixed;
  background-size:cover;
}


/* =========================================
   MOUNTAIN BACKGROUND
========================================= */

body::after{
  content:"";

  position:fixed;

  left:0;
  right:0;
  bottom:24%;

  height:39%;

  z-index:-2;

  pointer-events:none;

  background:

    linear-gradient(
      145deg,
      transparent 0 22%,
      rgba(42,70,51,.95) 23% 43%,
      transparent 44%
    ),

    linear-gradient(
      215deg,
      transparent 0 27%,
      rgba(53,82,60,.96) 28% 48%,
      transparent 49%
    ),

    linear-gradient(
      155deg,
      transparent 0 48%,
      rgba(31,55,40,.95) 49% 70%,
      transparent 71%
    );

  opacity:.95;
}


/* =========================================
   HIGHWAY
========================================= */

body::before{
  content:"";

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:47%;

  z-index:-1;

  pointer-events:none;

  background:

    repeating-linear-gradient(
      180deg,
      transparent 0 38px,
      rgba(255,255,255,.95) 39px 54px,
      transparent 55px 92px
    ),

    linear-gradient(
      180deg,
      #343e44,
      #151b1f
    );

  clip-path:polygon(
    38% 0,
    62% 0,
    100% 100%,
    0 100%
  );

  box-shadow:
    inset 0 20px 35px rgba(0,0,0,.20);

  opacity:.97;
}


/* =========================================
   HEADER
========================================= */

header{
  position:relative;
  z-index:2;

  padding:18px 28px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:15px;

  background:rgba(255,255,255,.90);

  backdrop-filter:blur(14px);

  border-bottom:1px solid rgba(148,163,184,.25);

  box-shadow:
    0 7px 25px rgba(15,23,42,.16);
}


/* =========================================
   LOGO
========================================= */

.logo-area{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo-icon{
  width:62px;
  height:62px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #0f3b63,
      #2563eb
    );

  color:white;

  font-size:27px;
  font-weight:bold;

  box-shadow:
    0 8px 20px rgba(37,99,235,.25);

  position:relative;
}

.logo-icon::after{
  content:"";

  position:absolute;

  width:22px;
  height:7px;

  border-radius:50%;

  background:#f59e0b;

  bottom:12px;
  right:5px;

  transform:rotate(-12deg);
}

.logo-title{
  font-size:27px;
  font-weight:800;

  color:#12395d;
}

.logo-title span{
  color:#2563eb;
}

.logo-subtitle{
  margin-top:4px;

  font-size:14px;

  color:#64748b;
}


/* =========================================
   LANGUAGE
========================================= */

.language button{
  border:0;

  padding:8px 12px;

  border-radius:8px;

  cursor:pointer;

  background:#eff6ff;

  color:#1d4ed8;

  font-weight:bold;

  margin-left:4px;
}


/* =========================================
   MAIN
========================================= */

.container{
  position:relative;
  z-index:1;

  max-width:1500px;

  margin:auto;

  padding:24px 22px 35px;
}


/* =========================================
   TOP AREA
========================================= */

.topbar{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:20px;

  margin-bottom:22px;
}

.page-heading h1{
  font-size:28px;

  color:white;

  text-shadow:
    0 2px 5px rgba(0,0,0,.55);
}

.page-heading p{
  margin-top:5px;

  color:#f1f5f9;

  font-size:14px;

  text-shadow:
    0 2px 4px rgba(0,0,0,.55);
}


/* =========================================
   TOTAL VEHICLES
========================================= */

.total-card{
  min-width:230px;

  display:flex;

  align-items:center;

  gap:14px;

  padding:14px 20px;

  background:rgba(255,255,255,.94);

  border-radius:16px;

  box-shadow:
    0 10px 28px rgba(15,23,42,.18);

  border:1px solid rgba(148,163,184,.2);

  backdrop-filter:blur(10px);
}

.total-icon{
  width:48px;
  height:48px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#2563eb;

  color:white;

  font-size:23px;
}

.total-label{
  color:#64748b;

  font-size:13px;
}

.total-number{
  margin-top:2px;

  font-size:25px;

  font-weight:800;

  color:#1454a3;
}


/* =========================================
   BUTTON
========================================= */

.btn{
  border:0;

  padding:12px 17px;

  border-radius:9px;

  cursor:pointer;

  font-weight:bold;

  background:#2563eb;

  color:white;

  box-shadow:
    0 5px 14px rgba(37,99,235,.30);
}

.btn:hover{
  background:#1d4ed8;
}


/* =========================================
   SEARCH
========================================= */

.search-box{
  display:flex;

  gap:12px;

  align-items:center;

  background:rgba(255,255,255,.94);

  padding:14px;

  border-radius:14px;

  margin-bottom:20px;

  box-shadow:
    0 8px 25px rgba(15,23,42,.13);

  backdrop-filter:blur(10px);
}

.search-box input{
  width:100%;

  padding:13px 15px;

  border:1px solid #dbe3ec;

  border-radius:9px;

  font-size:15px;

  outline:none;

  background:#fff;
}

.search-box input:focus{
  border-color:#2563eb;

  box-shadow:
    0 0 0 3px rgba(37,99,235,.10);
}


/* =========================================
   VEHICLE LIST
========================================= */

.vehicle-list-box{
  background:rgba(255,255,255,.95);

  border-radius:20px;

  padding:18px;

  box-shadow:
    0 12px 35px rgba(15,23,42,.20);

  border:1px solid rgba(148,163,184,.25);

  backdrop-filter:blur(10px);
}

.vehicle-list-title{
  display:flex;

  align-items:center;

  gap:10px;

  margin-bottom:16px;

  font-size:21px;

  font-weight:800;

  color:#102a43;
}

.vehicle-list-title .car{
  font-size:25px;
}


/* =========================================
   VEHICLE CARD
========================================= */

.vehicle-card{
  display:grid;

  grid-template-columns:220px 1fr 1fr 105px;

  gap:20px;

  align-items:center;

  padding:18px;

  margin-bottom:14px;

  background:rgba(255,255,255,.98);

  border:1px solid #e2e8f0;

  border-radius:15px;

  box-shadow:
    0 5px 18px rgba(15,23,42,.08);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.vehicle-card:hover{
  transform:translateY(-2px);

  box-shadow:
    0 10px 27px rgba(15,23,42,.15);
}

.vehicle-card:last-child{
  margin-bottom:0;
}


/* =========================================
   VEHICLE NUMBER
========================================= */

.vehicle-number{
  display:flex;

  flex-direction:column;

  gap:10px;
}

.vehicle-photo{
  width:100%;

  height:105px;

  border-radius:11px;

  object-fit:cover;

  background:#e8f1fb;
}

.vehicle-number-text{
  font-size:20px;

  font-weight:800;

  color:#102a43;

  word-break:break-word;
}


/* =========================================
   DETAILS
========================================= */

.vehicle-details{
  display:flex;

  flex-direction:column;

  gap:12px;
}

.detail-row{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:12px;

  padding-bottom:7px;

  border-bottom:1px solid #edf2f7;
}

.detail-label{
  color:#52677d;

  font-size:14px;
}

.detail-value{
  font-weight:bold;

  font-size:14px;

  padding:6px 10px;

  border-radius:20px;

  background:#eff6ff;

  color:#1454a3;

  white-space:nowrap;
}


/* =========================================
   ACTION
========================================= */

.action-area{
  display:flex;

  flex-direction:column;

  gap:8px;
}

.action-btn{
  border:0;

  padding:9px 8px;

  border-radius:8px;

  cursor:pointer;

  font-weight:bold;

  width:100%;
}

.delete{
  background:#fee2e2;

  color:#991b1b;
}

.delete:hover{
  background:#fecaca;
}


/* =========================================
   EMPTY
========================================= */

.empty{
  text-align:center;

  padding:45px 20px;

  color:#64748b;
}


/* =========================================
   PAGINATION
========================================= */

.pagination{
  display:flex;

  justify-content:center;

  align-items:center;

  gap:14px;

  padding:20px;
}

.pagination button{
  padding:9px 14px;

  border:1px solid #d1d5db;

  background:white;

  border-radius:7px;

  cursor:pointer;

  font-weight:bold;
}

.pagination button:hover{
  background:#eff6ff;
}


/* =========================================
   BOTTOM STATUS
========================================= */

.status-row{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:18px;

  margin-top:18px;
}

.status-card{
  padding:17px 22px;

  border-radius:14px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  box-shadow:
    0 7px 22px rgba(15,23,42,.13);

  backdrop-filter:blur(8px);
}

.status-left{
  display:flex;

  align-items:center;

  gap:12px;
}

.status-icon{
  font-size:24px;
}

.status-title{
  font-weight:800;

  font-size:16px;
}

.status-number{
  font-size:26px;

  font-weight:800;
}

.soon-card{
  background:rgba(255,248,231,.96);

  border:1px solid #fde68a;

  color:#9a6700;
}

.expired-card{
  background:rgba(255,240,240,.96);

  border:1px solid #fecaca;

  color:#b91c1c;
}


/* =========================================
   FOOTER
========================================= */

footer{
  position:relative;

  z-index:2;

  text-align:center;

  padding:22px;

  color:white;

  font-size:13px;

  text-shadow:
    0 2px 5px rgba(0,0,0,.65);
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:1000px){

  .vehicle-card{
    grid-template-columns:180px 1fr 1fr;
  }

  .action-area{
    grid-column:1/-1;

    flex-direction:row;
  }

  .action-btn{
    width:auto;
  }

}


@media(max-width:700px){

  header{
    padding:14px;
  }

  .logo-title{
    font-size:20px;
  }

  .logo-subtitle{
    font-size:11px;
  }

  .logo-icon{
    width:50px;
    height:50px;

    font-size:21px;
  }

  .language{
    display:none;
  }

  .container{
    padding:15px 11px 25px;
  }

  .topbar{
    flex-direction:column;

    align-items:stretch;
  }

  .page-heading h1{
    font-size:23px;
  }

  .total-card{
    min-width:0;

    width:100%;
  }

  .vehicle-list-box{
    padding:12px;
  }

  .vehicle-card{
    display:block;

    padding:14px;
  }

  .vehicle-photo{
    height:160px;

    margin-bottom:10px;
  }

  .vehicle-number-text{
    margin-bottom:14px;
  }

  .vehicle-details{
    margin-top:12px;
  }

  .detail-row{
    align-items:flex-start;
  }

  .detail-value{
    white-space:normal;

    text-align:right;
  }

  .action-area{
    margin-top:14px;
  }

  .status-row{
    grid-template-columns:1fr 1fr;

    gap:8px;
  }

  .status-card{
    padding:13px 10px;
  }

  .status-title{
    font-size:12px;
  }

  .status-number{
    font-size:22px;
  }

  .status-icon{
    font-size:18px;
  }

}


@media(max-width:420px){

  .topbar > div:last-child{
    flex-direction:column !important;
    align-items:stretch !important;
  }

  .total-card,
  .btn{
    width:100%;
  }

  .status-row{
    grid-template-columns:1fr 1fr;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo-area">

    <div class="logo-icon">
      RV
    </div>

    <div>

      <div class="logo-title">
        <span>RV</span> Vehicle Reminder
      </div>

      <div class="logo-subtitle">
        Vehicle Expiry Management System
      </div>

    </div>

  </div>


  <div class="language">

    <button onclick="setLanguage('en')">
      English
    </button>

    <button onclick="setLanguage('gu')">
      ગુજરાતી
    </button>

  </div>

</header>


<div class="container">


  <!-- TOP -->

  <div class="topbar">

    <div class="page-heading">

      <h1 id="pageTitle">
        Dashboard
      </h1>

      <p>
        Manage your vehicle expiry details easily
      </p>

    </div>


    <div style="display:flex;gap:12px;align-items:center;">

      <div class="total-card">

        <div class="total-icon">
          🚗
        </div>

        <div>

          <div
            class="total-label"
            id="totalTitle">

            Total Vehicles

          </div>

          <div
            class="total-number"
            id="totalVehicles">

            0 / 1000

          </div>

        </div>

      </div>


      <button
        class="btn"
        onclick="goToUpload()"
        id="uploadText">

        📸 Upload Vehicle Photo

      </button>

    </div>

  </div>


  <!-- SEARCH -->

  <div class="search-box">

    <input
      type="text"
      id="searchInput"
      placeholder="🔍 Search Vehicle Number..."
      oninput="searchVehicle()">

  </div>


  <!-- VEHICLE LIST -->

  <div class="vehicle-list-box">

    <div class="vehicle-list-title">

      <span class="car">
        🚗
      </span>

      <span>
        VEHICLE LIST
      </span>

    </div>


    <div id="vehicleTable"></div>

  </div>


  <!-- PAGINATION -->

  <div class="pagination">

    <button onclick="previousPage()">
      ◀
    </button>

    <span id="pageNumber">
      Page 1
    </span>

    <button onclick="nextPage()">
      ▶
    </button>

  </div>


  <!-- BOTTOM STATUS -->

  <div class="status-row">

    <div class="status-card soon-card">

      <div class="status-left">

        <div class="status-icon">
          ⏰
        </div>

        <div
          class="status-title"
          id="soonTitle">

          Expiring Soon

        </div>

      </div>


      <div
        class="status-number"
        id="expiringSoon">

        0

      </div>

    </div>


    <div class="status-card expired-card">

      <div class="status-left">

        <div class="status-icon">
          ⚠️
        </div>

        <div
          class="status-title"
          id="expiredTitle">

          Expired Vehicles

        </div>

      </div>


      <div
        class="status-number"
        id="expiredVehicles">

        0

      </div>

    </div>

  </div>

</div>


<footer>

  RV Vehicle Reminder • Maximum 1,000 Vehicles

</footer>


<script>

/* =========================================
   SUPABASE CONNECTION
========================================= */

const SUPABASE_URL =
  "https://lqbhafspabtlqeubqxjg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   VARIABLES
========================================= */

let allVehicles = [];

let filteredVehicles = [];

let currentPage = 1;

const perPage = 10;

let currentLanguage = "en";


/* =========================================
   LANGUAGE
========================================= */

const text = {

  en:{

    dashboard:"Dashboard",

    upload:"📸 Upload Vehicle Photo",

    total:"Total Vehicles",

    soon:"Expiring Soon",

    expired:"Expired Vehicles",

    search:"🔍 Search Vehicle Number...",

    empty:"No vehicles added yet.",

    page:"Page",

    delete:"🗑️ Delete"

  },

  gu:{

    dashboard:"ડેશબોર્ડ",

    upload:"📸 વાહનનો ફોટો અપલોડ કરો",

    total:"કુલ વાહનો",

    soon:"ટૂંક સમયમાં સમાપ્ત",

    expired:"સમાપ્ત થયેલ વાહનો",

    search:"🔍 વાહન નંબર શોધો...",

    empty:"હજુ સુધી કોઈ વાહન ઉમેરાયેલ નથી.",

    page:"પેજ",

    delete:"🗑️ ડિલીટ"

  }

};


/* =========================================
   CHANGE LANGUAGE
========================================= */

function setLanguage(lang){

  currentLanguage = lang;

  document.getElementById("pageTitle").innerText =
    text[lang].dashboard;

  document.getElementById("uploadText").innerText =
    text[lang].upload;

  document.getElementById("totalTitle").innerText =
    text[lang].total;

  document.getElementById("soonTitle").innerText =
    text[lang].soon;

  document.getElementById("expiredTitle").innerText =
    text[lang].expired;

  document.getElementById("searchInput").placeholder =
    text[lang].search;

  renderTable();

}


/* =========================================
   LOAD VEHICLES
========================================= */

async function loadVehicles(){

  const {
    data,
    error
  } = await supabaseClient

    .from("vehicles")

    .select("*")

    .order("id", {
      ascending:false
    });


  if(error){

    console.error(
      "Database error:",
      error
    );

    alert(
      "Database connection error.\n\n" +
      error.message
    );

    return;

  }


  allVehicles = data || [];

  filteredVehicles = [
    ...allVehicles
  ];

  updateCounts();

  renderTable();

}


/* =========================================
   UPDATE COUNTS
========================================= */

function updateCounts(){

  const today = new Date();

  today.setHours(
    0,0,0,0
  );


  let soon = 0;

  let expired = 0;


  allVehicles.forEach(
    v => {

      const dates = [

        v.fitness_expiry,

        v.insurance_expiry,

        v.pucc_expiry,

        v.permit_expiry

      ];


      dates.forEach(
        d => {

          if(!d) return;


          const date =
            new Date(d);

          date.setHours(
            0,0,0,0
          );


          const diff =
            Math.ceil(
              (date - today) /
              (1000*60*60*24)
            );


          if(diff < 0){

            expired++;

          }

          else if(diff <= 10){

            soon++;

          }

        }
      );

    }
  );


  document.getElementById(
    "totalVehicles"
  ).innerText =
    allVehicles.length +
    " / 1000";


  document.getElementById(
    "expiringSoon"
  ).innerText =
    soon;


  document.getElementById(
    "expiredVehicles"
  ).innerText =
    expired;

}


/* =========================================
   FORMAT DATE
========================================= */

function formatDate(value){

  if(!value) return "-";

  const date = new Date(value);

  if(isNaN(date.getTime())){

    return value;

  }

  return date.toLocaleDateString(
    "en-GB",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  ).replace(/ /g,"-");

}


/* =========================================
   RENDER VEHICLE LIST
========================================= */

function renderTable(){

  const container =
    document.getElementById(
      "vehicleTable"
    );


  const start =
    (currentPage - 1) *
    perPage;


  const pageData =
    filteredVehicles.slice(
      start,
      start + perPage
    );


  container.innerHTML = "";


  if(pageData.length === 0){

    container.innerHTML = `

      <div class="empty">

        ${text[currentLanguage].empty}

      </div>

    `;

  }


  pageData.forEach(
    v => {

      const vehicleNumber =
        v.vehicle_number || "-";


      const photoPath =
        v.photo_path || "";


      const photoUrl =
        v.photo_url || "";


      const photoHtml =
        photoUrl
        ?

        `<img
          src="${photoUrl}"
          class="vehicle-photo"
          alt="Vehicle Photo">`

        :

        `<div
          class="vehicle-photo"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:45px;
          ">

          🚗

        </div>`;


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "vehicle-card";


      card.innerHTML = `

        <div class="vehicle-number">

          ${photoHtml}

          <div class="vehicle-number-text">

            ${vehicleNumber}

          </div>

        </div>


        <div class="vehicle-details">

          <div class="detail-row">

            <span class="detail-label">
              Registration Date
            </span>

            <span class="detail-value">
              ${formatDate(v.registration_date)}
            </span>

          </div>


          <div class="detail-row">

            <span class="detail-label">
              Fitness Valid UpTo
            </span>

            <span class="detail-value">
              ${formatDate(v.fitness_expiry)}
            </span>

          </div>


          <div class="detail-row">

            <span class="detail-label">
              Tax Valid UpTo
            </span>

            <span class="detail-value">
              ${v.tax_expiry || "-"}
            </span>

          </div>

        </div>


        <div class="vehicle-details">

          <div class="detail-row">

            <span class="detail-label">
              Insurance Valid UpTo
            </span>

            <span class="detail-value">
              ${formatDate(v.insurance_expiry)}
            </span>

          </div>


          <div class="detail-row">

            <span class="detail-label">
              PUCC Valid UpTo
            </span>

            <span class="detail-value">
              ${formatDate(v.pucc_expiry)}
            </span>

          </div>


          <div class="detail-row">

            <span class="detail-label">
              Permit Valid UpTo
            </span>

            <span class="detail-value">
              ${formatDate(v.permit_expiry)}
            </span>

          </div>

        </div>


        <div class="action-area">

          <button
            class="action-btn delete"
            onclick="permanentDelete(
              '${String(v.id).replace(/'/g,"\\'")}',
              '${String(vehicleNumber).replace(/'/g,"\\'")}',
              '${String(photoPath).replace(/'/g,"\\'")}'
            )">

            ${text[currentLanguage].delete}

          </button>

        </div>

      `;


      container.appendChild(card);

    }
  );


  document.getElementById(
    "pageNumber"
  ).innerText =
    text[currentLanguage].page +
    " " +
    currentPage;

}


/* =========================================
   SEARCH VEHICLE
========================================= */

function searchVehicle(){

  const value =
    document.getElementById(
      "searchInput"
    ).value
    .toUpperCase()
    .trim();


  filteredVehicles =
    allVehicles.filter(
      v =>
        (v.vehicle_number || "")
        .toUpperCase()
        .includes(value)
    );


  currentPage = 1;

  renderTable();

}


/* =========================================
   PERMANENT DELETE
========================================= */

async function permanentDelete(
  id,
  vehicleNumber,
  photoPath
){

  const ok = confirm(

    "Permanently delete " +
    vehicleNumber +
    "?\n\n" +

    "Vehicle record and its photo " +
    "will be permanently deleted."

  );


  if(!ok) return;


  try{

    if(photoPath){

      const {
        error: photoError
      } =
        await supabaseClient

          .storage

          .from(
            "vehicle-photos"
          )

          .remove([
            photoPath
          ]);


      if(photoError){

        console.error(
          "Photo delete error:",
          photoError
        );

      }

    }


    const {
      error: dbError
    } =
      await supabaseClient

        .from("vehicles")

        .delete()

        .eq("id", id);


    if(dbError){

      throw dbError;

    }


    alert(
      "Vehicle and photo deleted permanently."
    );


    await loadVehicles();

  }


  catch(error){

    console.error(
      "Delete error:",
      error
    );


    alert(
      "Delete failed: " +
      (
        error.message ||
        "Unknown error"
      )
    );

  }

}


/* =========================================
   PREVIOUS PAGE
========================================= */

function previousPage(){

  if(currentPage > 1){

    currentPage--;

    renderTable();

  }

}


/* =========================================
   NEXT PAGE
========================================= */

function nextPage(){

  if(
    currentPage * perPage
    <
    filteredVehicles.length
  ){

    currentPage++;

    renderTable();

  }

}


/* =========================================
   GO TO UPLOAD PAGE
========================================= */

function goToUpload(){

  window.location.href =
    "upload.html";

}


/* =========================================
   START DASHBOARD
========================================= */

loadVehicles();

</script>
