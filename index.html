<!DOCTYPE html>  
<html lang="gu">  
  
<head>  
  
<meta charset="UTF-8">  
  
<meta  
  name="viewport"  
  content="width=device-width, initial-scale=1.0"  
>  
  
<title>RV Vehicle Reminder</title>  
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
  
<style>  
  
/* =========================================  
   GLOBAL  
========================================= */  
  
*{  
  box-sizing:border-box;  
}  
  
body{  
  margin:0;  
  font-family:Arial, Helvetica, sans-serif;  
  background:#f4f7fb;  
  color:#222;  
}  
  
body::before{  
  content:"";  
  position:fixed;  
  inset:0;  
  
  background-image:  
    linear-gradient(  
      rgba(255,255,255,.84),  
      rgba(255,255,255,.84)  
    ),  
    url("https://raw.githubusercontent.com/rathwavikesh52-lang/RV-Vehicle-Reminder-/main/assets/background.png");  
  
  background-size:cover;  
  background-position:center;  
  background-attachment:fixed;  
  
  z-index:-1;  
}  
  
  
/* =========================================  
   HEADER  
========================================= */  
  
.header{  
  background:#ffffff;  
  padding:12px 15px;  
  text-align:center;  
  border-bottom:1px solid #ddd;  
  box-shadow:0 2px 8px rgba(0,0,0,.08);  
}  
  
.app-logo{  
  width:70px;  
  height:70px;  
  object-fit:contain;  
  display:block;  
  margin:0 auto 5px;  
}  
  
.header h1{  
  margin:2px 0;  
  font-size:24px;  
  font-weight:800;  
}  
  
.header p{  
  margin:3px 0 10px;  
  color:#666;  
  font-size:14px;  
}  
  
.language-buttons{  
  display:flex;  
  justify-content:center;  
  gap:8px;  
}  
  
.language-buttons button{  
  border:1px solid #ccc;  
  background:white;  
  padding:7px 16px;  
  border-radius:7px;  
  cursor:pointer;  
  font-weight:600;  
}  
  
.language-buttons button.active{  
  background:#1976d2;  
  color:white;  
  border-color:#1976d2;  
}  
  
  
/* =========================================  
   MAIN  
========================================= */  
  
.container{  
  width:100%;  
  max-width:1400px;  
  margin:auto;  
  padding:15px;  
}  
  
  
/* =========================================  
   TOP  
========================================= */  
  
.top-row{  
  display:flex;  
  justify-content:space-between;  
  align-items:center;  
  gap:12px;  
  margin-bottom:15px;  
}  
  
.add-btn{  
  background:#1976d2;  
  color:white;  
  border:none;  
  padding:11px 18px;  
  border-radius:8px;  
  font-size:15px;  
  font-weight:bold;  
  cursor:pointer;  
}  
  
.add-btn:hover{  
  background:#125ca5;  
}  
  
  
/* =========================================  
   MAIN STATS  
========================================= */  
  
.stats{  
  display:grid;  
  grid-template-columns:repeat(3,1fr);  
  gap:12px;  
  margin-bottom:15px;  
}  
  
.stat-card{  
  background:white;  
  border-radius:10px;  
  padding:14px;  
  text-align:center;  
  box-shadow:0 2px 8px rgba(0,0,0,.08);  
  border:1px solid #e5e5e5;  
}  
  
.stat-title{  
  font-size:13px;  
  color:#666;  
  margin-bottom:5px;  
}  
  
.stat-value{  
  font-size:25px;  
  font-weight:bold;  
}  
  
  
/* =========================================  
   TODAY EXPIRY - 5 BOXES  
========================================= */  
  
.document-expiry-stats{  
  display:grid;  
  grid-template-columns:repeat(5,1fr);  
  gap:10px;  
  margin-bottom:15px;  
}  
  
.document-stat-box{  
  background:white;  
  border:1px solid #ddd;  
  border-radius:10px;  
  padding:12px 6px;  
  text-align:center;  
  box-shadow:0 2px 8px rgba(0,0,0,.07);  
}  
  
.document-stat-title{  
  font-size:13px;  
  font-weight:bold;  
  color:#555;  
  margin-bottom:5px;  
}  
  
.document-stat-value{  
  font-size:24px;  
  font-weight:800;  
}  
  
  
/* =========================================  
   TODAY EXPIRY VEHICLES  
========================================= */  
  
.today-expiry-box{  
  background:white;  
  border:1px solid #ddd;  
  border-radius:10px;  
  box-shadow:0 2px 8px rgba(0,0,0,.08);  
  margin-bottom:18px;  
  overflow:hidden;  
}  
  
.today-expiry-header{  
  background:#1976d2;  
  color:white;  
  padding:10px 12px;  
  font-size:15px;  
  font-weight:800;  
}  
  
.today-expiry-scroll{  
  max-height:48px;  
  overflow-y:auto;  
  overflow-x:hidden;  
}  
  
.today-expiry-row{  
  min-height:48px;  
  
  display:grid;  
  
  grid-template-columns:  
    1.25fr  
    1fr  
    1fr  
    1fr  
    1fr  
    1fr;  
  
  align-items:center;  
  
  gap:6px;  
  
  padding:8px 10px;  
  
  border-bottom:1px solid #eee;  
  
  font-size:12px;  
  font-weight:600;  
}  
  
.today-expiry-row:last-child{  
  border-bottom:none;  
}  
  
.today-vehicle-number{  
  font-size:13px;  
  font-weight:800;  
}  
  
.today-expiry-item{  
  white-space:nowrap;  
  overflow:hidden;  
  text-overflow:ellipsis;  
}  
  
.today-empty{  
  min-height:48px;  
  
  display:flex;  
  justify-content:center;  
  align-items:center;  
  
  color:#888;  
  font-size:13px;  
}  
  
  
/* =========================================  
   SEARCH  
========================================= */  
  
.search-box{  
  width:100%;  
  margin-bottom:18px;  
}  
  
.search-box input{  
  width:100%;  
  padding:13px 15px;  
  border:1px solid #ccc;  
  border-radius:8px;  
  font-size:15px;  
  outline:none;  
  background:white;  
}  
  
.search-box input:focus{  
  border-color:#1976d2;  
}  
  
  
/* =========================================  
   TITLE  
========================================= */  
  
.list-title{  
  font-size:20px;  
  font-weight:bold;  
  margin:5px 0 12px;  
}  
  
  
/* =========================================  
   VEHICLE LIST  
========================================= */  
  
.vehicle-list{  
  display:flex;  
  flex-direction:column;  
  gap:12px;  
}  
  
  
/* =========================================  
   VEHICLE CARD  
========================================= */  
  
.vehicle-card{  
  display:grid;  
  
  grid-template-columns:  
    120px  
    1.15fr  
    1fr  
    1fr  
    82px;  
  
  gap:12px;  
  
  background:white;  
  
  border:1px solid #ddd;  
  border-radius:12px;  
  
  padding:12px;  
  
  box-shadow:0 2px 8px rgba(0,0,0,.07);  
  
  align-items:stretch;  
}  
  
  
/* =========================================  
   CARD HIGHLIGHT DISABLED  
   ONLY DATE WILL CHANGE COLOR  
========================================= */  
  
.vehicle-card.expired-highlight,  
.vehicle-card.near-highlight,  
.vehicle-card.soon-highlight{  
  background:white;  
  border-color:#ddd;  
  box-shadow:0 2px 8px rgba(0,0,0,.07);  
}  
  
  
/* =========================================  
   EXPIRY DATE COLOUR  
========================================= */  
  
.expiry-date{  
  font-weight:800;  
}  
  
/* Expired */  
  
.expiry-date.expired{  
  color:#dc3545;  
}  
  
/* 0-5 days */  
  
.expiry-date.near{  
  color:#f57c00;  
}  
  
/* 6 days to document-specific limit */  
  
.expiry-date.soon{  
  color:#c49a00;  
}  
  
  
/* =========================================  
   PHOTO  
========================================= */  
  
.photo-column{  
  display:flex;  
  justify-content:center;  
  align-items:center;  
  min-width:0;  
}  
  
.vehicle-photo{  
  width:120px;  
  height:120px;  
  
  border:1px solid #ddd;  
  border-radius:10px;  
  
  background:#fafafa;  
  
  display:flex;  
  justify-content:center;  
  align-items:center;  
  
  overflow:hidden;  
}  
  
.vehicle-photo img{  
  width:100%;  
  height:100%;  
  object-fit:contain;  
  display:block;  
}  
  
.no-photo{  
  font-size:11px;  
  color:#999;  
  text-align:center;  
}  
  
  
/* =========================================  
   COLUMNS  
========================================= */  
  
.info-column,  
.doc-column{  
  min-width:0;  
  padding:2px;  
}  
  
.info-item,  
.doc-item{  
  margin-bottom:9px;  
}  
  
.info-item:last-child,  
.doc-item:last-child{  
  margin-bottom:0;  
}  
  
.label{  
  font-size:11px;  
  color:#777;  
  font-weight:bold;  
  text-transform:none;  
  margin-bottom:2px;  
}  
  
.value{  
  font-size:14px;  
  font-weight:600;  
  word-break:break-word;  
}  
  
.vehicle-number{  
  font-size:16px;  
  font-weight:800;  
}  
  
  
/* =========================================  
   ACTIONS  
========================================= */  
  
.action-column{  
  display:flex;  
  flex-direction:column;  
  justify-content:center;  
  gap:7px;  
}  
  
.action-column button{  
  width:100%;  
  border:none;  
  border-radius:6px;  
  padding:8px 5px;  
  cursor:pointer;  
  font-size:12px;  
  font-weight:bold;  
}  
  
.edit-btn{  
  background:#1976d2;  
  color:white;  
}  
  
.whatsapp-btn{  
  background:#25D366;  
  color:white;  
}  
  
.delete-btn{  
  background:#dc3545;  
  color:white;  
}  
  
.action-column button:hover{  
  opacity:.88;  
}  
  
  
/* =========================================  
   MESSAGE  
========================================= */  
  
.message{  
  background:white;  
  border:1px solid #ddd;  
  border-radius:10px;  
  padding:25px;  
  text-align:center;  
  color:#777;  
}  
  
  
/* =========================================  
   PAGINATION  
========================================= */  
  
.pagination{  
  display:flex;  
  justify-content:center;  
  align-items:center;  
  gap:10px;  
  margin:20px 0;  
}  
  
.pagination button{  
  border:1px solid #ccc;  
  background:white;  
  padding:8px 14px;  
  border-radius:7px;  
  cursor:pointer;  
  font-weight:bold;  
}  
  
.pagination button:disabled{  
  opacity:.45;  
  cursor:not-allowed;  
}  
  
#pageInfo{  
  font-size:14px;  
  font-weight:bold;  
}  
  
  
/* =========================================  
   TABLET  
========================================= */  
  
@media(max-width:1000px){  
  
  .vehicle-card{  
    grid-template-columns:  
      100px  
      1.15fr  
      1fr  
      1fr  
      72px;  
  }  
  
  .vehicle-photo{  
    width:100px;  
    height:100px;  
  }  
  
}  
  
  
/* =========================================  
   MOBILE  
========================================= */  
  
@media(max-width:700px){  
  
  .container{  
    padding:10px;  
  }  
  
  .header h1{  
    font-size:20px;  
  }  
  
  .app-logo{  
    width:60px;  
    height:60px;  
  }  
  
  .top-row{  
    flex-direction:column;  
    align-items:stretch;  
  }  
  
  .add-btn{  
    width:100%;  
  }  
  
  .stats{  
    gap:7px;  
  }  
  
  .stat-card{  
    padding:10px 5px;  
  }  
  
  .stat-title{  
    font-size:11px;  
  }  
  
  .stat-value{  
    font-size:20px;  
  }  
  
  .document-expiry-stats{  
    grid-template-columns:repeat(5,1fr);  
    gap:5px;  
  }  
  
  .document-stat-box{  
    padding:9px 2px;  
  }  
  
  .document-stat-title{  
    font-size:10px;  
  }  
  
  .document-stat-value{  
    font-size:18px;  
  }  
  
  .today-expiry-header{  
    font-size:13px;  
    padding:9px 10px;  
  }  
  
  .today-expiry-row{  
    grid-template-columns:  
      1.25fr  
      1fr  
      1fr  
      1fr  
      1fr  
      1fr;  
  
    gap:4px;  
    padding:8px 6px;  
    font-size:9px;  
  }  
  
  .today-vehicle-number{  
    font-size:10px;  
  }  
  
  .vehicle-card{  
    grid-template-columns:  
      82px  
      1.05fr  
      .9fr  
      .9fr  
      65px;  
  
    gap:7px;  
    padding:8px;  
  }  
  
  .vehicle-photo{  
    width:82px;  
    height:100px;  
  }  
  
  .vehicle-number{  
    font-size:13px;  
  }  
  
  .value{  
    font-size:11px;  
  }  
  
  .label{  
    font-size:9px;  
  }  
  
  .info-item,  
  .doc-item{  
    margin-bottom:7px;  
  }  
  
  .action-column button{  
    font-size:9px;  
    padding:7px 2px;  
  }  
  
}  
  
  
/* =========================================  
   SMALL MOBILE  
========================================= */  
  
@media(max-width:430px){  
  
  .vehicle-card{  
    grid-template-columns:  
      70px  
      1fr  
      .82fr  
      .82fr  
      58px;  
  
    gap:5px;  
    padding:6px;  
  }  
  
  .vehicle-photo{  
    width:70px;  
    height:92px;  
  }  
  
  .vehicle-number{  
    font-size:11px;  
  }  
  
  .value{  
    font-size:10px;  
  }  
  
  .label{  
    font-size:8px;  
  }  
  
  .action-column button{  
    font-size:8px;  
    padding:6px 1px;  
  }  
  
  .list-title{  
    font-size:18px;  
  }  
  
  .document-expiry-stats{  
    grid-template-columns:repeat(5,1fr);  
    gap:3px;  
  }  
  
  .document-stat-box{  
    padding:8px 1px;  
  }  
  
  .document-stat-title{  
    font-size:8px;  
  }  
  
  .document-stat-value{  
    font-size:16px;  
  }  
  
  .today-expiry-row{  
    min-height:46px;  
  
    grid-template-columns:  
      1.25fr  
      1fr  
      1fr  
      1fr  
      1fr  
      1fr;  
  
    gap:2px;  
    padding:7px 3px;  
    font-size:7px;  
  }  
  
  .today-vehicle-number{  
    font-size:8px;  
  }  
  
}  
  
  
/* =========================================  
   VERY SMALL PHONE  
========================================= */  
  
@media(max-width:360px){  
  
  .today-expiry-row{  
    font-size:6px;  
  }  
  
  .today-vehicle-number{  
    font-size:7px;  
  }  
  
}  
  
</style>  
  
</head>  
  
  
<body>  
  
  
<!-- =========================================  
     HEADER  
========================================= -->  
  
<header class="header">  
  
  <img  
    src="https://raw.githubusercontent.com/rathwavikesh52-lang/RV-Vehicle-Reminder-/main/assets/logo.png"  
    class="app-logo"  
    alt="RV Vehicle Reminder Logo"  
    onerror="this.style.display='none'"  
  >  
  
  <h1>RV VEHICLE REMINDER</h1>  
  
  <p>Vehicle Document Reminder System</p>  
  
  <div class="language-buttons">  
  
    <button  
      id="englishBtn"  
      class="active"  
      onclick="setLanguage('en')"  
    >  
      English  
    </button>  
  
    <button  
      id="gujaratiBtn"  
      onclick="setLanguage('gu')"  
    >  
      ગુજરાતી  
    </button>  
  
  </div>  
  
</header>  
  
  
<main class="container">  
  
  
<!-- ADD VEHICLE -->  
  
<div class="top-row">  
  
  <button  
    class="add-btn"  
    id="addVehicleBtn"  
    onclick="addVehicle()"  
  >  
    ＋ Add Vehicle  
  </button>  
  
</div>  
  
  
<!-- MAIN STATS -->  
  
<div class="stats">  
  
  <div class="stat-card">  
  
    <div  
      class="stat-title"  
      id="totalTitle"  
    >  
      Total Vehicles  
    </div>  
  
    <div  
      class="stat-value"  
      id="totalVehicles"  
    >  
      0  
    </div>  
  
  </div>  
  
  
  <div class="stat-card">  
  
    <div  
      class="stat-title"  
      id="expiringTitle"  
    >  
      Expiring Soon  
    </div>  
  
    <div  
      class="stat-value"  
      id="expiringVehicles"  
    >  
      0  
    </div>  
  
  </div>  
  
  
  <div class="stat-card">  
  
    <div  
      class="stat-title"  
      id="expiredTitle"  
    >  
      Expired  
    </div>  
  
    <div  
      class="stat-value"  
      id="expiredVehicles"  
    >  
      0  
    </div>  
  
  </div>  
  
</div>  
  
  
<!-- TODAY EXPIRY - 5 BOXES -->  
  
<div class="document-expiry-stats">  
  
  <div class="document-stat-box">  
  
    <div class="document-stat-title">  
      Fitness  
    </div>  
  
    <div  
      class="document-stat-value"  
      id="fitnessCount"  
    >  
      0  
    </div>  
  
  </div>  
  
  
  <div class="document-stat-box">  
  
    <div class="document-stat-title">  
      Insurance  
    </div>  
  
    <div  
      class="document-stat-value"  
      id="insuranceCount"  
    >  
      0  
    </div>  
  
  </div>  
  
  
  <div class="document-stat-box">  
  
    <div class="document-stat-title">  
      PUC  
    </div>  
  
    <div  
      class="document-stat-value"  
      id="pucCount"  
    >  
      0  
    </div>  
  
  </div>  
  
  
  <div class="document-stat-box">  
  
    <div class="document-stat-title">  
      Tax  
    </div>  
  
    <div  
      class="document-stat-value"  
      id="taxCount"  
    >  
      0  
    </div>  
  
  </div>  
  
  
  <div class="document-stat-box">  
  
    <div class="document-stat-title">  
      Permit  
    </div>  
  
    <div  
      class="document-stat-value"  
      id="permitCount"  
    >  
      0  
    </div>  
  
  </div>  
  
</div>  
  
  
<!-- TODAY EXPIRY VEHICLES -->  
  
<div class="today-expiry-box">  
  
  <div  
    class="today-expiry-header"  
    id="todayExpiryTitle"  
  >  
    Today's Expiry Vehicles  
  </div>  
  
  <div  
    class="today-expiry-scroll"  
    id="todayExpiryList"  
  ></div>  
  
</div>  
  
  
<!-- SEARCH -->  
  
<div class="search-box">  
  
  <input  
    type="text"  
    id="searchInput"  
    placeholder="Search vehicle number, customer, mobile or class..."  
    oninput="handleSearch()"  
  >  
  
</div>  
  
  
<!-- VEHICLE LIST TITLE -->  
  
<div  
  class="list-title"  
  id="vehicleListTitle"  
>  
  Vehicle List  
</div>  
  
  
<!-- VEHICLE LIST -->  
  
<div  
  id="vehicleList"  
  class="vehicle-list"  
></div>  
  
  
<!-- LOADING -->  
  
<div  
  id="loadingMessage"  
  class="message"  
  style="display:none;"  
>  
  Loading vehicles...  
</div>  
  
  
<!-- EMPTY -->  
  
<div  
  id="emptyMessage"  
  class="message"  
  style="display:none;"  
>  
  No vehicles found.  
</div>  
  
  
<!-- PAGINATION -->  
  
<div  
  class="pagination"  
  id="pagination"  
  style="display:none;"  
>  
  
  <button  
    id="previousBtn"  
    onclick="previousPage()"  
  >  
    Previous  
  </button>  
  
  <span id="pageInfo">  
    Page 1 / 1  
  </span>  
  
  <button  
    id="nextBtn"  
    onclick="nextPage()"  
  >  
    Next  
  </button>  
  
</div>  
  
</main>  
  
  
<script>  
  
/* =========================================  
   SUPABASE  
========================================= */  
  
const SUPABASE_URL =  
  "https://lqbhafspabtlqeubqxjg.supabase.co";  
  
const SUPABASE_KEY =  
  "sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";  
  
const supabaseClient =  
  supabase.createClient(  
    SUPABASE_URL,  
    SUPABASE_KEY  
  );  
  
  
/* =========================================  
   ASSETS  
========================================= */  
  
const ASSET_BASE =  
  "https://raw.githubusercontent.com/rathwavikesh52-lang/RV-Vehicle-Reminder-/main/assets/";

/* =========================================  
   DATE PARSER  
========================================= */  
  
function parseDate(value){  
  
  if(!value){  
    return null;  
  }  
  
  const str =  
    String(value).trim();  
  
  if(!str){  
    return null;  
  }  
  
  if(  
    str.toUpperCase() === "LTT"  
  ){  
    return null;  
  }  
  
  
  /* DD/MM/YYYY */  
  
  let match =  
    str.match(  
      /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/  
    );  
  
  if(match){  
  
    const date =  
      new Date(  
        Number(match[3]),  
        Number(match[2])-1,  
        Number(match[1])  
      );  
  
    date.setHours(0,0,0,0);  
  
    return date;  
  
  }  
  
  
  /* YYYY-MM-DD */  
  
  match =  
    str.match(  
      /^(\d{4})-(\d{1,2})-(\d{1,2})/  
    );  
  
  if(match){  
  
    const date =  
      new Date(  
        Number(match[1]),  
        Number(match[2])-1,  
        Number(match[3])  
      );  
  
    date.setHours(0,0,0,0);  
  
    return date;  
  
  }  
  
  
  const date =  
    new Date(str);  
  
  if(  
    !isNaN(  
      date.getTime()  
    )  
  ){  
  
    date.setHours(0,0,0,0);  
  
    return date;  
  
  }  
  
  return null;  
  
}  
  
  
/* =========================================  
   DISPLAY DATE  
========================================= */  
  
function displayDate(value){  
  
  if(!value){  
    return "";  
  }  
  
  const str =  
    String(value).trim();  
  
  if(  
    str.toUpperCase() === "LTT"  
  ){  
    return "LTT";  
  }  
  
  const date =  
    parseDate(str);  
  
  if(!date){  
    return str;  
  }  
  
  const day =  
    String(  
      date.getDate()  
    ).padStart(2,"0");  
  
  const month =  
    String(  
      date.getMonth()+1  
    ).padStart(2,"0");  
  
  const year =  
    date.getFullYear();  
  
  return (  
    day +  
    "/" +  
    month +  
    "/" +  
    year  
  );  
  
}  
  
  
/* =========================================  
   DAYS UNTIL  
========================================= */  
  
function daysUntil(value){  
  
  const date =  
    parseDate(value);  
  
  if(!date){  
    return null;  
  }  
  
  const today =  
    new Date();  
  
  today.setHours(0,0,0,0);  
  
  const difference =  
    date.getTime() -  
    today.getTime();  
  
  return Math.ceil(  
    difference /  
    (1000 * 60 * 60 * 24)  
  );  
  
}  
  
  
/* =========================================  
   DOCUMENT-SPECIFIC HIGHLIGHT DAYS  
========================================= */  
  
const expiryHighlightDays = {  
  
  fitness_expiry:60,  
  
  insurance_expiry:30,  
  
  pucc_expiry:15,  
  
  tax_expiry:15,  
  
  permit_expiry:30  
  
};  
  
  
/* =========================================  
   DATE COLOUR CLASS  
========================================= */  
  
function getExpiryDateClass(  
  value,  
  field  
){  
  
  const days =  
    daysUntil(value);  
  
  if(days === null){  
  
    return "";  
  
  }  
  
  
  /* =====================================  
     EXPIRED  
  ===================================== */  
  
  if(days < 0){  
  
    return "expired";  
  
  }  
  
  
  /* =====================================  
     DOCUMENT-SPECIFIC LIMIT  
  ===================================== */  
  
  const highlightDays =  
    expiryHighlightDays[field];  
  
  
  if(  
    highlightDays !== undefined &&  
    days <= highlightDays  
  ){  
  
    /*  
      0-5 days = orange  
      6+ days within limit = yellow  
    */  
  
    if(days <= 5){  
  
      return "near";  
  
    }  
  
    return "soon";  
  
  }  
  
  
  return "";  
  
}  
  
  
/* =========================================  
   EXPIRING SOON  
   USES SAME HIGHLIGHT LIMITS  
========================================= */  
  
function isExpiring(vehicle){  
  
  for(  
    const field in expiryHighlightDays  
  ){  
  
    const days =  
      daysUntil(  
        vehicle[field]  
      );  
  
    const limit =  
      expiryHighlightDays[field];  
  
    if(  
      days !== null &&  
      days >= 0 &&  
      days <= limit  
    ){  
  
      return true;  
  
    }  
  
  }  
  
  return false;  
  
}  
  
  
/* =========================================  
   EXPIRED  
========================================= */  
  
function isExpired(vehicle){  
  
  for(  
    const field in expiryHighlightDays  
  ){  
  
    const days =  
      daysUntil(  
        vehicle[field]  
      );  
  
    if(  
      days !== null &&  
      days < 0  
    ){  
  
      return true;  
  
    }  
  
  }  
  
  return false;  
  
}

          daysUntil(  
            vehicle.fitness_expiry  
          ) === 0

                vehicle.fitness_expiry

          daysUntil(  
            vehicle.insurance_expiry

          daysUntil(  
            vehicle.pucc_expiry  
          ) === 0

                vehicle.pucc_expiry  
              )  
            : "—";  
  
  
        const tax =  
          daysUntil(  
            vehicle.tax_expiry  
          ) === 0  
            ? displayDate(  
                vehicle.tax_expiry  
              )  
            : "—";  
  
  
        const permit =  
          daysUntil(  
            vehicle.permit_expiry  
          ) === 0  
            ? displayDate(  
                vehicle.permit_expiry  
              )  
            : "—";  
  
  
        return `

async function loadVehicles(){  
  
  showLoading(true);  
  
  try{  
  
    const {  
      data,  
      error  
    } =  
      await supabaseClient  
        .from("vehicles")  
        .select("*")  
        .order(  
          "created_at",  
          {  
            ascending:false  
          }  
        );  
  
  
    if(error){  
  
      console.error(  
        "Supabase Error:",  
        error  
      );  
  
      throw error;  
  
    }  
  
  
    allVehicles =  
      data || [];  
  
    filteredVehicles =  
      [...allVehicles];  
  
  
    updateStats();  
  
    updateDocumentExpiryStats();  
  
    renderTodayExpiryVehicles();  
  
    currentPage = 1;  
  
    renderVehicles();  
  
  
  }catch(error){  
  
    console.error(error);  
  
    document  
      .getElementById("vehicleList")  
      .innerHTML =  
  
        `  
          <div class="message">  
  
            Error loading vehicles.  
  
            <br>  
  
            ${escapeHtml(  
              error.message || ""  
            )}  
  
          </div>  
        `;  
  
  }finally{  
  
    showLoading(false);  
  
  }  
  
}

function handleSearch(){  
  
  const query =  
    document  
      .getElementById(  
        "searchInput"  
      )  
      .value  
      .trim()  
      .toLowerCase();  
  
  
  if(!query){  
  
    filteredVehicles =  
      [...allVehicles];  
  
  }else{  
  
    filteredVehicles =  
  
      allVehicles.filter(  
  
        vehicle => {  
  
          const text = [  
  
            vehicle.vehicle_number,  
  
            vehicle.customer_name,  
  
            vehicle.customer_mobile,  
  
            vehicle.mobile,  
  
            vehicle.vehicle_class  
  
          ]  
  
            .filter(Boolean)  
  
            .join(" ")  
  
            .toLowerCase();  
  
  
          return text.includes(  
            query  
          );  
  
        }  
  
      );  
  
  }  
  
  
  currentPage = 1;  
  
  renderVehicles();  
  
}

      </div>

/* =========================================  
   RENDER VEHICLES  
========================================= */  
  
function renderVehicles(){  
  
  const list =  
    document.getElementById(  
      "vehicleList"  
    );  
  
  
  const empty =  
    document.getElementById(  
      "emptyMessage"  
    );  
  
  
  const pagination =  
    document.getElementById(  
      "pagination"  
    );  
  
  
  list.innerHTML = "";  
  
  
  if(!filteredVehicles.length){  
  
    empty.style.display =  
      "block";  
  
    pagination.style.display =  
      "none";  
  
    return;  
  
  }  
  
  
  empty.style.display =  
    "none";  
  
  
  const totalPages =  
    Math.ceil(  
      filteredVehicles.length /  
      vehiclesPerPage  
    );  
  
  
  if(  
    currentPage > totalPages  
  ){  
  
    currentPage =  
      totalPages;  
  
  }  
  
  
  const start =  
    (currentPage - 1) *  
    vehiclesPerPage;  
  
  
  const end =  
    start +  
    vehiclesPerPage;  
  
  
  const pageVehicles =  
    filteredVehicles.slice(  
      start,  
      end  
    );  
  
  
  pageVehicles.forEach(  
  
    vehicle => {  
  
      list.insertAdjacentHTML(  
  
        "beforeend",  
  
        vehicleCard(vehicle)  
  
      );  
  
    }  
  
  );  
  
  
  pagination.style.display =  
  
    totalPages > 1  
      ? "flex"  
      : "none";  
  
  
  document  
    .getElementById(  
      "pageInfo"  
    )  
    .textContent =  
  
      translations[  
        currentLanguage  
      ].page +  
  
      " " +  
  
      currentPage +  
  
      " / " +  
  
      totalPages;  
  
  
  document  
    .getElementById(  
      "previousBtn"  
    )  
    .disabled =  
  
      currentPage <= 1;  
  
  
  document  
    .getElementById(  
      "nextBtn"  
    )  
    .disabled =  
  
      currentPage >= totalPages;  
  
}  
  
  
/* =========================================  
   PAGINATION  
========================================= */  
  
function previousPage(){  
  
  if(currentPage > 1){  
  
    currentPage--;  
  
    renderVehicles();  
  
    window.scrollTo({  
      top:0,  
      behavior:"smooth"  
    });  
  
  }  
  
}  
  
  
function nextPage(){  
  
  const totalPages =  
    Math.ceil(  
      filteredVehicles.length /  
      vehiclesPerPage  
    );  
  
  
  if(  
    currentPage < totalPages  
  ){  
  
    currentPage++;  
  
    renderVehicles();  
  
    window.scrollTo({  
      top:0,  
      behavior:"smooth"  
    });  
  
  }  
  
}

/* =========================================  
   WHATSAPP  
   SEND ALL HIGHLIGHTED DOCUMENTS  
========================================= */  
  
function sendWhatsApp(id){  
  
  const vehicle =  
    allVehicles.find(  
  
      item =>  
        String(item.id) ===  
        String(id)  
  
    );  
  
  
  if(!vehicle){  
  
    alert(  
  
      currentLanguage === "gu"  
  
        ? "વાહન મળ્યું નથી."  
  
        : "Vehicle not found."  
  
    );  
  
    return;  
  
  }  
  
  
  /* =====================================  
     CUSTOMER MOBILE  
  ===================================== */  
  
  let mobile =  
    vehicle.customer_mobile ||  
    vehicle.mobile ||  
    "";  
  
  
  mobile =  
    String(mobile)  
      .replace(/\D/g,"");  
  
  
  if(  
    mobile.length === 10  
  ){  
  
    mobile =  
      "91" +  
      mobile;  
  
  }  
  
  
  if(!mobile){  
  
    alert(  
  
      currentLanguage === "gu"  
  
        ? "ગ્રાહકનો મોબાઇલ નંબર મળ્યો નથી."  
  
        : "Customer mobile number not found."  
  
    );  
  
    return;  
  
  }  
  
  
  /* =====================================  
     DOCUMENTS  
  ===================================== */  
  
  const documents = [  
  
    {  
      nameEn:"Fitness",  
      nameGu:"Fitness",  
      field:"fitness_expiry"  
    },  
  
    {  
      nameEn:"Insurance",  
      nameGu:"Insurance",  
      field:"insurance_expiry"  
    },  
  
    {  
      nameEn:"PUC",  
      nameGu:"PUC",  
      field:"pucc_expiry"  
    },  
  
    {  
      nameEn:"Tax",  
      nameGu:"Tax",  
      field:"tax_expiry"  
    },  
  
    {  
      nameEn:"Permit",  
      nameGu:"Permit",  
      field:"permit_expiry"  
    }  
  
  ];  
  
  
  /* =====================================  
     FIND ALL HIGHLIGHTED DOCUMENTS  
       
     SAME RULE AS VEHICLE LIST  
       
     Fitness  = 60 days  
     Insurance = 30 days  
     PUC       = 15 days  
     Tax       = 15 days  
     Permit    = 30 days  
       
     Expired = always included  
  ===================================== */  
  
  const highlightedDocuments =  
  
    documents  
  
      .map(doc => {  
  
        const days =  
          daysUntil(  
            vehicle[doc.field]  
          );  
  
        const limit =  
          expiryHighlightDays[  
            doc.field  
          ];  
  
  
        const highlighted =  
          days !== null &&  
          (  
            days < 0 ||  
            (  
              days >= 0 &&  
              days <= limit  
            )  
          );  
  
  
        return {  
  
          ...doc,  
  
          days:days,  
  
          highlighted:highlighted  
  
        };  
  
      })  
  
      .filter(  
        doc =>  
          doc.highlighted  
      );  
  
  
  /* =====================================  
     CUSTOMER DETAILS  
  ===================================== */  
  
  const customerName =  
    vehicle.customer_name ||  
    "Customer";  
  
  
  const vehicleNumber =  
    vehicle.vehicle_number ||  
    "";  
  
  
  /* =====================================  
     NO HIGHLIGHTED DOCUMENT  
  ===================================== */  
  
  if(  
    !highlightedDocuments.length  
  ){  
  
    alert(  
  
      currentLanguage === "gu"  
  
        ? "આ વાહનના કોઈ documentની expiry હાલમાં highlight થયેલી નથી."  
  
        : "No document expiry is currently highlighted for this vehicle."  
  
    );  
  
    return;  
  
  }  
  
  
  /* =====================================  
     MESSAGE  
  ===================================== */  
  
  let message = "";  
  
  
  if(  
    currentLanguage === "gu"  
  ){  
  
    message =  
  
`*SAHKAR AUTO ADVISOR*  
*NASVADI*  
  
નમસ્તે ${customerName},  
  
તમારા વાહન *${vehicleNumber}* ના નીચેના documentsની expiry નજીક છે અથવા expire થઈ ગઈ છે:  
  
`;  
  
  
    highlightedDocuments.forEach(  
  
      doc => {  
  
        const date =  
          displayDate(  
            vehicle[doc.field]  
          );  
  
  
        if(  
          doc.days < 0  
        ){  
  
          message +=  
            `🔴 *${doc.nameGu}* – ${date} (Expired)\n`;  
  
        }  
  
        else if(  
          doc.days <= 5  
        ){  
  
          message +=  
            `🟠 *${doc.nameGu}* – ${date}\n`;  
  
        }  
  
        else{  
  
          message +=  
            `🟡 *${doc.nameGu}* – ${date}\n`;  
  
        }  
  
      }  
  
    );  
  
  
    message +=  
  
`  
કૃપા કરીને સમયસર renewal કરાવી લેશો.  
  
📞 *Renewal માટે સંપર્ક કરો:*  
  
9714733501  
8000033501  
  
રમીઝભાઈ મેમણ નસવાડી`;  
  
  }  
  
  
  else{  
  
    message =  
  
`*SAHKAR AUTO ADVISOR*  
*NASVADI*  
  
Hello ${customerName},  
  
The following documents of your vehicle *${vehicleNumber}* are expiring soon or have expired:  
  
`;  
  
  
    highlightedDocuments.forEach(  
  
      doc => {  
  
        const date =  
          displayDate(  
            vehicle[doc.field]  
          );  
  
  
        if(  
          doc.days < 0  
        ){  
  
          message +=  
            `🔴 *${doc.nameEn}* – ${date} (Expired)\n`;  
  
        }  
  
        else if(  
          doc.days <= 5  
        ){  
  
          message +=  
            `🟠 *${doc.nameEn}* – ${date}\n`;  
  
        }  
  
        else{  
  
          message +=  
            `🟡 *${doc.nameEn}* – ${date}\n`;  
  
        }  
  
      }  
  
    );  
  
  
    message +=  
  
`  
Please renew the required documents on time.  
  
📞 *For Renewal Contact:*  
  
9714733501  
8000033501  
  
Ramizbhai Memon Nasvadi`;  
  
  }  
  
  
  /* =====================================  
     OPEN WHATSAPP  
  ===================================== */  
  
  const url =  
    "https://wa.me/" +  
    mobile +  
    "?text=" +  
    encodeURIComponent(  
      message  
    );  
  
  
  window.open(  
    url,  
    "_blank"  
  );  
  
}  
  
  
/* =========================================  
   DELETE VEHICLE  
========================================= */  
  
async function deleteVehicle(id){  
  
  const vehicle =  
    allVehicles.find(  
  
      item =>  
        String(item.id) ===  
        String(id)  
  
    );  
  
  
  if(!vehicle){  
  
    alert(  
      currentLanguage === "gu"  
        ? "વાહન મળ્યું નથી."  
        : "Vehicle not found."  
    );  
  
    return;  
  
  }  
  
  
  const confirmed =  
    confirm(  
  
      currentLanguage === "gu"  
  
        ? "શું તમે આ વાહન કાયમી રીતે Delete કરવા માંગો છો?"  
  
        : "Do you want to permanently delete this vehicle?"  
  
    );  
  
  
  if(!confirmed){  
  
    return;  
  
  }  
  
  
  try{  
  
    /* =====================================  
       DELETE PHOTO FROM STORAGE  
    ===================================== */  
  
    if(  
      vehicle.photo_path  
    ){  
  
      const {  
        error:  
          storageError  
      } =  
        await supabaseClient  
          .storage  
          .from(  
            "vehicle-photos"  
          )  
          .remove([  
            vehicle.photo_path  
          ]);  
  
  
      if(storageError){  
  
        console.warn(  
          "Storage delete warning:",  
          storageError  
        );  
  
      }  
  
    }  
  
  
    /* =====================================  
       DELETE DATABASE ROW  
    ===================================== */  
  
    const {  
      error  
    } =  
      await supabaseClient  
        .from("vehicles")  
        .delete()  
        .eq(  
          "id",  
          id  
        );  
  
  
    if(error){  
  
      throw error;  
  
    }  
  
  
    alert(  
  
      currentLanguage === "gu"  
  
        ? "વાહન કાયમી રીતે Delete થઈ ગયું."  
  
        : "Vehicle permanently deleted."  
  
    );  
  
  
    await loadVehicles();  
  
  
  }catch(error){  
  
    console.error(error);  
  
  
    alert(  
      "Delete Error: " +  
      (  
        error.message ||  
        "Unknown error"  
      )  
    );  
  
  }  
  
}  
  
  
/* =========================================  
   ESCAPE HTML  
========================================= */  
  
function escapeHtml(value){  
  
  return String(  
    value ?? ""  
  )  
  
    .replace(  
      /&/g,  
      "&amp;"  
    )  
  
    .replace(  
      /</g,  
      "&lt;"  
    )  
  
    .replace(  
      />/g,  
      "&gt;"  
    )  
  
    .replace(  
      /"/g,  
      "&quot;"  
    )  
  
    .replace(  
      /'/g,  
      "&#039;"  
    );  
  
}  
  
  
/* =========================================  
   ESCAPE JS  
========================================= */  
  
function escapeJs(value){  
  
  return String(  
    value ?? ""  
  )  
  
    .replace(  
      /\\/g,  
      "\\\\"  
    )  
  
    .replace(  
      /'/g,  
      "\\'"  
    )  
  
    .replace(  
      /"/g,  
      '\\"'  
    );  
  
}  
  
  
/* =========================================  
   INITIAL LOAD  
========================================= */  
  
document.addEventListener(  
  
  "DOMContentLoaded",  
  
  async function(){  
  
    updateLanguage();  
  
    await loadVehicles();  
  
  }  
  
);

   AUTO REFRESH EVERY 5 MINUTES  
========================================= */  
  
setInterval(  
  
  async function(){  
  
    await loadVehicles();  
  
  },  
  
  5 * 60 * 1000  
  
);  
  
</script>
