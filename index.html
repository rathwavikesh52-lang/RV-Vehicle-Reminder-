<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RV Vehicle Reminder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  font-family:Arial,Helvetica,sans-serif;

  background-image:url("./assets/background.png");

  background-size:cover;

  background-position:center center;

  background-repeat:no-repeat;

  background-attachment:fixed;

  color:#172033;

  min-height:100vh;

}


/* =====================================================
   HEADER
===================================================== */

.header{

  background:transparent;

  color:white;

  padding:14px 12px 12px;

}


.brand{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:12px;

}


.logo{

  width:62px;

  height:62px;

  object-fit:contain;

}


.brand-text{

  text-align:left;

}


.brand-text h1{

  font-size:25px;

  font-weight:800;

  line-height:1.1;

}


.brand-text p{

  margin-top:4px;

  font-size:13px;

  opacity:.95;

}


.header-total{

  margin-left:28px;

  text-align:center;

  color:white;

  line-height:1.15;

  white-space:nowrap;

}


.header-total div{

  font-size:14px;

  font-weight:600;

}


.header-total strong{

  display:block;

  font-size:25px;

  font-weight:800;

  margin-top:5px;

}


/* =====================================================
   HEADER EXPIRY MENU
===================================================== */

.expiry-menu{

  display:flex;

  justify-content:center;

  align-items:flex-start;

  gap:34px;

  margin-top:14px;

  color:white;

  text-align:center;

  white-space:nowrap;

}


.expiry-item{

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  min-width:65px;

}


.expiry-item .label{

  font-size:13px;

  font-weight:700;

  line-height:1.1;

}


.expiry-item .count{

  font-size:22px;

  font-weight:800;

  margin-top:4px;

  line-height:1;

}


/* =====================================================
   LANGUAGE
===================================================== */

.language-buttons{

  display:flex;

  justify-content:center;

  gap:7px;

  margin-top:13px;

}


.language-buttons button{

  border:1px solid rgba(255,255,255,.6);

  background:rgba(255,255,255,.15);

  color:white;

  padding:6px 12px;

  border-radius:8px;

  font-size:12px;

  cursor:pointer;

}


/* =====================================================
   MAIN
===================================================== */

.container{

  max-width:1200px;

  margin:15px auto 30px;

  padding:0 12px;

}


/* =====================================================
   TOP ACTIONS
===================================================== */

.top-actions{

  display:flex;

  justify-content:flex-end;

  gap:10px;

  margin-bottom:14px;

}


.action-btn{

  border:0;

  border-radius:10px;

  padding:11px 16px;

  font-size:14px;

  font-weight:700;

  cursor:pointer;

}


.add-btn{

  background:#0b7a43;

  color:white;

}


.refresh-btn{

  background:#123b70;

  color:white;

}


/* =====================================================
   SUMMARY
===================================================== */

.summary-section{

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:14px;

  margin-bottom:18px;

}


.summary-card{

  background:rgba(255,255,255,.94);

  border-radius:16px;

  padding:18px;

  box-shadow:0 5px 20px rgba(0,0,0,.12);

  text-align:center;

}


.summary-card .icon{

  width:42px;

  height:42px;

  margin:0 auto 8px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:21px;

}


.summary-card.expiring .icon{

  background:#f59e0b;

}


.summary-card.expired .icon{

  background:#dc2626;

}


.summary-title{

  font-size:15px;

  font-weight:700;

  color:#26364f;

}


.summary-number{

  margin-top:5px;

  font-size:27px;

  font-weight:800;

}


.summary-card.expiring .summary-number{

  color:#d97706;

}


.summary-card.expired .summary-number{

  color:#dc2626;

}


/* =====================================================
   VEHICLE LIST CARD
===================================================== */

.vehicle-container{

  background:rgba(255,255,255,.95);

  border-radius:18px;

  padding:18px;

  box-shadow:0 6px 25px rgba(0,0,0,.13);

}


.vehicle-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  margin-bottom:15px;

}


.vehicle-title{

  font-size:21px;

  font-weight:800;

  color:#092754;

}


.search-box{

  width:350px;

  max-width:100%;

}


.search-box input{

  width:100%;

  padding:11px 13px;

  border:1px solid #cbd5e1;

  border-radius:10px;

  font-size:14px;

  outline:none;

}


.search-box input:focus{

  border-color:#1d5fa7;

}


/* =====================================================
   VEHICLE CARD
===================================================== */

.vehicle-card{

  background:white;

  border:1px solid #e1e7ef;

  border-radius:15px;

  padding:15px;

  margin-bottom:12px;

  box-shadow:0 3px 12px rgba(0,0,0,.07);

}


.vehicle-top{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  margin-bottom:12px;

}


.vehicle-number{

  font-size:21px;

  font-weight:800;

  color:#092754;

}


.customer-info{

  margin-top:4px;

  font-size:13px;

  color:#475467;

}


.mobile-info{

  margin-top:3px;

  font-size:13px;

  color:#667085;

}


.vehicle-actions{

  display:flex;

  gap:7px;

}


.edit-btn,
.delete-btn{

  border:0;

  padding:8px 12px;

  border-radius:8px;

  font-size:12px;

  font-weight:700;

  cursor:pointer;

}


.edit-btn{

  background:#e7f0ff;

  color:#1554a6;

}


.delete-btn{

  background:#fee2e2;

  color:#b91c1c;

}


/* =====================================================
   VEHICLE DETAILS
===================================================== */

.vehicle-details{

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:10px;

}


.detail{

  background:#f7f9fc;

  border-radius:10px;

  padding:10px;

  border:1px solid #edf0f5;

}


.detail-label{

  font-size:11px;

  color:#667085;

  font-weight:700;

  margin-bottom:5px;

  text-transform:uppercase;

}


.detail-value{

  font-size:14px;

  font-weight:700;

  color:#172033;

}


.status-expired{

  color:#dc2626;

}


.status-expiring{

  color:#d97706;

}


.status-normal{

  color:#16803c;

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

  text-align:center;

  padding:35px 15px;

  color:#667085;

  font-size:15px;

}


/* =====================================================
   PAGINATION
===================================================== */

.pagination{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:12px;

  margin-top:18px;

}


.pagination button{

  border:0;

  background:#123b70;

  color:white;

  padding:9px 14px;

  border-radius:9px;

  font-size:13px;

  font-weight:700;

  cursor:pointer;

}


.pagination button:disabled{

  opacity:.4;

  cursor:not-allowed;

}


.page-info{

  font-weight:700;

  font-size:14px;

  color:#344054;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

  text-align:center;

  padding:18px;

  color:white;

  font-size:13px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

  .brand{

    justify-content:flex-start;

  }

  .brand-text h1{

    font-size:20px;

  }

  .brand-text p{

    font-size:11px;

  }

  .header-total{

    margin-left:auto;

  }

  .header-total div{

    font-size:11px;

  }

  .header-total strong{

    font-size:21px;

  }

  .expiry-menu{

    gap:0;

    justify-content:space-between;

  }

  .expiry-item{

    min-width:auto;

  }

  .expiry-item .label{

    font-size:10px;

  }

  .expiry-item .count{

    font-size:19px;

  }

  .vehicle-header{

    flex-direction:column;

    align-items:stretch;

  }

  .search-box{

    width:100%;

  }

  .vehicle-details{

    grid-template-columns:repeat(2,1fr);

  }

}


@media(max-width:390px){

  .brand{

    gap:7px;

  }

  .logo{

    width:52px;

    height:52px;

  }

  .brand-text h1{

    font-size:17px;

  }

  .brand-text p{

    font-size:9px;

  }

  .header-total{

    margin-left:8px;

  }

  .header-total div{

    font-size:9px;

  }

  .header-total strong{

    font-size:18px;

  }

  .expiry-item .label{

    font-size:8px;

  }

  .expiry-item .count{

    font-size:17px;

  }

  .vehicle-details{

    grid-template-columns:repeat(2,1fr);

  }

}


@media(max-width:600px){

  .summary-section{

    grid-template-columns:repeat(2,1fr);

  }

  .top-actions{

    justify-content:stretch;

  }

  .action-btn{

    flex:1;

  }

  .vehicle-top{

    flex-direction:column;

    align-items:flex-start;

  }

}


</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

<!-- =====================================================

<div class="container">


  <!-- ACTION BUTTONS -->

  <div class="top-actions">

      class="action-btn add-btn"
      onclick="goToUpload()"
    >
      + Add Vehicle

      onclick="loadVehicles()"

  </div>


  <!-- =================================================
       SUMMARY
  ================================================== -->

  <div class="summary-section">


    <div class="summary-card expiring">

      <div class="icon">
        ⚠️
      </div>

      <div class="summary-title">

      </div>

      <div
        class="summary-number"
        id="expiringCount"

      <div class="icon">
        ❌
      </div>

      <div class="summary-title">

      <div
        class="summary-number"

  </div>


  <!-- =================================================

  <div class="vehicle-container">

<div class="footer">

<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://lqbhafspabtlqeubqxjg.supabase.co";


const SUPABASE_KEY =
"sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let allVehicles = [];

let filteredVehicles = [];

let currentPage = 1;

const perPage = 10;


/* =====================================================
   EXPIRY FIELD LIST
===================================================== */

const expiryFields = [

  "fitness_expiry",

  "insurance_expiry",

  "tax_expiry",

  "pucc_expiry",

  "permit_expiry"

];


/* =====================================================
   PARSE DATE
===================================================== */

function parseDate(value){

  if(!value){

    return null;

  }


  if(
    typeof value === "string" &&
    value.toUpperCase() === "LTT"
  ){

    return null;

  }


  const date =
  new Date(value);


  if(
    isNaN(date.getTime())
  ){

    return null;

  }


  date.setHours(0,0,0,0);

  return date;

}


/* =====================================================
   DATE DIFFERENCE
===================================================== */

function getDaysDifference(value){

  const date =
  parseDate(value);


  if(!date){

    return null;

  }


  const today =
  new Date();


  today.setHours(0,0,0,0);


  return Math.ceil(
    (
      date - today
    ) /
    (
      1000 *
      60 *
      60 *
      24
    )
  );

}


/* =====================================================
   EXPIRING SOON
===================================================== */

function isExpiringSoon(value){

  const days =
  getDaysDifference(value);


  return (
    days !== null &&
    days >= 0 &&
    days <= 10
  );

}


/* =====================================================
   EXPIRED
===================================================== */

function isExpired(value){

  const days =
  getDaysDifference(value);


  return (
    days !== null &&
    days < 0
  );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

  if(!value){

    return "-";

  }


  if(
    typeof value === "string" &&
    value.toUpperCase() === "LTT"
  ){

    return "LTT";

  }


  const date =
  parseDate(value);


  if(!date){

    return value;

  }


  return date.toLocaleDateString(
    "en-GB",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


/* =====================================================
   DATE CLASS
===================================================== */

function getDateClass(value){

  if(!value){

    return "";

  }


  if(
    typeof value === "string" &&
    value.toUpperCase() === "LTT"
  ){

    return "status-normal";

  }


  if(
    isExpired(value)
  ){

    return "status-expired";

  }


  if(
    isExpiringSoon(value)
  ){

    return "status-expiring";

  }


  return "status-normal";

}


/* =====================================================
   VEHICLE EXPIRY CHECK
===================================================== */

function vehicleIsExpiring(vehicle){

  return expiryFields.some(
    field =>
    isExpiringSoon(
      vehicle[field]
    )
  );

}


function vehicleIsExpired(vehicle){

  return expiryFields.some(
    field =>
    isExpired(
      vehicle[field]
    )
  );

}


/* =====================================================
   LOAD VEHICLES
===================================================== */

async function loadVehicles(){

  const vehicleList =
  document.getElementById(
    "vehicleList"
  );


  vehicleList.innerHTML =
  `
    <div class="empty">
      Loading vehicles...
    </div>
  `;


  const {
    data,
    error
  } =
  await supabaseClient

    .from("vehicles")

    .select("*")

    .order(
      "id",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);


    vehicleList.innerHTML =
    `
      <div class="empty">
        ❌ Error loading vehicles
        <br><br>
        ${error.message}
      </div>
    `;

    return;

  }


  allVehicles =
  data || [];


  filteredVehicles =
  [...allVehicles];


  currentPage = 1;


  updateSummary();


  renderVehicles();

}


/* =====================================================
   UPDATE SUMMARY
===================================================== */

function updateSummary(){

  const total =
  allVehicles.length;


  document.getElementById(
    "headerTotalVehicles"
  ).textContent =
  total;


  let expiring = 0;

  let expired = 0;


  allVehicles.forEach(
    vehicle => {

      if(
        vehicleIsExpiring(
          vehicle
        )
      ){

        expiring++;

      }


      if(
        vehicleIsExpired(
          vehicle
        )
      ){

        expired++;

      }

    }
  );


  document.getElementById(
    "expiringCount"
  ).textContent =
  expiring;


  document.getElementById(
    "expiredCount"
  ).textContent =
  expired;


  /* =================================================
     HEADER FIELD COUNTS
  ================================================== */


  let fitnessCount = 0;

  let insuranceCount = 0;

  let pucCount = 0;

  let taxCount = 0;

  let permitCount = 0;


  allVehicles.forEach(
    vehicle => {


      if(
        isExpiringSoon(
          vehicle.fitness_expiry
        )
      ){

        fitnessCount++;

      }


      if(
        isExpiringSoon(
          vehicle.insurance_expiry
        )
      ){

        insuranceCount++;

      }


      if(
        isExpiringSoon(
          vehicle.pucc_expiry
        )
      ){

        pucCount++;

      }


      if(
        isExpiringSoon(
          vehicle.tax_expiry
        )
      ){

        taxCount++;

      }


      if(
        isExpiringSoon(
          vehicle.permit_expiry
        )
      ){

        permitCount++;

      }

    }
  );


  document.getElementById(
    "headerFitnessCount"
  ).textContent =
  fitnessCount;


  document.getElementById(
    "headerInsuranceCount"
  ).textContent =
  insuranceCount;


  document.getElementById(
    "headerPucCount"
  ).textContent =
  pucCount;


  document.getElementById(
    "headerTaxCount"
  ).textContent =
  taxCount;


  document.getElementById(
    "headerPermitCount"
  ).textContent =
  permitCount;

}


/* =====================================================
   RENDER VEHICLES
===================================================== */

function renderVehicles(){

  const vehicleList =
  document.getElementById(
    "vehicleList"
  );


  const totalPages =
  Math.max(
    1,
    Math.ceil(
      filteredVehicles.length /
      perPage
    )
  );


  if(
    currentPage >
    totalPages
  ){

    currentPage =
    totalPages;

  }


  const start =
  (
    currentPage - 1
  ) *
  perPage;


  const end =
  start + perPage;


  const pageVehicles =
  filteredVehicles.slice(
    start,
    end
  );


  if(
    pageVehicles.length === 0
  ){

    vehicleList.innerHTML =
    `
      <div class="empty">
        No vehicles found.
      </div>
    `;

  }else{


    vehicleList.innerHTML =
    pageVehicles
      .map(
        vehicle =>
        createVehicleCard(
          vehicle
        )
      )
      .join("");

  }


  document.getElementById(
    "pageInfo"
  ).textContent =
  `Page ${currentPage} of ${totalPages}`;


  document.getElementById(
    "prevBtn"
  ).disabled =
  currentPage <= 1;


  document.getElementById(
    "nextBtn"
  ).disabled =
  currentPage >= totalPages;

}


/* =====================================================
   CREATE VEHICLE CARD
===================================================== */

function createVehicleCard(
  vehicle
){

  const customer =
  vehicle.customer_name ||
  "-";


  const mobile =
  vehicle.mobile ||
  "-";


  return `

    <div class="vehicle-card">

      <div class="vehicle-top">

        <div>

          <div class="vehicle-number">

            ${escapeHTML(
              vehicle.vehicle_number ||
              "-"
            )}

          </div>

          <div class="customer-info">

            Customer:
            ${escapeHTML(
              customer
            )}

          </div>

          <div class="mobile-info">

            Mobile:
            ${escapeHTML(
              mobile
            )}

          </div>

        </div>


        <div class="vehicle-actions">

          <button
            class="edit-btn"
            onclick="editVehicle('${vehicle.id}')"
          >
            Edit
          </button>


          <button
            class="delete-btn"
            onclick="deleteVehicle('${vehicle.id}')"
          >
            Delete
          </button>

        </div>

      </div>


      <div class="vehicle-details">


        ${detailHTML(
          "Registration",
          vehicle.registration_date
        )}


        ${detailHTML(
          "Fitness",
          vehicle.fitness_expiry
        )}


        ${detailHTML(
          "Insurance",
          vehicle.insurance_expiry
        )}


        ${detailHTML(
          "Tax",
          vehicle.tax_expiry
        )}


        ${detailHTML(
          "PUCC",
          vehicle.pucc_expiry
        )}


        ${detailHTML(
          "Permit",
          vehicle.permit_expiry
        )}


      </div>

    </div>

  `;

}


/* =====================================================
   DETAIL HTML
===================================================== */

function detailHTML(
  label,
  value
){

  const display =
  formatDate(value);


  const cls =
  getDateClass(value);


  return `

    <div class="detail">

      <div class="detail-label">
        ${label}
      </div>

      <div class="detail-value ${cls}">
        ${escapeHTML(display)}
      </div>

    </div>

  `;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   SEARCH
===================================================== */

function searchVehicle(){

  const search =
  document.getElementById(
    "searchInput"
  )
  .value
  .trim()
  .toLowerCase();


  if(!search){

    filteredVehicles =
    [...allVehicles];

  }else{

    filteredVehicles =
    allVehicles.filter(
      vehicle => {

        const number =
        String(
          vehicle.vehicle_number ||
          ""
        )
        .toLowerCase();


        const customer =
        String(
          vehicle.customer_name ||
          ""
        )
        .toLowerCase();


        const mobile =
        String(
          vehicle.mobile ||
          ""
        )
        .toLowerCase();


        return (

          number.includes(search) ||

          customer.includes(search) ||

          mobile.includes(search)

        );

      }
    );

  }


  currentPage = 1;


  renderVehicles();

}


/* =====================================================
   PREVIOUS PAGE
===================================================== */

function previousPage(){

  if(
    currentPage > 1
  ){

    currentPage--;

    renderVehicles();

  }

}


/* =====================================================
   NEXT PAGE
===================================================== */

function nextPage(){

  const totalPages =
  Math.max(
    1,
    Math.ceil(
      filteredVehicles.length /
      perPage
    )
  );


  if(
    currentPage <
    totalPages
  ){

    currentPage++;

    renderVehicles();

  }

}

/* =====================================================
   DELETE STORAGE PHOTO
===================================================== */

async function deleteStoragePhoto(
  path
){

  if(!path){

    return;

  }


  try{

    const {
      error
    } =
    await supabaseClient

      .storage

      .from("vehicle-photos")

      .remove([
        path
      ]);


    if(error){

      console.warn(
        "Storage delete error:",
        error
      );

    }

  }catch(error){

    console.warn(
      error
    );

  }

}


/* =====================================================
   DELETE VEHICLE
===================================================== */

async function deleteVehicle(
  id
){

  const vehicle =
  allVehicles.find(
    item =>
    String(item.id) ===
    String(id)
  );


  if(!vehicle){

    return;

  }


  const confirmDelete =
  confirm(
    "Are you sure you want to delete vehicle " +
    (
      vehicle.vehicle_number ||
      ""
    ) +
    "?"
  );


  if(!confirmDelete){

    return;

  }


  try{


    /* DELETE PHOTO */

    if(
      vehicle.photo_path
    ){

      await deleteStoragePhoto(
        vehicle.photo_path
      );

    }


    /* DELETE DATABASE RECORD */

    const {
      error
    } =
    await supabaseClient

      .from("vehicles")

      .delete()

      .eq(
        "id",
        id
      );


    if(error){

      throw error;

    }


    alert(
      "Vehicle deleted successfully."
    );


    await loadVehicles();


  }catch(error){

    console.error(
      error
    );


    alert(
      "Delete failed:\n" +
      (
        error.message ||
        error
      )
    );

  }

}

loadVehicles();
