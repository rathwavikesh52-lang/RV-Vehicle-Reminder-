<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>RV Vehicle Reminder</title>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#102d55;

  min-height:100vh;

  background-image:
    url("./assets/background.png");

  background-size:cover;

  background-position:center center;

  background-repeat:no-repeat;

  background-attachment:fixed;

}


/* =========================================================
   PAGE
========================================================= */

.page{

  width:100%;

  min-height:100vh;

  padding:
    28px
    24px
    35px;

}


/* =========================================================
   HEADER
========================================================= */

.header{

  max-width:1350px;

  margin:0 auto 22px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

}


.brand{

  display:flex;

  align-items:center;

  gap:18px;

}


.logo{

  width:210px;

  height:150px;

  object-fit:contain;

  display:block;

}


.brand-text h1{

  margin:0;

  font-size:42px;

  line-height:1.05;

  font-weight:800;

  color:#0b396d;

}


.brand-text p{

  margin:10px 0 0;

  font-size:23px;

  color:#214c78;

}


.tagline{

  margin-top:13px;

  font-size:20px;

  font-style:italic;

  color:#123b68;

  font-family:
    Georgia,
    serif;

}


.tagline span{

  color:#ed8d12;

  margin:0 8px;

}


/* =========================================================
   TOTAL VEHICLES
========================================================= */

.total-card{

  min-width:275px;

  background:
    rgba(255,255,255,.94);

  border-radius:20px;

  padding:22px 28px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.12);

  display:flex;

  align-items:center;

  gap:18px;

}


.total-icon{

  width:65px;

  height:65px;

  border-radius:50%;

  background:#1976df;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:31px;

  flex:none;

}


.total-title{

  font-size:20px;

  font-weight:700;

  color:#122d51;

}


.total-number{

  margin-top:5px;

  font-size:42px;

  line-height:1;

  font-weight:800;

  color:#1769c8;

}


/* =========================================================
   MAIN DASHBOARD
========================================================= */

.dashboard{

  max-width:1350px;

  margin:0 auto;

  background:
    rgba(255,255,255,.94);

  border-radius:23px;

  padding:20px;

  box-shadow:
    0 10px 40px
    rgba(0,0,0,.16);

}


/* =========================================================
   LIST TOP
========================================================= */

.list-top{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  padding:
    3px
    2px
    18px;

}


.list-title{

  display:flex;

  align-items:center;

  gap:12px;

}


.list-title-icon{

  font-size:31px;

}


.list-title h2{

  margin:0;

  font-size:27px;

  font-weight:800;

  color:#102f58;

}


/* =========================================================
   SEARCH + ADD
========================================================= */

.top-actions{

  display:flex;

  align-items:center;

  gap:12px;

}


.search-box{

  width:380px;

  height:45px;

  border:1px solid #cbd8e7;

  border-radius:11px;

  background:white;

  display:flex;

  align-items:center;

  padding:0 13px;

  box-shadow:
    inset 0 1px 2px
    rgba(0,0,0,.03);

}


.search-icon{

  font-size:20px;

  margin-right:9px;

  color:#5c7897;

}


.search-box input{

  width:100%;

  border:0;

  outline:0;

  font-size:15px;

  color:#173b63;

  background:transparent;

}


.search-box input::placeholder{

  color:#6c8097;

}


.add-btn{

  height:45px;

  border:0;

  border-radius:11px;

  background:#176fd3;

  color:white;

  padding:0 20px;

  font-size:16px;

  font-weight:700;

  cursor:pointer;

  display:flex;

  align-items:center;

  gap:8px;

  box-shadow:
    0 5px 13px
    rgba(23,111,211,.25);

}


.add-btn:hover{

  background:#0f5db7;

}


.add-plus{

  font-size:23px;

  line-height:1;

}


/* =========================================================
   VEHICLE LIST
========================================================= */

#vehicleList{

  display:flex;

  flex-direction:column;

  gap:12px;

}


/* =========================================================
   VEHICLE CARD
========================================================= */

.vehicle-card{

  width:100%;

  min-height:160px;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.98),
      rgba(250,253,255,.96)
    );

  border:1px solid #e0e9f3;

  border-radius:15px;

  box-shadow:
    0 3px 14px
    rgba(31,66,102,.08);

  display:grid;

  grid-template-columns:
    330px
    1fr
    1fr
    95px;

  align-items:stretch;

  overflow:hidden;

}


/* =========================================================
   VEHICLE BASIC
========================================================= */

.vehicle-basic{

  display:flex;

  align-items:center;

  gap:18px;

  padding:18px;

  border-right:1px solid #dbe5ef;

}


.vehicle-photo{

  width:116px;

  height:112px;

  border-radius:11px;

  object-fit:cover;

  background:#eaf1f7;

  flex:none;

}


.no-photo{

  width:116px;

  height:112px;

  border-radius:11px;

  background:
    linear-gradient(
      135deg,
      #e5edf5,
      #f8fbfe
    );

  display:flex;

  align-items:center;

  justify-content:center;

  color:#7890a8;

  font-size:35px;

  flex:none;

}


.vehicle-main-info{

  min-width:0;

}


.vehicle-number{

  font-size:23px;

  font-weight:800;

  color:#092f61;

  white-space:nowrap;

}


.vehicle-type{

  display:inline-block;

  margin-top:9px;

  padding:5px 12px;

  border-radius:20px;

  background:#e3f1ff;

  color:#1665ad;

  font-size:14px;

  font-weight:700;

}


.vehicle-customer{

  margin-top:9px;

  font-size:13px;

  color:#657991;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


.vehicle-mobile{

  margin-top:4px;

  font-size:12px;

  color:#7b8da0;

}


/* =========================================================
   DETAILS COLUMN
========================================================= */

.detail-column{

  padding:
    17px
    20px;

  display:flex;

  flex-direction:column;

  justify-content:center;

  gap:14px;

}


.detail-column + .detail-column{

  border-left:1px solid #dbe5ef;

}


.detail-row{

  display:grid;

  grid-template-columns:
    25px
    minmax(120px,1fr)
    auto;

  align-items:center;

  gap:6px;

  min-height:29px;

}


.detail-icon{

  font-size:19px;

  text-align:center;

}


.detail-label{

  font-size:14px;

  color:#315679;

  white-space:nowrap;

}


.date-badge{

  min-width:118px;

  text-align:center;

  padding:
    6px
    12px;

  border-radius:14px;

  font-size:13px;

  font-weight:800;

  white-space:nowrap;

}


/* =========================================================
   DATE COLORS
========================================================= */

.date-registration{

  background:#e1f1ff;

  color:#1464ad;

}


.date-fitness{

  background:#ddf7e8;

  color:#08773b;

}


.date-tax{

  background:#eee7ff;

  color:#5637a4;

}


.date-insurance{

  background:#fff0d9;

  color:#c87300;

}


.date-pucc{

  background:#ffe3e8;

  color:#d92c3c;

}


.date-permit{

  background:#dff8f3;

  color:#07816f;

}


.date-expired{

  background:#ffe0e4 !important;

  color:#d71d2b !important;

}


.date-soon{

  background:#fff0d5 !important;

  color:#c46a00 !important;

}


/* =========================================================
   ACTIONS
========================================================= */

.card-actions{

  border-left:1px solid #dbe5ef;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:10px;

  padding:10px;

  background:
    rgba(250,252,255,.75);

}


.icon-btn{

  width:40px;

  height:40px;

  border:0;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  cursor:pointer;

  color:white;

  font-size:19px;

  transition:
    transform .15s ease,
    opacity .15s ease;

}


.icon-btn:hover{

  transform:scale(1.08);

  opacity:.92;

}


.edit-icon{

  background:#1877df;

}


.delete-icon{

  background:#ed2632;

}


.whatsapp-icon{

  background:#16b96b;

}


.icon-btn svg{

  width:20px;

  height:20px;

  fill:white;

}


/* =========================================================
   EMPTY
========================================================= */

.empty{

  padding:45px 20px;

  text-align:center;

  color:#6d8197;

  font-size:16px;

}


/* =========================================================
   PAGINATION
========================================================= */

.pagination{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:30px;

  padding:17px 5px 4px;

}


.page-btn{

  min-width:115px;

  height:42px;

  border:0;

  border-radius:10px;

  background:#0e4c87;

  color:white;

  font-size:15px;

  font-weight:700;

  cursor:pointer;

}


.page-btn:disabled{

  opacity:.4;

  cursor:not-allowed;

}


.page-info{

  min-width:110px;

  text-align:center;

  font-size:15px;

  font-weight:700;

  color:#183c64;

}


/* =========================================================
   BOTTOM SUMMARY
========================================================= */

.bottom-summary{

  margin-top:16px;

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:60px;

  position:relative;

}


.bottom-summary::after{

  content:"";

  position:absolute;

  left:50%;

  top:13px;

  bottom:13px;

  width:1px;

  background:#dbe4ee;

}


.bottom-card{

  min-height:78px;

  border-radius:15px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    14px
    22px;

}


.expiring-summary{

  background:
    linear-gradient(
      90deg,
      #fff8e7,
      #fff3d4
    );

  border:1px solid #f5dfab;

}


.expired-summary{

  background:
    linear-gradient(
      90deg,
      #fff0f1,
      #ffe9eb
    );

  border:1px solid #f2ced2;

}


.summary-left{

  display:flex;

  align-items:center;

  gap:16px;

}


.summary-icon{

  font-size:38px;

}


.expiring-summary .summary-icon{

  color:#ed8d0c;

}


.expired-summary .summary-icon{

  color:#e72b35;

}


.summary-name{

  font-size:20px;

  font-weight:800;

  color:#163456;

}


.summary-number{

  font-size:38px;

  font-weight:800;

}


.expiring-summary .summary-number{

  color:#ed8d0c;

}


.expired-summary .summary-number{

  color:#e72b35;

}


/* =========================================================
   RESPONSIVE TABLET
========================================================= */

@media(max-width:1100px){

  .brand-text h1{

    font-size:34px;

  }

  .brand-text p{

    font-size:18px;

  }

  .logo{

    width:170px;

    height:125px;

  }

  .total-card{

    min-width:230px;

  }

  .vehicle-card{

    grid-template-columns:
      290px
      1fr
      1fr
      75px;

  }

  .vehicle-basic{

    gap:12px;

  }

  .vehicle-photo,
  .no-photo{

    width:95px;

    height:95px;

  }

  .detail-column{

    padding:
      13px
      12px;

  }

  .detail-row{

    grid-template-columns:
      22px
      1fr;

  }

  .date-badge{

    grid-column:2;

    width:max-content;

    min-width:110px;

  }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:760px){

  body{

    background-attachment:
      scroll;

  }


  .page{

    padding:
      10px
      8px
      20px;

  }


  .header{

    flex-direction:column;

    align-items:stretch;

    margin-bottom:12px;

    gap:10px;

  }


  .brand{

    align-items:center;

    gap:8px;

  }


  .logo{

    width:105px;

    height:85px;

  }


  .brand-text h1{

    font-size:23px;

  }


  .brand-text p{

    margin-top:5px;

    font-size:13px;

  }


  .tagline{

    margin-top:7px;

    font-size:12px;

  }


  .tagline span{

    margin:0 3px;

  }


  .total-card{

    width:100%;

    min-width:0;

    padding:
      12px
      17px;

    border-radius:14px;

  }


  .total-icon{

    width:48px;

    height:48px;

    font-size:23px;

  }


  .total-title{

    font-size:15px;

  }


  .total-number{

    font-size:30px;

  }


  .dashboard{

    padding:10px;

    border-radius:15px;

  }


  .list-top{

    flex-direction:column;

    align-items:stretch;

    padding-bottom:10px;

  }


  .list-title h2{

    font-size:22px;

  }


  .top-actions{

    width:100%;

  }


  .search-box{

    flex:1;

    width:auto;

  }


  .add-btn{

    padding:
      0 14px;

  }


  /* Horizontal mobile vehicle swipe */

  #vehicleList{

    flex-direction:row;

    overflow-x:auto;

    overflow-y:hidden;

    gap:12px;

    scroll-snap-type:x mandatory;

    -webkit-overflow-scrolling:touch;

    scrollbar-width:none;

    touch-action:pan-x;

    padding:
      3px
      2px
      12px;

  }


  #vehicleList::-webkit-scrollbar{

    display:none;

  }


  .vehicle-card{

    flex:
      0 0 92%;

    width:92%;

    min-height:0;

    grid-template-columns:1fr;

    scroll-snap-align:start;

    scroll-snap-stop:always;

    overflow:hidden;

  }


  .vehicle-basic{

    padding:13px;

    border-right:0;

    border-bottom:1px solid #dbe5ef;

  }


  .vehicle-photo,
  .no-photo{

    width:92px;

    height:88px;

  }


  .vehicle-number{

    font-size:19px;

  }


  .vehicle-type{

    font-size:12px;

    margin-top:6px;

  }


  .detail-column{

    padding:
      12px
      14px;

    gap:8px;

  }


  .detail-column + .detail-column{

    border-left:0;

    border-top:1px solid #dbe5ef;

  }


  .detail-row{

    grid-template-columns:
      25px
      1fr
      auto;

  }


  .date-badge{

    grid-column:auto;

    min-width:100px;

    font-size:12px;

  }


  .card-actions{

    border-left:0;

    border-top:1px solid #dbe5ef;

    flex-direction:row;

    padding:11px;

    justify-content:center;

  }


  .pagination{

    gap:10px;

  }


  .page-btn{

    min-width:90px;

  }


  .bottom-summary{

    grid-template-columns:1fr 1fr;

    gap:8px;

  }


  .bottom-summary::after{

    display:none;

  }


  .bottom-card{

    min-height:65px;

    padding:
      9px
      10px;

  }


  .summary-left{

    gap:7px;

  }


  .summary-icon{

    font-size:25px;

  }


  .summary-name{

    font-size:13px;

  }


  .summary-number{

    font-size:27px;

  }

}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media(max-width:390px){

  .brand-text h1{

    font-size:20px;

  }

  .brand-text p{

    font-size:11px;

  }

  .logo{

    width:90px;

    height:75px;

  }

  .vehicle-card{

    flex-basis:94%;

    width:94%;

  }

  .search-box input{

    font-size:12px;

  }

  .add-btn{

    padding:0 10px;

    font-size:13px;

  }

}


/* =========================================================
   DESKTOP VEHICLE ROW
========================================================= */

@media(min-width:1101px){

  .vehicle-card{

    grid-template-columns:
      330px
      1fr
      1fr
      82px;

  }

}


/* =========================================================
   LOADING
========================================================= */

.loading{

  padding:40px;

  text-align:center;

  color:#496780;

  font-size:16px;

}


/* =========================================================
   TOAST
========================================================= */

.toast{

  position:fixed;

  left:50%;

  bottom:25px;

  transform:
    translateX(-50%)
    translateY(100px);

  background:#123e6d;

  color:white;

  padding:
    13px
    22px;

  border-radius:10px;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.25);

  opacity:0;

  pointer-events:none;

  transition:.25s;

  z-index:9999;

}


.toast.show{

  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);

}


/* =========================================================
   LANGUAGE
========================================================= */

.language-box{

  display:none;

}


/* =========================================================
   HIDDEN
========================================================= */

.hidden{

  display:none !important;

}

</style>

</head>


<body>


<div class="page">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">


  <div class="brand">


    <img
      src="./assets/logo.png"
      class="logo"
      alt="RV Vehicle Reminder Logo"
    >


    <div class="brand-text">

      <h1>
        RV Vehicle Reminder
      </h1>

      <p>
        Vehicle Expiry Management System
      </p>

      <div class="tagline">

        Stay Alert
        <span>•</span>
        Stay Legal
        <span>•</span>
        Drive Safe

      </div>

    </div>


  </div>


  <div class="total-card">


    <div class="total-icon">
      🚗
    </div>


    <div>

      <div class="total-title">
        Total Vehicles
      </div>

      <div
        class="total-number"
        id="headerTotalVehicles"
      >
        0
      </div>

    </div>


  </div>


</header>



<!-- =====================================================
     DASHBOARD
===================================================== -->

<main class="dashboard">


  <!-- ===================================================
       VEHICLE LIST HEADER
  ==================================================== -->

  <div class="list-top">


    <div class="list-title">

      <div class="list-title-icon">
        🚙
      </div>

      <h2>
        VEHICLE LIST
      </h2>

    </div>


    <div class="top-actions">


      <div class="search-box">

        <span class="search-icon">
          🔍
        </span>

        <input
          type="text"
          id="searchInput"
          placeholder="Search by Vehicle Number..."
          autocomplete="off"
        >

      </div>


      <button
        class="add-btn"
        onclick="goUpload()"
      >

        <span class="add-plus">
          +
        </span>

        Add Vehicle

      </button>


    </div>


  </div>



  <!-- ===================================================
       VEHICLES
  ==================================================== -->

  <div id="vehicleList">

    <div class="loading">
      Loading vehicles...
    </div>

  </div>



  <!-- ===================================================
       PAGINATION
  ==================================================== -->

  <div
    class="pagination"
    id="pagination"
  >

    <button
      class="page-btn"
      id="prevBtn"
      onclick="previousPage()"
    >
      Previous
    </button>


    <div
      class="page-info"
      id="pageInfo"
    >
      Page 1 of 1
    </div>


    <button
      class="page-btn"
      id="nextBtn"
      onclick="nextPage()"
    >
      Next
    </button>

  </div>



  <!-- ===================================================
       BOTTOM SUMMARY
  ==================================================== -->

  <div class="bottom-summary">


    <div class="bottom-card expiring-summary">


      <div class="summary-left">

        <div class="summary-icon">
          ⏰
        </div>

        <div class="summary-name">
          Expiring Soon
        </div>

      </div>


      <div
        class="summary-number"
        id="expiringCount"
      >
        0
      </div>


    </div>



    <div class="bottom-card expired-summary">


      <div class="summary-left">

        <div class="summary-icon">
          ⚠
        </div>

        <div class="summary-name">
          Expired Vehicles
        </div>

      </div>


      <div
        class="summary-number"
        id="expiredCount"
      >
        0
      </div>


    </div>


  </div>


</main>


</div>



<!-- =====================================================
     TOAST
===================================================== -->

<div
  class="toast"
  id="toast"
></div>



<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://lqbhafspabtlqeubqxjg.supabase.co";


const SUPABASE_KEY =
"sb_publishable_rIwkaBM5KZodAPSty-hXwg_8_2Rl1-J";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);



/* =========================================================
   GLOBAL DATA
========================================================= */

let allVehicles = [];

let filteredVehicles = [];

let currentPage = 1;

const recordsPerPage = 10;



/* =========================================================
   ELEMENTS
========================================================= */

const vehicleList =
document.getElementById(
  "vehicleList"
);


const searchInput =
document.getElementById(
  "searchInput"
);


const headerTotalVehicles =
document.getElementById(
  "headerTotalVehicles"
);


const expiringCount =
document.getElementById(
  "expiringCount"
);


const expiredCount =
document.getElementById(
  "expiredCount"
);


const prevBtn =
document.getElementById(
  "prevBtn"
);


const nextBtn =
document.getElementById(
  "nextBtn"
);


const pageInfo =
document.getElementById(
  "pageInfo"
);


const toast =
document.getElementById(
  "toast"
);



/* =========================================================
   INIT
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadVehicles();

  }
);



/* =========================================================
   LOAD VEHICLES
========================================================= */

async function loadVehicles(){

  vehicleList.innerHTML =
    `<div class="loading">
      Loading vehicles...
    </div>`;


  try{


    const {
      data,
      error
    } =
    await supabaseClient
      .from("vehicles")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      throw error;

    }


    allVehicles =
      data || [];


    filteredVehicles =
      [...allVehicles];


    currentPage = 1;


    updateSummary();

    renderVehicles();


  }catch(error){

    console.error(
      "Load error:",
      error
    );


    vehicleList.innerHTML =
      `<div class="empty">
        Unable to load vehicles.
        <br><br>
        ${escapeHtml(
          error.message || error
        )}
      </div>`;

  }

}



/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
  "input",
  function(){

    const search =
      this.value
        .trim()
        .toLowerCase();


    if(!search){

      filteredVehicles =
        [...allVehicles];

    }else{

      filteredVehicles =
        allVehicles.filter(
          vehicle => {

            const vehicleNumber =
              String(
                vehicle.vehicle_number || ""
              ).toLowerCase();


            const customer =
              String(
                vehicle.customer_name || ""
              ).toLowerCase();


            const mobile =
              String(
                vehicle.mobile || ""
              ).toLowerCase();


            return (

              vehicleNumber.includes(search) ||

              customer.includes(search) ||

              mobile.includes(search)

            );

          }
        );

    }


    currentPage = 1;

    renderVehicles();

  }
);



/* =========================================================
   SUMMARY
========================================================= */

function updateSummary(){

  headerTotalVehicles.textContent =
    allVehicles.length;


  let expiring = 0;

  let expired = 0;


  allVehicles.forEach(
    vehicle => {

      const fields = [

        vehicle.fitness_expiry,

        vehicle.insurance_expiry,

        vehicle.tax_expiry,

        vehicle.pucc_expiry,

        vehicle.permit_expiry

      ];


      let vehicleExpired = false;

      let vehicleExpiring = false;


      fields.forEach(
        value => {

          if(!value){

            return;

          }


          if(
            String(value)
              .toUpperCase()
              .trim()
            ===
            "LTT"
          ){

            return;

          }


          const days =
            daysUntil(value);


          if(days < 0){

            vehicleExpired = true;

          }else if(
            days >= 0 &&
            days <= 10
          ){

            vehicleExpiring = true;

          }

        }
      );


      if(vehicleExpired){

        expired++;

      }else if(vehicleExpiring){

        expiring++;

      }

    }
  );


  expiringCount.textContent =
    expiring;


  expiredCount.textContent =
    expired;

}



/* =========================================================
   DAYS UNTIL
========================================================= */

function daysUntil(value){

  if(!value){

    return null;

  }


  const date =
    parseDatabaseDate(value);


  if(!date){

    return null;

  }


  const today =
    new Date();


  today.setHours(
    0,0,0,0
  );


  date.setHours(
    0,0,0,0
  );


  return Math.ceil(
    (
      date.getTime() -
      today.getTime()
    )
    /
    86400000
  );

}



/* =========================================================
   PARSE DATE
========================================================= */

function parseDatabaseDate(value){

  if(!value){

    return null;

  }


  if(
    String(value)
      .toUpperCase()
      .trim()
    ===
    "LTT"
  ){

    return null;

  }


  const text =
    String(value)
      .trim();


  let match =
    text.match(
      /^(\d{4})-(\d{2})-(\d{2})/
    );


  if(match){

    return new Date(
      Number(match[1]),
      Number(match[2])-1,
      Number(match[3])
    );

  }


  match =
    text.match(
      /^(\d{2})\/(\d{2})\/(\d{4})$/
    );


  if(match){

    return new Date(
      Number(match[3]),
      Number(match[2])-1,
      Number(match[1])
    );

  }


  return null;

}



/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(value){

  if(!value){

    return "—";

  }


  if(
    String(value)
      .toUpperCase()
      .trim()
    ===
    "LTT"
  ){

    return "LTT";

  }


  const date =
    parseDatabaseDate(value);


  if(!date){

    return String(value);

  }


  const months = [

    "Jan",
    "Feb",
    "Mar",
    "Apr",
    "May",
    "Jun",
    "Jul",
    "Aug",
    "Sep",
    "Oct",
    "Nov",
    "Dec"

  ];


  return (

    String(
      date.getDate()
    ).padStart(2,"0")

    +

    "-"

    +

    months[
      date.getMonth()
    ]

    +

    "-"

    +

    date.getFullYear()

  );

}



/* =========================================================
   DATE CLASS
========================================================= */

function dateClass(
  value,
  normalClass
){

  if(!value){

    return normalClass;

  }


  if(
    String(value)
      .toUpperCase()
      .trim()
    ===
    "LTT"
  ){

    return normalClass;

  }


  const days =
    daysUntil(value);


  if(days < 0){

    return "date-expired";

  }


  if(
    days >= 0 &&
    days <= 10
  ){

    return "date-soon";

  }


  return normalClass;

}



/* =========================================================
   RENDER VEHICLES
========================================================= */

function renderVehicles(){

  if(!filteredVehicles.length){

    vehicleList.innerHTML =
      `<div class="empty">
        No vehicles found.
      </div>`;


    updatePagination(0);

    return;

  }


  const totalPages =
    Math.ceil(
      filteredVehicles.length /
      recordsPerPage
    );


  if(
    currentPage > totalPages
  ){

    currentPage =
      totalPages;

  }


  const start =
    (
      currentPage - 1
    )
    *
    recordsPerPage;


  const end =
    start +
    recordsPerPage;


  const pageVehicles =
    filteredVehicles.slice(
      start,
      end
    );


  vehicleList.innerHTML =
    pageVehicles
      .map(
        vehicle =>
          createVehicleCard(
            vehicle
          )
      )
      .join("");


  updatePagination(
    totalPages
  );

}

/* =========================================================

========================================================= */

  icon,
  label,
  value,
  normalClass
){

    formatDate(value);


  const cls =
    dateClass(
      value,
      normalClass
    );


  return `

    <div class="detail-row">


      <div class="detail-icon">

        ${icon}

      </div>


      <div class="detail-label">

        ${label}

      </div>


      <div
        class="date-badge ${cls}"
      >

        ${escapeHtml(
          displayValue
        )}

      </div>


    </div>

  `;

}

/* =========================================================
   EDIT VEHICLE
========================================================= */

function editVehicle(id){

  localStorage.setItem(
    "editVehicleId",
    id
  );


  window.location.href =
    "upload.html";

}



/* =========================================================
   DELETE VEHICLE
========================================================= */

async function deleteVehicle(id){

  const vehicle =
    allVehicles.find(
      item =>
        String(item.id)
        ===
        String(id)
    );


  if(!vehicle){

    return;

  }


  const vehicleNumber =
    vehicle.vehicle_number ||
    "this vehicle";


  const confirmed =
    confirm(
      "Delete vehicle " +
      vehicleNumber +
      "?"
    );


  if(!confirmed){

    return;

  }


  try{


    /*
      Delete photo
    */

    if(vehicle.photo_path){

      const {
        error:photoError
      } =
      await supabaseClient
        .storage
        .from("vehicle-photos")
        .remove([
          vehicle.photo_path
        ]);


      if(photoError){

        console.warn(
          "Photo delete error:",
          photoError
        );

      }

    }


    /*
      Delete database record
    */

    const {
      error
    } =
    await supabaseClient
      .from("vehicles")
      .delete()
      .eq(
        "id",
        id
      );


    if(error){

      throw error;

    }


    showToast(
      "Vehicle deleted successfully."
    );


    await loadVehicles();


  }catch(error){

    console.error(
      error
    );


    alert(
      "Delete Error:\n" +
      (
        error.message ||
        error
      )
    );

  }

}



/* =========================================================
   WHATSAPP
========================================================= */

function whatsappReminder(id){

  const vehicle =
    allVehicles.find(
      item =>
        String(item.id)
        ===
        String(id)
    );


  if(!vehicle){

    return;

  }


  /*
    Actual scheduled WhatsApp reminder
    will be connected later.

    For now, if mobile number exists,
    open WhatsApp chat.
  */

  const mobile =
    String(
      vehicle.mobile || ""
    )
    .replace(
      /\D/g,
      ""
    );


  if(!mobile){

    showToast(
      "Mobile number is not available."
    );

    return;

  }


  let phone =
    mobile;


  /*
    India number:
    10 digits -> +91
  */

  if(
    phone.length === 10
  ){

    phone =
      "91" +
      phone;

  }


  const message =
    "RV Vehicle Reminder\n\n" +

    "Vehicle: " +
    (
      vehicle.vehicle_number ||
      ""
    ) +

    "\n\n" +

    "Insurance: " +
    formatDate(
      vehicle.insurance_expiry
    ) +

    "\n" +

    "PUCC: " +
    formatDate(
      vehicle.pucc_expiry
    ) +

    "\n" +

    "Fitness: " +
    formatDate(
      vehicle.fitness_expiry
    ) +

    "\n" +

    "Tax: " +
    formatDate(
      vehicle.tax_expiry
    ) +

    "\n" +

    "Permit: " +
    formatDate(
      vehicle.permit_expiry
    );


  const url =
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(
      message
    );


  window.open(
    url,
    "_blank"
  );

}



/* =========================================================
   PAGINATION
========================================================= */

function updatePagination(
  totalPages
){

  if(!totalPages){

    totalPages = 1;

  }


  pageInfo.textContent =
    "Page " +
    currentPage +
    " of " +
    totalPages;


  prevBtn.disabled =
    currentPage <= 1;


  nextBtn.disabled =
    currentPage >= totalPages;

}



/* =========================================================
   PREVIOUS
========================================================= */

function previousPage(){

  if(
    currentPage <= 1
  ){

    return;

  }


  currentPage--;

  renderVehicles();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}



/* =========================================================
   NEXT
========================================================= */

function nextPage(){

  const totalPages =
    Math.ceil(
      filteredVehicles.length /
      recordsPerPage
    );


  if(
    currentPage >= totalPages
  ){

    return;

  }


  currentPage++;

  renderVehicles();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}



/* =========================================================
   GO UPLOAD
========================================================= */

function goUpload(){

  localStorage.removeItem(
    "editVehicleId"
  );


  window.location.href =
    "upload.html";

}



/* =========================================================
   REFRESH
========================================================= */

async function refreshVehicles(){

  await loadVehicles();

}



/* =========================================================
   TOAST
========================================================= */

function showToast(
  message
){

  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  setTimeout(
    function(){

      toast.classList.remove(
        "show"
      );

    },
    2500
  );

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}



/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttribute(
  value
){

  return escapeHtml(
    value
  );

}
